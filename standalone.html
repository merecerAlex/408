进程将 S.value 加 1……若加 1 后 \u003cstrong\u003eS.value ≤ 0\u003c/strong\u003e，则说明仍有进程在等待该类资源，此时应调用 \u003cstrong\u003ewakeup 原语\u003c/strong\u003e，从 S.L 中移出一个进程并将其唤醒。」\u003c/blockquote\u003e\u003cblockquote\u003e注意原文的\u003cstrong\u003e不等号严格是一边 \u003ccode\u003e&lt;\u003c/code\u003e 一边 \u003ccode\u003e≤\u003c/code\u003e\u003c/strong\u003e：wait 里是 \u003ccode\u003e&lt; 0\u003c/code\u003e，signal 里是 \u003ccode\u003e≤ 0\u003c/code\u003e。写成 \u003ccode\u003e≤0\u003c/code\u003e / \u003ccode\u003e&lt;0\u003c/code\u003e 都算错——选择题专门在这里挖坑。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.1 PV 操作的完整语义\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e整型信号量\u003c/strong\u003e（\u003ccode\u003ewhile(S&lt;=0); S=S-1;\u003c/code\u003e）—— \u003cstrong\u003e不满足让权等待\u003c/strong\u003e（忙等）。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e记录型信号量\u003c/strong\u003e（408 标准写法，\u003cstrong\u003e必须掌握\u003c/strong\u003e）：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003etypedef struct {\n    int value;            // 资源数目\n    struct process *L;    // 等待队列\n} semaphore;\n\nvoid wait(semaphore S) {   // 即 P(S)、P 操作\n    S.value--;\n    if (S.value &lt; 0)\n        block(S.L);        // 资源不够，自我阻塞，进等待队列\n}\n\nvoid signal(semaphore S) { // 即 V(S)、V 操作\n    S.value++;\n    if (S.value &lt;= 0)\n        wakeup(S.L);       // 仍有等待者，唤醒其中一个\n}\u003c/code\u003e\u003c/pre\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.2 \u003ccode\u003evalue\u003c/code\u003e 的取值含义（\u003cstrong\u003e选择题高频\u003c/strong\u003e）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003e&gt; 0\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e尚可用资源数为 \u003ccode\u003evalue\u003c/code\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003e= 0\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e资源恰好用完，\u003cstrong\u003e无等待进程\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003e&lt; 0\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e无可用资源，且有 `\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003evalue\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e` 个进程在等待\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e判断题陷阱\u003c/strong\u003e：「\u003ccode\u003eS.value = -2\u003c/code\u003e 表示还有 2 个空闲资源」→ \u003cstrong\u003e错\u003c/strong\u003e，表示\u003cstrong\u003e2 个进程在等待\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.3 互斥量 vs 同步量 —— 一句话分清\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e初值\u003c/th\u003e\u003cth\u003eP/V 位置\u003c/th\u003e\u003cth\u003e作用\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"类型\"\u003e\u003cstrong\u003e互斥量 mutex\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"初值\"\u003e\u003cstrong\u003e1\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"P/V 位置\"\u003eP、V \u003cstrong\u003e必须在同一进程内成对\u003c/strong\u003e出现，夹住临界区\u003c/td\u003e\u003ctd data-label=\"作用\"\u003e保证互斥\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e原文核对（印刷页 105 / PDF p117）\u003c/strong\u003e：「为使多个进程能够互斥地访问某一临界资源，可为该资源设置一个互斥信号量 S，其初值设为 \u003cstrong\u003e1\u003c/strong\u003e（表示该资源的可用数量为 1）。随后，将各进程中访问该资源的\u003cstrong\u003e临界区置于 P(S) 与 V(S) 操作之间\u003c/strong\u003e。」——与上表完全一致。\u003c/blockquote\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003cstrong\u003e同步量（前驱）\u003c/strong\u003e\u003c/th\u003e\u003cth\u003e\u003cstrong\u003e0\u003c/strong\u003e\u003c/th\u003e\u003cth\u003eP 在\u003cstrong\u003e后继\u003c/strong\u003e操作前，V 在\u003cstrong\u003e前驱\u003c/strong\u003e操作后\u003c/th\u003e\u003cth\u003e保证先后次序\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e必备口诀\u003c/strong\u003e：\u003cstrong\u003e「P 遇 V 而等」\u003c/strong\u003e——同步量的 P 等的是另一个进程的 V；互斥量的 P/V 是同一个进程的「进—出」。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.4 第一步永远先问三个问题（PV 建模三步法）\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e谁是临界资源？\u003c/strong\u003e → 有几个，确定互斥量个数（\u003cstrong\u003e通常只用一个 mutex\u003c/strong\u003e，不要为每个资源都加锁）。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e谁是前驱-后继对？\u003c/strong\u003e → 每对设一个同步量，\u003cstrong\u003e初值 0\u003c/strong\u003e，V 在前驱、P 在后继。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e有多少个可用资源/缓冲区？\u003c/strong\u003e → 设容量信号量，\u003cstrong\u003e初值为容量\u003c/strong\u003e。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 经典同步问题（2.3.5 · 印刷页 107 / PDF p119）","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 生产者-消费者问题\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e设定\u003c/strong\u003e：缓冲区大小 n，生产者和消费者并发。\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore mutex = 1;      // 互斥访问缓冲区\nsemaphore empty = n;      // 空缓冲区数\nsemaphore full  = 0;      // 满缓冲区数\n\nproducer() {\n    while (1) {\n        produce(item);\n        P(empty);         // ① 先申请空位\n        P(mutex);         // ② 再进临界区\n        put(item);\n        V(mutex);         // ③ 出临界区\n        V(full);          // ④ 通知消费者\n    }\n}\n\nconsumer() {\n    while (1) {\n        P(full);          // ① 先申请数据\n        P(mutex);         // ② 进临界区\n        get(item);\n        V(mutex);         // ③\n        V(empty);         // ④\n        consume(item);\n    }\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e★ 易错点 1：P(empty)/P(full) 与 P(mutex) 的顺序能不能换？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e不能\u003c/strong\u003e。若写成 \u003ccode\u003eP(mutex); P(empty);\u003c/code\u003e，当缓冲区满时生产者持锁等待空位，消费者又因拿不到 mutex 而无法消费 → \u003cstrong\u003e死锁\u003c/strong\u003e。（这正是王道反复强调的「死锁「）\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e★ 易错点 2：V 操作能也随便换顺序吗？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003eV 操作顺序可换，P 操作顺序不可换\u003c/strong\u003e。原因：V 只增不减，不会引起阻塞等待链。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e★ 易错点 3：只有一个生产者且只有一个消费者时，mutex 能不能省？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e能省\u003c/strong\u003e（仅当缓冲区不会被并发修改时）；但题目只要出现「多个生产者」或「多个消费者」，\u003cstrong\u003e必须加 mutex\u003c/strong\u003e。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 读者-写者问题\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e读优先\u003c/strong\u003e（读者优先，可能\u003cstrong\u003e饿死写者\u003c/strong\u003e）：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore rw = 1;     // 文件互斥量\nsemaphore mutex = 1;  // 保护 count\nint count = 0;        // 读者数\n\nreader() {\n    P(mutex);\n    if (count == 0) P(rw);   // 第一个读者上锁\n    count++;\n    V(mutex);\n    read();\n    P(mutex);\n    count--;\n    if (count == 0) V(rw);   // 最后一个读者解锁\n    V(mutex);\n}\n\nwriter() {\n    P(rw);\n    write();\n    V(rw);\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e写优先\u003c/strong\u003e（加一个 \u003ccode\u003ew\u003c/code\u003e 信号量挡住后来的读者，\u003cstrong\u003e可能饿死读者\u003c/strong\u003e）：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore w = 1;      // 新增：读者来时要先看 w\nreader() {\n    P(w);  P(mutex);\n    if (count == 0) P(rw);\n    count++;\n    V(mutex); V(w);\n    read();\n    P(mutex); count--;\n    if (count == 0) V(rw);\n    V(mutex);\n}\nwriter() {\n    P(w);\n    P(rw); write(); V(rw);\n    V(w);\n}\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e读优先\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e读者源源不断时写者永远等\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e饿死写者\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e写优先（\u003ccode\u003ew\u003c/code\u003e 信号量）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e写者一到，后来的读者全部排队\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e饿死读者\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e易错点\u003c/strong\u003e：\u003ccode\u003ecount\u003c/code\u003e 必须用 \u003ccode\u003emutex\u003c/code\u003e 保护，否则多个读者同时判断「我是第一个」会重复 \u003ccode\u003eP(rw)\u003c/code\u003e —— 从而第二个 \u003ccode\u003eP(rw)\u003c/code\u003e 永久阻塞。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.3 哲学家进餐问题（\u003cstrong\u003e死锁经典\u003c/strong\u003e）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e问题\u003c/strong\u003e：5 位哲学家围桌，每人左右各一根筷子，需\u003cstrong\u003e同时\u003c/strong\u003e拿到两根才能进餐。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e朴素解法（会死锁）\u003c/strong\u003e：每人先拿左筷子再拿右筷子 → 5 人同时拿左筷 → \u003cstrong\u003e循环等待 → 死锁\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e三种无死锁解法\u003c/strong\u003e（考点是「\u003cstrong\u003e为什么能避免\u003c/strong\u003e」）：\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e① 至多 4 人同时取筷\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e加信号量 \u003ccode\u003eS=4\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e破坏\u003cstrong\u003e循环等待\u003c/strong\u003e（不够每人一根左筷）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e② 成对取筷（奇偶法）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e奇数号先左后右，偶数号先右后左\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e破坏\u003cstrong\u003e循环等待\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e③ 同时拿两根（And 型）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e用 mutex 包住「拿左+拿右」，一次取到\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e破坏\u003cstrong\u003e请求并保持\u003c/strong\u003e（不可分步）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e这三种解法用一句话概括：\u003cstrong\u003e只要打破「每人持有一个、再等另一个」的结构，就不会死锁\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.4 理发师问题（模型变体）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e设定\u003c/strong\u003e：1 位理发师、n 把椅子、顾客来了没座就走。\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore customers = 0;  // 等待的顾客\nsemaphore barbers   = 0;  // 空闲理发师\nsemaphore mutex     = 1;  // 保护 waiting\nint waiting = 0;\n\nbarber() {\n    while (1) {\n        P(customers);        // 有顾客吗？没有就睡\n        P(mutex); waiting--; V(mutex);\n        V(barbers);          // 通知顾客可以剪了\n        cut_hair();\n    }\n}\ncustomer() {\n    P(mutex);\n    if (waiting &lt; n) { waiting++; V(customers); V(mutex); P(barbers); get_haircut(); }\n    else V(mutex);           // 没座位，走\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e易错点\u003c/strong\u003e：\u003ccode\u003ewaiting\u003c/code\u003e 的判断与自增必须在同一临界区内（否则可能超员）。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.5 ★ 真题深挖：2024 年 408 第 46 题（临界区判定 + 最小信号量）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干要点\u003c/strong\u003e（据 PDF 原文核对，OCR 有破损，语义据上下文还原）：\u003c/p\u003e\u003cp\u003e缓冲 B 存一数据，C1 将一数据\u003cstrong\u003e写入\u003c/strong\u003e B，C2 从 B 中\u003cstrong\u003e读\u003c/strong\u003e一数据，C3 对 B \u003cstrong\u003e修改\u003c/strong\u003e；\u003cstrong\u003eB 为空时才能执行 C1，B 非空时才能执行 C2 和 C3\u003c/strong\u003e。三问：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e（1）设进程 P1、P2 执行 C1，实现 C1 的代码是否为临界区？为什么？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e是\u003c/strong\u003e。C1 访问的缓冲 B 是\u003cstrong\u003e临界资源\u003c/strong\u003e（同一时刻只允许一个进程写，否则数据被覆盖），C1 中访问 B 的那段代码就是临界区。\u003cstrong\u003e判定口诀\u003c/strong\u003e：问「这段代码是否访问共享且不可并发访问的资源」，是则是临界区。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e（2）B 为空，P1 执行 C1 一次，P2 执行 C2，用尽可能少的信号量描述同步互斥关系：\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ 最少 \u003cstrong\u003e2 个\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore empty = 1;   // B 是否为空（初值 1 = 确实为空）\nsemaphore full  = 0;   // B 是否非空（初值 0）\n\n// P1 执行 C1\nP(empty); C1（写 B）; V(full);\n\n// P2 执行 C2\nP(full); C2（读 B）; V(empty);\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e为什么不用 mutex？\u003c/strong\u003e 因为 C1 与 C2 之间是\u003cstrong\u003e纯粹的先后同步\u003c/strong\u003e（B 空→写→读），而 \u003ccode\u003eempty\u003c/code\u003e/\u003ccode\u003efull\u003c/code\u003e 本身就是互斥的：\u003ccode\u003eempty\u003c/code\u003e 只有一个 token，同一时刻只允许一个进程持有它，天然排他。\u003cstrong\u003e「同步量兼做互斥量」是本题的关键得分点。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e（3）B 不为空，P1、P2 各执行 C3 一次（修改 B），最少的信号量与互斥关系：\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ 最少 \u003cstrong\u003e1 个\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore mutex = 1;\n\n// P1\nP(mutex); C3; V(mutex);\n// P2\nP(mutex); C3; V(mutex);\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e为什么只要 1 个？\u003c/strong\u003e C3 与 C3 之间\u003cstrong\u003e没有先后顺序要求\u003c/strong\u003e（各改一次即可），只要求\u003cstrong\u003e不并发\u003c/strong\u003e——这是纯互斥，一个 \u003ccode\u003emutex\u003c/code\u003e 足够。若误加同步量，属于「多用了信号量」，直接扣分。\u003c/p\u003e\u003cblockquote\u003e\u003cstrong\u003e本题的命题逻辑\u003c/strong\u003e：「尽可能少的信号量」+「为什么要这些」= 区分「同步 + 互斥」与「纯互斥」的能力。\u003cstrong\u003e先问有没有先后次序，再问要不要排他\u003c/strong\u003e，两步定数量。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.6 ★ 真题深挖：2022 年 408 第 46 题（双线程前驱关系）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干要点\u003c/strong\u003e：T1 执行 A、E、F，T2 执行 B、C、D；约束为 \u003cstrong\u003eC 在 A 和 B 完成后执行，D 和 E 在 C 完成后执行，F 在 E 完成后执行\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e答案思路\u003c/strong\u003e：把约束逐条转成信号量（\u003cstrong\u003e每条约束一个信号量，初值 0\u003c/strong\u003e）：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003esemaphore SAC = 0;   // A 完成 → C 可执行\nsemaphore SBC = 0;   // B 完成 → C 可执行\nsemaphore SCD = 0;   // C 完成 → D 可执行\nsemaphore SCE = 0;   // C 完成 → E 可执行\nsemaphore SEF = 0;   // E 完成 → F 可执行\n\nT1() {\n    A;  V(SAC);\n    P(SCE); E;  V(SEF);\n    P(SEF); F;\n}\nT2() {\n    B;  V(SBC);\n    P(SAC); P(SBC); C;  V(SCD); V(SCE);\n    P(SCD); D;\n}\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e三个打分点\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e每个信号量初值 0\u003c/strong\u003e（纯前驱关系、无资源计数）—— 写错初值不给分。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eV 紧跟在前驱操作之后，P 紧贴在后继操作之前\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003eC 有\u003cstrong\u003e两个\u003c/strong\u003e前驱（A、B），所以 C 前要 \u003cstrong\u003eP 两次\u003c/strong\u003e（两个不同的信号量）。\u003c/li\u003e\u003c/ol\u003e\u003cblockquote\u003e同型题：\u003cstrong\u003e2020 年 408 第 45 题\u003c/strong\u003e（A、B→C→E，7 分）—— 只需 3 个信号量：\u003ccode\u003eSAC=0、SBC=0、SCE=0\u003c/code\u003e，C 前 \u003ccode\u003eP(SAC); P(SBC);\u003c/code\u003e，E 前 \u003ccode\u003eP(SCE);\u003c/code\u003e。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. 管程（2.3.6 · 印刷页 112 / PDF p124）","html":"\u003ch4 class=\"cardsec__sub\"\u003e5.1 管程的组成\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e局部于管程的共享数据结构\u003c/strong\u003e（如缓冲区队列）\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e对数据结构操作的一组过程（函数）\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e对局部数据结构设置初值的语句\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e管程\u003cstrong\u003e入口\u003c/strong\u003e：保证\u003cstrong\u003e每次仅一个进程在管程内\u003c/strong\u003e（由编译器/内核自动互斥）\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e\u003cstrong\u003e管程 = 把「共享数据 + 操作 + 互斥」打包成一个整体\u003c/strong\u003e，用语言机制自动加锁，避免程序员手写 P/V 出错。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.2 ★ 条件变量 vs 信号量（\u003cstrong\u003e高频选择题\u003c/strong\u003e）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e有无计数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e有\u003c/strong\u003e（value）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e无\u003c/strong\u003e，只是一个等待队列\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003ewait\u003c/code\u003e 的作用\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e计数减一，可能阻塞\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e释放管程锁并阻塞\u003c/strong\u003e，必须等到被 signal\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003esignal\u003c/code\u003e 的作用\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e计数加一，可能唤醒\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e只在有人等待时唤醒\u003c/strong\u003e；\u003cstrong\u003e无人等待时什么都不做\u003c/strong\u003e（与信号量 V \u003cstrong\u003e不同\u003c/strong\u003e！）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e是否计状态\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e会（value 保存剩余量）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e不保存\u003c/strong\u003e，signal 过一次就丢了\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003ewait\u003c/code\u003e 之后是否必须 \u003ccode\u003esignal\u003c/code\u003e 配对\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e一般要\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e不必配对\u003c/strong\u003e（无计数的直接后果）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e最易错\u003c/strong\u003e：信号量 \u003ccode\u003eV(S)\u003c/code\u003e 即使无人等待也会 \u003ccode\u003eS.value++\u003c/code\u003e；\u003cstrong\u003e条件变量 \u003ccode\u003esignal\u003c/code\u003e 无人等待时是空操作\u003c/strong\u003e —— 这一次「通知」被彻底丢弃。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.3 Hoare 与 Mesa 语义\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eHoare\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e被唤醒者\u003cstrong\u003e立即\u003c/strong\u003e执行，发 signal 者让道\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e保证「signal 后条件一定成立」，实现成本高\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eMesa\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发 signal 者继续跑完，被唤醒者\u003cstrong\u003e重新排队\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e需「\u003cstrong\u003ewhile 重检条件\u003c/strong\u003e」，实际系统常用\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e易错点\u003c/strong\u003e：Mesa 语义下条件变量必须写成 \u003ccode\u003ewhile(条件不满足) wait(c);\u003c/code\u003e 而不是 \u003ccode\u003eif(...)\u003c/code\u003e，因为被唤醒后条件可能已被别人改掉（\u003cstrong\u003e虚假唤醒\u003c/strong\u003e）。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. 本节速查（考前 3 分钟）","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eP/V 铁律\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eP 先减后判、V 先加后判\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003evalue 含义\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e正=剩余资源；负值绝对值=等待者数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e四准则\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e空闲让进·忙则等待·有限等待·让权等待\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e软件方法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e全不满足让权等待；双标志后检查还会饿死\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e硬件方法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e中断屏蔽不满足有限等待；TS/Swap 不满足让权等待\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e生产者-消费者\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eP(empty)/P(full) \u003cstrong\u003e必须\u003c/strong\u003e在 P(mutex) 之前\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e读者-写者\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e读优先饿写者；写优先饿读者\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e哲学家\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e循环等待 → 用奇偶法/成对取筷/限 4 人破之\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e管程\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e条件变量无计数，signal 无人等 = 空操作\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e建模三步\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e找临界资源→找前驱后继→找资源数\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 待校对清单","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e1\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e四准则原文编号顺序\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ \u003cstrong\u003e已实测定稿\u003c/strong\u003e：王道2027版 \u003cstrong\u003e印刷页 100（PDF p112）\u003c/strong\u003e，原文顺序为 空闲让进 / 忙则等待 / 有限等待 / \u003cstrong\u003e让权等待（原则上应该遵循，但非必须）\u003c/strong\u003e。2020 第 32 题答案 C 与原文严丝合缝\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e2\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2.3.4 信号量、记录型信号量代码\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ \u003cstrong\u003e已实测\u003c/strong\u003e：\u003cstrong\u003e印刷页 104–105（PDF p116–117）\u003c/strong\u003e，\u003ccode\u003ewait\u003c/code\u003e 中 \u003ccode\u003e&lt; 0\u003c/code\u003e、\u003ccode\u003esignal\u003c/code\u003e 中 \u003ccode\u003e≤ 0\u003c/code\u003e 的不等号已逐字核对\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e3\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e软件/硬件方法代码原文（单标志/双标志/Peterson，印刷页 100–103 / PDF p112–115）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e待校对\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e4\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e生产者-消费者、读者-写者、哲学家、理发师教材原版代码（印刷页 107–111 / PDF p119–123）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e待校对\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e5\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2024 年第 46 题 OCR 原文有破损（「C2 找从 B 中读」等），题干语义据上下文还原\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e待原图核对\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e6\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2009–2019 年真题中涉及 PV 的题号（扫描件无文字层）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e待 \u003ccode\u003e_exam.json\u003c/code\u003e 生成\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e\u003cp\u003e\u003cem\u003e本文件路径：\u003ccode\u003eD:\\agent\\os\\os-考点卡-2.3-同步与互斥.md\u003c/code\u003e · 只覆盖操作系统一科 · 产出由小狐仙归档入 D:\\MEMORY\u003c/em\u003e\u003c/p\u003e"}]},{"id":"doc-2","title":"2.4 死锁（四必要条件 · 银行家算法 · 重点）","sections":[{"id":"sec-1","section":"0. 结论先行（考场三句话）","html":"\u003cblockquote\u003e\u003cstrong\u003e适用\u003c/strong\u003e：408 操作系统 · 王道 2027 版 第 2 章 2.4 节，印刷页 149–174（PDF p161–186）\u003cbr\u003e\u003cstrong\u003e出处口径\u003c/strong\u003e：\u003ccode\u003e王道2027版 印刷页 N（PDF pM）\u003c/code\u003e；真题写 \u003ccode\u003e20XX 年 408 第 X 题\u003c/code\u003e\u003cbr\u003e\u003cstrong\u003e状态\u003c/strong\u003e：结构完整；两处真题数据表按题干语义重构，\u003cstrong\u003e数字待原图核对\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003e制卡\u003c/strong\u003e：操作系统助手 · 2026-10-20\u003c/blockquote\u003e\u003chr\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e死锁四个必要条件\u003c/strong\u003e：互斥、请求并保持（占有且等待）、不可剥夺、循环等待。\u003cstrong\u003e缺一不可，但都满足也未必死锁\u003c/strong\u003e（多资源实例时）。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e安全状态 ⇒ 一定无死锁；不安全状态 ⇏ 一定死锁\u003c/strong\u003e（只是「可能」）。银行家算法的本质是\u003cstrong\u003e始终让系统停留在安全状态\u003c/strong\u003e，属于\u003cstrong\u003e死锁避免\u003c/strong\u003e，不是死锁检测。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e银行家算法只有两个算法\u003c/strong\u003e：\u003cstrong\u003e安全性算法\u003c/strong\u003e（判断当前是否安全、给出安全序列）+ \u003cstrong\u003e请求算法\u003c/strong\u003e（试分配 → 跑安全性算法 → 不安全则回滚）。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 死锁的概念（2.4.1 · 印刷页 150 / PDF p162）","html":"\u003ch4 class=\"cardsec__sub\"\u003e1.1 死锁 vs 饥饿 vs 活锁（\u003cstrong\u003e高频辨析\u003c/strong\u003e）\u003c/h4\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e原文出处（已实测核对）\u003c/strong\u003e：\u003cstrong\u003e印刷页 150（PDF p162）\u003c/strong\u003e「2.4.1 死锁的概念」，含「1. 死锁的定义」与「2. 死锁与饥饿」两小节。\u003cbr\u003e原文定义\u003cstrong\u003e已逐字核对\u003c/strong\u003e：「……每个进程都在等待其他进程所占有的资源，而这些资源又不会被释放，从而形成一个\u003cstrong\u003e循环等待链\u003c/strong\u003e。\u003cstrong\u003e结果，所有涉及的进程都被永久阻塞；若无外部干预，它们将无法继续推进。\u003c/strong\u003e」\u003cbr\u003e原文对\u003cstrong\u003e饥饿\u003c/strong\u003e的界定：「指某个进程因\u003cstrong\u003e资源分配策略的不公平性\u003c/strong\u003e，\u003cstrong\u003e长期得不到\u003c/strong\u003e所需资源，从而无法推进其执行。产生饥饿的主要原因是：当多个进程同时竞争……（该页截断，续下页）」\u003c/blockquote\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e概念\u003c/th\u003e\u003cth\u003e定义\u003c/th\u003e\u003cth\u003e是否需循环等待\u003c/th\u003e\u003cth\u003e典型场景\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"概念\"\u003e\u003cstrong\u003e死锁\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"定义\"\u003e多个进程因\u003cstrong\u003e竞争资源\u003c/strong\u003e而形成\u003cstrong\u003e互相等待\u003c/strong\u003e，若无外力介入\u003cstrong\u003e永远无法推进\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"是否需循环等待\"\u003e\u003cstrong\u003e需要\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"典型场景\"\u003e5 人拿左筷再等右筷\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"概念\"\u003e\u003cstrong\u003e饥饿\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"定义\"\u003e进程\u003cstrong\u003e长期得不到\u003c/strong\u003e所需资源（非永久），系统仍在运行\u003c/td\u003e\u003ctd data-label=\"是否需循环等待\"\u003e\u003cstrong\u003e不需要\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"典型场景\"\u003eSJF 下长作业永远被短作业挤后\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"概念\"\u003e\u003cstrong\u003e活锁\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"定义\"\u003e进程\u003cstrong\u003e未阻塞\u003c/strong\u003e、一直在执行，但因\u003cstrong\u003e相互谦让\u003c/strong\u003e反复重试而无法推进\u003c/td\u003e\u003ctd data-label=\"是否需循环等待\"\u003e不需要\u003c/td\u003e\u003ctd data-label=\"典型场景\"\u003e两个进程同时 \u003ccode\u003eflag=true\u003c/code\u003e 后都退让\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e一句话分清\u003c/strong\u003e：\u003cstrong\u003e死锁是「都不动」；饥饿是「你一直不被选」；活锁是「都在动但白动」。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.2 ★ 四个必要条件（必背原文口径）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003e条件\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e对应预防手段（破坏它）\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"#\"\u003e1\u003c/td\u003e\u003ctd data-label=\"条件\"\u003e\u003cstrong\u003e互斥条件\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"含义\"\u003e资源一次只能被一个进程使用\u003c/td\u003e\u003ctd data-label=\"对应预防手段（破坏它）\"\u003e资源可共享则无需互斥（多数资源无法改造，\u003cstrong\u003e一般不破坏\u003c/strong\u003e）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"#\"\u003e2\u003c/td\u003e\u003ctd data-label=\"条件\"\u003e\u003cstrong\u003e请求并保持条件\u003c/strong\u003e（占有且等待）\u003c/td\u003e\u003ctd data-label=\"含义\"\u003e持有至少一个资源，又请求新资源\u003c/td\u003e\u003ctd data-label=\"对应预防手段（破坏它）\"\u003e\u003cstrong\u003e一次性全部分配\u003c/strong\u003e（请求前释放手中资源）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"#\"\u003e3\u003c/td\u003e\u003ctd data-label=\"条件\"\u003e\u003cstrong\u003e不可剥夺条件\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"含义\"\u003e资源只能由持有者主动释放\u003c/td\u003e\u003ctd data-label=\"对应预防手段（破坏它）\"\u003e\u003cstrong\u003e允许剥夺\u003c/strong\u003e（申请不到就释放已有）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"#\"\u003e4\u003c/td\u003e\u003ctd data-label=\"条件\"\u003e\u003cstrong\u003e循环等待条件\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"含义\"\u003e存在进程-资源的循环链\u003c/td\u003e\u003ctd data-label=\"对应预防手段（破坏它）\"\u003e\u003cstrong\u003e资源有序分配法\u003c/strong\u003e（按编号递增申请）\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e⚠️ \u003cstrong\u003e关键判据\u003c/strong\u003e：四条件\u003cstrong\u003e同时成立\u003c/strong\u003e是死锁的\u003cstrong\u003e必要条件\u003c/strong\u003e，不是充分条件。只有当\u003cstrong\u003e每类资源只有一个实例\u003c/strong\u003e时，「循环等待」才等价于死锁。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.3 ★ 真题深挖：2021 年 408 第 31 题（n 进程各需 2 资源的经典公式）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干要点\u003c/strong\u003e（据 PDF 原文核对）：若系统中有 n（n≥2）个进程，每个进程均需要使用某类临界资源 2 个，则系统不会发生死锁所需的该类资源总数至少是（ ）。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e选项\u003c/strong\u003e：A. 2　B. n　C. n+1　D. 2n\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e答案：C（n+1）\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e完整推导（必须会推，考试常变体：改成「每个进程需要 k 个」）\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e最坏情况\u003c/strong\u003e：让每个进程都「差一点点」就能完成——都只拿到 \u003ccode\u003e2-1 = 1\u003c/code\u003e 个资源。\u003c/li\u003e\u003cli\u003e此时 n 个进程共占 \u003ccode\u003en × 1 = n\u003c/code\u003e 个资源，每个都在等第 2 个 → \u003cstrong\u003e全部卡住\u003c/strong\u003e（循环等待 + 请求并保持）。\u003c/li\u003e\u003cli\u003e所以「有 n 个资源」\u003cstrong\u003e仍可能死锁\u003c/strong\u003e（判为不满足）。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e只要再多 1 个资源\u003c/strong\u003e（总共 \u003ccode\u003en + 1\u003c/code\u003e 个），就必有某一个进程能凑齐 2 个 → 它跑完并\u003cstrong\u003e释放全部 2 个\u003c/strong\u003e → 其余进程依次推进 → \u003cstrong\u003e必不死锁\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e因此最小资源数 = \u003cstrong\u003en + 1\u003c/strong\u003e。\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e为什么其他选项错：\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eA（2）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e只有 2 个资源，2 个进程各占 1 个就死锁了，远不够\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eB（n）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003en 个资源时最坏情况是「每人 1 个」，恰好卡死\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eC（n+1）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e最坏情况多出 1 个资源就能破局\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eD（2n）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e够用，但\u003cstrong\u003e不是「至少」\u003c/strong\u003e；问「至少」必须取最小可行值\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e推广公式（记下来直接套）\u003c/strong\u003e：\u003cstrong\u003em 个进程，每个需要 k 个同类资源，系统不死锁的最少资源数 = m × (k − 1) + 1\u003c/strong\u003e。\u003c/p\u003e\u003cul\u003e\u003cli\u003e本例：\u003ccode\u003en × (2−1) + 1 = n + 1\u003c/code\u003e ✔\u003c/li\u003e\u003cli\u003e变体：5 个进程各需 3 个资源 → \u003ccode\u003e5 × 2 + 1 = 11\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e教材原文公式（已实测核对）\u003c/strong\u003e：\u003cstrong\u003e印刷页 172（PDF p184）\u003c/strong\u003e 的习题解析给出了 408 的\u003cstrong\u003e标准死锁公式\u003c/strong\u003e，逐字为：\u003cbr\u003e「根据死锁公式 \u003cstrong\u003em &gt; n(r−1)\u003c/strong\u003e，其中 \u003cstrong\u003em\u003c/strong\u003e 是系统中临界资源的总数，\u003cstrong\u003en\u003c/strong\u003e 是并发进程的个数，\u003cstrong\u003er\u003c/strong\u003e 是每个进程所需临界资源的个数。\u003cstrong\u003e若这个不等式成立，则系统不发生死锁。\u003c/strong\u003e」\u003cbr\u003e代入本题（r = 2）得 \u003ccode\u003em &gt; n(2−1)\u003c/code\u003e，即 \u003ccode\u003em ≥ n + 1\u003c/code\u003e，\u003cstrong\u003e与本卡推导完全一致\u003c/strong\u003e。\u003cbr\u003e\u003cbr\u003e⚠️ \u003cstrong\u003e考场提醒\u003c/strong\u003e：教材是\u003cstrong\u003e严格大于号 \u003ccode\u003em &gt; n(r−1)\u003c/code\u003e\u003c/strong\u003e（因为要取整数，等价于 \u003ccode\u003em ≥ n(r−1)+1\u003c/code\u003e）。如果题目问「最少」，答案写 \u003ccode\u003en(r−1)+1\u003c/code\u003e；如果写成 \u003ccode\u003em ≥ n(r−1)\u003c/code\u003e 会\u003cstrong\u003e少 1 个\u003c/strong\u003e而失分——这是本公式最常见的错法。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 资源分配图与化简（2.4.4 · 印刷页 157 / PDF p169）","html":"\u003ch4 class=\"cardsec__sub\"\u003e2.1 图形要素\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e进程\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e圆圈 ○\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003ePi\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e资源类\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e方框 □\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e内含\u003cstrong\u003e资源实例个数\u003c/strong\u003e的小圆点\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e申请边\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003ePi → Rj\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e进程 Pi 请求一个 Rj 实例（\u003cstrong\u003e实线有向\u003c/strong\u003e）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e分配边\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eRj 的小圆点 → Pi\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e一个 Rj 实例已分配给 Pi\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.2 化简判据（\u003cstrong\u003e考试标准做法\u003c/strong\u003e）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e化简步骤\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e找一个\u003cstrong\u003e既非阻塞、又有可用资源\u003c/strong\u003e的进程 Pi（它申请的边都能满足）；\u003c/li\u003e\u003cli\u003e假设 Pi 能顺利执行到完成，\u003cstrong\u003e消去 Pi 的所有边\u003c/strong\u003e（把它占的资源还回去）；\u003c/li\u003e\u003cli\u003e重复 1、2，直到\u003cstrong\u003e不能继续化简\u003c/strong\u003e为止。\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e判据\u003c/strong\u003e：\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e能完全化简\u003c/strong\u003e（所有进程的边都被消去）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e一定无死锁\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e不能完全化简\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e可能\u003c/strong\u003e有死锁；若每类资源只有 1 个实例，则\u003cstrong\u003e一定有死锁\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e易错点\u003c/strong\u003e：多实例资源时，「不能化简」\u003cstrong\u003e不等于\u003c/strong\u003e「一定死锁」（可能只是死锁检测算法还没找到出路），此时应改用\u003cstrong\u003e安全序列\u003c/strong\u003e判断。只有单实例资源时，「图中存在环」⇔「死锁」。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.3 什么情况下一定有死锁（速答模板）\u003c/h4\u003e\u003col\u003e\u003cli\u003e每类资源\u003cstrong\u003e只有一个实例\u003c/strong\u003e 且 资源分配图\u003cstrong\u003e含环\u003c/strong\u003e；\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e每类资源有多个实例\u003c/strong\u003e 且 在\u003cstrong\u003e某时刻每个进程都持有 1 个\u003c/strong\u003e、都在等第 2 个 → 参见 1.3。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 安全状态与银行家算法（2.4.3 · 印刷页 153 / PDF p165）★★ 核心","html":"\u003ch4 class=\"cardsec__sub\"\u003e3.1 概念\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e安全状态\u003c/strong\u003e：存在一个\u003cstrong\u003e安全序列\u003c/strong\u003e ⟨P1, P2, …, Pn⟩，使系统按此顺序为各进程分配资源时，\u003cstrong\u003e每个进程都能顺利获得其最大需求并完成\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e不安全状态\u003c/strong\u003e：\u003cstrong\u003e不存在\u003c/strong\u003e任何安全序列。\u003c/li\u003e\u003c/ul\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e安全状态  ⊂  不发生死锁的状态\n不安全状态 ⊃  可能死锁的状态\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e\u003cstrong\u003e反直觉但必考\u003c/strong\u003e：\u003cstrong\u003e不安全 ≠ 死锁\u003c/strong\u003e。系统可能长期停在「不安全但未死锁」的悬崖边上；银行家算法的价值是\u003cstrong\u003e永远别让它走到不安全\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.2 数据结构（\u003cstrong\u003e先建表再算，不要心算\u003c/strong\u003e）\u003c/h4\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e原文出处（已实测核对）\u003c/strong\u003e：\u003cstrong\u003e印刷页 154（PDF p166）\u003c/strong\u003e「（1）银行家算法中的数据结构」，原文明确：\u003cbr\u003e「假设系统中有 n 个进程和 m 类资源……上述三个矩阵满足如下关系：\u003cstrong\u003eNeed[i,j] = Max[i,j] − Allocation[i,j]\u003c/strong\u003e。\u003cbr\u003e\u003cstrong\u003e通常，题目会给出 Max 和 Allocation 矩阵，解题的第一步即是据此计算出 Need 矩阵。\u003c/strong\u003e」\u003cbr\u003e—— 教材自己把「先算 Need」写成了\u003cstrong\u003e解题第一步\u003c/strong\u003e，这印证了下方「必须先算 Need」的告诫不是本卡自创。\u003c/blockquote\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eAvailable\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每类资源\u003cstrong\u003e当前可用\u003c/strong\u003e数量\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e长度 = 资源类数 m\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eMax\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个进程\u003cstrong\u003e最大需求\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003en × m\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eAllocation\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个进程\u003cstrong\u003e已分配\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003en × m\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eNeed\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个进程\u003cstrong\u003e还需求\u003c/strong\u003e = \u003ccode\u003eMax − Allocation\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003en × m\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e必须先算 Need\u003c/strong\u003e，几乎每年都有人在考场上直接拿 Max 去比，全盘皆错。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.3 安全性算法（\u003cstrong\u003e标准步骤，照抄即可\u003c/strong\u003e）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e输入：Available、Allocation、Need\n输出：安全序列 or 「不安全」\n\n1. Work = Available            // 工作向量，代表\"当前还能借出多少\"\n   Finish[i] = false (i = 1..n) // 每个进程都还没跑完\n\n2. 循环查找：找一个满足 Finish[i] == false 且 Need[i] ≤ Work 的进程 Pi\n     若找到：\n         Work = Work + Allocation[i]   // 假设 Pi 跑完，归还全部资源\n         Finish[i] = true\n         把 Pi 加入安全序列尾部\n         回到第 2 步继续找\n     若找不到：\n         跳出循环\n\n3. 收尾判断：\n     若所有 Finish[i] == true  → 安全，输出安全序列\n     否则                      → 不安全\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e\u003cstrong\u003e注意\u003c/strong\u003e：第 2 步中满足条件的进程\u003cstrong\u003e可能有多个\u003c/strong\u003e，任选一个都能找到安全序列（\u003cstrong\u003e安全序列不唯一\u003c/strong\u003e，这正是 2022 Q26 考「安全序列个数」的原因）。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.4 请求算法（某进程提出新请求时）\u003c/h4\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e原文出处（已实测核对）\u003c/strong\u003e：\u003cstrong\u003e印刷页 154（PDF p166）\u003c/strong\u003e 起「（2）银行家算法」，设 \u003ccode\u003eRequest_i\u003c/code\u003e 为 Pi 的资源请求向量，\u003cbr\u003e原文步骤为：\u003cstrong\u003e① 合法性检查\u003c/strong\u003e（\u003ccode\u003eRequest_i[j] ≤ Need[i,j]\u003c/code\u003e，否则非法，因已超过预先声明的最大需求）；\u003cbr\u003e\u003cstrong\u003e② 资源可用性检查\u003c/strong\u003e（\u003ccode\u003eRequest_i[j] ≤ Available[j]\u003c/code\u003e，否则表示当前资源不足）；③ 试分配；④ 安全性检查。以下步骤与原文编号一一对应。\u003c/blockquote\u003e\u003cp\u003e设进程 Pi 请求向量 \u003cstrong\u003eRequest_i\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e1. 合法性：Request_i ≤ Need[i]     否则报错（请求超过其最大需求）\n2. 预判：  Request_i ≤ Available   否则 Pi 等待（资源不够，不算错误）\n3. 试分配（试探性修改）：\n      Available   -= Request_i\n      Allocation[i] += Request_i\n      Need[i]     -= Request_i\n4. 调用安全性算法：\n      安全   → 正式分配\n      不安全 → 回滚（恢复第 3 步的三个改动），Pi 等待\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e口诀\u003c/strong\u003e：\u003cstrong\u003e合法性 → 够不够 → 试分配 → 查安全 → 不安全就回滚\u003c/strong\u003e。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. ★ 真题演算（两步全流程）","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 2020 年 408 第 27 题（给「已分配/需求总量」，判安全序列）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干数据\u003c/strong\u003e（据 PDF 第 27 题原文抽取；\u003cstrong\u003e表格经 PDF 文本层拆列后按语义重组，数字待原图核对\u003c/strong\u003e）：\u003c/p\u003e\u003cp\u003e系统有 A、B 两类资源各 \u003cstrong\u003e6\u003c/strong\u003e 个。\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e进程\u003c/th\u003e\u003cth\u003e已分配 A\u003c/th\u003e\u003cth\u003e已分配 B\u003c/th\u003e\u003cth\u003e需求总量 A\u003c/th\u003e\u003cth\u003e需求总量 B\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP1\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e2\u003c/td\u003e\u003ctd data-label=\"已分配 B\"\u003e3\u003c/td\u003e\u003ctd data-label=\"需求总量 A\"\u003e4\u003c/td\u003e\u003ctd data-label=\"需求总量 B\"\u003e4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP2\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e2\u003c/td\u003e\u003ctd data-label=\"已分配 B\"\u003e1\u003c/td\u003e\u003ctd data-label=\"需求总量 A\"\u003e3\u003c/td\u003e\u003ctd data-label=\"需求总量 B\"\u003e1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP3\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e1\u003c/td\u003e\u003ctd data-label=\"已分配 B\"\u003e2\u003c/td\u003e\u003ctd data-label=\"需求总量 A\"\u003e3\u003c/td\u003e\u003ctd data-label=\"需求总量 B\"\u003e4\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e第一步：算 Need = Max − Allocation\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eP1\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e4 − 2 = \u003cstrong\u003e2\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e4 − 3 = \u003cstrong\u003e1\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eP2\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e3 − 2 = \u003cstrong\u003e1\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1 − 1 = \u003cstrong\u003e0\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eP3\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e3 − 1 = \u003cstrong\u003e2\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e4 − 2 = \u003cstrong\u003e2\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e第二步：算 Available = 资源总量 − 已分配总量\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA 类：\u003ccode\u003e6 − (2 + 2 + 1) = 6 − 5 = 1\u003c/code\u003e\u003c/li\u003e\u003cli\u003eB 类：\u003ccode\u003e6 − (3 + 1 + 2) = 6 − 6 = 0\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e→ \u003cstrong\u003eAvailable = (1, 0)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第三步：跑安全性算法\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e轮次\u003c/th\u003e\u003cth\u003eWork（当前可用）\u003c/th\u003e\u003cth\u003e可满足的进程\u003c/th\u003e\u003cth\u003e进程完成后 Work 变化\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"轮次\"\u003e①\u003c/td\u003e\u003ctd data-label=\"Work（当前可用）\"\u003e(1, 0)\u003c/td\u003e\u003ctd data-label=\"可满足的进程\"\u003e只有 \u003cstrong\u003eP2\u003c/strong\u003e 满足 \u003ccode\u003eNeed(1,0) ≤ (1,0)\u003c/code\u003e（P1 需 (2,1)、P3 需 (2,2) 都不够）\u003c/td\u003e\u003ctd data-label=\"进程完成后 Work 变化\"\u003eWork = (1,0) + (2,1) = \u003cstrong\u003e(3,1)\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"轮次\"\u003e②\u003c/td\u003e\u003ctd data-label=\"Work（当前可用）\"\u003e(3, 1)\u003c/td\u003e\u003ctd data-label=\"可满足的进程\"\u003eP1 需 (2,1) ✅；P3 需 (2,2) ❌（B 不够）\u003c/td\u003e\u003ctd data-label=\"进程完成后 Work 变化\"\u003eWork = (3,1) + (2,3) = \u003cstrong\u003e(5,4)\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"轮次\"\u003e③\u003c/td\u003e\u003ctd data-label=\"Work（当前可用）\"\u003e(5, 4)\u003c/td\u003e\u003ctd data-label=\"可满足的进程\"\u003eP3 需 (2,2) ✅\u003c/td\u003e\u003ctd data-label=\"进程完成后 Work 变化\"\u003eWork = (5,4) + (1,2) = (6,6)\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e结论：系统安全，安全序列为 P2 → P1 → P3（唯一）\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e为什么唯一\u003c/strong\u003e：第 ① 轮 Available=(1,0) 只有 P2 能满足（P1、P3 的 B 需求都 &gt; 0），所以 P2 \u003cstrong\u003e必须打头\u003c/strong\u003e；第 ② 轮 Work=(3,1) 时 P3 需 (2,2)，B 不够，因此 P1 必须紧跟 P2。顺序被完全锁定，\u003cstrong\u003e只有一条安全序列\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e对应选项：B（存在安全序列 P2、P1、P3）\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e为什么其他选项错：\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eA（P1、P2、P3）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e起点就错：Available=(1,0) 无法满足 P1 的 Need(2,1)\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eB（P2、P1、P3）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e与演算完全一致\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eC（P2、P3、P1）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eP2 完成后 Work=(3,1)，P3 需 (2,2) 的 B 不足，\u003cstrong\u003eP3 抢先会卡住\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eD（不存在安全序列）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e已实际构造出安全序列，系统处于安全状态\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e⚠️ \u003cstrong\u003e待校对\u003c/strong\u003e：选项字母与表格数字均来自 PDF 文本层（表格被拆成单列、表头与数字错位），本卡按语义重组。\u003cstrong\u003e演算过程与「P2 必须打头」的结论是硬的；选项字母 B 需原图核对表头后定稿。\u003c/strong\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e关键得分点\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e① 「P2 必须打头」是本题的分水岭\u003c/strong\u003e——Available=(1,0) 只有 P2 满足，因此任何以 P1 或 P3 开头的选项直接排除。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e② 每一轮 Work 都要加回该进程的 Allocation，不是加 Need\u003c/strong\u003e（最常见失分点）。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 2022 年 408 第 26 题（求安全序列「个数」）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干数据\u003c/strong\u003e（据 PDF 第 26 题原文抽取；三类资源 A、B、C；表格数字待原图核对）：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e可用资源 Available = (1, 3, 2)\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e进程\u003c/th\u003e\u003cth\u003e已分配 A\u003c/th\u003e\u003cth\u003eB\u003c/th\u003e\u003cth\u003eC\u003c/th\u003e\u003cth\u003e尚需 A\u003c/th\u003e\u003cth\u003eB\u003c/th\u003e\u003cth\u003eC\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP0\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e2\u003c/td\u003e\u003ctd data-label=\"B\"\u003e0\u003c/td\u003e\u003ctd data-label=\"C\"\u003e1\u003c/td\u003e\u003ctd data-label=\"尚需 A\"\u003e0\u003c/td\u003e\u003ctd data-label=\"B\"\u003e2\u003c/td\u003e\u003ctd data-label=\"C\"\u003e1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP1\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e0\u003c/td\u003e\u003ctd data-label=\"B\"\u003e2\u003c/td\u003e\u003ctd data-label=\"C\"\u003e0\u003c/td\u003e\u003ctd data-label=\"尚需 A\"\u003e1\u003c/td\u003e\u003ctd data-label=\"B\"\u003e2\u003c/td\u003e\u003ctd data-label=\"C\"\u003e3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"进程\"\u003eP2\u003c/td\u003e\u003ctd data-label=\"已分配 A\"\u003e1\u003c/td\u003e\u003ctd data-label=\"B\"\u003e0\u003c/td\u003e\u003ctd data-label=\"C\"\u003e1\u003c/td\u003e\u003ctd data-label=\"尚需 A\"\u003e0\u003c/td\u003e\u003ctd data-label=\"B\"\u003e1\u003c/td\u003e\u003ctd data-label=\"C\"\u003e3\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e说明：题干直接给了「尚需」（即 Need），\u003cstrong\u003e省去算 Need 一步\u003c/strong\u003e——这是本题的快节奏设计。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e逐层枚举（Work 起点 = (1,3,2)）\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e轮次\u003c/th\u003e\u003cth\u003eWork\u003c/th\u003e\u003cth\u003e满足条件的进程\u003c/th\u003e\u003cth\u003e说明\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"轮次\"\u003e①\u003c/td\u003e\u003ctd data-label=\"Work\"\u003e(1,3,2)\u003c/td\u003e\u003ctd data-label=\"满足条件的进程\"\u003e\u003cstrong\u003eP0\u003c/strong\u003e（需 (0,2,1) ✅）、\u003cstrong\u003eP2\u003c/strong\u003e（需 (0,1,3) ✅）\u003c/td\u003e\u003ctd data-label=\"说明\"\u003eP1 需 (1,2,3)，C 类 3 &gt; 2 ❌；\u003cstrong\u003e分支开始\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e分支展开：\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e分支 A：P0 先跑\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e① Work = (1,3,2) + Alloc(P0)=(2,0,1) = \u003cstrong\u003e(3,3,3)\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e② 此时 P1 需 (1,2,3) ✅、P2 需 (0,1,3) ✅ → \u003cstrong\u003e两条子分支\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eA-1：P0 → \u003cstrong\u003eP1\u003c/strong\u003e：Work = (3,3,3)+(0,2,0) = (3,5,3) → P2 可跑 → \u003cstrong\u003eP0,P1,P2\u003c/strong\u003e ✔ 序列 \u003cstrong\u003e#1\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eA-2：P0 → \u003cstrong\u003eP2\u003c/strong\u003e：Work = (3,3,3)+(1,0,1) = (4,3,4) → P1 可跑 → \u003cstrong\u003eP0,P2,P1\u003c/strong\u003e ✔ 序列 \u003cstrong\u003e#2\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e分支 B：P2 先跑\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e① Work = (1,3,2) + Alloc(P2)=(1,0,1) = \u003cstrong\u003e(2,3,3)\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e② P0 需 (0,2,1) ✅、P1 需 (1,2,3) ✅ → \u003cstrong\u003e两条子分支\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eB-1：P2 → \u003cstrong\u003eP0\u003c/strong\u003e：Work = (2,3,3)+(2,0,1) = (4,3,4) → P1 可跑 → \u003cstrong\u003eP2,P0,P1\u003c/strong\u003e ✔ 序列 \u003cstrong\u003e#3\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eB-2：P2 → \u003cstrong\u003eP1\u003c/strong\u003e：Work = (2,3,3)+(0,2,0) = (2,5,3) → P0 可跑 → \u003cstrong\u003eP2,P1,P0\u003c/strong\u003e ✔ 序列 \u003cstrong\u003e#4\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e答案：共 4 个安全序列 → 选项 D（4）\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e为什么其他选项错：\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eA（1）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e漏掉「安全序列不唯一」这一核心事实\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eB（2）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e只看了一个起点（如只从 P0 展开）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eC（3）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e漏了某一子分支（常见漏 B-2 或 A-2）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eD（4）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e2 个起点 × 每个起点 2 条 = 4\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e枚举要点（防止漏解）\u003c/strong\u003e：\u003cstrong\u003e画成一棵树的形状，每层把「所有满足条件」的进程都列出来\u003c/strong\u003e，不要一开始就锁定某个顺序。考场建议用表格：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e起点=P0 ─┬─ P1 ─ P2   (#1)\n         └─ P2 ─ P1   (#2)\n起点=P2 ─┬─ P0 ─ P1   (#3)\n         └─ P1 ─ P0   (#4)\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e✅ \u003cstrong\u003e交叉验证（重要）\u003c/strong\u003e：本演算已由\u003cstrong\u003e教材原文独立印证\u003c/strong\u003e。\u003cstrong\u003e印刷页 172（PDF p184）\u003c/strong\u003e 的习题解析原文逐字如下：\u003cbr\u003e「45.B　初始时系统中的可用资源数为 \u003cstrong\u003e⟨1,3,2⟩，只能满足 P0 的需求 ⟨0,2,1⟩，所以安全序列第一个只能是 P0\u003c/strong\u003e，将资源分配给 P0 后……可用资源数变为 ⟨1,3,2⟩+⟨2,0,1⟩=\u003cstrong\u003e⟨3,3,3⟩\u003c/strong\u003e，此时可用资源数既能满足 P1，又能满足 P2，可以先分配给 P1……也可以先分配给 P2……\u003cstrong\u003e所以安全序列可以是 ①P0、P1、P2 或 ②P0、P2、P1\u003c/strong\u003e。」\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e与本卡演算三处完全吻合\u003c/strong\u003e：①起点 ⟨1,3,2⟩ 相同；②「只有 P0 能打头」相同；③ P0 之后 ⟨3,3,3⟩ 可再接 P1 或 P2、各产生 2 条 → \u003cstrong\u003e共 4 条\u003c/strong\u003e。\u003cbr\u003e\u003cbr\u003e⚠️ \u003cstrong\u003e题号归属待校对\u003c/strong\u003e：教材解析把这题的答案编号写作「\u003cstrong\u003e45.B\u003c/strong\u003e」，但本卡依据 \u003cstrong\u003e2022 年 408 真题 PDF 的文字层\u003c/strong\u003e定位为「第 26 题」。两者可能是\u003cstrong\u003e教材习题编号 ≠ 真题题号\u003c/strong\u003e（王道习题按节内序号编排）。\u003cstrong\u003e引用时写「2022 年 408 安全序列题（王道印刷页 172 / PDF p184 解析编号 45.B）」，不要单独用其中一个编号。\u003c/strong\u003e\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. 死锁四大策略对比表（必背）","html":"\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e策略\u003c/th\u003e\u003cth\u003e时机\u003c/th\u003e\u003cth\u003e手段\u003c/th\u003e\u003cth\u003e是否破坏必要条件\u003c/th\u003e\u003cth\u003e能否解除已发生的死锁\u003c/th\u003e\u003cth\u003e开销\u003c/th\u003e\u003cth\u003e典型算法\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"策略\"\u003e\u003cstrong\u003e预防\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"时机\"\u003e\u003cstrong\u003e运行前\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"手段\"\u003e\u003cstrong\u003e破坏\u003c/strong\u003e四条件之一\u003c/td\u003e\u003ctd data-label=\"是否破坏必要条件\"\u003e\u003cstrong\u003e是\u003c/strong\u003e（破坏一个）\u003c/td\u003e\u003ctd data-label=\"能否解除已发生的死锁\"\u003e否（根本不让发生）\u003c/td\u003e\u003ctd data-label=\"开销\"\u003e低（静态约束），但\u003cstrong\u003e资源利用率低\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"典型算法\"\u003e一次性分配、资源有序分配\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"策略\"\u003e\u003cstrong\u003e避免\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"时机\"\u003e\u003cstrong\u003e运行中\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"手段\"\u003e每次分配前\u003cstrong\u003e判断是否安全\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"是否破坏必要条件\"\u003e否\u003c/td\u003e\u003ctd data-label=\"能否解除已发生的死锁\"\u003e否（也是事前阻止）\u003c/td\u003e\u003ctd data-label=\"开销\"\u003e\u003cstrong\u003e高\u003c/strong\u003e（每次分配都要跑安全性算法）\u003c/td\u003e\u003ctd data-label=\"典型算法\"\u003e\u003cstrong\u003e银行家算法\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"策略\"\u003e\u003cstrong\u003e检测\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"时机\"\u003e\u003cstrong\u003e运行中\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"手段\"\u003e周期性构造/化简\u003cstrong\u003e资源分配图\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"是否破坏必要条件\"\u003e否\u003c/td\u003e\u003ctd data-label=\"能否解除已发生的死锁\"\u003e否\u003c/td\u003e\u003ctd data-label=\"开销\"\u003e中\u003c/td\u003e\u003ctd data-label=\"典型算法\"\u003e资源分配图化简、死锁检测算法\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"策略\"\u003e\u003cstrong\u003e解除\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"时机\"\u003e\u003cstrong\u003e发生之后\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"手段\"\u003e终止进程 / 剥夺资源 / 回滚\u003c/td\u003e\u003ctd data-label=\"是否破坏必要条件\"\u003e否\u003c/td\u003e\u003ctd data-label=\"能否解除已发生的死锁\"\u003e\u003cstrong\u003e是\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"开销\"\u003e—\u003c/td\u003e\u003ctd data-label=\"典型算法\"\u003e选代价最小者\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e记住「预防=事前破坏，避免=事前判断，检测=事后发现，解除=事后处理」四步曲。\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003e陷阱题\u003c/strong\u003e：「死锁检测和解除\u003cstrong\u003e不破坏\u003c/strong\u003e任何必要条件」——因为它是「先让死锁发生，再处理」，而不是「不让它发生」。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.1 预防的具体做法（\u003cstrong\u003e每个对应破坏哪个条件\u003c/strong\u003e）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e资源\u003cstrong\u003e一次性分配\u003c/strong\u003e（请求前给足）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e请求并保持\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e资源浪费、进程饥饿\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e申请不到就\u003cstrong\u003e释放手中资源\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e不可剥夺\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e实现复杂、开销大\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e资源有序分配\u003c/strong\u003e（按编号递增申请）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e循环等待\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e编号不当会降低利用率；仍可能有空闲浪费\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e注意\u003c/strong\u003e：\u003cstrong\u003e互斥条件一般不破坏\u003c/strong\u003e——很多资源本质上就不能共享（如打印机），强行改造代价极高。因此「破坏互斥条件」在选择题里通常是\u003cstrong\u003e错误选项\u003c/strong\u003e。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. 速查表（考前 3 分钟）","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e四条件\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e互斥 · 请求并保持 · 不可剥夺 · 循环等待\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e死锁 vs 饥饿\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e死锁要循环等待且永久；饥饿只求「长期得不到」\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e安全 vs 死锁\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e安全 ⇒ 无死锁；不安全 ⇏ 死锁\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e最少资源数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003em 进程各需 k 个 → \u003cstrong\u003em(k−1)+1\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e化简\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e能完全化简 ⇒ 一定无死锁\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e单实例 + 有环\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e⇔ 死锁\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e安全性算法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eWork=Available；Need≤Work 就加上 Allocation\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e请求算法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e合法性 → 够不够 → 试分配 → 查安全 → 不安全回滚\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e预防\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e破坏条件；避免\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e判断安全；检测\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e化简图；解除\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e终止/剥夺/回滚\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 待校对清单","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e1\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2020 Q27 的表格数字与\u003cstrong\u003e正确选项字母\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003ePDF 文本层表格被拆成单列，数字/表头错位。本卡已按语义重组并给出推导；\u003cstrong\u003e选项结论（B）需原图确认后定稿\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e2\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e~~2022 Q26 的表格数字~~\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ \u003cstrong\u003e已解决\u003c/strong\u003e：教材印刷页 172（PDF p184）解析原文给出起点 ⟨1,3,2⟩、\u003ccode\u003e45.B\u003c/code\u003e、两个安全序列 P0P1P2 / P0P2P1，与本卡 4 条枚举完全吻合。\u003cstrong\u003e仅剩题号归属待统一\u003c/strong\u003e（真题 26 题 vs 教材 45.B）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e3\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e四必要条件的\u003cstrong\u003e教材原始措辞\u003c/strong\u003e（印刷页 150 / PDF p162）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ \u003cstrong\u003e已实测\u003c/strong\u003e：2.4.1 死锁定义与「死锁与饥饿」原文已逐字核对回填\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e4\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e资源分配图化简图的教材插图与例题（印刷页 157–158 / PDF p169–170）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e图无法从纯文本 OCR 获取，\u003cstrong\u003e需原图\u003c/strong\u003e（待人工/截图核对）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e5\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2009–2019、2023、2025 年涉及死锁的题号\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e扫描件无文字层；\u003ccode\u003e_exam.json\u003c/code\u003e 未生成（\u003ccode\u003eextract.py exam\u003c/code\u003e 进程已中断）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e\u003cp\u003e\u003cem\u003e本文件路径：\u003ccode\u003eD:\\agent\\os\\os-考点卡-2.4-死锁.md\u003c/code\u003e · 只覆盖操作系统一科 · 产出由小狐仙归档入 D:\\MEMORY\u003c/em\u003e\u003c/p\u003e"}]}]},{"chapter":"第4章 文件管理","subject":"os","docs":[{"id":"doc-1","title":"第 4 章 文件管理（做题导向版）","sections":[{"id":"sec-1","section":"0. 考场速查（考前 10 分钟只看这一页）","html":"\u003cblockquote\u003e\u003cstrong\u003e适用\u003c/strong\u003e：408 操作系统 · 王道 第 4 章\u003cbr\u003e\u003cstrong\u003e口径\u003c/strong\u003e：本条卡所有数字与结论来自 \u003ccode\u003eos/data/_parts/ch4.json\u003c/code\u003e（38 条已整理条目）\u003cbr\u003e\u003cstrong\u003e状态\u003c/strong\u003e：结构完整，公式全部可复算；\u003cstrong\u003e书页码待核\u003c/strong\u003e（OCR 缺页，不写书页号，避免编造）\u003cbr\u003e\u003cstrong\u003e制卡\u003c/strong\u003e：小狐仙 · 2026-10-25\u003cbr\u003e\u003cstrong\u003e用法\u003c/strong\u003e：不是拿来看的，是拿来\u003cstrong\u003e照着套\u003c/strong\u003e的。每一节都是「看到这种题 → 走这个流程 → 别踩这个坑」。\u003c/blockquote\u003e\u003chr\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e逻辑块号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003ei = ⌊off / B⌋\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e从 \u003cstrong\u003e0\u003c/strong\u003e 开始编号\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e块内偏移\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003ed = off mod B\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e单位是\u003cstrong\u003e字节\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e连续分配物理块\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eb = start + i\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e一次加法，零额外 I/O\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e索引块表项数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eK = 块大小 ÷ 地址项大小\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003eK 必须按题给重算，不许死记 1024\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003en 级索引覆盖块数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eK^n\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e单级 K、二级 K²、三级 K³\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e混合索引总块数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e直接项数 + K + K² + K³\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e再乘块大小才是最大文件长度\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e位示图 块号→字号/位号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e字号 = ⌊b/n⌋\u003c/code\u003e，\u003ccode\u003e位号 = b mod n\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003en = 每字位数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e位示图 字号/位号→块号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eb = i×n + j\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e行列若从 1 起，先各减 1\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e位示图占空间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e盘块数 ÷ 8\u003c/code\u003e 字节\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e或 \u003ccode\u003e÷ n\u003c/code\u003e 个字\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eFAT 表项数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e= 磁盘盘块总数\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e每项还要 1 位标志位\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e不死锁最少资源数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003em ≥ n(r−1) + 1\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e严格大于号 \u003ccode\u003em &gt; n(r−1)\u003c/code\u003e 等价于此\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 五大计算题型（80% 的题都在这）","html":"\u003ch4 class=\"cardsec__sub\"\u003e题型 A：逻辑块号 → 物理块号（连续分配）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目给「起始块号 + 文件长度」，问「偏移 X 字节在第几块 / 物理地址是多少」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e流程\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003ccode\u003ei = ⌊off / B⌋\u003c/code\u003e\u003c/li\u003e\u003cli\u003e判越界：\u003ccode\u003ei ≥ n\u003c/code\u003e（n 为文件块数）→ 访问失败\u003c/li\u003e\u003cli\u003e\u003ccode\u003eb = start + i\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003ed = off mod B\u003c/code\u003e\u003c/li\u003e\u003cli\u003e物理地址 = \u003ccode\u003eb × B + d\u003c/code\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e例题\u003c/strong\u003e：B = 1KB，start = 20，读偏移 3000 字节。\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ccode\u003ei = ⌊3000/1024⌋ = 2\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003eb = 20 + 2 = 22\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003ed = 3000 − 2048 = 952\u003c/code\u003e\u003c/li\u003e\u003cli\u003e物理地址 = \u003ccode\u003e22 × 1024 + 952\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e坑\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e逻辑块号从 \u003cstrong\u003e0\u003c/strong\u003e 起，不是从 1。\u003c/li\u003e\u003cli\u003e只有\u003cstrong\u003e连续分配\u003c/strong\u003e能这么做。链接分配和索引分配不能直接 \u003ccode\u003estart + i\u003c/code\u003e。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e题型 B：索引容量与最大文件长度\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目给「块大小 + 地址项大小 + 几级索引」，问「能表示多大的文件 / 最大块号是多少」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第一步永远是算 K\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eK = 盘块大小 ÷ 每个盘块号所占字节数\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e4KB 块 + 4B 地址 → \u003ccode\u003eK = 4096/4 = 1024 = 2^10\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e1KB 块 + 4B 地址 → \u003ccode\u003eK = 256\u003c/code\u003e\u003c/strong\u003e ← 这是最常考的变体，死记 1024 必错\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e第二步套级数\u003c/strong\u003e：\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e单级\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1024 × 4KB = \u003cstrong\u003e4MB\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e二级\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK²\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e2^20 × 4KB = \u003cstrong\u003e4GB\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e三级\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK³\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e2^30 × 4KB = \u003cstrong\u003e4TB\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e二级索引的块号拆分\u003c/strong\u003e（要会手算）：\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ccode\u003ek1 = ⌊i / K⌋\u003c/code\u003e（一级索引块内第几项）\u003c/li\u003e\u003cli\u003e\u003ccode\u003ek2 = i mod K\u003c/code\u003e（二级索引块内第几项）\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e代价\u003c/strong\u003e：最坏读 3 次盘（一级索引块 + 二级索引块 + 数据块）。\u003c/p\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e题型 C：混合索引（UNIX 风格）★ 最高频\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目给「索引结点含 10 个直接项、1 个一级间接、1 个二级间接、1 个三级间接」，问「最大文件长度」或「第 X 号逻辑块走哪条路、读几次盘」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第一层：各类地址覆盖多少块\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e直接地址（10 项）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e10\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e0 ~ 9\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e一级间接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e10 ~ 10+K−1（10 ~ 1033）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e二级间接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK²\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1034 ~ 1034+K²−1\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e三级间接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eK³\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e接着往下\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e第二层：最大文件长度\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e总块数 = 10 + K + K² + K³\n最大长度 = 总块数 × 盘块大小\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eK = 1024、块 4KB 时：\u003c/p\u003e\u003cp\u003e\u003ccode\u003e10 + 2^10 + 2^20 + 2^30\u003c/code\u003e 块\u003c/p\u003e\u003cp\u003e≈ \u003cstrong\u003e4TB + 4GB + 4MB + 40KB\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e第三层：给一个逻辑块号 i，问走哪条路、读几次盘\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003ei &lt; 10\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e直接项\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e0\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003ccode\u003e10 ≤ i &lt; 10+K\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e一级间接，\u003ccode\u003ej = i − 10\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e落在二级区\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003ej = i − (10+K)\u003c/code\u003e，拆 \u003ccode\u003e⌊j/K⌋\u003c/code\u003e 和 \u003ccode\u003ej mod K\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e2\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e落在三级区\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e按 \u003ccode\u003ej/K²\u003c/code\u003e、\u003ccode\u003e(j mod K²)/K\u003c/code\u003e、\u003ccode\u003ej mod K\u003c/code\u003e 拆三级\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e3\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e加上数据块本身，总访盘次数 = 上表 + 1。\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e坑\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e「访问第 i 块要几次访盘」\u003cstrong\u003e必须把数据块算进去\u003c/strong\u003e。题目若明说「索引块已在内存」，才只计数据块。\u003c/li\u003e\u003cli\u003eK 一定要按题给数据重算。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e题型 D：位示图换算 ★ 最高频\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目给「字长 n 位 / 每行 n 位」，问「盘块号 b 对应第几字第几位 / 第几行第几列」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e核心公式（全部从 0 起编号时）\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e字号 i = ⌊b / n⌋\n位号 j = b mod n\n反算：b = i × n + j\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e若题目说行列从 1 起编号\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e行号 = ⌊b/n⌋ + 1\n列号 = (b mod n) + 1\n反算：b = (行号−1) × n + (列号−1)\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e例题\u003c/strong\u003e：字长 n = 16 位，共 256 个字（4096 个盘块）\u003c/p\u003e\u003cul\u003e\u003cli\u003e(1) \u003ccode\u003eb = 100\u003c/code\u003e → 字号 \u003ccode\u003e⌊100/16⌋ = 6\u003c/code\u003e，位号 \u003ccode\u003e100 − 96 = 4\u003c/code\u003e；行号 7，列号 5\u003c/li\u003e\u003cli\u003e(2) 行 5 列 3 → 字号 4、位号 2 → \u003ccode\u003eb = 4×16 + 2 = 66\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e位示图占多少空间\u003c/strong\u003e：\u003c/p\u003e\u003cp\u003e\u003ccode\u003e盘块数 ÷ 8\u003c/code\u003e 字节，或 \u003ccode\u003e盘块数 ÷ n\u003c/code\u003e 个字。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e坑\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e先看清「字长 n」和「行列从 0 还是从 1」——这两个条件错一个，答案全错。\u003c/li\u003e\u003cli\u003e字号/位号是\u003cstrong\u003e位示图\u003c/strong\u003e的定位，盘块号是\u003cstrong\u003e磁盘\u003c/strong\u003e的定位，两者只靠 \u003ccode\u003eb = i×n + j\u003c/code\u003e 换算，别混。\u003c/li\u003e\u003cli\u003e0 = 空闲、1 = 已分配（题设另有规定以题为准，\u003cstrong\u003e一定要读题\u003c/strong\u003e）。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e题型 E：FAT 大小与 FAT 链\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目给「磁盘大小 + 块大小」，问「FAT 有多少表项 / 占多大空间」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e流程\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e盘块数 = \u003ccode\u003e磁盘容量 ÷ 块大小\u003c/code\u003e\u003c/li\u003e\u003cli\u003eFAT 表项数 = \u003cstrong\u003e盘块数\u003c/strong\u003e（一个盘块对应一个表项）\u003c/li\u003e\u003cli\u003e每个表项 = 指针位数 + \u003cstrong\u003e1 位标志位\u003c/strong\u003e\u003c/li\u003e\u003cli\u003eFAT 总大小 = \u003ccode\u003e盘块数 × (指针位数 + 1) ÷ 8\u003c/code\u003e 字节\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003eFAT 的随机访问\u003c/strong\u003e：链在\u003cstrong\u003e内存\u003c/strong\u003e里走，所以能随机访问第 i 块。但\u003cstrong\u003e真正读那块数据仍要 1 次磁盘 I/O\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e坑（三个高频混淆）\u003c/strong\u003e：\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eFAT vs 位示图/成组链接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e问一句「这张表记的是\u003cstrong\u003e已用\u003c/strong\u003e的还是\u003cstrong\u003e空闲\u003c/strong\u003e的」——FAT 记已用，另两个记空闲\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eFAT vs 索引分配\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e都是随机访问。区别：FAT 是\u003cstrong\u003e全局一张表\u003c/strong\u003e，索引分配是\u003cstrong\u003e每个文件一块索引表\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e随机访问 ≠ 零 I/O\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eFAT 定位不需读盘，但取数据要读盘\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e题型 F：目录检索的 I/O 次数\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e识别标志\u003c/strong\u003e：题目问「按绝对路径 /a/b/c.txt 访问文件，需要读几次磁盘」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e数法\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e根目录\u003cstrong\u003e一般\u003c/strong\u003e常驻内存（\u003cstrong\u003e这是常见题设简化，不是硬结论\u003c/strong\u003e；题目若给了根目录位置或要求计根目录 I/O，必须计入）。\u003c/li\u003e\u003cli\u003e若目录项已拆成「文件名 + 索引结点号」：每级读 \u003cstrong\u003e1 次目录块\u003c/strong\u003e，名字匹配后再读 \u003cstrong\u003e1 次索引结点\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e若目录项就是完整 FCB（如 FAT 文件系统）：每级读入目录项本身即可。\u003c/li\u003e\u003cli\u003e文件已打开后再读写 → \u003cstrong\u003e不再检索目录\u003c/strong\u003e，直接用内存中的打开文件表。\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e坑\u003c/strong\u003e：题目常要求分开报「读目录几次 / 读索引结点几次」，必须按题设的数据结构拆开数，不能笼统说「几次」。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 四种物理结构速判表（选择题命中区）","html":"\u003cdiv class=\"tr-list\"\u003e\u003cdiv class=\"tr-card\"\u003e\u003cdiv class=\"tr-title\"\u003e连续分配\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e随机访问\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 不需额外 I/O\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e外部碎片\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ \u003cstrong\u003e有\u003c/strong\u003e（需紧凑）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e文件动态增长\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e❌ 困难\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e目录项内容\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e起始块号 + 长度\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e主要代价\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e预留空间、紧凑开销\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-card\"\u003e\u003cdiv class=\"tr-title\"\u003e隐式链接\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e随机访问\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e❌ 必须逐块走\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e外部碎片\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e❌ 无\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e文件动态增长\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 容易\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e目录项内容\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e起始块号 + 结束块号\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e主要代价\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e指针占空间、链断全丢\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-card\"\u003e\u003cdiv class=\"tr-title\"\u003e显式链接（FAT）\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e随机访问\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 链在内存 FAT 中走\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e外部碎片\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e❌ 无\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e文件动态增长\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 容易\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e目录项内容\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e\u003cstrong\u003e只需起始块号\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e主要代价\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003eFAT 占大量内存\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-card\"\u003e\u003cdiv class=\"tr-title\"\u003e索引分配\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e随机访问\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 查索引块第 i 项\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e外部碎片\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e❌ 无\u003c/div\u003e\u003c/div\u003e\u003cdiv
