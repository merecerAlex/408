. 根目录一般常驻内存，不额外读盘；\n2. 目录项若已把 FCB 拆成“名字 + 索引结点号”，则每级只需读入目录块（1 次），再按匹配项读索引结点；\n3. 若目录项就是完整 FCB（如 FAT 文件系统），则每级也要读入目录项本身；\n4. 故路径深度越大、目录越大，寻址所需 I/O 越多——这是“当前目录/相对路径”与“打开文件表缓存”存在的意义。\n【易错】① 题目常要求「读目录几次、读索引结点几次」，要严格按题设的数据结构拆分来数；② 本条写的“根目录一般常驻内存”是常见题设简化，并非普遍成立的硬结论——实际题目若给了根目录所在位置或明确要计根目录 I/O，就必须按题设计入。","keywords":["路径解析","目录检索","I/O次数","索引结点","当前目录"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"needs_review":true,"review_note":"根目录不读盘属于题目常见的简化假设，教材并无此恒定结论；已改为条件式表述，回填页码时请对照教材口径确认，避免被当成普适规律背诵。","id":"os-ch4-4.4-003"},{"chapter":"第4章 文件管理","section":"4.4 本章疑难点","topic":"空闲空间管理","level":"l3","title":"疑难点：位示图与成组链接法的适用场景比较（考纲外补充）","answer":"【比较】\n1. 位示图：空间极小（每块 1 bit）、便于快速找连续空闲块，适合中小型文件系统；缺点是要顺序扫描找空闲位，且位示图本身要占一块连续内存/磁盘空间；\n2. 成组链接法：只需常驻一小部分（当前组），适合超大文件系统（空闲块极多）的场景，分配/回收几乎只需内存操作，但结构比位示图复杂；\n3. 空闲表法：适合连续分配，表项管理合并方便，但空闲区很多时表会很长；\n4. 空闲链表：实现简单，但逐个盘块/盘区遍历，速度慢。\n【选型口诀】小块数看位示图，大容量看成组链接，连续分配配空闲表。","keywords":["位示图","成组链接法","空闲表","空闲链表","适用场景"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"boundary_note":"考纲外补充","id":"os-ch4-4.4-004"},{"id":"os-ch5-5.1-001","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"I/O 设备按信息交换单位分类：块设备与字符设备","level":"l1","title":"块设备与字符设备的区别","answer":"按信息交换单位分类，I/O 设备分为两类：\n1. 块设备：以固定大小的数据块为单位交换信息，如磁盘。基本特征是传输速率较高、支持随机访问（可寻址），允许对任意数据块读/写。\n2. 字符设备：以字符（字节）为单位交换信息，如交互式终端、打印机。基本特征是传输速率较低、不可寻址，通常采用中断方式实现异步通信。\n\n背诵要点：可寻址 ↔ 不可寻址，是二者的分水岭；磁盘 I/O 常用 DMA，字符设备常用中断驱动。","keywords":["块设备","字符设备","可寻址","不可寻址","信息交换单位"],"source":"王道2027版 印刷页 306（PDF p318）","status":"final"},{"id":"os-ch5-5.1-002","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"I/O 设备按共享属性分类：独占/共享/虚拟设备","level":"l1","title":"独占设备、共享设备、虚拟设备","answer":"1. 独占设备：任一时刻仅允许一个进程使用，分配给某进程后由其独占直至使用完毕释放；典型的是低速设备，如打印机。\n2. 共享设备：允许多个进程在逻辑上并发访问；物理访问仍需调度协调，系统可分配给多个进程分时交替使用；磁盘是典型的共享设备。\n3. 虚拟设备：通过 SPOOLing 技术把独占设备改造为多个逻辑设备，使多个进程能并发使用。其实质是利用高速共享设备（如磁盘）作为缓冲区，实现独占设备的逻辑共享。\n\n其他分类（按传输速率：低速键盘鼠标/中速激光打印机/高速磁盘；按使用特性：人机交互设备、存储设备、网络通信设备）只需认得名称。","keywords":["独占设备","共享设备","虚拟设备","SPOOLing","打印机","磁盘"],"source":"王道2027版 印刷页 306（PDF p318）","status":"final"},{"id":"os-ch5-5.1-003","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"设备控制器（I/O 接口）的组成与功能","level":"l1","title":"设备控制器由三部分组成","answer":"I/O 接口（也称设备控制器）是 CPU 与设备之间的“桥梁”，负责接收 CPU 命令、控制设备工作。三部分组成：\n1. 设备控制器与 CPU 的接口：含数据线（传读/写数据、控制和状态信息）、地址线（指定接口中寄存器编号）、控制线（传读/写等控制信号）。\n2. 设备控制器与设备的接口：一个控制器可连接一个或多个设备，每个接口传数据、控制、状态三类信号。\n3. I/O 逻辑：对收到的 I/O 命令译码，依据目标地址识别相应设备，控制设备工作。\n\n主要功能：①接收并识别命令；②完成数据交换（CPU↔控制器、控制器↔设备）；③标识并报告设备状态；④地址识别；⑤数据缓冲；⑥差错控制。","keywords":["设备控制器","I/O接口","I/O逻辑","数据线","地址线","控制线"],"source":"王道2027版 印刷页 306-307（PDF p318-319）","status":"final"},{"id":"os-ch5-5.1-004","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"I/O 端口的两类编址：独立编址与统一编址","level":"l2","title":"独立编址 vs 统一编址","answer":"I/O 端口 = 设备控制器中可被 CPU 访问的寄存器，分数据寄存器、状态寄存器、控制寄存器三类。\n\n1. 独立编址（I/O 映射）：为 I/O 端口建立独立于主存的地址空间，与内存地址在逻辑上完全分离。CPU 用专用 I/O 指令（如 x86 的 IN/OUT）访问。\n   优点：端口数量远少于内存单元，地址线少、译码简单、寻址快；专用 I/O 指令使程序中的 I/O 操作清晰可辨。\n   缺点：I/O 指令功能有限，程序设计灵活性差；CPU 需同时提供存储器读/写与 I/O 读/写两组控制信号。\n2. 统一编址（内存映射）：把部分主存地址空间分配给 I/O 端口，二者共享同一地址空间；靠地址范围区分访问目标，用普通访存指令即可访问端口。\n   优点：无须专用 I/O 指令，编程灵活；端口编址空间大；I/O 访问保护可由虚拟存储管理统一实现。\n   缺点：I/O 端口占用主存地址空间，减少可用内存；需按完整地址判断是否为 I/O 区域，译码电路复杂、译码速度低。","keywords":["I/O端口","独立编址","统一编址","内存映射","IN/OUT"],"source":"王道2027版 印刷页 307-308（PDF p319-320）","status":"final"},{"id":"os-ch5-5.1-005","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"程序直接控制方式（轮询）","level":"l2","title":"程序直接控制方式","answer":"原理：CPU 对 I/O 设备采取轮询方式。CPU 向设备控制器发一条 I/O 指令，然后不断循环测试设备状态（轮询），直到确定该字（节）已在数据寄存器中，再取出送入内存指定单元——完成一个字（节）的 I/O。\n\n特点：\n· 简单、易于实现。\n· CPU 绝大部分时间耗在循环测试设备状态上，CPU 与 I/O 设备只能串行工作，CPU 利用率相当低。\n· 根本原因：CPU 中未采用中断机制，设备无法主动向 CPU 报告“一个字（节）输入已完成”。\n\nCPU 干预次数：以字（节）为单位，每读/写一个字（节）都需 CPU 全程参与。","keywords":["程序直接控制","轮询","串行","CPU利用率","无中断"],"source":"王道2027版 印刷页 308（PDF p320）","status":"final"},{"id":"os-ch5-5.1-006","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"中断驱动方式及其两个问题","level":"l2","title":"中断驱动方式","answer":"原理：允许 I/O 设备主动打断 CPU 运行并请求服务。CPU 发出读命令后继续做其他工作；设备把数据读入控制器数据寄存器后，通过控制线向 CPU 发中断信号表示数据已就绪；CPU 在每个指令周期末尾检查中断，执行中断处理程序把数据读入内核缓冲区，然后解除原进程阻塞。\n\n进步：不再轮询，设备准备数据期间 CPU 与设备并行工作，CPU 利用率明显提升。\n\n仍存在的两个问题：\n1. 设备与内存之间的数据交换都必须经过 CPU 中的寄存器；\n2. CPU 以字（节）为单位进行干预，用于块设备 I/O 极其低效。\n因此中断驱动方式速度仍受限。","keywords":["中断驱动","中断信号","并行","内核缓冲区","指令周期末尾"],"source":"王道2027版 印刷页 308-309（PDF p320-321）","status":"final"},{"id":"os-ch5-5.1-007","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"DMA 方式的三个特点与四个寄存器","level":"l1","title":"DMA 方式的特点与 DMA 控制器组成","answer":"DMA（直接存储器存取）的核心思想：在 I/O 设备与内存之间建立直接数据通路，彻底“解放”CPU。三个特点：\n1. 基本传送单位是数据块，不再是字（节）；\n2. 数据直接在设备与内存之间传输，不经过 CPU；\n3. 仅在数据块传送开始和结束时需要 CPU 干预。\n\nDMA 控制器四类寄存器：\n1. 命令/状态寄存器 CR：暂存 CPU 发来的 I/O 命令或设备状态；\n2. 内存地址寄存器 MAR：存放数据在内存中的起始地址（输入时为目标地址，输出时为源地址）；\n3. 数据寄存器 DR：暂存单次传输的数据单元；\n4. 数据计数器 DC：记录本次需传送的字（节）总数。","keywords":["DMA","数据块","MAR","DC","CR","DR","直接通路"],"source":"王道2027版 印刷页 309（PDF p321）","status":"final"},{"id":"os-ch5-5.1-008","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"DMA 方式的工作流程","level":"l2","title":"DMA 工作流程（步骤题必考）","answer":"1. CPU 收到设备 DMA 请求后，向 DMA 控制器发启动命令，并设置 MAR 和 DC 的初值，启动 DMA 控制器；\n2. CPU 把 I/O 控制权交给 DMA 控制器，转而执行其他任务；\n3. DMA 控制器接管总线，以突发方式把整块数据在设备与内存之间直接传输，无须 CPU 干预；\n4. 传输结束后，DMA 控制器向 CPU 发中断信号，通知操作完成。\n\n结论：CPU 仅在数据传送的开始和结束阶段介入，干预频率比中断方式进一步降低，且数据不经过 CPU 寄存器，CPU 与设备并行程度进一步提升。","keywords":["DMA流程","MAR","DC","突发传输","中断","开始和结束"],"source":"王道2027版 印刷页 309-310（PDF p321-322）","status":"final"},{"id":"os-ch5-5.1-009","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"通道控制方式，以及对四种 I/O 控制方式的对比","level":"l2","title":"通道控制方式与四种 I/O 控制方式对比","answer":"通道：一种专用处理机，能执行存放在主存中的通道程序（由一系列专用通道指令组成）。CPU 只需向通道发一条 I/O 指令，指明目标设备及通道程序的起始地址；通道自主执行通道程序完成全部 I/O，结束后向 CPU 发中断。CPU、通道与设备可高效并行。\n\n1. 与通用处理机的区别：通道指令集专用于 I/O 控制、功能单一；无独立主存，通道程序和数据都放在主机内存，访存受 CPU 控制。\n2. 与 DMA 的区别：DMA 由 CPU 预设数据块大小、内存始址等参数，通道靠执行程序动态确定参数，能自主完成涉及多台设备、多个阶段的复杂 I/O；每个 DMA 控制器通常只服务一台设备，一个通道可同时管理多台设备。\n\nCPU 干预程度（由强到弱）：程序直接控制（按字节全程轮询）→ 中断驱动（每字/节一次）→ DMA（每个数据块的开始与结束）→ 通道（每条通道程序一次）。发展宗旨：尽量减少 CPU 对 I/O 的干预。","keywords":["通道","通道程序","专用处理机","与DMA区别","CPU干预"],"source":"王道2027版 印刷页 310（PDF p322）","status":"final"},{"id":"os-ch5-5.1-010","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"I/O 软件层次结构：四层划分","level":"l1","title":"I/O 软件四个层次的顺序","answer":"I/O 软件分四层（自高到低）：\n1. 用户层软件：产生 I/O 请求、格式化 I/O、SPOOLing；通过系统调用请求内核服务。\n2. 设备独立性软件：映射、保护、分块、缓冲、分配；向用户层/文件系统提供统一接口。\n3. 设备驱动程序：设置设备寄存器、检查状态；把抽象请求转为具体设备指令。\n4. 中断处理程序：处理设备中断（图中与硬件相邻，涉及硬件具体特性）。\n   （四层之下为硬件，执行 I/O 操作。）\n\n口诀：用户 → 无关 → 驱动 → 中断 → 硬件。每层只利用下层提供的服务，屏蔽实现细节、向上提供统一接口；只要层间接口不变，任一层的修改不影响其他层。","keywords":["用户层软件","设备独立性软件","设备驱动程序","中断处理程序","层次结构"],"source":"王道2027版 印刷页 310-311（PDF p322-323）","status":"final"},{"id":"os-ch5-5.1-011","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"设备独立性软件的职责与逻辑设备名的好处","level":"l1","title":"设备独立性软件（设备无关性）","answer":"设备独立性（也称设备无关性）：应用程序使用 I/O 设备时，无须依赖具体的物理设备。为此引入逻辑设备与物理设备：应用程序用逻辑设备名请求某类设备，系统在运行时把逻辑设备名映射为实际的物理设备名。\n\n使用逻辑设备名的好处：①提高设备分配的灵活性；②易于实现 I/O 重定向（用于 I/O 操作的设备可以更换而不必修改应用程序）。\n\n各层功能：\n· 用户层软件：实现与用户的交互接口，可调用 I/O 库函数；必须通过系统调用获取操作系统服务。\n· 设备独立性软件：执行所有设备的公共操作（分配与回收、逻辑设备名到物理设备名映射、设备保护、缓冲管理、差错控制、提供统一大小的逻辑块），并向用户层提供统一接口（如 read/write）。","keywords":["设备独立性","设备无关性","逻辑设备名","I/O重定向","公共操作"],"source":"王道2027版 印刷页 311（PDF p323）","status":"final"},{"id":"os-ch5-5.1-012","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"设备驱动程序的功能与工作流程","level":"l2","title":"设备驱动程序做什么","answer":"设备驱动程序与硬件直接相关，每类设备配一个专用驱动程序，是 I/O 子系统与设备控制器之间的通信桥梁。任务：接收上层的抽象 I/O 请求（如 read/write），转换为设备控制器能识别的具体指令，启动设备，并把状态/数据传回上层。\n\n工作流程：\n1. 将抽象请求转换为具体操作（如磁盘驱动程序把逻辑扇区号转换为柱面号、盘面号、扇区号）；\n2. 校验请求合法性（禁止从只写设备读取、向只读设备写入）；\n3. 检查设备状态（启动 I/O 前读状态寄存器，确认就绪）；\n4. 传递参数（命令、数据缓冲区地址、传输长度等写入控制器寄存器）；\n5. 启动设备并处理后续（发启动信号后进程阻塞，CPU 转去执行其他进程；完成后由中断处理程序唤醒）。\n\n另外还负责设备初始化、状态维护、错误处理及与中断处理的配合。","keywords":["设备驱动程序","抽象请求","逻辑扇区号","状态寄存器","阻塞唤醒"],"source":"王道2027版 印刷页 311（PDF p323）","status":"final"},{"id":"os-ch5-5.1-013","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"中断处理程序的五个步骤","level":"l2","title":"中断处理程序处理 I/O 中断的过程","answer":"1. 检测并响应中断：设备完成一个数据单位传输后控制器发中断请求，CPU 在指令周期末检测到后暂停当前进程；\n2. 保护被中断进程的 CPU 现场：硬件自动把 PC 和 PSW 压入中断栈，操作系统再把其他寄存器内容保存到该栈；\n3. 转入相应设备的中断处理程序：识别中断源，跳转到对应处理程序；\n4. 处理中断：读控制器状态寄存器判断是否正常完成；成功则把数据寄存器内容传送到内存缓冲区，异常则错误处理；\n5. 恢复现场并返回：从栈恢复寄存器，CPU 从被中断指令的下一条继续执行。\n\n另需对中断处理程序本身管理：注册中断（向内核注册中断号与入口地址）、处理中断（确认中断源、清除中断标志、做必要的硬件操作，必须快速非阻塞）、注销中断（卸除驱动时注销处理程序）。","keywords":["中断处理程序","现场保护","PC","PSW","中断栈","注册中断"],"source":"王道2027版 印刷页 311-312（PDF p323-324）","status":"final"},{"id":"os-ch5-5.1-014","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"一次 write 请求穿透各层的过程（以 Linux 为例）","level":"l2","title":"I/O 请求在各层间的传递","answer":"抽象流程：用户调 write 命令接口 → ① 进入用户层软件；② 设备独立性软件用统一的通用接口解析 write 并传递给下一层；③ 设备驱动程序把通用 write 转换为设备特定的指令；④ 驱动程序把指令发给设备控制器启动写操作，完成后控制器向 CPU 发中断；⑤ 中断处理程序确认完成、清除中断标志、唤醒等待进程，结果逐层返回到用户程序。\n\nLinux 实例：printf() → 标准库封装的 write() 封装函数 → 陷阱指令（如 int $0x80，此前把系统调用号及参数写入 eax 等寄存器）→ 硬件自动完成用户态→内核态切换 → 统一入口 system_call() 按 eax 中的系统调用号经跳转表分派给 sys_write() → 执行与设备无关的公共操作（参数检查、内核缓冲区管理）→ 调对应设备驱动程序 → 置当前进程阻塞并让出 CPU → 设备完成后中断，中断服务程序唤醒进程 → 内核沿调用栈返回，system_call() 末尾用 iret 等特权指令切回用户态。\n\n结论：陷阱指令是从用户态进入内核态的唯一合法入口；中断是设备通知完成、触发进程状态转换的核心机制。","keywords":["write","系统调用","陷阱指令","system_call","sys_write","iret"],"source":"王道2027版 印刷页 312-313（PDF p324-325）","status":"final"},{"id":"os-ch5-5.1-015","chapter":"第5章 输入/输出管理","section":"5.1 I/O管理概述","topic":"阻塞 I/O 与非阻塞 I/O","level":"l2","title":"阻塞 I/O 与非阻塞 I/O 对比","answer":"1. 阻塞 I/O（多数系统默认）：发起请求时若数据未就绪，进程立即被阻塞并移入相应等待队列，不能做其他事；I/O 完成后内核把进程移回就绪队列，再次获得 CPU 时系统调用返回结果。\n   优点：实现简单，适合顺序处理或低并发场景。缺点：等待期间进程完全阻塞，CPU 资源闲置，系统整体利用率低。\n2. 非阻塞 I/O：内核不阻塞进程，系统调用立即返回；数据未就绪时返回表示“暂无数据”的错误状态（如 -1），进程可继续做其他任务，之后再重试；重试时数据已就绪则把数据从内核缓冲区复制到用户空间，返回实际传输的字节数。\n   优点：等待期间不被阻塞，适合高并发或高响应性应用。缺点：采用轮询方式频繁检查 I/O 状态，浪费 CPU 资源。","keywords":["阻塞I/O","非阻塞I/O","等待队列","立即返回","轮询"],"source":"王道2027版 印刷页 314（PDF p326）","status":"final"},{"id":"os-ch5-5.2-001","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"设备独立性软件的五项公共功能","level":"l1","title":"设备独立性软件的五大职责","answer":"设备独立性软件（与设备无关的软件）位于设备驱动程序之上，是内核 I/O 子系统的最上层。核心职责是实现各类设备的公共操作、为上层提供统一抽象的 I/O 接口，具体五项：\n1. 提供统一的驱动程序接口：将抽象设备名映射到具体物理设备，定位驱动程序入口，确保 I/O 经内核受控路径执行；\n2. 缓冲管理：用缓冲机制缓解 CPU 与外设速度差异（单缓冲、双缓冲、环形缓冲、缓冲池）；\n3. 差错控制：暂时性错误（如网络丢包）靠重试纠正，主要由驱动程序处理；持久性错误（如磁盘划痕）可记入坏块表，后续 I/O 自动绕过；\n4. 独占设备的分配与回收：设备空闲则立即分配，否则阻塞并加入等待队列；释放时有等待则唤醒队首进程，否则置设备状态为“空闲”；\n5. 提供统一的逻辑数据块：屏蔽不同设备在交换单位和块长上的差异。","keywords":["设备独立性软件","统一接口","缓冲管理","差错控制","设备分配回收","逻辑数据块"],"source":"王道2027版 印刷页 320（PDF p332）","status":"final"},{"id":"os-ch5-5.2-002","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"磁盘高速缓存（Disk Cache）的定义与两种组织形式","level":"l2","title":"磁盘高速缓存","answer":"定义：操作系统利用内存中的存储空间暂存从磁盘读取的盘块数据以提高磁盘 I/O 性能。它不同于 CPU 与主存之间的硬件高速缓存；这些数据在逻辑上是磁盘内容的副本，物理上驻留在内存中。\n\n组织形式（两种）：\n1. 在内存中开辟固定大小的专用缓存区；\n2. 将系统空闲内存作为动态缓冲池，供请求分页系统和磁盘 I/O 子系统共享使用。\n\n注意区分：磁盘高速缓存 ≠ 虚拟盘（RAM 盘）。虚拟盘内容完全由用户程序控制，磁盘高速缓存内容由操作系统透明管理。\n\n——\n相同点：均位于高速设备和低速设备之间，用于缓解二者之间的速度差异。\n\n区别：\n1. 数据：高速缓存存放的是已存在于慢速设备上的数据副本，可长期驻留直至被替换；缓冲区存放的是正在传输过程中的数据，数据源自发送方（高速或低速设备），传输完成后通常立即释放。\n2. 目的：高速缓存提高重复访问的效率，所需数据已在缓存中即可避免访问低速设备；缓冲区提高数据传输的效率与并行性，通过暂存数据协调速度差异、降低中断频率、匹配数据粒度。","keywords":["磁盘高速缓存","DiskCache","内存副本","动态缓冲池","虚拟盘","高速缓存","表5.1","缓冲区","数据副本"],"source":"王道2027版 印刷页 320-321（PDF p332-333）","status":"final"},{"id":"os-ch5-5.2-003","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"引入缓冲区的四个目的","level":"l1","title":"为什么引入缓冲区","answer":"1. 缓和 CPU 与 I/O 设备间速度不匹配的矛盾；\n2. 减少对 CPU 的中断频率，放宽对中断响应时间的限制；\n3. 解决基本数据单元大小（数据粒度）不匹配的问题；\n4. 提高 CPU 与 I/O 设备之间的并行性。\n\n实现方法：采用硬件缓冲器（成本高，除关键部位外一般不用）；利用内存作为缓冲区（本节所讲由内存组成的缓冲区）。按缓冲区数量分为单缓冲、双缓冲、循环缓冲、缓冲池。","keywords":["缓冲区","速度不匹配","中断频率","数据粒度","并行性"],"source":"王道2027版 印刷页 321（PDF p333）","status":"final"},{"id":"os-ch5-5.2-004","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"单缓冲处理每块数据的平均时间 Max(T,C)+M","level":"l2","title":"单缓冲的时间计算","answer":"模型：T = 设备把一块数据送入缓冲区的时间，M = 操作系统把缓冲区数据传送到用户工作区的时间，C = CPU 处理该块数据的时间（块设备必须整块装入缓冲区后才能传送到工作区）。\n\n单缓冲中，设备向缓冲区写数据的 T 可与 CPU 处理前一块数据的 C 并行：\n1. 当 T \u003e C 时：CPU 处理完当前块后须等待设备装满下一块，处理每块时间为 T + M；\n2. 当 T \u003c C 时：缓冲区装满后设备须等待 CPU 处理完，处理每块时间为 C + M。\n\n结论：单缓冲处理每块数据所需时间 = Max(T, C) + M。单位与 T、M、C 的时间单位一致。\n\n注意：单缓冲区是共享资源，设备与 CPU 访问必须互斥；CPU 未取走数据时设备需等待缓冲区释放。","keywords":["单缓冲","Max(T,C)+M","并行","互斥","T M C"],"source":"王道2027版 印刷页 321（PDF p333）","status":"final"},{"id":"os-ch5-5.2-005","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"双缓冲处理每块数据的平均时间 Max(T,C+M)","level":"l2","title":"双缓冲的时间计算","answer":"双缓冲（缓冲对换）：设备先把数据送入缓冲区 1，装满后转向缓冲区 2；同时操作系统从已满的缓冲区 1 取数据送用户工作区并由 CPU 处理。\n\n设 T、M、C 同上，设备向一个缓冲区写入的 T 可与操作系统的传送及处理 C+M 并行：\n1. 当 T \u003e C+M 时：设备来不及，系统必须等待缓冲区装满，处理每块时间为 T；\n2. 当 T \u003c C+M 时：设备输入较快，CPU 无须等待设备，处理每块时间为 C+M。\n\n结论：双缓冲处理每块数据的时间 = Max(T, C+M)。\n\n应用：双机通信要实现全双工（双方同时收发），每台机器需分别设置发送缓冲区和接收缓冲区；若每台只配单一缓冲区，则无法同时收发。","keywords":["双缓冲","Max(T,C+M)","缓冲对换","全双工","并行"],"source":"王道2027版 印刷页 322（PDF p334）","status":"final"},{"id":"os-ch5-5.2-006","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"循环缓冲的 in/out 指针与两种同步情形","level":"l2","title":"循环缓冲","answer":"结构：若干个大小相等的缓冲区用链接指针连成循环队列（最后一个指向第一个）。系统维护两个指针：in 指向下一个待写入的空缓冲区，out 指向下一个待读取的满缓冲区，输入进程和计算进程分别推进 in 和 out。\n\n两种同步情形：\n1. in 追赶上 out（系统受计算限制）：输入进程写入快于计算进程处理，所有缓冲区被填满、无空缓冲区，输入进程必须阻塞，直至计算进程取走数据释放出空缓冲区并唤醒它；\n2. out 追赶上 in（系统受 I/O 限制）：计算进程处理快于输入供给，所有缓冲区都空、无数据可处理，计算进程必须阻塞，直至输入进程写入数据使其成为满缓冲区并唤醒它。\n\n注意：循环缓冲和缓冲池只考工作机制，不做时间性能的定量分析。","keywords":["循环缓冲","in指针","out指针","受计算限制","受I/O限制"],"source":"王道2027版 印刷页 322-323（PDF p334-335）","status":"final"},{"id":"os-ch5-5.2-007","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"缓冲池的三类队列与四种工作方式","level":"l1","title":"缓冲池（含 hin/sin/hout/sout）","answer":"缓冲池：系统统一管理、供多个进程共享的一组缓冲区，是一种包含管理数据结构和操作函数的软件机制。\n\n三类队列：①空缓冲队列（空缓冲区链接）；②输入队列（装满输入数据的缓冲区）；③输出队列（装满输出数据的缓冲区）。\n\n四种角色：收容输入 hin、提取输入 sin、收容输出 hout、提取输出 sout。四种工作方式：\n1. 收容输入：输入进程从空缓冲队列队首取一个空缓冲区作 hin，写入输入数据，装满后挂到输入队列队尾；\n2. 提取输入：计算进程从输入队列队首取一个作 sin，读取数据后挂到空缓冲队列队尾；\n3. 收容输出：计算进程从空缓冲队列队首取一个空缓冲区作 hout，写入输出数据，装满后挂到输出队列队尾；\n4. 提取输出：输出进程从输出队列队首取一个作 sout，读取数据后挂到空缓冲队列队尾。","keywords":["缓冲池","空缓冲队列","输入队列","输出队列","hin","sout"],"source":"王道2027版 印刷页 323（PDF p335）","status":"final"},{"id":"os-ch5-5.2-008","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"设备分配的四级数据结构 DCT/COCT/CHCT/SDT","level":"l1","title":"DCT、COCT、CHCT、SDT 各一张","answer":"1. 设备控制表 DCT：系统为每个物理设备配置一张。主要字段：设备类型、设备标识符（物理设备名，系统内唯一）、设备状态（忙/闲、等待/不等待）、指向控制器表的指针、重复执行次数或时间（超过则判定 I/O 失败）、设备队列的队首指针（指向因请求该设备而阻塞的进程 PCB 队列队首）。\n2. 控制器控制表 COCT：每个设备控制器一张，记录控制器状态及所辖设备信息；其中有“与控制器连接的通道表指针”。\n3. 通道控制表 CHCT：每个通道一张，其中有“与通道连接的控制器表首址”。\n4. 系统设备表 SDT：整个系统只维护一张，作为所有物理设备的全局索引，每个表目对应一个设备（含设备类型、标识符等）。\n\n回收：进程释放设备且无其他进程等待时，把 DCT 中设备状态置为空闲。\n\n——\n设备分配是指根据用户的 I/O 请求分配所需设备的过程。总体原则：在充分发挥设备使用效率（使设备尽可能忙碌）的同时，避免因分配策略不当引发进程死锁。\n\n从属关系：系统中可能存在多个通道，一个通道可连接多个控制器，每个控制器又可连接多个物理设备——设备分配的数据结构必须体现这种从属关系（故有 DCT→COCT→CHCT 的逐级指针）。","keywords":["DCT","COCT","CHCT","SDT","四级数据结构","队首指针","设备分配原则","使设备尽可能忙碌","设备分配"],"source":"王道2027版 印刷页 324（PDF p336）","status":"final"},{"id":"os-ch5-5.2-009","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"设备分配应考虑的四个因素（含安全/不安全分配方式）","level":"l2","title":"设备分配考虑的因素","answer":"1. 设备的固有属性：独占设备（独占使用至释放/终止）、共享设备（可同时供多进程使用，需调度协调，如磁盘）、虚拟设备（虚拟化为可逻辑共享，如 SPOOLing）。\n2. 设备分配算法：FCFS（按请求先后排队，优先队首进程）；最高优先级优先（高优先级排前方，同优先级按 FCFS）。\n3. 分配的安全性：\n   · 安全分配方式：进程发出 I/O 请求后立即进入阻塞态，直至 I/O 完成才被唤醒，期间不再请求其他资源，可有效避免死锁；优点是安全性高，缺点是 CPU 与设备串行工作、效率较低。\n   · 不安全分配方式：进程发出 I/O 请求后仍继续运行，可再发第二、第三个 I/O 请求，仅当请求的设备被占用才阻塞；优点是一个进程可同时使用多个设备、推进迅速，缺点是可能因循环等待造成死锁。\n4. 设备的独立性（结合逻辑设备名与 LUT）。","keywords":["固有属性","FCFS","最高优先级","安全分配","不安全分配","死锁"],"source":"王道2027版 印刷页 325（PDF p337）","status":"final"},{"id":"os-ch5-5.2-010","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"设备分配的步骤：设备→控制器→通道","level":"l2","title":"设备分配三步走（“过三关”）","answer":"以独占设备为例：\n1. 分配设备：按 I/O 请求中的物理设备名查 SDT 找到 DCT，看设备状态；忙则把进程 PCB 挂入设备等待队列，空闲则分配给该进程；\n2. 分配控制器：由 DCT 找到 COCT 查控制器状态；忙则挂入控制器等待队列，空闲则分配；\n3. 分配通道：由 COCT 找到 CHCT 查通道状态；忙则挂入通道等待队列，空闲则分配。\n\n只有设备、控制器、通道均成功分配后，本次设备分配才算完成，随后可启动设备传送数据。（常称“设备分配，要过三关”）\n\n用逻辑设备名时：从 SDT 依次查找该类设备的 DCT，某设备空闲即继续后续分配；仅当所有同类设备都忙才挂入该类设备的公共等待队列。","keywords":["分配设备","分配控制器","分配通道","SDT","过三关"],"source":"王道2027版 印刷页 325（PDF p337）","status":"final"},{"id":"os-ch5-5.2-011","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"逻辑设备表 LUT（逻辑设备名到物理设备名的映射）","level":"l1","title":"LUT 的组成与两种设置方式","answer":"为实现设备独立性，进程用逻辑设备名请求某类设备；系统只能识别物理设备名，故配置逻辑设备表 LUT 建立映射。\n\nLUT 每个表项含三项：逻辑设备名、物理设备名、驱动程序入口地址。\n\n使用时：进程用逻辑设备名请求设备，系统为其分配一台空闲物理设备，并在 LUT 中建立相应表目；此后该进程所有 I/O 请求都通过该表项找到物理设备及其驱动程序。\n\n两种设置方式：\n1. 整个系统仅一张 LUT：所有进程的设备分配情况记录在同一张表中，要求所有用户不能使用相同的逻辑设备名，适用于单用户系统；\n2. 为每个用户设置一张 LUT：系统仍维护全局的 SDT，不同用户可用相同逻辑设备名，互不干扰，适用于多用户系统。","keywords":["LUT","逻辑设备表","逻辑设备名","物理设备名","驱动程序入口"],"source":"王道2027版 印刷页 325-326（PDF p337-338）","status":"final"},{"id":"os-ch5-5.2-012","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"SPOOLing 技术的原理与模拟脱机 I/O","level":"l2","title":"SPOOLing 假脱机技术的由来","answer":"目的：缓和 CPU 高速性与 I/O 设备低速性之间的矛盾。\n\n思想源于早期脱机 I/O：依赖专用外围控制机，在主机不参与下完成 I/O——输入时外围机把低速输入设备（纸带机）的数据预先读到高速磁盘，输出时 CPU 先把结果写入磁盘、再由外围机送至低速输出设备，因脱离主机控制得名“脱机”。\n\n现代做法：不再需要物理外围机，而用专门的输入进程与输出进程在主机控制下模拟外围机——输入进程把低速输入设备数据提前读入磁盘上的输入井；输出进程把用户作业输出暂存于磁盘输出井，再逐步送往实际输出设备。由此 I/O 操作与 CPU 计算得以并行执行。\n\n本质：“脱机”承袭早期脱机 I/O 的思想，“假”体现在以多道程序和磁盘空间替代外围机，从而把一台物理独占设备虚拟为多台逻辑设备，实现设备共享。SPOOLing 技术是一种以空间换时间的技术。","keywords":["SPOOLing","假脱机","脱机I/O","外围控制机","输入井","输出井"],"source":"王道2027版 印刷页 326（PDF p338）","status":"final"},{"id":"os-ch5-5.2-013","chapter":"第5章 输入/输出管理","section":"5.2 设备独立性软件","topic":"SPOOLing 系统的组成（四部分）","level":"l1","title":"SPOOLing 系统由四部分组成","answer":"1. 输入井和输出井：磁盘上开辟的两个专用存储区域。输入井模拟脱机输入的磁盘，暂存输入设备的数据；输出井模拟脱机输出的磁盘，暂存用户程序的输出数据。每个进程的输入/输出数据以文件形式保存（井文件），所有文件按顺序链接成输入队列或输出队列。\n2. 输入缓冲区和输出缓冲区：内存中开辟的两个缓冲区。输入缓冲区暂存输入设备送来的数据再送到输入井；输出缓冲区暂存从输出井读出的数据再送到输出设备。\n3. 输入进程和输出进程：模拟外围控制机。输入进程把输入设备数据经输入缓冲区送入输入井（CPU 需要输入数据时直接从输入井读）；输出进程把用户程序输出写入输出井，并在输出设备空闲时经输出缓冲区送到输出设备。\n4. 井管理程序：控制作业与磁盘井之间的信息交换。\n\n应用（打印机）：多进程请求打印时系统不把物理打印机分配给它们，而由输出进程①在磁盘输出井中分配空闲盘块存放待打印数据；②申请一张用户请求打印表并挂到假脱机打印队列。用户进程即认为打印完成。打印机空闲时，后台假脱机打印进程按队列取出请求，把输出井数据经内存缓冲区送物理打印机输出——一台物理打印机被虚拟为多台逻辑设备。","keywords":["输入井","输出井","输入缓冲区","输入进程","输出进程","井管理程序","打印机","请求打印表","虚拟设备"],"source":"王道2027版 印刷页 326-327（PDF p338-339）","status":"final"},{"id":"os-ch5-5.3-001","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"磁盘的结构：磁道、扇区、盘面、柱面与磁盘地址","level":"l1","title":"磁盘地址 = 柱面号·盘面号·扇区号","answer":"基本结构：盘面数据存储在一组同心圆中，称磁道；每道划分为数百个扇区，每扇区固定大小（如 1KB），是磁盘寻址的最小物理单位。多个盘片垂直堆叠形成盘组，每个盘面对应一个磁头，所有磁头装在同一磁头臂上同步径向移动；所有盘片上半径相同的磁道构成一个柱面。\n\n磁盘地址用“柱面号·盘面号·扇区号”表示；总存储容量由柱面数、盘面数和每磁道扇区数共同决定。\n\n读/写一个磁盘块的步骤：①按柱面号移动磁头臂定位到目标柱面；②激活对应盘面的磁头；③等待目标扇区旋转到磁头下方完成读/写。\n\n类型：固定头磁盘（每磁道一个固定磁头）/活动头磁盘（磁头可径向移动）；固定盘磁盘（盘片密封不可换）/可换盘磁盘。IBM 1973 年的温彻斯特磁盘（温盘，活动磁头+固定盘片）是现代机械硬盘的雏形。\n\n——\n传统设计：每个磁道扇区数相同，外道周长更大所以线性存储密度低于内道，磁盘存储能力受限于最内道的最大存储密度。\n\n容量计算：存储容量 = 柱面数 × 盘面数（磁头数）× 每磁道扇区数 × 扇区大小。\n\n区域记录（ZBR）：为提高容量并充分利用外层磁道，把盘面划分为若干环带，同一环带内所有磁道扇区数相同，外层环带的磁道扇区数多于内层环带。此时容量须按环带分别计算后相加。","keywords":["磁道","扇区","柱面","盘面","磁盘地址","柱面数×盘面数×扇区数","磁盘容量","ZBR","柱面数"],"source":"王道2027版 印刷页 340-341（PDF p352-353）","status":"final"},{"id":"os-ch5-5.3-002","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"磁盘初始化：低级格式化与扇区结构","level":"l1","title":"低级格式化的内容","answer":"新磁盘只是涂有磁性材料的空白盘。存储数据前必须将其划分为扇区，以便磁盘控制器读/写，这一过程称低级格式化（物理格式化）。\n\n每个扇区通常由头部、数据区域和尾部组成：头部和尾部包含磁盘控制器的使用信息，其中用磁道号、磁头号和扇区号标志一个扇区，用 CRC 字段对扇区进行校验。\n\n大多数磁盘出厂时已完成低级格式化，并建立逻辑块地址到物理扇区的初始映射；控制器在低级格式化时还可指定数据区域大小，常为 256 字节、512 字节或 4KB。","keywords":["低级格式化","物理格式化","扇区头尾","CRC","逻辑块地址映射"],"source":"王道2027版 印刷页 341（PDF p353）","status":"final"},{"id":"os-ch5-5.3-003","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"分区、逻辑格式化与簇","level":"l1","title":"分区与逻辑格式化（高级格式化）","answer":"使用磁盘存储文件前还需两步：\n1. 分区：把磁盘划分为若干逻辑区域（如 C 盘、D 盘），每个分区的起始位置和大小记录在主引导记录 MBR 的分区表中；\n2. 逻辑格式化（高级格式化）：在分区上建立文件系统，包括初始化根目录、创建用于管理空闲与已分配空间的数据结构，并把初始目录置为空。\n\n簇：扇区单位过小，为提高 I/O 效率，操作系统把多个连续扇区组合成一簇（文件系统中也称块）。通常一簇分配给单个文件，故文件占用空间为簇的整数倍；即使文件小于一簇（甚至 0 字节）仍占用一整簇空间。","keywords":["分区","逻辑格式化","高级格式化","MBR","簇","内部碎片"],"source":"王道2027版 印刷页 341-342（PDF p353-354）","status":"final"},{"id":"os-ch5-5.3-004","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"引导块与 MBR 引导过程","level":"l2","title":"引导块与 Windows 引导过程","answer":"自举程序用于初始化 CPU、寄存器、设备控制器和内存等，再定位并加载操作系统内核、跳转到其入口。自举程序通常存放于 ROM；为避免修改自举代码就要换 ROM，一般只在 ROM 中保留小型自举装入程序，而把功能完整的引导程序放在磁盘固定位置的引导块中。含有引导块的磁盘称启动磁盘（系统磁盘）。\n\nWindows 引导过程：磁盘可划分多个分区，其中活动分区（引导分区）含操作系统核心文件。初始引导代码存放在磁盘第 0 号扇区，即主引导记录 MBR。启动时 ROM 中的代码先读取 MBR；除引导代码外，MBR 还包含分区表和一个标志位，用于指明从哪个分区引导；随后系统读取该分区的首扇区（引导扇区），继续加载系统服务与驱动程序。\n\n——\n核心思想：通过软件标记或硬件重映射，确保系统不会使用坏块。按磁盘类型和控制器能力分两种：\n1. 简单磁盘（如 IDE 控制器）：坏块由操作系统在逻辑格式化时检测，例如 MS-DOS 的 Format 命令识别坏扇区并在 FAT 表中标记为不可用。\n2. 现代复杂磁盘：控制器内部维护一份坏块列表，出厂低级格式化时初始化并在使用中动态更新；低级格式化预留部分对操作系统透明的备用扇区，发现坏块时控制器自动将其映射到备用扇区实现逻辑替换，此机制称扇区备用。","keywords":["自举程序","ROM","引导块","MBR","0号扇区","引导扇区","坏块","扇区备用","FAT标记"],"source":"王道2027版 印刷页 342（PDF p354）","status":"final"},{"id":"os-ch5-5.3-005","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"磁盘存取时间：寻道 + 旋转延迟 + 传输","level":"l1","title":"一次磁盘读/写的三部分时间","answer":"一次磁盘读/写操作时间 = 寻道时间 Ts + 旋转延迟时间 Tr + 数据传输时间 Tt。\n\n1. 寻道时间 Ts = m·n + s。n 为跨越的磁道数，m 为跨越每条磁道的时间（约 0.2ms），s 为磁头臂启动时间（约 2ms）。\n2. 旋转延迟 Tr = 1/(2r)（r 为每秒转数），即平均半圈旋转时间。典型转速 5400 转/分 ≈ 旋转一圈 11.1ms，对应 Tr ≈ 5.56ms。\n3. 传输时间 Tt = b/(r·N)（b 为读/写字节数，N 为每磁道字节数，r 为每秒转数）。\n\n总平均存取时间 Ta = Ts + 1/(2r) + b/(rN)。\n\n结论：寻道时间占主导且直接受调度算法影响；旋转延迟与传输时间都与转速成反比，属硬件参数难以优化。因此磁盘调度的主要目标是减少平均寻道时间。","keywords":["寻道时间","旋转延迟","传输时间","1/(2r)","b/(rN)","5400转"],"source":"王道2027版 印刷页 342-343（PDF p354-355）","status":"final"},{"id":"os-ch5-5.3-006","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"FCFS 磁盘调度：例题计算（总移动距离 498，平均 55.3）","level":"l2","title":"FCFS 调度例题与完整计算","answer":"例题（王道 2027 印刷页 343）：磁盘请求队列 55, 58, 39, 18, 90, 160, 150, 38, 184，磁头初始位于磁道 100。\n\nFCFS：按请求先后顺序调度，磁头从 100 出发依次访问 55→58→39→18→90→160→150→38→184。\n\n逐步移动距离（单位：磁道）：\n|100-55|=45\n|55-58|=3\n|58-39|=19\n|39-18|=21\n|18-90|=72\n|90-160|=70\n|160-150|=10\n|150-38|=112\n|38-184|=146\n合计 = 45+3+19+21+72+70+10+112+146 = 498 个磁道。\n平均寻道长度 = 498 / 9 = 55.3 个磁道（除以请求总数 9）。\n\n评价：公平、简单，但平均寻道距离大，仅适用于磁盘 I/O 较少的场合。","keywords":["FCFS","先来先服务","498","55.3","平均寻道长度"],"source":"王道2027版 印刷页 343（PDF p355）","status":"final"},{"id":"os-ch5-5.3-007","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"SSTF 磁盘调度：例题计算（总移动距离 248，平均 27.5）","level":"l2","title":"SSTF 调度例题与饥饿问题","answer":"SSTF：每次选择距离当前磁头位置最近的请求，使单次寻道时间最短。\n\n同题（请求 55, 58, 39, 18, 90, 160, 150, 38, 184，磁头在 100）：\n访问顺序 100→90→58→55→39→38→18→150→160→184（按距离由近及远逐次选择）。\n逐步距离（磁道）：|100-90|=10，|90-58|=32，|58-55|=3，|55-39|=16，|39-38|=1，|38-18|=20，|18-150|=132，|150-160|=10，|160-184|=24。\n总移动距离 = 10+32+3+16+1+20+132+10+24 = 248 个磁道；平均寻道长度 = 248 / 9 = 27.5 个磁道。\n\n评价：性能通常优于 FCFS，但不能保证平均寻道时间最短，可能产生“饥饿”（磁头附近不断出现新请求时，远处磁道长期得不到服务）。","keywords":["SSTF","最短寻道时间优先","248","27.5","饥饿"],"source":"王道2027版 印刷页 343（PDF p355）","status":"final"},{"id":"os-ch5-5.3-008","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"SCAN（电梯）磁盘调度：例题计算（282，平均 31.33）","level":"l2","title":"SCAN 调度例题与完整计算","answer":"规则：磁头仅在到达最外侧磁道后才转向内侧，到达最内侧磁道后才转向外侧（在 SSTF 上加了方向约束），因类似电梯运行故称电梯调度算法。缺点：对最近扫描过的区域不公平，访问局部性不如 FCFS、SSTF。\n\n同题（请求 55, 58, 39, 18, 90, 160, 150, 38, 184，磁头在 100，沿磁道号增大方向移动）：\n访问顺序：100 → 150 → 160 → 184 → 200 → 90 → 58 → 55 → 39 → 38 → 18。\n注意：磁头先撞到端点 200（不服务，仅转向），再折返向内逐一服务。\n逐步距离（磁道）：50，10，24，16，110，32，3，16，1，20。\n总移动距离 = 50+10+24+16+110+32+3+16+1+20 = 282 个磁道；平均寻道长度 = 282 / 9 = 31.33 个磁道。\n\n（若规定到达最外端 200 即折返，则 282 中的 16+110 = 126 由 184→200→90 构成。）\n\n——\nSCAN 和 C-SCAN 中磁头总是严格从磁盘一端移动到另一端；实际可改进：磁头只需移动到当前方向上最远的请求位置即可返回，无须抵达物理端点——分别称 LOOK 调度和 C-LOOK 调度（朝某方向移动前先“查看”该方向是否还有待处理请求）。\n\n本题数据下：LOOK 在增大方向最远只需到 184（不必到 200），到 184 后直接折返向内到 18，省去 16+110 中撞 200 的那一段；C-LOOK 则从 184 直接快速返回到最小请求 18，不回到 0。\n\n结论（必背）：若无特别说明，实际系统中所称的 SCAN 算法和 C-SCAN 算法通常指 LOOK 调度和 C-LOOK 调度。做题时看题目是否给出磁道范围（如 0～200）来判断是否撞端点。","keywords":["SCAN","电梯算法","282","31.33","200","方向","LOOK","C-LOOK","最远请求"],"source":"王道2027版 印刷页 344（PDF p356）","status":"final"},{"id":"os-ch5-5.3-009","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"C-SCAN 磁盘调度：例题计算（390，平均 43.33）","level":"l2","title":"C-SCAN 调度例题与完整计算","answer":"规则：磁头仅沿单一方向移动并提供服务，返回时快速移动到起始端且不处理任何请求；以循环方式均匀处理所有请求，消除对两端磁道请求的不公平。\n\n同题（请求 55, 58, 39, 18, 90, 160, 150, 38, 184，磁头在 100，沿磁道号增大方向移动）：\n访问顺序：100 → 150 → 160 → 184 → 200 →（快速返回到 0）→ 18 → 38 → 39 → 55 → 58 → 90。\n逐步距离（磁道）：50，10，24，16，200，18，20，1，16，3，32。\n总移动距离 = 50+10+24+16+200+18+20+1+16+3+32 = 390 个磁道；平均寻道长度 = 390 / 9 = 43.33 个磁道。\n\n关键点：200 是 184 所在方向端点，返回 0 的这 200 个磁道要计入总距离（回扫不服务但耗时间）。","keywords":["C-SCAN","循环扫描","390","43.33","回扫","不公平性"],"source":"王道2027版 印刷页 344（PDF p356）","status":"final"},{"id":"os-ch5-5.3-010","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"四种磁盘调度算法优缺点（表5.2）与 NStepSCAN/FSCAN（考纲外补充）","level":"l3","title":"FCFS/SSTF/SCAN/C-SCAN 优缺点与磁臂黏着对策","answer":"1. FCFS：优点公平、简单；缺点平均寻道距离大，仅适用于磁盘 I/O 较少的场合。\n2. SSTF：优点性能优于 FCFS；缺点不能保证平均寻道时间最短，可能出现“饥饿”现象。\n3. SCAN：优点寻道性能较好，可避免“饥饿”现象；缺点对远离磁头当前位置一端的请求响应较慢。\n4. C-SCAN：优点消除了对两端磁道请求的不公平性。\n\n记忆线：公平性 FCFS 最好 → SSTF 寻道短但会饿死 → SCAN 解决饥饿但偏袒一端 → C-SCAN 公平但回扫耗时。\n\n考纲外补充——磁臂黏着与两类改进算法：SSTF/SCAN/C-SCAN 可能出现磁臂黏着——磁头长期滞留于被频繁请求的磁道。NStepSCAN 把请求队列分成若干长度为 N 的子队列，子队列间 FCFS、子队列内 SCAN，处理中新请求不插入当前子队列（N 大趋近 SCAN，N=1 退化为 FCFS）；FSCAN 是其简化形式，固定分当前服务队列与下一轮的新请求队列，冻结当前、延后新请求。","keywords":["表5.2","FCFS","SSTF","SCAN","C-SCAN","优缺点","磁臂黏着","NStepSCAN","FSCAN"],"source":"王道2027版 印刷页 345（PDF p357）","status":"final"},{"id":"os-ch5-5.3-011","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"减少延迟时间：扇区交替编号与盘面错位命名","level":"l2","title":"交替编号与错位命名","answer":"问题：磁盘连续旋转，读完一个扇区后系统需时间处理数据才能读下一个；若逻辑相邻块在物理上也相邻，下一个目标扇区可能在处理期间已掠过磁头，只能等近一整圈，造成显著延迟。\n\n两种方法：\n1. 交替编号：对单个盘面的扇区采用交替编号，使逻辑相邻的块在物理布局上保持适当间隔，确保处理完一个扇区后下一个目标扇区恰好转到磁头下方。\n2. 错位命名：所有盘面同步旋转，同一柱面内的块通常按盘面顺序连续存放（盘面0扇区0…盘面0扇区7、盘面1扇区0…）。读不同盘面的连续块时可在不同盘面之间实施错位命名，使处理完盘面0扇区7后盘面1扇区0恰好到达磁头，首次经过即可读取。\n\n总结：“找”的时间（寻道 + 旋转延迟）可由调度算法或布局优化降低；传输时间由磁盘特性决定，难以用软件减少。","keywords":["交替编号","错位命名","旋转延迟","盘面同步","布局优化"],"source":"王道2027版 印刷页 345-346（PDF p357-358）","status":"final"},{"id":"os-ch5-5.3-012","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"提高磁盘 I/O 速度的七种方法","level":"l2","title":"提高磁盘 I/O 速度的方法","answer":"1. 采用磁盘高速缓存；\n2. 调整磁盘请求顺序（即各种磁盘调度算法）；\n3. 提前读：读当前块时把逻辑上紧随其后的块一并预读到内存缓冲区；\n4. 延迟写：修改缓冲区数据时不立即写回磁盘，仅设延迟写标志，缓冲区被替换时才写入，合并多次写操作、减少 I/O 次数；\n5. 优化物理块的分布：尽量把文件所属块安排在同一或相邻磁道，并以簇为单位分配文件，降低磁头平均移动距离；\n6. 虚拟盘（RAM 盘）：用内存空间仿真磁盘，存放临时文件；与磁盘高速缓存的区别是虚拟盘内容完全由用户程序控制，而磁盘高速缓存由操作系统透明管理；\n7. 采用磁盘阵列 RAID：某些 RAID 级别支持交叉存取，能大幅提高磁盘 I/O 速度。","keywords":["磁盘高速缓存","提前读","延迟写","优化物理块分布","虚拟盘","RAID"],"source":"王道2027版 印刷页 346（PDF p358）","status":"final"},{"id":"os-ch5-5.3-013","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"SSD 的结构：闪存翻译层与块/页","level":"l1","title":"固态硬盘的组成与闪存组织","answer":"SSD 是基于闪存技术的存储设备，由一个或多个闪存芯片加闪存翻译层（FTL）组成。闪存芯片替代传统磁盘的机械驱动器；闪存翻译层负责把 CPU 发出的逻辑块读/写请求转换为对底层物理闪存的读/写控制信号，相当于代替了磁盘控制器的角色。\n\n组织：一个闪存芯片由 B 块组成，每块包含 P 页。页大小通常 512B～4KB，每块含 32～128 页，块大小 16KB～512KB。\n\n读写单位与擦除单位：读/写操作以页为单位；擦除操作以块为单位，只有整块被擦除后才能向其中的页写入新数据。块被擦除后，其所有页均可重新写入一次。每个块的擦写次数有限，若干次重复写入后会因磨损而失效。","keywords":["SSD","闪存翻译层","FTL","块","页","以块为单位擦除"],"source":"王道2027版 印刷页 346-347（PDF p358-359）","status":"final"},{"id":"os-ch5-5.3-014","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"SSD 随机写入慢的两个原因及与机械磁盘的对比","level":"l2","title":"SSD 为何随机写慢？与磁盘对比","answer":"随机写入速度较慢的两个原因：\n1. 擦除操作耗时较长，通常比页访问慢一个数量级；\n2. 若要修改一个已含有效数据的页 Pi，必须先将该块中所有有效页复制到一个新的（已擦除的）块中，再执行对 Pi 的写入（写时复制/块级回收）。\n\n相比传统机械磁盘的优势：由半导体器件构成、无机械运动部件，因此随机访问延迟极低，且无噪声、无振动、功耗更低、抗震性强、安全性更高。\n\n缺陷：闪存擦写寿命有限。","keywords":["SSD随机写","擦除","块复制","无机械部件","低延迟"],"source":"王道2027版 印刷页 347（PDF p359）","status":"final"},{"id":"os-ch5-5.3-015","chapter":"第5章 输入/输出管理","section":"5.3 磁盘和固态硬盘","topic":"磨损均衡：动态磨损均衡与静态磨损均衡","level":"l1","title":"磨损均衡（Wear Leveling）","answer":"问题：闪存擦写寿命有限（通常几百至几千次）；不加管理时读/写会集中在少数物理块上，导致这些区域迅速磨损，整块 SSD 因几兆字节闪存损坏而报废（如 256GB 的盘）。\n\n两类磨损均衡：\n1. 动态磨损均衡：写入数据时优先选择擦写次数较少的空闲块，避免反复写同一区域，把负载分散到更多物理块。\n2. 静态磨损均衡（更高级）：即使没有新数据写入，控制器也定期扫描并自动迁移数据，把高磨损块中的有效数据迁到低磨损块，使高磨损块转为以读为主、低磨损块承担更多写入，进一步均衡寿命。\n\n效果举例：256GB、擦写寿命 500 次的 SSD 理论总写入量可达 125TB；即使每天持续写 10GB 也要三十多年才到寿命极限。","keywords":["磨损均衡","动态磨损均衡","静态磨损均衡","擦写寿命","125TB"],"source":"王道2027版 印刷页 347（PDF p359）","status":"final"},{"id":"os-ch5-5.4-001","chapter":"第5章 输入/输出管理","section":"5.4 本章疑难点","topic":"改进设备分配策略：增强设备无关性 + 多通路 I/O","level":"l2","title":"如何提高设备分配的灵活性和成功率","answer":"两个方面改进：\n1. 增强设备无关性：进程用逻辑设备名发起 I/O 请求。系统先从 SDT 查找该类设备的第一个 DCT；若忙则查下一个 DCT；仅当所有同类设备都忙时才挂起进程并加入该类设备的等待队列；只要有一个可用设备就进入后续的安全性检查与分配流程。\n2. 支持多通路 I/O 结构：为避免 I/O 瓶颈，控制器与通道的分配也要逐级尝试——若第一个控制器（或其连接的第一个通道）忙，则尝试下一个；仅当所有相关控制器（或通道）都不可用时分配才失败，进程挂入相应等待队列；只要有一个可用即可完成分配。\n\n结论：有通道的系统中依次访问 SDT→DCT→COCT→CHCT，成功分配须同时满足设备可用、控制器可用、通道可用，故称“设备分配，要过三关”。","keywords":["设备无关性","多通路I/O","SDT→DCT→COCT→CHCT","过三关"],"source":"王道2027版 印刷页 359（PDF p371）","status":"final"},{"id":"os-ch5-5.4-002","chapter":"第5章 输入/输出管理","section":"5.4 本章疑难点","topic":"用户缓冲区与内核缓冲区的定义及作用","level":"l2","title":"用户缓冲区 vs 内核缓冲区","answer":"1. 用户缓冲区：用户进程读文件时预先申请的一块内存区域（如数组），暂存 read 系统调用读到的数据，数据处理完后再发起下一次 read。作用：减少系统调用的次数，从而降低频繁在用户态与内核态之间切换的开销。\n2. 内核缓冲区：操作系统在内核空间中维护的缓冲区。读操作时系统先查内核缓冲区是否已有数据：有则复制到用户缓冲区；没有则发起磁盘 I/O 并挂起当前进程，数据读入内核缓冲区后再复制到用户缓冲区并唤醒进程。写操作时，用户数据通常不立即写盘，而是先写内核缓冲区；累积到一定量或满足刷新条件时才批量写入磁盘。作用：提升磁盘 I/O 的整体效率，尤其对写操作优化效果突出。","keywords":["用户缓冲区","内核缓冲区","系统调用次数","用户态内核态切换","批量写"],"source":"王道2027版 印刷页 359（PDF p371）","status":"final"},{"id":"net-ch1-1.1-001","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"计算机网络的定义三要点（自治、互连、集合体）与 internet / Internet 的名词辨析","level":"l1","title":"计算机网络的定义与 internet 辨析","answer":"【结论】计算机网络是把众多分散的、自治的计算机系统，通过通信设备与线路连接起来，并由功能完善的软件实现资源共享和信息传递的系统。三个关键词：自治计算机、互连、集合体。\n1. 组成要素：网络由若干节点（计算机、集线器、交换机、路由器等）和连接这些节点的链路组成。\n2. 网络与互连网：网络把多台计算机连在一起；互连网（internet）把多个网络通过路由器连接在一起。\n3. internet（互连网）：通用名词，泛指多个计算机网络互连而成的网络，可用任意通信协议，不要求 TCP/IP。\n4. Internet（互联网/因特网）：专用名词，特指当前全球最大的、开放的、由众多网络和路由器互连而成的特定网络，必须采用 TCP/IP 协议族。\n背诵要点：internet 是通称、协议随意；Internet 是特指、必用 TCP/IP。网络连主机，互连网连网络。","keywords":["自治计算机","互连","internet","Internet","TCP/IP","节点","链路"],"source":"王道2027版 印刷页 1（PDF p13）","status":"final"},{"id":"net-ch1-1.1-002","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"从组成部分、工作方式、功能组成三个角度划分计算机网络的组成","level":"l2","title":"计算机网络组成的三个视角","answer":"1. 从组成部分看：硬件（主机、通信链路、交换设备）+ 软件（系统软件与应用工具）+ 协议。协议是计算机网络的核心，规定数据在网络中传输时必须遵循的规则。\n2. 从工作方式看（针对 Internet）：边缘部分由所有连接到互联网、供用户直接使用的主机组成，用于通信与资源共享；核心部分由大量网络及互连这些网络的路由器组成，为边缘部分提供连通性与交换服务。\n3. 从功能组成看：通信子网由传输介质、通信设备及相关网络协议组成，负责数据的传输、交换、控制与存储；资源子网是实现资源共享功能的设备及其软件的集合，向用户提供共享硬件、软件、数据资源的服务。\n背诵要点：边缘是主机、核心是路由器；通信子网管传输，资源子网管共享。","keywords":["边缘部分","核心部分","通信子网","资源子网","协议是核心"],"source":"王道2027版 印刷页 2（PDF p14）","status":"final"},{"id":"net-ch1-1.1-003","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"计算机网络的五大功能及其与具体描述的对应关系","level":"l3","title":"计算机网络的五大功能","answer":"1. 数据通信：最基本且最重要的功能，实现联网计算机之间各种信息的传输（文件传输、电子邮件等）。\n2. 资源共享：软件、数据或硬件的共享，提高资源利用率。\n3. 分布式处理：某台计算机负荷过重时，把复杂任务分给其他计算机，利用空闲资源提高系统利用率。\n4. 提高可靠性：各台计算机可通过网络互为备份。\n5. 负载均衡：把工作任务均衡分配给各台计算机，避免某些过载而其他闲置。\n背诵要点：最基本的是数据通信；\"互为备份\"对应提高可靠性，\"避免过载与闲置\"对应负载均衡。","keywords":["数据通信","资源共享","分布式处理","提高可靠性","负载均衡"],"source":"王道2027版 印刷页 2-3（PDF p14-15）","status":"final"},{"id":"net-ch1-1.1-004","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"电路交换的三个阶段、四条优点与四条缺点，以及其适用场景","level":"l1","title":"电路交换的过程与优缺点","answer":"【结论】电路交换分三个阶段：建立连接（占用通信资源）、传输数据（持续占用）、释放连接（归还资源）。通信前必须建立一条端到端专用物理通路，通信中始终被双方独占。\n优点：\n1. 通信时延小：线路专用、数据直达，传输效率高。\n2. 有序传输：数据按发送顺序传送，不存在失序问题。\n3. 没有冲突：不同通信对使用独立信道，不争用物理信道。\n4. 实时性强：通路一旦建立，双方即可随时通信。\n缺点：\n1. 建立连接时间长，对计算机通信而言过长。\n2. 线路利用率低：通路被双方独占，空闲时也不能给别人用。\n3. 灵活性差：通路中任一节点或链路故障，都需重新建立连接。\n4. 难以实现差错控制：中间节点不具备存储和检错能力。\n适用：低频次、连续且大量的数据传输。计算机通信是突发式的，采用电路交换时线路利用率往往不足 10%，甚至低于 1%。\n背诵要点：电路交换\"先建路、独占走、不检错\"；时延最小、利用率最低、有序到达。","keywords":["电路交换","建立连接","独占","线路利用率","有序传输","不支持差错控制"],"source":"王道2027版 印刷页 3（PDF p15）","status":"final"},{"id":"net-ch1-1.1-005","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"报文交换的存储转发原理及其优缺点","level":"l2","title":"报文交换的原理与优缺点","answer":"【结论】报文交换把用户数据加上源地址、目的地址等控制信息封装成报文，采用存储转发：整个报文先完整传到相邻节点并存储，节点再查转发表转发到下一跳，逐跳直至目的端；每个报文可独立选择路径。\n优点：\n1. 无建立和释放连接的时延，用户可随时发送报文。\n2. 线路分配灵活：可选取当前最优空闲链路；某路径故障可动态切换。\n3. 线路利用率高：报文只在一段链路上传输时才占用该段资源。\n4. 支持差错控制：节点可对缓存中的报文进行差错检验。\n缺点：\n1. 存储转发时延高：必须完整接收整个报文后才能开始转发。\n2. 缓存开销大：报文大小没有限制，节点需配大容量缓存。\n3. 错误处理低效：报文越长出错概率越大，重传整个报文代价大。\n背诵要点：报文交换\"整存整转\"，省了建链时间却换来大缓存和大时延。","keywords":["报文交换","存储转发","报文","缓存开销","支持差错控制"],"source":"王道2027版 印刷页 3-4（PDF p15-16）","status":"final"},{"id":"net-ch1-1.1-006","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"分组交换的构成、相对报文交换的三点改进与三条缺点","level":"l1","title":"分组交换的原理与优缺点","answer":"【结论】分组交换同样采用存储转发，但先把长报文划分成若干较小的等长数据段，每段加首部（源/目的地址、分组编号等）构成分组，再逐跳存储转发。\n相比报文交换的改进：\n1. 便于存储管理、转发开销小：分组长度固定且有最大长度，缓冲区可预设。\n2. 传输效率高：分组可逐个发送，实现流水线操作，后一个分组的接收可与前一个分组的转发并行。\n3. 降低出错概率与重传代价：分组短，出错概率小，重传数据量小，既提高可靠性又降低传输时延。\n缺点：\n1. 仍存在存储转发时延，且要求节点交换机处理能力更强。\n2. 需传输额外控制信息，传送的信息量增大约 5%～10%。\n3. 分组可能失序、丢失或重复：数据报服务下可能经不同路径到达，需目的主机按编号重排；虚电路服务虽有序，但要经历连接建立、数据传输、连接释放三阶段。\n背诵要点：分组交换 = 报文交换 + 定长小分组 + 流水线；对报文交换的改进直接结果是减少传输时延、降低误码重传代价。","keywords":["分组交换","分组","首部","流水线","失序","5%～10%"],"source":"王道2027版 印刷页 4（PDF p16）","status":"final"},{"id":"net-ch1-1.1-007","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"三种交换方式在时间、时延、建链、缓存、差错、有序性、控制信息、灵活性、利用率九个维度的对比","level":"l1","title":"三种交换方式特性对比","answer":"按\"电路交换／报文交换／分组交换\"顺序逐项对比：\n1. 完成传输所需时间：最少／最多／较少。\n2. 存储转发时延：无／高／较低。\n3. 通信前是否需建立连接：是／否／否。\n4. 节点缓存开销：无／高／低。\n5. 是否支持差错控制：不支持／支持／支持。\n6. 数据是否有序到达：是／是／否。\n7. 是否需额外控制信息：否／是／是（且占比较大）。\n8. 线路分配灵活性：不灵活／灵活／非常灵活。\n9. 线路利用率：低／高／非常高。\n背诵要点：电路交换是唯一\"无缓存、无存储转发时延、保证有序、但不支持差错控制\"的；分组交换是唯一\"可能失序\"的。","keywords":["三种交换方式对比","存储转发时延","有序到达","差错控制","线路利用率"],"source":"王道2027版 印刷页 5（PDF p17）","status":"final"},{"id":"net-ch1-1.1-008","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"分组交换网总时间的流水线公式 T = k·r + (m-1)·r 及 2010、2013 真题套用","level":"l1","title":"分组交换总时间公式（流水线）","answer":"【结论】设源主机到目的主机经过 k 段链路（k-1 个分组交换机），每段链路发送时延为 r，共 m 个分组，且各链路速率相同、忽略传播/处理/排队时延，则总时间 T = k·r + (m-1)·r。\n含义：第一个分组\"流出流水线\"需 k·r，此后每隔 r 时间就有一个分组流出。\n【2010 真题】链路 100Mb/s，分组 1000B（首部 20B），文件 980000B：每组有效数据 980B，分组数 980000÷980 = 1000；r = 1000B×8b÷100Mb/s = 0.08ms；最短路径 3 段链路，T = 3×0.08 + (1000-1)×0.08 = 80.16ms。\n【2013 真题】两段链路各 10Mb/s，分组 10kb，报文 8Mb：m = 8Mb÷10kb = 800，r = 10kb÷10Mb/s = 1ms，T = 2×1 + (800-1)×1 = 801ms；报文交换为 8Mb÷10Mb/s×2 = 1600ms。\n背诵要点：先算单段发送时延 r，再用\"链路段数×r +（分组数-1）×r\"；分组数别忘按有效数据算。","keywords":["流水线","T=k·r+(m-1)·r","发送时延r","2010真题","2013真题","80.16ms","801ms"],"source":"王道2027版 印刷页 7-8（PDF p19-20）","status":"final"},{"id":"net-ch1-1.1-009","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"同一场景下电路、报文、分组三种交换的总时间计算与大小关系（2013、2025 真题）","level":"l2","title":"三种交换方式的时间比较","answer":"【结论】小数据量时电路交换可能因建链时间吃亏；数据量大、链路速率逐段提高时，分组交换靠流水线反超报文交换。\n1. 2013 真题（2 段链路、10Mb/s、报文 8Mb、分组 10kb）：报文交换 1600ms，分组交换 801ms。\n2. 2025 真题（H1—10Mb/s—R1—100Mb/s—R2—1000Mb/s—H2，文件 2MB，分组 400B，建链 32μs）：\n电路交换：Tcs = 32μs + 2MB×8b÷10Mb/s = 32μs + 1.6s ≈ 1.600032s。\n报文交换：Tms = 2MB÷10Mb/s + 2MB÷100Mb/s + 2MB÷1000Mb/s = 1.6 + 0.16 + 0.016 = 1.776s。\n分组交换：分组数 2MB÷400B = 5000；首分组逐跳发送时延 400B÷10Mb/s + 400B÷100Mb/s + 400B÷1000Mb/s = 320 + 32 + 3.2 = 355.2μs，此后每 320μs 到达一个分组，Tps ≈ 1.6s + 35.2μs。\n3. 结论：Tms \u003e Tps \u003e Tcs。分组数足够多时，流水线收益抵掉了额外首部与存储转发开销。\n背诵要点：报文交换要多花\"逐跳重复发送整份数据\"的时间；分组交换只多花最后一个分组走完全程的时间。","keywords":["2013真题","2025真题","电路交换时间","报文交换时间","Tms\u003eTps\u003eTcs","流水线收益"],"source":"王道2027版 印刷页 13-15（PDF p25-27）","status":"final"},{"id":"net-ch1-1.1-010","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"按分布范围分类（WAN/MAN/LAN/PAN）的覆盖范围与典型技术","level":"l3","title":"按分布范围分类：WAN/MAN/LAN/PAN","answer":"1. 广域网（WAN）：长距离通信，覆盖几十至数千千米，常用于构建互联网骨干部分；节点交换机间通过高速链路互联，通信容量大。\n2. 城域网（MAN）：覆盖几个街区乃至整个城市，直径约 5～50km；目前大多采用以太网技术，有时被归入局域网讨论范畴。\n3. 局域网（LAN）：覆盖几十米到几千米，主机通过高速线路互连；传统上局域网采用广播技术，广域网采用交换技术。\n4. 个人区域网（PAN）：在个人工作或活动区域内用无线技术把消费电子设备互连，也称无线个人区域网（WPAN）。\n背诵要点：广域网、城域网、局域网的划分依据是覆盖范围（作用范围），不是拓扑或介质。","keywords":["广域网","城域网","局域网","个人区域网","覆盖范围","5～50km"],"source":"王道2027版 印刷页 5-6（PDF p17-18）","status":"final"},{"id":"net-ch1-1.1-011","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"总线形、星形、环形、网状四种拓扑的结构特点与优缺点","level":"l3","title":"四种网络拓扑结构","answer":"网络拓扑结构指节点与通信线路之间的几何排列关系，主要描述通信子网的结构。\n1. 总线形：用单根传输线连接所有计算机。优点建网容易、增减节点方便、节省线路；缺点重负载下通信效率低，总线任意一处故障都影响全网。\n2. 星形：各终端通过独立线路连接到中央设备（交换机或路由器）。优点便于集中控制与管理；缺点成本较高，中央设备对故障敏感。\n3. 环形：所有计算机接口设备连成闭合环路，信号沿环单向传输，典型是令牌环局域网；可单环或双环以提高可靠性。\n4. 网状：每个节点一般至少两条路径与其他节点相连，广泛用于广域网。优点可靠性高、容错能力强；缺点控制复杂、线路成本高。\n归属：总线形、星形、环形多用于局域网，网状多用于广域网。\n背诵要点：拓扑看\"通信子网怎么连\"；网状最可靠也最贵，星形怕中心节点故障。","keywords":["总线形","星形","环形","网状","拓扑结构","通信子网"],"source":"王道2027版 印刷页 6（PDF p18）","status":"final"},{"id":"net-ch1-1.1-012","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"速率的概念与单位换算：数据量用 2 的幂、速率用 10 的幂","level":"l1","title":"速率与 k/M/G 的两种口径","answer":"【结论】速率（数据传输速率、数据率、比特率）指节点在数字信道上发送数据的速率，单位 bit/s（b/s，也写作 bps）。\n单位口径要分清：\n1. 描述数据量时，K、M、G 用 2 的幂：1Kb = 2^10 b = 1024b，1MB = 2^20 B。\n2. 描述速率时，k、M、G 用 10 的幂：1kb/s = 10^3 b/s，1Mb/s = 10^6 b/s，1Gb/s = 10^9 b/s。\n3. 书写习惯：数据量用大写 K，速率用小写 k，其余前缀均大写。\n背诵要点：算传输时间、带宽一律按 10 的幂；算数据量、存储容量按 2 的幂（题目另有说明除外）。1B = 8b。","keywords":["速率","比特率","b/s","2的幂","10的幂","1B=8b"],"source":"王道2027版 印刷页 7（PDF p19）","status":"final"},{"id":"net-ch1-1.1-013","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"带宽与吞吐量的区别，以及瓶颈链路决定实际速率","level":"l1","title":"带宽、吞吐量与瓶颈链路","answer":"【结论】带宽是\"能力上限\"，吞吐量是\"实际流量\"。\n1. 带宽：通信领域指通信线路允许通过的信号频率范围，单位 Hz；计算机网络中指数字信道所能支持的最高数据传输速率，单位 b/s。\n2. 吞吐量：单位时间内通过某个网络（或信道、接口）的实际数据量，用于测量真实可达到的传输能力。\n3. 瓶颈：节点间实际可用带宽由双方网卡性能、各段链路带宽、交换设备速率中的最小值决定；端到端吞吐量由路径中带宽最小的链路（瓶颈）决定。\n【2024 真题】H1、H2 各自接路由器的链路均为 10Mb/s，中间链路为 1000Mb/s 或 100Mb/s 时，吞吐量都约为 10Mb/s；中间有一段 1Mb/s 时，吞吐量约为 1Mb/s。\n背诵要点：看到\"最高理论速率\"\"最大吞吐量\"，就取路径上所有环节带宽的最小值。","keywords":["带宽","吞吐量","瓶颈链路","最小带宽","2024真题"],"source":"王道2027版 印刷页 7、14（PDF p19、p26）","status":"final"},{"id":"net-ch1-1.1-014","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"总时延的四个组成部分及各自的公式","level":"l1","title":"时延的四个组成部分","answer":"【结论】总时延 = 发送时延 + 传播时延 + 处理时延 + 排队时延。\n1. 发送时延（也称传输时延）= 分组长度 ÷ 发送速率。节点把分组的所有比特推入链路所需时间，从第一个比特开始发送到最后一个比特发送完毕。\n2. 传播时延 = 信道长度 ÷ 电磁波在信道上的传播速率。一个比特从链路一端传播到另一端所需时间。\n3. 处理时延：分组在交换节点为存储转发而做必要处理（解析首部、差错检验、查找路由）的时间。\n4. 排队时延：分组在路由器输入队列或输出队列中等待处理或转发的时间。\n考试中通常只考虑发送时延和传播时延，除非题目另有说明。\n背诵要点：发送时延看\"分组多长、网卡多快\"；传播时延看\"链路多长、介质多快\"。","keywords":["发送时延","传播时延","处理时延","排队时延","总时延"],"source":"王道2027版 印刷页 7（PDF p19）","status":"final"},{"id":"net-ch1-1.1-015","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"发送时延与传播时延的辨析，以及两段链路的三种场景总时延计算","level":"l1","title":"发送时延 vs 传播时延（含例题）","answer":"【辨析】发送时延取决于分组长度和发送速率，与链路长短无关；传播时延取决于链路距离和传输介质，与分组大小无关。\n【例题】两段链路速率分别为 100Mb/s、80Mb/s，主机 A 向 B 发送 1000B 的分组：\n发送时延1 = 1000B×8b ÷ 100Mb/s = 0.08ms；发送时延2 = 1000B×8b ÷ 80Mb/s = 0.1ms。\n场景一（忽略传播、处理、排队时延）：总时延 = 0.08 + 0.1 = 0.18ms。\n场景二（链路 1、2 传播时延分别为 0.01ms、0.05ms）：0.01 + 0.08 + 0.05 + 0.1 = 0.24ms。\n场景三（再加路由器处理与排队共 0.04ms）：0.01 + 0.08 + 0.04 + 0.05 + 0.1 = 0.28ms。\n背诵要点：一段链路上\"发送\"与\"传播\"可以重叠；分段算发送时延再逐段相加，别漏掉中间节点那一段。","keywords":["发送时延","传播时延","0.18ms","0.24ms","0.28ms","分组长度"],"source":"王道2027版 印刷页 7-8（PDF p19-20）","status":"final"},{"id":"net-ch1-1.1-016","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"时延带宽积的定义、管道模型与 2023 真题的求法","level":"l1","title":"时延带宽积","answer":"【结论】时延带宽积 = 传播时延 × 信道带宽，表示发送端发出的第一个比特即将到达接收端时，发送端已发出的比特总数，即\"以比特为单位的链路长度\"。\n管道模型：把链路看作圆柱形管道，长度表示传播时延，横截面积表示链路带宽，时延带宽积就是管道能容纳的比特数。\n【2023 真题】两段链路各 100Mb/s，单向时延带宽积均为 1000b，文件 1MB、分组 1000B：\n单段传播时延 = 1000b ÷ 100Mb/s = 0.01ms；分组数 = 1MB÷1000B = 1000；单段发送时延 = 1000B×8b÷100Mb/s = 0.08ms。\n前 999 个分组用 999×0.08 = 79.92ms；最后一个分组还要走 (0.08+0.01)×2 = 0.18ms；合计 80.10ms。\n背诵要点：时延带宽积是\"在途比特数\"；已知它求传播时延时，用 时延带宽积 ÷ 带宽。","keywords":["时延带宽积","传播时延","管道模型","在途比特","2023真题","80.10ms"],"source":"王道2027版 印刷页 8、14（PDF p20、p26）","status":"final"},{"id":"net-ch1-1.1-017","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"RTT 的组成，以及它不包括数据分组的发送时延这一关键点","level":"l2","title":"往返时延 RTT","answer":"【结论】往返时延（RTT）指从发送端发出一个短分组，到收到接收端返回的确认信号所经历的总时间。\n组成：发送端与接收端之间的往返传播时延 + 接收端的处理时延；在互联网环境中还包括各中间节点的处理时延和排队时延。\n关键：RTT 不包括数据分组本身的发送时延（通常也忽略确认分组的发送时延）。\n背诵要点：RTT 是\"一来一回的传播加处理\"；算 RTT 时把发送时延排除在外，别与单向时延混为一谈。","keywords":["RTT","往返时延","传播时延","处理时延","不含发送时延"],"source":"王道2027版 印刷页 8（PDF p20）","status":"final"},{"id":"net-ch1-1.1-018","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.1 计算机网络概述","topic":"信道利用率的公式，以及利用率过高导致排队时延与拥塞","level":"l3","title":"信道利用率","answer":"【结论】信道利用率 = 有数据通过的时间 ÷ (有数据通过的时间 + 无数据通过的时间)，即信道有数据通过的时间占总时间的百分比。\n并非越高越好：过低会浪费网络资源；过高会使排队时延显著增加，引发网络拥塞（如同公路上车流量过大时容易堵车）。\n背诵要点：利用率与排队时延是一对矛盾，追求接近 100% 的利用率反而会把时延推得很高。","keywords":["信道利用率","排队时延","网络拥塞"],"source":"王道2027版 印刷页 9（PDF p21）","status":"final"},{"id":"net-ch1-1.2-001","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"体系结构与实现的区别、分层的目标与五条分层原则","level":"l2","title":"网络体系结构与分层原则","answer":"【结论】计算机网络的各层及其协议的集合称为网络的体系结构（Architecture），它是对该网络及其应完成功能的精确定义。体系结构是抽象的，实现（Implementation）是具体的——这些功能究竟由何种硬件或软件实现，属于实现问题，不由体系结构规定。\n分层的目标：把庞大复杂的问题转换为若干较小的局部问题；提供标准语言、定义标准界面、增加功能之间的独立性。注意\"定义功能执行的方法\"不是分层目标（那属于实现）。\n分层的基本原则：\n1. 每层实现一种相对独立的功能，降低系统复杂度。\n2. 各层之间接口清晰简洁，相互依赖尽可能少。\n3. 各层功能的定义独立于具体实现方法。\n4. 保持下层对上层的独立性，上层单向使用下层提供的服务。\n5. 整个分层结构应有利于标准化工作。\n背诵要点：体系结构 = 层次 + 各层功能 + 协议，不含实现细节；分层目标是\"独立、界面、标准\"。","keywords":["体系结构","实现","分层原则","抽象","标准化"],"source":"王道2027版 印刷页 15（PDF p27）","status":"final"},{"id":"net-ch1-1.2-002","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"实体、对等层、对等实体、服务提供者与服务用户的概念","level":"l2","title":"实体与对等实体","answer":"1. 实体：第 n 层的活动元素，指任何可发送或接收信息的硬件或软件进程，通常是某个特定的软件模块（也可以是程序、子程序或设备）。\n2. 对等层与对等实体：不同机器上的同一层称为对等层，同一层的实体互为对等实体。\n3. 第 n 层向第 n+1 层提供的服务，实际上是其自身及以下所有层所提供服务的总和。\n4. 第 n 层的实体称为服务提供者，第 n+1 层的实体称为服务用户。\n背诵要点：实体是\"层里的活动元素\"；协议只在\"对等实体\"之间存在，上下层之间叫服务。","keywords":["实体","对等层","对等实体","服务提供者","服务用户"],"source":"王道2027版 印刷页 15（PDF p27）","status":"final"},{"id":"net-ch1-1.2-003","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"PDU、SDU、PCI 的定义与 n-SDU + n-PCI = n-PDU 的封装关系式","level":"l1","title":"PDU、SDU、PCI 的关系","answer":"【结论】n-SDU + n-PCI = n-PDU = (n-1)-SDU。\n1. 协议数据单元（PDU）：对等层之间传送的数据单位，第 n 层的 PDU 记作 n-PDU，由服务数据单元和协议控制信息两部分组成。\n2. 服务数据单元（SDU）：相邻层之间交换的数据单位，第 n 层的 SDU 记作 n-SDU。\n3. 协议控制信息（PCI）：用于控制协议操作的信息，第 n 层的 PCI 记作 n-PCI（即本层加的首部）。\n封装过程：把从第 n+1 层收到的 PDU 当作第 n 层的 SDU，加上第 n 层的 PCI 封装成第 n 层 PDU，再交给第 n-1 层作为其 SDU；接收方做相反处理。\n背诵要点：\"加首部\"就是 SDU 加 PCI 变 PDU；上层的 PDU 就是下层的 SDU。","keywords":["PDU","SDU","PCI","封装","n-SDU+n-PCI=n-PDU"],"source":"王道2027版 印刷页 15-16（PDF p27-28）","status":"final"},{"id":"net-ch1-1.2-004","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"网络协议的三要素：语法、语义、同步（时序），以及各自的判断依据","level":"l1","title":"协议三要素：语法、语义、同步","answer":"【结论】协议是为在网络中进行数据交换而建立的规则、标准或约定，是控制对等实体之间通信的规则集合；由语法、语义、同步三部分组成。\n1. 语法：规定数据与控制信息的格式。例如 TCP 报文段的首部格式（字段如何排布）由语法定义。\n2. 语义：规定需要发出何种控制信息、完成何种动作、做出何种应答。例如三次握手每一步执行什么操作。\n3. 同步（时序）：规定执行各种操作的条件及事件发生的先后顺序。例如四次挥手 FIN、ACK、FIN、ACK 的先后关系，或图中发送方与接收方按特定顺序交互。\n背诵要点：看到\"格式/首部结构\"答语法；看到\"做什么、应答什么\"答语义；看到\"先后顺序、时序图\"答同步。","keywords":["协议","语法","语义","同步","时序","三次握手","四次挥手"],"source":"王道2027版 印刷页 16（PDF p28）","status":"final"},{"id":"net-ch1-1.2-005","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"服务访问点 SAP 的含义、不可跨层定义接口，以及各层 SAP 的具体形式","level":"l2","title":"接口与服务访问点 SAP","answer":"【结论】同一节点内相邻两层实体交换信息的逻辑接口称为服务访问点（SAP）；第 n 层的 SAP 即第 n+1 层访问第 n 层服务的入口。\n1. 每层只能与紧邻的上下层定义接口，不允许跨层定义接口；服务通过 SAP 提供给上层。\n2. 各层 SAP 的具体形式（5 层结构）：数据链路层的 SAP 为帧的\"类型\"字段；网络层的 SAP 为 IP 数据报的\"协议\"字段；传输层的 SAP 为\"端口号\"字段；应用层的 SAP 为\"用户接口\"。\n背诵要点：SAP 是层与层之间的\"门\"，只能开在相邻层之间；传输层靠端口号区分上层进程。","keywords":["SAP","服务访问点","接口","端口号","不能跨层"],"source":"王道2027版 印刷页 16-17、27（PDF p28-29、p39）","status":"final"},{"id":"net-ch1-1.2-006","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"协议是水平的、服务是垂直的，以及协议与服务的三点本质区别","level":"l2","title":"协议水平、服务垂直","answer":"【结论】协议是水平的，服务是垂直的。\n1. 协议：控制对等实体之间通信的规则集合，是水平的。不对等实体之间不存在协议——节点 A 的传输层与节点 B 的传输层之间有协议，A 的传输层与 B 的网络层之间没有协议。\n2. 服务：下层为紧邻的上层提供的功能调用，是垂直的，由下层通过层间接口向上层提供。\n3. 三点区别：只有本层协议正确实现，才能向上一层提供服务；上层的服务用户只能感知服务，看不到底层协议细节，即下层协议对上层透明；并非某层完成的全部功能都称为服务，只有能被上层实体感知并调用的功能才构成服务。\n背诵要点：协议是\"同级怎么谈\"，服务是\"下层给什么\"；服务对上层透明。","keywords":["协议水平","服务垂直","对等实体","透明","功能调用"],"source":"王道2027版 印刷页 17（PDF p29）","status":"final"},{"id":"net-ch1-1.2-007","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"服务的三种分类：面向连接/无连接、可靠/不可靠、有应答/无应答","level":"l3","title":"服务的三种分类","answer":"1. 面向连接服务与无连接服务：\n面向连接服务要求通信双方传输前先建立连接并分配资源（如缓冲区），传输结束后释放连接与资源，全过程含连接建立、数据传输、连接释放三阶段，以保障可靠性。\n无连接服务无须预先建立连接，直接发送含目的地址的分组，由网络动态选路、各分组独立传输，通常称为\"尽最大努力交付\"，属于不可靠服务。\n2. 可靠服务与不可靠服务：可靠服务具备检错、纠错和应答机制，确保数据正确、完整、有序送达；不可靠服务只提供\"尽最大努力交付\"，可靠性需由高层保障（接收方校验、出错通知重传）。\n3. 有应答服务与无应答服务：有应答服务由传输系统自动向发送方返回应答（如文件传输）；无应答服务不自动应答，需高层协议或应用实现（如 WWW 客户端收到网页后不回应答）。\n背诵要点：面向连接不等于可靠（连接服务也可能出错重传）；可靠与否看有无检错、纠错、应答机制。","keywords":["面向连接服务","无连接服务","可靠服务","不可靠服务","有应答服务","尽最大努力交付"],"source":"王道2027版 印刷页 17（PDF p29）","status":"final"},{"id":"net-ch1-1.2-008","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"OSI 七层的层名、各层一句话功能，以及 Hub/Switch/Router 的最高工作层","level":"l1","title":"OSI 七层结构与各层功能","answer":"【结论】OSI/RM 由 ISO 提出，共 7 层，自下而上：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。\n1. 物理层：透明传输比特流，规定接口的机械、电气特性与信号编码。\n2. 数据链路层：把可能出错的物理连接改造为逻辑上无差错的数据链路，成帧、差错控制、流量控制。\n3. 网络层：分组从源主机到目的主机，路由选择、拥塞控制、差错控制、网际互联。\n4. 传输层：进程到进程（端到端）通信，连接管理、可靠传输、流量控制、复用分用。\n5. 会话层：会话管理（建立、维护、终止）与同步，用检查点实现\"断点续传\"。\n6. 表示层：数据格式转换、压缩、加密与解密。\n7. 应用层：用户与网络的接口，协议最丰富、最复杂。\n设备最高工作层：集线器（Hub，多端口中继器）在物理层；以太网交换机（Switch，多端口网桥）在数据链路层；路由器（Router）在网络层。\n背诵要点：自下而上第 5 层是会话层；设备\"集线器 1、交换机 2、路由器 3\"。","keywords":["OSI参考模型","七层","会话层","表示层","集线器","交换机","路由器"],"source":"王道2027版 印刷页 17-20（PDF p29-32）","status":"final"},{"id":"net-ch1-1.2-009","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"物理层的传输单位、机械与电气特性，以及传输介质不属于物理层协议、物理层不做流量控制","level":"l2","title":"物理层的功能","answer":"【结论】物理层的传输单位是比特，功能是在物理介质上为数据端设备透明地传输原始比特流。\n1. 规定接口的机械特性（形状、尺寸等）和电气特性（引脚数量与排列等），如笔记本电脑上的网线接口。\n2. 规定链路上的编码意义与电气特征：若约定信号 X 表示比特 0，则发送方发出 X 代表 0，接收方收到 X 即解读为 0。\n3. 注意：传输所用的物理介质（双绞线、光缆、无线信道等）不属于物理层协议范畴，位于其下方，有人称之为\"第 0 层\"。\n4. 物理层不做流量控制（避免快速发送方\"淹没\"慢速接收方属于数据链路层或传输层的功能）；物理层也没有下一层，因此不参与封装。\n背诵要点：物理层只\"透明传比特\"，管机械与电气特性，不管流量、差错和封装。","keywords":["物理层","比特","机械特性","电气特性","传输介质","第0层"],"source":"王道2027版 印刷页 18（PDF p30）","status":"final"},{"id":"net-ch1-1.2-010","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"数据链路层的成帧、差错控制、流量控制与介质访问控制，以及它只管相邻节点","level":"l2","title":"数据链路层的功能","answer":"【结论】数据链路层的传输单位是帧，作用是把物理层提供的可能出错的物理连接改造为逻辑上无差错的数据链路，把网络层交来的分组封装成帧并可靠送到相邻节点。\n1. 差错控制：噪声干扰可能使比特翻转（0 误判为 1），差错控制机制可检测差错并丢弃错误帧。\n2. 流量控制：协调收发速率，防止接收方丢弃来不及接收的帧。\n3. 介质访问控制：广播式网络的数据链路层还需解决对共享信道的访问控制问题。\n4. 层次定位：数据链路层实现节点到节点（点到点）通信，基于 MAC 地址；不做拥塞控制（拥塞控制在网络层与传输层）；物理寻址、组帧、差错检验、数据重发都是它的职责。\n背诵要点：数据链路层 = 成帧 + 差错控制 + 流量控制 + 介质访问控制；管\"相邻节点\"，不管\"端到端\"。","keywords":["数据链路层","帧","差错控制","流量控制","介质访问控制","MAC地址"],"source":"王道2027版 印刷页 18（PDF p30）","status":"final"},{"id":"net-ch1-1.2-011","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"网络层的路由选择、拥塞控制等功能，以及 OSI 网络层同时支持两种服务","level":"l2","title":"网络层的功能","answer":"【结论】网络层的传输单位是数据报（分组），主要任务是把分组从源主机传送到目的主机，为不同主机提供通信服务。\n核心功能：路由选择、拥塞控制、差错控制、流量控制、网际互联。\n1. 路由选择：网络中存在多条路径，网络层用路由算法选择合适的路径。\n2. 流量控制：协调源主机与目的主机的收发速率（与数据链路层的流量控制类似，但对象是主机）。\n3. 拥塞控制：网络节点因过载大量丢弃分组时网络处于拥塞状态，需采取措施缓解。\n4. 差错控制：通过检错机制确保向上层提交的都是无差错分组，无法纠正则丢弃。\n服务类型：OSI 网络层既提供有连接的虚电路服务，又提供无连接的数据报服务。\n注意：无论哪一层的协议数据单元，均可笼统称为\"分组\"；网络层实现主机到主机通信（基于 IP 地址）。\n背诵要点：网络层管\"选路 + 主机到主机\"；OSI 网络层双服务，TCP/IP 网际层只有无连接。","keywords":["网络层","路由选择","拥塞控制","网际互联","虚电路","数据报"],"source":"王道2027版 印刷页 18-19（PDF p30-31）","status":"final"},{"id":"net-ch1-1.2-012","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"传输层的端到端通信、复用与分用，以及三层地址（MAC/IP/端口）的分工","level":"l1","title":"传输层：端到端与复用分用","answer":"【结论】传输层负责不同主机中进程之间的端到端通信，提供连接管理、可靠传输、流量控制、差错控制等服务。\n1. 复用：多个应用进程可同时使用传输层的服务。\n2. 分用：传输层把接收到的数据准确交付给对应的上层进程。\n3. 三层地址分工：数据链路层实现节点到节点通信（基于 MAC 地址）；网络层实现主机到主机通信（基于 IP 地址）；传输层实现端到端通信（基于端口号）。\n4. 服务差异：OSI 传输层仅提供面向连接的可靠服务；TCP/IP 传输层同时支持 TCP（面向连接、可靠）与 UDP（无连接、不可靠）。\n背诵要点：自下而上第一个提供端到端服务的是传输层；端口号就是传输层的\"地址\"。","keywords":["传输层","端到端","复用","分用","端口号","MAC地址","IP地址"],"source":"王道2027版 印刷页 19（PDF p31）","status":"final"},{"id":"net-ch1-1.2-013","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"会话层的会话管理与检查点、表示层的格式转换与加密压缩、应用层的定位","level":"l2","title":"会话层、表示层、应用层","answer":"1. 会话层：管理不同主机上进程之间的会话（Session），包括建立、维护和终止会话连接；为表示层或用户进程提供同步机制（SYN），支持在连接上有序传输数据；引入检查点功能——通信中断时可从最近的检查点恢复会话，实现类似\"断点续传\"的可靠性。\n2. 表示层：解决异构系统间信息表示不一致的问题，用标准抽象语法定义数据结构，通过标准编码（如 ASN.1）实现跨平台数据交换；数据压缩、加密与解密也由该层处理。\n3. 应用层：OSI 的最高层，作为用户与网络的接口，为文件传输、邮件、浏览等各类应用提供访问网络环境的手段；应用类型多样，故应用层协议最丰富、最复杂。\n背诵要点：检查点/同步/会话恢复→会话层；格式转换、压缩、加密→表示层；应用层只提供\"接口与协议\"。","keywords":["会话层","检查点","同步","表示层","格式转换","加密","应用层"],"source":"王道2027版 印刷页 19（PDF p31）","status":"final"},{"id":"net-ch1-1.2-014","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"流量控制、差错控制、拥塞控制分别由哪些层提供（\"相邻节点\"与\"端到端\"的判别）","level":"l2","title":"三种控制功能的层次归属","answer":"1. 流量控制：可存在于数据链路层及其之上的各层，主要提供者是数据链路层（相邻节点间）、网络层（全网调节）、传输层（端到端）。题目问\"两个相邻节点间的流量控制\"答数据链路层；问\"端到端\"答传输层。\n2. 差错控制：物理层负责正确透明地传输比特流；数据链路层做帧的差错检验（可丢弃错误帧、重发）；网络层通过检错确保向上提交无差错分组，不能纠正则丢弃；传输层做端到端的差错控制。\n3. 拥塞控制：只有网络层与传输层才有，数据链路层没有。\n补充：OSI 中\"网络层支持无连接和面向连接，传输层仅面向连接\"；TCP/IP 中\"网际层仅无连接，传输层两者都支持\"。\n背诵要点：拥塞控制只在网络层/传输层；相邻节点的流量控制归数据链路层；端到端的归传输层。","keywords":["流量控制","差错控制","拥塞控制","相邻节点","端到端","层次归属"],"source":"王道2027版 印刷页 26-27（PDF p38-39）","status":"final"},{"id":"net-ch1-1.2-015","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"TCP/IP 四层结构与 OSI 的对应关系，以及各层主要协议","level":"l1","title":"TCP/IP 四层结构","answer":"【结论】TCP/IP 模型自低到高为：网络接口层、网际层、传输层、应用层。\n1. 网络接口层：对应 OSI 的物理层 + 数据链路层。作用是从主机或节点接收 IP 分组并发送到指定的物理网络上；TCP/IP 未规定其具体功能与协议细节，只要求能通过某种底层协议接入网络以传送 IP 分组（以太网、无线局域网、电话网、广域网均可）。\n2. 网际层：对应 OSI 网络层，是 TCP/IP 体系的核心；核心协议是 IP，另有 ARP、ICMP、IGMP 等辅助协议。\n3. 传输层：对应 OSI 传输层，主要协议为 TCP 与 UDP。\n4. 应用层：对应 OSI 的会话层 + 表示层 + 应用层，集成所有高层协议，如 FTP、DNS、HTTP。\n5. 地位：因广泛使用，TCP/IP 已成为事实上的国际标准；互联网采用的核心技术就是 TCP/IP。\n背诵要点：TCP/IP 四层 = 网络接口层 + 网际层 + 传输层 + 应用层；4 层与 7 层的合并关系是必考点。","keywords":["TCP/IP模型","网络接口层","网际层","传输层","应用层","事实标准"],"source":"王道2027版 印刷页 20（PDF p32）","status":"final"},{"id":"net-ch1-1.2-016","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"网际层的无连接不可靠服务与 TCP、UDP 的定位差异","level":"l3","title":"网际层与 TCP/UDP","answer":"1. 网际层：负责把分组发往任意网络，为每个分组独立选择路由，但不保证分组有序到达；分组的有序性与可靠性由高层（如传输层）负责。核心协议 IP 提供无连接、不可靠的服务，传输单位为 IP 数据报；当前广泛使用 IPv4，下一版本为 IPv6。\n2. 传输控制协议（TCP）：面向连接，传输前需先建立连接，提供可靠交付，数据传输单位为报文段。\n3. 用户数据报协议（UDP）：无连接，不保证可靠性，仅提供\"尽最大努力交付\"，数据传输单位为用户数据报。\n4. 设计哲学：Everything over IP（各种应用都构建在 IP 之上）与 IP over Everything（IP 可运行于任意底层网络之上）。\n背诵要点：TCP/IP 网际层只有无连接（IP），传输层两种都有（TCP/UDP）；OSI 正好相反。","keywords":["网际层","IP","无连接","不可靠","TCP","UDP","Everything over IP"],"source":"王道2027版 印刷页 20-21（PDF p32-33）","status":"final"},{"id":"net-ch1-1.2-017","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"TCP/IP 与 OSI 的三点相同处与四点差异（尤其第四点：各层支持的服务类型）","level":"l1","title":"OSI 与 TCP/IP 的比较","answer":"相同点：\n1. 均采用分层体系结构，各层功能大体相似。\n2. 均基于独立协议栈的概念。\n3. 均可解决异构网络互联问题，实现不同厂商计算机之间的通信。\n差异：\n1. OSI 精确定义了\"服务、协议、接口\"三个核心概念，分层思想与现代面向对象程序设计契合；TCP/IP 对三者未做明确区分。\n2. OSI 是 7 层；TCP/IP 是 4 层，把表示层与会话层并入应用层，把物理层与数据链路层并入网络接口层。\n3. OSI 先有模型后制定协议，通用性良好，适合描述各类网络；TCP/IP 先有协议栈后归纳出模型，不适用于非 TCP/IP 网络。\n4. OSI 网络层同时支持无连接和面向连接，但传输层仅提供面向连接服务；TCP/IP 认为可靠性应由端到端机制保障，故网际层仅提供无连接服务，传输层同时支持无连接（UDP）与面向连接（TCP）。\n评价：OSI 追求理想化的全球统一标准，软件实现复杂、运行效率低，又缺乏市场与商业驱动力，最终未实现预期目标；TCP/IP 简洁高效，在实际应用中占据主导地位。\n背诵要点：第 4 条是高频考点——\"OSI 网络层双、传输层单；TCP/IP 网络层单、传输层双\"。","keywords":["OSI与TCP/IP比较","四层与七层","先模型后协议","面向连接","无连接","高频考点"],"source":"王道2027版 印刷页 21（PDF p33）","status":"final"},{"id":"net-ch1-1.2-018","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"逐层封装与解封装过程，以及用\"有效数据÷总传输量\"计算传输效率（2017 真题）","level":"l2","title":"封装过程与传输效率计算","answer":"【封装过程】发送方：用户把数据交给应用层，应用层加控制信息组成应用层 PDU；下放到传输层作为其 SDU，加传输层 PCI 组成传输层 PDU；再下放到网络层、数据链路层（数据链路层还要加首部和尾部）……层层封装，最终形成帧经物理链路以比特流传输。接收方逆向逐层拆开\"包裹\"，把数据交给用户。\n各层 PDU 的通俗名称：物理层为比特流；数据链路层为帧；网络层为 IP 分组；传输层为 TCP 报文段或 UDP 数据报。\n【2017 真题】应用层欲发送 400B 数据（无拆分），除物理层和应用层外，其余 5 层每层封装时引入 20B 额外开销：总开销 = 5×20B = 100B，总传输量 = 500B，传输效率 = 400B÷500B = 80%。\n背诵要点：效率 = 有效数据 ÷ 总传输量；加开销的层数别数错（OSI 7 层，中间 5 层加开销）。","keywords":["封装","解封装","传输效率","80%","2017真题","PDU名称"],"source":"王道2027版 印刷页 22、25（PDF p34、p37）","status":"final"},{"id":"net-ch1-1.2-019","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.2 计算机网络体系结构与参考模型","topic":"教学用 5 层协议体系结构的由来与层次划分","level":"l3","title":"五层协议体系结构","answer":"【结论】为兼顾理论与实践，学习计算机网络时通常采用 5 层协议体系结构：应用层、传输层、网络层、数据链路层、物理层。\n1. 由来：该结构融合了 OSI 参考模型与 TCP/IP 模型的优点——相当于把 TCP/IP 的 4 层中的网络接口层拆成数据链路层与物理层。\n2. 通信过程：每个协议栈顶端是面向用户的接口；用户把数据交给应用层后逐层封装，到达接收方后逐层拆开并递交给用户。\n3. 本书（王道）采用此 5 层结构讨论。\n背诵要点：5 层 = TCP/IP 的 4 层把网络接口层拆成数据链路层 + 物理层。","keywords":["五层结构","应用层","物理层","融合OSI与TCP/IP"],"source":"王道2027版 印刷页 21（PDF p33）","status":"final"},{"id":"net-ch1-1.3-001","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.3 本章小结及疑难点","topic":"互联网为何把可靠性交给端系统（IP 无连接不可靠的原因）","level":"l3","title":"为什么 IP 是不可靠的","answer":"【结论】互联网采用端到端可靠传输的设计哲学：网络层使用简单、无连接、不可靠的 IP 协议，而在传输层通过面向连接的 TCP 实现端到端的可靠性。\n1. 传统电信网主要传电话，普通电话机是\"哑终端\"，不具备智能处理能力，所以必须把网络本身设计得高度可靠。\n2. 设计 ARPAnet 时的关键争论是\"谁负责保证传输的可靠性\"：一派主张像电信网那样由网络本身保证；另一派主张由用户主机（端系统）负责，理由是网络结构更简单、成本更低、扩展性更强。\n3. 计算机是智能终端，具备强大的处理能力，因此先驱们最终采纳了后一种观点。\n结果：既降低了网络基础设施的复杂性与成本，又通过 TCP 确保应用所需的可靠通信。\n背诵要点：网络\"尽力而为\"，可靠性由端系统兜底——这是互联网能做大做强的关键取舍。","keywords":["端到端","IP不可靠","TCP","哑终端","ARPAnet","设计哲学"],"source":"王道2027版 印刷页 28-29（PDF p40-41）","status":"final"},{"id":"net-ch1-1.3-002","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.3 本章小结及疑难点","topic":"点到点通信与端到端通信的区别及各自的层次归属","level":"l2","title":"端到端通信 vs 点到点通信","answer":"【结论】点到点是主机到主机，端到端是进程到进程。\n1. 点到点通信：指主机到主机之间的数据传递，不涉及具体的应用进程；只负责把数据从一台主机送到另一台主机，无法识别是哪两个进程在通信。\n2. 端到端通信：建立在点到点通信基础之上，通过多段点到点链路串联，实现不同主机上应用进程之间的通信；这里的\"端\"指应用进程的端口，端口号用于标识应用层中的不同进程。\n3. 层次归属：由物理层、数据链路层、网络层构成的通信子网提供主机到主机的通信服务；传输层负责为主机上的应用进程提供端到端的通信服务。\n背诵要点：网络层及以下只管\"机器到机器\"，传输层才管\"程序到程序\"。","keywords":["端到端","点到点","端口号","通信子网","传输层"],"source":"王道2027版 印刷页 29（PDF p41）","status":"final"},{"id":"net-ch1-1.3-003","chapter":"第1章 计算机网络体系结构","subject":"net","section":"1.3 本章小结及疑难点","topic":"传输速率与传播速率的区别，以及\"链路上同时有多少比特\"由带宽决定","level":"l1","title":"传输速率与传播速率","answer":"【结论】传输速率（发送速率）是主机或路由器在数字信道上发送数据的速率，单位 b/s；传播速率是电磁波在物理介质中向前传播的速度，单位 m/s。\n1. 二者决定的对象不同：链路上同时存在多少比特，取决于传输速率（带宽）；每个比特在某一时刻位于何处，取决于传播速率。\n2. 【例】链路传播速率 2×10^8 m/s（1μs 前进 200m），带宽 1Mb/s（1μs 发出 1 比特）：t=0 开始发送；t=1μs 时第 1 个比特已沿链路传播约 200m；t=2μs 时第 2 个比特发出、第 1 个比特到达 400m 处；t=3μs 时第 3 个比特发出、第 1 个比特到达 600m 处。\n背诵要点：比特\"发得多快\"看带宽，\"跑得多快\"看传播速率；两者单位不同，计算时绝不能混用。","keywords":["传输速率","传播速率","带宽","2×10^8 m/s","在途比特"],"source":"王道2027版 印刷页 29（PDF p41）","status":"final"},{"id":"net-ch2-2.1-001","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"数据、信号、码元三个基本概念的定义与对应关系","level":"l1","title":"数据、信号与码元的定义","answer":"【结论】数据是信息的载体，信号是数据的电气或电磁表现，码元是承载信息的固定时长信号波形。\n1. 数据：信息的载体，即用于传送信息的实体。\n2. 信号：数据的电气或电磁表现，是数据在传输过程中的存在形式。\n3. 码元：在通信系统中，用一个固定时长的信号波形表示一个 k 进制符号，该波形称为码元（也称 k 进制码元），该时长称为码元宽度（或信号周期）。\n4. 模拟与数字：数据和信号都可分为模拟和数字两类——模拟信号的取值是连续的，数字信号的取值是离散的。\n背诵要点：一个码元就是一个固定时长的波形，码元宽度就是这个波形的时长。","keywords":["数据","信号","码元","码元宽度","模拟信号","数字信号"],"source":"王道2027版 印刷页 30（PDF p42）","status":"final"},{"id":"net-ch2-2.1-002","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"一个码元能携带多少比特，取决于码元的离散状态数","level":"l1","title":"码元能携带多少比特信息","answer":"【结论】一个码元携带的比特数 n = log2V，V 为该码元可取的离散状态（电平）数量；反过来 V = 2^n。\n1. 若一个信号周期内可能出现 2 种信号（V=2），每种信号表示 1 位二进制数，则 1 码元携带 1 比特。\n2. 若可能出现 4 种信号（V=4），每种信号表示 2 位二进制数，则 1 码元携带 2 比特。\n3. 一般地，V 种状态需用 log2V 个二进制位来表示，即每码元比特数 n = log2V。\n4. 码元可以是二进制的，也可以是多进制的；码元传输速率与进制数无关，但比特率与进制数有关。\n背诵要点：V 与 n 的换算是本章一切计算的起点，n = log2V，V = 2^n。","keywords":["码元","比特","离散值","log2V","多进制"],"source":"王道2027版 印刷页 30（PDF p42）","status":"final"},{"id":"net-ch2-2.1-003","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"波特率与比特率的定义及相互换算","level":"l1","title":"波特率与比特率的关系","answer":"【结论】波特率（码元传输速率）指每秒传输的码元数，比特率（信息传输速率）指每秒传输的比特数，二者关系为 比特率 = 波特率 × log2V。\n1. 码元传输速率：也称波特率或调制速率，表示数字通信系统每秒传输的码元数，单位是波特（Baud）。\n2. 信息传输速率：也称比特率，表示数字通信系统每秒传输的比特数，单位是 b/s。\n3. 换算：若一个码元携带 n 比特的信息量，则波特率 M Baud 对应的比特率为 M×n b/s；反过来 波特率 = 比特率 ÷ 每码元比特数。\n4. 易错点：波特和比特是两个不同的概念，数值上不一定相等；只有二进制码元（V=2，n=1）时二者数值才相等。\n背诵要点：先由 V 算出 n=log2V，题目给波特率就乘 n，给比特率就除 n。","keywords":["波特率","比特率","Baud","码元速率","换算"],"source":"王道2027版 印刷页 31（PDF p43）","status":"final"},{"id":"net-ch2-2.1-004","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"通信系统模型的组成，重点是信道与通信电路的区别","level":"l2","title":"信源、信道与信宿的组成","answer":"【结论】数据通信系统主要划分为信源、信道、信宿三部分，另有发送/接收变换器和噪声源。\n1. 信源：产生和发送数据的源头；信宿：接收数据的终点。二者通常都是计算机或其他数字终端装置。\n2. 信道：信号的传输介质。一条双向通信的线路包含一个发送信道和一个接收信道。\n3. 变换器：信源发出的信息先经发送变换器转换为适合在信道传输的信号，到达接收端后由接收变换器还原为原始信息，再交付信宿。\n4. 噪声源：信道上噪声及分散在通信系统其他各处的噪声的集中表示。\n易错：信道不等于通信电路——一条可双向通信的电路往往包含两个信道（发送、接收各一）；多个用户共用一条电路时，每个用户在该电路上都有一个信道。\n背诵要点：电路可以一对多，信道是“方向性”的，双向就要两条。","keywords":["信源","信道","信宿","噪声源","变换器","通信电路"],"source":"王道2027版 印刷页 30-31（PDF p42-43）","status":"final"},{"id":"net-ch2-2.1-005","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"信道的两种分类维度，以及基带信号与宽带信号的区别","level":"l2","title":"信道的分类与基带/宽带信号","answer":"【结论】信道按传输信号形式分模拟信道与数字信道，按传输介质分无线信道与有线信道；信道上传送的信号分基带信号与宽带信号。\n1. 模拟信道传送模拟信号，数字信道传送数字信号；无线信道与有线信道按传输介质划分。\n2. 基带信号：由信源发出、未经调制的原始电信号；在信道中直接传送基带信号称为基带传输。\n3. 宽带信号：将基带信号调制到高频载波上形成的信号，其在信道上的传输方式称为宽带传输。\n4. 关系：基带传输占用整个信道带宽，多用于短距离；宽带（频带）传输适合远距离和模拟信道，且支持多路复用。\n背诵要点：基带 = 未调制、原始；宽带 = 已调制到高频载波。","keywords":["模拟信道","数字信道","基带信号","宽带信号","基带传输","宽带传输"],"source":"王道2027版 印刷页 31（PDF p43）","status":"final"},{"id":"net-ch2-2.1-006","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"串行传输与并行传输的适用场景，及其与同步/异步传输的区别","level":"l2","title":"串行传输与并行传输的选择","answer":"【结论】串行传输逐比特按序传输，适用于长距离；并行传输若干比特通过多条信道同时传输，适用于短距离。\n1. 串行传输：逐比特地按序依次传输，只需一条信道，成本低、速度慢，适用于长距离通信，如计算机网络。\n2. 并行传输：若干比特通过多个通信信道同时传输，速度快但线路多、成本高，适用于短距离，如计算机内部 CPU 与主存之间。\n3. 易混点：同步传输、异步传输属于“通信方式”，不是“传输方式”，不能与串行/并行并列。\n4. 结论：计算机内部（距离短）用并行传输，网络（距离长）用串行传输。\n背诵要点：内部短距并行，网络长距串行；同步/异步是另一维度。","keywords":["串行传输","并行传输","长距离","短距离","同步传输"],"source":"王道2027版 印刷页 31（PDF p43）","status":"final"},{"id":"net-ch2-2.1-007","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"单工、半双工、全双工三种交互方式与所需信道数","level":"l1","title":"单工、半双工与全双工","answer":"【结论】按通信双方信息的交互方式，分为单向通信、半双工通信、全双工通信三种。\n1. 单向通信（单工）：只有一个方向的通信而没有反方向的交互，如无线电广播、电视广播。只需一个信道。\n2. 半双工通信：通信双方都可发送或接收信息，但任何一方都不能同时发送和接收；可在同一信道上分时双向传输，无须两个物理信道。\n3. 全双工通信：通信双方可同时发送和接收信息；需要两个独立信道（每个方向一个）。\n4. 传统以太网用同轴电缆互连时，同一时刻只允许一台主机发送，故为半双工。\n背诵要点：单向 1 个信道；半双工 1 个信道分时双向；全双工 2 个独立信道。","keywords":["单工","半双工","全双工","信道数","分时双向"],"source":"王道2027版 印刷页 31（PDF p43）","status":"final"},{"id":"net-ch2-2.1-008","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"带宽在模拟通信与数字通信中的两种不同含义","level":"l1","title":"带宽在两种语境下的含义","answer":"【结论】带宽在模拟通信中指频率范围（单位 Hz），在数字通信中指最大数据传输速率（单位 b/s）。\n1. 模拟通信中的带宽（频率带宽）：信道所能传输信号的频率范围，即最高频率与最低频率之差，单位是赫兹（Hz）。\n2. 数字通信或计算机网络中的带宽：通信线路所能传输数据的能力，即最大数据传输速率，单位不再是 Hz，而是 b/s。\n3. 联系：二者通过奈氏准则和香农定理挂钩——W（Hz）越大，可达到的传输速率（b/s）越高。\n4. 真题应用：求信道带宽时常用“频率范围之差”，如 3.5~3.9MHz 则 W = 0.4MHz = 400kHz。\n背诵要点：看单位判含义——Hz 是频率带宽，b/s 是数据传输速率。","keywords":["带宽","频率带宽","Hz","b/s","最大数据传输速率"],"source":"王道2027版 印刷页 31（PDF p43）","status":"final"},{"id":"net-ch2-2.1-009","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"码间串扰的成因、后果与加剧因素","level":"l2","title":"码间串扰的成因与加剧因素","answer":"【结论】信道频带有限使信号高频分量衰减，接收端波形失去码元之间的清晰界限，这种现象称为码间串扰。\n1. 成因：实际信道所能通过的频率范围总是有限的，信号中许多高频分量无法通过而在传输中衰减。\n2. 后果：接收端无法正确识别每个码元，产生误码。\n3. 加剧因素：码元传输速率越高、传输距离越远、噪声干扰越大、传输介质质量越差，接收端波形失真越严重。\n4. 判据：只要接收端能从失真的信号波形中识别出原始信号，这种失真对通信质量就没有影响。\n背诵要点：码间串扰源于“带宽有限 + 码元太快”，正是奈氏准则要限制的对象。","keywords":["码间串扰","高频分量","失真","码元速率","带宽有限"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-010","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"奈奎斯特定理的公式、前提与直接计算","level":"l1","title":"奈氏准则公式与极限速率计算","answer":"【结论】理想低通信道（无噪声、带宽有限）中，为避免码间串扰，极限码元传输速率为 2W Baud；极限数据传输速率 = 2W·log2V（b/s）。\n1. 前提：理想低通信道——无噪声、带宽有限。\n2. 极限码元传输速率：2W Baud，其中 W 是信道的频率带宽（单位 Hz）。\n3. 极限数据传输速率：2W·log2V（单位 b/s），V 为每个码元的离散电平数量（不同码元的种类数）。\n4. 算例：W = 3kHz、采用 4 个相位且每个相位 4 种幅度的 QAM（V = 4×4 = 16），则 2×3000×log2(16) = 24000b/s = 24kb/s。\n5. 算例：W = 4MHz、QAM 调制、极限速率 48Mb/s，则 log2V = 48M ÷ (2×4M) = 6，V = 64，即 QAM-64。\n背诵要点：2W 是“码元”上限，乘上 log2V 才变成“比特”上限。","keywords":["奈氏准则","2W","log2V","理想低通信道","极限码元速率"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-011","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"奈氏准则的三条推论，尤其是它不限制每码元比特数","level":"l2","title":"奈氏准则的三条核心结论","answer":"【结论】奈氏准则只限制码元传输速率，并不限制每个码元能携带的比特数。\n1. 任何信道中码元传输速率都存在上限；若超过该上限，会产生严重码间串扰，导致接收端无法正确识别码元。\n2. 信道带宽越大，其传输码元的能力越强（上限与 W 成正比）。\n3. 奈氏准则并未限制每个码元所能承载的信息量（比特数），因此信息传输速率仍可通过多元调制（如 QAM-16、QAM-64）来提升。\n4. 应用：无噪声信道题只给带宽和状态数时，直接用 2W·log2V，不必考虑信噪比。\n背诵要点：奈氏卡的是“波特”而不是“比特”，提比特率靠加高阶调制。","keywords":["奈氏准则","码元速率上限","多元调制","QAM","结论"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-012","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"香农定理的公式、适用条件与直接计算","level":"l1","title":"香农定理公式与信噪比代入","answer":"【结论】带宽受限且有高斯白噪声干扰的信道，极限数据传输速率 = W·log2(1+S/N)（b/s）。\n1. 适用条件：带宽受限 + 存在高斯白噪声的实际信道。\n2. 公式：C = W·log2(1+S/N)，W 为信道频率带宽（Hz），S 为信号平均功率，N 为噪声功率，S/N 为信噪比。\n3. 意义：当速率不超过该极限值时，理论上可以实现任意低的误码率。\n4. 算例：W = 3000Hz、信噪比 30dB（即 S/N = 1000），则 3000×log2(1001) ≈ 30kb/s。\n5. 算例：W = 8kHz、30dB，理论极限 8000×log2(1001) ≈ 80kb/s；若实际为理论的 50%，则约 40kb/s。\n易错：公式里代的是无单位的 S/N，不是 dB 值。\n背诵要点：C = W·log2(1+S/N)，S/N 必须先由 dB 换算回无单位比值。","keywords":["香农定理","Wlog2(1+S/N)","信噪比","高斯白噪声","极限速率"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-013","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"信噪比的 dB 表示与无单位表示之间的换算","level":"l1","title":"信噪比与分贝的互相换算","answer":"【结论】信噪比有两种记法：无单位 S/N 与分贝 10log10(S/N) dB；用香农定理计算时必须代无单位值。\n1. 无单位记法：信噪比 = S/N，即信号平均功率与噪声平均功率之比。\n2. 分贝记法：信噪比 = 10log10(S/N)，单位 dB。\n3. 正向换算（背下来）：20dB 对应 S/N = 100；30dB 对应 S/N = 1000；40dB 对应 S/N = 10000。\n4. 反向换算：S/N = 10^(dB/10)。\n易错：把 30dB 直接当成 30 代入香农公式，是本章最高频的失分点。\n背诵要点：dB ÷ 10 再取 10 的幂，才是能进公式的 S/N。","keywords":["信噪比","dB","分贝","10log10","S/N"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-014","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"香农定理的四条推论及“理论极限”的含义","level":"l2","title":"香农定理的四条核心结论","answer":"【结论】香农给出的是有噪声信道的理论极限，实际速率要低不少。\n1. 信道带宽或信噪比越大，信息的极限传输速率越高。\n2. 对于给定的带宽和信噪比，信息传输速率的上限是确定的。\n3. 只要实际信息传输速率低于该极限值，就能找到某种方法实现近似无差错传输。\n4. 香农定理得出的是理论极限，实际信道能达到的传输速率要比它低不少（真题常设“实际约为理论的 50%”）。\n背诵要点：香农是“天花板”，不是“保证值”。","keywords":["香农定理","理论极限","无差错传输","带宽","信噪比"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-015","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"奈氏准则与香农定理的适用条件对比，以及同时给出时取较小值","level":"l2","title":"奈氏准则与香农定理的对比","answer":"【结论】奈氏只看带宽对码元速率的限制（无噪声理想信道），香农同时看带宽和信噪比（有噪声实际信道）；两式都成立时取较小值。\n1. 奈氏准则：仅考虑带宽限制，适用于无噪声的理想信道；只限制码元速率，不限制每码元比特数。\n2. 香农定理：同时考虑带宽与信噪比，适用于有噪声的实际信道；给出信息传输速率不可逾越的上限。\n3. 联合使用：若题目同时给出带宽、信噪比与码元状态数，则分别用两式算出上限，取较小者。\n4. 经典例：W = 4kHz、S/N = 127、二进制信号——香农得 4000×log2(128) = 28kb/s，奈氏得 2×4000×log2(2) = 8kb/s，取 8kb/s。\n5. 经典例：W = 10MHz、30dB、QAM-32——香农约 100Mb/s，奈氏 2×10M×5 = 100Mb/s，取 100Mb/s。\n背诵要点：只给带宽用奈氏，给了信噪比用香农，两者都给就各算一遍再取 min。","keywords":["奈氏准则","香农定理","取较小值","适用条件","对比"],"source":"王道2027版 印刷页 32（PDF p44）","status":"final"},{"id":"net-ch2-2.1-016","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"归零编码的电平规则、自同步机制与带宽代价","level":"l2","title":"归零编码 RZ 的自同步代价","answer":"【结论】归零编码用高/低电平表示 1/0，每个码元中间都跳变回零电平，可自同步但浪费带宽。\n1. 规则：用高电平表示 1、低电平表示 0（或相反），每个码元中间都会跳变回零电平（“归零”）。\n2. 优点：接收方可利用这一跳变调整自身的时钟基准，从而实现收发双方的自同步。\n3. 缺点：归零过程占用了一部分带宽，传输效率会受到一定影响。\n4. 对比记忆：RZ 是唯一“有自同步能力”的非曼彻斯特类编码。\n背诵要点：RZ = 归零 + 自同步 + 浪费带宽。","keywords":["归零编码","RZ","自同步","零电平","浪费带宽"],"source":"王道2027版 印刷页 33（PDF p45）","status":"final"},{"id":"net-ch2-2.1-017","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"非归零编码的效率优势与缺乏同步信息的缺陷","level":"l1","title":"非归零编码（NRZ）","answer":"【结论】非归零编码整个码元周期都用于传输数据，编码效率最高，但不含同步信息。\n1. 规则：与 RZ 的区别是不进行归零，用高电平表示 1、低电平表示 0（或相反），整个周期都用于传输数据。\n2. 优点：编码效率最高（不浪费带宽）。\n3. 缺点：缺乏内在时钟信息，收发双方需额外时钟线来实现同步；各个码元之间没有间隔标志，故不含同步信息。\n4. 考法：“不含同步信息的编码”只有 NRZ 一个选项，曼彻斯特和差分曼彻斯特都含同步信息。\n背诵要点：NRZ 效率最高但无同步信息，需要另加时钟线。","keywords":["非归零编码","NRZ","编码效率","同步信息","时钟线"],"source":"王道2027版 印刷页 33（PDF p45）","status":"final"},{"id":"net-ch2-2.1-018","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"反向非归零编码用“码元起始处是否跳变”表示数据","level":"l2","title":"反向非归零编码（NRZI）","answer":"【结论】反向非归零编码以码元起始处是否有跳变表示数据：无跳变表示 1，有跳变表示 0。\n1. 规则：看码元起始处有无电平跳变——无跳变表示 1（或依协议约定），有跳变表示 0。\n2. 优点：跳变本身可用于辅助时钟恢复，兼顾了 NRZ 的高效率与一定的自同步能力，并且避免了 RZ 的带宽浪费。\n3. 应用：USB 2.0 等标准采用此编码。\n4. 与差分曼彻斯特的区别：NRZI 没有码元中间的固定跳变，数据只由“起始处有无跳变”决定；差分曼彻斯特中间必有一次跳变（仅作同步）。\n背诵要点：NRZI 与差分曼彻斯特都是“看起始处有无跳变”，区别在于有没有中间跳变。","keywords":["NRZI","反向非归零","跳变","时钟恢复","USB2.0"],"source":"王道2027版 印刷页 33（PDF p45）","status":"final"},{"id":"net-ch2-2.1-019","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"曼彻斯特编码用码元中间的跳变同时表示时钟与数据","level":"l1","title":"曼彻斯特编码的跳变规则","answer":"【结论】曼彻斯特编码每个码元中间都有一次电平跳变，该跳变同时承担时钟同步与数据表示功能。\n1. 规则：每个码元中间都有一次电平跳变；常用下降沿（高→低）表示 1、上升沿（低→高）表示 0，也可采用相反的约定。\n2. 作用：跳变既作时钟信号又作数据信号，实现自同步，无须额外时钟线——这正是数据通信中使用曼彻斯特编码的主要原因。\n3. 代价：每个比特被分成两个相等的时间间隔，所占频带宽度是原始基带宽度的 2 倍，编码效率 50%。\n4. 应用：传统以太网（10Base-T）采用曼彻斯特编码。\n5. 波形判读：给定波形只能读出“比特串或其反码”，题目常给两个互为反码的选项，需按题目约定选。\n背诵要点：中间跳变 = 时钟 + 数据；一位两电平，故带宽翻倍。","keywords":["曼彻斯特编码","中间跳变","自同步","带宽翻倍","10Base-T"],"source":"王道2027版 印刷页 33（PDF p45）","status":"final"},{"id":"net-ch2-2.1-020","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"差分曼彻斯特编码中“中间跳变只同步、起始跳变表数据”","level":"l1","title":"差分曼彻斯特编码的判读","answer":"【结论】差分曼彻斯特编码每个码元中间也有跳变，但该跳变仅用于时钟同步；数据由码元起始处是否有跳变决定：无跳变表示 1，有跳变表示 0。\n1. 中间跳变：仅用于时钟同步，不表示数据。\n2. 起始处跳变：无跳变表示 1，有跳变表示 0。\n3. 优点：靠差分判断而非绝对电平，具有更强的抗干扰能力。\n4. 应用：常用于令牌环网等高速网络。\n5. 波形判读步骤：先看第 1 位起始处有无跳变定位基准，再逐位看每个码元起始处有无跳变。\n背诵要点：曼彻斯特看“中间跳变的方向”，差分曼彻斯特看“起始处有没有跳变”。","keywords":["差分曼彻斯特","起始跳变","时钟同步","抗干扰","令牌环"],"source":"王道2027版 印刷页 33-34（PDF p45-46）","status":"final"},{"id":"net-ch2-2.1-021","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"五种数字编码在自同步、带宽浪费、抗干扰三维度的横向对比","level":"l2","title":"五种编码方式特性对比","answer":"【结论】五种常用数字编码在自同步能力、带宽浪费、抗干扰能力三方面各有取舍。\n1. 自同步能力：归零编码 有；非归零编码 无；反向非归零编码 需增加冗余位；曼彻斯特编码 有；差分曼彻斯特编码 有。\n2. 浪费带宽：归零编码 浪费；非归零编码 无；反向非归零编码 不太浪费；曼彻斯特编码 浪费；差分曼彻斯特编码 浪费。\n3. 抗干扰能力：归零编码 弱；非归零编码 弱；反向非归零编码 强；曼彻斯特编码 强；差分曼彻斯特编码 强。\n4. 记忆线索：凡“每个码元中间都跳变”的（曼彻斯特、差分曼彻斯特）必然自同步且费带宽；NRZ 效率最高但不含同步信息。\n背诵要点：自同步与带宽浪费是一对矛盾，跳变越多越易同步、越费带宽。","keywords":["编码对比","自同步","带宽浪费","抗干扰","NRZ","曼彻斯特"],"source":"王道2027版 印刷页 34（PDF p46）","status":"final"},{"id":"net-ch2-2.1-022","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"PCM 的三个步骤及采样定理","level":"l1","title":"PCM 采样量化编码三步","answer":"【结论】模拟数据编码为数字信号通常采用 PCM（脉冲编码调制），包含采样、量化、编码三个步骤。\n1. 采样：对模拟信号进行周期性采样，将其从时间连续变为时间离散；根据奈奎斯特采样定理，采样频率不得低于信号最高频率的 2 倍。\n2. 量化：将采样所得的幅值按预设分级取整，把连续的模拟电平转换为离散的数值。\n3. 编码：将量化后的整数转换为对应的二进制码。\n4. 三个步骤的实质：采样解决“时间离散”，量化解决“幅值离散”，编码解决“变成 0/1 比特流”。\n背诵要点：采样频率 ≥ 2×最高频率，这是 PCM 的第一道硬约束。","keywords":["PCM","采样","量化","编码","采样定理"],"source":"王道2027版 印刷页 34（PDF p46）","status":"final"},{"id":"net-ch2-2.1-023","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"PCM 数据率的计算，以及采样率超过 2W 时的处理","level":"l1","title":"PCM 数据率的计算","answer":"【结论】PCM 的数据率 = 采样频率 × 每样本比特数 = f_s × log2V。\n1. 采样频率 f_s ≥ 2f_max（f_max 为信号最高频率）。\n2. 每个采样值编码为 n = log2V 位，V 为量化级数（信号的变化状态数）。\n3. 数据率 = f_s × n（b/s）。\n4. 算例：信号最高频率 4kHz、量化级数 256，则 f_s = 8kHz、n = 8，数据率 = 8000×8 = 64kb/s（一路 PCM 话音的标准速率）。\n5. 算例：信道每 1/8s 采样一次（采样率 8Hz），信号有 16 种变化状态（n = 4），则最大数据率 = 8×4 = 32b/s。\n6. 陷阱题：给出“8kHz 信道、每信号 8 级、每秒采样 24k 次”——每秒 24k 次已超过奈氏码元上限 2W = 16kBaud，该采样率无意义，应按 2W 计算：2×8000×log2(8) = 48kb/s。\n背诵要点：先取 min(给定采样率, 2W)，再乘每样本比特数。","keywords":["PCM","数据率","采样频率","量化级数","2W","64kb/s"],"source":"王道2027版 印刷页 34（PDF p46）","status":"final"},{"id":"net-ch2-2.1-024","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"ASK、FSK、PSK、DPSK 四种数字调制方式的调制对象与特点","level":"l1","title":"ASK、FSK、PSK 与 DPSK","answer":"【结论】数字数据调制为模拟信号有三种基本方式：ASK 调幅、FSK 调频、PSK 调相；DPSK 是相对调相。\n1. ASK 幅移键控：通过改变载波振幅表示 1 和 0，例如用有载波和无载波输出分别表示 1 和 0。容易实现，但抗干扰能力差。\n2. FSK 频移键控：通过改变载波频率表示 1 和 0，例如用频率 f1 和 f2 分别表示 1 和 0。容易实现，抗干扰能力强；它是唯一需要两个不同频率载波的二进制调制方式。\n3. PSK 相移键控：通过改变载波相位表示 1 和 0，例如用相位 0 和 π 分别表示 1 和 0，属于绝对调相方式。\n4. DPSK 差分相移键控：与 PSK 不同，是相对调相方式，通过检测当前码元与前一个码元的载波相位差来传输信息，例如用相位是否发生变化分别表示 1 和 0。\n5. 选型：需要抗干扰强选 FSK；需要抗噪且频带利用率高选 PSK/QAM；实现最简单选 ASK。\n背诵要点：ASK 改幅度、FSK 改频率、PSK 改相位、DPSK 改“相位差”。","keywords":["ASK","FSK","PSK","DPSK","幅移键控","相对调相"],"source":"王道2027版 印刷页 34-35（PDF p46-47）","status":"final"},{"id":"net-ch2-2.1-025","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"QAM 的状态数、每码元比特数与速率公式","level":"l1","title":"正交幅度调制 QAM","answer":"【结论】QAM 同时调制振幅与相位，用 m 个相位 × n 种振幅组合出 m×n 种状态，速率 R = B·log2(m×n)。\n1. 原理：在载波频率相同的前提下同时调制振幅和相位，形成复合信号；基于两路相位相差 90° 的正交载波（余弦、正弦），可在同一频带上独立传输而不相互干扰。\n2. 公式：假设波特率为 B，采用 m 个相位、每个相位 n 种振幅，则状态数 V = m×n，数据传输速率 R = B·log2(m×n)（b/s）。\n3. QAM-16：每路 4 种振幅，4×4 = 16 种状态，每状态 4 位（log2 16 = 4）。\n4. QAM-64：每路 8 种振幅，8×8 = 64 种状态，每状态 6 位（log2 64 = 6）。\n5. QAM-32：32 种状态，每状态 5 位（log2 32 = 5）。\n6. 星座图：横轴为余弦波幅度、纵轴为正弦波幅度，每个点对应一种状态；接收端按“最接近哪个星座点”判决。\n7. 算例：8 种相位、每种相位 2 种幅度的 QAM 在 1200Baud 下，V = 8×2 = 16，速率 = 1200×4 = 4800b/s。\n背诵要点：先算 V = m×n，再取 log2V 得每码元比特数，最后乘波特率。","keywords":["QAM","星座图","正交载波","QAM-16","QAM-64","log2(m×n)"],"source":"王道2027版 印刷页 35（PDF p47）","status":"final"},{"id":"net-ch2-2.1-026","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"按数据与信号各自的模拟/数字属性形成的四种编码调制组合","level":"l3","title":"编码与调制的四种组合","answer":"【结论】按“数据是数字/模拟 × 信号是数字/模拟”形成四种编码与调制方式。\n1. 数字数据 → 数字信号：数字数据编码（RZ、NRZ、NRZI、曼彻斯特、差分曼彻斯特），用于基带传输。\n2. 模拟数据 → 数字信号：PCM，含采样、量化、编码三步。\n3. 数字数据 → 模拟信号：数字调制（ASK、FSK、PSK、DPSK、QAM），分别对应调制解调器的调制与解调过程。\n4. 模拟数据 → 模拟信号：直接以模拟信号传输，或经 AM、FM、PM 调制到高频载波。\n易错：编码 = 把数据转换为数字信号；调制 = 把数据转换为模拟信号。把“调制”说成“把模拟数据转换为数字信号”是典型错误选项。\n背诵要点：看“变成什么信号”判断叫编码还是调制。","keywords":["编码","调制","四种组合","PCM","数字调制"],"source":"王道2027版 印刷页 33（PDF p45）","status":"final"},{"id":"net-ch2-2.1-027","chapter":"第2章 物理层","subject":"net","section":"2.1 通信基础","topic":"模拟数据不经数字化直接传输或经 AM/FM/PM 调制","level":"l3","title":"模拟数据直接传输为模拟信号","answer":"【结论】模拟数据也可以不数字化，直接以模拟信号传输，或经模拟调制加载到高频载波。\n1. 直接传输：如传统电话系统中，语音信号通过双绞线直接传送到本地交换机。\n2. 模拟调制：若需通过高频信道（如无线电波）传输，可采用调幅 AM、调频 FM、调相 PM 等技术，把信号加载到高频载波上。\n3. 与数字调制的区别：AM/FM/PM 调制的是模拟基带信号，ASK/FSK/PSK 调制的是数字数据。\n背诵要点：AM/FM/PM 属模拟调制，本章只需认得名称。","keywords":["模拟调制","AM","FM","PM","语音信号"],"source":"王道2027版 印刷页 35（PDF p47）","status":"final"},{"id":"net-ch2-2.2-001","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"传输介质按是否约束电磁波分为导向与非导向两类","level":"l3","title":"导向与非导向传输介质","answer":"【结论】传输介质分导向传输介质与非导向传输介质两类。\n1. 传输介质（传输媒体）：数据传输系统中发送器和接收器之间的物理通路。\n2. 导向传输介质：铜线、光纤等，电磁波被约束沿固体介质传播。\n3. 非导向传输介质：自由空间（空气、真空或海水），电磁波在其中的传播称为无线传输。\n背诵要点：有“实体导线”约束的是导向，靠自由空间扩散的是非导向。","keywords":["传输介质","导向","非导向","无线传输","物理通路"],"source":"王道2027版 印刷页 42（PDF p54）","status":"final"},{"id":"net-ch2-2.2-002","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"双绞线的结构、绞合与屏蔽的作用、传输特性","level":"l2","title":"双绞线的绞合与屏蔽作用","answer":"【结论】双绞线由两根绝缘铜导线按规则绞合而成，绞合的目的是减少相邻导线间的电磁干扰。\n1. 结构：两根相互绝缘、按一定规则绞合在一起的铜导线；绞合结构可有效减少相邻导线间的电磁干扰。\n2. 分类：外加金属丝编织屏蔽层的为屏蔽双绞线（STP），无屏蔽层的为非屏蔽双绞线（UTP）。屏蔽层的作用是提高抗干扰能力（减少电磁干扰辐射），不是减少信号衰减。\n3. 特点：价格低廉，既可用于模拟传输也可用于数字传输，通信距离通常为几千米至数十千米；带宽取决于铜线的粗细和传输的距离。\n4. 中继：距离太远时，模拟传输用放大器放大衰减的信号，数字传输用中继器对失真的信号整形。\n易错：绞合与屏蔽都不提高传输速率，只改善抗干扰。\n背诵要点：绞合 = 减少干扰；屏蔽 = 抗电磁干扰辐射。","keywords":["双绞线","绞合","STP","UTP","屏蔽层","抗干扰"],"source":"王道2027版 印刷页 42（PDF p54）","status":"final"},{"id":"net-ch2-2.2-003","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"同轴电缆的四层结构，以及它速率高的真正原因","level":"l2","title":"同轴电缆的结构与速率优势","answer":"【结论】同轴电缆由内导体、绝缘层、外导体屏蔽层和绝缘保护套层构成，屏蔽性好故带宽高、抗噪性强。\n1. 结构（由内到外）：内导体（硬铜线芯）→ 绝缘层 → 外导体屏蔽层（密织网状导体）→ 绝缘保护套层。\n2. 分类：基带同轴电缆（用于数字传输）与宽带同轴电缆（用于宽带信号传输，广泛应用于有线电视系统）。\n3. 优点：外导体的屏蔽作用使其具有良好的抗干扰性能，适合较高速率的数据传输。\n4. 常考结论：同轴电缆比双绞线传输速率更快，得益于更高的屏蔽性，同时有更好的抗噪声性——不是“铜芯粗能过大电流”，也不是“阻抗标准减少衰减”。\n5. 现状：随着交换技术和集线器普及，局域网已基本采用双绞线作为主流传输介质。\n背诵要点：同轴快在“屏蔽好”，不在“芯粗”。","keywords":["同轴电缆","内导体","屏蔽层","基带","宽带","有线电视"],"source":"王道2027版 印刷页 42（PDF p54）","status":"final"},{"id":"net-ch2-2.2-004","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"光纤的全反射原理，以及多模与单模的判据和适用距离","level":"l2","title":"光纤原理与单模/多模","answer":"【结论】光纤利用光的全反射传输光脉冲（有光脉冲表示 1、无光脉冲表示 0），按传播模式分多模与单模。\n1. 结构：由纤芯和包层构成，纤芯直径通常 8~100μm；包层的折射率略低于纤芯。\n2. 原理：光从高折射率介质射向低折射率介质时，若入射角大于临界角则发生全反射，光线在纤芯与包层界面反复反射而向前传播。\n3. 多模光纤：允许多条不同角度入射的光线在同一根光纤中传输；光脉冲损耗较大，更适合短距离通信。\n4. 单模光纤：纤芯直径减小至接近光波波长时仅允许单一模式的光传播，几乎无反射、沿直线传播；纤芯极细，需使用定向性优良的半导体激光器作为光源；衰减小，可实现数千米乃至数十千米无中继传输，适用于远距离通信。\n5. 常考错项：“光纤越粗速率越高”错；“光源是发光二极管或激光”中单模必须用激光器；“光纤是中空的”错。\n背诵要点：多模靠全反射、距离短；单模近无反射、距离长、要用激光器。","keywords":["光纤","全反射","多模光纤","单模光纤","激光器","纤芯"],"source":"王道2027版 印刷页 42-43（PDF p54-55）","status":"final"},{"id":"net-ch2-2.2-005","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"光纤的四条优点及“不受电磁干扰”这一唯一性结论","level":"l2","title":"光纤的四条优点与抗干扰性","answer":"【结论】光纤通信容量极大，且具备损耗小、抗干扰、保密好、体积小四大优势。\n1. 传输损耗小，中继距离长，对远距离传输特别经济。\n2. 抗雷电和电磁干扰性能强，在有大电流脉冲干扰的环境下尤为重要。\n3. 无串音干扰，保密性好，不易被窃听或截取数据。\n4. 体积小、重量轻，在现有电缆管道已拥塞不堪的情况下特别有利。\n5. 带宽潜力：可见光频率约 10^14 MHz，因此光纤系统具有极大的带宽潜力。\n6. 常考结论：不受电磁干扰和噪声影响的传输介质只有光纤；屏蔽双绞线和同轴电缆虽经屏蔽，仍属“减少”干扰而非“不受”干扰。\n背诵要点：损耗小、抗干扰、保密好、体积小——四条一起背。","keywords":["光纤优点","抗电磁干扰","保密性","中继距离","带宽潜力"],"source":"王道2027版 印刷页 43（PDF p55）","status":"final"},{"id":"net-ch2-2.2-006","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"无线电波与微波/红外/激光在传播方式与指向性上的差异","level":"l3","title":"无线电波与微波红外激光","answer":"【结论】无线传输介质包括无线电波、微波、红外线和激光。\n1. 无线电波：穿透能力强、传播距离远，广泛用于移动通信和 WLAN；信号以全向方式扩散，接收端无须对准发射源即可建立连接，这是其重要优势。\n2. 微波、红外线、激光：高带宽无线通信的三种技术，均需视距、具有强指向性。\n3. 微波：工作在较高频段，带宽大、容量高（如一个 2MHz 带宽的信道可容纳约 500 路语音信号）；沿直线传播，地面传输距离受限，通常需中继站接力。\n4. 红外线与激光：把电信号转换为相应光信号在自由空间直接传播，常用于短距离点对点链路（如遥控器）或室内通信；极易受障碍物阻挡，且无法穿透墙壁。\n背诵要点：无线电波全向、无须对准；微波/红外/激光需视距、强指向。","keywords":["无线电波","微波","红外线","激光","视距","全向"],"source":"王道2027版 印刷页 43-44（PDF p55-56）","status":"final"},{"id":"net-ch2-2.2-007","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"卫星通信的原理与优缺点，尤其是“受气候影响大”这一易错点","level":"l3","title":"卫星通信的优缺点与误码率","answer":"【结论】卫星通信以地球同步卫星作为中继节点，突破地面微波的距离限制；优点是容量大、覆盖广、距离远，缺点是保密性差、时延大。\n1. 原理：利用地球同步卫星作为中继节点，有效突破地面微波传输的距离限制。\n2. 优点：通信容量大、覆盖范围广、传输距离远；易于实现广播通信和多址通信。\n3. 缺点：保密性较差，端到端传播时延较大，通信费用高，受气候影响大，误码率较高。\n4. 常考错项：“卫星通信不受气候影响、误码率很低”是错误说法——恰恰相反。\n背诵要点：卫星 = 覆盖广 + 时延大 + 受气候影响。","keywords":["卫星通信","同步卫星","传播时延","覆盖范围","误码率"],"source":"王道2027版 印刷页 44（PDF p56）","status":"final"},{"id":"net-ch2-2.2-008","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"物理层接口的机械、电气、功能、过程四类特性","level":"l1","title":"物理层接口的四个特性","answer":"【结论】物理层接口特性分为机械特性、电气特性、功能特性和过程（规程）特性四类。\n1. 机械特性：规定接口所用接线器的形状和尺寸、引脚数目和排列、固定和锁定装置等。\n2. 电气特性：规定接口电缆中各线路应遵循的电压范围、传输速率和距离限制等。\n3. 功能特性：定义每条线路上特定电平所代表的意义，并定义各线路的具体功能（数据线、控制线、时钟线）。\n4. 过程特性（也称规程特性）：描述各种功能事件发生的顺序和时序关系，如建立连接、传输数据、释放线路的先后。\n5. 不属于物理层接口规范：物理地址（MAC 地址）属于数据链路层范畴。\n背诵要点：形状→机械，电压范围/距离→电气，某电平什么含义→功能，事件先后顺序→过程。","keywords":["机械特性","电气特性","功能特性","过程特性","规程特性"],"source":"王道2027版 印刷页 44（PDF p56）","status":"final"},{"id":"net-ch2-2.2-009","chapter":"第2章 物理层","subject":"net","section":"2.2 传输介质","topic":"电气特性与功能特性的区分，这是四特性中最易混的一对","level":"l2","title":"四特性辨析：电压范围 vs 电平含义","answer":"【结论】“规定电压范围与电缆长度”属电气特性，“规定某电平表示何种意义”属功能特性，这是最高频的混淆点。\n1. 电气特性管“量”：电压范围、传输速率、距离限制。如“信号电平用 +10~+15V 表示二进制 0、-10~-15V 表示二进制 1，电线长度限于 15m 以内”，体现的是电气特性。\n2. 功能特性管“义”：某条线上某一电平代表什么意义、每条线是什么功能。如“数据线上 +11V 表示二进制 1”，属功能特性。\n3. 过程特性管“序”：完成每种功能的事件发生顺序与时序关系（2012 统考真题考此点）。\n4. 机械特性管“形”：接口形状、尺寸、引脚数目与排列、锁定装置。2018 统考真题：接口形状、引脚功能、信号电平都属物理层规范，物理地址不属于。\n背诵要点：先问“题目在说量、义、序还是形”，再对号入座。","keywords":["电气特性","功能特性","过程特性","电压范围","电平含义"],"source":"王道2027版 印刷页 44-46（PDF p56-58）","status":"final"},{"id":"net-ch2-2.3-001","chapter":"第2章 物理层","subject":"net","section":"2.3 物理层设备","topic":"中继器的作用、再生原理、端口数与网段关系","level":"l1","title":"中继器的作用与信号再生原理","answer":"【结论】中继器工作在物理层，功能是整形、放大并转发信号，原理是信号再生而非简单放大。\n1. 作用：消除信号经过一长段电缆后产生的失真和衰减，使信号的波形和强度达到所需要求，从而扩大网络的传输距离。\n2. 原理：信号再生（再生 = 放大 + 整形），不是把衰减的信号简单放大——简单放大同时会把噪声一起放大。\n3. 端口：中继器有两个端口，数据从一个端口输入、从另一个端口输出。\n4. 网段关系：连接的两端属于同一局域网中的不同网段（而非不同子网），所连网段仍构成一个局域网；若中继器发生故障，将影响相邻两个网段的正常工作。\n5. 能力边界：可以连接不同介质的局域网（如光纤与双绞线），只要协议相同；不能连接不同链路层协议的网段，也不能连接不同类型的局域网或广域网。\n背诵要点：中继器 = 再生 = 放大 + 整形，只作用于信号的电气部分。","keywords":["中继器","信号再生","放大整形","两个端口","网段","物理层"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"net-ch2-2.3-002","chapter":"第2章 物理层","subject":"net","section":"2.3 物理层设备","topic":"中继器串联数量的限制与 10Base-5 的 5-4-3 规则","level":"l2","title":"中继器串联的 5-4-3 规则","answer":"【结论】中继器串联数量受传播时延限制：10Base-5 以太网的 5-4-3 规则为最多 4 个中继器、5 段电缆、其中 3 段可挂主机。\n1. 理论上中继器的使用数量是无限的，网络因而可无限延长；但事实上不可能，因为网络标准对信号的传播延迟范围有明确规定，中继器只能在此范围内有效工作，否则会引起网络故障。\n2. 5-4-3 规则：互相串联的中继器数量不能超过 4 个；由 4 个中继器串联的 5 段电缆中，仅有 3 段可挂接主机，其余 2 段只能用作扩展通信范围的链路段，不能挂接主机。\n3. 原因：中继器不仅传送有用信号，还传送噪声和冲突信号，串联过多会使网络不可用。\n背诵要点：5 段线、4 个中继器、3 段可挂机。","keywords":["5-4-3规则","中继器","传播延迟","10Base-5","串联数量"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"net-ch2-2.3-003","chapter":"第2章 物理层","subject":"net","section":"2.3 物理层设备","topic":"集线器的工作过程、广播转发特性与无缓存限制","level":"l1","title":"集线器的工作过程与广播转发","answer":"【结论】集线器是多端口中继器，工作在物理层，只做信号再生与广播转发，不具备定向传送能力。\n1. 工作过程：某端口收到信号后，由于信号在传输过程中已有衰减，集线器对该信号进行整形和放大，再生为接近原始发送时的信号，紧接着转发到其他所有（除输入端口外）处于工作状态的端口。\n2. 冲突：若两个或多个端口所连节点同时发送信号，则会发生冲突，导致所有相关帧传输失败。\n3. 性质：在网络中只起信号放大和转发作用，目的是扩大网络的传输范围，不具备信号的定向传送能力，即信息广播至所有端口，是标准的共享式设备，没有寻址功能。\n4. 无缓存：中继器和集线器不具备缓存能力，连接两个不同链路层协议的网段时会出问题；若两个网段速率分别为 10Mb/s 和 10/100Mb/s，采用集线器连接后整个网络只能以 10Mb/s 工作。\n5. 组网：把所有节点的通信集中在以其为中心的节点上，组网灵活。\n背诵要点：集线器 = 多端口中继器 = 广播式共享设备，无寻址、无缓存。","keywords":["集线器","多端口中继器","广播转发","冲突","无缓存","共享设备"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"net-ch2-2.3-004","chapter":"第2章 物理层","subject":"net","section":"2.3 物理层设备","topic":"集线器组网的物理/逻辑拓扑、冲突域广播域归属与带宽平分","level":"l1","title":"集线器的拓扑与冲突域","answer":"【结论】集线器组网物理上是星形、逻辑上仍是总线形；所有端口属同一冲突域、同一广播域；带宽由各主机平分。\n1. 拓扑：由集线器组成的网络在物理上是星形网络，但逻辑上仍是总线形网络（集线器无交换表，采用广播方式发送）。\n2. 冲突域：集线器不能分割冲突域，其所有端口都属于同一个冲突域；集线器在一个时钟周期内只能传输一组信息。\n3. 广播域：所有端口也同属一个广播域。分割冲突域靠第二层交换机，分割广播域靠第三层设备。\n4. 带宽分配：一个 10Mb/s 的集线器连 8 台计算机同时工作，每台平均可用 10/8 = 1.25Mb/s；连 5 台则为 10/5 = 2Mb/s。\n5. 半双工：集线器只能工作在半双工模式，网络的吞吐率因而受到限制。\n6. 每个端口连接的是同一网络的不同网段。\n背诵要点：集线器既不分冲突域也不分广播域，带宽按端口数平分。","keywords":["集线器","星形","总线形","冲突域","广播域","带宽平分"],"source":"王道2027版 印刷页 47（PDF p59）","status":"final"},{"id":"net-ch2-2.3-005","chapter":"第2章 物理层","subject":"net","section":"2.3 物理层设备","topic":"中继器、集线器、放大器、网桥、路由器的层次与功能分工","level":"l2","title":"物理层设备与其他互连设备的区别","answer":"【结论】中继器与集线器工作在物理层、原理是再生；放大器用于模拟信号且会放大噪声；网桥在数据链路层、路由器在网络层。\n1. 中继器：用于数字信号，原理是信号再生，会减少失真，用于扩大传输距离。\n2. 放大器：通常用于远距离传输模拟信号，但会同时放大噪声、引发失真，因此不适合数字信号长距离传输。\n3. 集线器：本质是多端口中继器，通常有 4 个或更多端口；中继器通常只有 2 个端口。\n4. 网桥：连接两个网段以扩展物理网络的覆盖范围（数据链路层）；路由器：网络层互连设备，可实现不同网络的互联。\n5. 数量限制：通过中继器或集线器互连的网段数量并非不受限制，要受 5-4-3 规则等标准约束。\n6. 共同点：中继器与集线器都工作在物理层，都能对信号进行放大和整形（再生 = 放大 + 整形）。\n背诵要点：数字信号用中继器（再生），模拟信号用放大器（会放大噪声）。","keywords":["中继器","集线器","放大器","网桥","路由器","物理层"],"source":"王道2027版 印刷页 47-48（PDF p59-60）","status":"final"},{"id":"net-ch2-2.4-001","chapter":"第2章 物理层","subject":"net","section":"2.4 本章小结及疑难点","topic":"传输介质是否属于物理层，以及它与物理层的分工","level":"l2","title":"传输介质属于物理层吗","answer":"【结论】传输介质不属于物理层，它位于物理层之下，常被非正式称为“第 0 层”。\n1. 层次位置：尽管与物理层紧密相关，但从网络体系结构看，传输介质位于物理层之下，不属于物理层。\n2. 区别：传输介质只承载电信号或光信号，无法区分信号所代表的比特值——即无法判断某一电平对应的是 1 还是 0。\n3. 物理层的作用：通过定义电气、机械、功能和过程特性（电压、时序、接口规范等），将原始信号解释为有意义的比特流，供上层使用。\n4. 比喻：传输介质是信号的“通道”，物理层是赋予其语义的“规则制定者”。\n背诵要点：介质只“送”信号，物理层才“懂”信号。","keywords":["传输介质","物理层","第0层","比特流","语义"],"source":"王道2027版 印刷页 48-49（PDF p60-61）","status":"final"},{"id":"net-ch2-2.4-002","chapter":"第2章 物理层","subject":"net","section":"2.4 本章小结及疑难点","topic":"基带传输、频带传输、宽带传输三者的区别","level":"l3","title":"基带、频带与宽带传输","answer":"【结论】基带传输直接发送未调制的数字信号；频带传输把数字信号调制到高频载波上；宽带传输用频分复用在一条线路上划出多个频带信道。\n1. 基带传输：直接发送原始数字信号（高、低电平），不经调制；占用整个信道带宽，通常用于短距离通信（局域网、计算机内部）；常用编码为不归零编码和曼彻斯特编码。\n2. 频带传输：把数字信号“搭载”到高频载波上（即调制），转换后的信号更适合在模拟信道（如电话线）上传输；不仅让数字信号能在传统电话系统中传输，还支持多路复
