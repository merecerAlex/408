:"王道2027版 印刷页 106（PDF p118）","status":"final"},{"id":"os-ch2-2.3-012","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"生产者-消费者问题","level":"l2","title":"生产者-消费者问题","answer":"【结论】三信号量：`mutex=1`（互斥访问缓冲区）、`empty=n`（空缓冲区数）、`full=0`（满缓冲区数）。\n生产者：`P(empty); P(mutex); put; V(mutex); V(full);`\n消费者：`P(full); P(mutex); get; V(mutex); V(empty);`\n【铁律】**P(empty)/P(full) 必须写在 P(mutex) 之前**——若先 P(mutex) 再 P(empty)，缓冲区满时生产者持锁等空位、消费者等 mutex，**必然死锁**（教材印刷页 108 / PDF p120 原文列出该反例）。\n【V 可换序】V 操作顺序不重要（只增不减，不会引起阻塞等待链）。\n易错点：**关于省略 mutex——不是无条件可省**。只有当「同一时刻不可能有两个进程同时操作缓冲区」时才可省：典型如**单生产者+单消费者且缓冲区长度为 1**（`empty`/`full` 两信号量本身已把一进一出串行化）；若缓冲区长度 \u003e1 且生产/消费可能交错，或存在**多个生产者/多个消费者**，则**必须加 mutex**，否则会出现并发写同一缓冲区。考试若问「能否省略」，务必先写明前提再作答，直接说「能省」会判错。","keywords":["生产者-消费者","mutex","empty","full","缓冲区"],"source":"王道2027版 印刷页 108（PDF p120）","status":"final"},{"id":"os-ch2-2.3-013","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"读者-写者问题（读优先/写优先）","level":"l2","title":"读者-写者问题（读优先/写优先）","answer":"【结论】**读优先**：`rw=1` 保护文件、`mutex=1` 保护 count；读者：`P(mutex); if(count==0) P(rw); count++; V(mutex); 读; P(mutex); count--; if(count==0) V(rw); V(mutex);`；写者：`P(rw); 写; V(rw);`。\n**写优先**：再加一个信号量 `w=1`，读者进入前先 `P(w)`、退出后 `V(w)`；写者 `P(w); P(rw); 写; V(rw); V(w);`。\n【饥饿风险】**读优先 → 饿死写者**；**写优先 → 饿死读者**。\n易错点：`count` 必须用 mutex 保护——否则多个读者同时判定「我是第一个」会重复 `P(rw)`，第二个 P 永久阻塞。","keywords":["读者-写者","读优先","写优先","count","rw"],"source":"王道2027版 印刷页 110（PDF p122）","status":"final"},{"id":"os-ch2-2.3-014","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"哲学家进餐问题","level":"l2","title":"哲学家进餐问题","answer":"【结论】**朴素解法会死锁**：5 人几乎同时各拿左筷，再等右筷 → 全部阻塞于循环等待（教材印刷页 111 / PDF p123 原文明确此结论）。\n【教材给出的三种限制条件】\n①**限制最多 4 名哲学家同时进餐**——确保至少有一人能获得两根筷子；\n②**对哲学家编号**：奇数号先拿左筷再拿右筷，偶数号相反，**打破循环等待条件**；\n③**仅当左右两根筷子均空闲时，才允许同时拿起**。\n【对应关系·考纲外补充】教材只列出三种做法、只对第②种明说「打破循环等待」，**未逐一说明①②③各破坏哪个必要条件**。本卡补充：①与②本质都在**破坏循环等待**；③（一次性申请两根）使「持有部分资源再去申请另一部分」不再发生，效果上**破坏请求并保持**。此对应关系供理解用，答题以「做法描述」为主。\n易错点：①朴素「先拿左再拿右」**不是解法，正是死锁成因**；②三种解法要能写出**具体代码改法**（如③用互斥量包住两次 P），只写名称不够。","keywords":["哲学家进餐","循环等待","死锁","奇偶法","And型"],"source":"王道2027版 印刷页 110（PDF p122）","status":"final"},{"id":"os-ch2-2.3-015","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"理发师问题与多生产者变体","level":"l3","title":"理发师问题与多生产者变体","answer":"【结论】理发师问题：`customers=0`（等待顾客数）、`barbers=0`（空闲理发师）、`mutex=1`（保护 waiting），椅子 n 把。\n顾客：`P(mutex); if(waiting\u003cn){waiting++; V(customers); V(mutex); P(barbers); 理发;} else V(mutex);`\n理发师：`P(customers); P(mutex); waiting--; V(mutex); V(barbers); 理发;`\n【要点】`waiting` 的**判断与自增必须在同一临界区**内，否则可能超员。\n易错点：本题的信号量个数是 **3 个**（顾客、理发师、mutex），少设 mutex 会造成计数错乱。","keywords":["理发师问题","信号量","临界区"],"source":"王道2027版 印刷页 108（PDF p120）","status":"final"},{"id":"os-ch2-2.3-016","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"管程的组成与特点","level":"l2","title":"管程的组成与特点","answer":"【结论】管程由三部分组成：①局部于管程的**共享数据结构**；②在该结构上操作的**一组过程**；③对局部数据结构**设置初值的语句**。\n【核心机制】管程**每次仅允许一个进程进入**（由编译器/语言机制自动保证互斥），程序员不必手写 P/V。\n【要点】把「共享数据 + 操作 + 互斥」封装为一体，避免手写同步出错；其互斥是**隐式**的。\n易错点：「管程内可以有多个进程并发执行」错误；「管程需要用户显式调用 P/V 实现互斥」错误（自动互斥）。","keywords":["管程","monitor","共享数据结构","隐式互斥"],"source":"王道2027版 印刷页 113（PDF p125）","status":"final"},{"id":"os-ch2-2.3-017","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"条件变量与信号量的本质区别","level":"l2","title":"条件变量与信号量的本质区别","answer":"【结论】\n·**信号量**：**有计数 value**，`P` 递减、`V` 递增；`V` 即使无人等待也会使 value 增加，**状态会被保存**。\n·**条件变量**：**无计数**，只维护一个等待队列；`x.wait` 使调用者阻塞并**自动释放管程**；`x.signal` **只在有人等待时唤醒一个**，**无人等待时什么都不做**（这次通知被丢弃）。\n【推论】条件变量的 wait/signal **不必配对**；信号量一般要配对。\n易错点：最易错的正是这一条——**条件变量 signal 无人在等 = 空操作**，而信号量 V 会累加计数。","keywords":["条件变量","信号量","wait","signal","管程"],"source":"王道2027版 印刷页 114（PDF p126）","status":"final"},{"id":"os-ch2-2.3-018","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"Hoare 与 Mesa 语义","level":"l3","title":"Hoare 与 Mesa 语义","answer":"【结论】**Hoare 语义**：signal 后**被唤醒者立即执行**，发 signal 者让道——保证「signal 后条件一定成立」，实现成本高。**Mesa 语义**：发 signal 者继续运行，被唤醒者**重新排队**，因此需用 `while(条件不满足) wait(c);` **循环重检条件**。\n【要点】实际系统（如 pthread）多采用 Mesa 语义。\n易错点：Mesa 下写成 `if(...) wait(...)` 会因**虚假唤醒/条件被改**而出错，必须用 `while`。","keywords":["Hoare","Mesa","条件变量","虚假唤醒"],"source":"王道2027版 印刷页 114（PDF p126）","status":"final"},{"id":"os-ch2-2.3-019","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"2021 年真题：开关中断实现信号量互斥的正误与原因","level":"l2","title":"2021 年真题：开关中断实现信号量互斥的正误与原因","answer":"【结论·三问三答】\n①**为什么要互斥访问 S**：`S--`/`S++` 不是原子操作，取-判-写回之间可能被切换；两进程同读 S=1 都判可进，最终 S=−1 却有两个进程进入 → 互斥被破坏。\n②**方法 1 错、方法 2 对**：方法 1 把「判空 while(S\u003c=0)」与「S=S-1」之间**开了中断**，判空结论会失效；方法 2 把两者放在同一段关中断内，保证原子性。\n③**用户程序不能用开关中断实现互斥**：开关中断是**特权指令**，只能在内核态执行；且关中断**只对当前 CPU 核有效**，多处理机上无法阻挡其他核。\n易错点：第 ③ 问的两个理由缺一不可（特权指令 + 多核无效）。","keywords":["开关中断","信号量","原子性","特权指令"],"source":"王道2027版 印刷页 99（PDF p111）（对应真题：2021 年 408 第 45 题）","status":"final"},{"id":"os-ch2-2.3-020","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"2022 年真题：双线程前驱关系的 PV 描述","level":"l2","title":"2022 年真题：双线程前驱关系的 PV 描述","answer":"【结论】T1 执行 A、E、F；T2 执行 B、C、D。约束：C 在 A、B 之后；D、E 在 C 之后；F 在 E 之后。\n设 5 个信号量（初值全 0）：SAC、SBC、SCD、SCE、SEF。\nT1：`A; V(SAC); P(SCE); E; V(SEF); P(SEF); F;`\nT2：`B; V(SBC); P(SAC); P(SBC); C; V(SCD); V(SCE); P(SCD); D;`\n【打分点】①初值全 0；②V 紧跟在前驱之后、P 紧贴后继之前；③C 有两个前驱 → **P 两次、两个不同信号量**。\n易错点：C 前漏写一个 P，是最常见的失分。","keywords":["前驱关系","PV操作","信号量初值","线程同步"],"source":"王道2027版 印刷页 99（PDF p111）（对应真题：2022 年 408 第 46 题）","status":"final"},{"id":"os-ch2-2.3-021","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"2024 年真题：缓冲区的临界区判定与最少信号量","level":"l2","title":"2024 年真题：缓冲区的临界区判定与最少信号量","answer":"【结论】缓冲 B，C1 写、C2 读、C3 改；B 空才能 C1，B 非空才能 C2、C3。\n①**C1 访问 B 的代码是临界区**：B 是临界资源，同时写入会造成数据被覆盖。判定口诀——问「是否访问共享且不可并发访问的资源」。\n②**B 空时，C1 一次、C2 一次 → 最少 2 个信号量**：`empty=1, full=0`；P1：`P(empty); C1; V(full);`；P2：`P(full); C2; V(empty);`。**不需要 mutex**——同步量本身兼任互斥。\n③**C3 各执行一次（纯互斥）→ 最少 1 个信号量**：`mutex=1`，`P(mutex); C3; V(mutex);`。C3 之间无先后要求，只需不并发。\n易错点：题目问「尽可能少」，多设信号量直接扣分——**先问有无先后次序，再问要不要排他**。","keywords":["临界区","信号量","最少信号量","同步互斥"],"source":"王道2027版 印刷页 99（PDF p111）（对应真题：2024 年 408 第 46 题）","status":"final"},{"id":"os-ch2-2.3-022","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"同步与互斥的区别和联系（疑难点）","level":"l2","title":"同步与互斥的区别和联系（疑难点）","answer":"【结论】并发进程存在两类制约关系：\n①**竞争关系（间接制约）**：多个进程竞争使用临界资源，必须**互斥**访问。\n②**协作关系（直接制约）**：进程协同完成任务，在关键点**等待对方发出的信号**以协调执行，即**同步**。\n【关系·标准术语】同步与互斥是**两类不同的制约关系**，不要用「谁是谁的特例」来定义；同步强调**次序**，互斥强调**排他**。「互斥是同步的特殊情形（资源数为 1）」属**通俗化记忆法（考纲外补充）**，可在理解时使用，答题时仍应写「直接制约 / 间接制约」。\n易错点：题目出现「先 A 后 B」→ 同步（直接制约）；出现「不能同时」→ 互斥（间接制约）。","keywords":["同步","互斥","竞争关系","协作关系"],"source":"王道2027版 印刷页 175（PDF p187）","status":"final"},{"id":"os-ch2-2.4-001","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁的定义","level":"l2","title":"死锁的定义","answer":"【结论】死锁指多个进程因**竞争资源**而陷入相互等待的僵局：每个进程都在等待其他进程占有的资源，而这些资源又不会被释放，形成**循环等待链**，**所有涉及的进程都被永久阻塞，若无外部干预将无法继续推进**。\n【典型例】P1 占有扫描仪、请求打印机；P2 占有打印机、请求扫描仪 → 互相等待，死锁。\n【关键判定】**永久性**与**循环等待**是死锁的两个标志。\n易错点：进程都在等对方释放资源才叫死锁；若只是等待资源但资源会被释放（如 SJF 下的长作业），那是**饥饿**不是死锁。","keywords":["死锁","循环等待","永久阻塞"],"source":"王道2027版 印刷页 150（PDF p162）","status":"final"},{"id":"os-ch2-2.4-002","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁与饥饿的区别","level":"l2","title":"死锁与饥饿的区别","answer":"【结论】\n·**死锁**：多个进程因竞争资源相互等待，形成**循环等待链**，**永久**无法推进（必须是「一组进程」互相等）。\n·**饥饿**：某个进程因**资源分配策略不公平**，**长期**得不到所需资源而无法推进；**不要求循环等待**，也**不是永久的**（策略改变后可能获得）。\n【对比维度】①是否需循环等待：死锁需要、饥饿不需要；②持续时间：死锁永久、饥饿长期（可解除）；③涉及范围：死锁是一组进程互相等、饥饿可能只是单个进程。\n易错点：SJF 下长作业「一直等」是**饥饿**；「死锁一定伴随饥饿」是错误说法。","keywords":["死锁","饥饿","循环等待","资源分配"],"source":"王道2027版 印刷页 150（PDF p162）","status":"final"},{"id":"os-ch2-2.4-003","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁产生的四个必要条件","level":"l1","title":"死锁产生的四个必要条件","answer":"【结论·必背】①**互斥条件**：资源一次只能被一个进程使用；②**请求并保持条件**（占有且等待）：占有部分资源又请求新资源；③**不可剥夺条件**：资源只能由持有者主动释放；④**循环等待条件**：存在进程—资源的循环等待链。\n【关键判定】四条件**同时成立**是死锁的**必要条件，不是充分条件**；只有当**每类资源只有一个实例**时，「循环等待」才等价于死锁。\n【易错点】①「四个条件都满足就一定死锁」错；②只能破坏其中一部分条件——**互斥条件通常无法破坏**（多数资源本质不可共享）。","keywords":["死锁","互斥条件","请求并保持","不可剥夺","循环等待"],"source":"王道2027版 印刷页 151（PDF p163）","status":"final"},{"id":"os-ch2-2.4-004","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁、饥饿、活锁的三方辨析","level":"l2","title":"死锁、饥饿、活锁的三方辨析","answer":"【结论】\n·**死锁**：都不动（永久阻塞，需外部干预）。\n·**饥饿**：你一直不被选（长期得不到资源，但系统仍在运行）。\n·**活锁**：都在动但白动（未阻塞，因相互谦让反复重试而无法推进）。\n【一句话】**死锁是「都不动」，饥饿是「你一直不被选」，活锁是「都在动但白动」。**\n易错点：活锁的进程**不是阻塞态**（它一直在执行）；题目若说「活锁进程被阻塞」即为错。","keywords":["死锁","饥饿","活锁","辨析"],"source":"王道2027版 印刷页 150（PDF p162）","status":"final"},{"id":"os-ch2-2.4-005","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁最少资源数公式","level":"l2","title":"死锁最少资源数公式","answer":"【结论·公式】**m 个进程，每个需 r 个同类资源，系统不发生死锁的最少资源数 = m(r−1) + 1**。\n教材原式：**m \u003e n(r−1)** 即不死锁（m=资源总数，n=并发进程数，r=每进程所需数）。\n【推导（n 进程各需 2 个）】最坏情况每人各拿 1 个共 n 个 → 全部卡住；再多 1 个就必有某进程凑齐 2 个、跑完释放 → 其余依次推进，故最少 **n+1**。\n易错点：教材是**严格大于号**，问「最少」时答案取 `n(r−1)+1`；写成 `≥ n(r−1)` 会**少 1 个**而失分。\n【对应真题】2021 年 408 第 31 题（n 进程各需 2 个 → n+1）。","keywords":["死锁","最少资源数","m大于n(r-1)","n+1"],"source":"王道2027版 印刷页 172（PDF p184）","status":"final"},{"id":"os-ch2-2.4-006","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁预防：破坏必要条件","level":"l2","title":"死锁预防：破坏必要条件","answer":"【结论·四种预防手段及对应破坏的条件】\n①**破坏请求并保持**：资源**一次性分配**（进程运行前一次申请全部资源）；副作用——资源利用率低、可能饥饿。\n②**破坏不可剥夺**：申请不到就**释放已有资源**，等价于允许剥夺；实现复杂、开销大。\n③**破坏循环等待**：**资源有序分配法**（按编号递增申请）；副作用——编号不当降低利用率、增加编程复杂性。\n④**互斥条件一般不破坏**（资源本质不可共享）。\n易错点：预防是**静态的事前约束**，限制严、实现简单，但系统效率与资源利用率低。","keywords":["死锁预防","一次性分配","资源有序分配","破坏必要条件"],"source":"王道2027版 印刷页 152（PDF p164）","status":"final"},{"id":"os-ch2-2.4-007","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁避免与安全状态","level":"l1","title":"死锁避免与安全状态","answer":"【结论】**安全状态**：存在某个进程执行序列，使每个进程之前所有进程都能顺利完成并释放资源，从而满足该进程的**尚需资源**；该序列为**安全序列**（可能多个）。找不到任何安全序列即为**不安全状态**。\n【核心判据】**安全状态 ⇒ 一定无死锁；不安全状态 ⇏ 一定死锁**（只是**可能**死锁）。\n【死锁避免】每次分配前动态判断，只有分配后仍安全才批准。\n易错点：①「不安全状态就是死锁」错；②安全序列**不唯一**（2022 年 408 第 26 题就是数个数）。","keywords":["死锁避免","安全状态","安全序列","不安全状态"],"source":"王道2027版 印刷页 153（PDF p165）","status":"final"},{"id":"os-ch2-2.4-008","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法的四个数据结构","level":"l2","title":"银行家算法的四个数据结构","answer":"【结论】n 个进程、m 类资源，需维护四个结构：\n①**Available**（可利用资源向量，长 m）：当前各类可用资源数；\n②**Max**（最大需求矩阵 n×m）：每进程对各类资源的最大需求；\n③**Allocation**（分配矩阵 n×m）：每进程已获得的资源数；\n④**Need**（需求矩阵 n×m）：每进程尚需的资源数。\n【关系】**Need[i,j] = Max[i,j] − Allocation[i,j]**。\n易错点（教材原话）：**求解第一步就是先算 Need**，切忌直接拿 Max 去和 Work 比，否则全盘皆错。","keywords":["银行家算法","Available","Max","Allocation","Need"],"source":"王道2027版 印刷页 154（PDF p166）","status":"final"},{"id":"os-ch2-2.4-009","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"安全性算法的完整步骤","level":"l1","title":"安全性算法的完整步骤","answer":"【结论·照抄即可】\n①令 **Work = Available**，Finish[i] = false（全体）；\n②循环查找满足 `Finish[i]==false` 且 **Need[i] ≤ Work** 的进程 Pi：若找到，则 **Work = Work + Allocation[i]**、Finish[i] = true，把 Pi 加入安全序列尾部，回到 ②；若找不到则跳出；\n③若所有 Finish[i]==true → **安全**，输出安全序列；否则 → **不安全**。\n【要点】每轮 Work 要加的是**该进程的 Allocation**，不是 Need——这是最常见失分点。\n【简算技巧】若某步 Work 已能同时满足余下所有进程，即可直接判定安全，不必逐个推进（教材 p175 原话）。","keywords":["安全性算法","Work","Finish","安全序列"],"source":"王道2027版 印刷页 155（PDF p167）","status":"final"},{"id":"os-ch2-2.4-010","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法请求资源的四步","level":"l1","title":"银行家算法请求资源的四步","answer":"【结论·口诀「合法性 → 够不够 → 试分配 → 查安全」】\n①**合法性检查**：`Request_i ≤ Need[i]`，否则视为**非法请求**（超过预先声明的最大需求）报错；\n②**资源可用性检查**：`Request_i ≤ Available`，否则资源不足，Pi **等待**（不算错误）；\n③**试分配**：`Available -= Request; Allocation[i] += Request; Need[i] -= Request;`\n④**安全性检查**：调用安全性算法；安全 → 正式分配；不安全 → **回滚三处改动**，Pi 等待。\n易错点：第 ① 与第 ② 步的判据不同（一个比 Need、一个比 Available），混淆即错。","keywords":["银行家算法","Request","试分配","回滚"],"source":"王道2027版 印刷页 154（PDF p166）","status":"final"},{"id":"os-ch2-2.4-011","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法真题演算①：安全序列判定","level":"l2","title":"银行家算法真题演算①：安全序列判定","answer":"【题】A、B 各 6 个；P1 已分(2,3)需求(4,4)、P2 已分(2,1)需求(3,1)、P3 已分(1,2)需求(3,4)。判安全性。\n【步骤】① Need = Max−Alloc：P1(2,1)、P2(1,0)、P3(2,2)；② Available = (6−5, 6−6) = **(1,0)**；\n③ 第①轮 Work=(1,0)，仅 **P2** 满足（P1 需(2,1)✗、P3 需(2,2)✗）→ Work=(1,0)+(2,1)=**(3,1)**；\n④ 第②轮 Work=(3,1)，P1 需(2,1)✓、P3 需(2,2)✗ → Work=(3,1)+(2,3)=**(5,4)**；\n⑤ 第③轮 Work=(5,4) 满足 P3 → Work=(6,6)。\n【结论】**系统安全，安全序列唯一：P2→P1→P3**。\n【易错点】**P2 必须打头**是本题分水岭——凡以 P1/P3 开头的选项直接排除。\n【出处】2020 年 408 第 27 题（数字待原图核对）。","keywords":["银行家算法","安全序列","Need","Available"],"source":"王道2027版 印刷页 153（PDF p165）（对应真题：2020 年 408 第 27 题，表格数字待原图核对）","status":"final"},{"id":"os-ch2-2.4-012","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法真题演算②：安全序列的个数","level":"l2","title":"银行家算法真题演算②：安全序列的个数","answer":"【题】Available=⟨1,3,2⟩；P0 已分(2,0,1)需(0,2,1)、P1 已分(0,2,0)需(1,2,3)、P2 已分(1,0,1)需(0,1,3)。求安全序列个数。\n【演算】①第①轮 Work=⟨1,3,2⟩：仅 **P0** 满足（P2 的 C 类需 3\u003e2 不满足，P1 的 C 也需 3\u003e2）→ Work=⟨3,3,3⟩；\n②Work=⟨3,3,3⟩ 时 P1、P2 都满足 → 分两支：P0→P1（Work⟨3,5,3⟩）→P2 得 **P0P1P2**；P0→P2（Work⟨4,3,4⟩）→P1 得 **P0P2P1**。\n【结论】**只有 2 个安全序列，答案 B（2）**。\n【教材权威印证】王道2027版 印刷页 172（PDF p184）解析原文：「初始时可用资源数为⟨1,3,2⟩，**只能满足 P0 的需求**⟨0,2,1⟩，所以安全序列**第一个只能是 P0**……变为⟨3,3,3⟩，可以先分配给 P1……也可以先分配给 P2……所以安全序列可以是 ①P0、P1、P2 或 ②P0、P2、P1。」\n【易错点】①起点只有 P0，**不存在以 P2 开头的序列**（审错表头会得 4 条，选 D 就错了）；②题号：40**8 真题是第 26 题**，教材习题编号为 45.B。","keywords":["银行家算法","安全序列个数","Available","Work"],"source":"王道2027版 印刷页 172（PDF p184）（对应真题：2022 年 408 第 26 题，教材编印页 172 解析编号 45.B）","status":"final"},{"id":"os-ch2-2.4-013","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"资源分配图与化简判据","level":"l2","title":"资源分配图与化简判据","answer":"【结论】图形要素：**进程画圆圈**、**资源类画方框**（框内小圆点 = 实例数）、**申请边 Pi→Rj**、**分配边 Rj 的圆点→Pi**。\n【化简步骤】找**既非阻塞、请求又能被满足**的进程 Pi → 假设它执行完，消去其全部边（释放资源）→ 重复直到不能化简。\n【判据】**能完全化简 ⇒ 一定无死锁**；不能完全化简 ⇒ 可能死锁；**单实例资源**时「图中有环 ⇔ 死锁」。\n易错点：多实例资源时「不能化简」**不等于**死锁，需改用安全序列判断。","keywords":["资源分配图","化简","申请边","分配边","循环等待"],"source":"王道2027版 印刷页 157（PDF p169）","status":"final"},{"id":"os-ch2-2.4-014","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁检测与解除","level":"l2","title":"死锁检测与解除","answer":"【结论】**检测**：周期性构造/化简资源分配图（或用死锁检测算法），判断是否出现死锁；检测时机有「每次分配后、定时、利用率下降时」等（开销与及时性权衡）。\n**解除**：①**终止进程**（全部终止或选代价最小者逐个终止）；②**剥夺资源**（从某些进程剥夺资源给死锁进程）；③**回滚**（取消部分操作回到安全点）。\n【关键判定】**检测与解除不破坏任何必要条件**——它们是「允许发生再处理」，与预防/避免的「事前排除」本质不同。\n易错点：「死锁检测属于破坏循环等待条件」是错误说法。","keywords":["死锁检测","死锁解除","资源分配图","终止进程","剥夺"],"source":"王道2027版 印刷页 157（PDF p169）","status":"final"},{"id":"os-ch2-2.4-015","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"四种死锁策略对比","level":"l1","title":"四种死锁策略对比","answer":"【结论·必背对比】\n| 策略 | 时机 | 是否破坏必要条件 | 开销/效果 |\n| 预防 | 运行前 | **是**（破坏其一） | 限制严，资源利用率低 |\n| 避免 | 运行中 | 否 | 每次分配都跑安全性算法，开销**大** |\n| 检测 | 运行中 | 否 | 周期性构造化简图 |\n| 解除 | 发生后 | 否 | 终止/剥夺/回滚 |\n【一句话】预防=事前破坏，避免=事前判断，检测=事后发现，解除=事后处理。\n易错点：**只有预防破坏必要条件**；避免与检测/解除都不破坏。","keywords":["死锁预防","死锁避免","死锁检测","死锁解除","对比"],"source":"王道2027版 印刷页 152（PDF p164）","status":"final"},{"id":"os-ch2-2.4-016","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法属于死锁避免（术语辨析）","level":"l3","title":"银行家算法属于死锁避免（术语辨析）","answer":"【结论】**银行家算法属于死锁避免**——它在每次分配前动态判断是否保持安全状态，**不破坏**四个必要条件。\n【教材措辞提示】王道印刷页 175 疑难点中曾用「预防死锁」的宽松表述来描述银行家算法，但 2.4.2/2.4.3 正文与 408 标准分工是：**预防 = 破坏必要条件；避免 = 银行家算法**。答题一律按后者。\n易错点：选项中「银行家算法属于死锁预防」为**错误**；「资源有序分配属于死锁避免」也错（那是预防）。","keywords":["银行家算法","死锁避免","术语"],"source":"王道2027版 印刷页 158（PDF p170）","status":"final"},{"id":"os-ch2-2.4-017","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"死锁的常见触发场景与实例","level":"l3","title":"死锁的常见触发场景与实例","answer":"【结论】①**硬件资源争用**：P1 占扫描仪求打印机、P2 占打印机求扫描仪；②**同步机制使用不当**：进程 A 等 B 的消息、B 又等 A 的消息（消息通道/同步对象被视为逻辑资源）；③**加锁顺序不一致**：线程 1 先锁 A 再锁 B、线程 2 先锁 B 再锁 A。\n【共同本质】都形成**循环等待**。\n易错点：死锁**不一定涉及硬件资源**，逻辑资源（消息、锁）同样能造成死锁。","keywords":["死锁场景","循环等待","加锁顺序"],"source":"王道2027版 印刷页 151（PDF p163）","status":"final"},{"id":"os-ch2-2.4-018","chapter":"第2章 进程与线程","section":"2.4 死锁","topic":"银行家算法的工作原理（疑难点）","level":"l2","title":"银行家算法的工作原理（疑难点）","answer":"【结论】银行家算法通过**避免系统进入不安全状态**来预防死锁：每次分配时先检查资源是否足够；若有，则做**试探性分配**，并对新状态执行**安全性检查**；若新状态安全则正式分配，否则**拒绝请求**，从而确保系统**始终处于安全状态**。\n【代价】保守策略会**降低资源利用率**（可能长期保留资源不分配），以换取无死锁保证。\n易错点：银行家算法是**避免**策略；它判断的是「安全」而非「死锁」——不安全状态并不等于已死锁。","keywords":["银行家算法","安全状态","试探性分配","拒绝请求"],"source":"王道2027版 印刷页 175（PDF p187）","status":"final"},{"id":"os-ch2-2.5-001","chapter":"第2章 进程与线程","section":"2.5 本章疑难点","topic":"进程与线程的核心区别","level":"l2","title":"进程与线程的核心区别","answer":"【结论】①**调度单位**：线程是处理器调度的**基本单位**；进程传统上是**资源分配的基本单位**。②**资源**：进程拥有独立地址空间；同进程的线程**共享**地址空间与打开文件，但各有**私有栈、PC、寄存器**。③**开销**：线程创建/切换/撤销开销小得多。④**并发性**：线程间切换更快，且便于利用多核并行。⑤**健壮性**：一个线程崩溃可能拖垮整个进程，进程间则相互隔离。\n易错点：「引入线程后进程不再是资源分配单位」错误——资源分配单位仍是进程；改变的是调度单位。","keywords":["线程","进程","调度单位","资源分配","共享"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"os-ch2-2.5-002","chapter":"第2章 进程与线程","section":"2.5 本章疑难点","topic":"调度算法的选择依据","level":"l3","title":"调度算法的选择依据","answer":"【结论】选算法要结合**系统类型与目标**：\n·**批处理系统**：追求吞吐量与资源利用率 → FCFS、SJF、HRRN；\n·**分时系统**：追求**响应时间** → RR、多级反馈队列；\n·**实时系统**：追求**截止时间保证** → 优先级调度、EDF 等（考纲外补充）。\n【权衡】任何调度算法都在「响应时间 / 周转时间 / 吞吐量 / 公平性 / 开销」间取舍，没有全面最优的算法。\n易错点：题目问「分时系统最看重什么」→ **响应时间**；问「批处理最看重什么」→ **吞吐量/周转**。","keywords":["调度算法选择","分时系统","批处理系统","响应时间"],"source":"王道2027版 印刷页 77（PDF p89）","status":"final"},{"id":"os-ch3-3.1-001","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"内存管理的五大功能","level":"l1","title":"内存管理的五大功能","answer":"内存管理是指操作系统对内存空间的组织、分配、回收以及地址映射等一系列操作。主要功能共 5 项：\n1. 内存空间的分配与回收：实时跟踪内存使用状态，记录空闲区域，为新进程分配空间，进程终止后及时回收。\n2. 地址转换（地址重定位）：用户程序使用逻辑地址（虚拟地址），实际访存必须用物理地址，操作系统需提供转换机制。\n3. 内存空间的扩充：通过虚拟存储技术，使进程能够使用远大于物理内存容量的地址空间。\n4. 内存共享：允许多个进程安全地访问同一块物理内存区域，常用于共享库或进程间通信。\n5. 存储保护：确保各进程只能访问自身被授权的内存区域，防止相互干扰或非法破坏。\n易错点：内存管理“不”负责提高内存的物理存取速度（那是 Cache/硬件的任务），只负责提高“利用率”。","keywords":["内存管理","分配与回收","地址转换","内存扩充","内存共享","存储保护"],"source":"王道2027版 印刷页 176–177（PDF p188–189）","status":"final"},{"id":"os-ch3-3.1-002","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"程序变为可执行程序的三步：编译、链接、装入","level":"l1","title":"程序的编译、链接、装入","answer":"将用户源程序转换为可在内存中执行的程序，需依次经过三步：\n1. 编译：由编译程序将用户源代码翻译成若干目标模块。\n2. 链接：由链接程序将这些目标模块及其所需的库函数合并，形成一个完整的装入模块。\n3. 装入（加载）：由装入程序将该装入模块载入内存，并启动其执行。\n易错点（2011 真题考过）：形成逻辑地址（地址变换）的阶段是【链接】——各目标模块的相对地址在链接时拼接成统一的、从 0 开始编址的逻辑地址空间。","keywords":["编译","链接","装入","目标模块","装入模块"],"source":"王道2027版 印刷页 177（PDF p189）","status":"final"},{"id":"os-ch3-3.1-003","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"逻辑地址与物理地址（逻辑地址空间/物理地址空间）","level":"l1","title":"逻辑地址与物理地址","answer":"1. 逻辑地址（相对地址、虚拟地址）：编译后的每个目标模块通常从 0 号单元开始编址，这种地址称为该模块的相对地址；链接程序把各模块相对地址拼接成统一的、从 0 开始编址的逻辑地址空间（虚拟地址空间）。以 32 位系统为例，逻辑地址空间范围为 0～2³²−1。进程运行时所使用的地址均为逻辑地址，用户只关注逻辑地址，内存管理对其完全透明。\n2. 物理地址空间：主存中所有物理存储单元的集合，是地址转换的最终目标。\n3. 不同进程可以拥有相同的逻辑地址，因为它们各自拥有独立的逻辑地址空间，这些地址被映射到主存的不同位置。\n4. 地址重定位：把逻辑地址转换为物理地址的过程。早期系统在装入时完成；现代支持虚拟内存的系统由内存管理单元（MMU）在硬件层面于运行时自动完成（MMU 依据当前进程的页表动态转换）。","keywords":["逻辑地址","物理地址","地址重定位","MMU","虚拟地址空间"],"source":"王道2027版 印刷页 177（PDF p189）","status":"final"},{"id":"os-ch3-3.1-004","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"三种链接方式：静态链接/装入时动态链接/运行时动态链接","level":"l2","title":"三种链接方式","answer":"按链接发生时机分三种：\n1. 静态链接：程序运行之前，将各目标模块及所需库函数链接成一个完整的装入模块（可执行文件），此后不再拆分。需完成两项操作：①地址调整——按模块在装入模块中的实际位置给内部地址加偏移量（如模块 A 长度 L，模块 B 紧随其后，则 B 内部地址整体加 L）；②外部符号解析——把模块间引用的外部符号（如函数名）替换为确定地址（CALL B 中的 B 替换为地址 L）。\n2. 装入时动态链接：用户源程序编译后生成一组目标模块，在装入内存时边装入边链接；遇外部模块调用则立即查找、装入该模块并替换外部符号。优点：①便于修改和更新（只需替换被修改的模块）；②便于实现对目标模块的共享（同一目标模块可链接到多个应用程序）。\n3. 运行时动态链接：对装入时动态链接的改进，程序执行过程中仅当需要调用某个尚未装入的模块时才动态加载并链接；未使用的模块既不装入也不链接。优点：加快装入过程，同时节省内存空间。","keywords":["静态链接","装入时动态链接","运行时动态链接","外部符号解析","地址调整"],"source":"王道2027版 印刷页 178（PDF p190）","status":"final"},{"id":"os-ch3-3.1-005","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"三种装入方式：绝对装入/可重定位装入/动态运行时装入","level":"l2","title":"三种装入方式与静态、动态重定位","answer":"1. 绝对装入：仅适用于单道程序环境。装入位置在编译前即可确定，编译程序直接生成使用绝对地址的目标代码，逻辑地址与实际物理地址完全一致，无须修改。\n2. 可重定位装入（静态重定位）：多道环境下编译程序无法预知装入位置，装入模块从地址 0 开始编址。装入时由系统分配一块连续内存区，把整个模块载入，随后【一次性】将全部逻辑地址改为物理地址；转换在装入时完成且运行期间不再改变。缺点：进程必须在装入前一次性获得全部内存空间；一旦装入，运行期间既不能移动位置，也不能动态申请额外内存。\n3. 动态运行时装入（动态重定位）：装入后并不立即转换地址，而是推迟到指令实际执行时进行；借助【重定位寄存器】存放模块在内存中的起始物理地址，程序中保留逻辑地址，物理地址由硬件在运行时动态计算。优点：支持程序在内存中移动，便于操作系统紧凑，有效减少外部碎片；提高内存分配灵活性，允许运行期间动态调整进程内存布局。\n易错点（2013 小题）：动态重定位必须使用【可重定位装入程序 + 重定位寄存器 + 地址变换机构】，且过程发生在【执行】阶段；静态重定位可用于固定分区，页式/段式等非连续分配必须动态重定位。","keywords":["绝对装入","可重定位装入","静态重定位","动态重定位","重定位寄存器"],"source":"王道2027版 印刷页 178–179（PDF p190–191）","status":"final"},{"id":"os-ch3-3.1-006","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"内存保护的两种方法（上下限寄存器、重定位寄存器+界地址寄存器）","level":"l1","title":"内存保护","answer":"内存保护要在分配前防止用户进程破坏操作系统，同时避免用户进程相互干扰。常用两种方法：\n1. 在 CPU 中设置一对【上、下限寄存器】，分别存放用户进程在内存中的下限和上限地址；CPU 每访问一个地址，硬件自动与这两个寄存器的值比较，判断是否越界。\n2. 采用【重定位寄存器（基地址寄存器）+ 界地址寄存器（限长寄存器）】做越界检查：重定位寄存器存放进程在内存中的起始物理地址，界地址寄存器存放进程地址空间的长度。内存管理部件先把逻辑地址与界地址寄存器的值比较，若未越界，则把逻辑地址加上重定位寄存器的值得到物理地址，再据此访存。\n一句话记忆：重定位寄存器用于“加”，界地址寄存器用于“比”。\n补充：两个寄存器的加载必须通过特权指令完成，仅操作系统内核具备此权限，用户程序无法篡改。\n易错点：内存保护必须【操作系统 + 硬件机构合作】完成，不能只靠软件（2009 真题：分区分配内存管理方式的主要保护措施是【界地址保护】）。","keywords":["内存保护","上下限寄存器","重定位寄存器","界地址寄存器","越界检查","特权指令"],"source":"王道2027版 印刷页 179–180（PDF p191–192）","status":"final"},{"id":"os-ch3-3.1-007","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"内存共享与可重入代码","level":"l2","title":"内存共享（可重入代码）","answer":"1. 只有【只读区域】才可以被共享。可重入代码（纯代码）是一种允许多个进程同时访问但不允许被任何进程修改的代码。\n2. 每个进程需配备独立的私有数据区存放运行中可能被修改的数据；程序只对私有数据区写，共享代码段始终不变。\n3. 计算示例（书中例）：40 个用户同时运行同一文本编辑程序，代码区 160KB、数据区 40KB。不共享代码需 (160KB+40KB)×40 = 8000KB；代码可共享则只需 160KB + 40KB×40 = 1760KB。\n4. 分页系统：页面 4KB 时代码区占 40 页、数据区占 10 页；每个进程页表需 40 个页表项指向同一组共享代码页，再为私有数据区建 10 个页表项。\n5. 分段系统：只需为共享代码段设 1 个段表项（记录起始地址和段长 160KB），每个进程段表引用该共享段。\n结论：分页与分段均可支持共享，区别在于【共享粒度与实现方式】，分段更便捷。","keywords":["内存共享","可重入代码","纯代码","共享粒度","私有数据区"],"source":"王道2027版 印刷页 180（PDF p192）","status":"final"},{"id":"os-ch3-3.1-008","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"内存分配方式的演进与连续分配的定义","level":"l2","title":"内存分配方式的演进：五种方式的由来","answer":"演进主线：单一连续分配 → 固定分区分配 → 动态分区分配 → 离散分配（页式存储管理）→ 分段存储管理。\n1. 单一连续分配：单道→多道发展后被取代。\n2. 固定分区分配：难以适应作业大小的动态变化。\n3. 动态分区分配：为提升内存利用率，被离散分配取代。\n4. 离散分配（页式）：为进一步满足用户编程与使用上的更高需求（支持程序逻辑结构、实现段级共享与保护），分段存储管理应运而生。\n连续分配方式是指为一个用户程序分配一个【连续】的内存空间（如程序需要 100MB，就分配一块连续的 100MB 区域），主要包括单一连续分配、固定分区分配和动态分区分配。\n共同特点：用户程序在主存中均以连续方式存放。","keywords":["连续分配","单一连续分配","固定分区","动态分区","离散分配"],"source":"王道2027版 印刷页 180（PDF p192）","status":"final"},{"id":"os-ch3-3.1-009","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"单一连续分配","level":"l1","title":"单一连续分配","answer":"1. 做法：内存划分为【系统区】和【用户区】。系统区仅供操作系统使用，通常位于低地址部分；用户区仅允许一道用户程序运行，该程序独占整个用户区。\n2. 优点：结构简单；【无外部碎片】；无须内存保护机制（内存中始终只有一道程序）。\n3. 缺点：仅适用于单用户、单任务操作系统；存在【内部碎片】；内存利用率极低。","keywords":["单一连续分配","系统区","用户区","内部碎片","无内存保护"],"source":"王道2027版 印刷页 180（PDF p192）","status":"final"},{"id":"os-ch3-3.1-010","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"固定分区分配","level":"l2","title":"固定分区分配（分区使用表/内部碎片）","answer":"1. 做法：将用户内存空间划分为若干【大小固定】的分区，每个分区仅能容纳一道作业；有空闲分区时，从外存后备作业队列中选择合适大小的作业装入。\n2. 划分方法：①分区大小相等——程序过小造成浪费、过大无法装入，缺乏灵活性；②分区大小不等——划分为多个较小分区、适量中等分区和少量大分区，以提高适应性。\n3. 分区使用表：各表项包含分区的【始址、大小、状态（是否已分配）】，通常按分区大小排序。分配时检索该表找一个满足作业大小且未分配的分区，状态置“已分配”；回收时只需把状态置“未分配”。\n4. 两个问题：①作业大于所有分区则无法装入；②作业小于分区大小仍需占用整个分区，产生【内部碎片】。\n结论：固定分区【无外部碎片】但有内部碎片；因每个分区仅由一个作业独占，内存利用率较低。","keywords":["固定分区","分区使用表","内部碎片","分区大小相等"],"source":"王道2027版 印刷页 180–181（PDF p192–193）","status":"final"},{"id":"os-ch3-3.1-011","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"动态分区分配与外部碎片、紧凑","level":"l2","title":"动态分区分配（可变分区）与外部碎片","answer":"1. 定义：动态分区分配（可变分区分配）指在进程装入内存时，按其实际需求动态分配一块【大小恰好匹配】的连续内存空间；分区数量和大小随进程装入与释放动态变化。\n2. 发展结果：随着进程频繁装入与释放，内存中逐渐积累大量分散的小空闲块——可用内存总量虽足，却难以满足较大进程需求，内存利用率下降。\n3. 【外部碎片】：散布在已分配分区之间、无法利用的小空闲块。与固定分区“分区内部没用完”的【内部碎片】形成鲜明对比。\n4. 缓解手段：紧凑（压缩）技术——操作系统周期性移动进程，把所有空闲块合并成一个连续区域；要求系统支持【动态重定位】，且开销较大。（原理类似磁盘碎片整理，但作用对象是主存而非外存文件系统。）","keywords":["动态分区","可变分区","外部碎片","紧凑","动态重定位"],"source":"王道2027版 印刷页 181（PDF p193）","status":"final"},{"id":"os-ch3-3.1-012","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"动态分区的分配与回收（四种合并情形）","level":"l1","title":"动态分区分配与回收的记忆方法","answer":"1. 数据结构：系统维护一张【空闲分区链（表）】，通常按【起始地址】排序。\n2. 分配：检索空闲分区链，找到满足请求大小的空闲分区；若其尺寸大于所需，则从中分割出请求大小的空间，剩余部分（不小于最小分配单位时）仍留在链中。\n3. 回收：按回收分区的起始地址确定插入位置，并按相邻情况执行合并，共【四种情形】：\n ① 与前一空闲分区相邻：两者合并，更新前一分区的大小；\n ② 与后一空闲分区相邻：两者合并，更新后一分区的起始地址和大小；\n ③ 与前后两个空闲分区都相邻：三者合并，更新前一分区大小，并【删除后一】分区的表项；\n ④ 都不相邻：为其【新建一个表项】，记录起始地址和大小并插入空闲分区链。\n易错点（2017 真题）：只有“上下都相邻”时空闲分区数【减 1】；都不相邻时【加 1】；只有一侧相邻时数量不变。","keywords":["空闲分区链","分配","回收","合并","相邻"],"source":"王道2027版 印刷页 182（PDF p194）","status":"final"},{"id":"os-ch3-3.1-013","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"动态分区分配算法二分：顺序搜索 vs 索引搜索","level":"l1","title":"动态分区分配算法分类","answer":"按空闲分区检索方式分为两类：\n1. 【顺序分配算法】：依次遍历空闲分区链，查找满足作业大小的分区。包括四种——首次适应（FF）、邻近适应（NF，又称循环首次适应）、最佳适应（BF）、最坏适应（WF）。\n2. 【索引分配算法】：按空闲分区大小分类，每一类相同大小的空闲分区建立独立空闲分区链，再用一张索引表统一管理这些链的头指针；分配时按请求大小在索引表中定位对应链表。常见三种——快速适应（QuickFit）、伙伴系统（Buddy System）、哈希算法。\n易错点：空闲分区“按容量递增排列”的是最佳适应、“容量递减”的是最坏适应、“地址递增”的是首次适应——排序依据不同，不要混。","keywords":["顺序分配算法","索引分配算法","首次适应","最佳适应","伙伴系统"],"source":"王道2027版 印刷页 182（PDF p194）","status":"final"},{"id":"os-ch3-3.1-014","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"首次适应（First Fit）与邻近适应（Next Fit）","level":"l2","title":"首次适应与邻近适应","answer":"1. 首次适应（FF）：空闲分区按【地址递增】排列。从链首顺序查找，找到【第一个满足请求】的空闲分区，从中划出所需空间，余下部分仍留在链中。\n ·优点：优先利用低地址分区，保留高地址的大空闲区，有利于后续大作业装入。\n ·缺点：低地址容易积累小碎片；每次分配都要从链首开始查找，查找开销大。\n2. 邻近适应（NF，循环首次适应）：由 FF 改进而来，从【上次查找结束的位置】继续循环搜索，而非每次都从链首开始。\n ·优点：减少对低地址区域的重复扫描。\n ·缺点：导致大空闲区在内存中分布不均，难以有效支持后续大作业装入；整体性能通常不如 FF。\n3. 综合评价（书中结论）：首次适应在实现开销、碎片控制与大作业支持之间取得较好平衡——查找简单高效、回收时无须对空闲链重新排序、能有效保留高地址大空闲区。","keywords":["首次适应","FF","邻近适应","NF","循环首次适应","地址递增"],"source":"王道2027版 印刷页 182（PDF p194）","status":"final"},{"id":"os-ch3-3.1-015","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"最佳适应（Best Fit）与最坏适应（Worst Fit）","level":"l2","title":"最佳适应与最坏适应","answer":"1. 最佳适应（BF）：空闲分区按【容量递增】排列。顺序查找【第一个能满足作业大小的分区】（即最小的可用分区）分配。\n ·本意是尽量保留大空闲分区，但每次分配都会在原分区留下极小的剩余块，久而久之产生【大量外部碎片】，实际性能通常较差。\n2. 最坏适应（WF）：空闲分区按【容量递减】排列。选择【第一个满足要求的分区】（即最大的可用分区），从中分割所需空间。\n ·与 BF 相反，试图通过避免生成小碎片提升利用率；但因总是切割最大的空闲区，系统很快难以满足大作业需求，性能同样不佳。\n3. 易错点（2019 真题）：最容易产生内存碎片的是【最佳适应算法】。","keywords":["最佳适应","BF","最坏适应","WF","容量递增","容量递减"],"source":"王道2027版 印刷页 182（PDF p194）","status":"final"},{"id":"os-ch3-3.1-016","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"索引分配算法：快速适应、伙伴系统、哈希算法","level":"l2","title":"快速适应、伙伴系统与哈希算法","answer":"1. 快速适应（QuickFit）：按进程中常用的空间大小，预先将空闲分区划分为若干【固定尺寸的类别】。分配分两步：①按作业长度在索引表中找到能容纳它的最小类别链表；②从该链表头部取下第一个空闲分区分配。优点：查找效率高、不产生内存碎片；缺点：回收时难以有效合并分区，算法复杂、开销较大。\n2. 伙伴系统（Buddy System）：所有分区大小均为 2ᵏ（k 为正整数）。分配大小为 n 的内存（2^(i−1) \u003c n ≤ 2ⁱ）时，先查大小为 2ⁱ 的空闲链，有则直接分配；否则依次查 2^(i+1)、2^(i+2)、… 的链，直至找到可用分区，再不断二分，直至得到所需大小的块，其余部分按大小加入对应的空闲链。\n ·【伙伴】定义：每个大小为 2ᵏ 的分区都有唯一伙伴——与它大小相同、地址相邻（首尾相接）的另一个分区。\n ·回收：若空闲分区与其伙伴均为空闲，则合并为大小为 2^(k+1) 的分区，并继续向上尝试合并，直至无法合并。\n3. 哈希算法：以空闲分区大小为关键字建立哈希函数，构建哈希表，每个表项记录对应空闲分区链头指针；分配时按所需大小算出表项位置，快速取得相应空闲分区链。","keywords":["快速适应","QuickFit","伙伴系统","Buddy System","哈希算法","二分合并"],"source":"王道2027版 印刷页 183（PDF p195）","status":"final"},{"id":"os-ch3-3.1-017","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"引入非连续分配的原因与基本/请求分页的来源","level":"l2","title":"为什么要非连续分配（离散分配）","answer":"1. 问题：连续分配下，即使系统拥有超过 1GB 的空闲内存，只要其中不存在【连续的】1GB 空间，需要该大小内存的作业便无法装入——这是外部碎片导致的。\n2. 对策：引入【非连续分配方式】——把进程地址空间划分为多个单元，允许这些单元分散地装入互不相邻的内存区域，彻底摆脱对外部连续空间的依赖。\n3. 代价：必须额外维护各逻辑单元与其物理位置之间的【映射关系】，带来存储开销。\n4. 分类：按划分单元的大小是否固定，分为分页存储管理与分段存储管理；若作业运行前需一次性装��全部单元，称为【基本分页/基本分段】；若支持按需动态装入，则称为【请求分页/请求分段】。","keywords":["非连续分配","离散分配","外部碎片","基本分页","请求分页"],"source":"王道2027版 印刷页 183（PDF p195）","status":"final"},{"id":"os-ch3-3.1-018","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"基本分页的基本概念：页框、页面、为何无外部碎片","level":"l1","title":"分页的基本概念（页框/页面/页内碎片）","answer":"1. 做法：将物理内存划分为若干大小相等的固定单元，称为【页框（页帧、物理块）】；同时把进程逻辑地址空间划分为与页框大小相同的单元，称为【页面（页）】；系统以页框为单位为进程分配内存。\n2. 与固定分区的本质区别：固定分区按作业整体分配；分页把进程与内存都按固定大小的单元划分，分配以页为单位。\n3. 结论：分页管理【不会产生外部碎片】；但页面大小固定，进程某页未填满时会在对应页框留下未使用空间，形成【页内碎片（内部碎片）】，每个进程平均产生的页内碎片约为【半页】。\n4. 页号与页框号：进程逻辑地址空间的页面编号称为页号（从 0 开始）；物理内存中页框的编号称为页框号（物理块号，从 0 开始）。通过建立页号→页框号的映射为页面分配内存。\n5. 页面大小：通常取 2 的整数次幂。页面过小→页面数量增多、页表过长、地址转换开销大、换入换出效率降低；页面过大→页内碎片增多、内存利用率降低。","keywords":["页框","页面","页内碎片","内部碎片","无外部碎片","页框号"],"source":"王道2027版 印刷页 183–184（PDF p195–196）","status":"final"},{"id":"os-ch3-3.1-019","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"分页系统的逻辑地址结构与页表","level":"l1","title":"分页的逻辑地址结构与页表","answer":"1. 逻辑地址结构：由【页号 P】和【页内偏移量 W】两部分组成。\n2. 举例：32 位地址、页面大小 2¹²B（4KB）时，低 12 位（0～11）为页内偏移量，高 20 位（12～31）为页号，最多可支持 2²⁰ 个页面。\n3. 页表：系统为每个进程建立一张页表，是按页号顺序排列的数组；每个页表项记录该页面所驻留的【物理页框号】及相关状态信息（有效位、访问位等）。通过页号索引页表即可得到物理块号。\n4. 页表的作用：实现从【页号到页框号】的映射。\n5. 页号隐含：页表项按页号顺序连续存放，页号作为索引是隐含的，无须在页表项中显式存储。\n6. 页表寄存器 PTR：存放页表在内存中的始址 F 和页表长度 M；单 CPU 系统通常只设一个 PTR。进程未执行时，页表始址和长度保存在其【PCB】中，进程被调度时由操作系统装入 PTR。","keywords":["逻辑地址结构","页号","页内偏移量","页表","页表寄存器","PTR","PCB"],"source":"王道2027版 印刷页 184–185（PDF p196–197）","status":"final"},{"id":"os-ch3-3.1-020","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"基本分页的地址变换过程与计算","level":"l2","title":"分页地址变换四步法","answer":"设页面大小为 L，逻辑地址 A 转换为物理地址 E 的过程（由 MMU 硬件自动完成）：\n① 计算页号 P = ⌊A / L⌋，页内偏移量 W = A % L。\n② 越界检查：若 P ≥ 页表长度 M，产生越界中断；否则继续。\n③ 查页表：页表项地址 = 页表始址 F + 页号 P × 页表项长度，取出该页表项中的物理块号 b。\n④ 形成物理地址：E = b × L + W（物理地址 = 页面在内存中的始址 + 页内偏移量；页面始址 = 块号 × 块大小）。\n【书中例题】L = 1KB，页号 2 对应物理块号 b = 8，逻辑地址 A = 2500：\n P = 2500 / 1K = 2；W = 2500 % 1K = 452；E = 8 × 1024 + 452 = 8644。\n注意：若逻辑地址以二进制给出，页号与页内偏移可直接截取高位、低位得到，效率更高（页面大小固定，逻辑地址可视作一维线性地址，一个整数即可确定位置）。","keywords":["地址变换","页号","页内偏移量","物理地址","越界中断","页表项地址"],"source":"王道2027版 印刷页 185（PDF p197）","status":"final"},{"id":"os-ch3-3.1-021","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"页表项大小的确定","level":"l2","title":"页表项大小怎么定（计算）","answer":"原则：页表项必须能表示【所有可能的物理页框号】。\n计算步骤（书例：32 位地址空间、按字节编址、页面大小 4KB）：\n① 物理内存最多包含页框数 = 2³²B / 4KB = 2²⁰ 个。\n② 表示页框号至少需要 log₂2²⁰ = 20 位。\n③ 内存按字节编址，故页表项大小至少 ⌈20 / 8⌉ = 3B。\n④ 实际系统出于对齐与扩展考虑（要加有效位、访问位等），通常把页表项设为【4B】。\n易错点：页号位数由【逻辑地址空间】决定，页表项位数由【物理地址空间/物理页框数】决定，二者不可混用。\n分页的两个主要挑战：①每次访存都需地址转换，转换不够快会显著降低性能；②页表本身占内存，页表过大降低内存利用率——这推动了快表（TLB）与多级页表。","keywords":["页表项大小","页框号","物理地址空间","按字节编址","4B"],"source":"王道2027版 印刷页 185（PDF p197）","status":"final"},{"id":"os-ch3-3.1-022","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"快表（TLB）地址变换与有效访问时间 EAT","level":"l2","title":"快表 TLB 与有效访问时间 EAT","answer":"1. 为什么需要 TLB：页表全部放内存时，每次访问内存（取指或读写数据）至少需【两次访存】——第一次查页表得物理块号，第二次按物理地址访问目标内容。为此增设具有并行查找能力的高速缓冲存储器【快表（TLB）】，缓存当前活跃的若干页表项；主存中的完整页表称为【慢表】。\n2. 地址变换过程：\n ① CPU 给出逻辑地址后，硬件自动提取页号，与快表中所有页号【并行比较】。\n ② 命中：直接从快表取出物理块号，与页内偏移拼接形成物理地址，【仅需 1 次访存】。\n ③ 未命中：访问内存中的页表读取页表项得到物理块号，再拼接访问内存，共【2 次访存】；同时把该页表项装入快表（快表满则按置换算法淘汰旧项）。\n3. 有效访问时间（EAT，设命中率为 a、TLB 访问时间为 t_TLB、访存时间为 t_m）：\n EAT = a × (t_TLB + t_m) + (1 − a) × (t_TLB + 2 × t_m)\n 若忽略查 TLB 的时间，则 EAT = a × t_m + (1 − a) × 2t_m = (2 − a) × t_m。\n4. 例：命中率 90% 时 EAT = 0.9 × t_m + 0.1 × 2t_m = 1.1t_m，即比不变换多 10% 的访存时间开销。书中指出程序局部性良好时命中率通常可达 90% 以上，性能开销可控制在 10% 以内。\n5. 原理依据：快表的有效性基于【局部性原理】。","keywords":["TLB","快表","慢表","EAT","有效访问时间","命中率","两次访存"],"source":"王道2027版 印刷页 185–186（PDF p197–198）","status":"final"},{"id":"os-ch3-3.1-023","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"两级页表：问题、解决方案与逻辑地址结构","level":"l2","title":"两级页表（页目录）的由来与结构","answer":"1. 问题：基本分页下进程执行时虽无须把所有页面调入内存，但整个页表仍需【驻留内存】；页表可能非常庞大。以 32 位逻辑地址、页面 4KB、页表项 4B 为例：页内偏移 12 位、页号 20 位 → 每进程页表最多 2²⁰ 个页表项，仅页表就需 2²⁰ × 4B / 4KB = 1K 个页；若还要求页表连续存放，显然不切实际。\n2. 解决思路（两个方面）：①对页表采用【离散分配】，不要求连续存放，用一张专门的索引表记录各页表页在内存中的位置；②仅将当前活跃的部分页表项调入内存，其余驻留磁盘按需调入（虚拟内存思想）。\n3. 本质：为已离散化的页表再建立一层页表，称为【外层页表（页目录）】。\n4. 计算（上述条件）：每页可容纳 4KB / 4B = 1024 个页表项，总页表项 2²⁰ → 需 2²⁰ / 2¹⁰ = 2¹⁰ = 1024 个页表页；外层页表含 1024 个表项，恰好占一页（4KB）。\n5. 逻辑地址结构（从高到低）：一级页号（页目录号）10 位 | 二级页号（页号）10 位 | 页内偏移 12 位。\n6. 多级页表的目的（结论）：通过按需分配页表页，避免为未使用的地址空间预留大量无用页表项，显著节省内存开销。","keywords":["两级页表","页目录","外层页表","页表页","页目录号","离散分配"],"source":"王道2027版 印刷页 186（PDF p198）","status":"final"},{"id":"os-ch3-3.1-024","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"两级页表的内容与地址变换（三次访存）","level":"l2","title":"两级页表地址变换三步法","answer":"1. 表项内容：内层（普通）页表的每个表项存放进程某页对应的【物理块号】（如 0 号页存放在 1 号物理块）；外层（页目录）的每个表项存放某个【页表页的物理起始地址】（如 0 号页表页存放在 3 号物理块）。\n2. 硬件支持：增设【外层页表寄存器（页目录基址寄存器）】，存放外层页表的起始地址。\n3. 地址变换过程：\n ① 用逻辑地址中的【页目录号】索引外层页表，得到对应内层页表的物理起始地址；\n ② 用逻辑地址中的【二级页号】索引该页表，得到目标页面的物理块号；\n ③ 把物理块号与【页内偏移量】拼接形成物理地址，据此访问内存单元。\n4. 访存次数：无快表时此过程需【3 次访存】（查页目录 + 查页表 + 访问目标）。\n5. 64 位扩展：若逻辑地址 64 位、页面 4KB，则页号占 52 位，每页仍可放 1024 个页表项时需约 6 级页表；实际系统通常把虚拟地址限制为 48 位，采用 3～4 级页表即可。\n易错点：页目录寄存器存放的是【页目录（外层页表）的起始地址】，不是页表始址、也不是页表项内容（2021 真题）。","keywords":["两级页表","页目录基址寄存器","三次访存","页表基址","逻辑地址结构"],"source":"王道2027版 印刷页 187（PDF p199）","status":"final"},{"id":"os-ch3-3.1-025","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"分段的定义与二维地址空间","level":"l1","title":"基本分段的定义与逻辑地址结构","answer":"1. 设计出发点：分页从【计算机】角度设计，目的是提高内存利用率和系统性能，地址转换由硬件自动完成、对用户透明；分段从【用户和程序员】的实际需求出发，目的是支持方便编程、信息保护与共享、动态增长、动态链接等。\n2. 分段定义：把用户进程逻辑地址空间划分为若干【大小不等的段】（如主程序段、子程序段、栈段、数据段等）；每个段内部从 0 开始编址、段内连续，【段间不要求连续】。\n3. 逻辑地址结构：由【段号 S】和【段内偏移量 W】两部分组成——整个进程的逻辑地址结构呈【二维特性】，由段号和段内偏移共同确定一个地址。\n4. 举例：段号与段内偏移各占 16 位，则一个进程最多可有 2¹⁶ = 65536 个段，最大段长 64KB。\n5. 与分页的关键差异：分页的页号与页内偏移对用户透明；分段的段号和段内偏移必须由用户【显式】提供（高级语言中由编译程序自动完成）。","keywords":["分段","段号","段内偏移量","二维地址空间","对用户可见"],"source":"王道2027版 印刷页 187–188（PDF p199–200）","status":"final"},{"id":"os-ch3-3.1-026","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"段表与段表项大小的计算","level":"l2","title":"段表与段表项大小","answer":"1. 段表：每个进程拥有一张段表，实现逻辑段到物理内存区的映射；每个段对应一个段表项，记录该段的【基址（起始地址）】和【段长】。\n2. 段号隐含：段表项连续存放且长度相同，段号可作为隐含索引，无须额外存储。\n3. 段表项大小计算（32 位分段系统例）：段号 16 位、段内偏移 16 位（段长字段 16 位，对应最大段长 64KB）、物理地址 32 位（可寻址 4GB）。故每个段表项至少需 16（段长）+ 32（基址）= 48 位 =【6B】。\n4. 定位公式：若段表首地址为 M，则第 K 号段对应的段表项位于地址 M + K × 6 处。\n易错点：段表项的“段长”字段长度由【逻辑地址中段内偏移的位数】决定，基址字段长度由【物理地址位数】决定，两者不能混。","keywords":["段表","段表项","基址","段长","段号隐含"],"source":"王道2027版 印刷页 188（PDF p200）","status":"final"},{"id":"os-ch3-3.1-027","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"分段系统的地址变换（含双重越界检查）","level":"l2","title":"分段地址变换四步法","answer":"硬件支持：设一个【段表寄存器】，存放段表始址 F 和段表长度 M。从逻辑地址 A 到物理地址 E 的变换：\n① 从逻辑地址 A 中分离出段号 S 和段内偏移量 W。\n② 段号越界检查：若 S ≥ 段表长度 M，产生段号越界中断；否则继续。\n③ 查段表：段表项地址 = 段表始址 F + 段号 S × 段表项长度；取出该段的段长 C，若 W ≥ C，产生【段内越界中断】；否则继续。\n④ 取出该段的基址 b，计算物理地址 E = b + W，据此访问内存。\n关键对比（背）：分页只有【一道】越界检查（页号 ≥ 页表长度），分段有【两道】——段号越界 + 段内偏移越界，因为段长不等。\n易错点：分段的物理地址 = 基址 + 段内偏移（加法），不是“块号 × 页大小 + 偏移”的乘法拼接。","keywords":["分段地址变换","段表寄存器","越界中断","段内越界","基址加偏移"],"source":"王道2027版 印刷页 188–189（PDF p200–201）","status":"final"},{"id":"os-ch3-3.1-028","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"分页与分段的对比（三点本质区别）","level":"l1","title":"分页 vs 分段：三点对比","answer":"分页与分段都是非连续分配方式，都需地址映射机构实现地址变换，但概念上有本质区别，共三点：\n1. 【单位不同、目的不同、可见性不同】：页是系统管理内存的【物理单位】，分页主要目的是提高内存利用率，完全由系统实现、对用户透明；段是用户程序的【逻辑单位】，分段主要目的是满足编程、共享、保护等需求，由编译器根据程序结构划分、对用户可见。\n2. 【大小是否固定】：页的大小【固定】，由系统决定；段的长度【不固定】，取决于程序的逻辑结构。\n3. 【地址空间维数】：分页地址空间是【一维】的，程序员只需给出单一线性地址；分段地址空间是【二维】的，引用地址时必须同时指定段名（段号）和段内偏移量。\n补充：页面在物理内存中只能从页面大小的整数倍地址开始存放。","keywords":["分页","分段","物理单位","逻辑单位","一维","二维"],"source":"王道2027版 印刷页 189（PDF p201）","status":"final"},{"id":"os-ch3-3.1-029","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"段的共享与保护","level":"l2","title":"段的共享与保护","answer":"1. 为何分段更利于共享：分页也能实现共享但远不如分段方便——若共享代码占 N 个页框，则每个共享进程的页表中都需建立 N 个页表项；而分段系统中无论段多大，只需在每个进程的段表中设置【一个段表项】指向该共享段。\n2. 保护（两类）：\n ① 地址越界保护：段号 ≥ 段表长度 → 越界中断；段内偏移 ≥ 段长 → 越界中断。\n ② 存取控制保护：通过段表项中的【访问权限位】防止非法访问。\n3. 共享的实现：系统可维护一张【共享段表】，每个共享段对应一个表项，记录段号、段长、内存起始地址、存在位、外存起始地址以及共享进程计数 count。进程不再使用时 count 减 1，仅当 count = 0 时才回收该段内存。\n4. 同一共享段在不同进程中可以具有【不同的段号】，各进程通过各自的段号访问同一物理段（2019 真题易错点）。\n5. 可重入代码（纯代码）不能被修改，允许多进程并发执行；为保证共享代码完整性，应置于【只读段】中，每个进程另配私有局部数据区。","keywords":["段共享","共享段表","count","存取控制保护","只读段","可重入代码"],"source":"王道2027版 印刷页 189（PDF p201）","status":"final"},{"id":"os-ch3-3.1-030","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"段页式存储管理","level":"l2","title":"段页式：地址结构、表结构与访存次数","answer":"1. 思想：分页提高内存利用率，分段反映程序逻辑结构并便于共享与保护；段页式把两者结合。进程地址空间先划分为若干逻辑段（每段唯一段号），每段再划分为若干固定大小的页；内存仍按分页方式划分为与页面等大的物理块，以物理块为单位分配。\n2. 逻辑地址结构（三段）：【段号 S | 页号 P | 页内偏移量 W】。\n3. 表结构：每个进程一张【段表】，每个段表项记录该段的【页表始址和页表长度】（段号隐含）；每个段对应一张【页表】，页表项记录物理块号（页号隐含）；系统设一个段表寄存器存放段表始址和段表长度，既用于段表寻址也用于段号越界检查。\n 注意：每个进程【仅一张段表】，但可能有【多张页表】（每段一张）。\n4. 地址变换三步：①按段号 S 经段表寄存器查段表，得该段页表起始地址；②按页号 P 查该页表，得物理块号；③把物理块号与页内偏移 W 拼接成物理地址。\n5. 访存次数：无快表时每次基于逻辑地址的内存访问需【3 次访存】；引入快表后其表项包含关键字（段号、页号）及对应的物理块号和保护信息。\n6. 对用户而言程序仍按段组织，页的划分由系统自动完成且完全透明——故段页式地址空间仍是【二维】的，与分段一致。","keywords":["段页式","段表","页表","三次访存","段号页号页内偏移"],"source":"王道2027版 印刷页 190–191（PDF p202–203）","status":"final"},{"id":"os-ch3-3.1-031","chapter":"第3章 内存管理","section":"3.1 内存管理概念","topic":"各类存储管理方式的三个关键问题（本节小结）","level":"l3","title":"本节小结：三件必掌握的事","answer":"无论是段式、页式还是段页式管理，只需掌握三个关键问题：\n① 逻辑地址结构（由哪几部分组成、各占多少位）；② 页（段）表项结构（每个表项存什么、多长）；③ 寻址过程（几步、查几次表、访存几次、哪里做越界检查）。\n搞清这三点，便掌握了各类存储管理方式的核心机制。\n另两个小结问答（可直接背）：\n1. 为什么需要内存管理？单道程序时内存分配极简单（全给当前进程）；引入多道程序设计后多个进程并发共享主存，若缺乏有效管理，不同进程地址空间可能重叠或被覆盖，导致数据被意外修改、破坏程序正确性，因此必须进行内存管理。\n2. 多级页表解决了什么问题、又带来什么问题？解决了逻辑地址空间较大时单级页表过长、占用内存过多的问题，且避免了对大块连续内存的需求；但无快表时一次地址变换需逐级访问多级页表，造成多次访存、增加访存延迟。","keywords":["本节小结","逻辑地址结构","表项结构","寻址过程","多级页表优缺点"],"source":"王道2027版 印刷页 191（PDF p203）","status":"final"},{"id":"os-ch3-3.2-001","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"传统存储管理方式的两个特征（一次性、驻留性）","level":"l1","title":"传统存储管理的两个特征","answer":"3.1 节的各种内存管理策略都是为了把多个进程同时保留在内存中以支持多道程序设计，它们有两个共同特征：\n1. 【一次性】：作业必须一次性全部装入内存后才能开始运行。带来两个问题：①作业过大无法全部装入时不能运行；②大量作业请求运行时内存容纳不下，只能让少数作业先运行，导致系统并发度下降。\n2. 【驻留性】：作业一旦装入内存便一直驻留其中，任何部分都不会被换出，直至作业运行结束；而运行中的进程常因等待 I/O 而被阻塞，可能长时间等待。\n后果：许多暂未使用或暂时不用的代码和数据仍占据大量内存，而急需运行的作业却因内存不足无法装入，浪费宝贵的内存资源。","keywords":["一次性","驻留性","多道程序设计","并发度"],"source":"王道2027版 印刷页 212（PDF p224）","status":"final"},{"id":"os-ch3-3.2-002","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"局部性原理（时间局部性、空间局部性）","level":"l1","title":"局部性原理","answer":"快表、页高速缓存及虚拟内存技术都属于缓存技术，都依赖【局部性原理】。局部性原理既适用于程序结构，又适用于数据结构，表现在两方面：\n1. 【时间局部性】：程序中的某条指令或某个数据项一旦被访问，不久之后很可能再次被访问。原因是程序中存在大量的循环和重复操作。\n2. 【空间局部性】：一旦程序访问了某个存储单元，不久之后其附近的存储单元也很可能被访问。因为指令通常按顺序存放并顺序执行，数据（向量、数组、表等）也一般以连续或簇聚方式存储。\n实现手段：时间局部性通过把近期使用的指令和数据保存在高速缓存中、借助多级缓存层次加以利用；空间局部性通过较大容量缓存并把预取机制集成到缓存控制逻辑中实现。\n虚拟内存技术正是基于局部性原理，把外存作为内存的透明扩展，缓解物理内存不足。","keywords":["局部性原理","时间局部性","空间局部性","缓存","预取"],"source":"王道2027版 印刷页 212（PDF p224）","status":"final"},{"id":"os-ch3-3.2-003","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"虚拟存储器的定义（请求调页 + 页面置换）","level":"l1","title":"虚拟存储器的定义","answer":"基于局部性原理：程序装入时只把当前运行所需的少数页面（段）装入内存，其余暂留外存即可启动执行。\n1. 【请求调页（请求调段）】：程序执行中若所访问的信息不在内存，操作系统自动将其从外存调入内存，然后继续执行。\n2. 【页面置换（段置换）】：内存空间不足时，操作系统把暂时不用的信息换出到外存，腾出空间存放即将调入的内容。\n结论：通过这两种机制协同工作，系统为用户提供了一个【逻辑上远大于物理内存的地址空间】，称为虚拟存储器。\n“虚拟”的含义：该存储器并非真实存在的物理实体，而是操作系统通过部分装入、请求调入和置换功能（均对用户透明）构造的逻辑抽象；用户程序可像使用大容量内存一样运行，无须关心物理内存实际大小。\n易错点：虚拟内存是【逻辑上扩充内存容量】，不是物理上扩充，也不是扩充外存。","keywords":["虚拟存储器","请求调页","页面置换","逻辑扩充","透明"],"source":"王道2027版 印刷页 212–213（PDF p224–225）","status":"final"},{"id":"os-ch3-3.2-004","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"虚拟存储器的三个特征：多次性、对换性、虚拟性","level":"l1","title":"虚拟存储器的三个特征","answer":"1. 【多次性】：作业无须在运行前一次性全部装入内存，可分多次动态调入；只需装入当前需要执行的程序和数据即可开始运行，后续所需部分访问时按需调入。\n2. 【对换性】：作业在运行过程中无须常驻内存，操作系统可把暂不使用的程序或数据换出至外存对换区，以后需要时再换入，实现内存高效利用。\n3. 【虚拟性】：从用户视角看内存容量被逻辑扩充，呈现远大于实际物理内存的可用空间。虚拟性是虚拟存储器的【本质特征和根本目标】，其实现依赖于多次性与对换性。\n易错点（真题设陷阱）：【一次性】是传统存储管理的特征，不属于虚拟内存特征；虚拟内存三特征是多次性、对换性、虚拟性。\n另：为使虚存系统有效发挥作用，所运行的程序应具有【较好的局部性】。","keywords":["多次性","对换性","虚拟性","本质特征","局部性"],"source":"王道2027版 印刷页 213（PDF p225）","status":"final"},{"id":"os-ch3-3.2-005","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"虚拟内存技术的实现方式与硬件支持","level":"l2","title":"虚拟内存的实现方式与硬件支持","answer":"1. 为什么必须离散分配：虚拟内存允许作业分多次调入内存，若采用连续分配，会导致相当一部分内存空间暂时甚至“永久”空闲，既浪费又无法逻辑扩充内存。因此虚拟内存必须建立在【离散分配】的内存管理方式之上。\n2. 三种实现方式：请求分页存储管理、请求分段存储管理、请求段页式存储管理。\n3. 必须具备的硬件支持（四类）：\n ① 足够容量的内存和外存（存放程序当前部分与后备部分）；\n ② 页表机制（或段表机制），作为地址映射的关键数据结构；\n ③ 中断机构，用户程序访问尚未调入内存的部分时触发缺页（或缺段）中断；\n ④ 地址变换机构，运行过程中动态把逻辑地址转换为物理地址。\n易错点：实现虚拟内存【必须有硬件支持】，仅靠软件不行。","keywords":["离散分配","请求分页","请求分段","请求段页式","硬件支持","缺页中断机构"],"source":"王道2027版 印刷页 213（PDF p225）","status":"final"},{"id":"os-ch3-3.2-006","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"请求分页与基本分页的区别","level":"l1","title":"请求分页系统比基本分页多了什么","answer":"1. 请求分页建立在基本分页基础之上，为支持虚拟存储器增加了【请求调页】和【页面置换】两个功能：只需把当前需要的一部分页面装入内存便可启动作业；运行中访问的页面不在内存时通过请求调页从外存调入，内存不足时通过页面置换把暂不用的页面换出到外存。\n2. 为什么请求分页最常用：每次换入换出的基本单位都是【长度固定的页面】，实现比以长度可变的段为单位的请求分段更简单，效率也较高。\n3. 硬件支持：除足够容量的内存和外存外，还需【页表机制、缺页中断机构、地址变换机构】。\n易错点（真题设陷阱）：请求分页与基本分页的区别是【不必将作业全部装入内存】；而“采用快表技术”不是区别（基本分页也可用快表），“不必装入连续区域”也不是（两者都是离散分配）。","keywords":["请求分页","请求调页","页面置换","基本分页区别"],"source":"王道2027版 印刷页 213（PDF p225）","status":"final"},{"id":"os-ch3-3.2-007","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"请求分页页表项新增的四个字段","level":"l1","title":"请求分页页表的四个新字段（状态位/访问位/修改位/外存地址）","answer":"请求分页的页表项在基本结构（页号 + 物理块号）基础上增加四个字段，对应操作系统必须能回答的四个问题：\n1. 【状态位 P（存在位）】：标记该页是否已调入内存，供地址变换时判断是否触发缺页中断。（→ 判断某页是否已在内存）\n2. 【访问字段 A】：记录本页在一段时间内的访问次数，或记录自上次访问以来的时间间隔，供页面置换算法选择换出页时参考。（→ 依据访问特征选择换出页）\n3. 【修改位 M（脏位）】：标记该页调入内存后是否被修改过，以决定换出时是否需要写回外存。（→ 决定是否写回）\n4. 【外存地址】：指示该页在外存中的存放位置（通常为物理块号），供调页时读入内存。（→ 若未调入，需要知道它在哪）\n一句话背：状态位判存在、访问位选淘汰、修改位定写回、外存地址供调入。","keywords":["状态位","存在位","访问位","修改位","外存地址","页表项"],"source":"王道2027版 印刷页 213–214（PDF p225–226）","status":"final"},{"id":"os-ch3-3.2-008","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"缺页中断处理流程","level":"l2","title":"缺页中断的处理流程","answer":"1. 触发：进程访问的页面尚未调入内存（状态位为 0）时，硬件自动触发缺页中断，由操作系统的【缺页中断处理程序】处理。\n2. 处理步骤：\n ① 通过页表项取得该页在外存中的地址；\n ② 判断内存是否已满（是否有空闲页框）；\n ③ 若【有】空闲页框：分配一个页框，从外存调入所缺页面，更新页表项（填写物理块号、置存在位为 1）；\n ④ 若【无】空闲页框：先按页面置换算法选出一页准备换出——该页修改位为 0 则直接丢弃，修改位为 1 则必须先写回外存（对换区）再释放页框；随后调入所缺页面并更新页表项；\n ⑤ 页面调入完成后，【重新执行引发缺页的那条指令】（而不是它的下一条）。\n3. 缺页中断的两个显著特点（作为内中断，虽也需保护 CPU 现场、分析中断原因、转入中断处理程序、恢复现场）：\n ① 在【指令执行期间】触发，由当前指令的地址访问直接引发，而非指令执行完毕之后；\n ② 【一条指令执行过程中可能引发多次缺页中断】（如 copy A to B 指令本身及两个操作数各跨两页，最多可引发 6 次）。","keywords":["缺页中断","状态位","修改位","缺页处理程序","重新执行","内中断"],"source":"王道2027版 印刷页 214（PDF p226）","status":"final"},{"id":"os-ch3-3.2-009","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"请求分页的地址变换过程","level":"l2","title":"请求分页地址变换四步（检索快表优先）","answer":"在基本分页地址变换机构基础上增加缺页中断触发机制，过程如下：\n① 首先检索【快表（TLB）】：命中则从表项取出该页物理块号，并置访问位为 1（供置换算法参考）；对于写操作还需置修改位为 1。\n② 若快表未命中，访问【页表】：该页已在内存（状态位 = 1）则取出物理块号，并把该页表项装入快表（快表满则按置换算法淘汰一项）。\n③ 若页面不在内存（状态位 = 0），触发【缺页中断】：操作系统接管，把所需页面从外存调入内存（必要时先换出一页），更新页表和快表，随后【重新执行地址变换】以获取物理块号。\n④ 把物理块号与页内偏移拼接形成物理地址，用于访存。\n关键次序（背）：越界检查 → 查快表 → 查页表 → 缺页中断 → 置换/调入 → 重新代入 → 得物理地址。","keywords":["地址变换","快表","状态位","缺页中断","修改位","访问位"],"source":"王道2027版 印刷页 214–215（PDF p226–227）","status":"final"},{"id":"os-ch3-3.2-010","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"页框分配：最小页框数与驻留集","level":"l2","title":"最小页框数与驻留集","answer":"1. 【最小页框数】（最小物理块数）：保证进程正常运行所需的最少页框数，低于此值进程无法执行。它取决于计算机的【硬件结构】，即指令格式、功能和寻址方式：\n · 单地址指令 + 直接寻址的简单机器：2 个（1 个放指令、1 个放数据）；\n · 支持间接寻址：至少 3 个（指令、指针、数据）；\n · 功能较强的机器：一条指令及其两个操作数各跨两页时，最坏情况涉及 6 个不同页面，故至少分配【6 个】页框。\n2. 【驻留集】：操作系统为该进程分配的页框集合（页表 + 进程页面的集合）。大小需在系统并发度与缺页开销之间权衡：\n · 驻留集过小 → 可容纳进程数增多、并发度提高，但每个进程页框过少，缺页率显著升高，CPU 大量时间花在处理缺页中断上；\n · 驻留集过大 → 超过阈值后继续增加对缺页率改善趋于平缓，浪费内存，且可用页框总量减少而降低整体并发能力。","keywords":["最小页框数","最小物理块数","驻留集","并发度","缺页率"],"source":"王道2027版 印刷页 215（PDF p227）","status":"final"},{"id":"os-ch3-3.2-011","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"页面分配与置换的三种策略","level":"l1","title":"固定分配局部置换 / 可变分配全局置换 / 可变分配局部置换","answer":"理论上有 固定/可变 × 局部/全局 四种组合，但【固定分配】要求页框数不变、而【全局置换】会导致进程页框数变化，二者互斥，故实际可行只有三种：\n1. 【固定分配局部置换】：为每个进程分配固定数量的页框且运行期间不变；缺页时只能从该进程自身已分配的页框中选一页换出。难点：分配太少→频繁缺页；分配过多→浪费内存、减少并发进程数。\n2. 【可变分配全局置换】：初始分配一定数量页框，运行期间按需动态调整；缺页时先从空闲页框队列取一个空闲页框分配给该进程，若已耗尽则允许从【所有进程】的页框中选一页换出。较灵活，但缺乏调控时活跃进程驻留集可能持续膨胀、抢占其他进程页框，削弱并发能力。\n3. 【可变分配局部置换】：初始分配一定数量页框；缺页时只从【该进程自身】的页框中换出，不影响其他进程；并根据缺页率动态调整驻留集——缺页率过高则增加页框，过低则适当回收（须确保不会引起缺页率显著上升）。能抑制频繁调页又能兼顾并发，但实现复杂、开销较大。\n易错点：2015 真题就考这三种策略的【名称】，属必背。","keywords":["固定分配局部置换","可变分配全局置换","可变分配局部置换","页框数变化","缺页率"],"source":"王道2027版 印刷页 215–216（PDF p227–228）","status":"final"},{"id":"os-ch3-3.2-012","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"页框调入算法与调入页面的时机","level":"l2","title":"页框调入算法与预调页/请求调页","answer":"1. 页框调入算法（用于固定分配策略下把空闲页框分给进程）：\n ① 平均分配算法：把所有可分配页框平均分给各进程；\n ② 按比例分配算法：按进程的逻辑地址空间大小按比例分配；\n ③ 优先权分配算法：为重要或紧迫进程分配更多页框；常用做法是把可分配页框分为两部分，一部分按比例分给各进程，另一部分按进程优先权动态分配。\n2. 调入页面的时机（两种调页策略）：\n ① 【预调页策略】：依据局部性原理一次调入若干相邻页面比逐页调入更高效；但若预调入的页面大多未被访问则浪费内存，目前预测成功率仅约 50%，故主要用于【进程首次调入时】，由程序员显式指定应优先加载的页面。\n ② 【请求调页策略】：进程访问的页面不在内存时触发缺页中断，由系统将所需页面调入；调入的页面必然会被访问、实现简单，当前虚拟存储器大多采用此策略，缺点是每次只调入一页、磁盘 I/O 开销较大。\n一句话对比：预调页在【进程运行前】完成页面加载，请求调页在【运行期间】动态调入。","keywords":["页框调入","平均分配","按比例分配","优先权分配","预调页","请求调页"],"source":"王道2027版 印刷页 216（PDF p228）","status":"final"},{"id":"os-ch3-3.2-013","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"从何处调入页面（三种情况）","level":"l2","title":"从何处调入页面","answer":"外存分为两部分：存放文件的【文件区】和存放换出页面的【对换区（交换区）】。对换区采用连续分配方式、文件区采用离散分配方式，因此【对换区的磁盘 I/O 速度通常快于文件区】。缺页时调入来源分三种情况：\n1. 系统拥有足够的对换区空间：可把所有页面都从对换区调入以提高调页速度；为此需在进程运行前把与该进程相关的文件从文件区【复制】到对换区。\n2. 系统对换区空间不足：对于【不会被修改】的页面直接从文件区调入，换出时因其内容未变无须写回；对于【可能被修改】的页面，换出时必须保存到对换区，后续调入也从对换区读取（兼顾效率与正确性）。\n3. UNIX 方式：与进程相关的文件始终保留在文件区。未运行过的页面从文件区调入；曾经运行过但已被换出的页面存放在对换区，后续从对换区读取；若多个进程共享同一页面，只要该页已在内存中，其他进程可直接复用，无须重复调入。","keywords":["文件区","对换区","交换区","调入来源","UNIX方式"],"source":"王道2027版 印刷页 217（PDF p229）","status":"final"},{"id":"os-ch3-3.2-014","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"如何调入页面（完整流程）","level":"l2","title":"页面调入的完整流程","answer":"当进程访问的页面不在内存（页表项存在位为 0）时，CPU 触发缺页中断，转入缺页中断处理程序：\n① 通过页表项获取该页在外存中的地址；\n② 判断内存是否已满；\n③ 内存未满：分配一个空闲页框，发起磁盘 I/O 把所缺页面调入，更新页表项（填写物理块号、置存在位为 1）；\n④ 内存已满：按置换算法选出一页——修改位为 0 则直接丢弃，修改位为 1 则先写回对换区再释放该页框；然后把所缺页面调入该页框并更新页表项（存在位置 1）；\n⑤ 调入完成后，进程通过更新后的页表生成正确的物理地址，【重新执行】被中断的指令。\n整个页面调入过程对用户完全透明，由操作系统自动完成。","keywords":["页面调入","存在位","修改位","写回对换区","重新执行"],"source":"王道2027版 印刷页 217（PDF p229）","status":"final"},{"id":"os-ch3-3.2-015","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"页面置换算法的评价与最佳（OPT）算法","level":"l1","title":"最佳置换算法 OPT","answer":"1. 定义：页面置换算法是缺页且无空闲页框时，决定换出哪一页的算法；换入换出都涉及磁盘 I/O、开销大，好的算法应致力于【降低缺页率】。\n2. 【最佳（OPT）算法】：发生缺页时，选择淘汰【以后永不使用或在最长时间内不再被访问】的页面，理论上可获得最低缺页率。\n3. 不可实现：操作系统无法预知未来的页面访问序列，故实际系统中无法实现；但仍具重要理论意义，常用于【评价其他算法】。\n4. 书中例题：3 个物理块，访问串 7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1 → 共发生【9 次缺页】，其中 6 次触发页面置换（不算初始装入）。\n 易错点：初始装入页面 7,0,1 的 3 次缺页也算进缺页次数；说“置换次数”时要扣除初始装入。","keywords":["OPT","最佳置换算法","缺页率","不可实现","评价基准"],"source":"王道2027版 印刷页 217–218（PDF p229–230）","status":"final"},{"id":"os-ch3-3.2-016","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"先进先出（FIFO）算法","level":"l2","title":"先进先出 FIFO 算法","answer":"1. 做法：选择淘汰【最早进入内存】的页面。将内存中的页面按调入时间组织成一个队列，需要换出时直接移除队首页面。\n2. 实现：简单。\n3. 缺点：未利用局部性原理，与进程实际运行规律不符——最早装入的页面仍可能被频繁访问，故性能通常较差。\n4. 书中例题（3 个物理块，同一访问串 7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1）：共发生【15 次缺页】，其中 12 次触发页面置换。\n5. 特性：FIFO 可能出现【Belady 异常】——分配页框数增加，缺页次数反而上升。根本原因是 FIFO 仅依据调入时间决策，忽略了页面的实际使用情况。","keywords":["FIFO","先进先出","缺页率","Belady异常"],"source":"王道2027版 印刷页 218（PDF p230）","status":"final"},{"id":"os-ch3-3.2-017","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"贝拉迪异常（Belady）","level":"l1","title":"贝拉迪异常（Belady）","answer":"1. 定义：为进程分配的【物理块（页框）数增加】时，缺页次数反而【上升】的反直觉现象，称为 Belady 异常。\n2. 原因：FIFO 仅依据调入时间决策，忽略了页面的实际使用情况。\n3. 书中例：访问串 3,2,1,0,3,2,4,3,2,1,0,4 ——\n · 分配 3 个物理块时缺页次数为 9；\n · 分配 4 个物理块时缺页次数反而增至 10。\n4. 适用范围（必背）：只有【FIFO】可能出现 Belady 异常，而【OPT 和 LRU】永远不会出现此类异常。\n易错点：真题问“若采用 FIFO 算法，可分配页帧数增加时缺页中断次数如何变化”——答案是【可能增加也可能减少】。","keywords":["FIFO","Belady","缺页","物理块数"],"source":"王道2027版 印刷页 218（PDF p230）","status":"final"},{"id":"os-ch3-3.2-018","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"最近最久未使用（LRU）算法","level":"l2","title":"LRU 算法","answer":"1. 定义：选择淘汰【最近最长时间未被使用】的页面。基本思想：若某页面在过去一段时间内未被使用，则在近期未来很可能也不会被访问。\n2. 实现：为每个页面维护一个访问字段，记录自上次被访问以来经历的时间，淘汰时选该值【最大】的页面；通常需要硬件支持（如寄存器、栈），开销较大。\n3. 书中例题（3 个物理块，同一访问串）：首次访问页面 2 时把最近最久未用的页面 7 换出；访问页面 3 时把最近最久未用的页面 1 换出。图 3.24 显示前 5 次缺页处理结果与 OPT 相同。\n4. 与 OPT 的关系（易错点）：前 5 次相同仅是巧合，无必然联系。LRU 根据页面【过去】的使用情况判断，是“向前看/向后看”方向的镜像；OPT 根据页面【未来】的使用情况判断；过去与未来的走向之间并无必然联系。","keywords":["LRU","最近最久未使用","访问字段","向前看","OPT"],"source":"王道2027版 印刷页 218–219（PDF p230–231）","status":"final"},{"id":"os-ch3-3.2-019","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"四种页面置换算法的综合比较（缺页次数对照）","level":"l2","title":"OPT/FIFO/LRU 对照：同一访问串的缺页次数","answer":"在同一访问串 7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1、分配 3 个物理块、初始为空的条件下：\n· OPT：缺页【9】次，其中置换 6 次；\n· FIFO：缺页【15】次，其中置换 12 次；\n· LRU：性能介于两者之间、接近 OPT（图中缺页标记明显少于 FIFO）。\n性能与可实现的权衡（必背结论）：\n· OPT 性能最好但【无法实现】；\n· FIFO 实现简单，但忽略局部性、【性能较差】，还可能出现 Belady 异常；\n· LRU 性能接近 OPT、实际效果良好，但实现通常需硬件支持、【开销较大】。\n易错点：不要记成“LRU 缺页数一定等于 OPT”；两者只是这个例子的前 5 次相同。","keywords":["OPT","FIFO","LRU","缺页次数","性能比较"],"source":"王道2027版 印刷页 217–219（PDF p229–231）","status":"final"},{"id":"os-ch3-3.2-020","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"简单 CLOCK 算法（NRU）","level":"l2","title":"简单 CLOCK 算法","answer":"1. 动机：LRU 性能接近 OPT 但实现开销大，CLOCK 系列算法试图以较小开销接近 LRU 性能。\n2. 结构：为每页设置一个【访问位】，首次装入或访问时置 1；所有页框组成一个【循环队列】，维护一个【替换指针】指向当前检查位置。\n3. 置换规则：指针所指页面访问位为 0 → 直接淘汰；访问位为 1 → 置 0 并把指针顺移到下一页，给予该页一次“宽恕”机会（暂不淘汰，后续轮询再判断）。因指针循环移动形如时钟，故称 CLOCK 算法；又因仅依据“最近是否被使用”的粗略信息，也称【最近未用（NRU）算法】。\n4. 书中例（4 个页框、访问串 7,0,1,2,0,3,0,4,2,3,0,3,2,1,3,2）：访问 3 时发生第 5 次缺页，替换指针在帧 1 且所有访问位为 1，算法完整扫描一圈把各帧访问位清零、指针回到帧 1，淘汰帧 1 中的页面 7；访问 4 时替换指针指向帧 2（上次替换位置的下一帧），帧 2 访问位为 1 → 置 0 继续，帧 3 访问位为 0 → 淘汰页面 2；最后访问 2 时淘汰帧 2 中的页面 0。\n易错点：CLOCK 不是“淘汰访问次数多的页面”，而是淘汰【访问位为 0（最近没被访问）】的页面。","keywords":["CLOCK","NRU","访问位","替换指针","循环队列"],"source":"王道2027版 印刷页 219–220（PDF p231–232）","status":"final"},{"id":"os-ch3-3.2-021","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"改进型 CLOCK 算法（A、M 两类位四类页面）","level":"l2","title":"改进型 CLOCK 算法","answer":"1. 动机：页面换出时若已被修改需写回磁盘，未修改则无须写回，故【修改过的页面置换代价更高】。改进型 CLOCK 在访问位（A）基础上引入【修改位（M）】，综合使用情况与置换代价，优先淘汰既未被访问过又未被修改的页面。\n2. 四类页面（按 (A,M)）：\n · 1 类（A=0, M=0）：最近未被访问且未被修改——【最佳】淘汰页；\n · 2 类（A=0, M=1）：最近未被访问但已修改——【次佳】淘汰页；\n · 3 类（A=1, M=0）：最近已被访问、未修改——可能再次被访问；\n · 4 类（A=1, M=1）：最近已被访问且已修改——可能再次被访问。\n3. 扫描步骤（最多 3 轮，必有结果）：\n ① 第一轮：从当前指针位置起找 A=0 且 M=0 的 1 类页面，找到即淘汰；此轮【不修改任何访问位】；\n ② 第二轮：若①失败，找 A=0 且 M=1 的 2 类页面，找到即淘汰；此轮把所有经过页面的【A 置 0】；\n ③ 第三轮：若前两步均失败（所有页面 A=1），把指针复位到起始位置并将所有帧的访问位清零，然后重复①；若仍无 1 类页面，再执行②——此时必能找到可淘汰页。\n4. 优缺点：优点是优先淘汰未修改页、降低磁盘 I/O 开销；缺点是可能需多轮扫描、算法自身开销增加。","keywords":["改进型CLOCK","访问位A","修改位M","1类页面","扫描三轮","脏页"],"source":"王道2027版 印刷页 220（PDF p232）","status":"final"},{"id":"os-ch3-3.2-022","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"抖动（颠簸）的定义、原因与处理","level":"l1","title":"抖动（颠簸）","answer":"1. 定义：页面置换中最糟糕的情形——刚刚换出的页面马上又要换入内存，刚刚换入的页面又立即被换出，这种频繁的页面调度行为称为【抖动（颠簸）】。\n2. 根本原因：分配给进程的【物理块数量过少】，无法满足其正常运行的基本需求，进程执行中频繁触发缺页中断、反复请求调入页面。\n3. 表现与后果：磁盘 I/O 频率急剧上升，进程大部分时间消耗在页面换入换出上，几乎无法完成有效计算，导致【CPU 利用率急剧下降，甚至趋近于零】。\n4. 处理思路：抖动直接源于驻留集过少，因此引入【工作集】概念来动态指导页框分配，使分配给进程的页框不少于其工作集大小。\n易错点：考研常问“系统发生抖动应如何处理/其原因是分配页框太少”；不要把抖动误答成“缺页率太低”或“CPU 太快”。","keywords":["抖动","颠簸","物理块过少","CPU利用率","磁盘I/O"],"source":"王道2027版 印刷页 220–221（PDF p232–233）","status":"final"},{"id":"os-ch3-3.2-023","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"工作集（Working Set）","level":"l2","title":"工作集与窗口尺寸","answer":"1. 定义：工作集是指在【某段时间间隔内进程实际访问过的页面集合】。工作集 W 由时间 t 和【工作集窗口尺寸 Δ】共同确定。\n2. 书中例：访问序列 1,4,2,3,5,3,2,2,1,1,1,3,4,5,4,4,2,1,1,3,3，设窗口尺寸 Δ = 5，则 t₁ 时刻工作集为 {2,3,5}，t₂ 时刻工作集为 {1,2,3,4}（取该时刻之前长度为 Δ 的访问窗口内出现过的页面）。\n3. 实际规律：工作集窗口通常设置得较大；对局部性较好的程序，其工作集大小一般【远小于】窗口尺寸 Δ。\n4. 用途（必背结论）：工作集反映了进程在随后一段时间内很可能频繁访问的页面集合，因此【驻留集大小不应小于工作集大小】，否则进程运行中将频繁发生缺页。","keywords":["工作集","窗口尺寸","驻留集","局部性","缺页"],"source":"王道2027版 印刷页 221（PDF p233）","status":"final"},{"id":"os-ch3-3.2-024","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"页面缓冲算法（页框回收）","level":"l2","title":"页面缓冲算法与页框回收","answer":"1. 背景：页框回收是 2025 大纲新增考点，核心内容是页面缓冲算法。影响页面换入/换出效率的主要因素有三个：①页面置换算法的选择（决定缺页率）；②已修改页面写回磁盘的频率；③磁盘内容读入内存的频率。\n2. 做法：在原置换算法基础上增设【修改页面链表】保存已修改且需换出的页面，数量达到一定值时【批量写回磁盘】；内存中维护两个专用链表：\n ① 【空闲页面链表（空闲页框链表）】：需读入页面时从链头取一个页框装入；若被换出的页面未被修改，不写回磁盘，直接把它所在页框挂到该链表末尾（其中仍保留原有数据），后续若再访问同一页面可直接复用，避免重新读盘。\n ② 【修改页面链表】：脏页换出时不立即写回，挂到该链表末尾，积累足够数量后批量写回磁盘。\n3. 优点：①显著降低页面换入/换出频率、大幅减少磁盘 I/O 开销；②即使采用简单置换策略（如 FIFO）也能获得良好性能，且无须特殊硬件支持，实现简单高效。\n4. Linux 中的页框回收：由守护进程【kswapd】定期检查内存使用情况，空闲页框低于阈值时主动回收。不能等空闲页框完全耗尽才回收，是因为释放脏页需先写回磁盘、而 I/O 往往需要临时页框作缓冲区；若无空闲页框，既无法分配 I/O 缓冲区也无法完成释放，可能导致【内存分配死锁】甚至系统崩溃。\n5. Linux 用【伙伴算法】按连续空闲页框数分组管理：分配是“化整为零”会产生外部碎片，故回收时做伙伴算法的逆操作——释放的页框若存在大小相等的伙伴空闲块就合并为大小翻倍的新块，并继续向上合并直至无法合并。","keywords":["页面缓冲算法","空闲页面链表","修改页面链表","批量写回","kswapd","伙伴算法"],"source":"王道2027版 印刷页 221–222（PDF p233–234）","status":"final"},{"id":"os-ch3-3.2-025","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"内存映射文件（Memory-Mapped Files）","level":"l2","title":"内存映射文件","answer":"1. 定义：内存映射文件是操作系统向应用程序提供的一种【系统调用机制】，它在磁盘文件与进程的虚拟地址空间之间建立直接映射关系，与虚拟内存机制紧密相关。\n2. 用法：进程把文件映射到其虚拟地址空间某一区域，此后便可像访问内存一样读/写该文件（把文件当作内存中的一个大字符数组访问），无须调用传统文件 I/O 接口；磁盘文件的读/写由操作系统完成，对进程透明。\n3. 调入与写回时机：映射时【并不立即加载】文件内容，而是在进程首次访问某页面时才【按需一页一页地调入】；当进程退出或显式解除文件映射时，所有被修改的页面才被写回磁盘文件。\n4. 好处（两点）：①使编程更简单（已映射文件可按内存方式读/写）；②便于多个进程共享同一个磁盘文件。\n5. 与共享内存的关系：进程可通过共享内存实现高效通信，而这种共享内存往往正是把【同一文件映射到多个通信进程的虚拟地址空间】实现的——各进程虚拟地址空间相互独立，但操作系统通过页表把它们对应的虚拟页映射到相同的物理页，因此一个进程写、另一进程读到的数据必然一致，无须额外复制或同步。","keywords":["内存映射文件","系统调用","按需调入","共享内存","解除映射"],"source":"王道2027版 印刷页 222–223（PDF p234–235）","status":"final"},{"id":"os-ch3-3.2-026","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"虚拟存储器性能的影响因素","level":"l2","title":"虚拟存储器性能影响因素","answer":"缺页率是影响虚拟存储器性能的【核心因素】，而缺页率又受以下因素影响：\n1. 【页面大小】：页面较大时单次装入可覆盖更多局部访问区域，从而降低缺页率；页面较小时缺页率相对较高。小页面减少页内碎片、提高内存利用率，但所需页面数增多、页表过长占大量内存；大页面缩短页表却增大页内碎片。故页面大小要在碎片控制与页表开销之间取得平衡。\n2. 【分配给进程的物理块数】：块数越多缺页率通常越低；但超过某阈值后改善趋于平缓（活跃页面已基本常驻，缺页主要由不必长期驻留的非活跃页面引发）。只需确保活跃页面常驻即可把缺页率控制在可接受范围。\n3. 【页面置换算法】：好的置换算法能有效降低缺页率，如 LRU、CLOCK 通过近似预测未来访问行为，优先保留可能再次被访问的页面，提高命中率。\n4. 【写回磁盘的频率】：每次都写回会频繁触发磁盘 I/O、效率极低；引入【已修改换出页面链表】——脏页换出时暂不写回而挂入该链表，积累足够数量后批量写回；若进程在写回前再次访问这些页面，可直接从链表复用、无须重新调入。\n5. 【程序的局部化程度】：局部化程度越高缺页率越低。例如数组按行存储时应尽量【按行顺序】访问，避免按列访问破坏空间局部性导致缺页率异常升高。","keywords":["缺页率","页面大小","物理块数","置换算法","写回磁盘频率","局部化程度"],"source":"王道2027版 印刷页 223（PDF p235）","status":"final"},{"id":"os-ch3-3.2-027","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"完整地址翻译流程（TLB → 页表 → Cache）","level":"l2","title":"完整虚实地址翻译与数据访问流程","answer":"完整顺序（背成一句话）：查 TLB → 缺则查页表 → 页表项无效则缺页中断调入 → 得物理地址 → 查 Cache → 未命中再访主存。\n1. 首先查询【TLB】；\n2. TLB 未命中则访问【页表】完成虚实地址转换；\n3. 若页表项无效（页面尚未调入主存）→ 触发【缺页中断】，从外存调入该页面；\n4. 利用所得【物理地址】访问 Cache；\n5. Cache 未命中则进一步从主存读取数据。\n书中示例结论（虚拟地址 14 位、物理地址 12 位、页面 64B，TLB 四路组相联 16 项，data Cache 直接映射、行 4B、16 组）：\n· 0x03d4：TLB 命中，物理地址 0x354，Cache 命中，取到 36H；\n· 0x00f1：TLB 未命中但页表有效，物理地址 0x0b1，Cache 未命中，需访主存；\n· 0x0229：TLB 未命中且页表项有效位为 0——【触发缺页中断】。\n计算要点：页内偏移占 log₂64 = 6 位 → 虚拟页号 14−6 = 8 位（VPN），物理页号 12−6 = 6 位（PPN）；TLB 组数 16/4 = 4 → 组索引 log₂4 = 2 位（取 VPN 低 2 位），标记为高 6 位；Cache 块内偏移 log₂4 = 2 位，组索引 log₂16 = 4 位，标记为剩余高 6 位。","keywords":["TLB","页表","Cache","缺页中断","虚拟页号","物理页号"],"source":"王道2027版 印刷页 223–225（PDF p235–237）","status":"final"},{"id":"os-ch3-3.2-028","chapter":"第3章 内存管理","section":"3.2 虚拟内存管理","topic":"虚拟内存本节小结三问（虚存空间由谁决定）","level":"l3","title":"本节小结：虚存空间由虚拟地址位数决定","answer":"1. 为什么引入虚拟内存？多道程序并发使进程共享处理器与内存；并发进程增多时每个进程分到的处理器时间平滑减少，但若同时运行的进程过多，内存需求急剧上升，某些进程得不到足够内存甚至无法加载运行。物理内存扩展受限，因此需在逻辑上扩充内存容量。\n2. 【虚拟内存空间的大小由虚拟地址的位数决定】：虚拟内存空间大小 = 2^(虚拟地址位数) × 编址单位。例：虚拟地址 32 位且按字节编址，虚存空间最大 2³²B = 4GB；若试图定义超过 4GB 的虚拟地址空间，超出部分无法被访问。\n 易错点：虚存最大容量由【地址位数】决定，与物理内存大小、外存大小无关。\n3. 虚拟内存怎么解决问题、带来什么问题？利用外存空间在逻辑上扩充内存，通过页面换入换出使系统可运行总规模远超物理内存的多个进程；但每次缺页都需访问外存，导致平均访存时间增加，采用不合适的置换算法还可能引发频繁缺页、降低性能。","keywords":["虚拟内存空间","虚拟地址位数","4GB","逻辑扩充","缺页开销"],"source":"王道2027版 印刷页 225–226（PDF p237–238）","status":"final"},{"id":"os-ch3-3.3-001","chapter":"第3章 内存管理","section":"3.3 本章疑难点","topic":"分页与分段对比表（补充：碎片与地址空间）","level":"l2","title":"疑难点：分页 vs 分段对比表","answer":"表3.6 给出分页与分段的全维度对比，四行必背（先记后两行，前两行已在 3.1 节）：\n1. 目的：分页仅是系统管理上的需要，为实现离散分配方式、提高内存利用率，不是用户的需要；段是信息的逻辑单位，含有一组意义相对完整的信息，分段的目的是更好地满足用户的需要。\n2. 长度：页的大小固定且由系统决定，由系统把逻辑地址划分为页号和页内地址两部分，由机器硬件实现；段的长度不固定，决定于用户所编写的程序，通常由编译程序在编译时根据信息的性质来划分。\n3. 地址空间：分页的程序地址空间是【一维】的（单一线性地址空间），程序员用【一个记忆符】即可表示一个地址；分段的程序地址空间是【二维】的，程序员标识一个地址时【既需给出段名，又需给出段内地址】。\n4. 碎片：分页【有内部碎片，无外部碎片】；分段【有外部碎片，无内部碎片】。\n易错点：这一行最容易记反——“页内碎片”属分页，“外部碎片”属分段。","keywords":["分页","分段","对比表","碎片","一维","二维"],"source":"王道2027版 印刷页 250（PDF p262）","status":"final"},{"id":"os-ch3-3.3-002","chapter":"第3章 内存管理","section":"3.3 本章疑难点","topic":"疑难点：数组按行/按列遍历的局部性与缺页","level":"l2","title":"疑难点：数组遍历方式的局部性（缺页计算）","answer":"结论先行：数组中【同一行】的元素存放在同一页面中，在数组中按行优先方式存放的数组，按行遍历局部性好，按列遍历局部性差、缺页次数可相差上百倍。\n1. 判断方法：每个页面可容纳的元素个数 = 页面大小 / 元素大小，若正好等于一行的元素个数，则“一页 = 一行”。\n2. 书中例：页面 4KB、int 占 4B → 每页可放 4KB/4B = 1024 个元素 = 数组一行；故 a[0] 行在虚页号 10800H、a[1] 行在 10801H，a[1][2] 的虚拟地址 = 10801000H + 4×2 = 10801008H。\n3. 结论：按行优先存放意味着同一行元素在同一页、同一列各元素分布在不同页 → 【按行遍历】的局部性较好。\n易错点：代码若写成 a[j][i]=0 的外层 i、内层 j 循环（按列访问 C 语言的行优先数组），则每访问一个元素就换一页，缺页次数由页数级放大到元素级/行数级。","keywords":["局部性","按行优先","数组","缺页","页内元素数"],"source":"王道2027版 印刷页 249–250（3.2.12 解答，PDF p261–262）；考纲归 3.3 疑难点","status":"final"},{"id":"os-ch3-3.3-003","chapter":"第3章 内存管理","section":"3.3 本章疑难点","topic":"疑难点：页目录表/页表项的地址计算（两级页表综合题）","level":"l2","title":"疑难点：页目录项与页表项的地址计算","answer":"解题套路（两级页表 + 32 位地址，页目录号 10 位、页号 10 位、页内偏移 12 位）：\n1. 拆分虚拟地址：高 10 位 = 页目录号，中间 10 位 = 页号，低 12 位 = 页内偏移。（十六进制下低 3 位为页内偏移）\n2. 【页目录项的物理地址】= 页目录表始址（PDBR 内容）+ 页目录号 × 页目录项长度；其内容是【对应二级页表的物理页框号】。\n3. 【页表项的虚拟地址】= 该进程页表页的虚拟始址 + 页号 × 页表项长度；【页表项的物理地址】= 页表所在物理页框号 × 页大小（或页表页物理始址）+ 页号 × 页表项长度；其内容是【目标页面的物理页框号】。\n4. 书中例（二级页表项 4B、页目录始址 00201000H、页目录号 042H、页号 001H）：\n · 042H 号页目录项物理地址 = 00201000H + 4 × 42H = 00201108H；\n · 该项存放页框号 00301H → 二级页表始址 00301000H；\n · 001H 号页表项物理地址 = 00301000H + 001H × 4 = 00301004H。\n5. 页框号取法（另一题的写法）：物理地址右移 22 位（页内偏移 12 位 + 页号 10 位）即得页框号，如 BAB45678H \u003e\u003e 22 = 2EAH。\n易错点：页目录项存的是“页表页的页框号”，页表项存的才是“数据页的页框号”，两层不要混。","keywords":["页目录项地址","页表项地址","PDBR","右移22位","页框号"],"source":"王道2027版 印刷页 250（PDF p262）","status":"final"},{"id":"os-ch3-3.3-004","chapter":"第3章 内存管理","section":"3.3 本章疑难点","topic":"疑难点：PDBR 在进程切换与线程切换时的变化","level":"l3","title":"疑难点：PDBR 与进程/线程切换","answer":"PDBR = 页目录基址地址寄存器（Page-Directory Base Register），内容为当前进程【页目录表的物理内存基地址】。\n1. 进程切换：PDBR 的内容【会变化】——每个进程的地址空间、页目录和 PDBR 内容一一对应，地址空间变了，页目录及其始址也变，需要用切换后进程的页目录始址刷新 PDBR。\n2. 同一进程内的线程切换：PDBR 的内容【不变】——同一进程的各线程共享该进程的地址空间，线程切换不改变地址空间和页目录。\n3. 二级页表中页表基址寄存器（PTBR/一级页表基址寄存器）存放的是当前进程【一级页表的起始物理地址】，一级页表项中的内容是它对应的【二级页表所在的物理页框号】。\n易错点：进程切换要换页目录基址（还往往要刷新/清空 TLB），线程切换不用。","keywords":["PDBR","页目录基址","进程切换","线程切换","PTBR"],"source":"王道2027版 印刷页 249（3.2.12 解答，PDF p261）；考纲归 3.3 疑难点","status":"final"},{"id":"os-ch3-3.3-005","chapter":"第3章 内存管理","section":"3.3 本章疑难点","topic":"疑难点：缺页异常时进程状态变化与 TLB 平均转换时间","level":"l2","title":"疑难点：缺页/文件 I/O 时的进程状态与转换时间计算","answer":"1. 状态变化（考试常与进程管理合考）：进程执行 scanf() 时因等待输入由【执行态 → 阻塞态】；输入结束被中断处理程序唤醒变为【就绪态】；被调度程序调度后变为【运行态】；期间 CPU 由【用户态 → 内核态】。\n2. 地址转换平均时间（含 TLB 命中率与缺页率）要用【加权求和】，逐层累加各级延迟：\n 书例（TLB 命中率 98%，TLB 命中转换 10ns；未命中查一级、二级页表均未缺页共 210ns）：\n 平均转换时间 = 10ns × 98% + 210ns × 2% = 14ns。\n 若 TLB 未命中、一级页表命中但二级页表缺失（缺页处理需 10ms）：\n 平均 = 10ns × 98% + 210ns × 2% × 90% + (220ns + 10ms) × 2% × 10% ≈ 20014ns。\n3. 单次访问的分解（4KB 页例，快表 10ns、访页表 100ns、访主存 100ns）：\n · 2362H（P=2，快表初始为空）：10 + 100 + 100 = 210ns；\n · 25A5H（P=2，已在快表）：10 + 100 = 110ns；\n · 1565H（P=1，快表落空、页表也落空→缺页中断 10ms）：10 + 100 + 10ms + 10 + 100 ns = 100000220ns。\n易错点：缺页的代价是【毫秒级】，与访存纳秒级差 10⁶ 量级，一旦有缺页，平均值几乎完全由缺页项主导。","keywords":["缺页","进程状态","用户态内核态","TLB命中率","平均转换时间"],"source":"王道2027版 印刷页 248–249（3.2.12 解答，PDF p260–261）；考纲归 3.3 疑难点","status":"final"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"文件的概念与属性","level":"l1","title":"文件的概念与属性","answer":"【概念】文件是以计算机硬盘为载体的、存储在计算机上的信息的集合，其基本单位是数据项；文件系统是操作系统中负责存取和管理文件的软件机构。\n【属性】文件包含以下属性，查找文件时就是按这些属性在目录中匹配：\n1. 名称：字符串形式的标识符，同一目录下唯一，供用户识别；\n2. 标识符：文件的内部名称，是唯一标记（一串数字），对用户不可见；\n3. 类型：被支持不同类型的文件系统所利用，如源程序、可执行文件、文本文件等；\n4. 位置：指向设备与设备内位置的指针；\n5. 大小：当前大小（以及可允许的最大大小）；\n6. 保护：控制谁可读、写、执行；\n7. 时间、日期和用户标识：创建、最后修改、最后访问等时间戳，以及属主。\n【结论】所有文件信息都保存在目录结构中，而目录结构保存在外存上；目录项即文件控制块 FCB，只有在打开文件时才把它调入内存。","keywords":["文件","属性","名称","标识符","文件系统"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-001"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"文件控制块 FCB","level":"l1","title":"FCB 的内容与作用（为何“按名存取”）","answer":"【结论】文件控制块（FCB）是存放控制文件需要的各种信息的数据结构，用来描述和控制文件；文件与 FCB 一一对应。\n【内容】常包含三类：\n1. 基本信息：文件名、物理位置、逻辑结构、物理结构等；\n2. 存取控制信息：文件存取权限（读、写、执行等）；\n3. 使用信息：文件建立时间、上次修改时间等。\n【关键判定】一个文件目录项就是一个 FCB。目录本身就是 FCB 的有序集合，每个 FCB 就是一个目录项。\n【作用】FCB 实现了文件系统最基本的目标——按名存取：用户给出文件名，系统由文件名找到对应 FCB，再由 FCB 找到文件的物理地址。","keywords":["FCB","文件控制块","目录项","按名存取"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-002"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"文件的基本操作","level":"l2","title":"文件的基本操作及其要点","answer":"【基本操作】创建、删除、打开、关闭、读、写、重定位（定位）。\n1. 创建：为新文件分配必要的外存空间，在目录中建立目录项，记录文件名、外存地址、属主等；\n2. 删除：从目录中删除对应目录项，并回收其占用的存储空间（是否物理清除可延后）；\n3. 打开：将文件的目录项（FCB）读入内存，供后续读写使用，并把打开文件的表项返回给用户；\n4. 关闭：将内存中的文件控制信息写回外存的目录，并释放打开文件表项；\n5. 读：按“文件描述符 + 读指针位置 + 要读的字节数”把数据从外存读入内存缓冲区；\n6. 写：按“文件描述符 + 写指针位置 + 要写的字节数”把数据从内存写入外存；\n7. 重定位（定位 seek）：按“文件描述符 + 指针位置”把当前读写位置设置到指定处，不进行实际 I/O。\n【易错】文件的“打开”并不把文件内容读入内存，只把 FCB 调入内存；读/写才进行实际的数据传送。","keywords":["创建","删除","打开","关闭","读","写","重定位"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-003"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"逻辑结构·无结构文件","level":"l1","title":"逻辑结构：无结构文件（流式文件）","answer":"【结论】无结构文件是最简单的文件组织形式。\n1. 由字符流构成，又称流式文件，文件内不划分记录；\n2. 其长度以字节为单位，按顺序访问；\n3. 对文件的读写必须以整个文件为单位，或者每次读写若干字节；\n4. 适用于对基本信息单位操作不多的文件，如源程序、目标代码、可执行文件等。\n【对比】有结构的记录式文件则把文件划分为若干定长或变长的记录，可按记录号检索。","keywords":["无结构文件","流式文件","字符流","记录"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-004"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"逻辑结构·顺序文件与索引文件","level":"l2","title":"逻辑结构：顺序文件与索引文件","answer":"【顺序文件】按逻辑记录的顺序依次存放，记录长度可定长或变长。\n1. 优点：批量存取效率最高，是顺序存取设备上最合适的组织形式；\n2. 缺点：单条记录查找效率低（尤其是变长记录，必须从头遍历）；增删记录困难。\n【索引文件】为变长记录文件建立一张索引表，每个记录占一个表项，记录长度可变时用索引指向该记录。\n1. 优点：可按记录号随机存取，检索速度快；\n2. 缺点：索引表本身要占用额外的存储空间，建表也要花费时间。\n【记忆】顺序文件=批量快、单条慢；索引文件=随机可、空间大。","keywords":["顺序文件","索引文件","索引表","变长记录"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-005"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"逻辑结构·索引顺序文件","level":"l2","title":"逻辑结构：索引顺序文件（多级索引与顺序文件的折衷）","answer":"【结论】索引顺序文件是顺序文件与索引文件的结合，它把顺序文件分为若干组，为每组第一条记录建立索引项。\n【要点】\n1. 平均查找次数显著减少：设 N 条记录分成 √N 组、每组 √N 条，平均只需检索约 √N 个索引项 + 组内顺序查找；\n2. 为进一步提高检索效率，可建立多级索引以形成多级索引顺序文件；\n3. 兼顾了“索引表不大”与“检索较快”，是数据库索引思想的基础。\n【易错】索引顺序文件的索引项“不是每个记录一个”，而是每组一个——这是与索引文件的关键区别。","keywords":["索引顺序文件","分组","多级索引","折衷"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-006"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"打开与关闭·两级打开文件表","level":"l2","title":"打开与关闭：用户打开文件表 + 系统打开文件表","answer":"【结论】打开文件时，系统维护两张表：\n1. 系统打开文件表（整个系统只有一张）：每个打开的文件占一个表项，除 FCB 外还含打开计数器（打开计数）；多个进程共享同一文件时，系统表中只有一个表项，各进程的用户表项指向它；\n2. 进程打开文件表（每个进程各有一张，即用户打开文件表）：记录本进程打开了哪些文件，表项含文件描述符（索引号）、文件指针（指向系统打开文件表中的对应表项）、读写偏移量。\n【打开过程】① 按文件名逐级检索目录找到 FCB（目录检索只在此刻做一次）→ ② 在系统打开文件表中找该文件：已有则打开计数器加 1，否则把 FCB 调入内存新建表项并置计数为 1 → ③ 在进程（用户）打开文件表中分配一个空表项，填入文件指针（指向系统表中对应表项）并登记读写位置 → ④ 返回文件描述符 fd（即该进程打开文件表中表项的索引号）。\n【关闭过程】删除进程打开文件表中的相应表项，系统表中计数减 1，减为 0 时才将 FCB 写回外存并删除系统表项。\n【易错】① fd 只是“本进程打开文件表”中的索引号，只是局部唯一的，不是系统全局编号；不同进程打开同一文件，fd 可以不同（也可以相同但指向不同的表项）；② 每打开一次就产生一个独立的进程表项，故同一进程两次打开同一文件也会得到两个 fd。","keywords":["系统打开文件表","用户打开文件表","打开计数","文件描述符","打开与关闭"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-007"},{"chapter":"第4章 文件管理","section":"4.1 文件系统基础","topic":"打开文件时的目录检索","level":"l2","title":"读/写一个已打开文件时是否还要查目录","answer":"【结论】文件已打开后，读/写时不再检索目录，直接用内存中的打开文件表完成。\n【过程】用户给出索引号（fd）→ 在自身打开文件表中找到表项 → 由指针找到系统打开文件表中的 FCB → 由 FCB 中的物理地址信息 + 逻辑块号直接换算物理块号 → 进行磁盘 I/O。\n【为什么】文件名到 FCB 的映射（目录检索）是慢速的外存操作，把结果缓存进内存打开文件表后就可重复利用，这正是“打开”操作的意义所在。\n【对比】若文件未打开直接按名读写，则每次都要按路径从根目录逐级检索目录。","keywords":["打开文件表","索引号","目录检索","物理地址"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.1-008"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"目录的基本概念","level":"l1","title":"目录的作用与“按名存取”的两个阶段","answer":"【作用】目录用于实现按名存取，其本身也是一种文件（目录文件），由若干目录项组成，每个目录项记录文件名、文件属性和文件的物理位置等信息。\n【两个阶段】\n1. 查找：用户给出文件名，系统在目录中按名检索，找到该文件的目录项（FCB）；\n2. 定位：从该目录项中获得文件的逻辑块号到物理块号的映射信息，进而存取文件内容。\n【目录也是文件】所以目录也要占用存储空间，也按文件的方式存取，只是其内容由用户指定格式、由系统解释。","keywords":["目录","目录文件","按名存取","目录项"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-001"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"目录结构·单级与两级","level":"l1","title":"目录结构：单级目录与两级目录","answer":"【单级目录】整个系统只有一张目录表，所有文件都登记在其中。\n1. 优点：实现简单，可实现按名存取；\n2. 缺点：不允许文件重名（多个用户不能有同名文件）；文件名个数受限；查找速度慢（目录表很大时每次都要从头检索）。\n【两级目录】分为主目录（根目录）和用户目录（UFD），每个用户有自己的目录。\n1. 优点：不同用户可用相同文件名（文件名只在用户目录内唯一）；提高了检索速度（先找用户、再找文件）；实现了访问控制（一个用户不能访问其他用户目录）；\n2. 缺点：缺乏灵活性，用户不能对自己的文件进行分类管理，且不能实现文件共享。","keywords":["单级目录","两级目录","主目录","用户目录","重名"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-002"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"目录结构·树形与无环图","level":"l1","title":"目录结构：树形目录与无环图目录","answer":"【树形目录】目录呈树状，有根目录，可分层（多级）组织文件。\n1. 优点：层次结构清晰，便于分类管理；不同目录下文件可以重名；可对目录设置不同权限；\n2. 缺点：不便于实现文件共享（一个文件只能有一个父目录）。\n3. 采用绝对路径（从根开始）和相对路径（从当前目录开始）两种名称，可用当前工作目录减少检索量。\n【无环图目录】在树形基础上允许不同目录项指向同一文件或子目录（用硬链接/软链接实现共享），但必须保证图中无环路。\n1. 优点：可实现文件共享（一个文件可由多个目录指向）；\n2. 缺点：需为共享文件设置共享计数器，删除时计数器减 1，减为 0 才真正删除；系统管理更复杂。","keywords":["树形目录","无环图目录","绝对路径","相对路径","共享计数器"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-003"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"目录实现·线性表与哈希表","level":"l2","title":"目录的实现方式：线性表、哈希表","answer":"【线性表法】把文件名与物理地址等信息组织成线性表存于目录文件中，目录项顺序存放。\n1. 查找：采用顺序查找，逐个比较文件名；\n2. 优点：实现简单；缺点：目录项多时查找效率低（平均要查找一半目录项）。\n【哈希表法】用文件名经过哈希函数散列得到表项下标，目录项存放在按哈希值组织的表中。\n1. 查找：一次哈希计算直接定位，理想情况下不需比较；\n2. 优点：查找速度快，插入删除方便；\n3. 缺点：需处理冲突（不同文件名散列到同一位置）；表的大小固定，扩容代价大。","keywords":["线性表","哈希表","目录实现","哈希冲突"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-004"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"目录项·FCB 太大时的分解","level":"l2","title":"目录检索时如何“读得少”：目录项只放文件名 + 索引结点的地址","answer":"【问题】每个 FCB 较大（含物理地址、属性等），而查目录时只需要文件名做比较。若目录项就是完整 FCB，则每比较一个名字就要读入整个 FCB，磁盘 I/O 开销大。\n【解法】把目录项一分为二：\n1. 目录项中只放【文件名】+【该文件 FCB（索引结点）的磁盘地址/编号】，目录项变得很小，一次 I/O 就能读入大批目录项进行比较；\n2. 真正的属性与物理地址放在索引结点（inode）里，只有名字匹配后才读入相应索引结点。\n【结论】这一做法把一个文件名→物理地址的两级查找拆开，使得“找文件”与“取文件属性”各做一次索引，从而降低检索目录时的磁盘 I/O 次数。","keywords":["目录项","索引结点","inode","磁盘I/O","目录检索"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-005"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"文件的物理结构·概论","level":"l1","title":"文件物理结构（分配方式）的分类与关注点","answer":"【概念】文件物理结构指文件在外存上的存储组织形式，即逻辑块如何映射到物理块。\n【三类】\n1. 连续分配：为每个文件分配一段连续的物理块；\n2. 链接分配：为文件分配离散的物理块，用指针把块链接成链，分隐式链接与显式链接（FAT）；\n3. 索引分配：为文件建立索引块，每个表项指向一个物理块，分单级索引、多级索引与混合索引。\n【评判指标】① 是否支持随机访问；② 有无内部碎片与外部碎片；③ 是否便于文件增长；④ 检索所需的额外 I/O（索引块是否已在内存）。","keywords":["物理结构","连续分配","链接分配","索引分配","随机访问"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-006"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"连续分配","level":"l1","title":"连续分配：原理与优缺点","answer":"【原理】为每个文件分配一组相邻的物理块，文件在外存中占连续的块区；目录项中记录起始块号与文件长度（块数）。\n【优点】\n1. 支持顺序访问与随机访问（访问第 k 逻辑块只需一次运算，无需额外 I/O）；\n2. 顺序访问时磁头移动少，访问时间短（连续磁道，磁盘寻道距离最小）；\n3. 实现简单，目录项小。\n【缺点】\n1. 文件长度难以动态增长（要求找到连续的可用空间）；\n2. 存在外部碎片：需用紧凑（compact）技术合并空闲区，代价很高；\n3. 存储空间利用率不高（为阻止增长而预留空间）。","keywords":["连续分配","随机访问","外部碎片","紧凑","起始块号"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-007"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"连续分配的地址计算","level":"l2","title":"连续分配：逻辑块号→物理块号换算（含步骤）","answer":"【设定】由目录项/FCB 得到起始物理块号 start 与文件长度 n（块数）；盘块大小为 B 字节。\n【步骤】设要访问文件偏移量为 off（字节，从 0 计）的内容：\n1. 求逻辑块号：i = ⌊off / B⌋（单位：块，从 0 开始编号）；\n2. 判断合法性：若 i ≥ n，则越界，访问失败；\n3. 求物理块号：b = start + i（单位：块）；\n4. 求块内偏移：d = off mod B（单位：字节）；\n5. 物理地址 = b × B + d（单位：字节，即磁盘一维字节地址）。\n【结论】任何一块都只需一次加法和一次取模，不需要额外读盘，这正是连续分配能随机访问的根本原因。\n【例】B=1KB，start=20，读偏移 3000 字节：i=⌊3000/1024⌋=2，b=22，d=3000−2048=952，物理地址=22×1024+952。","keywords":["连续分配","逻辑块号","物理块号","块内偏移","地址计算"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-008"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"隐式链接分配","level":"l1","title":"链接分配（隐式）：原理与优缺点","answer":"【原理】除文件最后一个物理块外，每个物理块中都设置指向下一块的指针；目录项中只记录起始块号和结束块号。文件块可以离散地分布在磁盘上。\n【优点】\n1. 无外部碎片，大大提高磁盘空间利用率；\n2. 文件可动态增长（随时申请新块并挂到链尾），不必预留连续空间。\n【缺点】\n1. 只支持顺序访问，不支持随机访问（要访问第 i 块必须先走完前 i−1 块）；\n2. 指针占用存储空间（每个盘块的指针部分）；\n3. 可靠性差：一条链上的指针损坏会导致后续内容全部丢失；且修复时需用后备文件恢复。","keywords":["链接分配","隐式链接","指针","顺序访问","无外部碎片"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-009"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"显式链接与 FAT","level":"l2","title":"显式链接分配与文件分配表 FAT（含随机访问代价）","answer":"【原理】把用于链接各物理块的指针显式地存放在内存中的一张表中，这张表称为文件分配表（FAT）。\n1. FAT 的每个表项存放一个盘块号，内容为“该盘块的下一块号”，表项个数 = 磁盘盘块总数；\n2. 每个表项还需 1 位标志“是否为空闲/可用”，故常按 盘块数 × (指针位数 + 1) 估算 FAT 大小；\n3. 一个盘块只能属于一个文件，不同文件的链在同一张 FAT 中互不相交；\n4. 目录项中只需记录文件的起始块号，无需记录结束块号。\n【优点】\n1. 支持随机访问—— FAT 常驻内存，顺着链在内存中走即可得到第 i 块的物理块号，不需要读盘；\n2. 无外部碎片，便于文件动态增长。\n【缺点】FAT 要占用大量内存空间（大磁盘时尤甚）。\n【易错】① FAT 链上走第几块是“内存操作”，但真正读取该块数据仍要一次磁盘访问；所谓随机访问指不需依次读盘，而不是指零 I/O。\n② 易混：FAT（文件分配表）管理的是“已分配盘块的链接关系”，属于文件分配方式；成组链接法、位示图管理的是“哪些盘块还空闲”，属于存储空间管理——两者名字都带“表”，但用途不同。\n③ 易混：索引分配与 FAT 都能随机访问，区别在于 FAT 把所有文件的链接集中在一张全局表里，索引分配则是每个文件各自有一块索引表。","keywords":["显式链接","FAT","文件分配表","随机访问","起始块号"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-010"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"索引分配","level":"l1","title":"索引分配：原理与优缺点","answer":"【原理】为每个文件分配一个索引块（表），把分配给该文件的所有盘块号都记录在该索引块中；索引块的第 i 个表项即文件的第 i 个逻辑块的物理块号。文件只需一个索引块号记在目录项中。\n【优点】\n1. 支持随机访问（查索引块第 i 项即可，不需顺序走链）；\n2. 不会产生外部碎片；\n3. 文件易于动态增长（新增块只需在索引块中增一项，空间不足时可再申请索引块）。\n【缺点】\n1. 索引块占用了额外的存储空间；\n2. 索引表大小受限制：一个小文件也要占用一整个索引块（内部碎片/空间浪费）；大文件则需要多个索引块，需进一步分级（链接、多级索引或混合索引）。","keywords":["索引分配","索引块","随机访问","动态增长","外部碎片"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-011"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"索引分配的三种扩展","level":"l1","title":"索引分配对大文件的三种处理：链接、多级、混合索引","answer":"【问题】索引块只能容纳有限个表项（如 1 个盘块 = 4KB、每个表项 4B，则最多 1024 项，即文件最多 1024 块）。文件更大时需要扩充：\n1. 链接方案：把一个文件的多个索引块用指针链接起来（第一个索引块的指针指向第二个索引块），大文件要多次读索引块，仍可按索引查找但效率降低；\n2. 多级索引：为索引块再建索引——第一级索引块指向二级索引块，二级索引块指向数据块，逻辑块号被按级拆分；支持极大文件，但读一次数据要多次访问索引块（若不在内存）；\n3. 混合索引：把多种索引方式结合，索引结点中既放直接地址项又放各级间接地址项，兼顾小文件的快速访问与大文件的容量。","keywords":["链接方案","多级索引","混合索引","索引块","大文件"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-012"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"多级索引的容量计算","level":"l2","title":"多级索引：一级/二级能覆盖的逻辑块数与地址耗时","answer":"【设定】盘块大小为 4KB，每个盘块号占 4B，则一个索引块可放 4KB ÷ 4B = 1024 个表项（2^10）。\n【单级索引】可覆盖 1024 个逻辑块（逻辑块号 0~1023），文件最大 1024 × 4KB = 4MB。\n【二级索引】第一级索引块有 1024 项，每项指向一个二级索引块，每个二级索引块又有 1024 项，可覆盖 1024 × 1024 = 2^20 个逻辑块，文件最大 2^20 × 4KB = 4GB。\n【二级索引定位步骤】设逻辑块号为 i（0 起）：\n1. k1 = ⌊i / 1024⌋，为一级索引块内的表项序号；\n2. k2 = i mod 1024，为二级索引块内的表项序号；\n3. 先取一级索引块第 k1 项 → 得二级索引块号，再取二级索引块第 k2 项 → 得数据块号。\n【代价】最坏需读 3 次磁盘：一级索引块、二级索引块、数据块（索引块若已缓存则相应减少）。\n【一般式】n 级索引可覆盖 (每块表项数)^n 个逻辑块。","keywords":["多级索引","索引块","逻辑块号","容量计算","2^20"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-013"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"混合索引的计算","level":"l2","title":"混合索引（UNIX 风格）：最大文件长度与逻辑块号映射（完整步骤）","answer":"【设定】索引结点含 10 个直接地址项、1 个一级间接、1 个二级间接、1 个三级间接；盘块 4KB，每个盘块号 4B ⇒ 每块表项数 K = 4KB / 4B = 1024 = 2^10。\n【一类地址可覆盖的块数】\n1. 直接地址：10 块（逻辑块 0 ~ 9）；\n2. 一级间接：K = 2^10 块（逻辑块 10 ~ 10 + 1023）；\n3. 二级间接：K² = 2^20 块；\n4. 三级间接：K³ = 2^30 块。\n【最大文件长度】总块数 = 10 + 2^10 + 2^20 + 2^30 (块)，乘盘块大小 4KB：\n  ≈ (2^30 + 2^20 + 2^10 + 10) × 4KB ≈ 4TB + 4GB + 4MB + 40KB。\n【逻辑块号 i → 物理块号 的判定步骤】\n1. 若 i \u003c 10：直接取索引结点第 i 个直接地址项，读 1 次盘；\n2. 若 10 ≤ i \u003c 10 + K：令 j = i − 10；读一级间接块，取其第 j 项，至少读 2 次盘；\n3. 若落到二级间接区：令 j = i − (10 + K)；先取一级间接块第 ⌊j/K⌋ 项得二级索引块号，再取该块第 j mod K 项，至少读 3 次盘；\n4. 若落到三级间接区：依次按 j / K²、j mod K² / K、j mod K 分解三级，至少读 4 次盘。\n【易错】题目若给出“一个地址项占 4B、盘块 1KB”，则 K = 1KB/4B = 256，需按题给数据重算，切勿死记 1024。","keywords":["混合索引","索引结点","直接地址","间接地址","最大文件长度","逻辑块号"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-014"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"三种物理结构对比","level":"l2","title":"连续 vs 链接 vs 索引：可随机访问性与空间碎片对比（速判表）","answer":"【结论表】\n1. 连续分配：随机访问 ✔（不需额外 I/O）；外部碎片 有（需紧凑）；文件增长 困难；目录项 起始块号+长度。\n2. 隐式链接：随机访问 ✘（必须逐块走）；外部碎片 无；文件增长 容易；目录项 起始块号+结束块号。\n3. 显式链接（FAT）：随机访问 ✔（链在内存 FAT 中走，不额外读盘）；外部碎片 无；文件增长 容易；代价是 FAT 占大量内存。\n4. 索引分配：随机访问 ✔（索引块第 i 项）；外部碎片 无；文件增长 容易；代价是索引块占空间、小文件浪费。\n【判定口诀】能随机访问 ⇔ 不用“顺着链读盘”就能算出第 i 块的块号；外部碎片 ⇔ 是否要求连续空间（只有连续分配要求）。","keywords":["物理结构对比","随机访问","外部碎片","FAT","索引分配"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-015"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"文件共享·硬链接与软链接","level":"l2","title":"文件共享：硬链接与软链接的区别","answer":"【硬链接（基于索引结点的共享）】多个目录项中的“索引结点指针”指向同一个索引结点。\n1. 索引结点中设置链接计数 count，创建硬链接时 count++，删除时 count−−，减为 0 才真正删除文件；\n2. 本质是共享同一份文件内容与属性，因此不能跨文件系统建立，也不能对目录建硬链接（防止出现环）；\n3. 删除原文件名后，文件内容仍可通过另一链接访问。\n【软链接（符号链接）】创建一个新文件（链接文件，类型为 LINK），其内容是原文件的路径名。\n1. 访问链接文件时系统按路径逐级解析，再访问目标文件；\n2. 可以跨文件系统，可以为目录建立；\n3. 原文件删除后，软链接仍然存在但已失效（悬空链接/死链接）；\n4. 访问软链接需额外读一次链接文件，开销更大。\n【速记】硬链接=多名字共享同一 inode；软链接=一个只存路径的小文件。","keywords":["硬链接","软链接","符号链接","链接计数","跨文件系统"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-016"},{"chapter":"第4章 文件管理","section":"4.2 目录与文件","topic":"文件保护","level":"l2","title":"文件保护：口令、加密、访问控制列表 ACL","answer":"【目标】防止文件被非法用户窃取、破坏或访问。\n1. 口令保护：为文件设置口令，用户访问前必须提供正确口令（系统只存口令的散列值）；缺点：口令存放在系统内部，不够安全且维护不便；\n2. 加密保护：用密码对文件加密，只有持有密钥者才能解密，保密性强、开销小，但密钥管理麻烦；\n3. 访问控制：在文件属性中增加访问控制表（ACL），按“用户/用户组 + 允许的操作（读写执行删等）”逐项限定。\n   - 常见简化形式：以用户为单位划分为 属主（owner）、组（group）、其他（other）三类并各给权限位；\n   - 还需要一组通用操作：读、写、执行、添加、删除、列表清单。\n【对比】口令/加密保护的是“内容机密”，访问控制保护的是“操作权限”。","keywords":["文件保护","口令","加密","访问控制表","ACL","权限位"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.2-017"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"文件系统的分层结构","level":"l1","title":"文件系统的分层结构（自下而上）","answer":"【结论】文件系统可分为若干层，自下而上为：\n1. I/O 控制层：由设备驱动程序和中断处理程序组成，负责与硬件交互，完成内存与磁盘之间的数据传送；\n2. 基本文件系统层：向设备驱动发送通用命令，向 I/O 控制层读写物理块（只处理盘块，不关心内容）；\n3. 文件组织模块层：负责文件的逻辑块与物理块的映射（把逻辑地址翻译成物理块号），管理空闲空间；\n4. 逻辑文件系统层：管理元数据（FCB、目录结构），处理按名存取、目录操作与文件保护（权限检查），向用户提供文件操作接口。\n【记忆】逻辑文件系统管“名字与权限”，文件组织模块管“逻辑块→物理块”，基本文件系统管“物理块读写”，I/O 控制层管“硬件驱动”。","keywords":["文件系统层次","逻辑文件系统","文件组织模块","基本文件系统","I/O控制"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-001"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"文件系统在磁盘上的布局","level":"l1","title":"文件系统的磁盘布局：引导块 / 超级块 / 索引结点区 / 数据区","answer":"【结论】磁盘分区（卷）上，文件系统的典型布局按序为：\n1. 引导控制块（引导块）：包含从该分区引导操作系统所需的信息；若该分区没有操作系统，则该块为空；\n2. 分区控制块（超级块/卷控制块）：包含分区的详细信息，如分区大小、空闲块数量与指针、空闲 FCB 的数量与指针等；\n3. 目录结构：存放目录文件，组织成树形或其他结构；\n4. FCB（索引结点）区：存放各文件的文件控制块/索引结点；\n5. 数据区：存放文件的实际数据块与目录数据块。\n【易错】引导块位于分区的第一个块，不属于文件系统本身的数据结构；超级块在文件系统挂载时才读入内存。","keywords":["引导块","超级块","分区控制块","磁盘布局","挂载"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-002"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"文件存储空间管理·空闲表与空闲链表","level":"l1","title":"空闲表法与空闲链表法","answer":"【空闲表法】为外存的所有空闲区建立一张空闲表，每个空闲区对应一个表项：序号、第一个空闲盘块号、空闲盘块数。\n1. 分配：采用首次适应/最佳适应等算法，从空闲表中找满足长度的空闲区，把连续的空闲块分配给文件；\n2. 回收：把释放的盘块按块号插入空闲表，并合并相邻的空闲区。\n3. 特点：适合连续分配方式。\n【空闲链表法】把所有空闲盘块按链接方式组织成链表，分两种：\n1. 空闲盘块链：以盘块为单位拉成链，每个空闲块中存指向下一空闲块的指针；分配/回收时逐个摘取或挂入，工作量大；\n2. 空闲盘区链：以“盘区（连续空闲块）”为单位拉成链，每个盘区含“盘块数 + 指向下一盘区的指针”；分配时可用首次适应，回收时需合并相邻盘区。","keywords":["空闲表","空闲链表","空闲盘块链","空闲盘区链","首次适应"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-003"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"位示图法（原理）","level":"l2","title":"位示图法：原理与分配回收规则","answer":"【原理】用一位（bit）表示一个盘块的使用状态：0 表示空闲，1 表示已分配（题设另有规定时以题为准）。所有位按顺序构成位示图，位示图通常存放在磁盘上，使用时调入内存。\n【分配过程】\n1. 顺序扫描位示图，找出一个或一组值为 0 的二进制位；\n2. 将找到的位按“行号、列号”换算成盘块号；\n3. 把相应位置 1，并修改空闲盘块总数。\n【回收过程】\n1. 将回收的盘块号换算成位示图的行号、列号；\n2. 把对应位清 0，并修改空闲盘块总数。\n【优点】盘块与位一一对应，实现简单、便于查找连续的空闲块；位示图占用空间很小（每块 1 bit）。\n【适用】常与连续分配、索引分配等多种分配方式配合使用。","keywords":["位示图","0空闲1占用","分配","回收","盘块号"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-004"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"位示图换算（计算）","level":"l2","title":"位示图：盘块号 ⇄ 字号/位号/行号/列号 的完整换算步骤","answer":"【设定】位示图的每个“字”含 n 个二进制位（即一行 n 位），字（行）与位（列）均从 0 开始编号；盘块号也从 0 开始编号，按“行优先”顺序编号（先第 0 行的 0~n−1 位，再第 1 行 …）。\n【盘块号 → 字号、位号】（设盘块号为 b）\n1. 字号 i = ⌊b / n⌋（整数除法）；2. 位号 j = b mod n。\n【盘块号 → 行号、列号】（若题设行、列从 1 开始编号）\n1. 行号 = i + 1 = ⌊b / n⌋ + 1；2. 列号 = j + 1 = (b mod n) + 1。\n【字号、位号 → 盘块号】b = i × n + j。\n【行号、列号 → 盘块号】（行号 i'、列号 j' 从 1 起）b = (i' − 1) × n + (j' − 1)。\n【例】字长 n = 16 位，共 256 个字（可表示 4096 个盘块）：\n  (1) 盘块号 b = 100 → 字号 = ⌊100/16⌋ = 6，位号 = 100 − 96 = 4；行号 = 7，列号 = 5。\n  (2) 行号 5、列号 3 → 字号 4、位号 2 → b = 4 × 16 + 2 = 66。\n【易错】① 先看清“字长 n”和“行列是否从 1 起”；② 单位不同：字号、位号是位示图的定位，盘块号是磁盘定位，两者靠 b = i×n + j 换算；③ 位示图占用空间 = 盘块数 ÷ 8 字节（或 ÷n 个字）。","keywords":["位示图","字号","位号","行号","列号","盘块号","换算"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-005"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"成组链接法","level":"l2","title":"成组链接法：结构与分配/回收过程","answer":"【结论】成组链接法是 UNIX 系统中采用的空闲空间管理方法，它是空闲表与空闲链表的结合，适用于大型文件系统（因为空闲块太多，空闲表太大，空闲链表又太长）。\n【结构】\n1. 将空闲盘块分成若干组，如每组 100 个盘块；\n2. 每组的第一块存放组内其余空闲块的块号（以及指向下一组的指针），构成一个“组”；\n3. 各组的链接从后向前指向前一组，超级块中保存当前可分配组的块号与组内空闲块数。\n【分配】从当前组中取一个空闲块 → 组内空闲块数减 1。当取到【组内最后一块】时，该块本身存放着指向下一组的指针与块号，先按它把下一组的块号信息读入超级块，再把它分配出去，于是超级块就切换到了新的当前组。\n【回收】把释放的盘块号直接登入超级块所代表的当前组（只是内存操作），并令组内空闲块数加 1。若当前组【已满】（如已达 100 块），则先把超级块中的整组信息写入这块新释放的空闲块，再把该新块的块号放入超级块，使它与已有组链接，成为新的当前组的首块。\n【要点】只有超级块中的那组（当前组的第一块/组目录）常驻内存，其余组按需调入，因此既省内存又便于查找。\n【易错】回收时“先写满组、后作新首块”的顺序不能颠倒：满组的信息要写进新块，新块才能充当下一组的“组长”；若先当首块再写，会把组长自己的块号覆盖掉。","keywords":["成组链接法","超级块","空闲块分组","分配","回收"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-006"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"虚拟文件系统 VFS","level":"l3","title":"虚拟文件系统 VFS（考纲外补充）","answer":"【结论】VFS（Virtual File System）是内核中的一层文件系统抽象层，为用户提供统一、一致的文件访问接口，屏蔽不同具体文件系统的实现差异。\n1. 用户系统调用（open/read/write/close）并不直接调用具体文件系统，而是先经过 VFS；\n2. VFS 规定了所有文件系统都必须实现的一组接口（如 vnode/inode 结构与操作函数表），不同文件系统（ext4、FAT、NFS 等）各自实现这组接口，因此可以同时挂载并统一访问；\n3. 作用：使同一份用户程序可以不加修改地访问本地磁盘、U 盘、网络文件等多种文件系统。\n【定位】属于“抽象层/接口统一”思想在文件系统中的体现。","keywords":["VFS","虚拟文件系统","统一接口","挂载","考纲外补充"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"boundary_note":"考纲外补充","id":"os-ch4-4.3-007"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"文件系统挂载","level":"l3","title":"文件系统的挂载 mount（考纲外补充）","answer":"【结论】挂载是把一个文件系统接入到当前目录树中的过程，挂载点是一个已存在的目录。\n1. 挂载时，系统读取该分区的超级块，把文件系统的元数据装入内存，并在内存的挂载表中登记；\n2. 之后访问挂载点目录，实际访问的就是被挂载文件系统的根目录；\n3. 卸载（umount）前要保证没有进程正在使用该文件系统中的文件；\n4. 根文件系统在系统启动时自动挂载。\n【定位】与“目录树”和“超级块”两个考点直接相关，属于常见的选择题背景知识。","keywords":["挂载","mount","挂载点","超级块","卸载"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"boundary_note":"考纲外补充","id":"os-ch4-4.3-008"},{"chapter":"第4章 文件管理","section":"4.3 文件系统","topic":"文件保护与共享的实现基础","level":"l2","title":"文件被打开后：由进程表、系统表、FCB 三张结构协同","answer":"【结论】一个文件被多个进程同时打开时，系统用三类数据结构协同管理：\n1. 目录项/FCB（外存）：记录文件名、属性、物理地址，是唯一的“真身”；\n2. 系统打开文件表项（内存，全局唯一）：包含 FCB 的副本、打开计数、文件读写偏移量、访问模式；\n3. 进程打开文件表项（内存，每进程一份）：记录 fd → 系统表项的指针，以及本进程的读写位置。\n【共享判定】两个进程打开同一文件：系统表中只有 1 个表项、计数 = 2，进程表中各有 1 个表项指向它；若其中一个关闭，计数减为 1，文件仍处于打开状态。\n【易错】读写偏移量属于“每次打开”的信息，因此放在进程表项（或系统表项各自维护）中，不同进程的读位置互不影响。","keywords":["打开文件表","打开计数","读写偏移","共享","文件描述符"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.3-009"},{"chapter":"第4章 文件管理","section":"4.4 本章疑难点","topic":"分块与混合索引","level":"l2","title":"疑难点：逻辑块号 → 物理块号 的总流程（一次完整寻址）","answer":"【总流程】用户请求读文件偏移 off，假定盘块大小 B、索引结点中有直接/间接地址项：\n1. 逻辑块号 i = ⌊off / B⌋，块内偏移 d = off mod B；\n2. 由目录（或其缓存）找到该文件的索引结点（FCB）；\n3. 按 i 落在直接区/一级/二级/三级间接区，选择不同的索引路径，得到物理块号 b（成本：直接 0 次额外读、一级 1 次、二级 2 次、三级 3 次）；\n4. 按 b 读出整个盘块（1 次磁盘访问），再从中取 [d, d+需要长度) 的数据；\n5. 若一次读取跨越多个盘块，则对 i、i+1、… 重复步骤 3~4。\n【易错】“访问第 i 块要几次访盘”要把 索引块读取 + 数据块读取 全部算上；若题设说明索引块已调入内存，则只计数据块。","keywords":["逻辑块号","物理块号","混合索引","访盘次数","块内偏移"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.4-001"},{"chapter":"第4章 文件管理","section":"4.4 本章疑难点","topic":"物理结构选择","level":"l2","title":"疑难点：什么样的文件系统该用哪种分配方式","answer":"【选择依据】\n1. 需要频繁随机访问、且文件大小基本固定（如系统文件、数据库日志定长段）→ 连续分配，磁头移动最小；\n2. 文件大小变化大、需要顺序读写（如日志、顺序处理的批处理文件）→ 隐式链接，实现简单；\n3. 需要随机访问又要动态增长 + 小磁盘（如 FAT32）→ 显式链接（FAT 常驻内存）；\n4. 通用大容量文件系统（如 UNIX/Linux ext 系列）→ 混合索引，兼顾小文件快速访问与大文件容量。\n【易错】“是否支持随机访问”不是绝对的两种极端——显式链接靠内存 FAT 也能快速定位任意块，但它仍受 FAT 占用内存的限制；判定要结合题设的具体条件。","keywords":["分配方式选择","物理结构","随机访问","动态增长","混合索引"],"source":"408 考纲通用考点（OCR 缺页，页码待核）","status":"final","pending_source":true,"id":"os-ch4-4.4-002"},{"chapter":"第4章 文件管理","section":"4.4 本章疑难点","topic":"文件与目录的检索","level":"l2","title":"疑难点：路径解析时每读一级目录的 I/O 次数","answer":"【结论】按绝对路径 /a/b/c.txt 访问一个未打开的文件，系统中每级目录都要读盘定位。\n1
