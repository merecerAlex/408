class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e文件动态增长\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e✅ 容易\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e目录项内容\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e索引块号\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tr-row\"\u003e\u003cdiv class=\"tr-k\"\u003e主要代价\u003c/div\u003e\u003cdiv class=\"tr-v\"\u003e索引块占空间、小文件浪费\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e两条判定口诀\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e能随机访问 ⇔ 不用「顺着链读盘」就能算出第 i 块的块号。\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e有外部碎片 ⇔ 要求连续空间 ⇔ 只有连续分配。\u003c/strong\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e选择依据（简答题用）\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e频繁随机访问 + 大小基本固定（系统文件）→ \u003cstrong\u003e连续分配\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e大小变化大 + 顺序读写（日志）→ \u003cstrong\u003e隐式链接\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e要随机访问 + 要动态增长 + 小磁盘（FAT32）→ \u003cstrong\u003e显式链接\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e通用大容量（Linux ext 系列）→ \u003cstrong\u003e混合索引\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 成组链接法（唯一需要背流程的）","html":"\u003cp\u003e\u003cstrong\u003e为什么有它\u003c/strong\u003e：空闲块太多 → 空闲表太大；空闲链表又太长。所以「分组 + 链接」。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e结构\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e空闲块分若干组（如每组 100 块）\u003c/li\u003e\u003cli\u003e每组\u003cstrong\u003e第一块\u003c/strong\u003e存放组内其余空闲块的块号 + 指向下一组的指针\u003c/li\u003e\u003cli\u003e各组从后向前链\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e超级块\u003c/strong\u003e保存「当前可分配组的块号 + 组内空闲块数」\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e分配（重点：取走组内最后一块）\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e从当前组取一个空闲块 → 组内空闲块数 −1\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e当取到组内最后一块时\u003c/strong\u003e：该块本身存着指向下一组的信息 → \u003cstrong\u003e先把下一组的块号信息读入超级块\u003c/strong\u003e → \u003cstrong\u003e再把这块分配出去\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e于是超级块切换到新的当前组\u003c/li\u003e\u003c/ol\u003e\u003cblockquote\u003e⚠️ 顺序不能反：漏了「先读下一组」这一步，链就断了。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e回收（重点：满组时的顺序）\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e把释放的盘块号直接登入超级块代表的当前组（\u003cstrong\u003e只是内存操作，不写盘\u003c/strong\u003e）→ 组内计数 +1\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e若当前组已满\u003c/strong\u003e（如已 100 块）：\u003cstrong\u003e先把超级块中的整组信息写入这块新释放的块\u003c/strong\u003e → \u003cstrong\u003e再把这个新块的块号放入超级块\u003c/strong\u003e，使它成为新的当前组首块\u003c/li\u003e\u003c/ol\u003e\u003cblockquote\u003e⚠️ 顺序不能反：满组信息必须\u003cstrong\u003e先\u003c/strong\u003e写进新块，新块\u003cstrong\u003e才能\u003c/strong\u003e充当下一组的「组长」。若先当首块再写，会把组长自己的块号覆盖掉。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e核心优点\u003c/strong\u003e：只有超级块那一组常驻内存，其余按需调入 → 省内存 + 便于查找。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 概念辨析（选择题陷阱清单）","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 打开文件表三张结构\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e结构\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003cth\u003e数量\u003c/th\u003e\u003cth\u003e存什么\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"结构\"\u003e\u003cstrong\u003e目录项 / FCB\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"位置\"\u003e外存\u003c/td\u003e\u003ctd data-label=\"数量\"\u003e每文件一个\u003c/td\u003e\u003ctd data-label=\"存什么\"\u003e文件名、属性、物理地址（\u003cstrong\u003e真身\u003c/strong\u003e）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"结构\"\u003e\u003cstrong\u003e系统打开文件表\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"位置\"\u003e内存\u003c/td\u003e\u003ctd data-label=\"数量\"\u003e\u003cstrong\u003e全系统一张\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"存什么\"\u003eFCB 副本、\u003cstrong\u003e打开计数器\u003c/strong\u003e、访问模式\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"结构\"\u003e\u003cstrong\u003e进程打开文件表\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"位置\"\u003e内存\u003c/td\u003e\u003ctd data-label=\"数量\"\u003e\u003cstrong\u003e每进程一张\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"存什么\"\u003efd → 系统表项指针、本进程读写位置\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e打开流程（口诀：先找文件、再登记、最后发号）\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e按文件名逐级检索目录找到 FCB（\u003cstrong\u003e目录检索只在此刻做一次\u003c/strong\u003e）\u003c/li\u003e\u003cli\u003e查系统表：已有 → 计数 +1；没有 → 调入 FCB 新建表项，计数 = 1\u003c/li\u003e\u003cli\u003e在进程表分配空表项，填指针 + 读写位置\u003c/li\u003e\u003cli\u003e返回 \u003cstrong\u003efd\u003c/strong\u003e（= 进程表表项的索引号）\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e关闭流程\u003c/strong\u003e：删进程表项 → 系统表计数 −1 → \u003cstrong\u003e减为 0 才\u003c/strong\u003e写回 FCB 并删系统表项\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e四个高频错点\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003efd 是局部唯一的\u003c/strong\u003e，不是系统全局编号。不同进程打开同一文件，fd 可以不同。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e同一进程两次打开同一文件 → 得到两个不同的 fd\u003c/strong\u003e（产生两个进程表项）。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e「打开」不读文件内容\u003c/strong\u003e，只把 FCB 调入内存。读/写才真正传送数据。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e关闭不等于立刻写回磁盘\u003c/strong\u003e，要等计数归零。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 硬链接 vs 软链接\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e本质\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e多个目录项指向\u003cstrong\u003e同一个索引结点\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e新建一个\u003cstrong\u003e只存路径名\u003c/strong\u003e的 LINK 类型文件\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e计数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003einode 里 count++，删除时 count−−\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e无计数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e跨文件系统\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌ 不行\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ 可以\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e对目录建链\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌ 不行（防成环）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ 可以\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e原文件删除后\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅ 内容仍可通过其他链接访问\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e❌ 链接还在但失效（悬空链接）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e访问开销\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e与普通文件相同\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e多读一次链接文件\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e速记：\u003cstrong\u003e硬链接 = 多名字共享同一 inode；软链接 = 一个只存路径的小文件。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.3 逻辑结构三种\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e无结构（流式）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e字符流、不划分记录、按字节计长、顺序访问\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e源程序 / 目标代码 / 可执行文件\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e顺序文件\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e按记录顺序存放，批量存取效率最高\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e批量快、单条慢\u003c/strong\u003e、增删困难\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e索引文件\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e为变长记录建索引表，每记录一项\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e可随机、但索引表占空间\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e索引顺序文件\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e顺序文件分组，\u003cstrong\u003e每组第一条\u003c/strong\u003e建索引项\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e索引项\u003cstrong\u003e每组一个\u003c/strong\u003e，不是每记录一个\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e⚠️ 最常错：\u003cstrong\u003e索引顺序文件的索引项是「每组一个」，索引文件才是「每记录一个」。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.4 目录结构\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e单级\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e简单，可按名存取\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e不许重名、文件数受限、查找慢\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e两级\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e不同用户可重名、检索快、有访问控制\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e不灵活、\u003cstrong\u003e不能共享\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e树形\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e分类管理、不同目录可重名、可设权限\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e不便共享\u003c/strong\u003e（一个文件只能一个父目录）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e无环图\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e可共享\u003c/strong\u003e（多目录项指向同一文件）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e需共享计数器，删到 0 才真删；管理复杂\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.5 文件保护三法\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e口令\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e内容机密\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e口令存系统内部，不够安全\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e加密\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e内容机密\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e密钥管理麻烦\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e访问控制（ACL）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e操作权限\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e表可能很大\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e口诀：\u003cstrong\u003e口令/加密保护「内容机密」，访问控制保护「操作权限」。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.6 文件系统分层（自下而上，必背顺序）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eI/O 控制层  →  基本文件系统层  →  文件组织模块层  →  逻辑文件系统层\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eI/O 控制层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e设备驱动 + 中断处理，与硬件交互\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e基本文件系统层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e向驱动发通用命令，读写\u003cstrong\u003e物理块\u003c/strong\u003e（不关心内容）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e文件组织模块层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e逻辑块 → 物理块\u003c/strong\u003e映射、空闲空间管理\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e逻辑文件系统层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e元数据（FCB/目录）\u003c/strong\u003e、按名存取、权限检查、用户接口\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e记忆：\u003cstrong\u003e逻辑层管名字与权限，组织层管逻辑块到物理块，基本层管物理块读写，I/O 层管硬件。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.7 磁盘布局（按序）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e引导块 → 超级块 → 目录结构 → FCB（索引结点）区 → 数据区\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e引导块\u003c/strong\u003e：分区第一个块，\u003cstrong\u003e不属于文件系统本身\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e超级块\u003c/strong\u003e：分区大小、空闲块数与指针、空闲 FCB 数与指针；\u003cstrong\u003e挂载时才读入内存\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. 空闲空间管理四种方法","html":"\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e原理\u003c/th\u003e\u003cth\u003e适用\u003c/th\u003e\u003cth\u003e缺点\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e空闲表\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e每个空闲区一项：序号 + 首块号 + 块数\u003c/td\u003e\u003ctd data-label=\"适用\"\u003e\u003cstrong\u003e连续分配\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e空闲区多时表很长\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e空闲链表（盘块链）\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e空闲块逐块拉链\u003c/td\u003e\u003ctd data-label=\"适用\"\u003e简单\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e逐个摘取，工作量大\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e空闲链表（盘区链）\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e以「连续空闲区」为单位拉链\u003c/td\u003e\u003ctd data-label=\"适用\"\u003e较高效\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e回收需合并相邻盘区\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e位示图\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e1 bit / 块，0 空闲 1 已用\u003c/td\u003e\u003ctd data-label=\"适用\"\u003e中小型 FS\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e顺序扫描找空闲位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e成组链接\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e分组 + 链 + 超级块\u003c/td\u003e\u003ctd data-label=\"适用\"\u003e\u003cstrong\u003e超大 FS（UNIX）\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e结构复杂\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e选型口诀\u003c/strong\u003e：\u003cstrong\u003e小块数看位示图，大容量看成组链接，连续分配配空闲表。\u003c/strong\u003e\u003c/p\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. 一次完整寻址（综合题模板）","html":"\u003cp\u003e题目：「读文件偏移 off 处的内容，共需几次访盘？」\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e① i = ⌊off / B⌋，d = off mod B\n② 由目录（或其缓存）找到该文件的索引结点 FCB\n③ 按 i 落在直接/一级/二级/三级区，选路径得物理块号 b\n    额外读盘：直接 0 次、一级 1 次、二级 2 次、三级 3 次\n④ 按 b 读出整个盘块（1 次磁盘访问），取出 [d, d+长度) 的数据\n⑤ 若跨多个盘块，对 i, i+1, … 重复 ③④\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e⚠️ 「访问第 i 块几次访盘」= 索引块读取次数 + \u003cstrong\u003e数据块 1 次\u003c/strong\u003e。题设若说「索引块已在内存」，才只计数据块。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 自测清单（过完一遍，逐条自问）","html":"\u003cp\u003e\u003cstrong\u003e计算类\u003c/strong\u003e\u003c/p\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「块大小 1KB、地址 4B」，能立刻说出 K = 256（不是 1024）\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「10 直接 + 三级间接、4KB 块」，能算出最大文件约 4TB+4GB+4MB+40KB\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「逻辑块号 5000」，能判断它落在二级间接区，并说出至少读 3 次盘\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「字长 16 位、盘块号 100」，能立刻说出字号 6、位号 4\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「行 5 列 3、字长 16」，能反算出块号 66\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e给「磁盘 1GB、块 4KB」，能算出 FAT 表项数 = 262144\u003c/span\u003e\u003c/label\u003e\u003cp\u003e\u003cstrong\u003e辨析类\u003c/strong\u003e\u003c/p\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出 FAT 管「已用」、位示图管「空闲」\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出 FAT 是全局一张表、索引分配是每文件一块表\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出「随机访问 ≠ 零 I/O」\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出连续分配有\u003cstrong\u003e外部\u003c/strong\u003e碎片、没有内部碎片\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出隐式链接\u003cstrong\u003e不支持\u003c/strong\u003e随机访问\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出索引顺序文件的索引项是\u003cstrong\u003e每组一个\u003c/strong\u003e\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出 fd 是\u003cstrong\u003e局部唯一\u003c/strong\u003e、同进程两次打开同一文件得到\u003cstrong\u003e两个\u003c/strong\u003e fd\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出硬链接\u003cstrong\u003e不能\u003c/strong\u003e跨文件系统、\u003cstrong\u003e不能\u003c/strong\u003e对目录建\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出「打开」只调 FCB 进内存，\u003cstrong\u003e不读内容\u003c/strong\u003e\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能说出文件系统四层自下而上的顺序\u003c/span\u003e\u003c/label\u003e\u003cp\u003e\u003cstrong\u003e流程类\u003c/strong\u003e\u003c/p\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能背出成组链接法「取走最后一块」的处理顺序\u003c/span\u003e\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e能背出成组链接法「回收时组已满」的处理顺序（先写满组、后作首块）\u003c/span\u003e\u003c/label\u003e\u003chr\u003e"},{"id":"sec-9","section":"8. 已知未覆盖（别在这里找）","html":"\u003cul\u003e\u003cli\u003e\u003cstrong\u003e书页码\u003c/strong\u003e：本章资料 OCR 缺页，所有条目的 \u003ccode\u003esource\u003c/code\u003e 均为「考纲通用考点（OCR 缺页，页码待核）」。本卡\u003cstrong\u003e不写书页号\u003c/strong\u003e，避免编造。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e真题题号\u003c/strong\u003e：原始资料未标注真题年份题号，本卡\u003cstrong\u003e不写「20XX 年第 X 题」\u003c/strong\u003e。如需真题对照，另起一轮用真题原文核。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eVFS / 挂载\u003c/strong\u003e：属\u003cstrong\u003e考纲外补充\u003c/strong\u003e，选择题偶尔作为背景出现，不必深挖。\u003c/li\u003e\u003c/ul\u003e"}]}]},{"chapter":"第5章 输入/输出管理","subject":"os","docs":[{"id":"doc-1","title":"第 5 章 输入/输出管理（做题导向版）","sections":[{"id":"sec-1","section":"0. 考场速查（考前 10 分钟只看这一页）","html":"\u003cblockquote\u003e\u003cstrong\u003e适用\u003c/strong\u003e：408 操作系统 · 王道 第 5 章\u003cbr\u003e\u003cstrong\u003e口径\u003c/strong\u003e：本卡所有数字与结论来自 \u003ccode\u003eos/data/_parts/ch5.json\u003c/code\u003e（45 条已整理条目）\u003cbr\u003e\u003cstrong\u003e复算\u003c/strong\u003e：所有调度距离、时间公式已用脚本逐条复算，与王道例题完全一致\u003cbr\u003e\u003cstrong\u003e制卡\u003c/strong\u003e：小狐仙 · 2026-10-26\u003cbr\u003e\u003cstrong\u003e用法\u003c/strong\u003e：不是拿来看的，是拿来\u003cstrong\u003e照着套\u003c/strong\u003e的。每一节都是「看到这种题 → 走这个流程 → 别踩这个坑」。\u003c/blockquote\u003e\u003chr\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e磁盘总容量\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e柱面数 × 盘面数 × 每道扇区数 × 扇区大小\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e盘面数 = 磁头数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e寻道时间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eTs = m·n + s\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003em≈0.2ms/道，s≈2ms（\u003cstrong\u003e题给了就按题给的\u003c/strong\u003e）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e旋转延迟\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eTr = 1/(2r)\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003er 是\u003cstrong\u003e每秒转数\u003c/strong\u003e，不是每分钟\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输时间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eTt = b/(r·N)\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eN = 每磁道字节数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e一次读写总时间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eTa = Ts + Tr + Tt\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e三项缺一不可\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e单缓冲每块时间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eMax(T, C) + M\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e先取大再 \u003cstrong\u003e加\u003c/strong\u003e M\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e双缓冲每块时间\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003eMax(T, C+M)\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e先加后取大\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e调度平均寻道长度\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003ccode\u003e总移动距离 ÷ 请求数\u003c/code\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e分母是请求个数，不是段数\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e转速换算（必背）\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e5400 r/min\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e11.11 ms\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e5.56 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e7200 r/min\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e8.33 ms\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e4.17 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e15000 r/min\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e4.00 ms\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e2.00 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e换算口诀：一圈 = 60000÷转速（ms），Tr = 一圈 ÷ 2。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 磁盘调度算法（本章最大的计算题）","html":"\u003ch4 class=\"cardsec__sub\"\u003e统一题面（王道 2027 印刷页 343）\u003c/h4\u003e\u003cblockquote\u003e请求队列 \u003ccode\u003e55, 58, 39, 18, 90, 160, 150, 38, 184\u003c/code\u003e，磁头初始在 \u003cstrong\u003e100\u003c/strong\u003e，磁道范围 \u003cstrong\u003e0～200\u003c/strong\u003e。\u003cbr\u003e下面五种算法的答案全部用这一组数复算过，可以直接背。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e五种算法一次看全\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e算法\u003c/th\u003e\u003cth\u003e访问顺序\u003c/th\u003e\u003cth\u003e总距离\u003c/th\u003e\u003cth\u003e平均\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eFCFS\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→55→58→39→18→90→160→150→38→184\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e498\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e55.33\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eSSTF\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→90→58→55→39→38→18→150→160→184\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e248\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e27.56\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eSCAN（向大）\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→150→160→184→\u003cstrong\u003e200\u003c/strong\u003e→90→58→55→39→38→18\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e282\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e31.33\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eC-SCAN（向大）\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→150→160→184→\u003cstrong\u003e200→0\u003c/strong\u003e→18→38→39→55→58→90\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e390\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e43.33\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eLOOK（向大）\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→150→160→184→90→58→55→39→38→18\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e250\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e27.78\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eC-LOOK（向大）\u003c/td\u003e\u003ctd data-label=\"访问顺序\"\u003e100→150→160→184→\u003cstrong\u003e18\u003c/strong\u003e→38→39→55→58→90\u003c/td\u003e\u003ctd data-label=\"总距离\"\u003e\u003cstrong\u003e322\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"平均\"\u003e35.78\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e逐段距离（对着算，别信眼睛）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003eFCFS\u003c/strong\u003e：45 + 3 + 19 + 21 + 72 + 70 + 10 + 112 + 146 = \u003cstrong\u003e498\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSSTF\u003c/strong\u003e：10 + 32 + 3 + 16 + 1 + 20 + 132 + 10 + 24 = \u003cstrong\u003e248\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSCAN\u003c/strong\u003e：50 + 10 + 24 + 16 + 110 + 32 + 3 + 16 + 1 + 20 = \u003cstrong\u003e282\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e注意 184→200 是 16，200→90 是 110。\u003cstrong\u003e撞端点那 16 个磁道也要算。\u003c/strong\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003eC-SCAN\u003c/strong\u003e：50 + 10 + 24 + 16 + 200 + 18 + 20 + 1 + 16 + 3 + 32 = \u003cstrong\u003e390\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e关键：200→0 这一整段 \u003cstrong\u003e200 个磁道全算\u003c/strong\u003e（回扫不服务但耗时间）。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003eLOOK\u003c/strong\u003e：50 + 10 + 24 + 94 + 32 + 3 + 16 + 1 + 20 = \u003cstrong\u003e250\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e184 直接折返到 90，不用撞 200。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003eC-LOOK\u003c/strong\u003e：50 + 10 + 24 + 166 + 20 + 1 + 16 + 3 + 32 = \u003cstrong\u003e322\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e184 直接跳回最小请求 18，不回到 0。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e三个必踩的坑\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e坑 1：分母。\u003c/strong\u003e 平均寻道长度 = 总距离 ÷ \u003cstrong\u003e请求个数\u003c/strong\u003e。9 个请求就除 9，\u003cstrong\u003e不要把起点也算进去变成 10\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e坑 2：撞不撞端点。\u003c/strong\u003e 题目给了磁道范围（如 0～200）才撞端点；没给范围就是 LOOK/C-LOOK。\u003c/p\u003e\u003cul\u003e\u003cli\u003e王道原话：\u003cstrong\u003e实际系统中所称的 SCAN/C-SCAN，通常指 LOOK/C-LOOK。\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e做题先找题面有没有「磁道号 0～199」「最外道 200」这类字眼。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e坑 3：SCAN 的方向。\u003c/strong\u003e 题目说「向磁道号增大方向移动」才能按上表；如果说向小，整个顺序左右翻转，答案会变。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e一句话记住四个算法\u003c/h4\u003e\u003cblockquote\u003e\u003cstrong\u003eFCFS 公平但乱跑；SSTF 最近但饿死远的；SCAN 到端点才回头；C-SCAN 回来路上不干活。\u003c/strong\u003e\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 一次磁盘读写的时间（三个公式必须背）","html":"\u003ch4 class=\"cardsec__sub\"\u003e三段式\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e总时间 Ta = 寻道时间 Ts + 旋转延迟 Tr + 传输时间 Tt\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003eTs = m·n + s\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003em = 每跨一道的时间（题给，典型 0.2 ms）\u003c/li\u003e\u003cli\u003en = 跨越的磁道数\u003c/li\u003e\u003cli\u003es = 磁头臂启动时间（题给，典型 2 ms）\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eTr = 1/(2r)\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003er = \u003cstrong\u003e每秒转数\u003c/strong\u003e = 转速(r/min) ÷ 60\u003c/li\u003e\u003cli\u003e物理意义：平均要等半圈\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eTt = b/(r·N)\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eb = 要读写的字节数\u003c/li\u003e\u003cli\u003eN = 每磁道字节数\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e例题：磁头从 100 移到 250，读 4KB，7200 转/分，每道 1MB\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003ccode\u003eTs = 0.2 × 150 + 2 = 32 ms\u003c/code\u003e（跨 150 道）\u003c/li\u003e\u003cli\u003e\u003ccode\u003er = 7200/60 = 120 转/s\u003c/code\u003e，\u003ccode\u003eTr = 1/(2×120) = 4.17 ms\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003eTt = 4096 / (120 × 1048576) × 1000 = 0.033 ms\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003eTa = 32 + 4.17 + 0.033 ≈ 36.2 ms\u003c/code\u003e\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e结论（选择题常考）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e寻道时间占绝对主导\u003c/strong\u003e，而且能被调度算法优化 → 所以磁盘调度的目标是\u003cstrong\u003e减少平均寻道时间\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e旋转延迟和传输时间都与转速成反比，是硬件参数，软件优化不了。\u003c/li\u003e\u003cli\u003e顺序读比随机读快，就是因为省了寻道。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 缓冲区时间计算（送分题，别算反）","html":"\u003ch4 class=\"cardsec__sub\"\u003e三个量的含义\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eT\u003c/strong\u003e = 设备把一块数据送入缓冲区的时间\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eM\u003c/strong\u003e = 操作系统把缓冲区数据传到用户工作区的时间\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eC\u003c/strong\u003e = CPU 处理这块数据的时间\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e单缓冲：\u003ccode\u003eMax(T, C) + M\u003c/code\u003e\u003c/h4\u003e\u003cp\u003e思路：设备的 T 能和 CPU 处理\u003cstrong\u003e前一块\u003c/strong\u003e的 C 并行，谁慢谁拖后腿，然后还要再加一次传送 M。\u003c/p\u003e\u003cul\u003e\u003cli\u003eT &gt; C：设备慢，CPU 要等 → 每块 \u003ccode\u003eT + M\u003c/code\u003e\u003c/li\u003e\u003cli\u003eT &lt; C：CPU 慢，设备要等 → 每块 \u003ccode\u003eC + M\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e双缓冲：\u003ccode\u003eMax(T, C+M)\u003c/code\u003e\u003c/h4\u003e\u003cp\u003e思路：两块缓冲区轮流用，设备写一块的同时，系统可以「传送 + 处理」另一块。\u003c/p\u003e\u003cul\u003e\u003cli\u003eT &gt; C+M：设备来不及 → 每块 \u003ccode\u003eT\u003c/code\u003e\u003c/li\u003e\u003cli\u003eT &lt; C+M：CPU 慢 → 每块 \u003ccode\u003eC+M\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e对比口诀\u003c/h4\u003e\u003cblockquote\u003e\u003cstrong\u003e单缓冲：先取大，再加 M。\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003e双缓冲：先加 M，再取大。\u003c/strong\u003e\u003cbr\u003e加号的位置就是唯一的区别，千万别记混。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e例题：T=10ms，M=2ms，C=6ms\u003c/h4\u003e\u003cul\u003e\u003cli\u003e单缓冲 = \u003ccode\u003eMax(10, 6) + 2 = 12 ms\u003c/code\u003e\u003c/li\u003e\u003cli\u003e双缓冲 = \u003ccode\u003eMax(10, 6+2) = 10 ms\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 四种 I/O 控制方式（CPU 干预程度排序）","html":"\u003ch4 class=\"cardsec__sub\"\u003e从强到弱（\u003cstrong\u003e必考顺序\u003c/strong\u003e）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e程序直接控制 &gt; 中断驱动 &gt; DMA &gt; 通道\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方式\u003c/th\u003e\u003cth\u003eCPU 干预频率\u003c/th\u003e\u003cth\u003e数据通路\u003c/th\u003e\u003cth\u003e单位\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e程序直接控制\u003c/td\u003e\u003ctd data-label=\"CPU 干预频率\"\u003e全程轮询，最强\u003c/td\u003e\u003ctd data-label=\"数据通路\"\u003e设备→CPU寄存器→内存\u003c/td\u003e\u003ctd data-label=\"单位\"\u003e字/字节\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e中断驱动\u003c/td\u003e\u003ctd data-label=\"CPU 干预频率\"\u003e每个字/字节一次\u003c/td\u003e\u003ctd data-label=\"数据通路\"\u003e设备→CPU寄存器→内存\u003c/td\u003e\u003ctd data-label=\"单位\"\u003e字/字节\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003eDMA\u003c/td\u003e\u003ctd data-label=\"CPU 干预频率\"\u003e每个数据块的开始和结束\u003c/td\u003e\u003ctd data-label=\"数据通路\"\u003e设备↔内存（\u003cstrong\u003e不过 CPU\u003c/strong\u003e）\u003c/td\u003e\u003ctd data-label=\"单位\"\u003e数据块\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e通道\u003c/td\u003e\u003ctd data-label=\"CPU 干预频率\"\u003e每条通道程序一次\u003c/td\u003e\u003ctd data-label=\"数据通路\"\u003e设备↔内存\u003c/td\u003e\u003ctd data-label=\"单位\"\u003e一组数据块\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e四种方式的本质区别\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e程序直接控制\u003c/strong\u003e：CPU 死等，问「好了没」问到底。CPU 和设备完全串行。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e中断驱动\u003c/strong\u003e：设备主动打断 CPU 说「我好了」。设备准备数据时 CPU 能干活，但数据还是要过 CPU 寄存器。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDMA\u003c/strong\u003e：CPU 只交代「从哪读到哪，读多少」，剩下全交给 DMA 控制器。数据\u003cstrong\u003e不经过 CPU\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e通道\u003c/strong\u003e：一个专门管 I/O 的小处理机，能执行存在内存里的\u003cstrong\u003e通道程序\u003c/strong\u003e。CPU 发一条指令就撒手，通道能自主完成涉及多台设备的复杂 I/O。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003eDMA 控制器四个寄存器（必背）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eCR\u003c/strong\u003e 命令/状态\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eCPU 发来的命令、设备状态\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eMAR\u003c/strong\u003e 内存地址\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数据在内存的起始地址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eDR\u003c/strong\u003e 数据\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e单次传输的数据单元\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eDC\u003c/strong\u003e 数据计数器\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e还要传多少字/字节\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e口诀：\u003cstrong\u003e命（CR）地（MAR）数（DR）计（DC）\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003eDMA 工作流程（步骤题）\u003c/h4\u003e\u003col\u003e\u003cli\u003eCPU 收到 DMA 请求，发启动命令，设置 MAR 和 DC 初值\u003c/li\u003e\u003cli\u003eCPU 交出总线控制权，去干别的\u003c/li\u003e\u003cli\u003eDMA 控制器接管总线，突发方式把整块数据在设备↔内存间传完，\u003cstrong\u003e全程不要 CPU\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e传完，DMA 控制器发中断通知 CPU\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e通道 vs DMA 的三个差别\u003c/h4\u003e\u003cul\u003e\u003cli\u003eDMA 的参数（块大小、内存始址）是 CPU \u003cstrong\u003e预先设定\u003c/strong\u003e的；通道靠\u003cstrong\u003e执行程序\u003c/strong\u003e动态确定\u003c/li\u003e\u003cli\u003e一个 DMA 控制器通常只管\u003cstrong\u003e一台\u003c/strong\u003e设备；一个通道能管\u003cstrong\u003e多台\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e通道能完成多设备、多阶段的复杂 I/O；DMA 只能搬一个块\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. 磁盘与 SSD 的概念辨析","html":"\u003ch4 class=\"cardsec__sub\"\u003e磁盘地址与容量\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e地址 = 柱面号 · 盘面号 · 扇区号\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e读写一个块的三个动作：\u003c/p\u003e\u003col\u003e\u003cli\u003e移动磁头臂到目标\u003cstrong\u003e柱面\u003c/strong\u003e（寻道）\u003c/li\u003e\u003cli\u003e激活目标\u003cstrong\u003e盘面\u003c/strong\u003e的磁头\u003c/li\u003e\u003cli\u003e等目标\u003cstrong\u003e扇区\u003c/strong\u003e转到磁头下（旋转延迟）\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e容量 = 柱面数 × 盘面数 × 每道扇区数 × 扇区大小\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e传统设计每道扇区数相同，外层磁道周长长、密度低，容量被\u003cstrong\u003e最内道\u003c/strong\u003e卡住。\u003cbr\u003e现代用 \u003cstrong\u003eZBR 区域记录\u003c/strong\u003e：分环带，外环带扇区多，容量要\u003cstrong\u003e按环带分别算再相加\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e三种\"格式化\"别混\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e低级格式化（物理）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e把盘面划成扇区，写头/尾/CRC\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e出厂时厂家做\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e分区\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e划成 C 盘 D 盘，记在 MBR 分区表\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e用户做\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e逻辑格式化（高级）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e建文件系统：根目录、空闲空间管理结构\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e用户做\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e簇\u003c/strong\u003e：多个连续扇区合成一簇（块）。文件占空间是簇的整数倍——\u003cstrong\u003e1 字节的文件也占一整簇\u003c/strong\u003e。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003eSSD 为什么随机写慢（高频简答）\u003c/h4\u003e\u003cp\u003e两个原因：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e擦除比读慢一个数量级\u003c/strong\u003e（擦除以块为单位，读写以页为单位）\u003c/li\u003e\u003cli\u003e改一个已含数据的页 Pi，必须\u003cstrong\u003e先把整块有效页复制到新块\u003c/strong\u003e，再写 Pi（写时复制）\u003c/li\u003e\u003c/ol\u003e\u003cblockquote\u003e所以 SSD \u003cstrong\u003e随机读快、顺序写快、随机写慢\u003c/strong\u003e。别和机械盘混为一谈。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e磨损均衡（两种）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e动态\u003c/strong\u003e：写入时优先选擦写次数少的空闲块\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e静态\u003c/strong\u003e（更高级）：即使没新数据，控制器也定期搬数据，把高磨损块的数据迁走\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e提高磁盘 I/O 速度的七种方法（选择题爱考）\u003c/h4\u003e\u003col\u003e\u003cli\u003e磁盘高速缓存\u003c/li\u003e\u003cli\u003e磁盘调度（调整请求顺序）\u003c/li\u003e\u003cli\u003e提前读（预读下一块）\u003c/li\u003e\u003cli\u003e延迟写（攒一批再写）\u003c/li\u003e\u003cli\u003e优化物理块分布（同文件放同/邻磁道，按簇分配）\u003c/li\u003e\u003cli\u003e虚拟盘（RAM 盘）\u003c/li\u003e\u003cli\u003e磁盘阵列 RAID\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. 设备管理（背结构，不背细节）","html":"\u003ch4 class=\"cardsec__sub\"\u003eI/O 软件四层（自高到低，\u003cstrong\u003e必背顺序\u003c/strong\u003e）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e用户层软件 → 设备独立性软件 → 设备驱动程序 → 中断处理程序 → 硬件\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e口诀：\u003cstrong\u003e用 → 无 → 驱 → 中 → 硬\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e每层的活：\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e用户层\u003c/strong\u003e：产生请求、格式化 I/O、SPOOLing\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e设备独立性软件\u003c/strong\u003e：映射、保护、分块、缓冲、分配（统一接口）\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e设备驱动程序\u003c/strong\u003e：设寄存器、查状态，把抽象请求变具体指令\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e中断处理程序\u003c/strong\u003e：处理设备中断\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e关键性质：\u003cstrong\u003e每层只调用下层的服务，只向上提供接口\u003c/strong\u003e。只要接口不变，改哪层都不影响别层。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e设备独立性软件五大职责\u003c/h4\u003e\u003col\u003e\u003cli\u003e提供统一驱动接口（逻辑设备名 → 物理设备）\u003c/li\u003e\u003cli\u003e缓冲管理\u003c/li\u003e\u003cli\u003e差错控制（暂时性错误重试，持久性错误记坏块表）\u003c/li\u003e\u003cli\u003e独占设备的分配与回收\u003c/li\u003e\u003cli\u003e提供统一的逻辑数据块（屏蔽块长差异）\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e四张表（从属关系：设备 → 控制器 → 通道）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eDCT\u003c/strong\u003e 设备控制表\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个\u003cstrong\u003e物理设备\u003c/strong\u003e一张\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e设备类型、标识符、状态、指向 COCT 的指针、等待队列队首\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eCOCT\u003c/strong\u003e 控制器控制表\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个\u003cstrong\u003e控制器\u003c/strong\u003e一张\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e状态、指向 CHCT 的指针\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eCHCT\u003c/strong\u003e 通道控制表\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个\u003cstrong\u003e通道\u003c/strong\u003e一张\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e状态、连接的控制器的首址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eSDT\u003c/strong\u003e 系统设备表\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e整个系统只有一张\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e所有设备的全局索引\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e记忆：\u003cstrong\u003eDCT→COCT→CHCT 逐级指针；SDT 只有一张，是总目录。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e设备分配\"过三关\"\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e先分配设备 → 再分配控制器 → 再分配通道\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e三关都过了，这次分配才算成功，才能启动设备。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e用逻辑设备名时\u003c/strong\u003e：从 SDT 依次查同类设备的 DCT，\u003cstrong\u003e有一个空闲就往下走\u003c/strong\u003e；全忙才挂到该类设备的公共等待队列。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003eLUT（逻辑设备表）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e三项\u003c/strong\u003e：逻辑设备名、物理设备名、\u003cstrong\u003e驱动程序入口地址\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e两种设置：\u003c/p\u003e\u003cul\u003e\u003cli\u003e全系统一张 → 所有用户不能重名 → 单用户系统\u003c/li\u003e\u003cli\u003e每个用户一张 → 可以重名 → 多用户系统\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003eSPOOLing（假脱机）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e四部分\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e输入井 + 输出井（磁盘上）\u003c/li\u003e\u003cli\u003e输入缓冲区 + 输出缓冲区（内存中）\u003c/li\u003e\u003cli\u003e输入进程 + 输出进程（模拟外围控制机）\u003c/li\u003e\u003cli\u003e井管理程序\u003c/li\u003e\u003c/ol\u003e\u003cp\u003e\u003cstrong\u003e实质\u003c/strong\u003e：用高速共享设备（磁盘）当缓冲区，把\u003cstrong\u003e独占设备虚拟成多台逻辑设备\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e打印机例子\u003c/strong\u003e（必背）：进程请求打印 → 系统不分配物理打印机，而是把数据写进输出井、挂到假脱机队列 → 进程立刻认为打印完成 → 打印机空闲时后台进程按队列真打。\u003c/p\u003e\u003cblockquote\u003e一句话：\u003cstrong\u003eSPOOLing 让独占设备变成共享设备。\u003c/strong\u003e\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 概念辨析（选择题陷阱清单）","html":"\u003ch4 class=\"cardsec__sub\"\u003e7.1 缓冲 vs 缓存（最容易混）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e放什么\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e已存在于慢速设备上\u003c/strong\u003e的数据副本\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e正在传输过程中\u003c/strong\u003e的数据\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e目的\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e提高\u003cstrong\u003e重复访问\u003c/strong\u003e效率\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e协调速度差、减少中断\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e生命周期\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e长期驻留，直到被替换\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e传完立即释放\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.2 磁盘高速缓存 ≠ 虚拟盘\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e磁盘高速缓存\u003c/strong\u003e：由\u003cstrong\u003e操作系统透明管理\u003c/strong\u003e，内容是磁盘数据的副本\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e虚拟盘（RAM 盘）\u003c/strong\u003e：由\u003cstrong\u003e用户程序完全控制\u003c/strong\u003e，用内存仿真磁盘\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.3 块设备 vs 字符设备\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e块设备\u003c/strong\u003e：固定大小数据块、\u003cstrong\u003e可寻址\u003c/strong\u003e、支持随机访问（磁盘）→ 常用 \u003cstrong\u003eDMA\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e字符设备\u003c/strong\u003e：以字节为单位、\u003cstrong\u003e不可寻址\u003c/strong\u003e（终端、打印机）→ 常用 \u003cstrong\u003e中断\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e分水岭：\u003cstrong\u003e可寻址 ↔ 不可寻址\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.4 三种设备属性\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e独占设备\u003c/strong\u003e：一次只能一个进程用（打印机）\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e共享设备\u003c/strong\u003e：多进程逻辑并发（磁盘）\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e虚拟设备\u003c/strong\u003e：用 SPOOLing 把独占变成逻辑共享\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.5 阻塞 I/O vs 非阻塞 I/O\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据没好时\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e进程\u003cstrong\u003e阻塞\u003c/strong\u003e，进等待队列\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e立即返回错误码，进程继续跑\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e优点\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e简单，适合低并发\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e不阻塞，适合高并发\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e缺点\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eCPU 闲置\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e轮询浪费 CPU\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.6 循环缓冲的两种阻塞\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003ein 追上 out\u003c/strong\u003e（受计算限制）：缓冲区全满，\u003cstrong\u003e输入进程\u003c/strong\u003e阻塞\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eout 追上 in\u003c/strong\u003e（受 I/O 限制）：缓冲区全空，\u003cstrong\u003e计算进程\u003c/strong\u003e阻塞\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e循环缓冲和缓冲池\u003cstrong\u003e只考机制，不考时间计算\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.7 缓冲池的四个角色\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e角色\u003c/th\u003e\u003cth\u003e谁做\u003c/th\u003e\u003cth\u003e从哪取\u003c/th\u003e\u003cth\u003e放回哪\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"角色\"\u003e\u003cstrong\u003ehin\u003c/strong\u003e 收容输入\u003c/td\u003e\u003ctd data-label=\"谁做\"\u003e输入进程\u003c/td\u003e\u003ctd data-label=\"从哪取\"\u003e空缓冲队列\u003c/td\u003e\u003ctd data-label=\"放回哪\"\u003e输入队列\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"角色\"\u003e\u003cstrong\u003esin\u003c/strong\u003e 提取输入\u003c/td\u003e\u003ctd data-label=\"谁做\"\u003e计算进程\u003c/td\u003e\u003ctd data-label=\"从哪取\"\u003e输入队列\u003c/td\u003e\u003ctd data-label=\"放回哪\"\u003e空缓冲队列\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"角色\"\u003e\u003cstrong\u003ehout\u003c/strong\u003e 收容输出\u003c/td\u003e\u003ctd data-label=\"谁做\"\u003e计算进程\u003c/td\u003e\u003ctd data-label=\"从哪取\"\u003e空缓冲队列\u003c/td\u003e\u003ctd data-label=\"放回哪\"\u003e输出队列\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"角色\"\u003e\u003cstrong\u003esout\u003c/strong\u003e 提取输出\u003c/td\u003e\u003ctd data-label=\"谁做\"\u003e输出进程\u003c/td\u003e\u003ctd data-label=\"从哪取\"\u003e输出队列\u003c/td\u003e\u003ctd data-label=\"放回哪\"\u003e空缓冲队列\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e口诀：\u003cstrong\u003eh = 收（收容），s = 取（提取）；in = 输入，out = 输出。\u003c/strong\u003e\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.8 交替编号 vs 错位命名\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e交替编号\u003c/strong\u003e：单个盘面内，逻辑相邻的块\u003cstrong\u003e物理上隔开\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e错位命名\u003c/strong\u003e：不同盘面之间错开，使读完盘面 0 后盘面 1 刚好转到磁头下\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e目的相同：\u003cstrong\u003e避免「处理完上一个，下一个已经转过去了」\u003c/strong\u003e。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-9","section":"8. 自测清单（过完一遍，逐条自问）","html":"\u003ch4 class=\"cardsec__sub\"\u003e计算题（必须能默写）\u003c/h4\u003e\u003col\u003e\u003cli\u003e磁盘容量怎么算？盘面数和磁头数什么关系？\u003c/li\u003e\u003cli\u003e7200 转/分的旋转延迟是多少 ms？怎么算的？\u003c/li\u003e\u003cli\u003e寻道时间公式里 m、n、s 各是什么？单位？\u003c/li\u003e\u003cli\u003e单缓冲和双缓冲的公式，加号位置差在哪？\u003c/li\u003e\u003cli\u003e给你一组请求和磁头位置，FCFS/SSTF/SCAN/C-SCAN 能不能都算对？\u003c/li\u003e\u003cli\u003e平均寻道长度的分母是什么？\u003c/li\u003e\u003cli\u003e题目没给磁道范围时，SCAN 该按 LOOK 算还是撞端点算？\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e排序题（必考）\u003c/h4\u003e\u003col\u003e\u003cli\u003e四种 I/O 控制方式按 CPU 干预程度从强到弱怎么排？\u003c/li\u003e\u003cli\u003eI/O 软件四层从高到低怎么排？\u003c/li\u003e\u003cli\u003e设备分配过三关的顺序？\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e概念题\u003c/h4\u003e\u003col\u003e\u003cli\u003e块设备和字符设备的根本区别？各常用什么 I/O 方式？\u003c/li\u003e\u003cli\u003e缓冲和缓存的区别（数据来源、目的、生命周期）？\u003c/li\u003e\u003cli\u003e磁盘高速缓存和虚拟盘谁管？\u003c/li\u003e\u003cli\u003eSPOOLing 的四部分？它把什么变成了什么？\u003c/li\u003e\u003cli\u003eDCT/COCT/CHCT/SDT 各几张？谁指向谁？\u003c/li\u003e\u003cli\u003eDMA 的四个寄存器分别存什么？\u003c/li\u003e\u003cli\u003e通道和 DMA 的三个区别？\u003c/li\u003e\u003cli\u003eSSD 随机写为什么慢？两个原因。\u003c/li\u003e\u003cli\u003e动态磨损均衡和静态磨损均衡的区别？\u003c/li\u003e\u003cli\u003e阻塞 I/O 和非阻塞 I/O 各自的缺点？\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-10","section":"9. 已知未覆盖（别在这里找）","html":"\u003cul\u003e\u003cli\u003e\u003cstrong\u003eI/O 请求在 Linux 里的完整调用链\u003c/strong\u003e（printf → write → 陷阱 → system_call → sys_write）：\u003ccode\u003ech5.json\u003c/code\u003e 里有，但属于理解性内容，考试基本不考步骤，本卡不展开。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e坏块处理（扇区备用）\u003c/strong\u003e：知道「控制器维护坏块表、自动映射到备用扇区」即可。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eWindows 引导过程 / MBR 细节\u003c/strong\u003e：与第 4 章磁盘布局有重叠，本卡只留一句。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e通道程序的指令格式\u003c/strong\u003e：考纲不要求。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eNStepSCAN / FSCAN\u003c/strong\u003e：考纲外补充，知道「为解决磁臂黏着」就够了。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-11","section":"附：本章数字全部复算过","html":"\u003cp\u003e本卡所有调度距离与时间公式，均由小狐仙用脚本对王道原题数据（\u003ccode\u003e55,58,39,18,90,160,150,38,184\u003c/code\u003e，起点 100，范围 0～200）逐条复算，与教材答案一致：\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e算法\u003c/th\u003e\u003cth\u003e复算结果\u003c/th\u003e\u003cth\u003e王道答案\u003c/th\u003e\u003cth\u003e一致\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eFCFS\u003c/td\u003e\u003ctd data-label=\"复算结果\"\u003e498 / 55.33\u003c/td\u003e\u003ctd data-label=\"王道答案\"\u003e498 / 55.3\u003c/td\u003e\u003ctd data-label=\"一致\"\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eSSTF\u003c/td\u003e\u003ctd data-label=\"复算结果\"\u003e248 / 27.56\u003c/td\u003e\u003ctd data-label=\"王道答案\"\u003e248 / 27.5\u003c/td\u003e\u003ctd data-label=\"一致\"\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eSCAN\u003c/td\u003e\u003ctd data-label=\"复算结果\"\u003e282 / 31.33\u003c/td\u003e\u003ctd data-label=\"王道答案\"\u003e282 / 31.33\u003c/td\u003e\u003ctd data-label=\"一致\"\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"算法\"\u003eC-SCAN\u003c/td\u003e\u003ctd data-label=\"复算结果\"\u003e390 / 43.33\u003c/td\u003e\u003ctd data-label=\"王道答案\"\u003e390 / 43.33\u003c/td\u003e\u003ctd data-label=\"一致\"\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e"}]}]},{"chapter":"第1章 计算机网络体系结构","subject":"net","docs":[{"id":"doc-1","title":"第 1 章 计算机网络体系结构（做题导向版）","sections":[{"id":"sec-1","section":"0. 考场速查（考前 10 分钟只看这一页）","html":"\u003cblockquote\u003e数据源：《2027 王道计算机网络考研复习指导》第 1 章（PDF p13–p41）。\u003cbr\u003e用法：过一遍这张卡，再去做 1.1.7 / 1.2.4 的选择题，正确率应到 8 成以上。\u003cbr\u003e所有计算题的数字都是\u003cstrong\u003e按公式重新算过\u003c/strong\u003e的，不是抄的。\u003c/blockquote\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e单位换算（最容易丢分的地方）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e描述\u003cstrong\u003e数据量\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e2 的幂\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1 KB = 2¹⁰ B = 1024 B，1 Mb = 2²⁰ b\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e描述\u003cstrong\u003e速率\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e10 的幂\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1 kb/s = 10³ b/s，1 Mb/s = 10⁶ b/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e大小写\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数据量用大写 K，速率用小写 k\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e1 Kb ≠ 1 kb/s\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eb 与 B\u003c/strong\u003e：b = bit（比特），B = Byte（字节），1 B = 8 b。\u003cstrong\u003e题干里写 Mb/s 就是兆比特每秒，不是兆字节\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e换算链条：1 Mb/s = 10⁶ b/s；1 ms = 10⁻³ s；1 μs = 10⁻⁶ s。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e三种交换一句话\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003e一句话\u003c/th\u003e\u003cth\u003e建连接\u003c/th\u003e\u003cth\u003e线路独占\u003c/th\u003e\u003cth\u003e时延\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"\"\u003e电路交换\u003c/td\u003e\u003ctd data-label=\"一句话\"\u003e先拨号占线，再像水管一样灌\u003c/td\u003e\u003ctd data-label=\"建连接\"\u003e要\u003c/td\u003e\u003ctd data-label=\"线路独占\"\u003e独占\u003c/td\u003e\u003ctd data-label=\"时延\"\u003e最小\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"\"\u003e报文交换\u003c/td\u003e\u003ctd data-label=\"一句话\"\u003e整个报文一站站存下来再转\u003c/td\u003e\u003ctd data-label=\"建连接\"\u003e不要\u003c/td\u003e\u003ctd data-label=\"线路独占\"\u003e不独占\u003c/td\u003e\u003ctd data-label=\"时延\"\u003e最大\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"\"\u003e分组交换\u003c/td\u003e\u003ctd data-label=\"一句话\"\u003e报文切小块，一站站流水转发\u003c/td\u003e\u003ctd data-label=\"建连接\"\u003e不要\u003c/td\u003e\u003ctd data-label=\"线路独占\"\u003e不独占\u003c/td\u003e\u003ctd data-label=\"时延\"\u003e较小\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e时延四兄弟（只会考前两个的计算）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e发送时延（传输时延）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e分组长度、发送速率\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e分组长度 ÷ 发送速率\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传播时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e链路距离、介质中的电磁波速度\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e信道长度 ÷ 传播速率\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e处理时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e路由器查表、检错\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e一般题目忽略\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e排队时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e队列长度\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e一般题目忽略\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e一句话区分\u003c/strong\u003e：发送时延是「把数据推上路」的时间，传播时延是「数据在路上跑」的时间。\u003cbr\u003e前者跟\u003cstrong\u003e带宽\u003c/strong\u003e有关，后者跟\u003cstrong\u003e距离\u003c/strong\u003e有关。这是本章最高频的陷阱。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 三种交换方式（本章第一大计算题源）","html":"\u003ch4 class=\"cardsec__sub\"\u003e1.1 判别标志：题目里出现什么就是考什么\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e「建立连接时间 s」「专用通路」「电话网」\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e电路交换\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e「整个报文」「存储转发」「报文长度 x」\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e报文交换\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e「分组」「首部」「流水线」「逐跳转发」\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e分组交换\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e「要求时延最小」「连续大量数据」\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e电路交换\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e「线路利用率最高」「突发式数据」\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e分组交换\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.2 三个总时延公式（必背）\u003c/h4\u003e\u003cp\u003e设：数据总长 \u003cstrong\u003ex\u003c/strong\u003e bit，链路 \u003cstrong\u003ek\u003c/strong\u003e 段，每段速率 \u003cstrong\u003eb\u003c/strong\u003e bit/s，每段传播时延 \u003cstrong\u003ed\u003c/strong\u003e，建立连接时间 \u003cstrong\u003es\u003c/strong\u003e，分组长度 \u003cstrong\u003ep\u003c/strong\u003e bit（含首部），分组数 \u003cstrong\u003en = x / p\u003c/strong\u003e。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e① 电路交换\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eT = s + x / b + k × d\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e数据走一条专用通路直达，\u003cstrong\u003e只在源点发送一次\u003c/strong\u003e，中间节点不存储转发。\u003cbr\u003e注意 \u003ccode\u003ex / b\u003c/code\u003e 用的是\u003cstrong\u003e整段数据 + 沿途速率\u003c/strong\u003e。若各段速率不同，取瓶颈（最小）速率。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e② 报文交换\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eT = k × (x / b) + k × d\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e每个节点都要把\u003cstrong\u003e整个报文\u003c/strong\u003e完整收下来再发出去，一共 k 次「收+发」，所以是 k 倍的发送时延。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e③ 分组交换\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eT = (n + k − 1) × (p / b) + k × d\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e流水线：第 1 个分组走完 k 段要 k 个发送时延，后面 n−1 个分组各只需再 1 个发送时延。\u003cbr\u003e所以总发送时延 = \u003ccode\u003e(k − 1) × p/b + n × p/b\u003c/code\u003e = \u003ccode\u003e(n + k − 1) × p/b\u003c/code\u003e。\u003c/blockquote\u003e\u003cblockquote\u003e\u003cstrong\u003e三个公式的共同点\u003c/strong\u003e：传播时延都是 \u003ccode\u003ek × d\u003c/code\u003e，因为不管怎么交换，电磁波都要跑 k 段路。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.3 课本原例复算（图 1.6，PDF p19–p20）\u003c/h4\u003e\u003cp\u003e两段链路，链路 1 = 100 Mb/s，链路 2 = 80 Mb/s，主机 A 向 B 发一个 \u003cstrong\u003e1000 B\u003c/strong\u003e 的分组。\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e发送时延₁ = 1000 × 8 / (100 × 10⁶) = 8000 / 10⁸ = 8 × 10⁻⁵ s = 0.08 ms\n发送时延₂ = 1000 × 8 / (80 × 10⁶)  = 8000 / 8×10⁷ = 1 × 10⁻⁴ s = 0.1 ms\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e只算发送时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e0.08 + 0.1\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e0.18 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e加传播时延（0.01 ms + 0.05 ms）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e0.01 + 0.08 + 0.05 + 0.1\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e0.24 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e再加处理+排队时延 0.04 ms\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e0.01 + 0.08 + 0.04 + 0.05 + 0.1\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e0.28 ms\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e✅ 三个数都和课本一致。考试中\u003cstrong\u003e默认忽略处理时延和排队时延\u003c/strong\u003e，除非题目另有说明。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.4 三种交换特性对比表（选择题直接背）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e特性\u003c/th\u003e\u003cth\u003e电路交换\u003c/th\u003e\u003cth\u003e报文交换\u003c/th\u003e\u003cth\u003e分组交换\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e完成传输所需时间\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e最少\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e最多\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e较少\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e存储转发时延\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e无\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e较低\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e通信前是否建连接\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e是\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e否\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e节点缓存开销\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e无\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e低\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e是否支持差错控制\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e不支持\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e支持\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e支持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e数据是否有序到达\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e否\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e是否需额外控制信息\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e否\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e是（且占比较大）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e线路分配灵活性\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e不灵活\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e灵活\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e非常灵活\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e线路利用率\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e低\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e非常高\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.5 三个坑\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e「分组交换时延最小」是错的\u003c/strong\u003e。时延最小的是\u003cstrong\u003e电路交换\u003c/strong\u003e；分组交换只是比\u003cstrong\u003e报文交换\u003c/strong\u003e小。题目问「传输时延最小」→ 电路交换；问「线路利用率最高」→ 分组交换。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分组交换的额外开销 5%～10%\u003c/strong\u003e。因为每个数据段都要加首部，传送的信息量会增大约 5%～10%，这是它的缺点之一。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分组交换不保证有序\u003c/strong\u003e。采用数据报服务时，分组可能经不同路径到达，需要目的主机按编号重排序。虚电路服务可以避免失序，但要多花建连接的时间。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 性能指标（本章第二大计算题源）","html":"\u003ch4 class=\"cardsec__sub\"\u003e2.1 七个指标\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数字信道上传输数据的速率，又称数据率、比特率\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e带宽\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e计算机网络中：数字信道\u003cstrong\u003e能支持的最高数据速率\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e吞吐量\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e单位时间内通过某网络/信道/接口的\u003cstrong\u003e实际\u003c/strong\u003e数据量\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发送 + 传播 + 处理 + 排队\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003es\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e时延带宽积\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e传播时延 × 信道带宽\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003ebit\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e往返时延 RTT\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e从发出到收到确认的总时间\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003es\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信道利用率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e有数据时间 ÷ 总时间\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e%\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.2 带宽的两个含义（爱考）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e通信领域\u003c/strong\u003e：信号频率范围，单位 \u003cstrong\u003eHz\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e计算机网络\u003c/strong\u003e：数字信道最高数据速率，单位 \u003cstrong\u003eb/s\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e实际可用带宽\u003c/strong\u003e = 双方网卡性能、各段链路带宽、交换设备速率三者中的\u003cstrong\u003e最小值\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e例：主机 A 网卡 1 Gb/s，主机 B 网卡 10 Mb/s，链路 100 Mb/s → 最高理论速率 \u003cstrong\u003e10 Mb/s\u003c/strong\u003e（取最小）。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.3 时延带宽积（「以比特为单位的链路长度」）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e时延带宽积 = 传播时延 × 带宽\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e理解：把链路想成一根\u003cstrong\u003e空心管道\u003c/strong\u003e——长度是传播时延，横截面积是带宽，时延带宽积就是这根管子\u003cstrong\u003e能装多少比特\u003c/strong\u003e。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.4 RTT 的边界（最容易记错）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eRTT = 往返传播时延 + 接收端处理时延 + 中间节点处理/排队时延\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e❌ \u003cstrong\u003e不包括数据分组本身的发送时延\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e❌ 也不包括确认分组的发送时延\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.5 信道利用率\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e信道利用率 = 有数据通过的时间 ÷ (有数据通过的时间 + 无数据通过的时间)\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e不是越高越好：过低浪费资源；过高导致排队时延显著增加，引发\u003cstrong\u003e拥塞\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.6 常考题型模板\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题型 A：已知传播时延和发送时延相等，求分组大小\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e发送时延 = 传播时延\n分组长度 / 带宽 = 链路长度 / 传播速率\n→ 分组长度 = 带宽 × 链路长度 / 传播速率\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e例（1.1.7 第 10 题）：链路长 100 km，传播速率 10⁸ m/s，带宽 20 Mb/s\u003cbr\u003e传播时延 = 10⁵ m ÷ 10⁸ m/s = 10⁻³ s = 1 ms\u003cbr\u003e分组长度 = 20×10⁶ × 10⁻³ = 20 000 bit = \u003cstrong\u003e20 Kb\u003c/strong\u003e → 选 A\u003cbr\u003e⚠️ 题目给的传播速率是多少就用多少，\u003cstrong\u003e不要默认 2×10⁸\u003c/strong\u003e。真题里 10⁸ 和 2×10⁸ 都出现过。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e题型 B：分组交换总时延\u003c/strong\u003e（见 §1.2 公式③）\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e题型 C：吞吐量\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e吞吐量 = 瓶颈链路的带宽（多段串联时取最小）\u003c/code\u003e\u003c/pre\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 分层结构与相关概念","html":"\u003ch4 class=\"cardsec__sub\"\u003e3.1 分层的基本原则（5 条，考选择题）\u003c/h4\u003e\u003col\u003e\u003cli\u003e每层实现一种\u003cstrong\u003e相对独立\u003c/strong\u003e的功能，降低复杂度。\u003c/li\u003e\u003cli\u003e各层之间接口清晰、简洁，相互依赖尽可能少。\u003c/li\u003e\u003cli\u003e各层功能的定义\u003cstrong\u003e独立于具体实现方法\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e保持\u003cstrong\u003e下层对上层的独立性\u003c/strong\u003e，上层单向使用下层提供的服务。\u003c/li\u003e\u003cli\u003e整个分层结构应有利于\u003cstrong\u003e标准化\u003c/strong\u003e。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.2 核心名词（一组必考概念）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e实体\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e任何可发送或接收信息的硬件或软件进程\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e对等实体\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e不同机器上\u003cstrong\u003e同一层\u003c/strong\u003e的实体\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e水平\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e服务\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e下层为紧邻上层提供的功能调用\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e垂直\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e协议\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e控制\u003cstrong\u003e对等实体\u003c/strong\u003e之间通信的规则集合\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e水平\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eSAP（服务访问点）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e相邻两层实体交换信息的逻辑接口\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e垂直\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003ePDU\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e对等层之间传送的数据单位，n-PDU\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e水平\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eSDU\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e相邻层之间交换的数据单位，n-SDU\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e垂直\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003ePCI\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e协议控制信息，n-PCI\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e封装关系（必背）\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003en-SDU + n-PCI = n-PDU = (n−1)-SDU\u003c/code\u003e\u003c/pre\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.3 各层 PDU 的通俗名称\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e物理层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e比特流\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据链路层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e帧\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eIP 分组（数据报）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eTCP 报文段 / UDP 用户数据报\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应用层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e报文\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.4 分层的四条含义（爱考「下列说法错误的是」）\u003c/h4\u003e\u003col\u003e\u003cli\u003e第 n 层实体既要利用第 n−1 层的服务，又要向第 n+1 层提供服务。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e最低层只提供服务\u003c/strong\u003e，是整个层次结构的基础；\u003cstrong\u003e最高层面向用户提供服务\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e上层只能通过\u003cstrong\u003e相邻层\u003c/strong\u003e的接口使用下层的服务，\u003cstrong\u003e不能跨层调用\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e通信时，对等层在逻辑上如同存在一条直接信道。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 协议、接口、服务","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 协议的三要素\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e语法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数据与控制信息的\u003cstrong\u003e格式\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eTCP 报文段的结构\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e语义\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发出何种控制信息、完成何种动作、做出何种应答\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e三次握手每次做什么\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e同步（时序）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e执行各种操作的\u003cstrong\u003e条件\u003c/strong\u003e及事件发生的\u003cstrong\u003e先后顺序\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e三次握手的时序\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 协议 vs 服务（最高频辨析）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e方向\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e水平\u003c/strong\u003e（对等实体之间）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e垂直\u003c/strong\u003e（下层给上层）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e是否可见\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e下层协议对上层\u003cstrong\u003e透明\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e上层只能感知服务\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e关系\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e只有本层协议正确实现，才能向上层提供服务\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e服务是协议实现的结果\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e一句话\u003c/strong\u003e：协议是「同级之间怎么谈」，服务是「下层给上层什么」。\u003cbr\u003e\u003cstrong\u003e关键\u003c/strong\u003e：不是某一层完成的全部功能都能叫服务，\u003cstrong\u003e只有能被上层实体感知并调用的功能\u003c/strong\u003e才构成服务。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.3 服务的三种分类\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e连接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e面向连接 / 无连接\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e面向连接三阶段：建立、传输、释放\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e可靠性\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e可靠 / 不可靠\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e不可靠 = 「尽最大努力交付」，可靠性由高层补\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应答\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e有应答 / 无应答\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eWWW 通常\u003cstrong\u003e无应答\u003c/strong\u003e；文件传输\u003cstrong\u003e有应答\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. OSI 七层参考模型（本章第三大考点）","html":"\u003ch4 class=\"cardsec__sub\"\u003e5.1 七层功能速记表\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e层\u003c/th\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e传输单位\u003c/th\u003e\u003cth\u003e核心功能\u003c/th\u003e\u003cth\u003e典型设备\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e应用层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e7\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e报文\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e提供应用与网络的接口\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e表示层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e6\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e—\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e数据格式转换、压缩、加解密\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e会话层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e5\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e—\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e会话管理、\u003cstrong\u003e检查点/断点续传\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e传输层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e4\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e报文段/用户数据报\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e端到端通信、复用分用、可靠传输\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e网关\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e网络层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e3\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e分组\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e路由选择、拥塞控制、网际互联\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e路由器\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e数据链路层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e2\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e帧\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e差错控制、流量控制、成帧\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e网桥、交换机\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e物理层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e1\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e比特\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e定义接口参数、信号含义/电气特性\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e中继器、集线器\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.2 三个「地址」的层次（一句话区分）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据链路层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e节点到节点\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eMAC 地址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e主机到主机\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eIP 地址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e端到端\u003c/strong\u003e（进程到进程）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e端口号\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.3 传输层的复用与分用\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e复用\u003c/strong\u003e：多个应用进程可同时使用传输层的服务。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分用\u003c/strong\u003e：传输层能把收到的数据准确交付给对应的上层进程。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.4 物理层的一个坑\u003c/h4\u003e\u003cblockquote\u003e\u003cstrong\u003e传输介质不属于物理层协议范畴\u003c/strong\u003e，而是位于其下方。有人把物理介质称为「第 0 层」。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.5 会话层的检查点\u003c/h4\u003e\u003cp\u003e会话层为表示层/用户进程提供同步机制（SYN），并引入\u003cstrong\u003e检查点\u003c/strong\u003e功能：通信中断时可从最近的检查点恢复会话，实现类似「断点续传」的可靠性。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. TCP/IP 模型与 OSI 对比","html":"\u003ch4 class=\"cardsec__sub\"\u003e6.1 TCP/IP 四层\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应用层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e会话 + 表示 + 应用\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eHTTP、SMTP、DNS、RTP、FTP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e传输层\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eTCP、UDP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网际层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e网络层\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eIP、ARP、ICMP、IGMP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络接口层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e物理 + 数据链路\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e未规定具体协议\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e6.2 两大设计哲学\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eEverything over IP\u003c/strong\u003e：各种应用都可构建于 IP 之上。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eIP over Everything\u003c/strong\u003e：IP 可运行于任意底层网络之上。\u003c/li\u003e\u003c/u
