用，提高信道利用率。电话线上网、Wi-Fi 均属频带传输。\n3. 宽带传输：在传统通信语境中，指利用频分复用等技术把一条物理线路划分为多个频带信道，每个信道可独立进行频带传输、互不干扰，多个信号可并行传送，显著提升链路容量；如有线电视网络能一边上网一边看电视。\n背诵要点：基带 = 不调制占全带宽；频带 = 调制到载波；宽带 = 频分复用划多信道。","keywords":["基带传输","频带传输","宽带传输","频分复用","多路复用"],"source":"王道2027版 印刷页 49（PDF p61）","status":"final"},{"id":"net-ch2-2.4-003","chapter":"第2章 物理层","subject":"net","section":"2.4 本章小结及疑难点","topic":"两定理对数据通信的意义及“奈氏管码元、香农管比特”的分工","level":"l3","title":"奈氏准则与香农定理的意义","answer":"【结论】两个定理从不同角度揭示信道传输能力的极限，共同构成数据通信系统设计的理论基础。\n1. 奈氏准则：仅考虑信道带宽限制，指出在给定带宽下码元传输速率存在上限（与噪声无关），超过该上限将因码间串扰而无法正确识别信号；但它不限制每个码元携带的比特数，因此可通过高阶调制提升信息传输速率。\n2. 香农定理：适用于有噪声的实际信道，指出对于确定的带宽和信噪比，信息传输速率存在一个不可逾越的理论上限，无论采用何种技术都无法突破。\n3. 工程含义：要提高通信速率，只能通过增加带宽或改善信噪比，而二者在现实中均有物理限制。\n背诵要点：奈氏管“码元别太快”，香农管“比特别太多”。","keywords":["奈氏准则","香农定理","码间串扰","理论极限","意义"],"source":"王道2027版 印刷页 49（PDF p61）","status":"final"},{"id":"net-ch2-2.4-004","chapter":"第2章 物理层","subject":"net","section":"2.4 本章小结及疑难点","topic":"信噪比为什么要用分贝表示，以及两种表示形式的等价换算","level":"l3","title":"信噪比为什么用 dB 表示","answer":"【结论】信噪比用分贝表示，是因为信号与噪声的功率差异往往极大，dB 能把大范围比值压缩成简洁数字。\n1. 线性比值（无单位）：如信号功率为 100、噪声功率为 1，则信噪比 S/N = 100。\n2. 分贝形式（单位 dB）：此时信噪比为 10log10(S/N) = 10log10(100) = 20dB。\n3. 等价性：两种表示在数学上等价，可互相换算 S/N = 10^(dB/10)。\n4. 实用原因：通信中信号功率可能是噪声的 10 亿倍，用线性值表示为 1 后面 9 个 0，不仅长还容易数错；用分贝表示仅为 90dB，简洁且不易出错。\n背诵要点：dB 只是换了一种“压缩刻度”的写法，代公式时仍要换回 S/N。","keywords":["信噪比","分贝","dB","对数","功率比"],"source":"王道2027版 印刷页 49（PDF p61）","status":"final"},{"id":"net-ch3-3.1-001","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"数据链路层的主要任务、必须解决的三个基本问题，以及点对点信道与广播信道的区别","level":"l1","title":"数据链路层三大基本问题","answer":"【结论】数据链路层的主要任务是让帧在一段链路或一个网络中传输。尽管数据链路层协议种类繁多，它们都需解决三个基本问题：封装成帧、透明传输和差错检测。\n1. 封装成帧：在数据前后分别添加首部和尾部，构成完整帧，使接收方能从比特流中识别帧的边界。\n2. 透明传输：即使数据中恰好出现与帧定界符相同的比特组合，也不会被误判为帧边界。\n3. 差错检测：发现传输过程中出现的比特差错，避免错误数据上交网络层。\n4. 点对点信道：一对一通信，通常通过一条专用物理链路连接两个节点。\n5. 广播信道：一对多通信，单个节点发送的数据可被连接在同信道上的所有节点接收，需要介质访问控制来协调。\n背诵要点：三大基本问题是封装成帧、透明传输、差错检测；信道分点对点（一对一专用链路）与广播（一对多共享信道）两类。","keywords":["封装成帧","透明传输","差错检测","点对点信道","广播信道","帧"],"source":"王道2027版 印刷页 50（PDF p62）","status":"final"},{"id":"net-ch3-3.1-002","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"链路、数据链路、帧三个基本概念的准确定义与相互关系","level":"l1","title":"链路、数据链路与帧","answer":"【结论】链路是物理线路，数据链路是加了协议的逻辑通道，帧是数据链路层的协议数据单元。\n1. 链路：指从一个节点到相邻节点的一段物理线路，是通信路径的组成部分，中间没有交换节点。\n2. 数据链路：在物理链路上添加实现通信协议的软硬件后所形成的逻辑通信通道，比链路多了协议与规程。\n3. 帧：数据链路层对等实体间通信的协议数据单元。发送方将网络层交下的数据封装为帧发送，接收方从帧中提取数据并上交网络层。\n4. 三者关系：数据链路以帧为单位传输数据，链路是承载它的物理介质，数据链路是它的逻辑抽象。\n背诵要点：链路是物理线路，数据链路是加了协议的逻辑通道，帧是数据链路层的协议数据单元。","keywords":["链路","数据链路","帧","协议数据单元","物理线路","逻辑通信通道"],"source":"王道2027版 印刷页 51（PDF p63）","status":"final"},{"id":"net-ch3-3.1-003","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"数据在各节点协议栈中的上下流动，主机使用五层而路由器只用下三层","level":"l2","title":"数据链路层所处的地位","answer":"【结论】主机 H1 和 H2 均具备完整的五层协议栈；路由器在转发分组时仅使用协议栈的下三层。\n1. 发送过程：H1 的链路层到 R1 的链路层、R1 到 R2、R2 到 H2，数据在各节点的协议栈中多次上下流动。\n2. 路由器内部：进入路由器后，先从物理层上至网络层，在转发表中确定下一跳地址，再下至物理层转发出去。\n3. 水平视角：学习数据链路层时聚焦水平方向的交互，可简化为 H1 链路层、R1 链路层、R2 链路层、H2 链路层四段。\n4. 分段独立：这三段链路可能采用不同的数据链路层协议，但每一段都独立完成帧的传输任务。\n背诵要点：主机五层、路由器下三层；链路层是逐段（点到点）的，三段链路可用不同协议、各自独立完成帧传输。","keywords":["五层协议栈","下三层","路由器","转发表","逐段传输","水平视角"],"source":"王道2027版 印刷页 50-51（PDF p62-63）","status":"final"},{"id":"net-ch3-3.1-004","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"链路管理的含义（连接的建立、维持与释放）及其适用服务，并与物理层的电路管理辨析","level":"l3","title":"链路管理","answer":"【结论】链路管理是指数据链路层连接的建立、维持和释放过程，主要用于面向连接的服务。\n1. 建立：通信双方必须首先确认对方处于就绪状态，并交换必要信息（如初始化帧序号），才能建立连接。\n2. 维持：传输过程中需维持连接状态，使双方对当前通信进度保持一致的判断。\n3. 释放：通信结束后释放连接，归还所占资源。\n4. 归属辨析：链路管理属于数据链路层功能；电路管理由物理层提供，不属于数据链路层功能。\n5. 易错点：只有面向连接的服务才需要链路管理，无连接服务不做建立与释放。\n背诵要点：链路管理三步是建立、维持、释放，只有面向连接服务才需要；电路管理归物理层，不算链路层功能。","keywords":["链路管理","建立连接","维持连接","释放连接","面向连接","帧序号","物理层"],"source":"王道2027版 印刷页 51-52（PDF p63-64）","status":"final"},{"id":"net-ch3-3.1-005","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"封装成帧与帧定界的实现，HDLC 标志字段 01111110 的作用，以及最大传送单元 MTU 的含义","level":"l1","title":"封装成帧与帧定界","answer":"【结论】封装成帧是指在数据前后分别添加首部和尾部，构成一个完整的帧。帧长等于数据部分长度加上首部和尾部的长度。首部和尾部包含控制信息，核心作用是帧定界，帮助接收方从比特流中准确识别帧的起始与结束。\n1. HDLC 实例：使用标识字段 F（01111110）标识帧的开始和结束，接收方将第一个 F 视为帧的开始，下一个 F 标志该帧的结束。\n2. 帧长的权衡：为提高传输效率应使数据部分尽可能长，但帧过长会增加差错概率和重传开销。\n3. 因此各类链路层协议均规定了最大传送单元 MTU，即帧数据部分的长度上限。\n4. MTU 只约束数据部分，不含首部和尾部。\n5. 与透明传输的关系：定界符唯一可识别是前提，数据中若出现相同比特组合就必须靠透明传输机制来区分。\n背诵要点：帧长等于数据加首部加尾部；HDLC 用 01111110 定界；MTU 只限数据部分长度。","keywords":["封装成帧","帧定界","HDLC","01111110","MTU","帧长","首部与尾部"],"source":"王道2027版 印刷页 52（PDF p64）","status":"final"},{"id":"net-ch3-3.1-006","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"透明的概念、透明传输的含义、不实现透明传输的后果及对上层透明性的体现","level":"l2","title":"透明传输的含义","answer":"【结论】透明是计算机领域的重要概念，意指某事物虽存在，但对上层不可见。透明传输是数据链路层的重要特性：即使数据中恰好出现与帧定界符相同的比特组合，也不会被误判为帧边界。\n1. 不处理的后果：接收方可能提前结束帧解析，把数据中的定界符误当成帧尾，导致后续数据丢失。\n2. 实现之后：接收方能将帧完整恢复为原始 SDU（服务数据单元）。\n3. 透明性的体现：使网络层感知不到底层的帧封装过程，即数据链路层对上层是透明的。\n4. 实现手段：字节填充法、零比特填充法、违规编码法等，具体由各协议规定。\n背诵要点：透明就是定界符出现在数据里也不被误判，接收方完整还原 SDU，网络层对帧封装毫无感知。","keywords":["透明","透明传输","帧定界符","SDU","误判帧边界","字节填充","零比特填充"],"source":"王道2027版 印刷页 52（PDF p64）","status":"final"},{"id":"net-ch3-3.1-007","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"流量控制的目的与反馈机制，以及 OSI 链路层相邻节点与 TCP/IP 传输层端到端的分工","level":"l2","title":"流量控制及其层次归属","answer":"【结论】流量控制旨在限制发送方的发送速率，使其不超过接收方的接收能力。\n1. 起因：链路两端节点的处理速率或缓存能力存在差异，发送方速率过高时接收方可能来不及处理而导致帧丢失。\n2. 机制：该过程通常依赖反馈，发送方根据接收方的确认或窗口信息，决定是否继续发送。\n3. OSI 模型：流量控制由数据链路层实现，用于调节相邻节点间的流量。\n4. TCP/IP 模型：该功能主要由传输层（如 TCP）承担，负责端到端的流量控制。\n5. 辨析：流量控制实际上控制的是发送方的数据流量，并非数据链路层独有；拥塞控制则属于网络层或传输层。\n背诵要点：流量控制限发送方速率，靠确认或窗口反馈；OSI 在链路层管相邻节点，TCP/IP 在传输层管端到端。","keywords":["流量控制","发送方速率","接收能力","反馈机制","滑动窗口","传输层","拥塞控制"],"source":"王道2027版 印刷页 52（PDF p64）","status":"final"},{"id":"net-ch3-3.1-008","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"传输差错的两类：位错与帧错（帧丢失、重复、失序），以及各自的检测手段","level":"l1","title":"位错与帧错","answer":"【结论】由于信道噪声等因素，帧在传输过程中可能出现两类错误：位错和帧错。\n1. 位错：帧中某些比特发生翻转，即 0 变 1 或 1 变 0，通常通过循环冗余检验检测。\n2. 帧错：包括帧丢失、帧重复或帧失序等，属于更高层的传输差错。\n3. 检测手段：位错用 CRC 或海明码等检错纠错编码；帧丢失则靠帧编号加计时器超时重发来发现并恢复。\n4. 易错点：CRC 只能发现比特是否出错，无法处理帧的丢失、重复与失序，必须配合帧编号与超时重传。\n背诵要点：位错是比特翻转、用 CRC 检；帧错是丢失重复失序、靠帧编号与超时重传处理。","keywords":["位错","帧错","比特翻转","CRC","帧丢失","帧重复","帧失序","超时重传"],"source":"王道2027版 印刷页 52（PDF p64）","status":"final"},{"id":"net-ch3-3.1-009","chapter":"第3章 数据链路层","subject":"net","section":"3.1 数据链路层的功能","topic":"可靠传输机制的演变与核心原则：CRC 检错加确认重传，无线链路与有线链路的分工差异","level":"l1","title":"可靠传输与核心原则","answer":"【结论】核心原则是：数据链路层确保上交的帧无差错，但不保证所有帧都被成功交付。\n1. 早期做法：OSI 模型认为数据链路层必须向上提供可靠传输服务，因此在 CRC 检错基础上引入了帧编号、确认与重传机制。\n2. 确认重传：接收方收到正确帧后需发送确认；发送方若在规定时间内未收到确认，则判定为出错并重传，直至收到确认为止。\n3. 无线链路：通信质量较差的无线链路中，数据链路层仍使用确认与重传机制，以提供可靠服务。\n4. 有线链路：高质量的有线链路中，数据链路层仅进行 CRC 检错，将出错帧直接丢弃，不再负责重传。\n5. 分工：有线链路上重传任务由高层协议（如传输层 TCP）完成，可靠性交给 TCP。\n6. 服务选择：信道可靠且对实时性要求高时，宜采用无确认的无连接服务，差错恢复交给高层。\n背诵要点：可靠传输等于 CRC 检错加帧编号加确认重传；无线链路链路层管重传，有线链路只检错、可靠性交给 TCP。","keywords":["可靠传输","CRC","帧编号","确认与重传","无线链路","有线链路","TCP","无确认无连接服务"],"source":"王道2027版 印刷页 52（PDF p64）","status":"final"},{"id":"net-ch3-3.2-001","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"组帧的目的、需解决的三个问题（帧定界、帧同步、透明传输），以及为什么首尾都要加","level":"l1","title":"组帧的目的与三个问题","answer":"【结论】组帧是发送方依据特定规则，将网络层递交的分组封装成帧。数据链路层以帧为单位传输数据，主要目的是：一旦出错只需重发出错的帧，而不必重传全部数据，从而提高传输效率。\n1. 帧定界：确定帧在比特流中的起始与结束位置。\n2. 帧同步：接收方能从连续的比特流中正确区分出一帧的边界并与发送方对齐。\n3. 透明传输：数据中出现与帧定界符相同的比特组合时不被误判为边界。\n4. 首尾都要加的原因：网络中信息以帧为最小传输单位，接收方必须能准确识别一帧在比特流中的起始与结束位置，否则无法正确解析帧内容。\n背诵要点：组帧是为了出错只重传出错帧；要解决帧定界、帧同步、透明传输；首尾都加是为了让接收方定位一帧的起止。","keywords":["组帧","帧定界","帧同步","透明传输","首部","尾部","重传出错帧"],"source":"王道2027版 印刷页 54（PDF p66）","status":"final"},{"id":"net-ch3-3.2-002","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"字符计数法的原理、计数字段的含义（含自身 1B）及其失去同步的致命缺陷","level":"l2","title":"字符计数法","answer":"【结论】字符计数法在帧首部设置一个计数字段，用于记录该帧包含的总字节数，其中包括计数字段自身占用的 1B。\n1. 接收方读取该计数值后，即可确定后续数据的长度，从而定位帧的结束位置。\n2. 由于帧是连续传输的，下一帧的起始位置也随之确定，不必再额外查找。\n3. 举例：计数值为 5 表示该帧共 5 个字符，其中 1 个是计数字段本身，数据部分占 4 个字符。\n4. 主要缺陷：当计数字段在传输过程中出错时，接收方将无法正确识别帧的边界，导致收发双方失去同步，可能引发灾难性后果。\n背诵要点：字符计数法靠首部计数字段（含自身 1B）定位帧尾；计数字段一错就失步，这是它最致命的缺陷。","keywords":["字符计数法","计数字段","字节数","帧定界","失步","缺陷"],"source":"王道2027版 印刷页 54（PDF p66）","status":"final"},{"id":"net-ch3-3.2-003","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"字节填充法的定界字符 SOH 与 EOT、ESC 转义规则（含 ESC 自身转义）及实现特点","level":"l2","title":"字节填充法","answer":"【结论】字节填充法通过特定控制字符实现帧定界：控制字符 SOH 表示帧的起始，EOT 表示帧的结束。\n1. 问题：为避免数据中出现的 SOH 或 EOT 被误判为帧定界符，必须做转义处理。\n2. 发送方处理：在每个 SOH、EOT 或 ESC 之前插入一个 ESC 字符。ESC 是 ASCII 码中的一个单字节控制字符。\n3. 接收方处理：收到 ESC 后将其丢弃，并将紧随其后的字符视为普通数据而非控制字符，从而还原出原始数据。\n4. ESC 自身也要转义：若数据中原本就包含 ESC，则同样在其前再插入一个 ESC，接收方见到两个 ESC 就还原成一个。\n5. 特点：实现直观但较为复杂，且存在兼容性问题。\n背诵要点：SOH 起、EOT 止；数据里凡出现 SOH、EOT、ESC 一律前面加 ESC，接收方去掉 ESC 还原，ESC 自己也要转义。","keywords":["字节填充法","SOH","EOT","ESC","转义","透明传输","帧定界"],"source":"王道2027版 印刷页 54（PDF p66）","status":"final"},{"id":"net-ch3-3.2-004","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"零比特填充法的规则：每 5 个连续 1 后插 0、接收方删除，HDLC 应用与易硬件实现的优点","level":"l1","title":"零比特填充法","answer":"【结论】零比特填充法允许数据帧包含任意数量的比特，并用固定比特串 01111110 作为帧的起始和结束标志。\n1. 发送方规则：扫描数据时，每遇到 5 个连续的 1，就在其后自动插入一个 0。\n2. 目的：确保数据字段中不会出现 6 个连续的 1，避免与帧标志 01111110 混淆。\n3. 接收方规则：执行逆操作，每收到 5 个连续的 1，就自动删除其后的一个 0，以恢复原始数据。\n4. 应用：早期的 HDLC 协议正是采用这种方法来实现透明传输。\n5. 优点：零比特填充法易于硬件实现，性能优于字节填充法。\n6. 易错点：填充与删除的触发条件都是 5 个连续 1，不是 6 个。\n背诵要点：发方见 5 个连续 1 就补 0、收方见 5 个连续 1 就删 0；标志是 01111110；HDLC 用它，易硬件实现。","keywords":["零比特填充法","01111110","五个连续 1","插入 0","HDLC","透明传输","硬件实现"],"source":"王道2027版 印刷页 55（PDF p67）","status":"final"},{"id":"net-ch3-3.2-005","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"违规编码法利用曼彻斯特编码中未被采用的高-高、低-低电平对实现帧定界","level":"l3","title":"违规编码法","answer":"【结论】违规编码法利用物理层编码的冗余特性实现帧定界。\n1. 曼彻斯特编码规则：比特 1 编码为高-低电平对，比特 0 编码为低-高电平对。\n2. 违规序列：高-高或低-低电平对在数据比特中是违规的（未被采用），因此可借用这些违规编码序列来标识帧的起始或终止。\n3. 应用：局域网 IEEE 802 标准采用了这种方法。\n4. 优点：违规编码法无须任何填充技术即可实现透明传输。\n5. 局限：仅适用于采用冗余编码的特殊编码环境。\n背诵要点：曼彻斯特里 1 是高-低、0 是低-高；借高-高与低-低这些违规电平对定界，无需填充但只适用于冗余编码环境。","keywords":["违规编码法","曼彻斯特编码","高-高电平对","低-低电平对","冗余编码","IEEE 802","帧定界"],"source":"王道2027版 印刷页 55（PDF p67）","status":"final"},{"id":"net-ch3-3.2-006","chapter":"第3章 数据链路层","subject":"net","section":"3.2 组帧","topic":"四种组帧方法的对比、各自缺陷与当前常用方法的适用性小结","level":"l3","title":"四种组帧方法小结","answer":"【结论】常见的组帧方法主要有四种：字符计数法、字节填充法、零比特填充法、违规编码法。\n1. 字符计数法：靠首部计数字段定界，对计数字段错误极为敏感，一旦出错收发双方即失去同步。\n2. 字节填充法：用 SOH 与 EOT 定界、用 ESC 转义，实现上较为复杂且存在兼容性问题。\n3. 零比特填充法：用 01111110 定界，每 5 个连续 1 后插 0，易于硬件实现，性能优于字节填充法。\n4. 违规编码法：借物理层编码的违规序列定界，无须填充，但仅适用于冗余编码的特殊环境。\n5. 现状：由于字符计数法对计数字段错误极敏感、字节填充法实现复杂且兼容性差，目前更常用的组帧方法是零比特填充法和违规编码法。\n背诵要点：计数法怕错、字节填充法复杂、零比特填充法易硬件实现、违规编码法要冗余编码；如今常用后两种。","keywords":["字符计数法","字节填充法","零比特填充法","违规编码法","适用性","对比"],"source":"王道2027版 印刷页 55（PDF p67）","status":"final"},{"id":"net-ch3-3.3-001","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"比特差错的含义与差错控制的两类策略（检错编码与纠错编码）","level":"l1","title":"比特差错与两类差错控制","answer":"【结论】比特在传输中可能由 1 变 0 或由 0 变 1，这种现象称为比特差错，它是传输差错的一种，也是本节唯一讨论的差错类型。差错控制靠编码技术实现，分为检错编码与纠错编码两类。\n1. 检错编码：接收方只能发现差错而不知道错在哪一位，需要通知发送方重传，直到收到正确数据为止，典型是奇偶校验码和循环冗余码。\n2. 纠错编码：接收方不仅能发现差错，还能确定错误位置并直接纠正，无须重传，典型是海明码。\n3. 两者的共同基础是冗余：发送前按规则附加若干冗余位（检验位），使整个码字满足预设编码规则，接收方靠校验规则是否被破坏来判断是否出错。\n4. 衡量两种能力的统一参数是码距（海明距离），码距越大，检错与纠错能力越强。\n背诵要点：检错只发现、要重传；纠错能定位、直接改。冗余是手段，码距是标尺。","keywords":["比特差错","检错编码","纠错编码","重传","冗余位","码距"],"source":"王道2027版 印刷页 56（PDF p68）","status":"final"},{"id":"net-ch3-3.3-002","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"码距（海明距离）的定义、异或算法与编码集最小码距的求法","level":"l1","title":"码距的定义与异或算法","answer":"【结论】码距（又称海明距离）是指两个码字在对应位上取值不同的比特数量。计算码距的方法是对两个位串做异或运算，结果中 1 的个数即为码距。\n1. 单对码字举例：0110 与 0011 异或得 0101，结果中有两个 1，说明这两个码字有 2 位不同，故码距为 2。\n2. 编码集的码距：一个编码集中任意两个有效码字之间码距的最小值，才是该编码集的码距，取的是最小值而不是最大值。\n3. 举例：编码集 10011、01011、11110、00001 中，11110 与 00001 的码距为 5，但 10011 与 01011 的码距只有 2，取最小值，故该编码集码距为 2。\n4. 求最小值必须两两比较，只要存在一对码字码距很小，整个编码集的检错纠错能力就被它限制住。\n背诵要点：异或后数 1 的个数得码距；编码集的码距取两两之间的最小值，不是最大值。","keywords":["码距","海明距离","异或","编码集","最小码距"],"source":"王道2027版 印刷页 56（PDF p68）","status":"final"},{"id":"net-ch3-3.3-003","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"码距 l、检错位数 d、纠错位数 c 的关系 l=d+c+1 且 d≥c","level":"l1","title":"码距与检错纠错能力的关系","answer":"【结论】码距 l、可检错位数 d、可纠错位数 c 满足 l = d + c + 1，且 d ≥ c。码距越大，能检的位数和能纠的位数都越大，但纠错能力恒不超过检错能力。\n1. 为什么 d ≥ c：能纠错说明能定位错误位置，既然知道出了错就必然能检错，所以纠错能力永远不超过检错能力。\n2. 举例：码距 l = 3 时，该编码最多可检测 2 位错误，或者纠正 1 位错误，两种用法不能同时满打满算。\n3. 两个边界情况 c = 0（只检错不纠错）与 d = c（检错能力等于纠错能力）分别推出后面两条最常用的结论。\n4. 记忆法：码距每多 1，可检错位数多 1；要多纠 1 位错，码距要多吃掉 2 位。\n背诵要点：l = d + c + 1 且 d ≥ c；码距 3 可检 2 位错或纠 1 位错，能纠必能检。","keywords":["码距","检错能力","纠错能力","d 大于等于 c","边界情况"],"source":"王道2027版 印刷页 56（PDF p68）","status":"final"},{"id":"net-ch3-3.3-004","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"检测 d 位错误需码距至少 d+1，纠正 c 位错误需码距至少 2c+1","level":"l2","title":"检错与纠错对码距的最低要求","answer":"【结论】为检测 d 位错误，编码方案的码距至少应为 d + 1；为纠正 c 位错误，编码方案的码距至少应为 2c + 1。\n1. 检错要求的理由：发生 d 位错误后，出错码字必须不可能落成另一个有效码字，否则差错无从发现，所以任意两个有效码字至少相差 d + 1 位。\n2. 纠错要求的理由：发生 c 位错误后，出错码字仍要离原码字最近，接收方才能唯一还原，故两个有效码字至少相距 2c + 1 位，谁也抢不走中间的错码。\n3. 直接推论：码距为 1 的编码无法检测任何错误；码距为 2 的编码最多检测 1 位错误且不能纠错。\n4. 反向套用：已知码距为 4 时，最多检测 3 位错误，最多纠正 1 位错误（对 (4 − 1) / 2 向下取整）。\n背诵要点：检 d 位要 d + 1，纠 c 位要 2c + 1；码距 2 只检 1 位，码距 4 检 3 纠 1。","keywords":["码距","检测 d 位错","纠正 c 位错","2c+1","d+1"],"source":"王道2027版 印刷页 56（PDF p68）","status":"final"},{"id":"net-ch3-3.3-005","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"奇偶校验码的构成、码距为 2、只能检测奇数位错误且不能定位","level":"l1","title":"奇偶校验码的原理与局限","answer":"【结论】奇偶校验码由 n 位数据和 1 位检验位组成，检验位的取值使整个码字中 1 的个数为奇数（奇校验）或偶数（偶校验）。它只能检测奇数位错误，无法发现偶数位错误，也不能定位错误位置。\n1. 举例：7 位数据 1001101 中有 4 个 1（偶数），对应的奇校验码为 10011011（补 1 让 1 的个数变奇数），偶校验码为 10011010（补 0 保持偶数）。\n2. 原理：任何奇数位翻转都会改变 1 的个数的奇偶性，校验规则被破坏故能查出；偶数位同时翻转则奇偶性不变，查不出来。\n3. 码距：任意两个合法码字之间至少有 2 位不同，故奇偶校验码的码距为 2，按码距理论最多检测 1 位错误。\n4. 局限：不能纠错，也不能定位；实际中只要发生奇数位错误就一定能检出，所以常说它能查出所有奇数位错误。\n背诵要点：奇偶校验码距为 2、只查奇数位错、不纠错不定位；偶数位错全部漏检。","keywords":["奇校验","偶校验","检验位","码距为 2","奇数位错误","不能定位"],"source":"王道2027版 印刷页 57（PDF p69）","status":"final"},{"id":"net-ch3-3.3-006","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"CRC 的生成多项式约定、模 2 运算规则与 FCS 生成步骤","level":"l2","title":"CRC 的生成多项式与模 2 除法","answer":"【结论】CRC 把待发送的数据视为一个二进制多项式，与收发双方约定的生成多项式 G(x) 做模 2 除法，把所得余数作为帧检验序列 FCS 附加在原始数据之后发送。\n1. 生成多项式：事先约定 r + 1 阶的 G(x)，对应二进制系数串长 r + 1 位，最高位和最低位必须为 1。例如位串 1101 对应 x^3 + x^2 + 1，阶数 r = 3。\n2. 模 2 运算：加法不进位、减法不借位，加减法都等价于按位异或；乘除法与普通二进制类似，只是每一步的加减按模 2 规则进行。\n3. 发送方三步：在 m 位数据 M 后补 r 个 0（相当于左移 r 位、乘以 2^r）；用 G(x) 位串对扩展串做模 2 除法；取 r 位余数（不足补前导 0）作 FCS，替换末尾那 r 个 0，得到 m + r 位发送帧。\n4. 关键提醒：余数必须保留 r 位，前导 0 不能省略；FCS 的位数等于 G(x) 的最高次幂 r，而不是 G(x) 位串的长度 r + 1。\n背诵要点：补 r 个 0、模 2 除、取 r 位余数；加减皆异或，FCS 位数等于 G(x) 的最高次幂。","keywords":["CRC","生成多项式","模 2 除法","FCS","异或","左移补零"],"source":"王道2027版 印刷页 57（PDF p69）","status":"final"},{"id":"net-ch3-3.3-007","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"CRC 完整算例：M=101001、G=1101、r=3 求余数与发送帧","level":"l1","title":"CRC 计算实例与手算步骤","answer":"【结论】数据 M = 101001（m = 6），生成多项式 G(x) = 1101（r = 3），补 3 个 0 得被除数 101001000，模 2 除后余数为 001，故发送帧为 101001001，共 9 位。\n1. 左移补零：在 M 后加 3 个 0，得 101001000，相当于 2^3 乘以 M。\n2. 模 2 除法：用 1101 从最高位开始逐位对齐做异或，商为 110101，最后剩下 001。\n3. 取余数：余数为 001，必须写足 3 位，不能简写成 1。\n4. 构造发送帧：把原数据 101001 与 FCS 001 拼接，得 101001001，长度 6 + 3 = 9 位。\n5. 手算要点：每步只看当前最高位是否为 1，是则异或除数，否则异或全 0，处理到剩余位数不足除数长度为止。\n背诵要点：101001 补 000 除以 1101 余 001，发送 101001001；余数补足 r 位，别丢前导 0。","keywords":["CRC 算例","101001","1101","余数 001","发送帧 101001001","模 2 除法"],"source":"王道2027版 印刷页 58（PDF p70）","status":"final"},{"id":"net-ch3-3.3-008","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"CRC 接收方校验规则、可检测的差错类型与硬件实现","level":"l2","title":"CRC 的接收方校验与检错能力","answer":"【结论】接收方用同一个 G(x) 对收到的整个帧做模 2 除法：余数为 0 则认为传输无差错并接受该帧，余数非 0 则认为存在差错并丢弃该帧。\n1. 校验依据：若传输无差错，整个帧必能被 G(x) 整除，余数必为 0；出现误码后余数仍为 0 的概率极低，工程上可忽略。\n2. 检错能力：可以检测出所有的单比特错误；带 r 个检验位的多项式编码可以检测到所有长度小于或等于 r 的突发性错误。\n3. 实现特点：生成与校验通常由专用硬件电路完成，速度极快，几乎不会引入额外的延迟。\n4. 语义提醒：被丢弃的帧物理上曾被收到，只因 CRC 校验失败而未被上层接受，不能算作正确接收。\n背诵要点：余数为 0 才收、非 0 就丢；单比特错全检出，长度不超过 r 的突发错全检出。","keywords":["CRC 校验","余数为 0","突发性错误","单比特错误","硬件实现","丢弃帧"],"source":"王道2027版 印刷页 58（PDF p70）","status":"final"},{"id":"net-ch3-3.3-009","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"海明码冗余位公式 2^k ≥ n+k+1 与检验位分布在 2 的幂位置","level":"l1","title":"海明码的冗余位公式与检验位分布","answer":"【结论】设信息位 n 位、检验位 k 位，须满足 2^k ≥ n + k + 1。因为 k 个检验位能表示 2^k 种状态，要覆盖 n + k 个单比特出错位置，再加 1 种表示无错状态。\n1. 定总位数：n = 4 时试 k = 3，2^3 = 8 ≥ 4 + 3 + 1 = 8 成立，故取 k = 3，海明码共 n + k = 7 位。\n2. 检验位位置：检验位 P_i 放在海明位号为 2^(i−1) 的位置上，即第 1、2、4、8 位，其余各位按原顺序放信息位。\n3. 本例分布：海明位号从高到低 H7 到 H1 依次为 D4 D3 D2 P3 D1 P2 P1，信息位 1010 对应 D4D3D2D1。\n4. 常考反向题：10 位信息位需满足 2^k ≥ 10 + k + 1，k = 4 时 16 ≥ 15 成立，故需增加 4 位冗余信息位。\n背诵要点：2^k ≥ n + k + 1；检验位坐 1、2、4、8 号位，其余位置放信息位。","keywords":["海明码","冗余位公式","2 的幂位置","检验位","信息位","单比特纠错"],"source":"王道2027版 印刷页 58（PDF p70）","status":"final"},{"id":"net-ch3-3.3-010","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"海明码的分组校验关系、检验位取值与由 S 值定位纠错的过程","level":"l2","title":"海明码的分组校验与纠错过程","answer":"【结论】每个信息位由多个检验位共同校验，规则是信息位所在位号等于其参与的所有检验位位号之和；检验位本身不再被检验。出错时各检验组的校验结果拼成的数就是出错位的位号。\n1. 分组方法：把位号写成二进制，为 1 的各位所对应的检验位就校验它。如 H3 由 P2 P1 校验，H5 由 P3 P1 校验，H6 由 P3 P2 校验，H7 由 P3 P2 P1 校验。\n2. 检验位取值：每个检验位取其校验组内所有位（含信息位）的异或，相当于偶校验结果。信息位 1010 时算得 P1 = 0、P2 = 1、P3 = 0，海明码为 1010010。\n3. 纠错过程：接收方按同样分组重算 k 个校验方程，得到 S3 S2 S1。若为 000 表示无错；否则该二进制数就是出错位的位号，把该位取反即完成纠错。\n4. 能力边界：海明码用少量冗余位实现单比特错误的自动定位与纠正，即纠正 1 位错，不能纠正多位错。\n背诵要点：位号等于参与校验的检验位位号之和；S 值非 0 就是出错位号，取反即纠错。","keywords":["海明码","分组校验","校验方程","S 值","错误位号","取反纠错"],"source":"王道2027版 印刷页 59（PDF p71）","status":"final"},{"id":"net-ch3-3.3-011","chapter":"第3章 数据链路层","subject":"net","section":"3.3 差错控制","topic":"本节真题套路：码距换算、CRC 手算、海明码位数三处易错点","level":"l3","title":"差错控制易错结论与真题套路","answer":"【结论】本节真题集中在三处：码距与检错纠错位数的换算、CRC 的模 2 除法手算、海明码的冗余位数。三处都有固定套路，但都容易在细节上失分。\n1. 码距题：先求编码集的最小码距 d_min，再套用可检测不超过 d_min − 1 位错误、可纠正不超过 (d_min − 1) / 2 向下取整位错误。如 d_min = 4 时可检 3 位错、可纠 1 位错。\n2. CRC 题：先由 G(x) 定出 r（最高次幂），被除数为数据后补 r 个 0，余数取 r 位。判断题只需把收到的整串除以 G(x)，余数为 0 即未出错。\n3. 海明码题：直接用 2^k ≥ n + k + 1 从小到大试 k，第一个成立的就是答案，不要凭感觉估。\n4. 常见陷阱：把奇偶校验码的码距记成 1（实为 2）；把 CRC 余数位数记成 G(x) 位串长度（实为最高次幂）；误以为海明码能纠正多位错。\n背诵要点：码距 4 检 3 纠 1；CRC 补 r 个 0 取 r 位余数；海明码从小到大试 2^k ≥ n + k + 1。","keywords":["码距换算","CRC 手算","海明码位数","真题","易错点"],"source":"王道2027版 印刷页 60（PDF p72）","status":"final"},{"id":"net-ch3-3.4-001","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"流量控制的定义与数据链路层、传输层在控制范围和手段上的区别","level":"l1","title":"流量控制的含义与两层差别","answer":"【结论】流量控制是指由接收方控制发送方的发送速率，确保接收方有足够的缓存空间来接收每一个帧。数据链路层和传输层都具备流量控制功能，都采用滑动窗口的思想，但控制范围与控制手段不同。\n1. 控制范围：数据链路层控制的是相邻节点之间的流量；传输层控制的是端到端的流量。\n2. 控制手段：数据链路层在接收方无法接收时不返回确认帧；传输层在确认报文段中携带窗口字段值，动态调整发送方的发送窗口大小。\n3. 常见方法：停止-等待协议和滑动窗口协议，前者最简单但效率最低，后者是主流做法。\n4. 内在关系：在数据链路层中流量控制机制与可靠传输机制紧密交织，滑动窗口既是流量控制手段，也是可靠传输的基础。\n背诵要点：链路层管相邻节点、靠不返回确认来压速；传输层管端到端、靠窗口字段动态调窗。","keywords":["流量控制","相邻节点","端到端","不返回确认","窗口字段","滑动窗口"],"source":"王道2027版 印刷页 61-62（PDF p73-74）","status":"final"},{"id":"net-ch3-3.4-002","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"停止-等待流量控制的基本原理、效率特点与适用场景","level":"l1","title":"停止-等待流量控制的基本原理","answer":"【结论】停止-等待流量控制是最简单的流量控制方法：发送方每次仅允许发送一个帧，接收方每成功接收一个帧后返回确认帧表示可以接收下一帧，发送方只有收到确认帧后才能发送后续帧。\n1. 工作过程：发送方发一帧后停下等待；接收方收到后回一个确认；发送方收到确认再发下一帧；若未收到确认帧，发送方将一直等待。\n2. 效率：发送方发完一帧必须等待确认，信道大量时间空闲，信道利用率较低，传输效率不高。\n3. 适用：实现简单，适合往返时延较小、数据量不大的场合；RTT 越大、速率越高，效率越差。\n4. 与可靠传输的关系：它既是最基本的流量控制方法，也是停止-等待 ARQ 协议的基础，两者窗口大小同为 1。\n背诵要点：一发一等、一确认一前进；简单但利用率低，RTT 越大越吃亏。","keywords":["停止-等待","确认帧","单帧","信道利用率低","实现简单"],"source":"王道2027版 印刷页 62（PDF p74）","status":"final"},{"id":"net-ch3-3.4-003","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"滑动窗口机制：发送窗口与接收窗口的含义及窗口滑动规则","level":"l1","title":"滑动窗口的发送窗口与接收窗口","answer":"【结论】滑动窗口在任意时刻让发送方维持一组连续的、允许发送的帧序号，称为发送窗口；接收方维持一组连续的、允许接收的帧序号，称为接收窗口。\n1. 发送窗口的作用：决定在未收到对方确认的情况下，发送方最多还能发送多少帧以及哪些帧，窗口外的帧不允许发送。\n2. 接收窗口的作用：控制接收方可以接收哪些帧，序号落在接收窗口之外的帧一律丢弃。\n3. 滑动规则：发送方每收到一个按序到达的确认帧，发送窗口向前滑动一个位置，从而允许发送一个新帧；接收方每收到一个序号落在接收窗口内的帧，便接收该帧、窗口前移一格并返回确认。\n4. 暂停条件：窗口内所有帧均已发送但尚未收到确认时，发送方暂停发送，等确认到达再继续。\n背诵要点：发送窗口管能发多少、能发哪些；接收窗口管能收哪些，窗外一律丢弃。","keywords":["发送窗口","接收窗口","帧序号","窗口滑动","丢弃窗外帧"],"source":"王道2027版 印刷页 62（PDF p74）","status":"final"},{"id":"net-ch3-3.4-004","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"滑动窗口的四条重要特性与三种 ARQ 协议的窗口大小对比","level":"l2","title":"滑动窗口特性与三协议窗口对比","answer":"【结论】从滑动窗口的角度看，三种协议只差在窗口大小：停止-等待协议 W_T = 1 且 W_R = 1；后退 N 帧协议 W_T \u003e 1 且 W_R = 1；选择重传协议 W_T \u003e 1 且 W_R \u003e 1。\n1. 滑动依赖确认：只有发送方收到对某帧的确认，发送窗口才能向前滑动；接收方只有成功接收到期望帧，才发送确认并滑动接收窗口。\n2. 序号空间约束：采用 n 比特对帧编号（n ≥ 2）时，后两种滑动窗口协议还须满足 W_T + W_R ≤ 2^n。\n3. 有序性：接收窗口大小为 1 时，只有收到该帧才允许接收下一帧，故能保证帧的有序接收；接收窗口大于 1 时允许先缓存失序帧。\n4. 窗口固定：数据链路层的滑动窗口协议中，窗口大小在传输过程中固定不变，这一点与传输层不同。\n背诵要点：停止-等待 1 和 1，GBN 大于 1 和 1，SR 两个都大于 1；W_T + W_R ≤ 2^n，链路层窗口固定。","keywords":["发送窗口","接收窗口","序号位数","有序接收","窗口固定","三种协议对比"],"source":"王道2027版 印刷页 63（PDF p75）","status":"final"},{"id":"net-ch3-3.4-005","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"可靠传输的确认与超时重传机制、ARQ 的含义与三种类型","level":"l1","title":"确认、超时重传与 ARQ 的分类","answer":"【结论】可靠传输是指发送方发出的数据能够被接收方正确且完整地接收，通常采用确认和超时重传两种机制实现，二者结合的协议称为自动重传请求 ARQ。\n1. 确认：接收方每成功接收到一个数据帧，就向发送方返回一个确认帧，表明该数据帧已被正确接收。\n2. 超时重传：发送方发送一个数据帧后启动计时器，若规定时间内未收到对应确认帧，则认为该帧可能丢失或出错，自动重传直至收到确认为止。\n3. ARQ 的含义：重传由发送方自主触发，无须接收方显式请求重传；因此数据帧和确认帧都必须编号，才能识别确认对应哪个数据帧、哪些帧尚未被确认。\n4. 三种类型：停止-等待协议、后退 N 帧协议、选择重传协议，其基本原理不仅适用于数据链路层，也可用于更高层的可靠传输设计。\n背诵要点：确认加超时重传就是 ARQ；发送方自主重传，所以数据帧和确认帧都要编号。","keywords":["可靠传输","确认 ACK","超时重传","ARQ","帧编号","计时器"],"source":"王道2027版 印刷页 63（PDF p75）","status":"final"},{"id":"net-ch3-3.4-006","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"有线网络与无线网络是否需要数据链路层提供可靠传输服务","level":"l3","title":"链路层是否需要可靠传输","answer":"【结论】是否在数据链路层提供可靠传输服务取决于链路特性：有线网络一般不要求，无线网络则必须提供。\n1. 有线网络：误码率较低，为降低开销一般不要求数据链路层提供可靠传输服务；即使出现少量误码，也可由上层（如传输层）通过端到端机制处理。\n2. 无线网络：链路易受干扰、误码率较高，要求数据链路层必须向上层提供可靠传输服务，避免大量错误帧传至上层，从而提升整体效率。\n3. 判断依据：看误码率高低以及上层是否已有端到端可靠机制，而不是看协议新旧或传输速率高低。\n4. 考点形式：常在选择题中把数据链路层一定提供可靠传输设为错误选项。\n背诵要点：有线可省、无线必需；判据是误码率高低与上层是否兜底。","keywords":["可靠传输服务","有线网络","无线网络","误码率","端到端","上层处理"],"source":"王道2027版 印刷页 63（PDF p75）","status":"final"},{"id":"net-ch3-3.4-007","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"停止-等待协议的四种差错情形、1 比特序号与收发双方缓冲区设置","level":"l2","title":"停止-等待协议的差错处理与帧编号","answer":"【结论】停止-等待协议的发送窗口和接收窗口大小均为 1，发送方每发一帧必须等到确认才能发下一帧。实际传输中要处理数据帧出错或丢失、确认帧出错或丢失两类差错，共四种情形。\n1. 数据帧出错：接收方检测到差错直接丢弃该帧；发送方计时器超时未收到确认，自动重传该帧。\n2. 数据帧丢失：接收方收不到任何信息，同样由发送方超时重传，如此重复直至该帧被正确接收并返回确认。\n3. 确认帧出错或丢失：接收方虽已正确收帧，但发送方收不到确认会超时重传；接收方再次收到重复帧时丢弃该重复帧，并重新发送对应的确认帧。\n4. 序号空间：只要保证相邻两帧序号不同即可区分新帧与重传帧，故 1 比特序号空间就足够，数据帧交替使用 0 和 1，确认帧记为 ACK0 和 ACK1。\n5. 缓冲区：发送方必须在发送缓存中保留该帧副本以便重传，收到确认后才清除；接收方需记录最近成功接收的帧序号，以判断新到帧是否重复。\n背诵要点：数据帧错丢靠超时重传，确认帧错丢靠重发确认加重传；1 比特序号足够，收发双方都要缓存。","keywords":["停止-等待","超时重传","重复帧","1 比特序号","ACK0","发送缓存"],"source":"王道2027版 印刷页 64（PDF p76）","status":"final"},{"id":"net-ch3-3.4-008","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"后退 N 帧协议的工作原理、按序接收前提与出错重传全部","level":"l1","title":"后退 N 帧协议的工作原理","answer":"【结论】后退 N 帧协议允许发送方在未收到确认帧时连续发送多个序号落在发送窗口内的数据帧；一旦某帧超时未确认，发送方不仅重传该帧，还要重传其后所有已发送但未被确认的帧，这就是后退 N 帧的含义。\n1. 前提：接收方仅按序接收数据帧，任何失序到达的帧即使正确也被丢弃，因此接收窗口固定为 1。\n2. 计时器：通常只为最早未确认的帧维护一个超时计时器，该帧被确认后计时器移至下一个未确认帧。\n3. 出错处理：某帧出错或丢失后，其后正确到达的帧全部被丢弃，超时后从出错帧开始重传窗口内所有未被确认的帧。\n4. 优缺点：连续发送多个帧显著提高信道利用率；但出错时要重传大量已正确到达的帧，造成带宽浪费，误码率较高时性能甚至可能不如停止-等待协议。\n背诵要点：连续发、按序收；一帧出错其后全部重传，接收窗口恒为 1。","keywords":["GBN","后退 N 帧","按序接收","接收窗口为 1","超时计时器","重传"],"source":"王道2027版 印刷页 64（PDF p76）","status":"final"},{"id":"net-ch3-3.4-009","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"GBN 的累积确认机制：ACKn 的含义、减少开销与重传起点判断","level":"l2","title":"GBN 的累积确认机制","answer":"【结论】GBN 采用累积确认：接收方无须对每个正确接收的帧立即返回确认，而可以在连续收到多个正确帧后，仅对其中序号最大的帧发送一个确认。\n1. ACK n 的含义：接收方已正确收到 n 号帧及之前的所有帧，下一次期望接收的是 n + 1 号帧（若序号回绕则可能是 0 号帧）。\n2. 好处与代价：大幅减少确认帧数量、降低开销；代价是确认粒度粗，出错时发送方无法精确知道哪些帧已经到达。\n3. 防止确认丢失：接收方可以重复发送最近一次的确认（如 ACK1），促使发送方尽快感知当前的接收状态。\n4. 重传判断：若只收到对 1、2、4 号帧的确认，累积确认到 4 号为止，发送方只需重传 5 号及其后的帧。\n背诵要点：ACK n 表示 n 号及以前全收到、下次等 n + 1；确认可合并，重传从最早未确认帧开始。","keywords":["累积确认","ACKn","期望帧","确认丢失","重传起点"],"source":"王道2027版 印刷页 65（PDF p77）","status":"final"},{"id":"net-ch3-3.4-010","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"GBN 发送窗口上限 1 \u003c W_T ≤ 2^n − 1 及其由来与反向求解","level":"l2","title":"GBN 的发送窗口上限","answer":"【结论】若采用 n 比特对帧编号，GBN 的发送窗口应满足 1 \u003c W_T ≤ 2^n − 1，接收窗口固定为 W_R = 1。\n1. 上限由来：若 W_T \u003e 2^n − 1，窗口滑动后新旧帧的序号会重叠，接收方无法区分新发送的帧与因序号回绕而重复出现的旧帧。\n2. 反向求序号位：已知 W_T 时由 2^n − 1 ≥ W_T 求最小的 n。如 W_T = 32，需 2^n ≥ 33，故 n 至少为 6。\n3. 由确认帧反推：若收到 5 号帧确认后还能再发 6 个帧，说明发送窗口共 7 个，由 2^n − 1 = 7 得 n = 3。\n4. 与 SR 的区别：GBN 因接收窗口为 1，发送窗口可以占到 2^n − 1；SR 的接收窗口大于 1，发送窗口只能到 2^(n−1)。\n背诵要点：GBN 发送窗口最大 2^n − 1，接收窗口恒为 1；窗口取满时序号位不能再少。","keywords":["GBN 窗口","2^n−1","序号回绕","序号位数","接收窗口为 1"],"source":"王道2027版 印刷页 65（PDF p77）","status":"final"},{"id":"net-ch3-3.4-011","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"选择重传协议的工作原理：逐帧确认、缓存失序帧、独立计时与 NAK","level":"l1","title":"选择重传协议的工作原理","answer":"【结论】选择重传协议设法仅重传出错或超时的数据帧，而不影响其他已正确传输的帧；为此接收方必须能暂存失序但正确到达、且序号仍落在接收窗口内的帧，待缺失序号的帧收齐后再按序交付上层。\n1. 逐帧确认：为实现只重传出错帧，接收方不能再采用累积确认，需对每个正确接收的数据帧逐一发送确认。\n2. 独立计时：发送方为每个未确认的帧维护独立的计时器，某帧超时只重传该帧，而不是其后全部。\n3. 缓存要求：接收方需设置足够大的帧缓冲区，其数量等于接收窗口大小，用于暂存正确的失序帧；若收到重复数据帧（说明确认帧丢失），则丢弃该帧并重传对应的确认帧。\n4. 否定确认：接收方检测到某帧出错可立即发送否定帧 NAK，请求重传 NAK 指定的帧，从而避免等待超时。\n背诵要点：只重传出错帧、逐帧确认、每帧独立计时、接收方缓存失序帧；出错可发 NAK 提前重传。","keywords":["选择重传","SR","逐帧确认","失序帧缓存","独立计时器","NAK"],"source":"王道2027版 印刷页 65（PDF p77）","status":"final"},{"id":"net-ch3-3.4-012","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"SR 的窗口约束 W_R+W_T ≤ 2^n、W_R ≤ W_T 与 W_R ≤ 2^(n−1)","level":"l2","title":"SR 的窗口约束与最大值","answer":"【结论】SR 的接收窗口和发送窗口均大于 1，采用 n 比特编号时须同时满足 W_R + W_T ≤ 2^n 和 W_R ≤ W_T，由此可推出 W_R ≤ 2^(n−1)。\n1. 第一个条件：W_R + W_T ≤ 2^n。不满足时接收窗口向前滑动后部分确认帧丢失，发送方可能重传旧序号的帧，而序号空间不足会使重传帧的序号与新帧重叠，接收方无法区分新帧与旧帧。\n2. 第二个条件：W_R ≤ W_T。若接收窗口大于发送窗口，接收窗口中超出发送窗口范围的部分永远无法被填满，造成资源浪费。\n3. 常用取值：实际应用中常取 W_R = W_T = 2^(n−1)，以充分利用序号空间。\n4. 典型数值：3 比特编号时接收窗口最大为 4；5 比特编号时接收窗口最大为 16；4 比特编号且 W_R = 7 时，由 W_R + W_T ≤ 16 得发送窗口最大为 9。\n背诵要点：W_R + W_T ≤ 2^n 且 W_R ≤ W_T，故单个窗口最多 2^(n−1)；常用两者都取一半序号空间。","keywords":["SR 窗口","W_R+W_T≤2^n","2^(n−1)","序号空间","接收窗口最大值"],"source":"王道2027版 印刷页 66（PDF p78）","status":"final"},{"id":"net-ch3-3.4-013","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"停止-等待协议的信道利用率公式 U=T_D/(T_D+RTT+T_A) 与算例","level":"l1","title":"停止-等待协议的信道利用率","answer":"【结论】信道利用率是指发送方在一个发送周期内有效发送数据的时间与整个发送周期之比。停止-等待协议的发送周期为 T_D + RTT + T_A，故信道利用率 U = T_D / (T_D + RTT + T_A)。\n1. 符号含义：T_D 是数据分组的发送时延（等于分组长度除以数据传输速率），T_A 是确认分组的发送时延（通常可忽略），RTT 是往返时延。\n2. 计算举例：RTT = 20 ms、分组长度 1200 比特、速率 1 Mb/s 时，T_D = 1.2 ms，U 约为 5.66%；速率提高到 10 Mb/s 后 T_D 变小，U 只剩约 0.596%。\n3. 结论：RTT 远大于 T_D 时停止-等待协议的信道利用率非常低；速率越高、距离越远，利用率越低。\n4. 变形求帧长：由 U 反解 T_D 再乘数据传输速率即得帧长，如 U = 80%、速率 4 kb/s、单向传播时延 30 ms 时解得帧长至少 960 比特。\n背诵要点：U = T_D / (T_D + RTT + T_A)，永远小于 1；RTT 大、速率高时利用率最惨。","keywords":["信道利用率","发送时延","RTT","确认帧时延","发送周期","帧长反解"],"source":"王道2027版 印刷页 66（PDF p78）","status":"final"},{"id":"net-ch3-3.4-014","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"连续 ARQ 协议的信道利用率分段公式与三种协议的效率对比","level":"l2","title":"连续 ARQ 的信道利用率与三协议对比","answer":"【结论】连续 ARQ 协议采用流水线传输，设发送窗口大小为 N：若 N·T_D \u003c T_D + RTT + T_A，则 U = N·T_D / (T_D + RTT + T_A)；若 N·T_D ≥ T_D + RTT + T_A，则信道被完全利用，U = 1。\n1. 第一种情况的含义：一个发送周期内发得完 N 个分组，信道无法被完全占满，窗口越大利用率越高，呈线性增长。\n2. 第二种情况的含义：一个周期内发不完或刚好发完 N 个分组，只要无差错发生，发送方可持续不间断发送，利用率达到 100%。\n3. 三协议对比：利用率由发送窗口大小决定，相同序号位数下停止-等待窗口为 1、SR 窗口为 2^(n−1)、GBN 窗口为 2^n − 1，故 2023 真题结论为 U1 ≤ U3 ≤ U2（U1、U2、U3 依次对应停止-等待、GBN、SR）。\n4. 例外情形：误码率较高时，GBN 因大量重传，实际利用率甚至可能低于停止-等待协议。\n5. 派生公式：信道平均（实际）数据传输速率 = 信道利用率 × 信道带宽，也等于发送周期内发送的数据量除以发送周期。\n背诵要点：N·T_D 够大就 U = 1，不够就按比例算；窗口越大利用率越高，故 U1 ≤ U3 ≤ U2，但高误码时 GBN 可能垫底。","keywords":["连续 ARQ","流水线传输","发送窗口 N","U=1","三协议对比","实际数据传输速率"],"source":"王道2027版 印刷页 66-67（PDF p78-79）","status":"final"},{"id":"net-ch3-3.4-015","chapter":"第3章 数据链路层","subject":"net","section":"3.4 流量控制与可靠传输机制","topic":"本节典型计算题套路：由利用率反解帧长或窗口、由窗口反解序号位数","level":"l3","title":"滑动窗口与信道利用率的解题套路","answer":"【结论】本节计算题只有三类问法：已知利用率求帧长或窗口、已知窗口求最少序号位数、求实际数据传输速率。三类都可以从信道利用率公式和窗口上限公式反推。\n1. 求帧长或窗口：先写出 U 的表达式，代入已知量，令 U 等于题目给定的百分比，解出 T_D 或 N，再由 T_D 求帧长、由 N 求序号位数。\n2. 求最少序号位数：先算出为使信道利用率最高所需的窗口大小，再由 GBN 的 W_T ≤ 2^n − 1 或 SR 的 W_R ≤ 2^(n−1) 反解 n，取满足条件的最小整数。\n3. 求实际速率：先算信道利用率，再乘以信道带宽；或直接用发送周期内发出的数据量除以发送周期。\n4. 易错点：确认帧长度不能忽略时要把它算进发送周期；RTT 是往返时延，题目给单向传播时延时须乘 2；窗口与序号位数的公式要区分 GBN 与 SR。\n背诵要点：利用率公式反解帧长，窗口上限公式反解位数；单向时延乘 2 才是 RTT，确认帧长别漏。","keywords":["计算题套路","反解帧长","序号位数","RTT 乘 2","确认帧长","实际速率"],"source":"王道2027版 印刷页 67（PDF p79）","status":"final"},{"id":"net-ch3-3.5-001","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"介质访问控制在数据链路层中的任务定位，以及信道划分、随机访问、轮询访问三大类方法的划分依据","level":"l1","title":"介质访问控制的任务与分类","answer":"【结论】介质访问控制的主要任务是协调共享同一信道的各节点的传输行为，以避免彼此之间的信号冲突。\n1. 归属：用于决定广播信道资源分配的协议属于数据链路层的介质访问控制（MAC）子层。\n2. 信道划分介质访问控制：采用静态划分信道的方式，通过分时、分频、分码把一条广播信道在逻辑上划分为若干互不干扰的子信道。\n3. 随机访问介质访问控制：属于动态分配信道，不设集中控制，各站随机发送、通过争用获得信道使用权。\n4. 轮询访问介质访问控制：也属于动态分配信道，由集中控制的监控站循环轮询各节点来决定信道的分配。\n5. 三类的本质区别：静态划分事先把信道分好，后两类按需动态占用；随机访问可能冲突，轮询访问不会冲突。\n背诵要点：记住一静两动——信道划分是静态分配，随机访问和轮询访问是动态分配；三类方法都是 MAC 子层的事，与物理层无关。","keywords":["介质访问控制","MAC子层","广播信道","信道划分","随机访问","轮询访问"],"source":"王道2027版 印刷页 77-78（PDF p89-90）","status":"final"},{"id":"net-ch3-3.5-002","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"时分复用把信道传输时间划分为等长时间片构成 TDM 帧，各用户周期性占用固定时隙，空闲时隙仍被保留","level":"l1","title":"时分复用 TDM","answer":"【结论】时分复用把信道的传输时间划分为等长的时间片，构成一个 TDM 帧，每个用户在每个 TDM 帧中占用固定序号的时隙。\n1. 时隙周期性出现，周期就是 TDM 帧的长度；所有用户在不同时间共享相同的信道资源。\n2. 易错点：TDM 帧是一段固定长度的时间间隔，与数据链路层的帧概念完全不同，不能混为一谈。\n3. 观察角度：从某一时刻看，信道上传送的是某对用户之间的信号；从一段时间看，则是按时间分割的复用信号。\n4. 缺点：按固定次序分配时隙，某用户暂无数据发送时其分配到的时隙仍被保留，无法被其他用户利用，因此信道利用率较低。\n5. 共享性质：所有用户在同一信道上轮流占用时间，属于共享空间但不共享时间。\n背诵要点：TDM 帧是时间间隔不是数据帧；TDM 的毛病是空闲时隙也占着，这正是统计时分复用要解决的问题。","keywords":["时分复用","TDM帧","时隙","信道利用率","共享空间"],"source":"王道2027版 印刷页 78-79（PDF p90-91）","status":"final"},{"id":"net-ch3-3.5-003","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"统计时分复用按需动态分配时隙以提高线路利用率，以及它与 TDM 在 6000b/s 线路上的定量对比","level":"l3","title":"统计时分复用 STDM","answer":"【结论】统计时分复用也称异步时分复用，是对 TDM 的改进，它不固定分配时隙，而是按需动态分配，仅当用户有数据要发送时才为其分配 STDM 帧中的时隙。\n1. 效果：显著提高线路利用率，因为空闲用户不再白白占用时隙。\n2. 定量例子：设线路数据速率为 6000b/s，3 个用户的平均速率均为 2000b/s。采用 TDM 时每个用户固定分配 2000b/s 的带宽；采用 STDM 时各用户可动态共享全部带宽。\n3. 突发能力：在 STDM 下，当其他用户无数据发送时，某一用户可利用接近线路总速率即 6000b/s 的带宽进行突发传输。\n4. 本质差别：TDM 是固定分配，STDM 是按需动态分配，后者把空闲时隙利用了起来。\n背诵要点：STDM 与 TDM 的分水岭是时隙是否固定——固定分配是 TDM，按需分配是 STDM；记例子里的 6000b/s 与 2000b/s 这组数。","keywords":["统计时分复用","STDM","异步时分复用","动态分配","线路利用率"],"source":"王道2027版 印刷页 79（PDF p91）","status":"final"},{"id":"net-ch3-3.5-004","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"频分复用把总频带划分为子频带供各对用户同时使用，波分复用是光的频分复用，两者共享时间不共享空间","level":"l3","title":"频分复用 FDM 与波分复用 WDM","answer":"【结论】频分复用把信道的总频带划分为多个子频带，每个子频带作为一个独立子信道供一对用户通信使用，所有用户在同一时间占用不同的频带资源。\n1. 带宽约束：各子信道分配的带宽可以不同，但总和不得超过信道的总带宽。\n2. 隔离频带：为防止相邻子信道之间相互干扰，实际应用中通常还需在它们之间设置隔离频带。\n3. 优点：能充分利用传输介质的带宽，系统效率较高，且实现相对简单。\n4. 波分复用即光的频分复用，在一根光纤中同时传输多种不同波长的光信号，因波长不同各路光信号互不干扰，接收端通过光分用器将各波长分离出来。\n5. 波分复用的优势来自光波位于电磁频谱的高频段，具有极大的带宽，因此可支持多路的波分复用。\n6. 共享性质：频分复用与波分复用都是所有用户同时占用不同频带，属于共享时间但不共享空间。\n背诵要点：FDM 记住带宽总和不超过总带宽、相邻子信道要留隔离频带；WDM 就是光的 FDM，别把它当成另一种独立技术。","keywords":["频分复用","FDM","波分复用","WDM","隔离频带","光分用器"],"source":"王道2027版 印刷页 79（PDF p91）","status":"final"},{"id":"net-ch3-3.5-005","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"码分复用用不同编码区分各路信号，每比特划分为 m 个码片，发送 1 发码片序列、发送 0 发反码","level":"l1","title":"码分复用 CDM 的基本思想","answer":"【结论】码分复用是一种采用不同编码来区分各路原始信号的复用方式，与 FDM 和 TDM 不同，它既共享信道的频率，又共享时间。\n1. 常用名称是码分多址即 CDMA，其原理是把每个比特时间进一步划分为 m 个短的时间槽，称为码片。\n2. 码片数 m 的取值：通常 m 的值为 64 或 128；教材为简化说明在例题中设 m 等于 8。\n3. 每个站点指派一个唯一的 m 位码片序列。\n4. 发送规则：发送 1 时站点发送其码片序列；发送 0 时站点发送该码片序列的反码。\n5. 多站同时发送时各路数据在信道中线性相加；为了从信道中分离出各路信号，各个站点的码片序列应相互正交。\n6. 优点：频谱利用率高、抗干扰能力强、保密性好、语音质量好，广泛应用于无线通信系统特别是移动通信系统。\n背诵要点：CDM 的三要点要记牢——m 通常 64 或 128、发 1 发码片序列、发 0 发反码；它既共享频率又共享时间，这是与 FDM、TDM 的根本差别。","keywords":["码分复用","CDM","CDMA","码片","正交","反码"],"source":"王道2027版 印刷页 79（PDF p91）","status":"final"},{"id":"net-ch3-3.5-006","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"码片向量之间规格化内积的三条性质，是 CDMA 从叠加信号中分离各路数据的数学基础","level":"l1","title":"规格化内积的三条性质","answer":"【结论】规格化内积是指两个向量计算内积之后再除以向量的分量个数，它是 CDMA 能够从叠加信号中分离出各路数据的数学基础。\n1. 不同站点的码片序列相互正交，即两个不同码片向量的规格化内积为 0。\n2. 任何站点的码片向量和该码片向量自身的规格化内积都是 1。\n3. 任何站点的码片向量和该码片向量反码的规格化内积都是 -1。\n4. 三条性质合起来的效果：用某站的码片向量去乘叠加信号，其他站的信号因为正交而被过滤为 0，只剩该站自己的分量。\n5. 判断依据：规格化内积结果为 1 表示该站发送的是比特 1，结果为 -1 表示该站发送的是比特 0。\n背诵要点：三条性质对应三个数——正交得 0、自身得 1、反码得 -1；解题时一律先除以分量个数 m 再下结论，忘了除以 m 是常见丢分点。","keywords":["规格化内积","正交","码片向量","CDMA","数据分离"],"source":"王道2027版 印刷页 79-80（PDF p91-92）","status":"final"},{"id":"net-ch3-3.5-007","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"用 A、B 两站的码片向量叠加与规格化内积运算，演示 CDMA 如何恢复各路数据","level":"l1","title":"CDMA 的数据恢复计算","answer":"【结论】CDMA 的恢复过程是各站信号在公共信道上线性相加得到叠加向量，接收站用目标站的码片向量与叠加向量做规格化内积，即可还原该站发送的比特。\n1. 编码准备：A 站码片序列为 00011011，把 0 写为 -1、1 写为 +1，得到码片向量 S 为 (-1 -1 -1 +1 +1 -1 +1 +1)。\n2. A 站发 1 就发送 S 本身；A 站发 0 就发送 S 的反码，即 (+1 +1 +1 -1 -1 +1 -1 -1)。\n3. 设 B 站码片向量 T 为 (-1 -1 +1 -1 +1 +1 +1 -1)，B 站发送 0，则发送 T 的反码 (+1 +1 -1 +1 -1 -1 -1 +1)。\n4. 叠加：两个向量在公共信道上线性相加，得到 S+T 为 (0 0 -2 2 0 -2 0 2)。\n5. 恢复 A 站数据：计算 S 与 S+T 的规格化内积，结果为 1，因此 A 站发出的数据是 1。\n6. 恢复 B 站数据：计算 T 与 S+T 的规格化内积，结果为 -1，说明收到的是 T 的反码向量，因此 B 站发出的数据是 0。\n背诵要点：做题顺序是写向量、判正负、相加、内积、定 0 或 1；内积结果为 1 判 1、为 -1 判 0，千万别把 -1 当成数据 1。","keywords":["CDMA","码片序列","规格化内积","线性相加","数据恢复"],"source":"王道2027版 印刷页 80（PDF p92）","status":"final"},{"id":"net-ch3-3.5-008","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"用黄豆绿豆运送到 C 站的类比，区分 FDM、TDM、CDM 在共享空间与共享时间上的差别","level":"l3","title":"复用的共享空间与共享时间类比","answer":"【结论】三种复用方式对共享空间和共享时间的取舍不同，可用 A 站送黄豆、B 站送绿豆到 C 站的公共道路类比来记忆。\n1. 频分复用：公共道路划分为两个车道分别供两类车通行，两类车可以同时通行但都只使用了一半道路，因此频分复用共享时间而不共享空间。\n2. 波分复用的性质与频分复用类似。\n3. 时分复用：先让 A 站到 C 站的车走一趟，再让 B 站到 C 站的车走一趟，两类车交替使用道路，因此时分复用共享空间但不共享时间。\n4. 码分复用：黄豆与绿豆放在同一辆车上运送，到达 C 站后由 C 站负责把车上的黄豆和绿豆分开，因此码分复用既共享空间又共享时间。\n5. 对照记：信道划分机制下节点通信要么共享时间、要么共享空间、要么两者兼有；而随机访问机制发送时既不预留时间也不独占频段。\n背诵要点：FDM 是分车道同时走所以共享时间不共享空间；TDM 是轮流走所以共享空间不共享时间；CDM 是装同一辆车所以两者都共享。","keywords":["共享空间","共享时间","频分复用","时分复用","码分复用","类比"],"source":"王道2027版 印刷页 80（PDF p92）","status":"final"},{"id":"net-ch3-3.5-009","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"随机访问不采用集中控制，各站随机发送、通过争用获得信道使用权，冲突时全部失败并重传","level":"l1","title":"随机访问的核心思想","answer":"【结论】随机访问协议的核心思想是通过争用获得信道使用权，胜者方可发送数据。\n1. 控制方式：不采用集中控制方式来协调各站点的发送次序，允许所有用户根据自身意愿随机发送信息，并可占用信道的全部带宽。\n2. 冲突的产生：在总线形网络中，当两个或多个用户同时发送信息时就会产生冲突，也称碰撞，导致所有冲突用户的发送均以失败告终。\n3. 冲突的解决：每个用户需按照特定规则反复重传帧，直至该帧无冲突地成功传输。\n4. 实质：随机介质访问控制实质上是将广播信道动态地转化为点到点信道的机制。\n5. 代价：冲突不可避免，只能通过协议设计降低冲突概率与冲突带来的损失。\n背诵要点：随机访问的四个关键词是无集中控制、随机发送、占用全部带宽、争用取胜；它与信道划分的根本差别是动态占用而非事先分配。","keywords":["随机访问","冲突","碰撞","争用","点到点信道"],"source":"王道2027版 印刷页 80-81（PDF p92-93）","status":"final"},{"id":"net-ch3-3.5-010","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"纯 ALOHA 想发就发、冲突概率高，时隙 ALOHA 用全网同步时隙约束发送时刻以降低冲突","level":"l2","title":"纯 ALOHA 与时隙 ALOHA","answer":"【结论】纯 ALOHA 的基本思想是站点需要发送数据时可立即发送，无须事先检测信道状态；若在一段时间内未收到确认则认为发生冲突，等待一段随机时间后重传，直至发送成功。\n1. 纯 ALOHA 的缺点：冲突概率较高，该协议的吞吐量很低。\n2. 时隙 ALOHA 的改进：将时间划分为等长的时隙，并要求所有站点同步时钟。\n3. 发送约束：站点只能在每个时隙的起始时刻发送帧，且一帧的发送时间必须小于或等于一个时隙长度。\n4. 时隙化带来的收益：减少了发送的随意性，从而降低了冲突概率，提高了信道利用率。\n5. 时隙 ALOHA 的残余冲突：若在一个时隙内有两个或更多帧待发，它们将在下一可用时隙同时发送，仍然导致冲突，冲突后的重传策略与纯 ALOHA 类似。\n背诵要点：纯 ALOHA 是想发就发，时隙 ALOHA 是到点才发；时隙 ALOHA 降低冲突靠的是全网时钟同步这个前提，答题别漏掉。","keywords":["纯ALOHA","时隙ALOHA","冲突概率","时钟同步","吞吐量"],"source":"王道2027版 印刷页 81（PDF p93）","status":"final"},{"id":"net-ch3-3.5-011","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"1-坚持、非坚持、p-坚持三种 CSMA 在信道空闲和信道忙时的不同处理方式及其折中关系","level":"l1","title":"CSMA 的三种坚持策略","answer":"【结论】CSMA 协议在 ALOHA 的基础上引入了载波监听机制，即每个站点在发送前先监听信道，仅在信道空闲时才发送，从而显著降低冲突概率。\n1. 1-坚持 CSMA：信道空闲则立即发送；信道忙则持续监听，直至信道变为空闲。其中 1 表示信道空闲时以概率 1 立即发送，坚持指信道忙时持续监听。\n2. 非坚持 CSMA：信道空闲则立即发送；信道忙则不再监听，而是等待一段随机时间后重新尝试监听。\n3. 非坚持的得失：避免了多个站点在信道刚空闲时同时发送而导致的冲突，但因随机等待增加了平均传输时延。\n4. p-坚持 CSMA：适用于时隙化信道，站点在时隙开始时监听；若信道忙则等到下一时隙再监听；若信道空闲则以概率 p 发送数据，以概率 1 减 p 推迟到下一时隙再尝试。\n5. 折中关系：p-坚持通过概率延迟降低了多个站点同时发送的冲突概率，又通过持续监听避免了非坚持 CSMA 的过长延迟，因此它是 1-坚持与非坚持 CSMA 的折中。\n背诵要点：对比表要背死——信道忙时 1-坚持持续监听、非坚持放弃监听等随机时间、p-坚持持续监听到下一时隙；三者的定位是激进、保守、折中。","keywords":["CSMA","1-坚持","非坚持","p-坚持","载波监听","折中"],"source":"王道2027版 印刷页 82（PDF p94）","status":"final"},{"id":"net-ch3-3.5-012","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"轮询访问由集中监控站循环轮询，令牌传递协议用唯一的令牌控制发送权，从根本上避免冲突","level":"l2","title":"令牌传递协议","answer":"【结论】在轮询访问机制中，各站点不能随机发送信息，而是通过一个集中控制的监控站以循环方式轮询每个节点，来决定信道的分配，典型的轮询访问控制协议是令牌传递协议。\n1. 令牌的性质：令牌是一个特殊的控制帧，本身并不包含数据，仅用于控制信道的使用，确保同一时刻只有一个站点独占信道。\n2. 无冲突的原因：站点必须取得令牌后才能发送帧，而令牌只有一个，因此令牌环网络不会发生冲突。\n3. 释放规则：站点发送完一帧后应释放令牌，以便其他站点使用。\n4. 公平性：由于令牌按顺序依次传递，所有联网计算机对信道的访问权是公平的。\n5. 适用场景：令牌传递协议非常适合高负载的广播信道，此时若采用随机介质访问控制则冲突概率显著升高。\n6. 特点：令牌传递协议既不依赖时间分割，也不依赖空间隔离，它通过严格限制同一时刻仅有一个站点拥有发送权限，从根本上避免了冲突。\n背诵要点：令牌是控制帧不是数据帧、只有一个所以不冲突、发完必须释放；轮询访问与随机访问的分水岭是有没有集中控制。","keywords":["轮询访问","令牌","令牌传递协议","无冲突","公平性"],"source":"王道2027版 印刷页 82-83（PDF p94-95）","status":"final"},{"id":"net-ch3-3.5-013","chapter":"第3章 数据链路层","subject":"net","section":"3.5 介质访问控制","topic":"信道划分、随机访问、轮询访问三类机制在冲突可能性和信道占用方式上的系统对比","level":"l2","title":"三类介质访问控制机制对比","answer":"【结论】三类介质访问控制在是否可能冲突、如何分配信道资源上有本质差别，这是本章选择题的高频落点。\n1. 信道划分：静态划分信道，节点之间要么共享时间、要么共享空间、要么两者兼有；资源事先分好，不会发生冲突。\n2. 随机访问：动态分配信道，发送时既不预留时间也不独占频段，各站争用信道，可能发生冲突。\n3. 轮询访问：动态分配信道，但通过集中控制的令牌严格限制同一时刻只有一个站点发送，不会发生冲突。\n4. 动态分配的两类对比：随机访问靠争用、可能冲突；轮询访问靠授权、不会冲突，但存在令牌传递的额外开销和等待时延。\n5. 共同目的：即使是广播信道，也可通过介质访问控制机制将其转换为逻辑上的点对点信道。\n背诵要点：一句话区分——信道划分不冲突因为静态、随机访问会冲突因为争用、轮询访问不冲突因为授权；三种机制的最终目的都是把广播信道变成逻辑上的点对点信道。","keywords":["信道划分","随机访问","轮询访问","冲突","静态分配","动态分配"],"source":"王道2027版 印刷页 77-83（PDF p89-95）","status":"final"},{"id":"net-ch3-3.6-001","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"局域网的五个特点，以及拓扑结构、传输介质、介质访问控制方式三要素中哪一项最关键","level":"l1","title":"局域网的特点与三要素","answer":"【结论】局域网是指在一个较小的地理范围内，将各种计算机、外部设备和数据库系统等通过双绞线、同轴电缆或光纤等传输介质互连起来，构成一个可实现资源与信息共享的计算机网络。\n1. 通常为一个单位所拥有，地理范围和站点数量均有限。\n2. 所有站点共享较高的总带宽，即较高的数据传输速率。\n3. 具有较低的传输时延和较低的误码率。\n4. 各站点地位平等，不存在主从关系。\n5. 支持广播和多播通信。\n6. 决定局域网特性的三个要素是拓扑结构、传输介质和介质访问控制方式，其中介质访问控制方式最为关键，它直接决定局域网的技术特性。\n7. 常见拓扑有四类：星形结构、环形结构、总线形结构、星形和总线形结合的复合型结构。\n背诵要点：局域网五特点里范围有限、共享高带宽、低时延低误码、地位平等、支持广播多播要能默写；三要素中最关键的是介质访问控制方式，这是常考的最字题。","keywords":["局域网","拓扑结构","传输介质","介质访问控制方式","广播"],"source":"王道2027版 印刷页 87（PDF p99）","status":"final"},{"id":"net-ch3-3.6-002","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"IEEE 802 参考模型只对应 OSI 的物理层和数据链路层，数据链路层再分为 LLC 与 MAC 两个子层","level":"l2","title":"IEEE 802 参考模型与两个子层","answer":"【结论】IEEE 802 标准定义的局域网参考模型仅对应于 OSI 参考模型的数据链路层和物理层，并将数据链路层进一步拆分为逻辑链路控制子层即 LLC 和介质访问控制子层即 MAC。\n1. MAC 子层的定位：与接入传输介质有关的内容都放在 MAC 子层，它向上层屏蔽对物理层访问的各种差异。\n2. MAC 子层的主要功能包括：组帧和拆卸帧、比特传输差错检测、透明传输。\n3. LLC 子层的定位：与传输介质无关，它向网络层提供无确认无连接服务、面向连接服务、带确认无连接服务等多种服务类型。\n4. 现实演变：由于以太网在局域网市场中的主导地位，IEEE 802 委员会定义的 LLC 子层在实际应用中作用已显著弱化，因此现代许多网卡仅实现 MAC 协议而不包含 LLC 协议。\n5. 三种典型局域网及其逻辑与物理拓扑：以太网逻辑拓扑为总线形、物理拓扑为星形；令牌环 IEEE 802.5 逻辑拓扑为环形、物理拓扑为星形；光纤分布数字接口 FDDI 逻辑拓扑为环形、物理拓扑为双环结构。\n背诵要点：802 参考模型只有物理层和数据链路层两层，数据链路层再分 LLC 和 MAC；与介质有关放 MAC、与介质无关放 LLC，这是判断归属题的万能口诀。","keywords":["IEEE802","LLC","MAC子层","参考模型","逻辑拓扑","FDDI"],"source":"王道2027版 印刷页 87-88（PDF p99-100）","status":"final"},{"id":"net-ch3-3.6-003","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"DIX V1 到 DIX Ethernet V2 再到 IEEE 802.3 的演变，以及以太网简化通信的无连接与曼彻斯特编码两项措施","level":"l3","title":"以太网标准与两项简化措施","answer":"【结论】以太网规约的第一个版本是 DIX V1，由 DEC、Intel 和 Xerox 联合提出；随后被修订为第二版规约 DIX Ethernet V2，成为世界上首个局域网产品的规范；在此基础上 IEEE 802 委员会的 IEEE 802.3 工作组制定了第一个 IEEE 以太网标准。\n1. 名称的严格含义：严格来说以太网指符合 DIX Ethernet V2 标准的局域网，但由于它与 IEEE 802.3 标准差异极小，因此也常将 IEEE 802.3 局域网简称为以太网。\n2. 简化措施一：采用无连接的工作方式，既不对发送的数据帧编号，也不要求接收方返回确认。\n3. 由此提供的服务：以太网提供的是不可靠的尽最大努力交付服务，差错纠正由高层协议如 TCP 完成。\n4. 简化措施二：所有发送的数据均使用曼彻斯特编码，每个码元中间有一次电压跳变。\n5. 曼彻斯特编码的作用：接收方可利用该跳变方便地提取位同步信号。\n背诵要点：以太网是无连接、不编号、不确认、不可靠的尽力而为服务，纠错甩给 TCP；曼彻斯特编码的价值是自带位同步时钟，这也是以太网只做两层还能跑得好的关键。","keywords":["DIX","以太网V2","IEEE802.3","无连接","曼彻斯特编码","尽最大努力交付"],"source":"王道2027版 印刷页 88（PDF p100）","status":"final"},{"id":"net-ch3-3.6-004","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"48 位 MAC 地址的结构（高 24 位厂商代码、低 24 位序列号）以及单播、广播、多播三类帧的判定","level":"l1","title":"MAC 地址与三类发往本站的帧","answer":"【结论】IEEE 802 标准为局域网规定了一种 48 位的全球唯一地址，固化在网络适配器的 ROM 中，称为物理地址或 MAC 地址。\n1. 长度与表示：MAC 地址长 6B 即 48 位，通常用 12 个十六进制数字表示，以连字符或冒号分隔，例如 02-60-8c-e4-b1-21。\n2. 结构划分：高 24 位为厂商代码，低 24 位为厂商自行分配的适配器序列号。\n3. 唯一性与稳定性：全球所有局域网适配器的 MAC 地址均不重复；一台计算机只要未更换适配器，无论地理位置如何变化，其 MAC 地址保持不变。\n4. 路由器的 MAC 地址：当路由器通过适配器接入局域网时，该适配器的 MAC 地址用于标识路由器的对应接口；若路由器连接多个网络，则每个接口拥有独立的 MAC 地址。\n5. 单播帧：目的地址与本站 MAC 地址相同，一对一。\n6. 广播帧：目的地址为全 1，即 FF-FF-FF-FF-FF-FF，一对全体。\n7. 多播帧：目的地址为某个多播组地址，一对多，发送给局域网中部分站点。\n背诵要点：MAC 地址 6B 等于 48 位等于 12 个十六进制数字，高 24 位厂商、低 24 位序列号；适配器收到帧先用硬件检查目的地址，不属于三类之一就直接丢弃。","keywords":["MAC地址","48位","厂商代码","单播帧","广播帧","多播帧"],"source":"王道2027版 印刷页 89（PDF p101）","status":"final"},{"id":"net-ch3-3.6-005","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"CSMA/CD 适用于总线形网络或半双工环境，载波监听贯穿发送前后，冲突检测靠监测电压变化幅度","level":"l1","title":"CSMA/CD 的适用环境与机制","answer":"【结论】CSMA/CD 协议是 CSMA 协议的重要改进，适用于总线形网络或半双工网络环境。\n1. 全双工为何不需要：对于全双工网络，由于其采用两条独立信道分别用于发送和接收，通信双方可同时收发数据，不会产生冲突，因此无须使用 CSMA/CD 协议。\n2. 载波监听的含义：每个站点在发送前和发送过程中都必须持续检测信道；发送前监听是为了确认信道空闲以获取发送权，发送中监听则是为了及时发现是否发生冲突。\n3. 冲突检测的做法：即边发送边检测，适配器在发送数据的同时监测信道上的电压变化，当检测到电压变化幅度超过特定门限值时即判定发生冲突，立即停止发送，并等待一段随机时间后重试。\n4. 工作流程口诀：先听后发，边听边发，冲突停发，随机重发。\n背诵要点：CSMA/CD 的两个动作是听和边发边听，判断冲突的依据是电压变化幅度超过门限；全双工有两条独立信道所以不用 CSMA/CD，这是常考的对比点。","keywords":["CSMA/CD","总线形网络","半双工","载波监听","冲突检测","电压变化"],"source":"王道2027版 印刷页 89（PDF p101）","status":"final"},{"id":"net-ch3-3.6-006","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"用 A、B 两站发送时序推导最坏情况下 2τ 才能确认冲突，争用期即端到端往返传播时延","level":"l1","title":"冲突时间分析与争用期","answer":"【结论】将以太网的端到端往返传播时延 2τ 称为争用期，也称冲突窗口。\n1. 时序推导：设 τ 为单程传播时延。t 等于 0 时 A 站开始发送；t 等于 τ 减 δ 时 A 站的数据尚未到达 B 站，B 站因检测到信道空闲也开始发送。\n2. 冲突的发生：经过 δ 除以 2 的时间即 t 等于 τ 减 δ 除以 2 时，A、B 两站的数据在信道上发生冲突，但此时两个站点均未察觉。\n3. 冲突的察觉：直到 t 等于 τ 时 B 站检测到冲突并停止发送；在 t 等于 2τ 减 δ 时 A 站也检测到冲突并停止发送。\n4. 结论：A 站在开始发送后最多经过 2τ 即端到端往返传播时延即可确认是否发生冲突，当 δ 趋于 0 时取到这个上界。\n5. 争用期的意义：每个站点在发送数据后的一小段时间内存在冲突的可能，只有在争用期结束仍未检测到冲突，才能确定本次发送成功。\n背诵要点：争用期等于 2τ 等于端到端往返传播时延，也叫冲突窗口；记住最晚 2τ 一定知道结果，这是最短帧长公式的直接来源。","keywords":["争用期","冲突窗口","传播时延","端到端往返","冲突检测"],"source":"王道2027版 印刷页 89-90（PDF p101-102）","status":"final"},{"id":"net-ch3-3.6-007","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"最短帧长公式、10Mb/s 以太网争用期 51.2μs 对应 512bit 即 64B，以及不足 64B 时的填充规则","level":"l1","title":"最短帧长 64B 的由来","answer":"【结论】最短帧长的计算公式为：最短帧长等于 2 乘以最大单向传播时延再乘以数据传输速率。\n1. 公式的物理含义：最短帧长就是争用期内可发送的数据量，保证发送方在帧发送完毕之前一定能察觉冲突。\n2. 具体数值：以太网规定争用期为 51.2μs；对于 10Mb/s 的以太网，争用期内可发送 512bit，即 64B，因此以太网规定最短帧长为 64B。\n3. 推论一：若某站点在发送前 64B 未发生冲突，则后续数据也不会冲突，表示已成功抢占信道。\n4. 推论二：反之若发生冲突，必定发生在前 64B 内。\n5. 无效帧的判定：由于检测到冲突后立即停止发送，实际发出的数据量必然小于 64B，因此任何长度小于最短帧长的帧均为因冲突而异常中止的无效帧，应被丢弃。\n6. 填充规则：若实际要发送的帧小于 64B，如仅 40B，则需在数据字段后添加若干整数字节的填充字段，确保整个 MAC 帧长度不小于 64B。\n背诵要点：三个数字必须背死——争用期 51.2μs、10Mb/s 下争用期可发 512bit 即 64B、最短帧长 64B；填充加在数据字段之后，不是加在帧尾。","keywords":["最短帧长","争用期","51.2μs","64B","填充字段","无效帧"],"source":"王道2027版 印刷页 90（PDF p102）","status":"final"},{"id":"net-ch3-3.6-008","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"基本退避时间为一个争用期，k 取重传次数与 10 的较小值，重传 16 次仍失败则放弃并报错","level":"l1","title":"截断二进制指数退避算法","answer":"【结论】CSMA/CD 采用截断二进制指数退避算法来确定重传时机，冲突站点在停止发送后推迟一个随机时间再重试。\n1. 基本退避时间：一个争用期，即端到端往返传播时延 2τ。\n2. 随机数的取法：从整数集合 0 到 2 的 k 次方减 1 中随机选取一个数 r，推迟时间为 r 倍争用期，即 2rτ。\n3. k 的取值：k 等于重传次数与 10 中的较小值，即重传次数不超过 10 时 k 等于重传次数；超过 10 次后 k 不再增大，恒为 10。\n4. 举例：首次冲突后即第 1 次重传时 k 等于 1，随机数 r 从集合 0 和 1 中选取，推迟时间为 0 或 2τ；若再次冲突即第 2 次重传时 k 等于 2，r 从集合 0、1、2、3 中选取，推迟时间为 0、2τ、4τ 或 6τ，以此类推。\n5. 放弃条件：若重传达 16 次仍失败，则判定网络过于拥塞，放弃该帧并向高层报告错误。\n6. 机制效果：使重传平均等待时间随冲突次数增加而动态增长，称为动态退避，有效降低再次冲突概率，提升系统稳定性。\n背诵要点：k 等于重传次数与 10 的较小值，最大退避是 1023 个争用期，重传 16 次就放弃；冲突次数越多窗口越大，这就是截断二字的含义。","keywords":["截断二进制指数退避","争用期","重传次数","动态退避","1023"],"source":"王道2027版 印刷页 90-91（PDF p102-103）","status":"final"},{"id":"net-ch3-3.6-009","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"检测到冲突后还要发送 32 或 48 比特人为干扰信号，帧间最小间隔为 9.6μs 即 96 比特发送时间","level":"l2","title":"强化碰撞与帧间最小间隔","answer":"【结论】以太网规定一旦检测到冲突，站点除立即停止发送数据外，还需继续发送 32 比特或 48 比特的人为干扰信号，以确保所有站点都能感知到冲突，这被称为强化碰撞机制。\n1. 强化碰撞的作用：让冲突信号足够长、足够强，避免其他站点因为冲突持续时间太短而漏判。\n2. 帧间最小间隔的数值：以太网规定帧间最小间隔为 9.6μs，相当于 96 比特的发送时间。\n3. 帧间最小间隔的目的：以便接收站有足够时间清空缓存，为接收下一帧做好准备。\n4. 与发送流程的关系：检测信道时若信道在 9.6μs 时间内保持空闲，即满足帧间最小间隔，才开始发送该帧。\n背诵要点：两个数字要分清——强化碰撞是 32 或 48 比特的干扰信号，帧间最小间隔是 9.6μs 等于 96 比特时间；前者为了让人察觉冲突，后者为了让接收方清缓存。","keywords":["强化碰撞","人为干扰信号","帧间最小间隔","9.6μs","96比特"],"source":"王道2027版 印刷页 91（PDF p103）","status":"final"},{"id":"net-ch3-3.6-010","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"以太网 V2 帧的目的地址 6B、源地址 6B、类型 2B、数据 46 到 1500B、FCS 4B，以及前导码 8B","level":"l1","title":"以太网 V2 MAC 帧格式","answer":"【结论】以太网 MAC 帧格式有两种标准，即 DIX Ethernet V2 标准和 IEEE 802.3 标准，其中最常用的是以太网 V2 标准的帧格式。\n1. 目的地址：6B，帧在局域网中的目的适配器的 MAC 地址。\n2. 源地址：6B，发送该帧的源适配器的 MAC 地址。\n3. 类型：2B，标识上一层使用的是什么协议，以便把收到的 MAC 帧的数据交给相应的上层协议，例如类型字段的值为 0x0800 时表示上层使用的是 IP。\n4. 数据：46 到 1500B，承载上层的协议数据单元；以太网的最大传输单元为 1500B，若 IP 数据报超过此长度则需在网络层进行分片。\n5. 检验码 FCS：4B，采用 32 位 CRC 码，检验范围从目的地址到数据字段，含目的地址、源地址、类型和数据，但不检验前导码。\n6. 前导码：共 8B，由 7B 的前同步码和 1B 的帧开始定界符组成；前同步码为 10101010 重复，帧开始定界符为 10101011，用于标志 MAC 帧的开始。\n7. 46B 的由来：以太网帧的最短帧长为 64B，而 MAC 帧的首部和尾部共 18B，因此数据字段最少为 64 减 18 等于 46B。\n背诵要点：帧格式按 6、6、2、46 到 1500、4 记，前导码 8B 单独算且不计入 FCS 校验范围；46 等于 64 减 18 这个推导要会现场写。","keywords":["以太网V2","MAC帧格式","前导码","类型字段","FCS","MTU"],"source":"王道2027版 印刷页 91-92（PDF p103-104）","status":"final"},{"id":"net-ch3-3.6-011","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"100Base-T、吉比特以太网、10 吉比特以太网在速率、介质、双工方式与是否使用 CSMA/CD 上的差别","level":"l2","title":"高速以太网三种类型对比","answer":"【结论】速率达到或超过 100Mb/s 的以太网称为高速以太网，主要包括 100Base-T 以太网、吉比特以太网和 10 吉比特以太网三类。\n1. 100Base-T 以太网：速率 100Mb/s，传输介质为双绞线，支持半双工和全双工，半双工模式下使用 CSMA/CD 协议。\n2. 吉比特以太网：速率 1Gb/s，传输介质为双绞线或光纤，支持半双工和全双工，半双工模式下使用 CSMA/CD 协议，全双工模式下不使用。\n3. 10 吉比特以太网：速率 10Gb/s，传输介质为双绞线或光纤，只支持全双工，不使用介质访问控制协议。\n4. 帧格式的一致性：10 吉比特以太网的帧格式与 10Mb/s、100Mb/s 和 1Gb/s 以太网完全相同，并保留 IEEE 802.3 规定的最小和最大帧长。\n5. 10 吉比特以太网无须 CSMA/CD 的原因：仅工作在全双工模式，无争用问题。\n6. 演进的启示：以太网从 10Mb/s 到 10Gb/s 的演进充分证明了其可扩展性、灵活性、易部署性和稳健性。\n背诵要点：判断只能全双工就选 10 吉比特以太网；吉比特以太网半双工下仍用 CSMA/CD，10 吉比特则彻底不用，这是最容易被设陷阱的地方。","keywords":["高速以太网","100Base-T","吉比特以太网","10吉比特以太网","全双工","CSMA/CD"],"source":"王道2027版 印刷页 92-93（PDF p104-105）","status":"final"},{"id":"net-ch3-3.6-012","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"无线局域网分有固定基础设施与自组网络两类，BSS 由 AP 加移动站构成，BSS 经 DS 互连成 ESS","level":"l3","title":"无线局域网的组成","answer":"【结论】无线局域网可分为两大类，即具有固定基础设施的无线局域网和无固定基础设施的移动自组织网络。\n1. 有固定基础设施的无线局域网：IEEE 制定了 802.11 系列协议标准，包括 802.11a、802.11b、802.11g、802.11n 等；802.11 协议采用星形拓扑，其中心节点称为接入点 AP，在 MAC 层使用 CSMA/CA 协议，通常也称 Wi-Fi。\n2. 最小构件：802.11 协议规定无线局域网的最小构件是基本服务集 BSS，一个 BSS 包含一个 AP 和若干移动站，站内通信或与外部站点的通信都必须通过该 BSS 的 AP。\n3. AP 的配置：配置 AP 时需要为其分配一个不超过 32B 的服务集标识符 SSID 和一个工作信道，SSID 即为该无线局域网的名称。\n4. 覆盖范围：BSS 覆盖的地理范围称为基本服务区 BSA，其直径一般不超过 100 米。\n5. 扩展方式：一个 BSS 可通过 AP 连接到分配系统 DS，再与其他 BSS 互连，从而构成扩展的服务集 ESS；DS 的作用是使整个 ESS 对上层呈现为一个单一的 BSS。\n6. 接入有线网：ESS 还可通过一种称为 Portal 的设备为无线用户提供接入有线以太网的能力，Portal 的功能相当于网桥。\n7. 漫游：当移动站从一个 BSS 漫游到另一个 BSS 时仍可保持通信，但所使用的 AP 会发生改变。\n背诵要点：BSS 等于一个 AP 加若干移动站，BSA 直径不超过 100 米，SSID 不超过 32B；DS 让 ESS 对上层像一个 BSS，Portal 相当于网桥。","keywords":["无线局域网","802.11","AP","BSS","ESS","SSID"],"source":"王道2027版 印刷页 93-94（PDF p105-106）","status":"final"},{"id":"net-ch3-3.6-013","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"无固定基础设施的自组网络由对等移动站临时组成，与依赖固定路由基础设施的移动 IP 有本质区别","level":"l3","title":"自组网络与移动 IP","answer":"【结论】无固定基础设施的自组织网络也称自组网络，此类网络不包含 AP，而是由若干处于平等地位的移动站临时组成的对等网络。\n1. 节点角色：各节点地位平等，中间节点需转发其他节点的数据，因此兼具终端与路由器的功能。\n2. 形成方式：若干可移动设备彼此邻近且存在通信需求时，会自发组建一个网络。\n3. 路由特点：每个移动站都需主动参与路由的发现与维护；由于节点位置不断变化，网络拓扑可能频繁且快速地改变，传统在固定网络中有效的路由协议往往难以适用，必须采用专门为其设计的路由机制。\n4. 与移动 IP 的本质区别：移动 IP 旨在支持主机在不同网络间漫游并接入互联网，其底层仍依赖固定网络的路由基础设施。\n5. 自组网络的定位：自组网络是一种分布式的无线自治系统，不仅拥有专用的路由协议，还能独立于互联网运行，无须依赖任何预设的固定基础设施。\n背诵要点：自组网络的关键词是无 AP、对等、临时、节点兼作路由器、专用路由协议、可独立于互联网；移动 IP 则是要漫游但离不开固定基础设施，这就是两者的分水岭。","keywords":["自组网络","ad hoc","移动IP","对等网络","分布式自治系统"],"source":"王道2027版 印刷页 94（PDF p106）","status":"final"},{"id":"net-ch3-3.6-014","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"无线信号强度动态范围大导致冲突检测硬件成本过高，且隐蔽站问题使冲突检测无法发现所有冲突","level":"l2","title":"无线局域网不能照搬 CSMA/CD","answer":"【结论】CSMA/CD 协议已成功用于有线局域网，但无线局域网不能简单照搬 CSMA/CD 协议，无线局域网仍使用 CSMA 协议，但无法实现冲突检测。\n1. 原因一：适配器接收到的信号强度通常远小于其发送信号的强度，且无线信道中信号强度的动态范围极大，若要实现冲突检测，硬件上的成本将会过高。\n2. 原因二：在无线通信中并非所有站点都能互相侦听到对方却可能产生冲突，即存在隐蔽站问题，导致冲突检测机制无法发现所有冲突。\n3. 隐蔽站的典型场景：A 站和 B 站均在 AP 的覆盖范围内，但彼此距离较远无法侦听到对方；当 A 站和 B 站同时检测到信道空闲时都向 AP 发送数据，导致发生冲突，而双方均无法察觉。\n4. 术语：这里 A 站和 B 站互为隐蔽站，它们检测不到彼此的信号，却能产生冲突。\n背诵要点：两个理由是检测硬件太贵和隐蔽站导致检测不全，前者是成本问题、后者是原理问题；隐蔽站的标准例子就是两站都在 AP 覆盖内却互相听不到。","keywords":["隐蔽站","CSMA/CD","无线局域网","冲突检测","信号强度"],"source":"王道2027版 印刷页 94（PDF p106）","status":"final"},{"id":"net-ch3-3.6-015","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"CSMA/CA 把冲突检测改为冲突避免，802.11 用停止等待式确认重传弥补无线信道的不可靠","level":"l2","title":"CSMA/CA 的冲突避免与确认重传","answer":"【结论】802.11 协议定义的 CSMA/CA 协议对 CSMA/CD 协议进行改进，将冲突检测改为冲突避免。\n1. 冲突避免的真实含义：冲突避免并不是指协议可以完全避免冲突，而是要尽量降低冲突发生的概率，这一点最容易被误解。\n2. 必须避免冲突的原因：由于 802.11 协议不支持冲突检测，一旦站点开始发送帧就必须完整发送该帧；若在冲突存在时仍发送整个帧，尤其是长数据帧，将严重降低网络效率。\n3. 确认重传机制：鉴于无线信道的通信质量远不如有线信道，802.11 协议在数据链路层引入确认与重传机制，站点每发送完一帧后必须收到接收方的确认帧 ACK，才能继续发送下一帧。\n4. 协议性质：因此 802.11 无线局域网采用的是一种停止等待式可靠传输协议。\n5. 两种介质访问控制方式：分布式协调功能 DCF 不采用任何中心控制，各站通过争用信道获得发送权，这是 802.11 协议必须实现的方式，也是目前广泛使用的方式；点协调功能 PCF 使用 AP 集中控制，用类似于探询的方法将发送权轮流分配给各站从而避免冲突，它是可选方式，实际很少使用。\n背诵要点：CA 不等于不会冲突，只是降低冲突概率；802.11 是停止等待式可靠传输，每帧必须等 ACK；DCF 必须实现且常用、PCF 可选且少用。","keywords":["CSMA/CA","冲突避免","ACK","停止等待","DCF","PCF"],"source":"王道2027版 印刷页 94-95（PDF p106-107）","status":"final"},{"id":"net-ch3-3.6-016","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"DIFS 最长用于 DCF 发送数据帧和管理帧，PIFS 中等用于 PCF，SIFS 最短用于分隔同一对话中的连续帧","level":"l2","title":"三种帧间间隔 IFS","answer":"【结论】802.11 协议要求即使检测到信道空闲，也需再等待一段短暂时间确保信道持续空闲方可发送帧，该时间称为帧间间隔 IFS，其长度取决于帧的类型。\n1. DIFS 即分布式协调帧间间隔，是最长的 IFS，在 DCF 方式下用来发送数据帧和管理帧。\n2. PIFS 即点协调帧间间隔，是中等长度的 IFS，在 PCF 方式中使用。\n3. SIFS 即短帧间间隔，是最短的 IFS，用于分隔同一对话中的连续帧，如 ACK 帧、CTS 帧、分片后的数据帧，以及对 AP 探询的响应帧等。\n4. 长度关系：SIFS 小于 PIFS，PIFS 小于 DIFS。\n5. 设计意图：间隔越短优先级越高，SIFS 最短使得确认帧和控制帧能抢先于其他站点的数据帧，从而保证一次对话不被插入。\n背诵要点：长度排序是 SIFS 小于 PIFS 小于 DIFS，用途对应是 SIFS 管应答、PIFS 归 PCF、DIFS 管 DCF 的数据帧和管理帧；越短越优先是理解 IFS 的钥匙。","keywords":["帧间间隔","DIFS","PIFS","SIFS","DCF","优先级"],"source":"王道2027版 印刷页 95（PDF p107）","status":"final"},{"id":"net-ch3-3.6-017","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"只有首个数据帧且信道空闲才不退避，退避计时器在信道忙时冻结，竞争窗口最大 1023 对应第 6 次重传","level":"l2","title":"CSMA/CA 的退避规则","answer":"【结论】当信道由忙变为空闲时，若多个站点都在 DIFS 后立即发送必然冲突，因此 CSMA/CA 规定任何站点要发送数据必须先等待 DIFS，再进入争用期并执行随机退避。\n1. 退避的执行方式：随机选择一个退避时隙数，并在每个空闲时隙将其减 1，直至减为 0 后才发送。\n2. 不退避的唯一情形：当且仅当检测到信道空闲且这个数据帧是要发送的第一个数据帧时，才不使用退避算法。\n3. 必须退避的三种情况：一是要发送第一个数据帧之前检测到信道忙；二是未收到确认要重传数据帧；三是每次确认成功后要发送下一个数据帧。\n4. 竞争窗口：第 i 次退避在 0 到 2 的 i 次方减 1 个时隙中随机选择一个，当时隙范围最大达到 1023 时，对应第 6 次重传，就不再增加。\n5. 计时器规则：若信道忙则冻结计时器即暂停递减并继续等待，直至信道变为空闲，这称为推迟接入；若信道空闲且在时间 DIFS 内持续空闲，则开始争用信道进行倒计时，计时器减至 0 时站点立即发送整个数据帧并等待确认。\n6. 重传处理：若在规定时间内未收到确认，则按二进制指数退避规则增大竞争窗口，再重新尝试。\n背诵要点：只有首个帧加信道空闲才不退避，其余情况一律退避；退避窗口最大 1023 对应第 6 次重传；信道忙时计时器冻结叫推迟接入，不叫退避。","keywords":["CSMA/CA","退避算法","竞争窗口","1023","推迟接入","争用期"],"source":"王道2027版 印刷页 95（PDF p107）","status":"final"},{"id":"net-ch3-3.6-018","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"持续期字段通告占用时长、其他站设置 NAV 暂停发送，以及 RTS/CTS 两次握手缓解隐蔽站问题","level":"l3","title":"虚拟载波监听与信道预约","answer":"【结论】802.11 协议规定各站采用虚拟载波监听机制：源站在发送数据前通过帧首部的持续期字段，向所有能接收到该帧的站点通告其将占用信道的总时长，其中包括目的站回复 ACK 所需的时间。\n1. NAV 的作用：其他站点收到后据此设置自身的网络分配向量 NAV，并在 NAV 计时期间暂停发送，进而显著降低冲突概率。\n2. 虚拟载波监听的含义：这些站点并未实际监听物理信道，而是基于接收到的通知主动避让，效果等同于持续监听信道。\n3. 信道预约的目的：为了缓解隐蔽站的问题，802.11 协议允许发送站对信道进行预约。\n4. RTS 阶段：A 站在向 AP 发送数据帧前先检测信道，若信道空闲则等待 DIFS 后广播请求发送 RTS 控制帧，通告将占用信道一段时间，即 SIFS 加 CTS 加 SIFS 加 DATA 加 SIFS 加 ACK，该时间被写入 RTS 帧首部。\n5. CTS 阶段：若 AP 正确收到 RTS 帧且信道空闲，则等待 SIFS 后广播允许发送 CTS 控制帧，通告将占用信道一段时间，即 SIFS 加 DATA 加 SIFS 加 ACK，该时间同样被写入 CTS 帧首部。\n6. 数据阶段：A 站收到 CTS 帧后再等待 SIFS 即可发送数据帧，其首部写入 DATA 加 SIFS 加 ACK 的时间。\n7. 隐蔽站的规避：任何站点只要收到 RTS 帧、CTS 帧或数据帧之一，就会根据其首部的持续期字段设置自己的 NAV；B 站虽然收不到 A 站发送给 AP 的 RTS 帧，但能收到 AP 广播的 CTS 帧，据此设置 NAV，因此在这段时间内不会发送数据干扰信道。\n8. 开销权衡：使用 RTS 和 CTS 帧会使网络的通信效率有所下降，但两种控制帧都很短，与数据帧相比开销不算大；信道预约并非强制要求，各站点可自行决定是否启用，或仅当待发送的数据帧长度超过某一阈值时才使用。\n背诵要点：持续期字段加 NAV 等于虚拟载波监听，本质是没听信道但主动避让；RTS 通告的时间包含 CTS，CTS 通告的时间不包含 CTS，两者都算到 ACK 发完为止。","keywords":["虚拟载波监听","NAV","持续期字段","RTS","CTS","信道预约"],"source":"王道2027版 印刷页 95-96（PDF p107-108）","status":"final"},{"id":"net-ch3-3.6-019","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"冲突处理机制、传输介质、检测方式三方面的差异，以及先打招呼再发与边发边听撞了就停的对照","level":"l1","title":"CSMA/CD 与 CSMA/CA 差异","answer":"【结论】CSMA/CD 协议与 CSMA/CA 协议的主要区别体现在冲突处理机制、传输介质和检测方式三个方面。\n1. 冲突处理机制不同：CSMA/CD 协议能在发送过程中检测冲突，但无法避免冲突；CSMA/CA 协议无法在发送时检测冲突，尤其是发生在接收端的冲突，因此只能尽量避免冲突。\n2. 传输介质不同：CSMA/CD 协议用于总线形有线以太网，CSMA/CA 协议则用于无线局域网。\n3. 检测方式不同：CSMA/CD 协议通过检测线路中的电压变化来判断是否冲突；而 CSMA/CA 协议只能在发送前通过能量检测、载波侦听或两者的混合方式，综合判断信道是否空闲。\n4. 记忆口诀：CSMA/CA 协议的思想是先打招呼再发数据，发送前先广播通知其他站点在其指定的时段内暂时发送以预防冲突；而 CSMA/CD 协议则是边发边听、撞了就停，发送前先监听信道，发送过程中持续检测信号，一旦发现冲突就立即停发并启动退避重传机制。\n背诵要点：三条差异按机制、介质、检测的顺序背；CA 是打招呼式预防，CD 是撞了再补救，一句话点破两者哲学上的不同。","keywords":["CSMA/CD","CSMA/CA","冲突检测","冲突避免","传输介质"],"source":"王道2027版 印刷页 96-97（PDF p108-109）","status":"final"},{"id":"net-ch3-3.6-020","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"802.11 帧由 30B 首部、最大 2312B 帧主体和 4B FCS 组成，三个地址由去往 AP 与来自 AP 两个标志位决定","level":"l2","title":"802.11 MAC 帧与三个地址","answer":"【结论】802.11 局域网的帧共有三种类型，即数据帧、控制帧和管理帧。\n1. 帧的三部分：MAC 首部共 30B，帧的复杂性主要体现在 MAC 首部；帧主体即数据部分，最大长度不超过 2312B，远大于以太网帧的数据载荷；帧检验序列 FCS 作为 MAC 尾部共 4B。\n2. 数据帧首部字段：帧控制 2B、持续期 2B、地址 1 共 6B、地址 2 共 6B、地址 3 共 6B、序号控制 2B、地址 4 共 6B。\n3. 控制帧的差异：RTS 帧为帧控制 2B、持续期 2B、接收地址 6B、发送地址 6B、FCS 4B；CTS 和 ACK 帧为帧控制 2B、持续期 2B、接收地址 6B、FCS 4B。\n4. 三个地址的判定依据：这三个地址的具体含义由帧控制字段中的两个标志位去往 AP 和来自 AP 共同决定，地址 4 用于自组网络。\n5. 情形一：去往 AP 为 0、来自 AP 为 1 时，地址 1 是接收地址即目的地址，地址 2 是发送地址即 AP 地址，地址 3 是源地址。\n6. 情形二：去往 AP 为 1、来自 AP 为 0 时，地址 1 是接收地址即 AP 地址，地址 2 是发送地址即源地址，地址 3 是目的地址。\n7. 理解的关键：地址 1 是直接接收该帧的节点地址，地址 2 是实际发送该帧的节点地址，它们始终表示当前无线传输的两端；当主机发往 AP 时接收方是 AP 但最终目的不是 AP，因此用地址 3 存放实际目的地址，反之用地址 3 存放实际源地址。\n背诵要点：先看两个标志位再定三个地址，地址 1 是直接接收方、地址 2 是直接发送方、地址 3 是真正的源或目的；同 BSS 内 A 发给 B 要经过 A 到 AP、AP 到 B 两段，两段的地址 3 都存对方的真实地址。","keywords":["802.11","MAC帧","地址1","地址2","地址3","去往AP","来自AP"],"source":"王道2027版 印刷页 97-98（PDF p109-110）","status":"final"},{"id":"net-ch3-3.6-021","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"VLAN 把一个大型局域网划分为与地理位置无关的逻辑广播域，可按端口、MAC 地址、IP 地址划分","level":"l2","title":"VLAN 的概念与划分方式","answer":"【结论】通过虚拟局域网可将一个大型局域网划分为若干与地理位置无关的逻辑上的 VLAN，每个 VLAN 构成一个独立且较小的广播域。\n1. 引入动机：一个以太网构成一个广播域，当网络中包含的计算机数量过多时，网络中出现大量广播帧，尤其是频繁使用的 ARP 和 DHCP 报文；同时同一单位的不同部门共享一个局域网不利于信息保密与安全隔离。\n2. 通信范围：同一 VLAN 内的主机可以直接通信，而不同 VLAN 之间的主机则无法直接通信。\n3. 基于端口划分：将交换机的若干物理接口划归同一个逻辑组，该方法最简单、最常用；若主机更换了接入端口，则可能被划分到新的 VLAN 即新子网。\n4. 基于 MAC 地址划分：根据主机的 MAC 地址划分 VLAN，当主机从一个交换机移动到另一个交换机时，它仍属于原 VLAN。\n5. 基于 IP 地址划分：根据网络层地址或协议类型划分 VLAN，此类 VLAN 可跨越路由器进行扩展，将多个物理局域网中的主机纳入同一逻辑 VLAN。\n6. 本质：虚拟局域网只是局域网为用户提供的一种逻辑服务，并不是一种新型局域网。\n背诵要点：VLAN 划分的是广播域不是冲突域；三种划分方式记端口最常用但换口就变、MAC 跟着主机走、IP 能跨路由器；它只是逻辑服务，不是新型局域网。","keywords":["VLAN","广播域","基于端口","MAC地址","IP地址","逻辑服务"],"source":"王道2027版 印刷页 99（PDF p111）","status":"final"},{"id":"net-ch3-3.6-022","chapter":"第3章 数据链路层","subject":"net","section":"3.6 局域网","topic":"802.1Q 在源地址与类型之间插入 4B 标签，数据字段最小长度由 46B 减为 42B，最大帧长增至 1522B","level":"l1","title":"IEEE 802.1Q 帧格式","answer":"【结论】IEEE 802.1Q 标准定义了支持 VLAN 的以太网帧格式扩展，它在标准以太网帧的源地址字段与类型字段之间插入一个 4B 的 VLAN 标签，用于标识该帧所属的 VLAN，插入标签后的帧称为 802.1Q 帧。\n1. 长度调整：由于帧首部增加了 4B，为保持最小帧长 64B 不变，数据字段的最小长度由 46B 减少为 42B，最大长度仍为 1500B，因此最大帧长从 1518B 增至 1522B。\n2. 标签结构：VLAN 标签的前两个字节固定为 0x8100，表示这是一个 802.1Q 帧；后两个字节中前 4 位保留未用，后 12 位为 VLAN 标识符 VID，用于唯一标识该帧所属的 VLAN。\n3. VLAN 数量上限：12 位 VID 最多可支持 4096 个 VLAN。\n4. FCS 处理：插入 VLAN 标签后，帧尾的 FCS 必须重新计算。\n5. 链路类型：连接两台交换机的链路称为汇聚链路也称干线链路，干线链路上传输的是 802.1Q 帧；主机与交换机之间交互的仍是标准以太网帧，这样的链路为接入链路。\n6. 转发过程：交换机根据目的 MAC 地址识别出目的主机属于本交换机管理的某个 VLAN 时直接当作普通以太网帧转发；若目的主机在另一台交换机上，则必须先插入 VLAN 标签再通过干线链路传输，否则对端交换机无法判断该帧应归属哪个 VLAN；对端交换机在向目的主机转发前会剥离 VLAN 标签。\n7. 跨 VLAN 通信：若两主机分属不同 VLAN，则因处于不同的广播域无法直接通信，此时需借助上层路由器实现跨 VLAN 通信，或通过支持三层功能的交换机完成第 3 层转发。\n背诵要点：标签插在源地址和类型之间共 4B，前 2B 是 0x8100、后 12 位是 VID 最多 4096 个 VLAN；为了保住 64B 最小帧长，数据字段最小长度从 46B 降到 42B，最大帧长从 1518B 涨到 1522B。","keywords":["802.1Q","VLAN标签","VID","干线链路","42B","1522B"],"source":"王道2027版 印刷页 99-100（PDF p111-112）","status":"final"},{"id":"net-ch3-3.7-001","chapter":"第3章 数据链路层","subject":"net","section":"3.7 广域网","topic":"广域网覆盖范围很广，由节点交换机和连接链路组成，节点交换机与路由器在工作范围上的区别","level":"l1","title":"广域网的基本概念","answer":"【结论】广域网通常指覆盖范围很广、远超一个城市的长距离网络，其主要任务是长距离运送主机所发送的数据。\n1. 关注点：连接广域网中各节点交换机的链路均为高速链路，因此广域网首要考虑的问题是通信容量是否足够大，以支持日益增长的通信需求。\n2. 与互联网的关系：广域网不等于互联网；互联网可以连接不同类型的网络，通常通过路由器实现互联，多个相距较远的局域网可通过路由器接入广域网，从而构成一个覆盖范围广泛的互联网。\n3. 组成：广域网由若干节点交换机和连接这些交换机的链路组成，注意这里用的是节点交换机而不是路由器。\n4. 节点交换机与路由器的区别：两者都用于转发分组、工作原理相似，但节点交换机工作在单个网络内部，而路由器用于连接多个网络构成的互联网；节点交换机的核心功能是存储并转发分组。\n5. 连接方式：广域网中节点之间采用点到点连接，但为提高网络可靠性，一个节点交换机通常与多个其他交换机相连。\n背诵要点：广域网由节点交换机加链路组成，别写成路由器；节点交换机管一个网络内部、路由器管网络之间；广域网不等于互联网。","keywords":["广域网","节点交换机","路由器","点到点连接","存储转发"],"source":"王道2027版 印刷页 113（PDF p125）","status":"final"},{"id":"net-ch3-3.7-002","chapter":"第3章 数据链路层","subject":"net","section":"3.7 广域网","topic":"从覆盖范围、连接方式、OSI 层次、着重点四个方面对比广域网与局域网","level":"l2","title":"广域网与局域网的区别","answer":"【结论】广域网和局域网在覆盖范围、连接方式、所处 OSI 层次和着重点上都有系统差别。\n1. 覆盖范围：广域网很广，通常跨区域；局域网较小，通常在一个区域内。\n2. 连接方式：广域网通常采用点对点连接；局域网普遍使用广播信道。\n3. OSI 层次：广域网涉及三层，即物理层、数据链路层、网络层；局域网涉及两层，即物理层、数据链路层。\n4. 着重点：广域网强调资源共享，局域网强调数据传输。\n5. 联系一：广域网和局域网都是互联网的重要构件，从互联网角度看两者地位平等，不存在包含关系。\n6. 联系二：当主机在所属广域网或局域网的内部通信时，仅需使用该网络的物理地址。\n背诵要点：四组对比记范围、连接、层次、着重点——广域网点对点三层重资源共享，局域网广播两层重数据传输；两者地位平等，不是包含关系。","keywords":["广域网","局域网","OSI层次","点对点连接","广播信道"],"source":"王道2027版 印刷页 113（PDF p125）","status":"final"},{"id":"net-ch3-3.7-003","chapter":"第3章 数据链路层","subject":"net","section":"3.7 广域网","topic":"PPP 由 LCP、NCP 和封装方法三部分组成，帧首部 4 个字段尾部 2 个字段，信息字段 0 到 1500B","level":"l1","title":"PPP 的组成与帧格式","answer":"【结论】点对点协议 PPP 是目前最流行的点对点链路控制协议，主要有两种应用场景，即用户接入互联网时与 ISP 之间的通信，以及两台网络设备之间通过直连专线通信。\n1. 组成之一：一个链路控制协议 LCP，用来建立、配置、测试数据链路连接，及协商一些选项。\n2. 组成之二：一套网络控制协议 NCP，PPP 支持多种网络层协议，每种网络层协议需通过对应的 NCP 进行配置，以建立和管理其逻辑连接。\n3. 组成之三：一种将 IP 数据报封装到串行链路的方法，IP 数据报作为 PPP 帧的信息部分被封装在 PPP 帧中传输，其长度受最大传送单元 MTU 限制。\n4. 帧格式：首部包含 4 个字段，尾部包含 2 个字段。\n5. 标志字段 F：首部和尾部各有一个，占 1B，规定为 0x7E 即 01111110，用作帧的定界符，标识帧的开始与结束。\n6. 地址字段 A 占 1B 规定为 0xFF，控制字段 C 占 1B 规定为 0x03，两者的意义暂未定义。\n7. 协议字段占 2B，用于标识信息字段所承载的分组类型，若为 0x0021 表示信息字段为 IP 数据报，若为 0xC021 表示信息字段为 LCP 分组。\n8. 信息字段长度可变，范围为 0 到 1500B；帧检验序列 FCS 占 2B，采用 CRC 校验生成的冗余码用于差错检测。\n9. 与以太网的重要差别：由于 PPP 是点对点链路而非总线形网络，无须使用 CSMA/CD 协议，因此不存在最短帧长的限制，其信息字段最小可为 0B，而以太网帧的数据部分至少需 46B。\n背诵要点：PPP 三件套是 LCP、NCP、封装方法；标志 0x7E、地址 0xFF、控制 0x03、协议 0x0021 表示 IP、FCS 只占 2B；信息字段最小可以是 0B，这是它与以太网帧最容易被考的差别。","keywords":["PPP","LCP","NCP","标志字段","协议字段","FCS"],"source":"王道2027版 印刷页 114（PDF p126）","status":"final"},{"id":"net-ch3-3.7-004","chapter":"第3章 数据链路层","subject":"net","section":"3.7 广域网","topic":"PPP 异步传输用字节填充、转义字符 0x7D，同步传输用零比特填充，两者都是为透明传输服务","level":"l2","title":"PPP 的透明传输机制","answer":"【结论】为实现透明传输，当信息段中出现与标志字段相同的比特模式时，需要采取填充措施。\n1. 异步传输的填充方式：PPP 使用异步传输时采用字节填充法，使用的转义字符为 0x7D 即 01111101。\n2. 同步传输的填充方式：PPP 使用同步传输时采用零比特填充法。\n3. 判断依据：题目给出异步线路或字符填充就选字节填充，给出同步线路或位填充就选零比特填充。\n4. 设计目的：两种填充都是为了不让信息字段里出现的 0x7E 被误当作帧定界符，从而保证任意比特组合的数据都能原样传输。\n5. 与协议性质的关系：PPP 是面向字节的协议，所有 PPP 帧的长度均为整数个字节，因此默认使用字节填充。\n背诵要点：异步对字节填充、转义符 0x7D；同步对零比特填充；PPP 是面向字节的协议、帧长都是整数个字节，这一点决定了它默认用字节填充而不是位填充。","keywords":["PPP","透明传输","字节填充","零比特填充","转义字符","0x7D"],"source":"王道2027版 印刷页 114（PDF p126）","status":"final"},{"id":"net-ch3-3.7-005","chapter":"第3章 数据链路层","subject":"net","section":"3.7 广域网","topic":"PPP 从链路静止到链路打开的状态迁移，以及它提供有连接的不可靠服务、只支持全双工点对点链路等特点","level":"l3","title":"PPP 的状态转换与特点","answer":"【结论】PPP 链路的起始和终止均为链路静止状态，此时用户与 ISP 之间无物理层连接。\n1. 链路建立：当检测到调制解调器的载波信号并成功建立物理层连接后，PPP 进入链路建立状态；在此状态下 LCP 开始协商配置选项，如最大帧长、鉴别协议等，若协商成功则进入鉴别状态，若协商失败则退回链路静止状态。\n2. 鉴别状态：若通信双方无须鉴别或身份鉴别成功，则进入网络层协议状态；若鉴别失败则直接进入链路终止状态。\n3. 网络层协议状态：双方通过 NCP 配置网络层参数如分配 IP 地址，配置完成后 PPP 进入链路打开状态，双方即可开始数据通信。\n4. 链路终止：数据通信结束后，若一方发送终止请求并在收到确认后，或链路发生故障，PPP 将进入链路终止状态；待调制解调器的载波信号停止后最终返回链路静止状态。\n5. 特点一：PPP 在链路建立阶段使用确认机制，但在数据传输阶段仅提供无差错接收，通过 CRC 检验，不使用序号与确认机制，因此提供的是不可靠服务。\n6. 特点二：PPP 仅支持全双工的点对点链路，不支持多点线路。\n7. 特点三：PPP 链路两端可运行不同的网络层协议，但仍能通过同一 PPP 链路进行通信。\n8. 特点四：PPP 是面向字节的协议，所有 PPP 帧的长度均为整数个字节。\n9. 服务定性：PPP 提供的是有连接的不可靠服务。\n背诵要点：状态链是静止、建立、鉴别、网络层协议、打开、终止、再回到静止；PPP 在建立阶段有确认、在传输阶段无序号无确认，因此是有连接但不可靠，这个组合最容易设错。","keywords":["PPP","状态转换","LCP","NCP","有连接不可靠","全双工"],"source":"王道2027版 印刷页 114-115（PDF p126-127）","status":"final"},{"id":"net-ch3-3.8-001","chapter":"第3章 数据链路层","subject":"net","section":"3.8 数据链路层设备","topic":"网桥在数据链路层扩展以太网，按目的地址与转发表决定转发或丢弃，不会合并原有冲突域","level":"l3","title":"网桥的基本概念","answer":"【结论】使用集线器在物理层扩展以太网会形成更大的冲突域，为避免这一问题，早期采用网桥在数据链路层扩展以太网，此时原来的每个以太网称为一个网段。\n1. 关键性质：使用网桥扩展时，不会将原本独立的两个冲突域合并成一个更大的冲突域。\n2. 原因：网桥具有识别帧和转发帧的能力，它根据帧首部的目的地址及自身的帧转发表，决定是转发还是丢弃所收到的帧，从而有效过滤通信量。\n3. 与集线器的对比：集线器工作在物理层，只对电信号放大再生，无法识别 MAC 地址，因此既不隔离冲突域也不隔离广播域；网桥工作在数据链路层，能隔离冲突域但不能隔离广播域。\n4. 现状：网桥是早期的数据链路层设备，现已被以太网交换机取代，最新大纲中已将其删除，但它是理解交换机的基础。\n背诵要点：网桥等于数据链路层的中继，能隔离冲突域、不能隔离广播域；它的判断依据是帧首部的目的地址加自身的帧转发表，不是 IP 地址。","keywords":["网桥","冲突域","网段","帧转发表","集线器","广播域"],"source":"王道2027版 印刷页 117-118（PDF p129-130）","status":"final"},{"id":"net-ch3-3.8-002","chapter":"第3章 数据链路层","subject":"net","section":"3.8 数据链路层设备","topic":"交换机是多端口网桥，每个端口独立信道、独占带宽，端口直连主机时全双工且无须 CSMA/CD","level":"l1","title":"以太网交换机的原理与特点","answer":"【结论】以太网交换机也称二层交换机，其中二层指其工作在数据链路层；从实质上讲它是一个多端口的网桥，能够将网络划分为多个较小的冲突域，从而为每个用户提供更高的带宽。\n1. 与共享式以太网的对比：在使用集线器构建的传统共享式以太网中，所有用户共享同一传输介质，例如在 10Mb/s 网络中若有 N 个用户，则每个用户的平均可用带宽仅为总带宽的 N 分之一，且通信过程中极易发生冲突。\n2. 交换式以太网的优势：每个端口提供独立的信道，主机通信时独占端口带宽，无须与其他用户竞争介质，因此一台有 N 个端口的交换机的总吞吐容量可达 N 乘以 10Mb/s。\n3. 特点一：当交换机端口直接连接主机或其他交换机时，通常工作在全双工方式。\n4. 特点二：交换机具有并行性，可同时连通多对端口，使每对通信主机都能无冲突地传输数据，因此无须使用 CSMA/CD 协议。\n5. 特点三：当交换机端口连接集线器时，由于集线器连接的所有设备均处于同一冲突域中，必须使用 CSMA/CD 协议，且只能工作在半双工方式。\n6. 特点四：交换机是一种即插即用设备，其内部的帧转发表是通过自学习算法，基于网络中各主机间的实际通信自动建立和更新。\n7. 特点五：交换机采用专用交换结构芯片，因此交换速率较高。\n背诵要点：交换机等于多端口网桥，端口直连主机时全双工不用 CSMA/CD，端口接集线器时才退回半双工并启用 CSMA/CD；N 个端口的总吞吐可达 N 倍单口带宽，这正是它胜过集线器的根本原因。","keywords":["以太网交换机","多端口网桥","冲突域","全双工","并行性","即插即用"],"source":"王道2027版 印刷页 118（PDF p130）","status":"final"},{"id":"net-ch3-3.8-003","chapter":"第3章 数据链路层","subject":"net","section":"3.8 数据链路层设备","topic":"直通交换只读目的 MAC 地址就转发、时延小但不检错，存储转发先收完整个帧再检错转发、可靠但时延大","level":"l2","title":"直通交换与存储转发","answer":"【结论】以太网交换机主要采用两种交换模式，即直通交换方式和存储转发交换方式。\n1. 直通交换方式：接收到帧的目的 MAC 地址后立即决定转发端口，无须等待整个帧接收完毕；该方式的转发时延非常小，缺点是不进行差错检测，因此可能将一些无效帧转发给其他站。\n2. 直通交换的适用范围：不适用于需要速率匹配、协议转换或差错检测的场景。\n3. 存储转发交换方式：先完整接收并缓存整个帧，然后检查帧是否正确，可能还需要进行速率匹配或协议转换，若帧正确则根据目的 MAC 地址转发，若帧出错则直接丢弃。\n4. 存储转发的优缺点：优点是可靠性高，且支持不同速率端口之间的通信；缺点是转发时延较大。\n5. 端口配置：交换机通常配备多种速率的端口，如 10Mb/s、100Mb/s 端口，以及多速率自适应端口。\n6. 时延估算：直通交换引入的转发时延至少为读取目的 MAC 地址所需的时间，即 6B 的发送时间；存储转发引入的转发时延至少为读取整个帧的时间。\n背诵要点：直通是看个地址就走、时延小但不检错；存储转发是收全了再查、可靠还能速率匹配但时延大；算直通时延就是算 6B 在端口速率下的发送时间。","keywords":["直通交换","存储转发","转发时延","差错检测","速率匹配"],"source":"王道2027版 印刷页 118（PDF p130）","status":"final"},{"id":"net-ch3-3.8-004","chapter":"第3章 数据链路层","subject":"net","section":"3.8 数据链路层设备","topic":"交换机先学习源 MAC 与入端口的映射，再查表决定精准转发、未知单播泛洪或广播泛洪","level":"l1","title":"交换机的自学习与转发","answer":"【结论】以太网交换机的转发和过滤决策基于帧的 MAC 地址，其中过滤是指决定是否丢弃一个帧，转发则是指决定将帧从哪个端口送出，这两项功能依赖于交换机的交换表。\n1. 交换表的表项：每个表项至少包含两个字段，即主机的 MAC 地址和该主机所连接的交换机端口号。\n2. 步骤一学习源地址：交换机读取帧的源 MAC 地址，并将该 MAC 地址与入端口写入或更新到交换表，这一过程称为自学习，可使交换机动态掌握各主机的连接位置。\n3. 步骤二查看目的地址：交换机解析帧的目的 MAC 地址，并根据其类型即单播、广播或组播采取相应的转发策略。\n4. 单播帧的已知目的地址：在交换表中找到对应表项时，仅从该表项所指端口转发，实现精准交付。\n5. 单播帧的未知目的地址：未找到对应表项时执行未知单播帧泛洪，即将帧从除接收端口外的所有其他活动端口转发出去。\n6. 广播帧：目的 MAC 地址为 FF:FF:FF:FF:FF:FF 时，交换机不查询转发表，直接将帧泛洪到除接收端口外的所有其他活动端口。\n7. 组播帧：目的地址为组播 MAC 地址时，交换机通常也默认执行泛洪处理。\n8. 表项老化：由于网络中的主机会动态变化，每个表项均设有老化时间，超时未更新的表项会被自动删除。\n背诵要点：自学习学的是源 MAC 加进入的端口，转发看的是目的 MAC；查不到就泛洪、查到就单播、广播帧直接泛洪；交换表靠老化时间自动清理。","keywords":["自学习","交换表","泛洪","源MAC地址","目的MAC地址","老化时间"],"source":"王道2027版 印刷页 118-119（PDF p130-131）","status":"final"},{"id":"net-ch3-3.8-005","chapter":"第3章 数据链路层","subject":"net","section":"3.8 数据链路层设备","topic":"共享式以太网用集线器、半双工、带宽共享、单一冲突域，交换式以太网用交换机、全双工、带宽独占","level":"l2","title":"共享式与交换式以太网对比","answer":"【结论】共享式以太网是指以集线器为中心连接设备构建的局域网，所有主机通过双绞线接入集线器，共享同一物理传输介质和总带宽。\n1. 工作在物理层：集线器仅对电信号进行放大和再生，不具备帧解析能力，无法识别 MAC 地址，也无任何智能转发或过滤功能。\n2. 半双工与 CSMA/CD：由于介质共享，任意时刻只能有一对主机成功通信，其他发送尝试将引发冲突，必须依赖 CSMA/CD 协议进行冲突检测与退避。\n3. 单一冲突域与广播域：所有主机处于同一个冲突域和同一个广播域内。\n4. 带宽共享效率低下：若网络中有 N 台主机，则每台主机的平均带宽仅为总带宽的 N 分之一。\n5. 盲目广播所有帧：集线器将收到的帧无差别地转发至所有其他端口，各主机需自行判断是否接收，不仅浪费带宽，还存在通信隐私泄露的风险。\n6. 交换式以太网：工作在数据链路层，默认全双工，带宽独占，全双工下不使用 CSMA/CD 协议，安全性较高。\n7. 广播帧的处理对比：共享式以太网是物理层盲目复制，交换式以太网是数据链路层有意识洪泛，两者效果相同但原理不同。\n8. 多对主机同时通信的对比：共享式以太网必然发生冲突，需执行 CSMA/CD 的退避重传机制；交换式以太网支持多对端口并行交互，各对通信互不干扰。\n9. 冲突域与广播域：集线器既不隔离广播域也不隔离冲突域，而交换机不隔离广播域但隔离冲突域；只有网络层设备路由器既能分割冲突域又能分割广播域。\n背诵要点：共享式等于物理层加半双工加共享带宽加单一冲突域，交换式等于数据链路层加全双工加独占带宽加多冲突域；记住隔离能力的阶梯——集线器啥都不隔离、交换机只隔离冲突域、路由器两个都隔离。","keywords":["共享式以太网","交换式以太网","集线器","冲突域","广播域","全双工"],"source":"王道2027版 印刷页 120（PDF p132）","status":"final"},{"id":"net-ch3-3.9-001","chapter":"第3章 数据链路层","subject":"net","section":"3.9 本章小结及疑难点","topic":"接收窗口为 1 时若发送窗口取满 2 的 n 次方，新旧帧序号完全重叠导致接收方无法区分","level":"l2","title":"连续 ARQ 发送窗口的上限","answer":"【结论】在连续 ARQ 协议中，若接收窗口大小为 1，则发送窗口大小不得超过 2 的 n 次方减 1，否则将导致新帧与重传帧无法区分，造成数据错误。\n1. 前提：用 n 比特进行编号，可表示从 0 到 2 的 n 次方减 1 共 2 的 n 次方个不同序号；以 3 比特为例，可表示 0 到 7 共 8 个序号。\n2. 反设发送窗口为 8：发送方一次性发出 0 到 7 号帧后暂停。\n3. 情形一：若所有确认都成功返回，发送方将接着发送下一轮序号为 0 到 7 的新帧。\n4. 情形二：若所有确认都丢失，发送方超时后会重传原来的 0 到 7 号旧帧。\n5. 歧义所在：由于接收窗口为 1，接收方只根据序号判断是否接收，无法区分收到的 0 到 7 是新帧还是重传帧；若把重传帧误认为新数据，就会造成重复或错误。\n6. 结论的得出：因此发送窗口不能等于 8，只要将其限制为 7，就能保证已发送未确认的帧和未来新帧的序号不会完全重叠，从而避免歧义。\n背诵要点：口诀是接收窗口为 1 时发送窗口不超过 2 的 n 次方减 1；理解的关键是确认全丢时新旧帧序号撞车，只要序号集合不完全重叠就不会认错。","keywords":["连续ARQ","发送窗口","接收窗口","帧编号","2的n次方减1"],"source":"王道2027版 印刷页 126（PDF p138）","status":"final"},{"id":"net-ch3-3.9-002","chapter":"第3章 数据链路层","subject":"net","section":"3.9 本章小结及疑难点","topic":"链路层可靠无法保证端到端可靠，且现代链路误码率极低，PPP 采取有错即弃、可靠由上层负责的设计","level":"l2","title":"PPP 为何不做可靠传输","answer":"【结论】PPP 不使用帧序号和确认机制主要有两方面原因。\n1. 原因一：在因特网中 PPP 承载的是 IP 数据报，即使链路层实现可靠传输，数据在路由器的网络层仍可能因拥塞被丢弃，因此链路层的可靠性无法保证端到端可靠交付。\n2. 原因二：现代物理链路误码率很低，若引入重传和确认机制，只会增加开销和延迟，得不偿失。\n3. PPP 的实际做法：通过 FCS 字段对每帧做 CRC 校验，发现差错立即丢弃，绝不向上层传递错误数据。\n4. 差错恢复的归属：真正的差错恢复由高层协议如 TCP 在端到端基础上完成。\n5. 设计哲学：PPP 采用有错即弃、可靠由上层负责的设计，既轻量高效，又符合端到端原则。\n背诵要点：两个理由是链路层可靠管不到端到端、现代链路误码率已经很低；PPP 只做检错不做纠错，纠错甩给 TCP，这就是端到端原则在链路层的体现。","keywords":["PPP","可靠传输","CRC校验","端到端原则","FCS"],"source":"王道2027版 印刷页 126（PDF p138）","status":"final"},{"id":"net-ch3-3.9-003","chapter":"第3章 数据链路层","subject":"net","section":"3.9 本章小结及疑难点","topic":"帧的前 2τ 内未冲突说明首部已到达所有节点、其他节点侦听到载波保持沉默，信道已被该帧占据","level":"l1","title":"冲突窗口与后续不再冲突","answer":"【结论】在 CSMA/CD 协议机制下，节点发送前先侦听信道，仅在空闲时开始发送；冲突窗口是检测冲突的最晚时限，若存在冲突，最迟会在该时间内被发送方感知。\n1. 前提假设：假设节点 A 开始发送帧，帧的前 2τ 内未检测到冲突，其中 τ 为信号从 A 到最远节点的传播时延。\n2. 推论一：此时帧的首部已到达所有其他节点。\n3. 推论二：其他节点在侦听到信道忙后，不会启动新发送。\n4. 结论：只要在冲突窗口内未发生冲突，此后信道已被该帧占据，其他节点将持续侦听到载波而保持沉默，不可能再产生新冲突。\n5. 与最短帧长的呼应：这正是以太网规定最短帧长的原因——若帧太短，发送方可能在冲突信号返回之前就发完了整帧，从而漏判冲突。\n背诵要点：两条推理链是首部已到所有节点、其他节点听到载波不敢发；这句话是 64B 最短帧长的理论依据，答题时要能把它和最短帧长公式连起来。","keywords":["冲突窗口","CSMA/CD","载波监听","争用期","最短帧长"],"source":"王道2027版 印刷页 126（PDF p138）","status":"final"},{"id":"net-ch3-3.9-004","chapter":"第3章 数据链路层","subject":"net","section":"3.9 本章小结及疑难点","topic":"速率提高 10 倍后帧发送时间缩短为十分之一，100Base-T 用缩短网段长度和缩小帧间间隔两项调整补偿","level":"l3","title":"提速后维持 CSMA/CD 的调整","answer":"【结论】由于 CSMA/CD 协议要求最短帧的发送时间不小于冲突窗口即 2τ，当速率提高 10 倍后，若网段长度不变，信号传播时延 τ 不变，但发送同样长度帧的时间缩短为原来的十分之一，则无法保证在冲突窗口内完成发送，导致冲突无法被检测。\n1. 调整一：将网段最大长度从 500m 减小到 100m，以缩短传播时延 τ。\n2. 调整二：将帧间最小间隔从 9.6μs 缩减为 0.96μs，以匹配更高传输速率。\n3. 调整的效果：这两项调整使最短帧 64B 的发送时间不小于冲突窗口，以维持 CSMA/CD 协议正常工作。\n4. 延伸对照：10 吉比特以太网则干脆只工作在全双工模式，从根上取消争用，因此无须使用 CSMA/CD 协议。\n背诵要点：两个补偿手段是网段从 500m 缩到 100m、帧间间隔从 9.6μs 缩到 0.96μs，都是为了保住最短帧长 64B 与争用期的匹配关系；再往上提速就靠全双工取消争用。","keywords":["100Base-T","争用期","网段长度","帧间最小间隔","最短帧长"],"source":"王道2027版 印刷页 126（PDF p138）","status":"final"},{"id":"net-ch3-3.9-005","chapter":"第3章 数据链路层","subject":"net","section":"3.9 本章小结及疑难点","topic":"本章易混点的系统归纳，涵盖最短帧长两个算法、各类设备的隔离能力、CD 与 CA 的场景差异和三种帧格式","level":"l2","title":"本章易混淆考点归纳","answer":"【结论】本章最容易混淆的几组考点集中在最短帧长、冲突域与广播域、CSMA/CD 与 CSMA/CA 三处，考前必须逐条厘清。\n1. 最短帧长要分清两个公式：CSMA/CD 下最短帧长等于 2 乘以最大单向传播时延再乘以数据传输速率；而以太网帧数据字段的最小长度 46B 等于 64B 减 18B，别把帧长和数据字段长度混用。\n2. 冲突域与广播域要分清设备能力：物理层设备中继器和集线器既不隔离冲突域也不隔离广播域；数据链路层设备网桥和交换机隔离冲突域但不隔离广播域；网络层设备路由器两者都隔离。\n3. CSMA/CD 与 CSMA/CA 要分清适用场景：CD 用于总线形有线以太网，靠检测电压变化判断冲突、边发边听；CA 用于无线局域网，靠能量检测与载波侦听判断信道忙闲、先打招呼再发数据。\n4. 带宽要分清共享与独占：共享式以太网中 N 个用户平均带宽为总带宽的 N 分之一；交换式以太网中每个端口独占带宽，N 端口交换机的总吞吐可达 N 倍单口带宽。\n5. 帧格式要分清三种：以太网 V2 帧数据字段 46 到 1500B、FCS 4B；802.1Q 帧数据字段 42 到 1500B、多出 4B 标签、最大帧长 1522B；PPP 帧信息字段 0 到 1500B、FCS 仅 2B。\n背诵要点：三组对照必须背成条件反射——设备隔离能力的阶梯、两种最短帧长算法、CD 与 CA 的场景差异；再记住三种帧格式里数据字段的最小值与 FCS 长度。","keywords":["易混点","最短帧长","冲突域","广播域","CSMA/CD","CSMA/CA","帧格式"],"source":"王道2027版 印刷页 126（PDF p138）","status":"final"},{"id":"net-ch4-4.1-001","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"网络层在 TCP/IP 体系中的定位，以及分组转发与路由选择两大功能的区别","level":"l1","title":"网络层的两大功能","answer":"【结论】网络层提供主机到主机的通信服务，主要任务是把分组从源主机经多个网络和多段链路传到目的主机，该任务可划分为分组转发和路由选择两种重要功能。\n1. 分组转发（数据平面）：单个路由器根据转发表把到达的分组从合适的输出端口转发出去，是局部动作。\n2. 路由选择（控制平面）：多个路由器协同运行路由协议，通过定期与相邻路由器交换信息获取网络拓扑变化，动态生成并维护路由表，算出到目的网络的最优路径。\n3. 两种服务主张：OSI 参考模型曾主张网络层使用面向连接的虚电路服务，认为应由网络自身保证通信可靠性；TCP/IP 体系的网络层提供无连接的数据报服务，核心思想是由用户主机保证通信可靠性。\n4. 在 TCP/IP 体系中，网络层向上只提供简单灵活、无连接、尽最大努力交付的数据报服务，分组可能出错、丢失、重复或失序，换来的好处是路由器可以做得比较简单且价格低廉，可靠性交给传输层负责。\n易错：网络层是主机到主机，传输层才是进程到进程；尽最大努力交付不等于可靠交付。\n背诵要点：转发看一台路由器，路由选择看一群路由器；网络层只管把分组送到主机门口。","keywords":["网络层功能","分组转发","路由选择","数据报服务","虚电路服务"],"source":"王道2027版 印刷页 127（PDF p139）","status":"final"},{"id":"net-ch4-4.1-002","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"网络互连的中继系统分类，以及用 IP 协议屏蔽异构差异形成虚拟互连网络的思路","level":"l1","title":"异构网络互连与 IP 网络","answer":"【结论】网络互连是把两个以上的计算机网络通过中继系统连接成更大的网络系统，按所在层次中继系统分四类，真正的网络互连靠路由器，靠统一的 IP 协议形成虚拟互连网络。\n1. 物理层中继系统：转发器、集线器。\n2. 数据链路层中继系统：网桥或交换机。\n3. 网络层中继系统：路由器。\n4. 网络层以上的中继系统：网关。\n5. 用物理层或数据链路层中继系统只是把一个网络扩大了，从网络层看仍是同一个网络，一般不算网络互连；因此网络互连通常指用路由器进行网络连接和路由选择。\n6. 异构网络是指物理层、数据链路层协议可以不同，而数据链路层以上的高层协议必须相同；TCP/IP 在网络层采用标准化协议 IP，把性能各异的网络在网络层上看起来像一个统一的网络，即虚拟互连网络（IP 网络）。\n7. 好处：IP 网络上的主机通信时就好像在单个网络上通信一样，看不见互连各网络的具体异构细节，如编址方案、路由选择协议。\n易错：TCP/IP 文献里常把网络层的路由器也称为网关，这里的网关不等于网络层以上的网关。\n背诵要点：四层中继对号入座，只有路由器算真正的网络互连，IP 层化异为一。","keywords":["异构网络互连","中继系统","路由器","虚拟互连网络","IP 网络"],"source":"王道2027版 印刷页 127-128（PDF p139-140）","status":"final"},{"id":"net-ch4-4.1-003","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"虚电路服务的建立、编号、转发与五条特点","level":"l2","title":"虚电路服务的特点","answer":"【结论】虚电路是网络层提供的面向连接服务，通信前必须先建立一条逻辑连接，端到端传输路径随之固定。\n1. 三个阶段：虚电路建立、数据传输、虚电路释放。\n2. 建立时系统分配一个未使用过的虚电路号 VCID，以区别于同一节点上的其他虚电路；仅在连接建立阶段使用完整的源和目的地址，后续分组的首部只需携带虚电路号。\n3. 每个中间节点维护一个虚电路表，记录每条虚电路的 VCID 及下一跳信息，这些内容在连接建立过程中确定。\n4. 特点一：建立与释放连接开销大，不适合交互应用或少量数据交换，适合长时间或大量数据交换。\n5. 特点二：路由选择在连接建立阶段完成，建立完成后就固定了传输路径。\n6. 特点三：提供可靠、有序的分组交付，并支持端到端的流量控制。\n7. 特点四：对节点或链路故障敏感，任一故障都会导致所有经过该节点或链路的虚电路中断。\n8. 特点五：分组首部开销小，因为无须携带完整目的地址，只需携带虚电路号。\n易错：虚电路之所以是虚的，是因为这条链路并非专用，可被多条虚电路共享，也不需要为每条虚电路预分配带宽。\n背诵要点：先建路、后走号，路径固定、有序可靠、怕故障。","keywords":["虚电路","VCID","面向连接","虚电路表","分组交换"],"source":"王道2027版 印刷页 128-129（PDF p140-141）","status":"final"},{"id":"net-ch4-4.1-004","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"数据报服务无须连接、独立选路、尽最大努力交付的六条特点","level":"l1","title":"数据报服务的特点","answer":"【结论】数据报服务无连接，每个分组携带完整的源和目的地址，由中间节点独立选路转发，网络只尽最大努力交付。\n1. 无须建立连接，发送方可随时发送分组，交换节点也可随时接收并处理。\n2. 尽最大努力交付：网络不保证可靠性，分组可能丢失、出错或失序；由于每个分组独立选路，转发路径可能不同，可能导致失序到达。\n3. 分组携带完整地址：每个分组均包含完整的源地址和目的地址，以支持独立路由。\n4. 存在排队时延与丢包风险：分组在交换节点中需排队处理，网络拥塞时时延显著增加，还可能被主动丢弃。\n5. 故障适应能力强：当某节点或链路失效时，可通过更新转发表动态选择绕行路径。\n6. 资源利用率高：通信双方不独占链路，带宽等资源由多个会话共享。\n7. 好处是网络造价大大降低、运行方式灵活、能够适应多种应用，互联网能发展到今天的规模证明了这种设计思想的正确性。\n背诵要点：无连接、带全址、各自走、尽最大努力、抗故障、省资源。","keywords":["数据报服务","无连接","尽最大努力交付","独立选路","存储转发"],"source":"王道2027版 印刷页 130（PDF p142）","status":"final"},{"id":"net-ch4-4.1-005","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"数据报服务与虚电路服务在七个维度上的逐项对照","level":"l1","title":"数据报与虚电路的比较","answer":"【结论】两者在连接建立、地址形式、路由选择、分组顺序、可靠性、故障适应性、差错与流量控制七个维度上全面对立。\n1. 连接的建立：数据报不需要，虚电路必须有。\n2. 目的地址：数据报每个分组都有完整的目的地址；虚电路仅在建立连接阶段使用，之后每个分组使用长度较短的虚电路号。\n3. 路由选择：数据报每个分组独立地进行路由选择和转发；虚电路属于同一条虚电路的分组按照同一路由转发。\n4. 分组顺序：数据报不保证分组的有序到达；虚电路保证分组的有序到达。\n5. 可靠性：数据报不保证可靠通信，可靠性由用户来保证；虚电路可靠性由网络自身来保证。\n6. 对网络故障的适应性：数据报可寻找新的路径转发分组，适应能力强；虚电路所有经过故障节点的虚电路均不能正常工作。\n7. 差错处理和流量控制：数据报由用户主机进行流量控制，不保证数据报的可靠性；虚电路可由分组交换网负责，也可由用户主机负责。\n易错：说虚电路是面向连接的因而一定可靠是常见的过度推广，可靠与否取决于网络是否提供确认与重传机制。\n背诵要点：七项全反着记，数据报省连接丢可靠，虚电路费连接保可靠。","keywords":["数据报服务","虚电路服务","比较","分组顺序","可靠性"],"source":"王道2027版 印刷页 131（PDF p143）","status":"final"},{"id":"net-ch4-4.1-006","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"SDN 把控制平面集中化、数据平面分布化的核心架构","level":"l2","title":"SDN 的核心思想","answer":"【结论】SDN 的核心是控制平面与数据平面的解耦：控制平面集中化，数据平面分布式部署。\n1. 传统网络：每台路由器同时承担控制与转发功能，既运行路由协议，又维护转发表。\n2. SDN 架构：路由器仅保留数据平面功能，不再运行路由选择软件，因此彼此之间无须交换路由信息。\n3. 控制功能由一个逻辑集中式的远程控制器（通常由多个服务器协同实现）统一承担，它掌握全网拓扑及主机状态，能为每个分组计算最优转发路径，并通过 OpenFlow 等协议把流表（SDN 中的转发表）下发至各路由器。\n4. 路由器的工作因此极为简洁：接收分组、匹配流表、执行转发。\n5. SDN 并非要把整个互联网改造为集中控制模式，这显然不具有可行性；但在大型数据中心互联的广域网等特定条件下，采用 SDN 架构能显著提升网络运行效率。\n易错：SDN 的远程控制器不在 OpenFlow 交换机中，它是独立的设备。\n背诵要点：控制集中、转发分布，路由器只认流表不跑路由协议。","keywords":["SDN","控制平面","数据平面","OpenFlow","流表"],"source":"王道2027版 印刷页 131（PDF p143）","status":"final"},{"id":"net-ch4-4.1-007","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"SDN 北向、南向、东西向三类编程接口的职责划分","level":"l2","title":"SDN 的三类接口","answer":"【结论】SDN 通过标准化编程接口赋予网络可编程性，接口分北向、南向、东西向三类。\n1. 北向接口：面向上层应用提供标准化 API，支持开发者高效构建定制化网络应用，而无须关注底层转发设备的具体实现细节。\n2. 南向接口：实现控制器与转发设备之间的双向通信，通过 OpenFlow 等协议，控制器可统一管理异构硬件，并把上层应用逻辑动态下发至数据平面。\n3. 东西向接口：用于控制器集群内部通信，提升控制平面的可靠性和可拓展性。\n易错：控制器向 SDN 交换机下发流表时使用的是南向接口，不是北向接口。\n背诵要点：北向对应用、南向对设备、东西向对控制器自己。","keywords":["SDN","北向接口","南向接口","东西向接口","OpenFlow"],"source":"王道2027版 印刷页 132（PDF p144）","status":"final"},{"id":"net-ch4-4.1-008","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"SDN 的三项优势与两项挑战","level":"l3","title":"SDN 的优势与挑战","answer":"【结论】SDN 用集中控制换取全局优化和可编程性，代价是控制器成为安全与性能的单点。\n1. 优势一：集中控制与分布转发，控制平面具备全局视图，便于统一优化；数据平面分布式高速转发，保障性能。\n2. 优势二：灵活可编程性，通过标准化接口，开发者能以软件方式动态定义网络行为。\n3. 优势三：降低成本，控制与转发分离使硬件设备简化，仅需基础转发能力。\n4. 挑战一：安全风险，集中化的控制器易受攻击，一旦崩溃就会影响整个网络。\n5. 挑战二：性能瓶颈，控制功能集中化后，随着网络规模扩大，控制器可能成为网络性能的瓶颈。\n背诵要点：全局视图、可编程、便宜是优点；单点故障、单点瓶颈是代价。","keywords":["SDN","集中控制","可编程","单点故障","性能瓶颈"],"source":"王道2027版 印刷页 132（PDF p144）","status":"final"},{"id":"net-ch4-4.1-009","chapter":"第4章 网络层","subject":"net","section":"4.1 网络层的功能","topic":"拥塞的判断依据、拥塞控制与流量控制的区别，以及开环与闭环两种控制方法","level":"l3","title":"拥塞控制与流量控制","answer":"【结论】拥塞是过量分组超过网络处理能力引起的性能下降，拥塞控制是全局性过程，流量控制只是收发两端的点对点速率协调。\n1. 判断依据：若负载增大但吞吐量增长甚微，则网络可能已处于轻度拥塞状态；若负载增大但吞吐量反而下降，则网络很可能已进入拥塞状态。\n2. 拥塞控制的目标是确保网络能有效承载当前流量，这是一个全局性过程，涉及所有主机、路由器及影响网络传输能力的各类因素；仅靠增加资源无法根本解决拥塞。\n3. 流量控制用于管理发送方与接收方之间的点对点通信，核心是抑制发送方的发送速率，以确保接收方能够及时接收和处理数据。\n4. 开环控制：在系统设计时预先考虑可能导致拥塞的因素，通过静态策略防止拥塞发生；一旦投入运行就不再依赖实时反馈，典型手段包括确定何时接收新流量、何时及丢弃哪些分组、何种调度策略。\n5. 闭环控制：通过监测网络运行状态，动态检测拥塞的发生位置与程度，然后反馈至控制节点，进而调整网络运行以缓解拥塞，是基于反馈机制的方法。\n易错：吞吐量随负载增加而下降才是拥塞的标志，仅增长缓慢只是轻度拥塞。\n背诵要点：拥塞控制管全局、流量控制管两端；开环靠设计、闭环靠反馈。","keywords":["拥塞","拥塞控制","流量控制","开环控制","闭环控制"],"source":"王道2027版 印刷页 132（PDF p144）","status":"final"},{"id":"net-ch4-4.2-001","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"IPv4 首部固定部分各字段的长度、单位与作用","level":"l1","title":"IPv4 首部的整体结构","answer":"【结论】IP 分组由首部和数据部分组成，首部前一部分长度固定共 20B，其后是长度可变（1B 到 40B）的可选字段，因此首部最长 60B。\n1. 固定部分共 20B，是所有 IP 分组必须具有的；可选字段用来提供错误检测及安全等机制。\n2. 首部固定部分的字段顺序：版本、首部长度、区分服务、总长度、标识、标志、片偏移、生存时间、协议、首部检验和、源地址、目的地址。\n3. 与长度相关的字段共 3 个，基本单位各不相同：首部长度以 4B 为单位，总长度以 1B 为单位，片偏移以 8B 为单位，计算时必须注意换算。\n4. IP 首部前两个字节往往以 0x45 开头，解题时可用于定位 IP 数据报的开始位置。\n5. 理解各字段的意义和功能即可，无须死记首部格式，题目需要时通常会直接给出。\n易错：首部长度字段的值是 5 表示 5×4B=20B，不是 5B；可选字段最长 40B 是首部 60B 减去固定 20B 得到的。\n背诵要点：固定 20B、最长 60B，三个长度字段单位分别是 4B、1B、8B。","keywords":["IPv4 首部","固定部分","可选字段","20B","60B"],"source":"王道2027版 印刷页 137-138（PDF p149-150）","status":"final"},{"id":"net-ch4-4.2-002","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"版本、首部长度、总长度三个字段的位数、单位与取值上限","level":"l1","title":"版本、首部长度与总长度","answer":"【结论】版本占 4 位，首部长度占 4 位以 4B 为单位最大 60B，总长度占 16 位以 1B 为单位最大 65535B。\n1. 版本：占 4 位，表示 IP 协议的版本，IPv4 中该字段的值为 4。\n2. 首部长度：占 4 位，以 4B 为单位，可表示的最大首部长度为 60B（15×4B）；最常用的首部长度是 20B（5×4B），此时该字段的值为 5，表示不使用可选字段。\n3. IP 首部长度必须是 4B 的整数倍，若可选字段导致长度不足，则通过填充字段加以填充。\n4. 总长度：占 16 位，表示首部和数据之和的长度，以 1B 为单位，因此 IP 数据报的最大长度为 65535B。\n5. 由于以太网 MTU 为 1500B，当一个数据报封装成帧时，数据报的总长度（首部加数据）一定不能超过当前链路的 MTU。\n易错：总长度包含首部，不是只算数据部分；MTU 限制的是总长度而不是数据长度。\n背诵要点：4 位版本、4 位首部长度乘 4、16 位总长度乘 1，上限 60B 与 65535B。","keywords":["版本","首部长度","总长度","MTU","65535"],"source":"王道2027版 印刷页 138（PDF p150）","status":"final"},{"id":"net-ch4-4.2-003","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"标识、标志（DF/MF）与片偏移三个字段在分片与重组中的作用","level":"l1","title":"标识、标志与片偏移","answer":"【结论】目的主机依靠标识、标志和片偏移三个字段完成分片的重组。\n1. 标识：占 16 位，源主机用一个递增计数器为每个数据报设置标识字段，它并不是序号（因为 IP 是无连接服务）；分片时所有分片复制原始数据报的标识字段值，以便目的主机据此正确重组。\n2. 标志：占 3 位，目前只有低 2 位有意义。MF 为更多分片标志，MF=1 表示后面还有分片，MF=0 表示这是最后一个分片。\n3. DF 为不能分片标志，仅当 DF=0 时允许分片，若 DF=1 则禁止分片。\n4. 片偏移：占 13 位，以 8B 为单位，指出该分片数据部分起始位置相对于原始数据报数据部分开头的偏移量。\n5. 除最后一个分片外，其他分片的数据长度必须是 8B 的整数倍，否则偏移值不是整数。\n易错：标识不是序号；MF=1 表示“后面还有”，最后一片的 MF 必须为 0。\n背诵要点：标识认亲、MF 看后继、DF 管能否分、片偏移除 8 得偏移量。","keywords":["标识","标志","MF","DF","片偏移"],"source":"王道2027版 印刷页 138（PDF p150）","status":"final"},{"id":"net-ch4-4.2-004","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"TTL 的递减规则、初值含义与防环作用","level":"l2","title":"生存时间 TTL","answer":"【结论】TTL 占 8 位，表示数据报在网络中允许经过的路由器数的最大值，作用是防止其在网络中无限循环。\n1. 每经过一个路由器，TTL 减 1；若 TTL 被减为 0，则丢弃该数据报。\n2. 若 TTL 的初值设为 1，则该数据报仅限在本局域网内传输，因为一经路由器转发就会减为 0 而被丢弃。\n3. TTL 是 traceroute/tracert 的工作原理基础：逐步增大 TTL 值，触发沿途路由器返回 ICMP 时间超过报文，从而追踪分组经过的路由路径。\n4. 单位是“跳”（经过的路由器数），不是秒，虽然名称里带“时间”。\n易错：TTL 计的是还能经过几个路由器，不是还能活多少秒；IPv6 中改名为跳数限制，作用不变。\n背诵要点：TTL 是“还能跳几次”，减到 0 就丢包并回 ICMP 时间超过。","keywords":["TTL","生存时间","防环","traceroute","路由器"],"source":"王道2027版 印刷页 138（PDF p150）","status":"final"},{"id":"net-ch4-4.2-005","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"协议字段与首部检验和的检验范围、重算时机","level":"l2","title":"协议字段与首部检验和","answer":"【结论】协议字段占 8 位，指示数据应交付给哪个上层协议；首部检验和占 16 位，只检验首部不检验数据部分。\n1. 协议字段值为 6 表示 TCP，值为 17 表示 UDP。\n2. 首部检验和只检验首部（不含数据部分），不检验数据部分可减少计算的工作量。\n3. 数据报每经过一个路由器，首部中的某些字段（如生存时间、总长度、标志、片偏移、源/目的地址）都可能发生变化，因此路由器都要重新计算检验和。\n4. 首部检验和的计算方法与 UDP 和 TCP 检验和的计算方法类似。\n易错：IP 只校验首部，不校验数据，所以 IP 层不能保证数据部分正确，只保证首部完整性。\n背诵要点：协议号 6 走 TCP、17 走 UDP；IP 检验和只罩住首部，逐跳重算。","keywords":["协议字段","首部检验和","TCP","UDP","逐跳重算"],"source":"王道2027版 印刷页 138（PDF p150）","status":"final"},{"id":"net-ch4-4.2-006","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"MTU 限制下把 4000B 数据报分片成 1480B+1480B+1020B 的完整计算","level":"l1","title":"IP 分片计算","answer":"【结论】一个总长 4000B 的 IP 数据报（首部 20B，数据部分 3980B）转发到 MTU 为 1500B 的链路上，需划分为 3 个分片，数据部分依次为 1480B、1480B 和 1020B。\n1. 每个分片都是一个独立的 IP 数据报，均包含 20B 的 IP 首部，因此每片最多携带 1500-20=1480B 数据。\n2. 片偏移以 8B 为单位，1480÷8=185，故第一片片偏移为 0，第二片为 185，第三片为 370。\n3. 标志字段：前两片 MF=1，最后一片 MF=0；三片的 DF 均为 0（原始数据报允许分片）。\n4. 三片均复制原始数据报的标识号（例如 777），以便目的主机重组。\n5. 第三片的数据长度 1020B=3980-1480-1480，是剩余部分，不必是 8B 的整数倍。\n6. 分片只能发生在源主机或中间路由器上，而重组仅在目的主机上进行。\n易错：计算每片数据量要用 MTU 减首部 20B，不是直接用 MTU；片偏移 = 该片数据起点 ÷ 8，不是字节数本身。\n背诵要点：先减 20 得每片数据量，再除 8 得偏移，最后一片 MF=0 且可不足 8B。","keywords":["IP 分片","MTU","片偏移","MF","DF","1480"],"source":"王道2027版 印刷页 138-139（PDF p150-151）","status":"final"},{"id":"net-ch4-4.2-007","chapter":"第4章 网络层","subject":"net","section":"4.2 IPv4","topic":"IP 地址的 32 位结构、点分十进制记法与网络号主机号的两级划分","level":"l3","title":"IPv4 地址与两级结构","answer":"【结论】IP 地址是为连接到互联网上的每台主机（或路由器）的每个接口分配的一个全球唯一的 32 位标识符，由网络号和主机号两部分组成。\n1. 书写方式：把 32 位分为 4 段，每段 8 位转换为等效十进制数，用小数点分隔，称为点分十进制记法。\n2. IP 地址分配由互联网名字与数字分配机构 ICANN 统一管理。\n3. 网络号标志主机（或路由器）的接口所连接到的网络，一个网络号在整个互联网范围内必须唯一；主机号标志该主机（或路由器）的接口，一个主机号在其网络号所指的网络范围内必须唯一。\n4. 分等级地址结构的两大优势：管理机构只分配网络号，主机号由获得该网络的单位自行分配，便于地址管理；路由器转发分组时仅依据目的地址的网络号，从而显著减小路由表规模。\n5. IP 地址标识的是网络接口而非主机本身，一台主机同时连接到多个网络时必须为每个接口配置一个 IP 地址，且各地址的网络号必须不同；因此路由器至少拥有两个或更多的 IP 地址。\n6. 通过集线器或交换机连接的多个网段在逻辑上仍属于同一个网络（同一个广播域），其中所有主
