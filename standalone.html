/* =========================================================
   408 随身背诵 · style.css
   Mobile-First：先写 375px 手机布局，再用 @media (min-width:…) 增强桌面端
   规范：触控目标 ≥ 44px；无横向滚动；安全区 env(safe-area-inset-*)；
        深色 / 浅色双主题（户外可读优先，默认浅色高对比）
   ========================================================= */

/* ---------- 1. 设计令牌（颜色 / 尺寸） ---------- */
:root {
  /* 浅色主题：白底 + 深字，户外强光下可读 */
  --bg: #f2f5f9;
  --bg-elev: #ffffff;
  --bg-sunken: #e9eef5;
  --text: #12212f;
  --text-2: #46586b;
  --text-3: #6b7c8f;
  --border: #d5dfea;
  --border-strong: #b9c8d8;

  --brand: #1f6feb;
  --brand-ink: #ffffff;
  --accent: #f0672b;

  /* 三级标签配色（列表、卡片、筛选 chip 共用） */
  --l1-bg: #fde7e6;
  --l1-fg: #b81f1a;
  --l1-line: #e8544d;
  --l2-bg: #e3eefc;
  --l2-fg: #14509c;
  --l2-line: #2f7be4;
  --l3-bg: #e8ecf1;
  --l3-fg: #4b5a69;
  --l3-line: #8e9dac;

  --hl-bg: #ffe86b;
  --hl-fg: #3a2b00;
  --shadow-1: 0 1px 2px rgba(18, 33, 47, .08), 0 2px 8px rgba(18, 33, 47, .06);
  --shadow-2: 0 6px 24px rgba(18, 33, 47, .16);

  /* 触控与文本尺寸 */
  --touch: 44px;
  --tap: 44px;
  --radius: 14px;
  --radius-sm: 10px;
  --topbar-h: 0px; /* JS 实测顶部栏高度写入，用于锚点偏移 */
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);

  /* 三档自评配色：底色不透明 + 文字高对比，保证任何主题下都 ≥4.5:1 */
  --rate-known-bg: #e3f6ec;
  --rate-known-fg: #14603f;
  --rate-known-line: #2f9e6b;
  --rate-fuzzy-bg: #fdf1d8;
  --rate-fuzzy-fg: #7a4c06;
  --rate-fuzzy-line: #d08a1e;
  --rate-unknown-bg: #fbe4e3;
  --rate-unknown-fg: #9b1c17;
  --rate-unknown-line: #d84a43;

  color-scheme: light;
}

/* 深色主题：夜间 / 省电 */
html[data-theme="dark"] {
  --bg: #0e141b;
  --bg-elev: #17202b;
  --bg-sunken: #101821;
  --text: #e8eef6;
  --text-2: #b3c1d1;
  --text-3: #8b9aab;
  --border: #26333f;
  --border-strong: #36475a;

  --brand: #4d9bff;
  --brand-ink: #07121f;
  --accent: #ff8a4c;

  --l1-bg: #4a1b1b;
  --l1-fg: #ffb3ae;
  --l1-line: #ff6b63;
  --l2-bg: #14304f;
  --l2-fg: #a9cdfd;
  --l2-line: #5aa2f5;
  --l3-bg: #26313d;
  --l3-fg: #c2ccd7;
  --l3-line: #8e9dac;

  --hl-bg: #ffd24a;
  --hl-fg: #201800;
  /* 暗色主题下三档自评：深底 + 亮字，实测 ≥7:1 */
  --rate-known-bg: #0f3527;
  --rate-known-fg: #8ff0bf;
  --rate-known-line: #2f9e6b;
  --rate-fuzzy-bg: #3a2a0c;
  --rate-fuzzy-fg: #ffd28a;
  --rate-fuzzy-line: #d08a1e;
  --rate-unknown-bg: #40191a;
  --rate-unknown-fg: #ffb0aa;
  --rate-unknown-line: #ff6b63;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-2: 0 8px 28px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- 2. 基础重置 ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--topbar-h) + 8px);
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  /* 防止任何元素撑出横向滚动 */
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .92em; }

/* 焦点可见性（键盘用户） */
:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 100;
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--brand); color: var(--brand-ink); text-decoration: none;
  transition: top .15s ease;
}
.skip-link:focus { top: calc(var(--safe-t) + 8px); }

/* ---------- 3. 顶部栏（sticky） ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: calc(var(--safe-t) + 6px) calc(var(--safe-r) + 10px) 8px calc(var(--safe-l) + 10px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
}
/* 不支持 color-mix 的旧浏览器回退为不透明背景 */
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .topbar { background: var(--bg); }
}

.topbar__row {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: var(--touch);
}

/* 通用图标按钮：始终 ≥ 44×44 */
.icon-btn {
  flex: 0 0 auto;
  width: var(--tap);
  height: var(--tap);
  min-width: var(--tap);
  min-height: var(--tap);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  transition: background-color .15s ease;
}
.icon-btn:active { background: var(--bg-sunken); }

/* 汉堡图标（三条线） */
.hamburger,
.hamburger::before,
.hamburger::after {
  display: block;
  width: 20px;
  height: 2px;
  border-radius: 2px;
  background: var(--text);
  content: "";
  position: relative;
}
.hamburger::before { position: absolute; top: -6px; }
.hamburger::after  { position: absolute; top: 6px; }

.brand {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  overflow: hidden;
}
.brand__title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
}
.brand__sub {
  font-size: 12px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 搜索框 */
.searchbar {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 6px;
  background: var(--bg-elev);
  border: 1.5px solid var(--border-strong);
  border-radius: 12px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.searchbar:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
}
.searchbar__icon {
  padding: 0 4px 0 12px;
  font-size: 15px;
  opacity: .75;
}
.searchbar__input {
  flex: 1 1 auto;
  min-width: 0;
  height: var(--touch);
  padding: 0 8px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 16px; /* ≥16px 防止 iOS 聚焦时自动缩放 */
  outline: none;
}
.searchbar__input::placeholder { color: var(--text-3); }
.searchbar__input::-webkit-search-cancel-button { -webkit-appearance: none; }

.searchbar__clear {
  flex: 0 0 auto;
  width: var(--tap);
  height: var(--tap);
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: 17px;
  cursor: pointer;
}

/* 分级筛选 + 视图切换 */
.toolbar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}

.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  /* 触控目标 ≥ 44px（iOS HIG / 任务单硬性要求） */
  min-height: var(--tap);
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: 999px;
  background: var(--bg-elev);
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.chip.is-active { color: var(--text); border-color: var(--text); }
.chip--all.is-active { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip--l1.is-active { background: var(--l1-bg); color: var(--l1-fg); border-color: var(--l1-line); }
.chip--l2.is-active { background: var(--l2-bg); color: var(--l2-fg); border-color: var(--l2-line); }
.chip--l3.is-active { background: var(--l3-bg); color: var(--l3-fg); border-color: var(--l3-line); }

/* 科目 chips：比分级 chips 更「重」，因为它是整页范围的切换 */
.chips--subject {
  margin-bottom: 6px;
  padding-bottom: 4px;
}
.chips--subject .chip {
  font-size: 13px;
  font-weight: 700;
  min-height: 36px;
  padding: 6px 13px;
  background: var(--bg);
  border-style: dashed;
}
.chips--subject .chip.is-active {
  background: var(--accent, #2f6fed);
  color: #fff;
  border-color: var(--accent, #2f6fed);
  border-style: solid;
}

.viewtabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--bg-sunken);
  border-radius: 12px;
}
.viewtab {
  min-height: var(--touch);
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-2);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.viewtab.is-active {
  background: var(--bg-elev);
  color: var(--text);
  box-shadow: var(--shadow-1);
}

/* ---------- 4. 主区域 ---------- */
.main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 32px) calc(var(--safe-l) + 12px);
}

/* 加载 / 错误状态 */
.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 48px 16px;
  color: var(--text-2);
  text-align: center;
}
.state__title { font-size: 17px; font-weight: 700; color: var(--text); }
.state__hint { font-size: 13.5px; color: var(--text-3); max-width: 34em; }
.state--error code {
  background: var(--bg-sunken);
  padding: 1px 5px;
  border-radius: 5px;
}

.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
}

/* ---------- 5. 考点列表 ---------- */
.listhead { margin-bottom: 8px; }
.listhead__meta {
  font-size: 13px;
  color: var(--text-3);
}

/* 章 / 节 折叠面板 */
.panel {
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elev);
  overflow: hidden;
}

.panel__toggle {
  display: flex;
  align-items: center;
  /* 章名 + 考向徽章 + 计数在 375px 下会超行 → 允许换行，计数用 margin-left:auto 保持靠右 */
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  min-height: calc(var(--touch) + 4px);
  padding: 10px 14px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.panel__toggle:active { background: var(--bg-sunken); }

.panel__caret {
  flex: 0 0 auto;
  width: 16px;
  color: var(--text-3);
  font-size: 12px;
  transition: transform .2s ease;
}
.panel__toggle[aria-expanded="true"] .panel__caret { transform: rotate(90deg); }

.panel__name { flex: 1 1 auto; min-width: 0; }
.panel__count {
  flex: 0 0 auto;
  margin-left: auto;   /* 换行后依然贴右 */
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  background: var(--bg-sunken);
  border-radius: 999px;
  padding: 2px 8px;
}

.panel__items {
  border-top: 1px solid var(--border);
}
.panel__items[hidden] { display: none; }

/* 二级：节标题（可点击折叠） */
.sec { display: block; }
.sec__items { border-top: 0; }
.sec__items[hidden] { display: none; }

.sec__row {
  display: flex;
  align-items: stretch;
}

.sec__label {
  position: sticky;
  top: 0;
  z-index: 1;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: var(--touch);
  padding: 7px 8px 7px 14px;
  border: 0;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--text-3);
  background: var(--bg-sunken);
  text-align: left;
  cursor: pointer;
}
.sec__label:active { background: var(--bg-elev); }

.sec__caret {
  flex: 0 0 auto;
  width: 14px;
  font-size: 10px;
  transition: transform .2s ease;
}
.sec__label[aria-expanded="true"] .sec__caret { transform: rotate(90deg); }

.sec__name { flex: 1 1 auto; min-width: 0; }

.sec__count {
  flex: 0 0 auto;
  margin-left: auto;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
  background: var(--bg-elev);
  border-radius: 999px;
  padding: 1px 7px;
}

.sec__label--m { border-radius: 0; }

.sec__forget {
  flex: 0 0 auto;
  width: 44px;
  border: 0;
  border-left: 1px solid var(--border);
  background: var(--bg-sunken);
  font-size: 15px;
  cursor: pointer;
  color: var(--text-3);
}
.sec__forget:active { background: var(--bg-elev); }

/* 考点行 */
.topic {
  display: block;
  border-top: 1px solid var(--border);
  scroll-margin-top: calc(var(--topbar-h) + 60px);
}
.sec__label + .topic { border-top: 0; }
.sec__items > .topic:first-child { border-top: 0; }
.topic__head {
  display: flex;
  align-items: stretch;
}
.topic__jump {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 11px 8px 11px 14px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.topic__jump:active { background: var(--bg-sunken); }
.topic__title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--text);
  overflow-wrap: anywhere;
}
.topic__path {
  font-size: 11.5px;
  color: var(--text-3);
}

/* 右侧「背诵」快捷按钮 */
.topic__drill {
  flex: 0 0 auto;
  width: var(--tap);
  margin: 4px 4px 4px 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-3);
  font-size: 17px;
  cursor: pointer;
}
.topic__drill:active { background: var(--bg-sunken); }

/* 列表内展开的答案 */
.topic__answer {
  padding: 0 14px 14px;
  font-size: 14.5px;
  color: var(--text-2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  border-left: 3px solid var(--border);
  margin: 0 14px 12px;
  padding-left: 10px;
}
.topic.is-open > .topic__answer { display: block; }
.topic__source {
  display: block;
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--text-3);
}
.topic.is-open .topic__jump { background: var(--bg-sunken); }

/* 搜索命中高亮 */
mark.hl {
  background: var(--hl-bg);
  color: var(--hl-fg);
  border-radius: 3px;
  padding: 0 1px;
}

/* 空结果提示 */
.empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--text-2);
}
.empty__title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.empty__hint { font-size: 13.5px; color: var(--text-3); }
.empty__q {
  display: inline-block;
  max-width: 100%;
  margin: 0 2px;
  padding: 0 6px;
  border-radius: 5px;
  background: var(--bg-sunken);
  color: var(--text);
  overflow-wrap: anywhere;
}

/* ---------- 6. 分级标签 ---------- */
.lvl {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}
.lvl--l1 { background: var(--l1-bg); color: var(--l1-fg); border-color: var(--l1-line); }
.lvl--l2 { background: var(--l2-bg); color: var(--l2-fg); border-color: var(--l2-line); }
.lvl--l3 { background: var(--l3-bg); color: var(--l3-fg); border-color: var(--l3-line); }

/* 列表行左侧色条：一眼看出分级 */
.topic--l1 { box-shadow: inset 3px 0 0 var(--l1-line); }
.topic--l2 { box-shadow: inset 3px 0 0 var(--l2-line); }
.topic--l3 { box-shadow: inset 3px 0 0 var(--l3-line); }
.topic.is-open.topic--l1 > .topic__answer { border-left-color: var(--l1-line); }
.topic.is-open.topic--l2 > .topic__answer { border-left-color: var(--l2-line); }
.topic.is-open.topic--l3 > .topic__answer { border-left-color: var(--l3-line); }

/* ---------- 7. 抽卡背诵 ---------- */
.cardfilter {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.cardfilter__label {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
}
.select {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--touch);
  padding: 8px 10px;
  border: 1.5px solid var(--border-strong);
  border-radius: 12px;
  background: var(--bg-elev);
  color: var(--text);
  font-size: 15px;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
                    linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 34px;
  cursor: pointer;
}

.cardmeta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text-3);
}
.cardmeta__pos { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.cardmeta__scope {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}

/* 3D 舞台 */
.cardstage {
  perspective: 1400px;
}
.flipcard {
  position: relative;
  width: 100%;
  /* 手机高度自适应，保底可用 */
  height: clamp(340px, 56vh, 520px);
  cursor: pointer;
  touch-action: manipulation;
  transition: height .2s ease;
}
/* 翻到背面：答案长短不一，高度随内容自适应。
   手机上看全答案 > 保留翻转动画，所以背面不再走 3D 固定高度，改成淡入展开。 */
.flipcard.is-flipped {
  height: auto;
}
.flipcard.is-flipped .flipcard__inner {
  height: auto;
  transform: none;
  transition: none;
}
.flipcard.is-flipped .flipcard__face--front {
  display: none;
}
.flipcard.is-flipped .flipcard__face--back {
  position: relative;
  inset: auto;
  transform: none;
  animation: face-in .16s ease;
}
@keyframes face-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
/* 背面展开后不再需要内部滚动条，内容整页往下排 */
.flipcard.is-flipped .flipcard__body--scroll {
  overflow: visible;
}
.flipcard__inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.2, .7, .2, 1);
}
/* 翻面不再用 3D 旋转：背面高度随答案自适应，走 is-flipped 的淡入展开（见上方规则） */

.flipcard__face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--bg-elev);
  box-shadow: var(--shadow-1);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.flipcard__face--back {
  transform: rotateY(180deg);
  /* 背面底色略作区分，深色下依然高对比 */
  background: color-mix(in srgb, var(--bg-elev) 94%, var(--brand));
}
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .flipcard__face--back { background: var(--bg-elev); }
}

.flipcard__badges {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.flipcard__badge {
  font-size: 11.5px;
  color: var(--text-2);
  background: var(--bg-sunken);
  border-radius: 999px;
  padding: 2px 9px;
  overflow-wrap: anywhere;
}
.flipcard__badge--draft {
  color: var(--accent);
  border: 1px dashed var(--accent);
  background: transparent;
}

.flipcard__body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  /* 正面标题过长时允许滚动 */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.flipcard__body--scroll { justify-content: flex-start; }

.flipcard__prompt {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text-3);
}
.flipcard__title {
  font-size: clamp(19px, 5.4vw, 26px);
  line-height: 1.4;
  font-weight: 800;
  color: var(--text);
  overflow-wrap: anywhere;
}
.flipcard__title--small {
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 700;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border-strong);
}

.flipcard__kw {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.flipcard__kw li {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--text-2);
}

.flipcard__answer {
  font-size: 15px;
  line-height: 1.75;
  color: var(--text);
  overflow-wrap: anywhere;
}
/* 答案排版：由 app.js 的 richAnswer() 生成结构化块（2026-10-25 重做） */
.flipcard__answer strong {
  font-weight: 800;
  color: var(--text);
  background: linear-gradient(transparent 62%, var(--hl-bg) 62%, var(--hl-bg) 92%, transparent 92%);
}

/* 段落 */
.flipcard__answer .ans-p {
  margin: 0 0 10px;
}
.flipcard__answer .ans-p:last-child {
  margin-bottom: 0;
}

/* 【小标题】正文 —— 左侧竖线 + 标签胶囊 */
.flipcard__answer .ans-sec {
  margin: 0 0 12px;
  padding: 8px 0 8px 11px;
  border-left: 3px solid var(--accent, #4a7cff);
  background: linear-gradient(90deg, rgba(74, 124, 255, 0.06), transparent 70%);
  border-radius: 0 8px 8px 0;
}
.flipcard__answer .ans-sec:last-child {
  margin-bottom: 0;
}
.flipcard__answer .ans-tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #fff;
  background: var(--accent, #4a7cff);
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 6px;
}
.flipcard__answer .ans-sec__body {
  margin: 0;
}

/* 易错点 / 背诵要点 提示块 */
.flipcard__answer .ans-warn {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin: 0 0 12px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(255, 176, 32, 0.12);
  border: 1px solid rgba(255, 176, 32, 0.35);
}
.flipcard__answer .ans-warn__k {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 800;
  color: #b26a00;
  padding-top: 1px;
  white-space: nowrap;
}
.flipcard__answer .ans-warn__v {
  flex: 1 1 auto;
  min-width: 0;
}

/* 列表：圈号 / 数字 / 项目符号 */
.flipcard__answer .ans-ul,
.flipcard__answer .ans-ol {
  margin: 0 0 12px;
  padding-left: 0;
  list-style: none;
}
.flipcard__answer .ans-ul:last-child,
.flipcard__answer .ans-ol:last-child {
  margin-bottom: 0;
}
.flipcard__answer .ans-ul > li,
.flipcard__answer .ans-ol > li {
  position: relative;
  padding: 5px 0 5px 26px;
  border-top: 1px solid rgba(127, 127, 127, 0.14);
}
.flipcard__answer .ans-ul > li:first-child,
.flipcard__answer .ans-ol > li:first-child {
  border-top: 0;
}
/* 圈号行自带 ①，隐藏掉自己的小圆点避免重复 */
.flipcard__answer .ans-ul > li::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 13px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent, #4a7cff);
  opacity: 0.65;
}
/* 圈号列表本身以圈号打头时不需要小圆点 */
.flipcard__answer .ans-ul.is-circled > li::before {
  display: none;
}
.flipcard__answer .ans-ol {
  counter-reset: ansol;
}
.flipcard__answer .ans-ol > li {
  counter-increment: ansol;
}
.flipcard__answer .ans-ol > li::before {
  content: counter(ansol);
  position: absolute;
  left: 0;
  top: 7px;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  background: var(--accent, #4a7cff);
  border-radius: 6px;
}
.flipcard__source {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--text-3);
}

.flipcard__hint {
  flex: 0 0 auto;
  padding-top: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
}

/* 卡面切换时的轻微抬起反馈 */
.flipcard:active .flipcard__inner { transform: scale(.995); }
.flipcard.is-flipped:active .flipcard__inner { transform: none; }

@media (prefers-reduced-motion: reduce) {
  .flipcard__inner { transition: none; }
}

/* 低端设备降级：不用 3D 旋转，改为淡入淡出（由 app.js 视设备性能加 .no-flip）
   ⚠ 这里必须自己管住正/背面的显隐：一旦 backface-visibility 放开、背面 transform 归零，
   背面就会平铺盖在正面上（曾导致「只看到答案面、点翻转没反应」）。 */
html.no-flip .flipcard { perspective: none; }
html.no-flip .flipcard__inner { transform: none !important; transform-style: flat; }
html.no-flip .flipcard__face {
  backface-visibility: visible;
  -webkit-backface-visibility: visible;
  transition: opacity .2s ease;
}
/* 未翻转：背面彻底不可见、不可点 */
html.no-flip .flipcard__face--back {
  transform: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
/* 已翻转：正面让位，背面显形 */
html.no-flip .flipcard.is-flipped .flipcard__face--front {
  opacity: 0;
  visibility: hidden;
}
html.no-flip .flipcard.is-flipped .flipcard__face--back {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
html.no-flip .flipcard:active .flipcard__inner,
html.no-flip .flipcard.is-flipped:active .flipcard__inner { transform: none !important; }

/* 抽卡按钮区 */
.cardctl {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cardctl__row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.btn {
  min-height: var(--touch);
  min-width: var(--tap);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, transform .08s ease;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn:disabled,
.btn[aria-disabled="true"] {
  opacity: .45;
  cursor: not-allowed;
  transform: none;
}
.btn--primary {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--brand-ink);
}
.btn--accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
html[data-theme="dark"] .btn--accent { color: #1a0d05; }
.btn--ghost { background: var(--bg-elev); }
.btn--block { width: 100%; }

/* ---------- 8. 抽屉目录 ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(6, 12, 20, .48);
  opacity: 0;
  transition: opacity .25s ease;
}
.scrim.is-shown { opacity: 1; }

.drawer {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  width: min(86vw, 360px);
  height: 100dvh;
  padding-top: var(--safe-t);
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  box-shadow: var(--shadow-2);
  transform: translateX(-102%);
  transition: transform .28s cubic-bezier(.2, .7, .2, 1);
  visibility: hidden;
}
.drawer.is-open { transform: translateX(0); visibility: visible; }

.drawer__head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 8px 8px calc(var(--safe-l) + 14px);
  border-bottom: 1px solid var(--border);
}
.drawer__title {
  font-size: 15px;
  font-weight: 700;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.drawer__body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px calc(var(--safe-r) + 8px) 12px calc(var(--safe-l) + 8px);
  overscroll-behavior: contain;
}

.drawer__foot {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px calc(var(--safe-r) + 10px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 10px);
  border-top: 1px solid var(--border);
}
.drawer__foot .btn { font-size: 14px; padding: 8px 10px; }

/* 抽屉内三级树 */
.tree__group { margin-bottom: 2px; }

.tree__chapter,
.tree__section {
  display: flex;
  align-items: center;
  flex-wrap: wrap;      /* 节名 + 考向徽章 + 掌握度 可能超行 */
  gap: 6px;
  width: 100%;
  min-height: var(--touch);
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;
  cursor: pointer;
  color: var(--text);
}
.tree__chapter {
  font-size: 14.5px;
  font-weight: 700;
}
.tree__section {
  padding-left: 22px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
}
.tree__chapter:active,
.tree__section:active,
.tree__topic:active { background: var(--bg-sunken); }

.tree__caret {
  flex: 0 0 auto;
  width: 14px;
  font-size: 11px;
  color: var(--text-3);
  transition: transform .2s ease;
}
.tree__chapter[aria-expanded="true"] > .tree__caret,
.tree__section[aria-expanded="true"] > .tree__caret { transform: rotate(90deg); }

.tree__name { flex: 1 1 auto; min-width: 0; }

.tree__children { overflow: hidden; }
.tree__children[hidden] { display: none; }

.tree__topics { padding-left: 12px; }

.tree__topic {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: var(--touch);
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;
  cursor: pointer;
  color: var(--text-2);
  font-size: 13.5px;
  line-height: 1.4;
}
.tree__topic .lvl {
  flex: 0 0 auto;
  padding: 0 6px;
  font-size: 10.5px;
  border-radius: 6px;
}
.tree__topic-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.tree__topic:hover,
.tree__topic.is-current { background: var(--bg-sunken); color: var(--text); }

/* ---------- 9. 页脚 ---------- */
.footer {
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--text-3);
  text-align: center;
  overflow-wrap: anywhere;
}

/* ---------- 10. 平板 / 桌面增强（Mobile-First 之上叠加） ---------- */
@media (min-width: 768px) {
  .brand__title { font-size: 19px; }
  .toolbar {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  .chips { flex: 1 1 auto; flex-wrap: wrap; overflow: visible; }
  .viewtabs { flex: 0 0 auto; width: 280px; }

  .main {
    max-width: 860px;
    padding-top: 20px;
    padding-bottom: 48px;
  }

  /* 桌面端卡片不拉伸变形：限宽居中 */
  #view-card { max-width: 620px; margin: 0 auto; }
  .flipcard { height: clamp(360px, 50vh, 480px); }
  .flipcard__title { font-size: 26px; }
  .flipcard__answer { font-size: 15.5px; }
  .flipcard__face { padding: 20px; }

  .cardctl__row { grid-template-columns: 1fr 1.4fr 1fr; }
}

@media (min-width: 1100px) {
  .main { max-width: 960px; }
  .chip { min-height: 34px; }
}

/* 横屏矮屏：卡片降低高度 */
@media (max-height: 480px) and (orientation: landscape) {
  .flipcard { height: 300px; }
  .topbar__row { min-height: 40px; }
}

/* 打印：去掉交互 chrome，便于导出纸质背诵单 */
@media print {
  .topbar, .drawer, .scrim, .cardctl, .viewtabs, .chips, .skip-link { display: none !important; }
  body { background: #fff; color: #000; }
  .panel, .flipcard__face { box-shadow: none; border-color: #999; }
}

/* =========================================================
   背诵记忆系统（会了 / 模糊 / 忘了 + 轮次 + 结算）
   ========================================================= */
.drill {
  margin: 14px 0 8px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elev);
  box-shadow: var(--shadow-1);
}
.drill__hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  color: var(--text-2);
}
.drill__round {
  font-weight: 700;
  color: var(--brand);
  padding: 3px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--brand) 12%, transparent);
}
.drill__stat { font-variant-numeric: tabular-nums; }
.drill__rate {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.ratebtn {
  min-height: var(--tap);
  padding: 10px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-sunken);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
}
.ratebtn:active { transform: scale(.97); }
/* 三档配色：底色走不透明色，文字用高对比色，保证暗色主题也 ≥4.5:1 */
.ratebtn--known {
  border-color: var(--rate-known-line);
  background: var(--rate-known-bg);
  color: var(--rate-known-fg);
}
.ratebtn--fuzzy {
  border-color: var(--rate-fuzzy-line);
  background: var(--rate-fuzzy-bg);
  color: var(--rate-fuzzy-fg);
}
.ratebtn--unknown {
  border-color: var(--rate-unknown-line);
  background: var(--rate-unknown-bg);
  color: var(--rate-unknown-fg);
}
.ratebtn:disabled { opacity: .45; cursor: not-allowed; }
.drill__tip {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
}

/* 结算面板 */
.settle {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(8, 14, 20, .55);
  backdrop-filter: blur(2px);
}
.settle[hidden] { display: none; }
.settle__box {
  width: min(420px, 100%);
  padding: 20px 18px;
  border-radius: var(--radius);
  background: var(--bg-elev);
  box-shadow: var(--shadow-2);
  border: 1px solid var(--border);
}
.settle__title { margin: 0 0 10px; font-size: 18px; color: var(--text); }
.settle__line { margin: 0 0 6px; font-size: 14px; color: var(--text-2); line-height: 1.7; }
.settle__hint { margin: 0 0 14px; font-size: 12px; color: var(--text-3); }
.settle__actions { display: grid; gap: 8px; }

/* 抽屉：掌握进度与导入导出 */
.drawer__progress {
  margin: 0 0 8px;
  font-size: 12px;
  color: var(--text-2);
  text-align: center;
}
.drawer__io { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

/* 列表 / 抽屉里的掌握标记 */
.mastery {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--text-3);
  white-space: nowrap;
}
.mastery--full { background: rgba(67, 181, 129, .18); color: #2f7d5b; }

/* 单文件版（file://）提示条 */
[data-standalone="true"] .drill__tip::after {
  content: " · 单文件版与网页版的学习记录互不相通";
  color: var(--text-3);
}

/* ---------- 11. 章节考向与分值徽章（exam_trend.json，可选） ----------
   数据是**区间估计**，不是官方分值：文案只显示 weight + scoreRange，
   详细说明（years / focus / 依据）放在 title 里，长按或悬停可见。
   没有 trend 数据时这些元素根本不会出现在 DOM 里。 */
.trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  max-width: 100%;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-sunken);
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: help;   /* 提示可以长按看说明 */
}
.trend__dot { opacity: .5; font-weight: 400; }
.trend__s {
  font-weight: 500;
  color: var(--text-3);
  /* 分值文本可能较长：手机上允许滚动外部截断，但不撑破布局 */
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 手机窄屏（<560px）：列表里的章徽章只留「🔥 高频」，
   完整分值区间收进 title（长按/悬停可见），避免被截成省略号 */
@media (max-width: 559px) {
  .panel__toggle .trend .trend__s,
  .panel__toggle .trend .trend__dot { display: none; }
  .panel__toggle .trend { padding: 1px 7px; }
}

/* 频率档位配色：只用边框/底色区隔，正文颜色始终保持高对比 */
.trend--high { border-color: #e8544d; background: rgba(232, 84, 77, .12); color: #b81f1a; }
.trend--mid  { border-color: #e2a03f; background: rgba(226, 160, 63, .14); color: #8a5a10; }
.trend--low  { border-color: var(--border-strong); background: var(--bg-sunken); color: var(--text-3); }

html[data-theme="dark"] .trend--high { color: #ffb3ae; border-color: #ff6b63; background: rgba(255, 107, 99, .16); }
html[data-theme="dark"] .trend--mid  { color: #ffd69a; border-color: #e2a03f; background: rgba(226, 160, 63, .18); }
html[data-theme="dark"] .trend--low  { color: #c2ccd7; }

/* 卡片上的紧凑版：一行放不下时由 .flipcard__badges 的 flex-wrap 折行 */
.trend--compact { font-size: 11px; padding: 1px 7px; }
.trend--compact .trend__s { display: none; }   /* 卡片正面只留「🔥高频」，细节长按看 title */
@media (min-width: 480px) {
  .trend--compact .trend__s { display: inline; }
}

/* 抽屉里的节徽章更小，避免把节名挤没 */
.tree__section .trend { font-size: 10.5px; padding: 1px 6px; margin-left: auto; }
.tree__section .trend .trend__s { display: none; }

/* 打印时不需要徽章 */
@media print {
  .trend { display: none !important; }
}
/* =========================================================
   考点卡视图（#view-cards）—— 内联渲染的 markdown 正文
   来源：cards.html 的排版样式，改成跟随 App 主题令牌
   ========================================================= */
#view-cards,
#view-mastery {
  padding-bottom: 24px;
}

.carddoc__title {
  padding: 12px 14px 6px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .2px;
  color: var(--text-3);
  background: var(--bg-sunken);
  border-top: 1px solid var(--border);
}

.cardsec {
  border-top: 1px solid var(--border);
}

.cardsec__toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: var(--touch);
  padding: 11px 14px;
  border: 0;
  background: var(--bg-elev);
  text-align: left;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
}
.cardsec__toggle:active { background: var(--bg-sunken); }
.cardsec__toggle[aria-expanded="true"] .sec__caret { transform: rotate(90deg); }
.cardsec__name { flex: 1 1 auto; min-width: 0; }

.cardsec__body {
  padding: 2px 14px 18px;
  background: var(--bg-elev);
  font-size: 15px;
  line-height: 1.78;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.cardsec__body[hidden] { display: none; }

/* 正文排版：只作用于考点卡内部，不影响 App 其它区域 */
.cardsec__body h3.cardsec__h {
  font-size: 1.05rem;
  margin: 22px 0 10px;
  color: var(--brand);
}
.cardsec__body h4.cardsec__sub,
.cardsec__body h5.cardsec__sub {
  font-size: .98rem;
  margin: 18px 0 8px;
  color: var(--text);
}
.cardsec__body p { margin: 10px 0; }
.cardsec__body strong { font-weight: 600; color: var(--text); }
.cardsec__body em { font-style: normal; color: var(--accent); font-weight: 600; }
.cardsec__body ul,
.cardsec__body ol { margin: 10px 0; padding-left: 1.35em; }
.cardsec__body li { margin: 6px 0; }
.cardsec__body li::marker { color: var(--brand); }
.cardsec__body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.cardsec__body a { color: var(--brand); text-decoration: none; }

.cardsec__body code {
  font-family: var(--mono);
  font-size: .86em;
  background: var(--bg-sunken);
  color: var(--brand);
  padding: .14em .38em;
  border-radius: 5px;
  word-break: break-word;
  overflow-wrap: anywhere;
  max-width: 100%;
}

.cardsec__body pre.code {
  background: #1e2733;
  color: #e6edf3;
  padding: 13px 15px;
  border-radius: var(--radius-sm);
  margin: 14px 0;
  font-size: .84rem;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.cardsec__body pre.code code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: 1em;
  white-space: inherit;
}

.cardsec__body blockquote {
  margin: 14px 0;
  padding: 11px 13px;
  background: var(--warn-bg, #fff6e5);
  border-left: 3px solid var(--warn-line, #f0a02b);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-2);
  font-size: .92rem;
  line-height: 1.62;
}
.cardsec__body blockquote strong { color: var(--text); }

/* 紧凑清单（≤3 列窄表） */
.cardsec__body .mini-list {
  margin: 14px 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.cardsec__body .mini {
  padding: 11px 13px;
  border-bottom: 1px solid var(--border);
}
.cardsec__body .mini:last-child { border-bottom: none; }
.cardsec__body .mini__k {
  font-size: .98rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
  line-height: 1.45;
}
.cardsec__body .mini__v {
  font-size: .92rem;
  color: var(--text-2);
  line-height: 1.7;
}
.cardsec__body .mini__l {
  display: inline-block;
  font-size: .74rem;
  font-weight: 600;
  color: var(--text-3);
  background: var(--bg-sunken);
  padding: 1px 6px;
  border-radius: 4px;
  margin-right: 5px;
  vertical-align: 1px;
}
.cardsec__body .mini__sep {
  color: var(--border-strong);
  margin: 0 7px;
  font-weight: 400;
}

/* 转置卡（维度表） */
.cardsec__body .tr-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.cardsec__body .tr-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.cardsec__body .tr-title {
  padding: 10px 13px;
  background: var(--bg-sunken);
  font-size: .96rem;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}
.cardsec__body .tr-row {
  display: flex;
  gap: 10px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--border);
  font-size: .9rem;
  line-height: 1.62;
}
.cardsec__body .tr-row:last-child { border-bottom: none; }
.cardsec__body .tr-k { flex: 0 0 5.4em; color: var(--text-3); font-size: .82rem; padding-top: 1px; }
.cardsec__body .tr-v { flex: 1 1 auto; color: var(--text-2); min-width: 0; }

/* 宽表：窄屏变竖排卡片 */
.cardsec__body .table-wrap { margin: 14px 0; }
.cardsec__body table {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
  background: var(--bg);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.cardsec__body th,
.cardsec__body td {
  padding: 9px 11px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.cardsec__body th {
  background: var(--bg-sunken);
  font-weight: 600;
  font-size: .86rem;
  color: var(--text-2);
  white-space: nowrap;
}
.cardsec__body tr:last-child td { border-bottom: none; }

@media (max-width: 640px) {
  .cardsec__body table,
  .cardsec__body tbody,
  .cardsec__body tr,
  .cardsec__body td { display: block; width: 100%; }
  .cardsec__body thead { display: none; }
  .cardsec__body table { background: none; border-radius: 0; }
  .cardsec__body tbody tr {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
    margin-bottom: 10px;
  }
  .cardsec__body tbody tr:last-child { margin-bottom: 0; }
  .cardsec__body tbody td {
    display: block;
    padding: 7px 0;
    border-bottom: 1px dashed var(--border);
  }
  .cardsec__body tbody td:last-child { border-bottom: none; padding-bottom: 0; }
  .cardsec__body tbody td:first-child { padding-top: 0; }
  .cardsec__body tbody td::before {
    content: attr(data-label);
    display: block;
    font-size: .76rem;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: .03em;
    margin-bottom: 3px;
  }
  .cardsec__body tbody td:first-child {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--text);
  }
  .cardsec__body tbody td:first-child::before { display: none; }
}

/* 自测清单复选框 */
.cardsec__body .check {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 10px 12px;
  margin: 7px 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  font-size: .94rem;
  line-height: 1.6;
}
.cardsec__body .check input {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: var(--brand);
}
.cardsec__body .check:has(input:checked) { opacity: .5; }
.cardsec__body .check:has(input:checked) span { text-decoration: line-through; }

/* =========================================================
   掌握列表视图（#view-mastery）
   ========================================================= */
.mastery-summary {
  margin-bottom: 12px;
  padding: 14px 16px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.msum__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.msum__pct {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--brand);
}
.msum__label { font-size: 13px; color: var(--text-3); }
.msum__bar {
  height: 8px;
  border-radius: 999px;
  background: var(--bg-sunken);
  overflow: hidden;
  margin-bottom: 8px;
}
.msum__bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--rate-known-line, #2f9e6b);
  transition: width .3s ease;
}
.msum__nums { font-size: 12.5px; color: var(--text-2); }

.mastery-actions { margin: 10px 0 14px; }

.panel__pct {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 700;
  color: var(--brand);
}

.mbar { padding: 8px 12px; border-bottom: 1px solid var(--border); }

.mrow {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  font-size: 14px;
}
.mrow:first-child { border-top: 0; }
.mrow__g {
  flex: 0 0 auto;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--text-3);
  white-space: nowrap;
}
.mrow__g[data-grade="known"] { background: var(--rate-known-bg); color: var(--rate-known-fg); }
.mrow__g[data-grade="fuzzy"] { background: var(--rate-fuzzy-bg); color: var(--rate-fuzzy-fg); }
.mrow__g[data-grade="unknown"] { background: var(--rate-unknown-bg); color: var(--rate-unknown-fg); }
.mrow__t {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mrow__forget {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 9px;
  background: var(--bg-sunken);
  font-size: 15px;
  cursor: pointer;
  color: var(--text-3);
}
.mrow__forget:active { background: var(--bg); }

/* 小号按钮 */
.btn--sm {
  min-height: 36px;
  padding: 0 14px;
  font-size: 13px;
}

</style>

<body>
  <!-- 无障碍：跳转到主内容 -->
  <a class="skip-link" href="#main">跳到主内容</a>

  <!-- ===== 顶部栏（sticky，滚动时保持可见） ===== -->
  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <button class="icon-btn" id="btn-menu" type="button"
              aria-label="打开目录" aria-controls="drawer" aria-expanded="false">
        <span class="hamburger" aria-hidden="true"></span>
      </button>
      <h1 class="brand">
        <span class="brand__title">408 随身背诵</span>
        <span class="brand__sub" id="brand-sub"></span>
      </h1>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="切换深色/浅色主题">
        <span id="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>

    <!-- 全局搜索 -->
    <div class="searchbar" role="search">
      <span class="searchbar__icon" aria-hidden="true">🔍</span>
      <input id="search" class="searchbar__input" type="search" inputmode="search"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="搜索考点，如「死锁」「PV」"
             aria-label="搜索考点" aria-controls="list">
      <button class="searchbar__clear" id="btn-clear" type="button" aria-label="清空搜索" hidden>✕</button>
    </div>

    <!-- 分级标签筛选 + 视图切换 -->
    <div class="toolbar">
      <div class="chips chips--subject" id="subject-chips" role="group" aria-label="按科目筛选">
        <button class="chip chip--subject is-active" type="button" data-subject="all">全部科目</button>
      </div>
      <div class="chips" id="level-chips" role="group" aria-label="按分级标签筛选">
        <button class="chip chip--all is-active" type="button" data-level="all">全部</button>
        <button class="chip chip--l1" type="button" data-level="l1">🔴 必背原话</button>
        <button class="chip chip--l2" type="button" data-level="l2">🔵 核心理解</button>
        <button class="chip chip--l3" type="button" data-level="l3">⚪ 拓展了解</button>
      </div>
      <div class="viewtabs" role="tablist" aria-label="视图切换">
        <button class="viewtab is-active" type="button" role="tab" id="tab-list"
                aria-selected="true" aria-controls="view-list" data-view="list">📚 考点列表</button>
        <button class="viewtab" type="button" role="tab" id="tab-card"
                aria-selected="false" aria-controls="view-card" data-view="card">🎴 抽卡背诵</button>
        <button class="viewtab" type="button" role="tab" id="tab-cards"
                aria-selected="false" aria-controls="view-cards" data-view="cards">📄 考点卡</button>
        <button class="viewtab" type="button" role="tab" id="tab-mastery"
                aria-selected="false" aria-controls="view-mastery" data-view="mastery">📊 掌握列表</button>
      </div>
    </div>
  </header>

  <!-- ===== 主区域 ===== -->
  <main class="main" id="main">
    <!-- 开屏骨架屏：首次进入先显示 2 秒，避免白屏闪烁（只有形状，不含任何知识正文） -->
    <div class="skeleton" id="skeleton" role="status" aria-label="正在加载考点">
      <div class="sk-panel">
        <div class="sk-bar sk-bar--title"></div>
        <div class="sk-row"><div class="sk-bar sk-bar--dot"></div><div class="sk-bar sk-bar--line"></div></div>
        <div class="sk-row"><div class="sk-bar sk-bar--dot"></div><div class="sk-bar sk-bar--line sk-bar--short"></div></div>
        <div class="sk-row"><div class="sk-bar sk-bar--dot"></div><div class="sk-bar sk-bar--line"></div></div>
      </div>
      <div class="sk-panel">
        <div class="sk-bar sk-bar--title"></div>
        <div class="sk-row"><div class="sk-bar sk-bar--dot"></div><div class="sk-bar sk-bar--line"></div></div>
        <div class="sk-row"><div class="sk-bar sk-bar--dot"></div><div class="sk-bar sk-bar--line sk-bar--short"></div></div>
      </div>
      <p class="skeleton__hint">正在读取知识点数据…</p>
    </div>

    <!-- 出错状态：标题固定，「真实原因」由 JS 写进 #state-error-msg -->
    <div class="state state--error" id="state-error" hidden role="alert">
      <p class="state__title" id="state-error-title">😵 数据加载失败</p>
      <p class="state__hint state__hint--strong" id="state-error-msg"></p>
      <p class="state__hint state__hint--minor" id="state-error-help"></p>
      <div class="state__actions">
        <button class="btn btn--primary" type="button" id="btn-retry">重新加载</button>
      </div>
    </div>

    <!-- 考点列表视图 -->
    <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list">
      <div class="listhead">
        <p class="listhead__meta" id="list-meta"></p>
      </div>
      <div id="list"></div>
    </section>

<script type="application/json" id="inline-data">{"builtAt":"2026-10-26 14:45","builder":"build_standalone.js","knowledge":{"items":[{"id":"os-ch1-1.1-001","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"操作系统的定义与角色","level":"l1","title":"操作系统的定义","answer":"【结论】操作系统是控制和管理计算机系统软/硬件资源、合理调度任务与分配资源，并为用户及其他软件提供统一接口与运行环境的最基本的系统软件。\n【三个角色】①计算机系统资源的管理者；②用户与硬件之间的接口；③对计算机资源的扩充（裸机→扩充机器）。\n【四大管理功能】处理机管理、存储器管理、设备管理、文件管理。\n易错点：操作系统是「最基本的系统软件」而非应用软件；编译器虽常被误认，但它属于上层软件，不是操作系统要提供的功能。","keywords":["操作系统定义","系统软件","资源管理","扩充机器"],"source":"王道2027版 印刷页 1（PDF p13）","status":"final"},{"id":"os-ch1-1.1-002","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"操作系统的四大基本特征（并发/共享/虚拟/异步）","level":"l1","title":"操作系统的四大基本特征","answer":"【结论】并发、共享、虚拟、异步，四项缺一不可；其中**并发与共享是最基本的两个特征，互为前提**。\n·并发：两个或多个事件在**同一时间间隔内**发生（宏观同时、微观交替）。\n·共享：资源供内存中多个并发进程共同使用，分**互斥共享**（如打印机）与**同时访问**（如只读文件）。\n·虚拟：把物理实体映射为多个逻辑对应物，靠**时分复用**（CPU 分时）与**空分复用**（虚拟存储器）。\n·异步：进程以不可预知的速度断续推进。\n易错点：并发≠并行。并行是**同一时刻**真正同时发生，单处理机永远无法实现进程级并行；只有 CPU 与 I/O 之间、多 I/O 之间、多核之间才可能并行。","keywords":["并发","共享","虚拟","异步","并行"],"source":"王道2027版 印刷页 3（PDF p15）","status":"final"},{"id":"os-ch1-1.1-003","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"并发与并行的区别","level":"l1","title":"并发与并行的区别","answer":"【结论】并发 = 同一时间间隔内发生（宏观同时、微观交替）；并行 = 同一时刻真正同时发生。\n【判定】单处理机系统：多道程序只能**并发**，任一时刻仅一个程序执行。\n真正并行的三种情形：CPU 与 I/O 设备之间、多个 I/O 设备之间、多核/多处理机之间。\n要实现**进程级**并行，必须有多个 CPU 核才行。\n易错点：题目说「单 CPU 系统中两个进程并行执行」一定错；「并发」与「并行」在选项里常被互换来挖坑。","keywords":["并发","并行","单处理机","多核"],"source":"王道2027版 印刷页 3（PDF p15）","status":"final"},{"id":"os-ch1-1.1-004","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"操作系统的用户接口与程序接口","level":"l2","title":"操作系统的用户接口与程序接口","answer":"【结论】操作系统接口分两类：**用户接口**（命令方式、图形方式，面向终端用户）与**程序接口**（系统调用，面向应用程序）。\n用户接口三型：①联机用户接口（命令行接口，交互式）；②脱机用户接口（作业控制语言，批处理）；③图形用户接口 GUI。\n程序接口即**系统调用**，是应用程序请求内核服务的**唯一合法途径**。\n易错点：**库函数不是操作系统提供的接口**。库函数是系统调用的上层封装（如 printf 最终走 write），也可能是纯用户态计算（如 strlen、sqrt）。2010 年 408 第 11 题就考「操作系统提供给应用程序的接口 = 系统调用」。","keywords":["用户接口","程序接口","系统调用","库函数","GUI"],"source":"王道2027版 印刷页 3（PDF p15）","status":"final"},{"id":"os-ch1-1.1-005","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"库函数与系统调用的区别","level":"l2","title":"库函数与系统调用的区别","answer":"【结论】库函数在用户态、开销小、可移植、易调试、**可替换**；系统调用陷入内核态、开销大、与具体 OS 强耦合、难调试、通常不可替换。\n【联系】部分库函数通过系统调用实现（printf→write，malloc→brk/mmap）；但**并非所有库函数都依赖系统调用**（strlen、sqrt 纯用户态）。\n易错点：①「所有库函数都依赖系统调用」是错误说法；②「库函数就是操作系统接口」错，它是系统调用的**上层**。","keywords":["库函数","系统调用","用户态","内核态"],"source":"王道2027版 印刷页 4（PDF p16）","status":"final"},{"id":"os-ch1-1.1-006","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"操作系统的发展历程与各类系统特点","level":"l1","title":"操作系统的发展历程与各类系统特点","answer":"【结论】发展主线：手工操作 → 单道批处理 → 多道批处理 → 分时 → 实时 → 网络/分布式 → 微机/嵌入式。\n·**批处理**：优点资源利用率高、吞吐量大；**缺点是无交互能力**（这是批处理的代表缺点）。\n·**分时系统**特征：同时性（多路性）、交互性、独立性、及时性；追求**快速响应**。响应时间 T ≈ 时间片 Q × 用户数 N。\n·**实时系统**：在规定时间内处理外部事件，特征是**确定性、高可靠性、强时效性**；分硬实时（飞机控制、导弹制导）与软实时（订票、银行管理）。\n·**网络 OS**：各机独立，用户需显式指定远程资源；**分布式 OS**：单一系统映像、透明性、可并行执行同一任务。\n易错点：实时系统**不以资源利用率为主要目标**（为保证及时响应允许浪费资源）；多道程序系统**必须有中断支持**。","keywords":["批处理","分时","实时","分布式","网络操作系统"],"source":"王道2027版 印刷页 7（PDF p19）","status":"final"},{"id":"os-ch1-1.1-007","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"多道程序设计技术","level":"l2","title":"多道程序设计技术","answer":"【结论】多道程序设计让多个程序同时驻留内存、交替占用 CPU，是**提高单机资源利用率的关键技术**。\n特点：多道、**宏观上并行、微观上串行**。\n实现前提：**中断技术**（无中断就无法在程序间切换）。\n要解决的关键问题：处理器分配策略、内存分配与保护、I/O 分配与调度、程序与数据的组织。\n易错点：多道程序系统**不必**支持虚拟存储（早期多道批处理把所有进程数据全部调入主存也能跑）；也**不是**进程越多 CPU 利用率越高（过多会频繁换页反而下降）。","keywords":["多道程序","中断","资源利用率","吞吐量"],"source":"王道2027版 印刷页 8（PDF p20）","status":"final"},{"id":"os-ch1-1.1-008","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"共享的两种方式与临界资源","level":"l2","title":"共享的两种方式与临界资源","answer":"【结论】共享分两类：①**互斥共享**——一段时间内只允许一个进程访问（打印机、磁带机、共享变量、栈、表格），这类资源称**临界资源**；②**同时访问**——允许多个进程在宏观上同时访问（只读文件、可重入代码），微观上分时交替。\n【关键关系】并发与共享**互为前提**：①共享以并发为前提（单道程序无需共享）；②有效的共享机制是并发正确执行的基础。\n易错点：把「磁盘上的只读文件」判成互斥共享是常见错误；可同时访问的资源仍可能存在微观的交替访问。","keywords":["互斥共享","同时访问","临界资源","并发与共享"],"source":"王道2027版 印刷页 4（PDF p16）","status":"final"},{"id":"os-ch1-1.1-009","chapter":"第1章 计算机系统概述","section":"1.1 操作系统的基本概念","topic":"虚拟技术：时分复用与空分复用","level":"l2","title":"虚拟技术：时分复用与空分复用","answer":"【结论】虚拟是把一个物理实体映射为多个逻辑对应物，实现手段两类：\n①**时分复用**：如处理器分时共享（一个物理 CPU 逻辑上表现为多个）；\n②**空分复用**：如虚拟存储器（有限的物理内存扩展为更大的逻辑地址空间）。\n【第三种应用】虚拟设备技术（SPOOLing）把独占型 I/O 设备（如打印机）转化为多台逻辑设备，使原本需互斥访问的临界资源变为可并发使用。\n易错点：虚拟存储器属于**空分复用**，CPU 分时属于**时分复用**，两者常被互换设置干扰项。","keywords":["虚拟","时分复用","空分复用","SPOOLing"],"source":"王道2027版 印刷页 4（PDF p16）","status":"final"},{"id":"os-ch1-1.3-001","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"处理机的双重工作模式（用户态与内核态）","level":"l1","title":"处理机的双重工作模式（用户态与内核态）","answer":"【结论】处理机至少两种运行模式：**用户态（目态）**与**内核态（管态、系统态）**，由硬件**模式位**标识（如 0=内核态，1=用户态）。\n【特权指令】可能危及系统安全的指令（I/O 指令、置时钟、修改 PSW、开关中断、停机、切换 CPU 模式等）**只能在核心态执行**。\n【核心规则】内核态可执行**完整指令集**（含特权指令与非特权指令）；用户态**只能**执行非特权指令，执行特权指令会触发异常。\n易错点：①「内核态只能执行特权指令」错，内核态什么都能执行；②「用户态只能执行非特权指令」对。2022 年 408 第 30 题即考此点。","keywords":["用户态","内核态","模式位","特权指令"],"source":"王道2027版 印刷页 16（PDF p28）","status":"final"},{"id":"os-ch1-1.3-002","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"从用户态切换到内核态的唯一途径","level":"l1","title":"从用户态切换到内核态的唯一途径","answer":"【结论】**从用户态切换到内核态的唯一途径是中断或异常**（广义上把访管/Trap 视为异常的一种）。\n【为什么不能靠指令】用户态无法执行「修改程序状态字 PSW」这类特权指令；模式位的切换是 **CPU 在中断时自动完成的**，不是用指令改的。\n【常见情形】①系统调用（执行 Trap/访管指令）；②外中断（I/O 完成、时钟信号）；③异常（缺页、地址越界、除零、非法指令）。\n易错点：①「修改 PSW 指令」不能用于此（本身是特权指令）；②「中断屏蔽」也不是途径。这道题是 1.x 的送分题，选项常设「修改 PSW / 中断屏蔽 / 中断处理程序 / 中断」四选一，答案只能是**中断**。","keywords":["内核态","用户态","中断","异常","PSW"],"source":"王道2027版 印刷页 17（PDF p29）","status":"final"},{"id":"os-ch1-1.3-003","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"中断与异常的区别与分类","level":"l2","title":"中断与异常的区别与分类","answer":"【结论】**中断（外中断）**来自 CPU 外部的事件（I/O 完成、时钟信号），**可屏蔽**；**异常（内中断）**源自 CPU 执行指令内部（缺页、除零、地址越界、Trap 陷入指令），**一旦发生立即处理、不可屏蔽**。\n异常三类：故障 Fault（如缺页，处理后重新执行该指令）、自陷 Trap（如系统调用、调试断点）、终止 Abort（如硬件故障，无法恢复）。\n【中断响应与子程序调用的保存差异】中断处理**一定保存 PSW（程序状态字寄存器）**，子程序调用**不必**保存 PSW（只保存 PC/返回地址）——2012 年 408 第 18 题。\n易错点：「访管中断」和「缺页中断」都是**异常/内中断**，不是外中断；外中断的典型例子只有时钟中断、I/O 中断。","keywords":["中断","异常","内中断","外中断","故障","自陷","终止"],"source":"王道2027版 印刷页 17（PDF p29）","status":"final"},{"id":"os-ch1-1.3-004","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"中断处理中硬件与操作系统的分工","level":"l2","title":"中断处理中哪些由硬件做、哪些由操作系统做","answer":"【结论·分工口诀】**硬件做「中断隐指令」**：保存断点（PC、PSW）、找到中断向量、切换到内核态；**操作系统做**：保存通用寄存器、保存中断屏蔽字、执行中断服务程序、初始化中断向量表。\n【中断隐指令】由硬件自动完成，不是一条真实指令，包括：关中断、保存断点、引出中断服务程序。\n易错点（2020 年 408 第 27 题）：**保存断点（PC 与 PSW）由硬件完成**，不是操作系统；而「初始化中断向量表」「保存中断屏蔽字」「提供中断服务」都是操作系统做的。","keywords":["中断隐指令","断点","中断向量表","PSW"],"source":"王道2027版 印刷页 19（PDF p31）","status":"final"},{"id":"os-ch1-1.3-005","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"系统调用的执行过程与分类","level":"l2","title":"系统调用的执行过程与分类","answer":"【结论·五步】①**传递系统调用参数** → ②执行**陷入（Trap）指令**（引起访管中断，CPU 转入内核态）→ ③执行**相应的系统调用服务例程** → ④返回用户态。\n正确顺序（2017 年 408 第 24 题）：传递参数 → Trap → 执行服务程序 → 返回用户态。\n【五大类】设备管理、文件管理、进程控制（创建/撤销/阻塞/唤醒）、进程通信、内存管理。\n易错点：①系统调用**发生在用户态**（用户程序发起），但**被调用的服务例程在内核态执行**——「在用户态发生」与「在用户态执行」是两回事；②创建新进程必须走系统调用（fork），而**页置换、进程调度**都由操作系统自动完成，**不**通过系统调用（2021 年 408 第 29 题）。","keywords":["系统调用","Trap指令","访管中断","陷入"],"source":"王道2027版 印刷页 19（PDF p31）","status":"final"},{"id":"os-ch1-1.3-006","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"用户态与内核态的常见事件辨析","level":"l1","title":"用户态与内核态的常见事件辨析（真题高频）","answer":"【结论】**不能在用户态执行**：关中断/开中断、I/O 指令、置时钟、修改 PSW、停机、设置中断屏蔽字、切换 CPU 模式。\n**可在用户态执行/发生**：普通数据传送、跳转、压栈、Trap（陷入）指令、调试断点、命令解释程序。\n【易混三组】\n·「在用户态**发生**」vs「在用户态**执行**」：系统调用、外中断、缺页都**发生在用户态**；但其**处理**在内核态。\n·进程切换只能**发生在内核态**（2012 年 408 第 17 题）。\n·中断处理程序**一定**是操作系统程序（2011、2016 类题）。\n易错点：Trap 指令本身**不是**特权指令（它正是用户态进入内核态的合法入口）；而 I/O 指令、开关中断则是。","keywords":["特权指令","用户态","内核态","Trap指令","进程切换"],"source":"王道2027版 印刷页 21（PDF p33）","status":"final"},{"id":"os-ch1-1.3-007","chapter":"第1章 计算机系统概述","section":"1.3 操作系统的运行环境","topic":"访管指令与访管中断","level":"l3","title":"访管指令与访管中断","answer":"【结论】**访管指令（Trap 指令）是一条可在用户态执行的指令**，其作用是主动引发访管中断，使 CPU 由用户态转入内核态，从而获得操作系统服务。\n【为什么需要】用户程序运行在用户态，I/O、进程创建、内存分配等特权资源操作无法直接完成，必须借访管指令**主动**请求内核。\n易错点：**访管指令不是特权指令**（它的设计目的恰恰是给用户一个受控的内核入口）；「内核态下可执行除访管指令之外的全部指令」是**错误**说法——内核态可执行完整指令集。","keywords":["访管指令","Trap","访管中断","特权指令"],"source":"王道2027版 印刷页 36（PDF p48）","status":"final"},{"id":"os-ch1-1.4-001","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"分层结构（分层法）","level":"l2","title":"分层结构（分层法）","answer":"【结论】把操作系统分为若干层，最底层（层 0）为硬件，顶层（层 N）为用户接口；**各层只单向依赖并调用其紧邻下层**。\n【优点】①便于调试与验证（自底向上逐层开发，出错必在本层，因下层已验证）；②易于扩充与维护（接口不变即可替换某层）。\n【缺点】①层次划分困难；②**运行效率较低**（执行一个功能要穿越多层，参数传递有额外开销）；③依赖关系固化后**缺乏灵活性**。\n易错点：「依赖关系灵活」是**错误**说法——分层恰恰是依赖关系最僵硬的；题目里凡说分层「灵活」的选项一律排除。","keywords":["分层","单向依赖","调试","效率低"],"source":"王道2027版 印刷页 26（PDF p38）","status":"final"},{"id":"os-ch1-1.4-002","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"模块化结构（模块-接口法）","level":"l2","title":"模块化结构（模块-接口法）","answer":"【结论】按功能划分为若干独立性模块，定义模块间接口；衡量模块独立性的两个标准：**内聚性越高越好、耦合度越低越好**。\n【优点】①提高正确性、可理解性、可维护性；②增强可适应性便于扩展；③支持并行开发。\n【缺点】①模块间接口很难完全满足实际需求；②各模块齐头并进，**每个决定无法建立在已验证的可靠决定之上**（错误会累积、难定位）。\n易错点：「某个模块出错不会导致整个系统崩溃」是**微内核**的特点，**不是**模块化的——模块化各模块都在内核中、相互调用，一个崩则全崩（这是「移花接木」式干扰项）。","keywords":["模块化","内聚性","耦合度","模块-接口法"],"source":"王道2027版 印刷页 27（PDF p39）","status":"final"},{"id":"os-ch1-1.4-003","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"宏内核（单内核/大内核）","level":"l2","title":"宏内核（单内核/大内核）","answer":"【结论】把系统主要功能模块都集成在一个紧密耦合的整体中、**整体运行于内核态**。\n【优点】**性能高**：模块共享地址空间、可直接函数调用，无上下文切换与消息传递开销。\n【缺点】代码规模膨胀后维护困难、**可靠性差**（某模块崩溃即整机崩溃）、安全性弱。\n【实例】Linux、Windows、Android 主要采用宏内核或混合内核；macOS/iOS 的 XNU 是 Mach 微内核 + BSD 宏内核的融合。\n易错点：与微内核对比时，宏内核的强项是**性能**，微内核的强项是**可靠/安全/可扩展/可移植**。","keywords":["宏内核","单内核","大内核","性能"],"source":"王道2027版 印刷页 28（PDF p40）","status":"final"},{"id":"os-ch1-1.4-004","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"微内核结构","level":"l1","title":"微内核结构","answer":"【结论】只保留最基本功能（**进程调度、进程间通信、低级存储器管理、中断和陷入处理**）在内核态，其余（文件系统、设备驱动等）移为用户态服务器，通过**消息传递**通信。\n【四大描述】①内核足够小；②基于**客户/服务器模式**；③**机制与策略分离**；④采用面向对象技术。\n【优点】扩展性/灵活性、**可靠性与安全性**、可移植性、支持分布式。\n【唯一主要缺点】性能差——每次服务请求需多次穿越内核态与用户态。\n易错点：①微内核**不提升性能**，凡说「更高效」的选项都错（2023 年 408 第 21 题）；②「功能分层设计」是**分层式**的特征，不是微内核；③Windows 是混合内核，不是纯分层。","keywords":["微内核","机制与策略分离","客户/服务器","消息传递"],"source":"王道2027版 印刷页 28（PDF p40）","status":"final"},{"id":"os-ch1-1.4-005","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"外核（exokernel）","level":"l3","title":"外核（exokernel）","answer":"【结论】外核把**物理资源直接暴露给用户级系统**，自身只负责资源的**安全分配与隔离**（权限检查），不提供抽象层；用户空间可构建**库操作系统（library OS）**自行实现文件系统、进程调度等。\n【优点】①减少抽象开销；②提升灵活性与性能；③清晰分离「保护」与「实现」。\n易错点：**进程调度仍由内核（或库 OS）负责，不是外核的职责**；外核只做资源的分配、回收与保护。","keywords":["外核","exokernel","库操作系统","资源隔离"],"source":"王道2027版 印刷页 29（PDF p41）","status":"final"},{"id":"os-ch1-1.4-006","chapter":"第1章 计算机系统概述","section":"1.4 操作系统结构","topic":"内核架构对比：宏内核 / 微内核 / 外核","level":"l2","title":"内核架构对比：宏内核 / 微内核 / 外核","answer":"【结论·三栏对比】\n·**宏内核**：主要功能全在内核态，模块直接函数调用 → **性能最好**，但可靠性/安全性/可扩展性差。\n·**微内核**：内核只留最基本功能，其余下沉用户态服务器 → **可靠性、安全性、可扩展性、可移植性最好**，但**性能最差**（频繁态切换）。\n·**外核**：只做物理资源的分配与隔离，不提供抽象，用户态库 OS 自行管理 → 减少抽象开销、灵活，但保护与实现分离。\n【选择高频判据】题目若问「相比宏内核，微内核具有的特征」→ 较高可靠性、较高安全性、较强可扩展性（**不含**「较好性能」）。\n易错点：**混合内核**（如 Windows、macOS 的 XNU）是两种思想的融合，不是纯微内核。","keywords":["宏内核","微内核","外核","架构对比","性能"],"source":"王道2027版 印刷页 28（PDF p40）","status":"final"},{"id":"os-ch1-1.5-001","chapter":"第1章 计算机系统概述","section":"1.5 操作系统引导","topic":"操作系统的引导过程","level":"l2","title":"操作系统的引导过程","answer":"【结论·六步】①CPU 激活并执行 **BIOS**（初始化基本硬件、建立中断向量表）→ ②**硬件自检 POST**，依 CMOS 设置选择启动设备 → ③加载**主引导记录 MBR**（启动设备首扇区，含引导代码+分区表）→ ④MBR 解析分区表，定位活动分区并加载**分区引导记录 PBR** → ⑤PBR 加载**启动管理器**（GRUB/Bootmgr）→ ⑥启动管理器加载**操作系统内核**，内核初始化后启动首个用户态进程（如 init）。\n易错点：①引导程序（自举程序）存在 **ROM/主板 BIOS** 中，操作系统引导程序在**硬盘活动分区的引导扇区**；②引导程序**不会把整个操作系统全部装入内存**（常驻的只是内核），这是错误说法；③开机后操作系统最终被加载到 **RAM**。","keywords":["BIOS","MBR","PBR","启动管理器","引导"],"source":"王道2027版 印刷页 29（PDF p41）","status":"final"},{"id":"os-ch1-1.6-001","chapter":"第1章 计算机系统概述","section":"1.6 虚拟机","topic":"两类虚拟机管理程序（VMM）","level":"l1","title":"两类虚拟机管理程序（VMM）","answer":"【结论】**第一类 VMM（裸金属架构）**直接运行在物理硬件上，是系统中**唯一处于最高特权级**的软件；效率通常**更高**。**第二类 VMM（寄居架构）**以应用程序形式运行在**宿主操作系统**之上，本质是用户态进程（如 VMware Workstation）；效率较低。\n【关键点】VMM 作为虚拟化核心，必须运行在**高于操作系统的特权级**上，才能拦截和模拟敏感指令、维持隔离——所以 **VMM 与操作系统特权级不可能相同**（2025 年 408 真题）。\n易错点：①「VMM 代码量大于完整操作系统」错（VMM 功能更简单）；②客户操作系统运行于**虚拟内核态**（它以为自己在内核态），其用户进程运行于真实用户态；③第二类 VMM 通常运行在用户态（较低特权级）。","keywords":["虚拟机","VMM","裸金属","寄居架构","特权级"],"source":"王道2027版 印刷页 30（PDF p42）","status":"final"},{"id":"os-ch1-1.6-002","chapter":"第1章 计算机系统概述","section":"1.6 虚拟机","topic":"虚拟化技术的特点","level":"l2","title":"虚拟化技术的特点","answer":"【结论】虚拟机通过虚拟化把一台物理机抽象为多台**逻辑上独立**的计算环境，每台都表现为完整硬件的精确复制品；核心是**隐藏底层硬件细节、提供统一且隔离的执行平台**。\n【能力】可在一台计算机上构建多个虚拟机；可运行不同指令集架构（借助仿真/动态二进制翻译）；操作系统可作为客户系统运行在虚拟机中。\n易错点：①**多台虚拟机同时运行在同一物理机上不是「真正的并行」**，真正的并行靠多核处理机；②「虚拟机只能用软件实现」错，也可用硬件支持（硬件虚拟化）。","keywords":["虚拟机","虚拟化","隔离","指令集"],"source":"王道2027版 印刷页 30（PDF p42）","status":"final"},{"id":"os-ch1-1.7-001","chapter":"第1章 计算机系统概述","section":"1.7 本章疑难点","topic":"特权指令与非特权指令","level":"l2","title":"特权指令与非特权指令","answer":"【结论】特权指令是用于**清内存、置时钟、分配系统资源、修改虚存页表、调整访问权限、I/O、开关中断**等关键操作的指令，**仅允许在内核态执行**。\n非特权指令：普通的数据处理、流程控制（跳转）、读操作等，不影响系统安全与整体状态，用户态可执行。\n【核心规则】内核态可执行**完整指令集**；用户态**只**能执行非特权指令，误用特权指令会由硬件触发异常阻止。\n易错点：**Trap/访管指令不是特权指令**（可在用户态执行，是进入内核的合法入口）；而「关中断指令」权限极大，属特权指令，**只能**在内核态执行（2015、2020 类题）。","keywords":["特权指令","非特权指令","内核态"],"source":"王道2027版 印刷页 35（PDF p47）","status":"final"},{"id":"os-ch1-1.7-002","chapter":"第1章 计算机系统概述","section":"1.7 本章疑难点","topic":"用户态与内核态切换、中断与访管的关系（综合）","level":"l2","title":"用户态与内核态切换、中断与访管的关系（综合）","answer":"【结论·一句话】**从用户态切换到内核态的唯一途径是中断或异常**；访管中断是用户程序主动发起的那一种。\n【链路】用户程序执行 Trap（访管）指令 → CPU 保存断点并置模式位为内核态 → 执行系统调用服务例程 → 返回前把模式位改回用户态。\n【反例】修改 PSW 指令、中断屏蔽都**不能**作为切换途径（前者是特权指令用户态不可执行，后者本身就是特权操作）。\n易错点：「中断处理程序」不是切换途径——它是在**已经切换之后**才执行的程序；题目常把「中断」与「中断处理程序」并列作为选项来混淆。","keywords":["内核态","用户态","访管中断","切换"],"source":"王道2027版 印刷页 36（PDF p48）","status":"final"},{"id":"os-ch2-2.1-001","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程的概念与四大特征","level":"l1","title":"进程的概念与四大特征","answer":"【结论】进程是**进程实体的运行过程**，是系统进行**资源分配和调度**的独立单位；进程实体（进程映像）由**程序段、数据段、PCB** 三部分构成。\n【四大特征】①**动态性**（最根本，进程有生命周期）；②**并发性**（引入进程的根本目的）；③**独立性**（独立运行、独立获得资源、独立参与调度）；④**异步性**（不可预知地推进）。\n【创建进程的本质是创建 PCB**；撤销进程即释放 PCB 及相关资源。\n易错点：把「进程=程序」当等价是最大误区——程序是静态的，进程是动态的执行过程。","keywords":["进程","进程实体","PCB","动态性","并发性"],"source":"王道2027版 印刷页 38（PDF p50）","status":"final"},{"id":"os-ch2-2.1-002","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程与程序的区别与联系","level":"l3","title":"进程与程序的区别与联系","answer":"【结论】①进程是「程序及其数据在计算机上的一次执行活动」，**动态**；程序只是有序指令集合，**静态**。②进程有生命周期（暂时存在）；程序可长期保存（永久存在）。③一个进程通常执行一个程序，但**一个程序可被多个进程并发执行**；**进程能创建新进程，程序不能**。④组成不同：进程 = 程序 + 数据 + PCB。\n易错点：说「进程与程序一一对应」「程序也能创建进程」都是错的。","keywords":["进程","程序","生命周期"],"source":"王道2027版 印刷页 175（PDF p187）","status":"final"},{"id":"os-ch2-2.1-003","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程控制块 PCB 的作用与内容","level":"l2","title":"进程控制块 PCB 的作用与内容","answer":"【结论】**PCB 是进程存在的唯一标志**；没有建立 PCB 的程序**不能**被操作系统调度执行。PCB 常驻内存，创建进程即创建 PCB，撤销进程即回收 PCB。\n【四类内容】①进程标识信息（PID、PPID、UID）；②进程调度信息（当前状态、优先级、CPU 占用时间等）；③资源与内存信息（代码/数据/堆栈段指针、文件描述符列表、I/O 清单）；④处理机状态信息（CPU 上下文：通用寄存器、PC、栈指针、PSW）。\n【组织方式】链接方式（同状态 PCB 用指针串成队列）与索引方式（每种状态建一个索引表）。\n易错点：**PCB 不在进程的用户虚拟地址空间中**，它由内核维护、存放在内核区，对用户进程不可见。","keywords":["PCB","进程控制块","进程标识","CPU上下文"],"source":"王道2027版 印刷页 38（PDF p50）","status":"final"},{"id":"os-ch2-2.1-004","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程的内存映像（虚拟地址空间布局）","level":"l3","title":"进程的内存映像（虚拟地址空间布局）","answer":"【结论】自高地址到低地址依次为：**用户栈**（向下增长）→ **共享库的存储映射区** → **堆**（向上增长）→ **读写数据段 .data/.bss** → **只读代码段 .init/.text/.rodata**；最顶部为**内核区（用户不可见）**。\n【要点】代码段与数据段大小**在加载时即确定**；堆与栈可在运行时**动态扩展收缩**。\n易错点：**PCB 不属于进程的虚拟地址空间**（它在内核区）；.bss 存放**未初始化**的全局/静态变量，.data 存放**已初始化**的。","keywords":["内存映像","代码段","数据段","堆","栈","内核区"],"source":"王道2027版 印刷页 40（PDF p52）","status":"final"},{"id":"os-ch2-2.1-005","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程的状态与转换","level":"l2","title":"进程的状态与转换","answer":"【结论】三基本状态：**就绪**（只差 CPU）、**运行**（占用 CPU）、**阻塞/等待**（等事件，给 CPU 也跑不了）；加创建与终止共**五态**。\n【合法转换】就绪→运行（被调度）；运行→就绪（**时间片用完或被更高优先级抢占**）；运行→阻塞（**主动请求 I/O 等需等待的事件**，必须经系统调用）；阻塞→就绪（等待的事件发生）。\n【不可能转换】**阻塞→运行**（必须先变就绪）；**就绪→阻塞**（没在跑，无法主动请求）。\n易错点：①并非所有系统调用都导致阻塞，只有需要等待外部事件的才会；②进程申请处理器得不到时是**就绪态**，不是阻塞态；③死锁时可能**全部进程阻塞、CPU 空闲**。","keywords":["就绪态","运行态","阻塞态","状态转换","五态"],"source":"王道2027版 印刷页 42（PDF p54）","status":"final"},{"id":"os-ch2-2.1-006","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程控制：创建、终止、阻塞、唤醒","level":"l2","title":"进程控制：创建、终止、阻塞、唤醒","answer":"【结论】进程控制用**原语**实现；原语在执行过程中**不可被中断**（靠关中断或硬件原子指令保证）。\n【创建】①申请空白 PCB → ②分配资源 → ③初始化 PCB（含把状态置为**就绪态**）→ ④插入就绪队列。\n【终止原因】正常结束、异常结束（越界、非法指令、特权指令违规、算术错误、I/O 故障、超时）、外界干预。\n易错点（2021 年 408 第 24 题）：创建新进程时**设置进程状态为执行态是错误的**——新建进程只能是就绪态（或创建态）。","keywords":["原语","进程创建","进程终止","阻塞","唤醒"],"source":"王道2027版 印刷页 42（PDF p54）","status":"final"},{"id":"os-ch2-2.1-007","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"进程通信（共享存储、消息传递、管道、信号）","level":"l2","title":"进程通信（共享存储、消息传递、管道、信号）","answer":"【结论】①**共享存储**：创建共享内存区并映射到多进程地址空间，速度快，但**同步互斥须由用户程序自己做**（OS 只分配与映射，不提供同步保护）。②**消息传递**：以消息为单位，分直接通信（指名进程）与间接通信（信箱），适合分布式、无共享内存也能用。③**管道（pipe）**：**半双工**，写入缓冲满则写进程阻塞、读空则读进程阻塞；数据**一次性读取**，读走即释放；由父进程 pipe() 创建，子进程**继承文件描述符**从而共享同一管道。④**信号**。\n易错点：共享存储**不代表**自动互斥——这是常考陷阱。","keywords":["共享存储","消息传递","管道","信号","进程通信"],"source":"王道2027版 印刷页 43（PDF p55）","status":"final"},{"id":"os-ch2-2.1-008","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"线程的概念与特点（与进程的区别）","level":"l1","title":"线程的概念与特点","answer":"【结论】**线程是程序执行流的最小单元，是处理器调度的基本单位**；进程则是**资源分配的基本单位**。\n【线程私有】线程 ID、程序计数器 PC、寄存器集合、**栈**、线程控制块 TCB。\n【线程共享】同进程内的**地址空间、代码段、数据段、打开的文件（fd）**等。\n【优点】①创建/撤销/切换开销小；②提高并发性；③便于共享资源；④支持多处理器并行。\n易错点（2024 年 408 第 28 题）：同一进程内不同线程**不共享各自的栈**；「进程是 CPU 调度基本单位」是**旧模型**，引入线程后已变。","keywords":["线程","轻量级进程","TCB","调度基本单位","资源分配基本单位"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"os-ch2-2.1-009","chapter":"第2章 进程与线程","section":"2.1 进程与线程","topic":"用户级线程与内核级线程","level":"l2","title":"用户级线程与内核级线程","answer":"【结论】\n·**用户级线程**：线程管理全在**用户态**（线程库完成创建/切换/撤销），内核**感知不到**线程存在。优点：切换不需陷入内核、开销小。**致命缺点**：调度以**进程**为单位，进程内一个线程**阻塞则整个进程阻塞**；也不能利用多核。\n·**内核级线程**：由内核管理，内核维护每个线程的 TCB。优点：某线程阻塞不影响同进程其他线程；可利用多处理器并行。缺点：切换需用户态/内核态模式转换，开销大。\n·**组合方式（多对多）**：兼顾两者优点。\n易错点：用户级线程下「一个线程被阻塞，同进程内其他线程仍可运行」是**错误**的——这是内核级线程才有的能力。","keywords":["用户级线程","内核级线程","组合方式","多线程模型","TCB"],"source":"王道2027版 印刷页 46（PDF p58）","status":"final"},{"id":"os-ch2-2.2-001","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"三级调度（高级/中级/低级）","level":"l2","title":"三级调度（高级/中级/低级）","answer":"【结论】①**高级调度（作业调度）**：从外存后备队列选作业调入内存建立进程，**频率最低**，批处理系统才有；②**中级调度（内存调度）**：对换（挂起/激活），用于提高内存利用率、缓解内存紧张；③**低级调度（进程调度）**：从就绪队列选进程分配 CPU，**频率最高**、所有系统必备。\n易错点：交互式系统一般不设独立的作业调度；进程调度是三种调度中**最频繁**的。","keywords":["高级调度","中级调度","低级调度","作业调度","进程调度"],"source":"王道2027版 印刷页 66（PDF p78）","status":"final"},{"id":"os-ch2-2.2-002","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"调度的时机与不能调度的情况","level":"l2","title":"调度的时机与不能调度的情况","answer":"【结论】引起进程调度的事件：**进程阻塞、进程结束、时间片用完、中断处理结束**（2021 年 408 第 27 题）。\n**不能**进行调度与切换的情形：①**处理中断过程中**；②**执行原子操作过程中**（加锁解锁、现场保护与恢复等，通常已屏蔽中断）。若此时出现调度条件，只置**调度请求标志**，待退出临界区再处理。\n易错点：「中断处理过程中可以立即切换到别的进程」是错误说法；中断处理不隶属任何用户进程，不应被剥夺 CPU。","keywords":["调度时机","抢占","原子操作","调度请求标志"],"source":"王道2027版 印刷页 69（PDF p81）","status":"final"},{"id":"os-ch2-2.2-003","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"抢占式与非抢占式调度","level":"l2","title":"抢占式与非抢占式调度","answer":"【结论】**非抢占式（不可剥夺）**：进程一旦获得 CPU 就运行到完成或主动阻塞，不会被强行剥夺；**抢占式（可剥夺）**：更高优先级进程就绪或时间片用完时，当前进程被**强制**让出 CPU。\n【典型归属】FCFS、SJF（默认）为非抢占式；RR、抢占式优先级为抢占式；多级反馈队列为**抢占式**。\n易错点：抢占式并非处处更好——它增加上下文切换开销，且实现复杂；「抢占式一定比非抢占式效率高」是错误说法。","keywords":["抢占式","非抢占式","可剥夺","CPU调度"],"source":"王道2027版 印刷页 67（PDF p79）","status":"final"},{"id":"os-ch2-2.2-004","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"调度的评价指标（周转/带权周转/等待/响应）","level":"l1","title":"调度的评价指标（周转/带权周转/等待/响应）","answer":"【结论·公式必背】\n·**CPU 利用率** = CPU 有效工作时间 ÷（有效工作时间 + 空闲等待时间）\n·**周转时间** = 完成时间 − 到达时间\n·**带权周转时间** = 周转时间 ÷ **实际运行时间**（分母是服务时间，**不是**等待时间）\n·**等待时间** = 周转时间 − 实际运行时间（= 在各队列中等待的总时长）\n·**响应时间** = 从提交请求到首次响应的时间\n易错点：①**平均**周转/带权周转必须逐进程求出再取算术平均，不能拿总时间相除；②带权周转时间**永远 ≥ 1**（周转 ≥ 运行）。","keywords":["周转时间","带权周转时间","等待时间","响应时间","CPU利用率"],"source":"王道2027版 印刷页 70（PDF p82）","status":"final"},{"id":"os-ch2-2.2-005","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"上下文切换与进程切换","level":"l2","title":"上下文切换与进程切换","answer":"【结论】进程上下文由 **PCB** 表示（CPU 寄存器值、进程状态、内存管理信息等）。切换流程：保存旧进程上下文到其 PCB → 更新地址空间相关信息（**页表基址**）、重置 PC → 加载新进程上下文。\n【要点】**切换 ≠ 调度**：调度是「选谁」，切换是「换现场」。\n易错点（2024 年 408 第 25 题）：页式系统中进程切换时 OS 需更新 **PC、栈基址寄存器、页表基址寄存器**。","keywords":["上下文切换","PCB","页表基址","进程切换"],"source":"王道2027版 印刷页 70（PDF p82）","status":"final"},{"id":"os-ch2-2.2-006","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"FCFS 与 SJF/SPF 调度算法","level":"l2","title":"FCFS 与 SJF/SPF 调度算法","answer":"【结论】\n·**FCFS（先来先服务）**：非抢占，实现简单但**对短作业不利**，长作业先到会使后续短作业长时间等待；不适合分时/实时系统，常与其他策略结合（同优先级按 FCFS）。\n·**SJF/SPF（短作业/短进程优先）**：**平均等待时间、平均周转时间最优**（同时到达前提下）；缺点：**长作业会饥饿**、未考虑紧迫程度、运行时间由用户估计不可靠。分非抢占（默认）与抢占式（SRTN）。\n易错点：SJF 的「最优」有前提——**有不同到达时刻时 SJF 不一定最优**；「SJF 一定能得到最短平均周转时间」是无条件错误说法。","keywords":["FCFS","SJF","SPF","短作业优先","饥饿"],"source":"王道2027版 印刷页 71（PDF p83）","status":"final"},{"id":"os-ch2-2.2-007","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"高响应比优先 HRRN","level":"l3","title":"高响应比优先 HRRN","answer":"【结论】**响应比 = (等待时间 + 要求服务时间) ÷ 要求服务时间**；每次调度选响应比最高者。\n【优点】兼顾短作业（服务时间短则响应比高）与长作业（等待越久响应比越高，**不会饥饿**）。\n【缺点】每次调度都要计算所有作业的响应比，**开销大**。\n易错点：响应比公式分子是「等待 + 服务」，不是「等待 ÷ 服务」；HRRN 是**非抢占式**。","keywords":["HRRN","高响应比优先","响应比"],"source":"王道2027版 印刷页 74（PDF p86）","status":"final"},{"id":"os-ch2-2.2-008","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"时间片轮转 RR","level":"l2","title":"时间片轮转 RR","answer":"【结论】按 FCFS 排队，每个进程最多运行一个**时间片 q**，用完即被剥夺排到队尾；**抢占式**、专为分时系统设计。\n【关键权衡】q **过大**→退化为 FCFS；q **过小**→上下文切换开销剧增。\n【响应时间估算】就绪进程数 N、时间片 q 时，最坏响应时间约为 **N × q**（如 100 个就绪进程、要求响应 ≤2s，则 q ≤ 20ms）。\n易错点：RR 的周转时间**不优**（对短作业不友好），它的目标是**响应时间**而非周转时间。","keywords":["RR","时间片轮转","时间片","响应时间"],"source":"王道2027版 印刷页 75（PDF p87）","status":"final"},{"id":"os-ch2-2.2-009","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"优先级调度（静态/动态优先级）","level":"l3","title":"优先级调度（静态/动态优先级）","answer":"【结论】按优先级高低调度，可抢占也可非抢占；相同优先级通常按 FCFS。\n·**静态优先级**：创建时确定且不变；实现简单、开销小，但**不够灵活，低优先级进程可能饥饿**。\n·**动态优先级**：随进程推进/等待时间变化而调整（如等待越久优先级越高），**可缓解饥饿**。\n易错点：优先级数值大小与「谁优先」要看题目约定（有的题「值越小优先级越高」，务必读题干）。","keywords":["优先级调度","静态优先级","动态优先级","饥饿"],"source":"王道2027版 印刷页 74（PDF p86）","status":"final"},{"id":"os-ch2-2.2-010","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"多级队列与多级反馈队列调度","level":"l2","title":"多级队列与多级反馈队列调度","answer":"【结论】\n·**多级队列**：就绪进程分成多个独立队列（系统/交互/批处理），各队列**有自己的调度算法和优先级**，队列间固定优先级。\n·**多级反馈队列**：队列**按优先级排列**、时间片**逐级增大**；进程可在队列间**动态迁移**（用完时间片降到下一级）。\n【四要素】（2020 年 408 第 26 题）**就绪队列的数量、各就绪队列的优先级、各队列的调度算法、进程在队列间的迁移条件**，四者缺一不可。\n易错点：多级反馈队列能让**长作业最终也能完成**（已在高优先级队列获得过 CPU），因此**不会饥饿**；而 SJF/静态优先级会饥饿。","keywords":["多级队列","多级反馈队列","队尾","迁移条件"],"source":"王道2027版 印刷页 75（PDF p87）","status":"final"},{"id":"os-ch2-2.2-011","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"调度算法综合对比表","level":"l1","title":"调度算法综合对比表","answer":"【结论·一句话记忆】\n·FCFS：**不利于短作业**，无饥饿。\n·SJF：**平均等待/周转最优**，但**长作业会饥饿**，且需估计运行时间。\n·HRRN：兼顾长短作业、无饥饿，但**计算响应比开销大**。\n·RR：**响应时间好**，适用于分时系统；但平均等待时间较长、上下文切换浪费。\n·多级反馈队列：**最通用**，实现**最复杂**。\n易错点：问「哪个不会饥饿」→ HRRN、多级反馈队列、FCFS；问「哪个平均周转最优」→ SJF（同时到达前提）。","keywords":["调度算法对比","饥饿","适用场景"],"source":"王道2027版 印刷页 77（PDF p89）","status":"final"},{"id":"os-ch2-2.2-012","chapter":"第2章 进程与线程","section":"2.2 CPU调度","topic":"多处理机调度","level":"l3","title":"多处理机调度","answer":"【结论】比单处理机复杂，调度策略与系统结构有关；关注**负载均衡**（让各 CPU 负载相近）与**处理器亲和性**（尽量让进程回到上次运行过的 CPU，以利用 Cache/TLB 残留）。\n易错点：负载均衡与亲和性存在**权衡**——迁移可均衡负载但破坏亲和性、增加 Cache 失效。","keywords":["多处理机","负载均衡","处理器亲和性"],"source":"王道2027版 印刷页 77（PDF p89）","status":"final"},{"id":"os-ch2-2.3-001","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"临界资源、临界区与同步互斥","level":"l1","title":"临界资源、临界区与同步互斥","answer":"【结论】**临界资源**：一次仅允许一个进程访问的资源（打印机、共享变量、栈等）。**临界区**：每个进程中**访问临界资源的那段代码**（不是资源本身）。\n·**同步（直接制约）**：进程间因**协作**要求在关键点等待对方信号，强调**先后次序**。\n·**互斥（间接制约）**：因**争用临界资源**须排他进入，强调**同一时刻仅一个**。\n【关系·教材口径】同步与互斥是并发进程的**两类不同制约关系**：同步源于**竞争资源**（间接制约），同步源于**协同完成同一任务**（直接制约）。\n【通俗说法（考纲外补充）】「互斥是同步的特殊情形（资源数为 1）」只是便于记忆的通俗化表述，**不是教材定义**；答题时优先用「直接制约/间接制约」这组标准术语，不要用「特例」替代定义。\n易错点：临界区是「代码」不是「资源」——选项把两者互换即为陷阱。","keywords":["临界资源","临界区","同步","互斥","直接制约","间接制约"],"source":"王道2027版 印刷页 99（PDF p111）","status":"final"},{"id":"os-ch2-2.3-002","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"实现临界区互斥的四条准则","level":"l1","title":"实现临界区互斥的四条准则","answer":"【结论·必背原文顺序】①**空闲让进**：临界区空闲时允许一个请求进程立即进入；②**忙则等待**：已有进程在临界区内时其他进程必须等待；③**有限等待**：保证请求进程在有限时间内能进入；④**让权等待（原则上应该遵循，但非必须）**：无法进入时应主动放弃 CPU 转阻塞态，避免忙等。\n【2020 年 408 第 32 题】「必须遵循」的是 **Ⅰ 忙则等待、Ⅱ 空闲让进、Ⅲ 有限等待**；**Ⅳ（不能进入的执行态进程立即放弃 CPU）不是必须的**，因为教材原文第 4 条标注了「非必须」。\n易错点：**让权等待不是必须**——只有 ①②③ 是必须遵循的。","keywords":["空闲让进","忙则等待","有限等待","让权等待","四准则"],"source":"王道2027版 印刷页 100（PDF p112）","status":"final"},{"id":"os-ch2-2.3-003","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"单标志法与双标志法","level":"l2","title":"单标志法与双标志法","answer":"【结论】\n·**单标志法**：设公用 `turn`，`turn=i` 才允许 Pi 进，退出置 `turn=j`。**满足**忙则等待、有限等待；**违反空闲让进**（强制轮流，对方不来本方可进也进不去）。\n·**双标志先检查**：先检查对方标志再置自己标志。**违反忙则等待**（两者同时检查、同时置位可同时进入临界区）。\n·**双标志后检查**：先置自己标志再检查对方。**违反空闲让进与有限等待**（双方都置位、都等待 → 饥饿）。\n易错点：先检查 vs 后检查的**区别就在「置位与检查的先后」**；两者都不满足让权等待。","keywords":["单标志法","双标志先检查","双标志后检查","空闲让进"],"source":"王道2027版 印刷页 100（PDF p112）","status":"final"},{"id":"os-ch2-2.3-004","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"Peterson 算法","level":"l1","title":"Peterson 算法","answer":"【结论】为每个进程设标志 `flag[i]`，再设 `turn`：进入区先 `flag[i]=true`、`turn=j`，再 `while(flag[j] && turn==j)` 循环等待。\n【四准则】**满足空闲让进、忙则等待、有限等待；唯一缺陷是不满足让权等待（忙等）**。\n【地位】是最经典的**纯软件**互斥方案，正确解决了两进程互斥问题。\n易错点：Peterson **能**保证有限等待（因为 turn 最终只会偏向一方），但**不能**避免忙等。","keywords":["Peterson算法","flag","turn","忙等"],"source":"王道2027版 印刷页 101（PDF p113）","status":"final"},{"id":"os-ch2-2.3-005","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"硬件方法：中断屏蔽、TestAndSet、Swap","level":"l1","title":"硬件方法：中断屏蔽、TestAndSet、Swap","answer":"【结论】\n·**中断屏蔽**：进入前关中断、退出后开中断。满足空闲让进、忙则等待、**有限等待**（关中断期间本进程不被抢占，必然能连续执行完临界区）；**不满足让权等待**（关中断期间进程并不放弃 CPU）。**仅适用于单 CPU / 单处理器**（某 CPU 关中断无法阻止其他 CPU 并发访问同一临界区），且开/关中断是特权指令，不能开放给用户进程。\n·**TestAndSet（TS）**：原子地返回旧值并置真，`while(TestAndSet(&lock));`。满足前三项，**不满足让权等待**（忙等待）；适用于多处理器。\n·**Swap（交换）**：原子交换两个变量，`while(key!=false) Swap(&lock,&key);`。满足前三项，**不满足让权等待**（忙等待）；适用于多处理器。\n【共同缺点】都**不满足让权等待**，浪费 CPU。\n易错点：①**中断屏蔽缺的是「让权等待」，不是「有限等待」**——这是本考点最大的陷阱，教材（印刷页 102 / PDF p114）列其缺点只讲「限制并发降效率、用户可关中断有风险、不适用于多处理器」，**从未说它不满足有限等待**；②真正**缺少有限等待**的是**双标志后检查法**（会饥饿）；③中断屏蔽与 TS/Swap 的关键区别：前者**仅限单处理器**，后两者**适用于多处理器**。","keywords":["中断屏蔽","TestAndSet","Swap","忙等待","硬件方法"],"source":"王道2027版 印刷页 102（PDF p114）","status":"final"},{"id":"os-ch2-2.3-006","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"四准则满足情况总表（软件+硬件）","level":"l1","title":"四准则满足情况总表（软件+硬件）","answer":"【结论·一张表背完】\n| 方法 | 空闲让进 | 忙则等待 | 有限等待 | 让权等待 |\n| 单标志 | ✗ | ✓ | ✓ | ✗ |\n| 双标志先检查 | ✓ | ✗ | ✓ | ✗ |\n| 双标志后检查 | ✗ | ✓ | ✗ | ✗ |\n| Peterson | ✓ | ✓ | ✓ | ✗ |\n| 中断屏蔽 | ✓ | ✓ | ✓ | ✗ |\n| TS / Swap | ✓ | ✓ | ✓ | ✗ |\n【三条规律】**① 没有任何方法满足「让权等待」**（全部是忙等或持 CPU 空转）；**② 只有「双标志后检查」缺「有限等待」**（双方都置位互相等待 → 饥饿）；**③ 只有「双标志先检查」缺「忙则等待」**。\n易错点：①**中断屏蔽满足有限等待**——关中断后本进程必然能进去；它缺的是**让权等待**，且**不适用于多处理器**；②做题先问「问的是哪一列」，别把「忙等」和「不能有限等待」混为一谈。","keywords":["四准则","软件方法","硬件方法","对比表"],"source":"王道2027版 印刷页 103（PDF p115）","status":"final"},{"id":"os-ch2-2.3-007","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"互斥锁与自旋锁","level":"l2","title":"互斥锁与自旋锁","answer":"【结论】**互斥锁**：进入前 acquire()，退出后 release()。\n【自旋锁】**忙等待**型互斥锁（如单标志、TS、Swap 都是），缺点是多进程共享 CPU 时连续循环浪费 CPU 周期；优点：**等待期间没有上下文切换**，若持锁时间短则等待代价低。适合**多处理器**系统（一个核「旋转」不影响其他核）。\n易错点：自旋锁**不满足让权等待**——这是它的定义特征，不是缺陷以外的偶然。","keywords":["互斥锁","自旋锁","忙等待","acquire","release"],"source":"王道2027版 印刷页 104（PDF p116）","status":"final"},{"id":"os-ch2-2.3-008","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"信号量 PV 操作的含义","level":"l1","title":"信号量 PV 操作的含义","answer":"【结论·铁律】**P(S)/wait(S)**：先 `S.value--`，再判断 **若 \u003c 0 则调用 block 自我阻塞**（放弃 CPU、加入等待队列 S.L）→ 实现让权等待。**V(S)/signal(S)**：先 `S.value++`，再判断 **若 ≤ 0 则调用 wakeup 唤醒一个等待者**。\n【初始化】`S.value` 初值 = **可用资源数量**（互斥量初值为 1）。\n【取值含义】正值 = 剩余可用资源数；0 = 资源恰好用完且无等待者；**负值 → 其绝对值 = 正在等待的进程数**。\n易错点：①wait 里是 `\u003c0`、signal 里是 `≤0`，写成 `\u003c0/≤0` 都对，但写成 `≤0/\u003c0` 互换就错；②`S.value = −2` 表示 **2 个进程在等待**，不是 2 个空闲资源。","keywords":["P操作","V操作","信号量","wait","signal","block","wakeup"],"source":"王道2027版 印刷页 105（PDF p117）","status":"final"},{"id":"os-ch2-2.3-009","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"整型信号量与记录型信号量的区别","level":"l2","title":"整型信号量与记录型信号量的区别","answer":"【结论】**整型信号量**：`while(S\u003c=0); S=S-1;` —— **不满足让权等待**（忙等）。\n**记录型信号量**：由一个整型 value 与一个等待队列 L 组成，`S.value--` 后若 `\u003c0` 就 block，`S.value++` 后若 `≤0` 就 wakeup —— **满足让权等待**。\n【要点】原语（wait/signal）的原子性由硬件或关中断保证，不可被中断。\n易错点：考题问「实现让权等待的信号量」→ **记录型**；整型信号量是忙等。","keywords":["整型信号量","记录型信号量","原子性","让权等待"],"source":"王道2027版 印刷页 105（PDF p117）","status":"final"},{"id":"os-ch2-2.3-010","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"利用信号量实现进程互斥","level":"l1","title":"利用信号量实现进程互斥","answer":"【结论】为临界资源设**互斥信号量 mutex，初值 1**；各进程把临界区夹在 `P(mutex)` 与 `V(mutex)` 之间。\n【执行路径】P(mutex) 时若资源空闲（mutex=1）则减为 0 成功进入；若已被占用（mutex=0）则被阻塞入等待队列；退出时 V(mutex) 加 1 并唤醒一个等待者。\n易错点：互斥量 **P/V 必须在同一进程内成对出现**，且**不能少写或重复写**；互斥量初值必须为 **1**。","keywords":["互斥信号量","mutex","初值为1","临界区"],"source":"王道2027版 印刷页 105（PDF p117）","status":"final"},{"id":"os-ch2-2.3-011","chapter":"第2章 进程与线程","section":"2.3 同步与互斥","topic":"利用信号量实现前驱关系","level":"l2","title":"利用信号量实现前驱关系","answer":"【结论】**每条前驱关系设一个同步信号量，初值 0**；**V 操作放在前驱操作之后，P 操作放在后继操作之前**。\n【例】语句 x 在 y 之前：设 S=0，P1 中 `x; V(S);`，P2 中 `P(S); y;`。\n【多前驱】若 C 需要 A 和 B 都完成，则 C 前必须 **P 两次**，且是两个**不同**的信号量。\n易错点：前驱/同步信号量初值**必须为 0**（写错初值直接不给分）；前驱数量 = 后继前的 P 数量。","keywords":["前驱关系","同步信号量","初值为0","V在前驱","P在后继"],"source"
