"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 序号字段按字节编号的含义，以及确认序号表示期望收到的下一个字节序号","level":"l1","title":"序号与确认序号","answer":"【结论】TCP 的序号占 4B，指明本报文段所发送数据的第一个字节的序号；确认序号占 4B，表示期望收到对方下一个报文段中第一个数据字节的序号。\n1. 序号范围：0 至 2 的 32 次方减 1，共 2 的 32 次方个序号，达到最大值后下一个序号回绕到 0，即采用模 2 的 32 次方运算。\n2. 按字节编号：TCP 连接中传送的字节流里的每个字节都按顺序编号，序号字段指的不是报文段编号。\n3. 序号算例：某报文段的序号为 301、携带的数据长度为 100B，则该报文段最后一个数据字节的序号为 400，下一个报文段的数据应从序号 401 开始。\n4. 确认序号含义：若确认序号为 N，则表明到序号 N 减 1 为止的所有数据均已正确接收。\n5. 确认序号算例：B 正确收到序号 501、数据长度 200B 的报文段（对应序号 501 至 700），则 B 发给 A 的确认序号置为 701。\n背诵要点：序号是“首字节号”，确认序号是“下一个想要的字节号”，两者都按字节不按报文段。","keywords":["序号","确认序号","字节编号","模2的32次方","累积确认"],"source":"王道2027版 印刷页 236-237（PDF p248-249）","status":"final"},{"id":"net-ch5-5.3-004","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 首部六个控制位的名称与作用，重点掌握 URG 与紧急指针的配合以及 ACK 的有效条件","level":"l2","title":"六个控制位与 URG、ACK","answer":"【结论】TCP 首部在保留位之后有 6 个控制位，各占 1 位，分别是 URG、ACK、PSH、RST、SYN、FIN；URG=1 时紧急指针有效，仅当 ACK=1 时确认序号字段才有效。\n1. 保留位：占 6 位，保留为今后使用，但目前须置为 0。\n2. 控制位：共 6 个、各占 1 位，用来说明本报文段的性质。\n3. URG（紧急位）：URG=1 时表明紧急指针字段有效，通知系统本报文段中包含紧急数据，应优先处理；紧急数据被放置在报文段数据的最前面，后续的仍为普通数据。\n4. ACK（确认位）：仅当 ACK=1 时确认序号字段才有效，ACK=0 时确认序号无效。\n5. ACK 的强制要求：TCP 规定在连接建立后，所有传送的报文段都必须将 ACK 置为 1；只有第一次握手的连接请求报文段 ACK=0。\n背诵要点：六位记 U、A、P、R、S、F；URG 喊“有急件”，ACK=1 确认序号才作数。","keywords":["控制位","URG","ACK","紧急指针","保留位"],"source":"王道2027版 印刷页 237（PDF p249）","status":"final"},{"id":"net-ch5-5.3-005","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"推送位 PSH 与复位位 RST 的用途及两者区别","level":"l3","title":"PSH 与 RST","answer":"【结论】PSH 是推送位，置 1 时接收方立即把数据交付应用进程而不必等缓存填满；RST 是复位位，置 1 表示连接出现严重差错必须释放并重建连接。\n1. PSH（推送位）：在交互式通信中，应用进程希望输入命令后能立即收到响应，此时发送方将 PSH 置为 1，接收方收到 PSH=1 的报文段后会立即将数据交付给应用进程，而不必等到整个缓存填满后才向上交付。\n2. RST（复位位）：当 RST=1 时，表示 TCP 连接出现严重差错（如主机崩溃），必须释放连接并重新建立连接。\n3. RST 的另一用途：也可用于拒绝非法的报文段或连接请求。\n4. 区分：PSH 管“快交付”，是优化时延；RST 管“推倒重来”，是异常处理。\n背诵要点：PSH 催着交付，RST 掀桌重连。","keywords":["PSH","RST","推送位","复位位","非法报文段"],"source":"王道2027版 印刷页 237-238（PDF p249-250）","status":"final"},{"id":"net-ch5-5.3-006","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"同步位 SYN 与终止位 FIN 的含义，以及它们在握手挥手中的作用","level":"l2","title":"SYN 与 FIN","answer":"【结论】SYN 是同步位，置 1 表示这是一个连接请求或连接接受报文；FIN 是终止位，置 1 表示发送方已无更多数据要发送并请求释放连接。\n1. SYN 的含义：SYN=1 时表示这是一个连接请求或连接接受报文。\n2. SYN 的两种组合：SYN=1 且 ACK=0 表明这是一个连接请求报文；若对方同意建立连接，则在响应报文中设置 SYN=1 且 ACK=1。\n3. FIN 的含义：用于释放连接，FIN=1 时表示此报文段的发送方已无更多数据要发送，并请求释放连接。\n4. 序号规则：SYN 报文段不能携带数据但仍消耗一个序号；FIN 报文段即使不携带数据也消耗一个序号。\n背诵要点：SYN 开门（请求或接受），FIN 关门（请求释放）；两者各消耗一个序号。","keywords":["SYN","FIN","同步位","终止位","序号消耗"],"source":"王道2027版 印刷页 237-238（PDF p249-250）","status":"final"},{"id":"net-ch5-5.3-007","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 首部窗口字段 2B 的含义、取值范围与计算方式","level":"l2","title":"窗口字段","answer":"【结论】窗口字段占 2B，范围为 0 至 2 的 16 次方减 1，以字节为单位，由本报文段的发送方填写，表示其作为接收方时当前还能接收的最大数据量。\n1. 长度与范围：2B，取值 0 至 65535（即 2 的 16 次方减 1），单位是字节。\n2. 填写者：由本报文段的发送方填写，含义是“我作为接收方还能收多少”。\n3. 具体含义：告诉对方，从本报文段的确认序号所指示的字节序号开始，最多可以连续发送这么多字节的数据。\n4. 算例：若确认序号为 701、窗口字段值为 1000，则表示发送方可以从序号 701 开始连续发送最多 1000B 的数据（字节序号 701 至 1700）。\n5. 易错点：窗口字段指明的是自己的接收窗口，不是对方的发送窗口，也不是拥塞窗口。\n背诵要点：窗口 2B 共 65536 个值，填的是“我能收多少”，从确认序号起算。","keywords":["窗口字段","2B","接收窗口","确认序号","字节为单位"],"source":"王道2027版 印刷页 238（PDF p250）","status":"final"},{"id":"net-ch5-5.3-008","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 检验和的检验范围与伪首部中协议字段的取值","level":"l3","title":"TCP 检验和与伪首部","answer":"【结论】TCP 检验和占 2B，检验范围包括首部和数据部分，计算时需在 TCP 报文段前添加一个 12B 的伪首部，其中协议字段由 UDP 的 17 改成 6，长度字段改成 TCP 长度。\n1. 字段长度：2B，与 UDP 一样采用二进制反码求和。\n2. 检验范围：首部和数据部分一起检验。\n3. 伪首部：12B，结构与 UDP 的伪首部相同，只是协议字段填 6（TCP 的协议号），长度字段填 TCP 长度。\n4. 常见错项：说 TCP 伪首部中 IP 分组头的协议字段是 17 的一定错，17 是 UDP 的协议号。\n背诵要点：TCP 伪首部协议号是 6，UDP 是 17；两者都检验首部加数据。","keywords":["TCP检验和","伪首部","协议字段6","12B","首部和数据"],"source":"王道2027版 印刷页 238（PDF p250）","status":"final"},{"id":"net-ch5-5.3-009","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 选项字段的作用，MSS 与 MTU 的定义区别","level":"l2","title":"选项、MSS 与 MTU","answer":"【结论】TCP 选项长度可变、最长可达 40B，最初只定义了一种选项即最大报文段长度 MSS，它表示 TCP 报文段中数据字段的最大长度；MTU 则是数据链路层帧中数据部分的最大长度。\n1. 选项长度：可变，最长可达 40B；若不使用选项，TCP 首部长度即为 20B。\n2. MSS：最大报文段长度（Maximum Segment Size），表示 TCP 报文段中数据字段的最大长度，只算数据不算首部。\n3. 后续选项：后来又增加了窗口扩大、时间戳等选项。\n4. MTU：数据链路层的最大传送单元，指的是帧中数据部分的最大长度，与 MSS 类似但属于链路层概念。\n5. 易混点：MSS 是 TCP 数据的上限，MTU 是帧数据的上限，两者不要互换。\n背诵要点：MSS 管 TCP 的数据段，MTU 管链路的帧数据；选项最长 40B。","keywords":["选项","MSS","MTU","40B","最大报文段长度"],"source":"王道2027版 印刷页 238（PDF p250）","status":"final"},{"id":"net-ch5-5.3-010","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 连接的端点、连接的唯一确定方式以及连接管理的三个阶段与三个要解决的问题","level":"l2","title":"连接端点与连接管理","answer":"【结论】TCP 连接的端点是套接字，一条连接由通信双方的两个套接字唯一确定；每条 TCP 连接都包含连接建立、数据传送和连接释放三个阶段。\n1. 端点：每条 TCP 连接有两个端点，这些端点既不是主机、IP 地址，也不是应用进程或传输层端口，而是套接字。\n2. 唯一确定：一条 TCP 连接由通信双方的两个套接字唯一确定。\n3. 复用现象：同一个 IP 地址可以参与多个不同的 TCP 连接，同一个端口号也可以出现在多个不同的 TCP 连接中。\n4. 建立连接要解决的三个问题：使通信双方确知对方的存在；允许双方协商相关参数（如最大窗口值、是否使用窗口扩大选项、时间戳选项等）；为传输实体分配必要的资源（如缓存空间、连接表项等）。\n背诵要点：连接由两个套接字定死；建立连接解决“认得对方、谈好参数、备好资源”三件事。","keywords":["TCP连接","套接字","连接三阶段","协商参数","分配资源"],"source":"王道2027版 印刷页 238（PDF p250）","status":"final"},{"id":"net-ch5-5.3-011","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 三次握手的报文段字段、状态迁移与连接最终建立","level":"l1","title":"三次握手","answer":"【结论】TCP 用三次握手建立连接：客户发 SYN 请求，服务器回 SYN 加 ACK，客户再回 ACK 确认，双方进入 ESTABLISHED 状态。\n1. 初始状态：两端 TCP 进程均处于 CLOSED 状态；连接建立前服务器完成一些准备工作后进入 LISTEN 状态，等待客户的连接请求。\n2. 第一步：客户发送连接请求报文段，SYN=1、seq=x，进入 SYN-SENT（同步已发送）状态。\n3. 第二步：服务器若同意建立连接，则返回 SYN=1、ACK=1、ack=x+1、seq=y 的确认报文段，进入 SYN-RCVD（同步已收到）状态。\n4. 第三步：客户发送 ACK=1、ack=y+1、seq=x+1 的确认报文段，进入 ESTABLISHED 状态；服务器收到该最终确认后也进入 ESTABLISHED 状态，连接正式建立。\n5. 状态链：CLOSED 到 LISTEN 到 SYN-SENT 到 SYN-RCVD 到 ESTABLISHED。\n6. 时间分析：从客户发出第一次握手的连接请求报文段时刻起算，客户最早可在 1RTT 后开始发送数据，而服务器最早要在 1.5RTT 后才能发送数据。\n背诵要点：三次握手记“请求、答应、确认”三步和三串数：seq=x，seq=y 且 ack=x+1，ack=y+1；时间上客户 1RTT、服务器 1.5RTT。","keywords":["三次握手","SYN","SYN-SENT","SYN-RCVD","ESTABLISHED"],"source":"王道2027版 印刷页 238-239（PDF p250-251）","status":"final"},{"id":"net-ch5-5.3-012","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"三次握手中 SYN 报文段不能携带数据但消耗序号，第三次握手不携带数据则不消耗序号","level":"l2","title":"三次握手的序号消耗","answer":"【结论】SYN 报文段不能携带数据但仍消耗一个序号；第三次握手的报文段可以携带数据，若不携带数据则不消耗序号。\n1. 前两次握手：SYN 报文段不能携带数据，但仍消耗一个序号，因此客户下一次发送的报文段序号 seq=x+1。\n2. 第三次握手：该报文段可以携带数据；若不携带数据，则不消耗序号，下一个数据报文段的序号仍为 x+1。\n3. SYN 出现次数：仅在前两次握手的报文段中 SYN=1。\n4. ACK 出现次数：仅在第一次握手的报文段中 ACK=0，因为此时尚未收到任何报文段；第二次、第三次握手都 ACK=1。\n5. 计算套路：题目给初始序号 200，则第三次握手的 seq=201；若第三次不携带数据，第一个数据报文段的序号仍是 201。\n背诵要点：SYN 不装数据却占一个号；第三次握手不装数据就不占号，装数据才占号。","keywords":["三次握手","消耗序号","初始序号","ACK=0","数据报文段序号"],"source":"王道2027版 印刷页 239（PDF p251）","status":"final"},{"id":"net-ch5-5.3-013","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"SYN 洪泛利用三次握手中服务器提前分配资源的弱点耗尽半开连接队列，以及常见的防范思路","level":"l3","title":"SYN 洪泛攻击","answer":"【结论】SYN 洪泛攻击利用三次握手中服务器在连接尚未建立时就分配资源的弱点，让攻击者发送大量不会完成握手的 SYN 报文段，占满服务器的半开连接队列，使其无法响应正常请求。\n1. 弱点来源：三次握手的第二步中，服务器收到 SYN 后即回送 SYN 加 ACK 并进入 SYN-RCVD 状态，此时连接尚未建立，但服务器已为它分配了缓存空间和连接表项。\n2. 攻击方式：攻击者在短时间内发送大量 SYN 报文段，其源地址多为伪造；服务器逐个回送 SYN 加 ACK 并等待第三次握手的 ACK，而这些确认永远不会到达。\n3. 后果：服务器的半开连接队列被占满、资源耗尽，正常的连接请求得不到响应，表现为拒绝服务。\n4. 防范思路：不立即为连接分配资源而是把状态编码进序号、收到第三次握手的 ACK 后再分配（SYN cookie）；缩短 SYN 的超时时间；增大半开连接队列；限制单位时间内来自同一来源的 SYN 速率。\n5. 定位：这是对 TCP 连接建立机制的滥用，王道正文未展开，按拓展内容掌握原理即可。\n背诵要点：攻击点就在“服务器第二步先分配资源、第三步的 ACK 永不到来”；防御靠别急着分配、早点超时。","keywords":["SYN洪泛","半开连接","SYN-RCVD","拒绝服务","SYN cookie"],"source":"王道2027版 印刷页 238-239（PDF p250-251）","status":"final"},{"id":"net-ch5-5.3-014","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 四次挥手的报文段字段、状态迁移与最终关闭","level":"l1","title":"四次挥手","answer":"【结论】TCP 用四次挥手释放连接：客户发 FIN，服务器回 ACK，服务器再发 FIN 加 ACK，客户最后回 ACK 并等待 2MSL。\n1. 第一步：客户决定关闭连接时发送连接释放报文段，FIN=1、seq=u，进入 FIN-WAIT-1（终止等待 1）状态。\n2. 第二步：服务器收到后立即发送 ACK=1、ack=u+1、seq=v 的确认报文段，进入 CLOSE-WAIT（关闭等待）状态；客户收到确认后进入 FIN-WAIT-2（终止等待 2）状态。\n3. 第三步：服务器若已无数据要发送，则发送 FIN=1、ACK=1、seq=w、ack=u+1 的报文段，进入 LAST-ACK（最后确认）状态。\n4. 第四步：客户发送 ACK=1、ack=w+1、seq=u+1 的确认报文段，进入 TIME-WAIT（时间等待）状态；服务器收到该确认后即进入 CLOSED 状态，客户等待 2MSL 后才进入 CLOSED。\n5. 状态链：客户侧 ESTABLISHED 到 FIN-WAIT-1 到 FIN-WAIT-2 到 TIME-WAIT 到 CLOSED；服务器侧 ESTABLISHED 到 CLOSE-WAIT 到 LAST-ACK 到 CLOSED。\n背诵要点：四次挥手记“我要关、我知道、我也关、我确认”，客户最后还要在 TIME-WAIT 待 2MSL。","keywords":["四次挥手","FIN","FIN-WAIT-1","CLOSE-WAIT","LAST-ACK"],"source":"王道2027版 印刷页 239-240（PDF p251-252）","status":"final"},{"id":"net-ch5-5.3-015","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"半关闭的含义，以及 FIN 报文段消耗序号、seq=w 可能大于 seq=v 的原因","level":"l2","title":"半关闭与挥手序号","answer":"【结论】收到 FIN 只表示对方关闭了它的发送方向，本方仍可继续发送数据，这就是半关闭；FIN 报文段即使不携带数据也消耗一个序号。\n1. 半关闭：TCP 是全双工的，可视为连接包含两条独立的数据通路；发送 FIN 的一端关闭了其发送方向，但对方仍可继续发送数据。\n2. seq=u 的取值：等于此前已发送数据的最后一个字节序号加 1。\n3. FIN 消耗序号：TCP 规定 FIN 报文段即使不携带数据，也消耗一个序号，因此对方确认时 ack=u+1。\n4. w 与 v 的关系：第三步的 seq=w，w 可能大于 v，因为服务器在半关闭期间可能又发送了数据。\n5. FIN 出现次数：仅在第一次和第三次挥手的报文段中 FIN=1；后三次挥手的报文段中 ACK=1。\n6. 附带：尽管协议并未禁止 FIN 段携带数据，但主流的操作系统一般不允许其携带数据。\n背诵要点：FIN 关的是“我这一路”，对方的发送方向还开着；FIN 不装数据也占一个号。","keywords":["半关闭","FIN","消耗序号","seq=u","全双工"],"source":"王道2027版 印刷页 240（PDF p252）","status":"final"},{"id":"net-ch5-5.3-016","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"时间等待状态要等 2MSL 的原因与两个目的","level":"l1","title":"TIME_WAIT 与 2MSL","answer":"【结论】客户在 TIME-WAIT 状态下要等待 2MSL（最长报文段寿命）才进入 CLOSED 状态，目的是确保最后一个 ACK 能到达服务器，并使本连接中滞留的旧报文段从网络中自然消失。\n1. 状态与时长：客户发出最后一个 ACK 后进入 TIME-WAIT 状态，还需等待时间等待计时器设置的 2MSL（Maximum Segment Lifetime，最长报文段寿命）后，才进入 CLOSED 状态。\n2. 目的之一：确保客户发送的最后一个 ACK 报文段能够到达服务器；若该 ACK 丢失，服务器会重传 FIN，客户在 2MSL 内还能再回一次 ACK。\n3. 目的之二：使本连接中所有可能滞留的旧报文段从网络中自然消失，避免影响新连接。\n4. 常见错项：说 2MSL 是为了“等待服务器处理完数据”或“防止网络拥塞”都是错的。\n背诵要点：2MSL 干两件事——把最后一个 ACK 送到，让旧报文段死绝。","keywords":["TIME_WAIT","2MSL","最长报文段寿命","最后一个ACK","旧报文段"],"source":"王道2027版 印刷页 240（PDF p252）","status":"final"},{"id":"net-ch5-5.3-017","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"从客户发出 FIN 起算双方释放连接的最短时间，以及保活计时器的探测参数","level":"l3","title":"挥手时间分析与保活计时器","answer":"【结论】若服务器收到释放请求后不再发送数据，则从客户发出 FIN 时刻起算，客户释放连接的最短时间为 1RTT 加 2MSL，服务器释放连接的最短时间为 1.5RTT。\n1. 客户侧：客户发 FIN 后要等服务器的 ACK、再等服务器的 FIN、再回 ACK，最后还要等 2MSL，共 1RTT 加 2MSL。\n2. 服务器侧：服务器收到客户的最终 ACK 后即进入 CLOSED，从客户发 FIN 起算共 1.5RTT。\n3. 前提条件：服务器收到释放请求后不再发送数据，即第三步的 FIN 紧跟着第二步的 ACK 发出。\n4. 保活计时器：TCP 还使用一个保活计时器，以防止客户突发故障导致服务器长期无效等待；服务器每收到一次数据就重置该计时器，若计时器超时仍未收到数据，则每隔 75 秒发送一个探测报文段，若连续 10 次探测均无响应，则判定客户已故障并关闭该连接。\n背诵要点：服务器总是 1.5RTT 收工，客户还要多背 2MSL；保活计时器 75 秒一探、连探 10 次就断。","keywords":["四次挥手","1.5RTT","2MSL","保活计时器","75秒"],"source":"王道2027版 印刷页 240（PDF p252）","status":"final"},{"id":"net-ch5-5.3-018","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 实现可靠传输的四种机制，以及序号按字节编号的具体示例","level":"l2","title":"可靠传输的四种机制","answer":"【结论】TCP 在不可靠的 IP 层之上通过检验、序号、确认和重传四种机制实现可靠传输，确保接收方从缓存中读取的字节流与发送方发出的字节流完全一致。\n1. 检验：与 UDP 类似，对首部和数据部分计算检验和。\n2. 序号：对字节流中的每个字节依次编号，而不是对报文段整体编号；序号字段的值指明本报文段所发送数据的第一个字节的序号。\n3. 序号算例：A 的发送缓存区中有 10B 数据，序号从 0 开始编号；第一个报文段包含 0 至 2 号数据字节，其序号是 0；第二个报文段的序号是 3；第三个报文段的序号是 6；第四个报文段的序号是 8。\n4. 确认与重传：接收方用确认序号告知期望的下一个字节，发送方靠超时和冗余 ACK 触发重传。\n背诵要点：可靠传输四件套“检、序、认、重”；序号跟着字节走，不跟着报文段走。","keywords":["可靠传输","检验","序号","确认","重传"],"source":"王道2027版 印刷页 240-241（PDF p252-253）","status":"final"},{"id":"net-ch5-5.3-019","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"TCP 默认累积确认的含义与捎带确认的使用","level":"l2","title":"累积确认与捎带确认","answer":"【结论】TCP 默认使用累积确认，即确认按序到达的连续字节，确认序号为第一个未收到字节的序号；接收方也可以在有数据要发送时将确认信息顺便捎带上。\n1. 累积确认的含义：确认的是“到某个序号为止全部收到”，而不是逐段单独确认。\n2. 确认序号取值：等于第一个未收到字节的序号。\n3. 算例一：B 已收到第一个和第二个报文段，此时希望收到的下一个报文段的数据从 6 号字节开始，因此确认序号字段置为 6。\n4. 算例二：B 收到了第一个和第三个报文段、尚未收到第二个，B 仍在等待从 3 号字节开始的连续数据，因此确认序号字段置为 3。\n5. 捎带确认：接收方可以在合适时机发送确认，也可以在有数据要发送时将确认信息顺便捎带上。\n背诵要点：累积确认只报“我连续收到了哪”，缺一个就卡在那儿；有数据要发就顺便把确认捎上。","keywords":["累积确认","确认序号","捎带确认","失序","连续字节"],"source":"王道2027版 印刷页 241（PDF p253）","status":"final"},{"id":"net-ch5-5.3-020","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"超时计时器的设置、往返时间 RTT 的测量与 RTO 应略大于 RTTS 的原因","level":"l1","title":"超时重传与 RTO 估计","answer":"【结论】TCP 每发送一个报文段就为该报文段设置一个超时计时器，到期仍未收到确认就重传；重传时间 RTO 由加权平均往返时间 RTTS 动态调整，应略大于 RTTS 但不能大太多。\n1. 计时器：TCP 每发送一个报文段，就会对该报文段设置一个超时计时器；当计时器到期仍未收到确认时，TCP 将重传该报文段。\n2. RTT 的测量：记录报文段发出的时间及收到相应确认的时间，两者之差称为报文段的往返时间 RTT。\n3. 自适应算法：TCP 维护一个加权平均往返时间 RTTS，并根据新测量的 RTT 样本值动态调整 RTTS。\n4. RTO 的取值：超时重传时间 RTO 应略大于 RTTS，但也不能大太多；否则当报文段丢失时，TCP 无法迅速重传，导致数据传输延迟增大。\n5. 原因：TCP 下层是互联网环境，IP 数据报所选的路由变化很大，因此传输层的往返时延波动也较大，必须自适应而不能用固定值。\n背诵要点：RTO 略大于 RTTS——取小了会误重传，取大了会慢半拍。","keywords":["超时重传","RTO","RTTS","RTT","自适应算法"],"source":"王道2027版 印刷页 241（PDF p253）","status":"final"},{"id":"net-ch5-5.3-021","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"冗余 ACK 的产生条件、快速重传的触发条件与“共收到 4 个确认”的易错点","level":"l1","title":"冗余 ACK 与快速重传","answer":"【结论】冗余 ACK 是再次确认某个报文段的 ACK 而发送方先前已收到过该报文段的确认；当发送方收到对同一个报文段的 3 个冗余 ACK 时，即可认为紧跟其后的报文段已丢失并立即重传，这就是快速重传。\n1. 产生条件：TCP 规定，每当比期望序号大的失序报文段到达时，立即发送一个冗余 ACK，指明下一个期待字节的序号。\n2. 例子：A 发送编号为 1 至 5 的报文段，其中 2 号报文段在链路中丢失；3、4、5 号报文段到达 B 时成为失序报文段，于是 B 立即发送 3 个对 1 号报文段的冗余 ACK，表示自己期望接收 2 号报文段。\n3. 触发条件：当发送方收到对同一个报文段的 3 个冗余 ACK 时，可认为紧跟在这个被确认报文段之后的报文段已丢失，并立即重传，无须等待超时计时器到期。\n4. 易错点：对 1 号报文段的正常确认不能称为冗余 ACK，只有在收到失序的 3、4、5 号报文段后发回的确认才叫冗余 ACK；因此触发快重传时，发送方共收到 4 个对 1 号报文段的确认。\n背诵要点：3 个冗余 ACK 触发重传，但发送方手里一共攥着 4 个相同确认。","keywords":["冗余ACK","快速重传","3个冗余ACK","失序报文段","4个确认"],"source":"王道2027版 印刷页 241-242（PDF p253-254）","status":"final"},{"id":"net-ch5-5.3-022","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"流量控制的作用、接收窗口 rwnd 的调整方式，以及传输层与数据链路层流量控制的区别","level":"l1","title":"流量控制与接收窗口","answer":"【结论】流量控制是一种速度匹配服务，TCP 利用滑动窗口机制实现，接收方维持接收窗口 rwnd 并按接收缓存大小动态调整，发送方的发送窗口不能超过 rwnd。\n1. 目的：确保发送方的发送速率不会过快，以便让接收方能够及时处理，即匹配发送方的发送速率与接收方的读取速率。\n2. 机制：接收方维持一个接收窗口 rwnd，该窗口大小根据当前接收缓存的大小动态调整，反映了接收方的容量。\n3. 通告方式：接收方将此窗口值写入 TCP 首部的“窗口”字段，以通知发送方；rwnd 表示接收方允许连续接收的最大字节数。\n4. 约束：发送方的发送窗口不能超过接收方给出的接收窗口值，从而限制发送方向网络注入报文的速率。\n5. 教材示例：连接建立时 B 告诉 A“我的接收窗口 rwnd=400”；随后 B 进行三次流量控制，分别将窗口减至 300、100、0，这三个报文段都设置了 ACK=1。\n6. 与数据链路层的区别：传输层实现的是端到端（两个进程之间）的流量控制，数据链路层实现的是相邻节点之间的流量控制；数据链路层滑动窗口的大小一般为固定值，而传输层的窗口大小可以根据接收方的缓存情况动态变化。\n背诵要点：rwnd 是接收方给的额度，发送窗口不能超；窗口通告必须 ACK=1 才有意义。","keywords":["流量控制","接收窗口","rwnd","滑动窗口","速度匹配"],"source":"王道2027版 印刷页 242-243（PDF p254-255）","status":"final"},{"id":"net-ch5-5.3-023","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"零窗口通知丢失导致的死锁与持续计时器的破解办法","level":"l1","title":"零窗口与持续计时器","answer":"【结论】若接收方发出的非零窗口通知丢失，双方会陷入相互等待的死锁；TCP 为每个连接设置持续计时器，发送方收到零窗口通知就启动它，超时后发送零窗口探测报文段来打破死锁。\n1. 死锁场景：B 向 A 发送了零窗口通知后不久，B 的接收缓存又有了一些存储空间，于是向 A 发送非零窗口通知，然而这个报文段在传输过程中丢失了；A 仍在等窗口，B 在等数据，双方陷入相互等待的死锁状态。\n2. 持续计时器：TCP 为每个连接设有一个持续计时器，只要发送方收到对方的零窗口通知，就启动该计时器。\n3. 探测：若计时器超时，则发送方发送一个零窗口探测报文段，而对方会在确认该探测报文段时给出当前的窗口值。\n4. 结果处理：若窗口仍然是零，则发送方收到确认报文段后重新设置持续计时器；若窗口不是零，则死锁状态就可以打破了。\n背诵要点：零窗口要配持续计时器；探测报文段是打破死锁的唯一手段。","keywords":["零窗口","持续计时器","死锁","探测报文段","窗口通告"],"source":"王道2027版 印刷页 242-243（PDF p254-255）","status":"final"},{"id":"net-ch5-5.3-024","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"糊涂窗口综合症的表现与发送方、接收方各自的避免办法","level":"l3","title":"糊涂窗口综合症","answer":"【结论】糊涂窗口综合症是指发送方和接收方之间反复传送很小的数据段，导致网络效率极低的现象，解决办法是让双方都不要发送或通告过小的窗口。\n1. 问题来源：接收方缓存刚空出一小点就通告一个很小的窗口，发送方立刻发来一个很小的报文段，首部开销占比极高而有效载荷很少。\n2. 发送方对策：不要一有数据就发，而是等发送缓存中的数据积累到一定量（如一个 MSS 或发送窗口的一半）再组成报文段发送。\n3. 接收方对策：不要一有空闲缓存就通告小窗口，而是等接收缓存空出一定比例（如一半）或能容纳一个 MSS 时，再通告非零窗口。\n4. 与零窗口的关系：零窗口是“完全不能收”，糊涂窗口是“能收但只收一点点”，两者都靠窗口通告的时机来控制。\n背诵要点：小窗口来回倒腾最费首部，攒够再发、攒够再通告就治好了。","keywords":["糊涂窗口综合症","小窗口","MSS","窗口通告","发送缓存"],"source":"王道2027版 印刷页 242-243（PDF p254-255）","status":"final"},{"id":"net-ch5-5.3-025","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"拥塞控制的定义，以及拥塞控制与流量控制在目标、范围上的区别","level":"l2","title":"拥塞控制与流量控制的区别","answer":"【结论】拥塞控制是防止过多的数据注入网络、保证网络中的路由器或链路不致过载，是一个全局性过程；流量控制关注点对点通信中接收方的处理能力，是一个端到端的问题。\n1. 拥塞控制的定义：防止过多的数据注入网络，以保证网络中的路由器或链路不致过载。\n2. 感知方式：出现拥塞时，通信端点通常无法直接获知拥塞的具体细节，只能通过表现（如时延增加）间接感知。\n3. 区别一：拥塞控制的目标是使网络能够承受当前的负载，涉及所有主机、路由器及影响网络性能的各种因素；流量控制则由接收方通过窗口机制抑制发送方的发送速率，以确保自身能及时接收数据。\n4. 区别二：二者目标不同，但都是通过调节发送方的发送速率来实现控制效果的。\n5. 举例：某链路传输速率 10Gb/s，一台大型机以 1Gb/s 向一台 PC 传文件时带宽充足不存在拥塞，但 PC 处理能力有限来不及接收，需流量控制；反之若有 100 万台 PC 同时各以 1Mb/s 通过该链路传输，问题就变成网络总负载是否超出承载能力，需要拥塞控制。\n背诵要点：拥塞控制管“全网堵不堵”，流量控制管“对方收不收得下”。","keywords":["拥塞控制","流量控制","全局性","端到端","过载"],"source":"王道2027版 印刷页 243（PDF p255）","status":"final"},{"id":"net-ch5-5.3-026","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"拥塞窗口 cwnd 的调整原则与发送窗口取 min(接收窗口, 拥塞窗口)","level":"l1","title":"拥塞窗口与发送窗口","answer":"【结论】拥塞窗口 cwnd 的大小取决于当前网络的拥塞状况并动态调整，发送窗口的上限值等于 min[rwnd, cwnd]。\n1. 引入原因：发送方在确定发送速率时，既要考虑接收方的接收能力，也要从全局角度避免引发网络拥塞，因此除了接收窗口，还要维护一个拥塞窗口 cwnd。\n2. 调整原则：若网络未出现拥塞，则适当增大 cwnd，以便把更多分组发送出去，提高网络利用率；若检测到网络拥塞，则适当减少 cwnd，以减少注入网络的分组数量，缓解网络拥塞。\n3. 拥塞判断：通常只要发送方未按时收到确认（发生了超时），即可认为网络出现了拥塞。\n4. 发送窗口：发送窗口的上限值 = min[rwnd, cwnd]；接收窗口由接收方通过 TCP 首部的“窗口”字段通告，拥塞窗口由发送方自己维护。\n5. 分析假设：数据仅单向传输、接收方只发送确认报文、接收方拥有足够大的缓存空间、以最大报文段长度 MSS 作为拥塞窗口大小的单位。\n背诵要点：发送窗口取两者小的那个；cwnd 是发送方自己掐着，rwnd 是对方给的。","keywords":["拥塞窗口","cwnd","发送窗口","rwnd","min"],"source":"王道2027版 印刷页 243（PDF p255）","status":"final"},{"id":"net-ch5-5.3-027","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"慢开始算法的增长方式、初始值与“慢”字的真正含义","level":"l1","title":"慢开始算法","answer":"【结论】慢开始从较小的拥塞窗口开始，每收到一个对新报文段的确认就把 cwnd 加 1，每经过一个传输轮次（一个 RTT）cwnd 就加倍，呈指数增长。\n1. 基本思想：连接刚建立时发送方并不了解网络的负载情况，若立即向网络注入大量数据可能引发拥塞，因此先发送少量数据进行试探，未发生拥塞再逐步增大发送量。\n2. 初始值：初始拥塞窗口 cwnd 通常设为 1MSS（最新的 RFC 允许设置更多 MSS）。\n3. 增长规则：每收到一个对新报文段的确认，就将 cwnd 加 1。\n4. 轮次效果：每经过一个传输轮次（一个往返时延 RTT），cwnd 就会加倍，从而随传输轮次呈指数增长。\n5. 算例：初始 cwnd=1，发送第 1 个报文段；收到确认后 cwnd 增至 2，接着发送 2 个报文段；收到这 2 个确认后 cwnd 增至 4，下一轮便可发送 4 个报文段，依此类推。\n6. “慢”的含义：慢开始的“慢”并非指增长速度慢，而是指从较小的 cwnd（如 1）开始谨慎试探网络状态，从而有效预防拥塞。\n背诵要点：慢开始一点不慢，一个 RTT 翻一倍；慢在起点低，不在涨得慢。","keywords":["慢开始","cwnd","指数增长","1MSS","传输轮次"],"source":"王道2027版 印刷页 243-244（PDF p255-256）","status":"final"},{"id":"net-ch5-5.3-028","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"拥塞避免算法的线性增长方式与慢开始门限 ssthresh 的切换规则","level":"l1","title":"拥塞避免与切换规则","answer":"【结论】拥塞避免算法每经过一个传输轮次把 cwnd 加 1 而不是加倍，使 cwnd 按线性规律缓慢增长；当 cwnd 增长至慢开始门限 ssthresh 时，停止慢开始，转而采用拥塞避免算法。\n1. 目标：让 cwnd 缓慢增长，以降低拥塞风险，防止网络过早出现拥塞。\n2. 增长规则：每经过一个传输轮次（收到本轮所有报文段的确认），就将 cwnd 加 1，而不是加倍，从而使 cwnd 按线性规律缓慢增长（加法增大）。\n3. 慢开始门限：为防止 cwnd 无限制增长，还需设置一个慢开始门限 ssthresh（阈值）。\n4. 切换规则：当 cwnd 小于 ssthresh 时使用慢开始算法；当 cwnd 大于 ssthresh 时使用拥塞避免算法；当 cwnd 等于 ssthresh 时，既可使用慢开始算法，又可使用拥塞避免算法（常规做法）。\n5. 提醒：拥塞避免并不能完全避免拥塞，所谓拥塞避免只是在该阶段把拥塞窗口按线性规律增长，使网络较不容易发生拥塞。\n背诵要点：慢开始按倍数涨，拥塞避免按加 1 涨；过门限就换算法。","keywords":["拥塞避免","ssthresh","线性增长","加法增大","切换规则"],"source":"王道2027版 印刷页 244（PDF p256）","status":"final"},{"id":"net-ch5-5.3-029","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"网络出现拥塞（超时）时 cwnd 与 ssthresh 的调整、图 5.10 的曲线走势与两个易错点","level":"l1","title":"超时处理与 cwnd 曲线","answer":"【结论】只要发送方判断网络出现拥塞（如发生超时），就把 ssthresh 调整为当前 cwnd 的一半（但不得小于 2）、把 cwnd 重置为 1，并重新执行慢开始算法。\n1. 三步操作：将慢开始门限 ssthresh 调整为当前 cwnd 的一半（但不得小于 2）；将 cwnd 重置为 1；重新执行慢开始算法。\n2. 目的：迅速减少注入网络的分组数量，使得发生拥塞的路由器有足够时间把队列中积压的分组处理完。\n3. 乘法减小：当网络发生超时（通常意味着很可能出现了拥塞），将 ssthresh 调整为当前 cwnd 的一半并重新进入慢开始阶段；如果网络频繁发生拥塞，ssthresh 会下降得很快，从而大幅减少注入网络的分组数量。\n4. 图 5.10 示例：初始 cwnd=1、ssthresh=16；慢开始到 cwnd=16 时转拥塞避免；当 cwnd=24 时网络出现拥塞，则 ssthresh 调整为 12、cwnd 重置为 1 并重新慢开始；此后 cwnd 再次增长到 12 时改为执行拥塞避免算法。\n5. 易错点一：慢开始阶段若 2 倍的 cwnd 大于 ssthresh，则下一个传输轮次后的 cwnd 应等于 ssthresh，而不是 2 倍的 cwnd。例如第 16 个轮次时 cwnd=8、ssthresh=12，则第 17 个轮次后 cwnd=12，而不是 16。\n6. 易错点二：超时后 cwnd 直接归 1，不是减半；减半的是 ssthresh。\n背诵要点：超时就把门限砍一半、窗口归 1；翻倍会越过门限时，要停在门限上。","keywords":["超时","ssthresh","乘法减小","cwnd归1","慢开始门限"],"source":"王道2027版 印刷页 244-245（PDF p256-257）","status":"final"},{"id":"net-ch5-5.3-030","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"快重传算法的原理：接收方立即确认与发送方收到 3 个冗余 ACK 就重传","level":"l1","title":"快重传算法","answer":"【结论】快重传的核心是让发送方在超时前尽早重传丢失的报文段：接收方收到报文段后立即确认，收到失序报文段时立即对最后一个按序到达的报文段发送重复确认；发送方连续收到 3 个相同的冗余 ACK 即可判定报文段丢失并立即重传。\n1. 引入原因：有时个别报文段因偶然原因丢失，但网络并未真正拥塞；若发送方等待超时才重传，则会误判为拥塞并启动慢开始算法，导致传输效率下降。\n2. 接收方义务一：不应等到有数据要发送时才捎带确认，而应在收到报文段后立即确认。\n3. 接收方义务二：特别是收到失序报文段时，要立即对最后一个按序到达的报文段发送重复确认（冗余 ACK）。\n4. 发送方动作：连续收到 3 个相同的冗余 ACK 时，即可判定对应报文段已丢失，并立即重传，而无须等待超时计时器到期。\n背诵要点：接收方见到失序就重复确认，发送方攒够 3 个重复确认就立刻重传。","keywords":["快重传","冗余ACK","失序报文段","立即确认","3个重复确认"],"source":"王道2027版 印刷页 245（PDF p257）","status":"final"},{"id":"net-ch5-5.3-031","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"快恢复算法的思路：不把 cwnd 归 1 而是减半后直接进入拥塞避免","level":"l1","title":"快恢复算法","answer":"【结论】当发送方连续收到 3 个冗余 ACK 时，说明网络很可能并未发生严重拥塞，此时把 ssthresh 调整为当前 cwnd 的一半，并把 cwnd 也调整为当前 cwnd 的一半（等于 ssthresh），然后直接进入拥塞避免阶段线性增长。\n1. 判断依据：连续收到 3 个冗余 ACK，表明后续多个报文段已成功抵达接收方，说明网络很可能并未发生严重拥塞。\n2. 第一步：发送方执行“乘法减小”策略，将 ssthresh 调整为当前 cwnd 的一半，以预防潜在的拥塞。\n3. 第二步：与慢开始算法的不同之处是，它不将 cwnd 重置为 1，而是将 cwnd 也调整为当前 cwnd 的一半（等于 ssthresh）。\n4. 第三步：直接进入拥塞避免阶段，使 cwnd 缓慢线性增长。\n5. 名称由来：由于跳过了从 cwnd=1 开始的慢开始过程，因此称为快恢复。\n6. 图 5.11 示例：前 20 个轮次与图 5.10 相同；在第 21 轮次（cwnd=16）发送方连续收到 3 个冗余 ACK，此时不启动慢开始而执行快恢复，设置 ssthresh=cwnd/2=8、cwnd=ssthresh=8，并开始执行拥塞避免算法。\n背诵要点：快恢复只砍一半不归 1，砍完直接走拥塞避免，省掉从 1 重新爬的过程。","keywords":["快恢复","ssthresh","cwnd减半","拥塞避免","乘法减小"],"source":"王道2027版 印刷页 245（PDF p257）","status":"final"},{"id":"net-ch5-5.3-032","chapter":"第5章 传输层","subject":"net","section":"5.3 TCP","topic":"四种拥塞控制算法的使用总结与 cwnd 类计算题的解题套路","level":"l2","title":"四算法总结与计算套路","answer":"【结论】TCP 连接建立或网络出现超时时，采用慢开始和拥塞避免算法（ssthresh=cwnd/2，cwnd=1）；发送方收到 3 个冗余 ACK 时，采用快重传和快恢复算法（ssthresh=cwnd/2，cwnd=ssthresh）。\n1. 慢开始加拥塞避免：用于连接建立后的正常增长，以及超时后的恢复；超时时 ssthresh 取当前 cwnd 的一半，cwnd 置 1。\n2. 快重传加快恢复：用于收到 3 个冗余 ACK 的场合；ssthresh 取当前 cwnd 的一半，cwnd 也取当前 cwnd 的一半（等于 ssthresh），随后线性增长。\n3. 计算套路一：拥塞窗口为 34KB 时超时，则 ssthresh=17KB、cwnd=1KB，再经 4 个 RTT 的慢开始后 cwnd=16KB（未超门限）。\n4. 计算套路二：拥塞窗口为 34KB 时收到 3 个冗余 ACK，则 ssthresh=17KB、cwnd=17KB，再经 4 个 RTT 的拥塞避免后 cwnd=21KB（每个 RTT 加 1KB）。\n5. 计算套路三：慢开始门限为 8、cwnd 升到 12 时超时，则新 ssthresh=6，此后 cwnd 依次为 1、2、4、8、9、10、11、12、1、2、4、6、7、8、9，第 13 次传输时 cwnd=7。\n6. 计算套路四：MSS=2KB、接收窗口 24KB、RTT=10ms 且从慢开始，则 cwnd 依次为 2、4、8、16、24，共需 4 个 RTT 即 40ms。\n7. 混合题型：当题目同时出现接收窗口 rwnd 和拥塞窗口 cwnd 时，发送窗口取两者中的较小者，例如 cwnd 已涨到 16KB 而接收窗口只有 10KB，则发送窗口恒为 10KB。\n背诵要点：超时“门限减半窗口归 1”，三冗余 ACK“门限窗口一起减半”；先算 cwnd，再与 rwnd 取小。","keywords":["慢开始","拥塞避免","快重传","快恢复","cwnd计算","ssthresh"],"source":"王道2027版 印刷页 245-246（PDF p257-258）","status":"final"},{"id":"net-ch5-5.4-001","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"MSS 设置过大或过小分别带来的问题与默认值 536B 的由来","level":"l2","title":"MSS 设置过大或过小的影响","answer":"【结论】MSS 的设定与接收方的缓存大小或接收窗口无关，其主要目的是避免 IP 分片；MSS 太小会显著降低网络利用率，太大会导致 IP 分片、任一分片丢失都要重传整个报文段。\n1. 与接收窗口无关：MSS 的设定与接收方的缓存大小或接收窗口无关，其主要目的是避免 IP 分片。\n2. 太小的代价：每个 TCP 报文段至少要加上 40B 的首部（TCP 首部 20B 加 IP 首部 20B）才能形成一个 IP 数据报；极端情况下若数据部分仅 1B，则有效载荷占比仅为 1/41，若再考虑数据链路层的帧头尾开销，实际利用率还会更低。\n3. 太大的代价：在 IP 层传输时可能因超过路径中某段链路的 MTU 而被分片；接收端需将所有分片重新组装成原始 TCP 报文段，一旦任一分片丢失，整个报文段都必须重传，反而增加传输开销和延迟。\n4. 取值原则：MSS 应尽可能大，但以在 IP 层不发生分片为前提；然而互联网路径是动态变化的，某条路径上无须分片的 MSS 在另一条路径上可能仍需分片，故最佳 MSS 难以确定。\n5. 默认值：TCP 规定默认 MSS 为 536B，这意味着所有互联网主机都应能接收长度为 536B（数据）加 20B（TCP 首部）共 556B 的 TCP 报文段。\n背诵要点：MSS 只管防分片、不管缓存；太小浪费首部、太大招来分片，默认 536B。","keywords":["MSS","IP分片","MTU","536B","网络利用率"],"source":"王道2027版 印刷页 265（PDF p277）","status":"final"},{"id":"net-ch5-5.4-002","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"TCP 重传机制与 GBN、SR 的关系，以及 SACK 选项的作用","level":"l3","title":"TCP 是 GBN 还是 SR","answer":"【结论】TCP 的重传机制可视为 GBN 与 SR 的混合体：基础行为基于累积确认和冗余 ACK 实现高效单点重传，SACK 选项则进一步增强了选择性确认能力。\n1. 像 GBN 的地方：TCP 使用累积确认，确认序号表示到某个序号为止的数据全部收到。\n2. 不像 GBN 的地方：TCP 接收方不会丢弃正确到达但失序的报文段，而是将其缓存，并反复发送冗余 ACK，指明期望收到的下一个按序报文段的序号。\n3. 与 GBN 的关键差别：假设发送方连续发送 N 个报文段、其中第 k 个丢失，在 GBN 中接收方会丢弃所有失序报文段（第 k+1 个至第 N 个），发送方需重传从第 k 个开始的所有未确认报文段；而 TCP 仅重传丢失的第 k 个报文段，后续已缓存的报文段无须重传。\n4. 像 SR 的地方：TCP 还支持 SACK（选择性确认）选项，启用 SACK 后，接收方可明确告知发送方哪些非连续的数据块已成功接收，使重传行为更接近 SR 协议。\n背诵要点：累积确认像 GBN，缓存失序加 SACK 像 SR，所以 TCP 是两者的混血。","keywords":["GBN","SR","累积确认","SACK","冗余ACK"],"source":"王道2027版 印刷页 265-266（PDF p277-278）","status":"final"},{"id":"net-ch5-5.4-003","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"超时与三个冗余 ACK 反映的拥塞严重程度不同，因此对 cwnd 的处理不同","level":"l1","title":"超时置1与三ACK减半","answer":"【结论】超时与收到 3 个冗余 ACK 反映的网络拥塞严重程度不同：前者说明拥塞严重，故 cwnd 重置为 1；后者说明网络仍具一定传输能力，故只把 cwnd 减半。\n1. 三冗余 ACK 的含义：表明后续部分报文段已成功到达接收方（否则无法触发重复确认），说明网络仍具备一定传输能力，拥塞相对较轻。\n2. 三冗余 ACK 的处理：TCP 采用快速重传机制，将 cwnd 减半（乘法减小），适度降低发送速率，随后进入拥塞避免阶段线性增长。\n3. 超时的含义：意味着连 ACK 都未能及时返回，很可能网络已严重拥塞甚至局部瘫痪。\n4. 超时的处理：为最大限度缓解拥塞，TCP 将 cwnd 重置为 1MSS，进入慢开始阶段，极其谨慎地重新探测网络容量。\n5. 总结：超时代表更严重的拥塞，故采取更强的抑制措施；而冗余 ACK 表明网络尚可通信，只需适度退让。\n背诵要点：超时是重病下猛药、cwnd 归 1；冗余 ACK 是轻症慢调、cwnd 减半。","keywords":["cwnd","超时","冗余ACK","乘法减小","拥塞严重程度"],"source":"王道2027版 印刷页 266（PDF p278）","status":"final"},{"id":"net-ch5-5.4-004","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"两次握手无法防止已失效的连接请求报文段导致错误建立连接","level":"l2","title":"为什么不用两次握手","answer":"【结论】不采用两次握手，主要是为了防止已失效的连接请求报文段突然传送到服务器，导致错误建立连接。\n1. 场景：客户 A 向服务器 B 发送连接请求（SYN），该报文在网络中长时间滞留；A 超时后重传 SYN，B 收到后正常建立连接、完成数据传输并断开；此后先前滞留的旧 SYN 报文才到达 B。\n2. 三次握手的结果：B 收到旧 SYN 后会向 A 发送 SYN 加 ACK，但 A 发现该确认序号无效（非当前请求），直接丢弃，不回复 ACK，连接无法建立。\n3. 两次握手的结果：B 收到旧 SYN 后立即认为连接已建立，并等待 A 发送数据；而 A 并无此连接意图，不会响应，导致 B 长期占用资源，造成浪费。\n4. 结论：三次握手能有效避免因网络延迟的旧请求引发的资源误分配，而两次握手无法做到。\n背诵要点：多出来的那一次握手，是用来让客户否决“过期的求婚”。","keywords":["两次握手","失效连接请求","三次握手","资源浪费","旧SYN"],"source":"王道2027版 印刷页 266（PDF p278）","status":"final"},{"id":"net-ch5-5.4-005","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"固定初始序号会让迟到的旧报文段被新连接误收，因此初始序号必须随机化","level":"l3","title":"为什么初始序号要随机","answer":"【结论】若每次连接都使用相同固定的初始序号，迟到的旧报文段序号可能落在新连接的有效窗口内，被接收方误当作新数据接收，因此新连接的初始序号必须与之前连接使用过的序号不同。\n1. 场景：主机 A 与 B 频繁建立连接、传输数据后释放；A 发送的某些 TCP 报文段在网络中滞留较久，连接早已释放后才到达 B，而此时 A 与 B 已建立一条新的 TCP 连接。\n2. 冲突原因：由于新连接仍使用相同的初始序号，旧报文段的序号可能落在新连接的有效窗口内。\n3. 后果：B 误将其当作新数据接收，造成数据混乱或协议错误。\n4. 解决办法：新连接的初始序号必须与之前连接使用过的序号不同，确保迟到的旧报文段序号不会被新连接接受，因此 TCP 不能使用固定初始序号，而应采用随时间递增的随机化初始序号。\n背诵要点：初始序号必须一次一个样，否则旧报文段会冒充新数据。","keywords":["初始序号","ISN","旧报文段","有效窗口","随机化"],"source":"王道2027版 印刷页 266（PDF p278）","status":"final"},{"id":"net-ch5-5.4-006","chapter":"第5章 传输层","subject":"net","section":"5.4 本章小结及疑难点","topic":"即使底层无差错无故障，IP 层仍可能丢包、失序、重复，TCP 可靠交付并不多余","level":"l3","title":"链路无差错时可靠交付多余吗","answer":"【结论】不是多余的。即使所有链路的传输都不出现差错、所有节点也都不发生故障，IP 层本身是无连接且不可靠的，仍可能导致数据丢失、失序或重复，因此 TCP 的可靠交付依然必不可少。\n1. 原因一：IP 数据报独立选路，可能到达时失序。\n2. 原因二：路由异常可能导致数据报在网络中循环，TTL 减至 0 后被丢弃。\n3. 原因三：路由器突发拥塞时，来不及处理的数据报会被丢弃。\n4. 结论：以上问题均发生在网络层，与链路差错或节点故障无关；只有依靠 TCP 的可靠交付机制，才能确保目的进程收到完整、有序且无重复的数据。\n背诵要点：链路不出错不等于网络不丢包，可靠交付永远不多余。","keywords":["可靠交付","IP层不可靠","TTL","失序","路由器拥塞"],"source":"王道2027版 印刷页 266（PDF p278）","status":"final"},{"id":"net-ch6-6.1-001","chapter":"第6章 应用层","subject":"net","section":"6.1 网络应用模型","topic":"客户/服务器（C/S）模型的三步工作流程，以及客户主动请求、服务器被动响应的角色分工","level":"l1","title":"C/S 模型的工作流程","answer":"【结论】客户/服务器（C/S）模型中，服务器始终处于开启状态并被动等待，客户主动发起请求，二者角色固定、地位不平等。\n1. 服务器持续处于接收请求的状态，启动后便一直运行，被动等待并接收来自各地客户程序的请求。\n2. 客户主动发起服务请求，并等待接收处理结果；客户程序必须事先知道服务器程序的地址。\n3. 服务器收到请求后解析并处理，把结果返回给客户；服务器程序无须知道客户程序的地址，它可从客户发来的数据包中获取客户地址。\n4. 服务器上运行专门提供某种服务的程序，能够同时处理多个来自远程或本地客户程序的请求。\n背诵要点：客户主动请求、服务器被动响应；客户必须知道服务器地址，服务器不必知道客户地址。","keywords":["C/S模型","服务器","客户","被动等待","服务请求","地址"],"source":"王道2027版 印刷页 267（PDF p279）","status":"final"},{"id":"net-ch6-6.1-002","chapter":"第6章 应用层","subject":"net","section":"6.1 网络应用模型","topic":"C/S 模型的三个主要特点（地位不平等、客户之间不直接通信、可扩展性不佳）及常见应用","level":"l2","title":"C/S 模型的三大特点","answer":"【结论】C/S 模型的主要特点是各计算机地位不平等、客户之间通常不直接通信、可扩展性不佳。\n1. 地位不平等：服务器可通过用户权限控制来管理客户，整个网络的管理工作由少数服务器集中承担，因此管理更加集中和便捷。\n2. 客户之间通常不直接通信：例如在 Web 应用中，两个浏览器不会直接交换数据，数据都要经服务器中转。\n3. 可扩展性不佳：受服务器性能和网络带宽的制约，单个服务器支持的客户数量有限。\n4. 常见应用：Web、文件传输协议（FTP）和电子邮件（SMTP/POP3/IMAP）等采用 C/S 模型。\n背诵要点：C/S 三特点——地位不平等、客户不直连、扩展性差；系统瓶颈在服务器。","keywords":["C/S模型","地位不平等","不直接通信","可扩展性","Web","FTP"],"source":"王道2027版 印刷页 268（PDF p280）","status":"final"},{"id":"net-ch6-6.1-003","chapter":"第6章 应用层","subject":"net","section":"6.1 网络应用模型","topic":"客户与服务器的职责划分（客户面向用户、服务器面向任务），以及连接建立后服务器也可主动发数据的易错点","level":"l2","title":"客户与服务器的职责辨析","answer":"【结论】客户是服务请求方、面向用户，负责按用户需求发出请求并把结果呈现给用户；服务器是服务提供方、面向任务，专门完成某些服务。\n1. 客户与服务器通过网络实现协同计算任务，客户通常位于前端，服务器通常位于后端。\n2. 客户端主要实现如何显示信息与收集用户的输入，服务器主要实现数据的处理。\n3. 易错点：客户是连接的请求方，但一旦连接建立，服务器也能主动发送数据给客户端，用于错误通知一类的消息通知，因此“服务器永远不能主动发数据”是错误说法。\n4. 地址可知性：客户必须事先知道服务器地址才能发出连接请求，服务器则从客户端发来的数据包中获取客户端的地址。\n背诵要点：客户面向用户、服务器面向任务；连接建立后服务器也能主动发数据。","keywords":["客户","服务器","面向用户","面向任务","主动发送数据","前端与后端"],"source":"王道2027版 印刷页 269-270（PDF p281-282）","status":"final"},{"id":"net-ch6-6.1-004","chapter":"第6章 应用层","subject":"net","section":"6.1 网络应用模型","topic":"P2P 模型的基本思想、节点对等关系，以及其实现机制本质上仍基于客户/服务器模式","level":"l1","title":"P2P 模型的思想与本质","answer":"【结论】P2P 模型不再把内容集中存放在中心服务器，网络中每个节点同时具备下载和上传能力，权利与义务大体对等。\n1. 提出原因：C/S 模型中服务器的性能决定整个系统的吞吐能力，面临大量用户请求时服务器极易成为瓶颈。\n2. 角色不固定：各计算机没有固定的客户和服务器角色划分，任意两台计算机称为对等方（Peer），均可直接相互通信。\n3. 本质仍基于 C/S：每个节点访问其他节点资源时扮演客户角色，为其他节点提供资源时又充当服务器角色。\n4. 性质：P2P 网络是构建在 IP 网络之上的覆盖网络，是一种动态的逻辑网络，而不是与互联网并行建设的物理网络。\n背诵要点：P2P 角色对等、节点既是客户又是服务器，本质仍是 C/S，逻辑上是覆盖网络。","keywords":["P2P模型","对等方","覆盖网络","逻辑网络","节点对等","本质是C/S"],"source":"王道2027版 印刷页 268-270（PDF p280-282）","status":"final"},{"id":"net-ch6-6.1-005","chapter":"第6章 应用层","subject":"net","section":"6.1 网络应用模型","topic":"P2P 模型的四点优点、两点代价，以及 C/S 与 P2P 在向多用户分发文件时的性能差异","level":"l3","title":"P2P 的优点缺点与对比","answer":"【结论】P2P 相对 C/S 的优势集中在去中心化、可扩展与健壮，代价是节点要额外付出本机资源，并可能造成网络拥塞。\n优点：\n1. 减轻中心服务器的计算和带宽压力，消除对单一服务器的依赖，任务分散到众多节点，整体效率和资源利用率大幅提升。\n2. 多个节点之间可直接通信，无须通过中心服务器中转。\n3. 可扩展性好：P2P 网络的容量随节点数量的增加而自然增长，而传统服务器只能响应有限数量的并发请求。\n4. 网络健壮性强：单个节点的失效通常不会影响其他节点的正常运行。\n缺点：\n1. 节点在获取服务的同时还需为其他节点提供服务，会占用较多系统资源（如 CPU、内存和磁盘 I/O），可能影响本机性能。\n2. 据某些互联网调研机构统计，某些年份 P2P 应用曾占互联网流量的 50%～90%，导致网络严重拥塞，因此各 ISP 通常对 P2P 应用持限制或反对态度。\n对比：向多用户分发同一个文件时，P2P 允许用户从多个对等方并行下载，通常比 C/S 模型所需的时间短；而 C/S 模型中客户之间不能直接通信。\n背诵要点：P2P 用节点互助换可扩展性与健壮性，代价是本机资源开销与被 ISP 限制。","keywords":["P2P优点","可扩展性","健壮性","50%～90%","ISP限制","C/S对比"],"source":"王道2027版 印刷页 268-270（PDF p280-282）","status":"final"},{"id":"net-ch6-6.2-001","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"DNS 的命名与解析作用、三部分概念组成，以及其采用的 C/S 模型、UDP 与 53 号端口","level":"l1","title":"DNS 的作用与组成","answer":"【结论】域名系统（DNS）是互联网使用的命名系统，用于把便于人们记忆、具有特定含义的主机名转换为便于机器处理的 IP 地址。\n1. 工作模式与传输层：DNS 采用客户/服务器模型，其协议运行在 UDP 之上，使用 53 号端口。\n2. 概念组成：从概念上 DNS 可分为三部分，即层次域名空间、域名服务器和解析器。\n3. 实现形态：DNS 是一个联机分布式数据库系统，域名到 IP 地址的解析由运行在域名服务器上的程序完成。\n4. 必要性：相比难记的数字形式，人们更倾向于使用具有特定含义的字符串来标识互联网上的计算机。\n背诵要点：DNS 干两件事——命名与解析；C/S 模式、UDP 53 端口、由层次域名空间与域名服务器、解析器三部分组成。","keywords":["DNS","域名解析","UDP","53端口","层次域名空间","解析器"],"source":"王道2027版 印刷页 270（PDF p282）","status":"final"},{"id":"net-ch6-6.2-002","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"层次树状域名空间、域名标号的分级与书写位置，以及标号字符、63 字符与 255 字符的限制","level":"l2","title":"层次域名空间与标号规则","answer":"【结论】互联网采用层次树状结构的命名方法，任何连接到互联网的主机或路由器都拥有唯一的层次结构名称，即域名。\n1. 域（Domain）是名字空间中一个可被管理的划分，域可进一步划分为子域，子域还可继续细分，从而形成顶级域、二级域、三级域等层次结构。\n2. 域名由一系列标号组成，各标号之间用点分隔；级别最低的标号写在最左边，级别最高的顶级域名写在最右边。\n3. 例子：www.cskaoyan.com 由三个标号组成，com 是顶级域名，cskaoyan 是二级域名，www 是三级域名。\n4. 标号规则：英文字母不区分大小写；除连字符外不得使用其他标点符号；每个标号不超过 63 个字符；整个域名（含分隔点）的总长度不得超过 255 个字符。\n背诵要点：域名左低右高、点分标号；单个标号不超 63 字符，整个域名不超 255 字符。","keywords":["层次域名空间","标号","63个字符","255个字符","顶级域名","子域"],"source":"王道2027版 印刷页 270-271（PDF p282-283）","status":"final"},{"id":"net-ch6-6.2-003","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"顶级域名的三大类：国家顶级域名、通用顶级域名与用于反向解析的基础结构域名 arpa","level":"l2","title":"顶级域名的三大类","answer":"【结论】顶级域名（TLD）主要分为国家顶级域名、通用顶级域名和基础结构域名三大类。\n1. 国家顶级域名（ccTLD）：代表国家的域名，如 .cn 表示中国、.us 表示美国。\n2. 通用顶级域名（gTLD）：常见的有 .com（公司）、.net（网络服务机构），以及 .org、.edu、.gov、.aero 等。\n3. 基础结构域名：只有 arpa 一个，用于反向域名解析，即把 IP 地址转换为对应的域名。\n4. 域名空间呈树状：根之下是顶级域名，再往下依次是二级域名、三级域名、四级域名。\n背诵要点：顶级域三类——国家 ccTLD、通用 gTLD、基础结构 arpa；arpa 专管反向解析。","keywords":["顶级域名","ccTLD","gTLD","arpa","反向域名解析","树状结构"],"source":"王道2027版 印刷页 271（PDF p283）","status":"final"},{"id":"net-ch6-6.2-004","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"域名由上一级机构管理、顶级域名归 ICANN 管理，以及子域可授权给其他组织管理","level":"l3","title":"域名的分级管理","answer":"【结论】各级域名由其上一级的域名管理机构管理，顶级域名由互联网名称与数字地址分配机构（ICANN）管理，国家顶级域名下的二级域名由相应国家自行规定和管理。\n1. 顶级域名由 ICANN 管理，是全球域名空间的最高管理环节。\n2. 每个组织还可以将其所辖的域进一步划分为若干子域，并将这些子域委托给其他组织管理。\n3. 例：负责管理 cn 域的中国将 edu.cn 子域授权给中国教育和科研计算机网（CERNET）进行管理。\n4. 意义：管理权逐级下放，使庞大的域名空间得以分散管理、各负其责。\n背诵要点：域名逐级授权管理，顶级域归 ICANN，国家顶级域下的二级域由本国自定。","keywords":["ICANN","分级管理","子域授权","CERNET","edu.cn","域名管理"],"source":"王道2027版 印刷页 271（PDF p283）","status":"final"},{"id":"net-ch6-6.2-005","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"区与域的关系、区内节点连通性要求，以及权限域名服务器保存本区映射、每区建议至少两台","level":"l2","title":"区与权限域名服务器","answer":"【结论】一个服务器负责管辖（具有管理权限）的范围称为区，其范围小于或等于域；每个区都设有权限域名服务器，保存该区所有主机的域名到 IP 地址的映射信息。\n1. 一个区内的所有节点必须是连通的。\n2. 每个域名服务器不仅要能解析部分域名到 IP 地址的映射，还要能维护指向其他域名服务器的信息；当自身无法完成解析时，要能知道向哪个服务器进一步查询。\n3. 每台主机必须在所属区的权限服务器处登记，该服务器总能将其管辖的主机名解析为对应的 IP 地址。\n4. 可靠性：通常建议每个区配置至少两个权限域名服务器；实际上许多本地域名服务器也同时承担权限域名服务器的角色。\n背诵要点：区小于等于域、区内节点必须连通；主机要在权限服务器登记，每区建议至少两台。","keywords":["区","域","权限域名服务器","授权域名服务器","至少两个","区内连通"],"source":"王道2027版 印刷页 271-272（PDF p283-284）","status":"final"},{"id":"net-ch6-6.2-006","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"根、顶级、权限、本地四类域名服务器各自的职责范围，以及全球 13 个根域名服务器的集群冗余","level":"l1","title":"四类域名服务器","answer":"【结论】DNS 使用大量按层次结构组织的域名服务器，共有四类：根域名服务器、顶级域名服务器、权限域名服务器和本地域名服务器。\n1. 根域名服务器：最高层级，所有根域名服务器都知道全部顶级域名服务器的域名和 IP 地址；本地域名服务器自身无法解析时首先向它查询。全球共有 13 个根域名服务器，每个实际上都是由多个冗余服务器组成的集群，以提高可靠性和性能。它通常不直接把待查询域名解析为 IP 地址，而是返回下一步应查询的顶级域名服务器的地址。\n2. 顶级域名服务器：负责管理在其下注册的所有二级域名，例如 .com 顶级域名服务器管理所有以 .com 结尾的域名；返回的可能是最终的解析结果，也可能是下一步应当查找的域名服务器的 IP 地址。\n3. 权限域名服务器（授权域名服务器）：负责管理特定区的域名信息，总能将其管辖的主机名解析为对应的 IP 地址。\n4. 本地域名服务器：每家 ISP、一所大学甚至院系通常都会部署；主机发起的 DNS 查询请求首先发送给它，Windows 系统中“本地连接”填写的 DNS 服务器地址就是它的地址。\n5. 没有任何一台域名服务器包含互联网上所有主机的映射，这些映射分布在所有域名服务器上。\n背诵要点：根管顶级域、顶级管二级域、权限管一个区、本地是主机的第一站；根服务器全球共 13 个。","keywords":["根域名服务器","顶级域名服务器","权限域名服务器","本地域名服务器","13个","集群冗余"],"source":"王道2027版 印刷页 271-272（PDF p283-284）","status":"final"},{"id":"net-ch6-6.2-007","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"主机到本地域名服务器的递归查询：本地代查、只需向根发一次请求，以及递归给根带来的过重负载","level":"l1","title":"递归查询的工作方式","answer":"【结论】主机向本地域名服务器的查询都采用递归查询：本地域名服务器若不知道答案，就替主机去问，而不是让主机自行进行后续查询。\n1. 在递归查询中，本地域名服务器以 DNS 客户的身份，代替主机向根域名服务器继续发出查询请求。\n2. 本地域名服务器只需向根域名服务器发起一次查询，后续的查询过程由各级域名服务器之间递归完成，最终结果沿原路返回给主机。\n3. 缺点：这种方式会给根域名服务器带来过重负载，因此本地域名服务器到根的递归查询在实际中几乎不被采用。\n4. 无论后续采用何种查询方式，主机到本地域名服务器的这一段一定采用递归查询。\n背诵要点：主机问本地用递归——本地替你跑完全程；递归最省主机的事，却最累根服务器。","keywords":["递归查询","本地域名服务器","根域名服务器","代查","过重负载","一次请求"],"source":"王道2027版 印刷页 272-273（PDF p284-285）","status":"final"},{"id":"net-ch6-6.2-008","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"本地域名服务器到根及各上级服务器的迭代查询：只给下一步线索，由本地自己逐级问到底","level":"l1","title":"迭代查询的工作方式","answer":"【结论】本地域名服务器向根域名服务器的查询通常采用迭代查询：被询问的服务器只给出下一步该问谁，由本地域名服务器自己继续查。\n1. 根域名服务器收到查询后，要么直接给出所查询的 IP 地址，要么告诉本地域名服务器“下一步应向哪个顶级域名服务器查询”。\n2. 随后由本地域名服务器向该顶级域名服务器发起新的查询请求；顶级域名服务器同样要么给出 IP 地址，要么指向权限域名服务器。\n3. 如此逐级查询，直到获得目标 IP 地址，最后由本地域名服务器将结果返回给发起查询的主机。\n4. 记忆：主机到本地用递归，本地到根用迭代；迭代把反复查询的工作量留在了本地域名服务器。\n背诵要点：迭代查询只给线索不给结果，本地域名服务器自己一级级问到底。","keywords":["迭代查询","根域名服务器","顶级域名服务器","逐级查询","本地域名服务器","递归对比"],"source":"王道2027版 印刷页 272-273（PDF p284-285）","status":"final"},{"id":"net-ch6-6.2-009","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"以 y.abc.com 为例的完整解析八步、最多 8 个 UDP 报文，以及最少 0 次与最多 4 次查询的结论","level":"l2","title":"域名解析全过程","answer":"【结论】以查询主机 y.abc.com 的 IP 地址为例，整个域名解析过程最多涉及 8 个 UDP 报文，即 4 个查询报文和 4 个回答报文。\n1. 客户向其本地域名服务器发送 DNS 请求报文，这一段是递归查询。\n2. 本地域名服务器先查询本地缓存；若未命中，则以 DNS 客户身份向根域名服务器发送解析请求报文，这一段是迭代查询。\n3. 根域名服务器识别出该域名属于 .com 顶级域，返回 .com 顶级域名服务器 dns.com 的 IP 地址；本地域名服务器再向 dns.com 发请求。\n4. dns.com 识别出该域名属于 abc.com 区，返回其权限域名服务器 dns.abc.com 的 IP 地址；本地域名服务器再向 dns.abc.com 发请求。\n5. 权限域名服务器 dns.abc.com 返回 y.abc.com 对应的 IP 地址；本地域名服务器把结果保存到本地缓存，并返回给客户。\n6. 查询次数的常考结论：若本地域名服务器已缓存该域名的解析结果，则无须发出任何查询，最少为 0 次；若所有服务器都采用迭代查询且无缓存，最坏情况要依次向根、顶级、权限、次级权限域名服务器发起查询，最多为 4 次（如解析 www.abc.xyz.com）。\n背诵要点：一问一答共 8 个 UDP 报文；最少 0 次、最多 4 次查询是高频结论。","keywords":["8个UDP报文","查询报文","回答报文","最少0次","最多4次","解析举例"],"source":"王道2027版 印刷页 273（PDF p285）","status":"final"},{"id":"net-ch6-6.2-010","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"DNS 高速缓存的作用与 TTL 失效机制，以及主机端本地 DNS 缓存在解析链路中的位置","level":"l2","title":"DNS 高速缓存与 TTL","answer":"【结论】DNS 高速缓存用于存储近期查询过的域名与 IP 地址的映射，后续收到相同域名的查询时可直接从缓存返回结果，无须再次发起完整的解析流程。\n1. 目的：提高 DNS 查询效率，减少互联网上的查询流量。\n2. 失效机制：主机名与 IP 地址的映射关系并非永久有效，DNS 缓存中的记录会设置生存时间（TTL），到期后自动失效并被清除。\n3. 主机端也常维护本地 DNS 缓存，在运行过程中缓存最近访问过的域名；只有当本地缓存未命中时，才会向 DNS 服务器发起查询。\n4. 效果：既进一步提升解析速度，又减轻网络负载；解析过程的最后一步正是本地域名服务器把结果保存到缓存。\n背诵要点：高速缓存靠 TTL 保鲜——命中即秒回、过期即作废；主机与域名服务器都有缓存。","keywords":["高速缓存","TTL","生存时间","本地缓存","查询效率","减少流量"],"source":"王道2027版 印刷页 273（PDF p285）","status":"final"},{"id":"net-ch6-6.2-011","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"DNS 采用 UDP 而非 TCP 的原因：可重复执行加定时器重发，以及其对可靠性要求较低的取舍","level":"l3","title":"DNS 为何使用 UDP","answer":"【结论】DNS 使用传输层的 UDP 而非 TCP，因为它不需要 TCP 在发生传输错误时执行的自动重传功能。\n1. 对 DNS 服务器的访问，多次 DNS 请求都返回相同的结果，即做多次和做一次的效果一样，因此 DNS 操作可以重复执行。\n2. 具体做法：当一个进程做一次 DNS 请求时，它启动一个定时器；若定时器计满而未收到回复，它就再请求一次，这样做不会有害处。\n3. 真题结论：DNS 对可靠性的要求相对较低，且追求效率与低开销，因此在传输层通常使用无连接的 UDP 服务；而 FTP、SMTP、HTTP 都要求可靠传输，故使用有连接的 TCP。\n4. 所以 DNS 分组丢失并不会造成不可恢复的问题，靠上层定时器重发即可补上。\n背诵要点：DNS 图快不图稳——UDP 53 加定时器重发；丢一个包再问一次即可，不会出错。","keywords":["UDP","无连接","定时器重发","可重复执行","可靠性要求低","2018真题"],"source":"王道2027版 印刷页 277（PDF p289）","status":"final"},{"id":"net-ch6-6.2-012","chapter":"第6章 应用层","subject":"net","section":"6.2 域名系统","topic":"域名与 IP 地址、MAC 地址、主机均非一一对应：多 IP 同域名、多主机同域名、多域名同主机","level":"l1","title":"域名与 IP 的对应关系","answer":"【结论】域名与 IP 地址、MAC 地址、主机都不具有一一对应的关系。\n1. 一台主机若通过两块网卡连接到两个网络（如服务器双线接入），就具有两个 IP 地址，这两个 IP 地址可以映射到同一个域名上。\n2. 多台主机也可以映射到同一个域名上，例如用多台服务器实现负载均衡。\n3. 一台主机也可以映射到多个域名上，例如虚拟主机。\n4. 同一域名在不同时间可能解析出不同的 IP 地址，因此可以用多台服务器来分担负载；IP 子网中的主机也可以由不同的域名服务器来维护其映射。\n5. 易错点：Internet 上提供客户访问的主机一定要有 IP 地址，但不一定要有域名。\n背诵要点：域名与 IP 是多对多；主机必须有 IP，但不一定非得有域名。","keywords":["域名","IP地址","MAC地址","负载均衡","虚拟主机","多对多"],"source":"王道2027版 印刷页 275（PDF p287）","status":"final"},{"id":"net-ch6-6.3-001","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"FTP 的交互式访问与三项主要功能，以及其采用 C/S 模式、基于 TCP 提供可靠传输的定位","level":"l1","title":"FTP 的特点与功能","answer":"【结论】FTP 是互联网上使用最广泛的文件传输协议，采用客户/服务器工作模式、基于 TCP 提供可靠的传输服务，适用于异构网络中任意两台计算机之间传送文件。\n1. 特点：提供交互式访问，允许用户指定文件的类型与格式，并支持对文件设置存取权限。\n2. 屏蔽了不同计算机系统的底层细节，因此适用于在异构网络中的任意两台计算机之间可靠地传送文件。\n3. 功能一：支持不同类型主机系统（硬件、操作系统等均可不同）之间的文件传输。\n4. 功能二：通过用户权限管理，提供对远程 FTP 服务器上文件的管理能力。\n5. 功能三：通过匿名（anonymous）FTP 方式，实现公用文件的共享。\n6. 一个 FTP 服务器进程可同时为多个客户进程提供服务。\n背诵要点：FTP 三功能——跨异构系统传文件、权限管理远程文件、匿名共享；底层靠 TCP 保可靠。","keywords":["FTP","交互式访问","匿名FTP","TCP","C/S模式","异构网络"],"source":"王道2027版 印刷页 277（PDF p289）","status":"final"},{"id":"net-ch6-6.3-002","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"FTP 服务器主进程与从属进程的分工、四步工作流程，以及 FTP 作为有状态协议要维护用户状态","level":"l1","title":"FTP 服务器进程与工作步骤","answer":"【结论】FTP 服务器进程由两部分组成：一个主进程负责接收新请求，若干从属进程分别处理单个客户的请求，主进程与从属进程并发执行。\n1. 打开熟知端口 21（控制端口），供客户进程连接。\n2. 等待客户进程发起连接请求。\n3. 启动从属进程处理该请求，处理完毕后从属进程终止。\n4. 主进程返回等待状态，继续接收其他客户请求。\n5. FTP 是有状态协议，服务器需在整个会话期间维护用户的状态信息，例如必须将用户账户与控制连接相关联，并跟踪用户在远程目录树中的当前位置。\n背诵要点：主进程只接客、从属进程干活；21 号端口常开，会话期间服务器要记住用户状态。","keywords":["主进程","从属进程","21号端口","有状态协议","并发执行","会话"],"source":"王道2027版 印刷页 277（PDF p289）","status":"final"},{"id":"net-ch6-6.3-003","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"FTP 两个并行 TCP 连接的分工：控制连接占用服务器 21 端口、只传命令且贯穿整个会话","level":"l1","title":"控制连接与数据连接","answer":"【结论】FTP 在工作时使用两个并行的 TCP 连接：控制连接（服务器端口 21）和数据连接（服务器端口 20），采用两个独立端口有助于协议的清晰实现。\n1. 服务器监听 21 号端口，等待客户连接；建立在此端口上的连接称为控制连接。\n2. 控制连接用于传输控制命令，如登录、目录操作、传送命令等。\n3. FTP 客户通过控制连接向服务器发送文件传送请求，但控制连接本身不用于传输文件数据。\n4. 在文件传输过程中，仍可通过控制连接发送中断等指令，因此控制连接在整个会话期间保持打开状态。\n5. 由于命令走独立的控制连接，FTP 的控制信息属于带外传送。\n背诵要点：21 传命令、20 传数据；控制连接贯穿整个会话，数据连接用完即关。","keywords":["控制连接","数据连接","21端口","20端口","带外传送","并行连接"],"source":"王道2027版 印刷页 277-278（PDF p289-290）","status":"final"},{"id":"net-ch6-6.3-004","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"数据连接的建立与关闭，以及主动模式 PORT 与被动模式 PASV 下数据连接由谁发起、用哪个端口","level":"l2","title":"数据连接与两种传输模式","answer":"【结论】数据连接在每次文件传输时才建立、传输结束就关闭，是非持久的；它连接客户端与服务器端的数据传送进程，实际完成文件内容的传输。\n1. 服务器的控制进程收到客户发来的文件传输请求后，会创建一个数据传送进程并建立数据连接；传输结束后数据连接关闭，数据传送进程随之终止。\n2. 主动模式（PORT）：客户端首先连接服务器的 21 号端口并完成登录；需要传输数据时，客户端随机选择一个本地端口，并通过 PORT 命令将该端口号告知服务器；随后服务器通过 20 号端口主动连接到客户端指定的端口以传输数据。\n3. 被动模式（PASV）：客户端登录后发送 PASV 命令；服务器收到后在本地随机开放一个端口，并通过控制连接将该端口号返回给客户端；客户端再主动连接到该端口以传输数据。\n4. 两种模式的区别在于：是服务器主动连接客户端，还是服务器被动响应客户端的连接，这由客户端决定。\n5. 许多教材未详细介绍这两种模式，若无特别说明，可默认采用主动模式。\n背诵要点：PORT 是服务器主动连客户、走 20 端口；PASV 是服务器开随机端口等客户来连。","keywords":["数据连接","PORT","PASV","主动模式","被动模式","非持久"],"source":"王道2027版 印刷页 278（PDF p290）","status":"final"},{"id":"net-ch6-6.3-005","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"20 与 21 号端口都是服务器端端口、客户端端口由系统自动分配，以及 PASV 模式下数据端口不固定","level":"l2","title":"FTP 端口号的归属","answer":"【结论】说 FTP 使用 20、21 号端口，指的是服务器端使用的端口号；客户端两个连接的端口都由客户端系统自动分配。\n1. 服务器端：控制连接使用 TCP 的 21 号端口，数据连接使用 TCP 的 20 号端口。\n2. 客户端：控制连接和数据连接的 TCP 端口号都是由客户端系统自动分配的。\n3. 同理，HTTP 使用 80 号端口、SMTP 使用 25 号端口，也都是指相应协议服务器端所使用的端口号，客户端是用系统自动分配的端口向这些熟知端口发起连接。\n4. 默认 PORT 模式下，服务器用自己传送数据的熟知端口 20 与客户进程所提供的端口号建立数据传输连接，即客户进程的端口号是客户进程自己提供的。\n5. 易错：2017 真题中“服务器与客户端的 TCP 20 端口建立数据连接”是错的，20 是服务器端的端口；且服务器是否使用 20 号端口与传输模式有关，PORT 模式用 20，PASV 模式由服务器随机选定。\n6. 文件列表也是通过数据连接传输的，一个 FTP 用户发送 LIST 命令时，服务器通过 20 号端口传输该列表。\n背诵要点：20 与 21 都是服务器端口、客户端端口随机分配；PASV 模式下数据端口不一定用 20。","keywords":["20号端口","21号端口","客户端端口","熟知端口","PORT模式","LIST命令"],"source":"王道2027版 印刷页 280-281（PDF p292-293）","status":"final"},{"id":"net-ch6-6.3-006","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"带外传送与带内传送的区分、FTP 改远程文件要下改上两趟，以及 NFS 直接读写远程文件的对比","level":"l3","title":"带外传送与 NFS 对比","answer":"【结论】FTP 使用独立的控制连接传输命令，其控制信息属于带外（Out-of-band）传送。\n1. 带外传送指控制信息与数据信息通过不同的逻辑信道传送，FTP 正是如此：控制连接传命令，数据连接传文件。\n2. 带内传送指控制信息与数据信息通过同一个逻辑信道传送，例如 HTTP 的请求和响应报文都是在同一个 TCP 连接上进行的。\n3. 由此带来一个限制：使用 FTP 修改远程文件时，需先将文件下载到本地，修改后再传回服务器，整个过程涉及两次完整传输，效率较低，因此 FTP 并不适合用在两台计算机之间共享读写文件。\n4. 对比 NFS：网络文件系统允许进程直接打开远程文件，并在指定位置进行读、写操作，用户只需传输大文件中的特定片段，无须复制整个文件。\n背诵要点：FTP 命令带外走、HTTP 请求带内走；改远程文件 FTP 要下改上两趟，NFS 只传片段。","keywords":["带外传送","带内传送","NFS","HTTP","两次完整传输","远程文件"],"source":"王道2027版 印刷页 278（PDF p290）","status":"final"},{"id":"net-ch6-6.3-007","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"FTP 控制连接先建立后释放的顺序、21 号端口监听，以及命令所走连接、封装层次与 ASCII 与二进制传输","level":"l2","title":"FTP 连接顺序与常识","answer":"【结论】FTP 客户先连接服务器的 21 号端口建立控制连接，再建立数据连接；数据传送完毕后数据连接最先释放，控制连接最后释放。\n1. 服务器通过监听熟知端口 21（控制端口）得知有无服务请求，主进程在 21 号端口监听，而不是 20 号端口。\n2. 2009 真题：FTP 客户和服务器之间传递 FTP 命令时，使用的是建立在 TCP 之上的控制连接。\n3. 封装过程：FTP 服务器上的数据依次经过应用层、传输层、网络层、数据链路层及物理层，对应封装为数据、数据段、数据报、数据帧，最后是比特。\n4. 传输方式：FTP 支持 ASCII 和 Binary 两种方式，非加密文本文件通常采用 ASCII 方式传输，而图像、声音等非文本文件采用 Binary 方式传输。\n背诵要点：先建控制连接、后建数据连接，释放顺序相反；21 监听、命令走控制连接、文本用 ASCII。","keywords":["控制连接","连接顺序","21号端口监听","封装过程","ASCII","Binary"],"source":"王道2027版 印刷页 280-281（PDF p292-293）","status":"final"},{"id":"net-ch6-6.3-008","chapter":"第6章 应用层","subject":"net","section":"6.3 文件传输协议","topic":"FTP 与 TFTP 在传输层协议、熟知端口、连接结构上的区别，以及表 6.2 常见应用层协议端口小结","level":"l3","title":"FTP 与 TFTP 的区别","answer":"【结论】FTP 基于 TCP、使用服务器端的 20 与 21 号端口且控制与数据分离；TFTP 基于 UDP、使用 69 号端口，是简单文件传输协议。\n1. 传输层协议不同：FTP 用 TCP 提供可靠传输；TFTP 用 UDP，是无连接的，不具备 TCP 那样的可靠性保证。\n2. 熟知端口不同：FTP 数据连接为 20、控制连接为 21；TFTP 为 69。\n3. 连接结构不同：FTP 使用并行的控制连接与数据连接，命令与文件数据分开传送；TFTP 在协议小结中只对应一个 UDP 熟知端口 69，没有这种控制与数据分离的双连接结构。\n4. 常见应用层协议小结（表 6.2）：FTP 数据连接 TCP 20、FTP 控制连接 TCP 21、TELNET TCP 23、SMTP TCP 25、DNS UDP 53、TFTP UDP 69、HTTP TCP 80、POP3 TCP 110、SNMP UDP 161。\n5. 记忆线索：要求可靠传输的文件传送、邮件与网页类协议多用 TCP；DNS、TFTP、SNMP 这类追求简单与低开销的用 UDP。\n背诵要点：FTP 是 TCP 双连接 20 与 21，TFTP 是 UDP 单连接 69；要可靠选 TCP，要轻便选 UDP。","keywords":["FTP","TFTP","UDP","69端口","表6.2","可靠与轻便"],"source":"王道2027版 印刷页 294（PDF p306）","status":"final"},{"id":"net-ch6-6.4-001","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"电子邮件系统的三个组成部分及各部分的职责（用户代理、邮件服务器、协议）","level":"l1","title":"电子邮件系统的三个组成部分","answer":"【结论】完整的电子邮件系统由三部分组成：用户代理（UA）、邮件服务器、电子邮件所依赖的协议（如 SMTP、POP3 或 IMAP）。\n1. 用户代理：用户与电子邮件系统之间的接口，提供友好的操作界面，至少具备撰写、显示和处理邮件的基本功能；通常是运行在个人计算机上的电子邮件客户端软件，如 Outlook、Foxmail。\n2. 邮件服务器：负责邮件的发送与接收，并向发件人反馈邮件传送状态（已投递、被拒收或丢失）；采用客户/服务器模式工作，但需具备双重角色，既能作为服务器接收邮件，又能作为客户发送邮件。\n3. 协议分两类：邮件发送协议（典型是 SMTP）用于用户代理向邮件服务器发送邮件，或在邮件服务器之间传递邮件；邮件读取协议（POP3 或 IMAP）用于用户代理从邮件服务器获取邮件。\n4. 电子邮件是异步通信方式，不要求通信双方同时在线：发送端把邮件送到收件人所用的邮件服务器并存进其邮箱，收件人可随时登录自己的邮件服务器读取邮件。\n背诵要点：三件套是用户代理、邮件服务器、协议；发送靠 SMTP，读取靠 POP3 或 IMAP。","keywords":["用户代理","邮件服务器","SMTP","POP3","IMAP","异步通信","客户/服务器"],"source":"王道2027版 印刷页 283（PDF p295）","status":"final"},{"id":"net-ch6-6.4-002","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"SMTP 的推（Push）与 POP3 的拉（Pull）两种工作方式，以及邮件服务器的双重角色","level":"l1","title":"SMTP 推、POP3 拉","answer":"【结论】SMTP 采用推（Push）的方式，POP3 采用拉（Pull）的方式。\n1. 推：发送方（用户代理或发送端邮件服务器）主动把邮件推送到目标邮件服务器，接收方被动接收。\n2. 拉：收件人读取邮件时，用户代理主动向接收端邮件服务器发起请求，把邮箱中的邮件拉取下来。\n3. 邮件服务器的双重角色：作为服务器时接收别人送来的邮件，作为客户时把本机缓存队列中的邮件发送出去；同一台机器在不同时刻扮演不同角色，故 SMTP 服务器进程与 SMTP 客户进程可能运行在同一台主机上。\n4. 判别技巧：题目问用户代理把邮件送到服务器、或服务器之间传送邮件，答 SMTP；问用户从服务器取邮件，答 POP3 或 IMAP。\n背诵要点：发送是推、读取是拉；SMTP 只管送，不管取。","keywords":["Push","Pull","双重角色","SMTP客户","SMTP服务器","邮件读取"],"source":"王道2027版 印刷页 283（PDF p295）","status":"final"},{"id":"net-ch6-6.4-003","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"电子邮件的发送与接收全过程六个步骤，以及 2012 真题三个阶段所用协议的判定","level":"l2","title":"邮件收发过程与 2012 真题","answer":"【结论】一封邮件从发件人到收件人，用户代理到服务器、服务器到服务器都走 SMTP，只有收件人取信时才用 POP3 或 IMAP。\n1. 发件人通过用户代理撰写和编辑待发送的邮件。\n2. 点击发送后，用户代理用 SMTP 把邮件传送给发送端的邮件服务器。\n3. 发送端邮件服务器把邮件暂存在邮件缓存队列中，等待发送。\n4. 发送端邮件服务器的 SMTP 客户依次把缓存队列中的邮件直接发送到接收端邮件服务器，不使用中间邮件服务器中转。\n5. 接收端邮件服务器的 SMTP 服务器进程收到邮件后，把它存入对应收件人的邮箱，等待收件人读取。\n6. 收件人启动用户代理，通过 POP3 或 IMAP 从接收端邮件服务器的邮箱中下载邮件。\n【2012 真题】用户1 到服务器1 用 SMTP，服务器1 到服务器2 用 SMTP，服务器2 到用户2 用 POP3，即三个阶段分别是 SMTP、SMTP、POP3。\n背诵要点：三个箭头里只有最后一段是拉，前两段都是 SMTP 推。","keywords":["邮件缓存队列","收发过程","2012真题","SMTP","POP3","不中转"],"source":"王道2027版 印刷页 284（PDF p296）","status":"final"},{"id":"net-ch6-6.4-004","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"电子邮件的信封与内容结构、RFC 822 规定的首部关键字，以及电子邮件地址的格式","level":"l1","title":"电子邮件格式与地址","answer":"【结论】一封电子邮件由信封和内容两大部分组成，内容又分首部和主体；首部格式由 RFC 822 规定，主体由用户自由撰写。\n1. 信封：用户无须手动填写，邮件系统会自动从首部信息中提取所需信息并生成信封。\n2. 首部：由若干首部行构成，每行由一个关键字、冒号及对应的值组成；To 是必填关键字，用于指定一个或多个收件人地址；Subject 是可选关键字，用于标明邮件主题；From 也是必填关键字，但通常由邮件系统自动填充。\n3. 分隔：首部与主体之间以一个空行分隔。\n4. 地址格式：收件人邮箱名@邮箱所在主机的域名，例如 abc@cskaoyan.com；邮箱名在该域名对应的邮件服务器上必须唯一，从而保证该地址在整个互联网范围内唯一。\n5. 典型首部：From 行、To 行、Subject 行依次排列，空行之后是主体内容。\n背诵要点：地址是用户名在前、域名在后；To 与 From 必填、Subject 可选，首部与主体隔一个空行。","keywords":["信封","首部","主体","RFC 822","To","Subject","From","邮箱名@域名"],"source":"王道2027版 印刷页 284（PDF p296）","status":"final"},{"id":"net-ch6-6.4-005","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"MIME 的作用、与 SMTP 的关系，以及 MIME 的三部分内容","level":"l1","title":"MIME 与 SMTP 的关系","answer":"【结论】MIME 并未修改或取代 SMTP，而是在其基础上扩展：发送前把非 ASCII 数据编码成 7 位 ASCII，接收后再解码还原。\n1. 提出原因：SMTP 只支持传输 7 位 ASCII 码文本邮件，无法直接传送中文、俄文等非英语字符，也无法传输可执行文件或其他二进制对象。\n2. 工作过程：发送端先用 MIME 把非 ASCII 数据编码为 ASCII 格式，再交由 SMTP 传输；接收端收到邮件后，再通过 MIME 对 ASCII 数据解码还原，恢复原始的非 ASCII 内容。\n3. 三部分内容：定义了 5 个新的首部字段（MIME 版本、内容描述、内容标识、传送编码、内容类型）；标准化了多种邮件内容的格式，为多媒体邮件提供统一规范；定义了传送编码机制，能对任意类型内容做编码转换而不被邮件系统改变。\n4. 结论性判断：MIME 继续使用 RFC 822 格式，但增加了邮件主体的结构，并定义了传送非 ASCII 码的编码规则，因此 MIME 邮件可在已有的电子邮件和协议下传送。\n背诵要点：MIME 是 SMTP 的翻译层，不替代 SMTP；编码在发端、解码在收端。","keywords":["MIME","7位ASCII","编码","解码","5个首部字段","内容类型","传送编码"],"source":"王道2027版 印刷页 285（PDF p297）","status":"final"},{"id":"net-ch6-6.4-006","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"SMTP 的协议定位、传输层依赖、端口号与五条基本特点","level":"l1","title":"SMTP 的特点与 25 端口","answer":"【结论】SMTP 是简单邮件传输协议，用于在 SMTP 客户与 SMTP 服务器之间可靠且高效地传送邮件，基于 TCP，熟知端口号 25。\n1. 工作模式：客户/服务器模式，负责发送邮件的进程作为 SMTP 客户，负责接收邮件的进程作为 SMTP 服务器。\n2. 传输层：基于 TCP 连接，提供可靠传输，因此 SMTP 不必自己处理丢失与重传。\n3. 内容限制：只能传输 7 位 ASCII 码文本，非 ASCII 内容必须先用 MIME 编码。\n4. 传送方式：采用推（Push）方式主动把邮件推给目标服务器；只用于发送，不能用于收件人从服务器读取邮件。\n5. 不中转：SMTP 不使用中间邮件服务器进行中转，TCP 连接始终在发送端与接收端的邮件服务器之间直接建立；若接收端邮件服务器故障暂时无法响应，发送端等待一段时间后重新尝试连接。\n背诵要点：SMTP 三个标签是 TCP、25 端口、只能传 7 位 ASCII；只推不收、不经中转。","keywords":["SMTP","25端口","TCP","7位ASCII","推","不中转","客户/服务器"],"source":"王道2027版 印刷页 285（PDF p297）","status":"final"},{"id":"net-ch6-6.4-007","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"SMTP 通信的三个阶段（连接建立、邮件传送、连接释放）及各阶段的命令与响应码","level":"l2","title":"SMTP 通信三阶段与命令","answer":"【结论】SMTP 一次邮件传送分连接建立、邮件传送、连接释放三个阶段，靠命令与响应码一问一答推进。\n1. 连接建立：SMTP 客户定期扫描发送端邮件服务器的邮件缓存队列，发现待发邮件就与接收端服务器的 25 端口建立 TCP 连接；服务器先回 220 Service ready（服务就绪），客户再发 HELO 命令并附上发送端主机名以标识身份。\n2. 邮件传送以 MAIL 命令开始并附发件人地址，服务器回 250 OK；随后客户端发送一个或多个 RCPT 命令附收件人地址，其作用是预先验证地址有效性，避免发完长邮件才发现地址错误，服务器回 250 OK 或 550 No such user here。\n3. 收到所有 RCPT 的肯定响应后，客户端发 DATA 命令表示即将传送邮件内容，服务器正常回复 354 Start mail input；此后客户逐行发送内容，以回车换行、点、回车换行作为邮件内容的结束标志。\n4. 连接释放：邮件发送完成后，SMTP 客户发送 QUIT 命令，服务器返回 221（服务关闭），表示同意释放 TCP 连接。\n背诵要点：220 就绪、250 成功、354 开始送正文、221 关闭；MAIL 报发件人、RCPT 报收件人、DATA 报正文。","keywords":["220","HELO","MAIL FROM","RCPT TO","DATA","354","QUIT","221"],"source":"王道2027版 印刷页 285-286（PDF p297-298）","status":"final"},{"id":"net-ch6-6.4-008","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"POP3 与 IMAP 的端口、工作模式与功能差异","level":"l1","title":"POP3 与 IMAP 的区别","answer":"【结论】POP3 结构简单、功能有限，使用端口 110；IMAP 功能更强，使用端口 143，能在服务器端维护会话状态。\n1. POP3：邮局协议第 3 版，采用客户/服务器模式，基于 TCP，使用端口 110；用户代理运行 POP3 客户程序，邮件服务器运行 POP3 服务器程序。\n2. POP3 的两种工作模式：下载并保留，用户从服务器读取邮件后邮件仍保留在服务器上，可供后续再次访问；下载并删除，邮件一旦被成功读取即从服务器上删除。\n3. IMAP：互联网报文存取协议，支持用户在服务器端创建文件夹、在不同文件夹之间移动邮件、对远程邮箱中的邮件进行搜索等在线操作，为此 IMAP 服务器需要维护用户的会话状态信息。\n4. IMAP 的选择性获取：用户代理可以只下载邮件的特定部分，例如只获取首部，或只提取多部分 MIME 邮件中的某一部分；低带宽环境下无须下载含大附件的整封邮件即可快速浏览或筛选。\n5. 记忆锚点：POP3 是 110、把邮件搬回本地；IMAP 是 143、邮件留在服务器上操作。\n背诵要点：POP3 简单、110、下载并删除或保留；IMAP 强大、143、在线操作、可只取部分内容。","keywords":["POP3","IMAP","110","143","下载并保留","下载并删除","选择性获取","会话状态"],"source":"王道2027版 印刷页 286（PDF p298）","status":"final"},{"id":"net-ch6-6.4-009","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"基于万维网的电子邮件中 HTTP 与 SMTP 的分工","level":"l3","title":"基于万维网的电子邮件","answer":"【结论】基于万维网的电子邮件（如 Hotmail、Gmail）中，用户浏览器与邮件服务器之间的收发都用 HTTP，只有不同邮件服务器之间传递邮件才用 SMTP。\n1. 交互方式：用户打开浏览器登录邮箱网页，撰写、发送、读取邮件全部通过 HTTP 完成，本机不需要安装邮件客户端。\n2. 协议分工：浏览器到邮件服务器用 HTTP；邮件服务器到邮件服务器用 SMTP。\n3. 与传统方式的对比：传统方式下用户代理到发送端服务器用 SMTP、服务器之间用 SMTP、接收端服务器到用户代理用 POP3 或 IMAP。\n4. 常见考法：用浏览器在 Gmail 中向邮件服务器发送邮件，使用的是 HTTP 而不是 SMTP；通过浏览器登录 163 邮箱、Gmail 邮箱读信，使用的读取协议也是 HTTP。\n5. 本质变化：网页邮箱把传统意义上的用户代理换成了浏览器加网页，邮件仍然存放在服务器上，因此读取环节由 HTTP 承担。\n背诵要点：浏览器这一段一律 HTTP，服务器之间才是 SMTP；网页邮箱把用户代理变成了浏览器。","keywords":["基于万维网的电子邮件","HTTP","SMTP","浏览器","Gmail","协议分工"],"source":"王道2027版 印刷页 286（PDF p298）","status":"final"},{"id":"net-ch6-6.4-010","chapter":"第6章 应用层","subject":"net","section":"6.4 电子邮件","topic":"邮件协议常见易错判断：SMTP 不能收信、只能发不能收的故障定位、邮件头来源与 MIME 定位","level":"l3","title":"邮件协议高频易错点","answer":"【结论】SMTP 是推协议，只能发送不能读取；能把邮件取回本机的只有 POP3、IMAP 和 HTTP。\n1. 不能用于接收邮件的协议：SMTP；常用的邮件读取协议是 POP3、IMAP 和 HTTP。\n2. 故障定位：用户代理只能发送而不能接收邮件，多半是 POP3 服务器地址（如 pop3.gmail.com）设置错误；SMTP 地址错误会导致无法发送；收件人地址错误则可能发错人或投递失败。\n3. 邮件头来源：发信人地址 From、发送时间由系统自动生成；收信人地址 To、邮件主题 Subject 由发件人输入。\n4. MIME 的定位：MIME 允许电子邮件系统传输文字、图像、语音与视频等多种信息，但它是编码扩展，不是新的传输协议。\n5. 发送失败或丢失的原因：对方邮件服务器不工作，邮件发不出去；对方邮件服务器出故障会使邮件丢失；网络非常拥塞时路由器大量丢弃 IP 数据报导致通信中断。\n背诵要点：SMTP 只会送不会取；收不到信查 POP3 地址，发不出信查 SMTP 地址。","keywords":["SMTP不能收信","POP3地址","邮件头","MIME","邮件丢失","易错点"],"source":"王道2027版 印刷页 288（PDF p300）","status":"final"},{"id":"net-ch6-6.5-001","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"万维网的定义、三个核心标准（URL、HTTP、HTML）与客户/服务器工作模式","level":"l2","title":"万维网的概念与三个标准","answer":"【结论】万维网（WWW）是一个分布式、联机式的信息存储空间，其中任何有用的事物都称为资源，由统一资源定位符（URL）唯一标识，并通过 HTTP 传送给用户。\n1. URL：用于标识万维网上的各类文档，确保每个文档在整个万维网范围内拥有唯一的 URL 标识符；它是对资源位置及访问方式的简洁表示。\n2. HTTP：一种应用层协议，基于 TCP 连接提供可靠的数据传输，是万维网客户程序与服务器程序之间交互时必须严格遵循的通信协议。\n3. HTML：一种用于描述文档结构的标记语言，通过预定义标记对页面中的文字、声音、图像、视频等信息及其格式进行组织和呈现。\n4. 工作模式：采用客户/服务器模式，用户主机上运行的浏览器是万维网客户程序，存放万维网文档的主机运行服务器程序，称为万维网服务器。\n5. 与互联网的关系：万维网由无数网络站点和网页组成，是互联网最主要的应用部分，但互联网还包括电子邮件、Usenet 和新闻组等。\n背诵要点：万维网三件套是 URL 定位、HTTP 传输、HTML 描述；它是互联网上的一种应用，不等于互联网。","keywords":["万维网","URL","HTTP","HTML","客户/服务器","超链接","超文本"],"source":"王道2027版 印刷页 289-290（PDF p301-302）","status":"final"},{"id":"net-ch6-6.5-002","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"URL 的一般形式与各部分含义，以及端口、路径可省略的规则","level":"l2","title":"URL 的结构","answer":"【结论】URL 的一般形式为：协议://主机:端口/路径。\n1. 协议：指明获取资源所用的协议，常见的有 http、https、ftp 等。\n2. 主机：存放资源的主机在互联网中的域名或 IP 地址。\n3. 端口与路径：在某些情况下可以省略，HTTP 默认端口为 80，路径默认为根目录。\n4. 大小写：URL 中的字符通常不区分大小写。\n5. 地位：URL 是对互联网上可获取资源的位置及访问方式的一种简洁表示，可视为传统文件名在网络范围内的扩展。\n6. 相关端口：HTTP 默认使用 TCP 的 80 端口，HTTPS 默认使用 TCP 的 443 端口；万维网服务器进程持续监听 TCP 端口 80。\n背诵要点：URL 是协议加主机加端口加路径，80 与路径可省；它是资源的唯一标识，不是 IP 地址。","keywords":["URL","协议","主机","端口","路径","80","443"],"source":"王道2027版 印刷页 290（PDF p302）","status":"final"},{"id":"net-ch6-6.5-003","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"浏览器访问万维网服务器的完整操作过程，以及单击超链接后的事件顺序","level":"l1","title":"HTTP 的操作过程","answer":"【结论】访问一个 Web 页面的顺序是：域名解析、建立 TCP 连接、发送 HTTP 请求、接收 HTTP 响应、释放 TCP 连接、浏览器解析并显示。\n1. 浏览器要访问某个 WWW 服务器时，首先需完成对该服务器域名的解析，一旦获得 IP 地址，便通过 TCP 向该服务器发起连接建立请求。\n2. 每个万维网站点都运行一个服务器进程，持续监听 TCP 端口 80（默认）；监听到连接请求时，服务器便与浏览器建立 TCP 连接。\n3. 浏览器向服务器发送 HTTP 请求以获取指定的 Web 页面；服务器收到请求后，组装所请求页面所需的资源，并通过 HTTP 响应返回给浏览器。\n4. 浏览器对收到的内容进行解析并把页面呈现给用户，最后释放 TCP 连接。\n5. 以访问清华大学网站为例的八步：输入 URL，向 DNS 服务器请求解析域名，DNS 返回 IP 地址，与服务器建立 TCP 连接（默认端口 80），发出 GET 请求，服务器返回 index.htm，释放 TCP 连接，浏览器解析并显示。\n背诵要点：先域名后 IP、先 TCP 后 HTTP；HTTP 请求报文一定跑在已建立的 TCP 连接上。","keywords":["域名解析","TCP连接","HTTP请求","HTTP响应","80端口","操作过程"],"source":"王道2027版 印刷页 290-291（PDF p302-303）","status":"final"},{"id":"net-ch6-6.5-004","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP 的四个基本特点：基于 TCP、本身无连接、无状态、面向事务","level":"l1","title":"HTTP 的四个特点","answer":"【结论】HTTP 使用 TCP 作为传输层协议以保证可靠传输，但 HTTP 本身是无连接的、无状态的。\n1. 基于 TCP：HTTP 依赖 TCP 提供可靠的数据传输，因此无须关心数据在传输过程中是否丢失或如何重传。\n2. 无连接：尽管底层使用了 TCP 连接，但在交换 HTTP 报文之前并不需要建立专门的 HTTP 连接。\n3. 无状态：服务器不记录此前与该客户的交互历史，同一客户第二次访问服务器上的某个页面时，服务器的响应与第一次完全相同。\n4. 面向事务：HTTP 是一种面向事务的应用层协议，规定了浏览器与服务器之间请求与响应的格式和交互规则。\n5. 无状态的好处与代价：简化了服务器设计，使其更易于支持大量并发请求；代价是无法识别用户，实际中通常结合 Cookie 与数据库来实现用户行为跟踪。\n背诵要点：HTTP 是用 TCP 但不建 HTTP 连接、且不记事的协议；无状态是设计选择，不是缺陷。","keywords":["无连接","无状态","基于TCP","面向事务","并发","Cookie"],"source":"王道2027版 印刷页 290-291（PDF p302-303）","status":"final"},{"id":"net-ch6-6.5-005","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"Cookie 的工作原理：服务器生成识别码、Set-cookie 首部行、浏览器本地保存与回送","level":"l2","title":"Cookie 的工作原理","answer":"【结论】Cookie 是服务器产生、保存在用户主机上的文本文件，用来在无状态的 HTTP 之上识别用户。\n1. 首次访问：用户首次访问某个启用 Cookie 的网站时，服务器为其生成唯一的 Cookie 识别码（如 12345），并以此为索引在后端数据库中创建记录，用于存储该用户的访问信息。\n2. 下发：服务器在 HTTP 响应报文中添加一个首部行 Set-cookie，其值为该识别码。\n3. 保存：浏览器收到响应后，把 Cookie 识别码连同服务器域名一起保存在本地的 Cookie 文件中。\n4. 回送：用户再次访问该网站时，浏览器在 HTTP 请求报文中自动附加一个 Cookie 首部行。\n5. 使用：服务器根据识别码从数据库中检索该用户的活动记录，从而提供个性化服务，例如按历史浏览记录推荐商品。\n6. 易错点：Cookie 存储在用户主机而非服务器端，但由服务器产生，作用是跟踪用户访问与状态，可能威胁用户隐私。\n背诵要点：Set-cookie 是服务器发的，Cookie 是浏览器回送的；识别码在客户端，记录在服务器数据库。","keywords":["Cookie","Set-cookie","识别码","无状态","隐私","个性化服务"],"source":"王道2027版 印刷页 291（PDF p303）","status":"final"},{"id":"net-ch6-6.5-006","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP/1.0 非持续连接下请求一个文档的时间公式（2RTT 加传输时间）与并行连接","level":"l1","title":"非持续连接的 2RTT","answer":"【结论】非持续连接模式下，请求一个 Web 文档所需时间等于文档传输时间（与文档大小成正比）加 2 个 RTT。\n1. 两个 RTT 的用途：一个 RTT 用于完成建立 TCP 连接的前两次握手，另一个 RTT 用于发送请求并接收响应。\n2. 捎带优化：客户端通常在 TCP 第三次握手的 ACK 报文中捎带 HTTP 请求；若未捎带，则紧随其后立即发送，其间的时间间隔可以忽略不计。\n3. 连接开销：HTTP/1.0 只支持非持续连接，每个网页元素（如 JPEG 图像、Flash 动画）的传输都需要单独建立一个 TCP 连接，每个对象的获取都要承担 2 个 RTT 的开销。\n4. 缓解手段：为减小时延，现代浏览器通常创建多个并行 TCP 连接，以同时请求多个对象。\n5. 数量换算：一个含 1 个基本 HTML 对象和 3 个 gif 对象的页面，在 HTTP/1.0 下共需建立 4 次 TCP 连接；含 100 个图片对象的页面共 101 个对象，需打开和关闭 TCP 连接 101 次。\n背诵要点：非持续连接是一对象一连接，每个对象 2 个 RTT；支持并行时图像可同时取，RTT 数按轮算。","keywords":["非持续连接","2RTT","HTTP/1.0","并行TCP连接","每次一个对象"],"source":"王道2027版 印刷页 291-292（PDF p303-304）","status":"final"},{"id":"net-ch6-6.5-007","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP/1.1 持续连接的两种工作方式（非流水线与流水线）及其 RTT 差异","level":"l2","title":"持续连接：非流水线与流水线","answer":"【结论】HTTP/1.1 默认启用持续连接，服务器发送响应后仍保持该 TCP 连接，同一客户可继续在该连接上发送后续请求并接收响应。\n1. 持续连接的含义：浏览器先通过该连接请求并接收 Web 页面（通常是 HTML 文档），解析后发现其中引用的图像等资源，即可复用该连接请求这些资源，从而避免为每个资源重新建立连接的开销。\n2. 非流水线方式：客户端必须等待前一个响应到达后才能发送下一个请求，服务器发送完一个对象后 TCP 连接处于空闲状态，造成资源浪费，每个对象仍各需 1 个 RTT。\n3. 流水线方式：客户可连续发送多个对象的请求，服务器也能连续发送响应；若所有请求与响应均能连续传输，则获取全部引用对象仅需 1 个 RTT。\n4. 实际限制：由于 HTTP 基于 TCP，实际传输时间还受 TCP 发送窗口和拥塞控制机制影响；当传输的数据量超过 MSS 时，完整传输可能需要多个 RTT。\n背诵要点：持续连接省的是建连接那 1 个 RTT；流水线再省掉等响应的空闲，把多个对象压进 1 个 RTT。","keywords":["持续连接","流水线","非流水线","1RTT","HTTP/1.1","空闲"],"source":"王道2027版 印刷页 292（PDF p304）","status":"final"},{"id":"net-ch6-6.5-008","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP 请求报文与响应报文的三段式结构、开始行与首部行的格式","level":"l1","title":"HTTP 报文结构","answer":"【结论】HTTP 报文分为请求报文和响应报文两类，都由开始行、首部行、实体主体三部分组成，区别仅在开始行。\n1. 面向文本：HTTP 是面向文本的，报文中的每个字段都是 ASCII 字符串，且字段长度不固定。\n2. 开始行：请求报文的开始行称为请求行，含方法、请求资源的 URL、HTTP 版本三个字段；响应报文的开始行称为状态行，含 HTTP 版本、状态码、解释状态码的短语三个字段；三个字段之间以空格分隔，行末以回车换行符 CRLF 结束。\n3. 首部行：用于传递关于浏览器、服务器或报文主体的附加信息，可包含多行也可为空；每行由字段名、冒号及值构成，行末同样以 CRLF 结束。\n4. 分隔：所有首部行结束后，还需用一个空行（仅含 CRLF）分隔首部行与后面的实体主体。\n5. 实体主体：请求报文中通常没有这个字段，响应报文中也可能没有这个字段。\n背诵要点：请求行是方法、URL、版本，状态行是版本、状态码、短语；三段之间靠空行隔开。","keywords":["请求报文","响应报文","开始行","请求行","状态行","首部行","CRLF"],"source":"王道2027版 印刷页 292-293（PDF p304-305）","status":"final"},{"id":"net-ch6-6.5-009","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP 六种请求方法 GET、HEAD、POST、PUT、DELETE、CONNECT 的含义与用途","level":"l2","title":"HTTP 的六种请求方法","answer":"【结论】请求行中的方法指明对目标资源的操作类型，本质上是一条命令。\n1. GET：请求读取由 URL 标识的信息，是最常用的方法。\n2. HEAD：请求读取由 URL 标识的信息的首部；服务器只对报文进行响应，不返回请求对象，作用主要是调试。\n3. POST：给服务器添加信息，如提交注释。\n4. PUT：在指定 URL 处存储一个文档。\n5. DELETE：删除由 URL 标识的资源。\n6. CONNECT：用于代理服务器。\n7. 典型请求报文：请求行为 GET /bbs/index.htm HTTP/1.1，随后 Host 首部行指明服务器域名，Connection 为 Keep-Alive 表示要求保持连接（若要非持续连接则设为 close），User-Agent 表明用户代理是哪种浏览器，Accept-Language 表示优先要中文文档，最后还有一个空行。\n背诵要点：只要响应不要对象就选 HEAD；要改服务器内容选 POST 或 PUT，删除选 DELETE，代理用 CONNECT。","keywords":["GET","HEAD","POST","PUT","DELETE","CONNECT","请求方法"],"source":"王道2027版 印刷页 293（PDF p305）","status":"final"},{"id":"net-ch6-6.5-010","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"响应报文状态行的组成与常见状态码 200、301、304、400、403、404、500 的含义","level":"l1","title":"HTTP 状态码","answer":"【结论】状态行由 HTTP 版本、状态码和解释状态码的短语三部分组成，状态码是三位数字，第一位表明响应类别。\n1. 类别：1xx 表示通知信息，2xx 表示成功，3xx 表示重定向，4xx 表示客户的差错，5xx 表示服务器的差错。\n2. 200 OK：请求成功，服务器已正常返回所请求的资源。\n3. 301 Moved Permanently：请求的资源已永久移动，客户端应改用响应中给出的新 URL。\n4. 304 Not Modified：资源自上次请求后未被修改，客户端可直接使用本地缓存，响应中不返回实体主体。\n5. 400 Bad Request：错误的请求，服务器无法理解请求的语法。\n6. 403 Forbidden：服务器理解请求但拒绝执行，通常是客户没有访问权限。\n7. 404 Not Found：找不到页面，请求的资源不存在。\n8. 500 Internal Server Error：服务器内部错误，无法完成请求。\n背诵要点：2 成功、3 转向、4 客户错、5 服务器错；304 是没变用缓存，403 是不给看，404 是没有。","keywords":["状态码","200","301","304","403","404","500"],"source":"王道2027版 印刷页 293（PDF p305）","status":"final"},{"id":"net-ch6-6.5-011","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"代理服务器（万维网高速缓存）的缓存机制、部署位置与作用","level":"l2","title":"代理服务器（Web 缓存）","answer":"【结论】代理服务器把近期的一些请求与响应暂存在本地磁盘上，也称万维网高速缓存，命中时直接返回缓存而无须访问原始服务器。\n1. 工作机制：新请求到达时，若代理服务器发现该请求与暂存的请求相同，便直接返回缓存的响应，而无须再次通过互联网访问原始服务器。\n2. 部署位置：代理服务器可部署在客户端、服务器端或网络中间节点上。\n3. 主要作用：在内网中设置代理服务器后，就能将相当大一部分通信流量限制在内网内部，从而显著减少内网通往互联网的链路负载，降低访问互联网的延迟。\n4. 注意区分：代理服务器缓存的是请求与响应，与 Cookie 无关；它不改变 HTTP 的无状态特性，只是替客户端或服务器代收代答。\n背诵要点：代理服务器就是带磁盘的中间人；命中即回、未命中才回源，省带宽降时延。","keywords":["代理服务器","Web缓存","本地磁盘","内网流量","降低延迟"],"source":"王道2027版 印刷页 293-294（PDF p305-306）","status":"final"},{"id":"net-ch6-6.5-012","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"HTTP/2.0 相对 HTTP/1.1 的改进：二进制分帧、多路复用、头部压缩、服务器推送","level":"l3","title":"HTTP/2.0 的改进","answer":"【结论】HTTP/2.0 在 HTTP/1.1 持续连接的基础上，用二进制分帧、多路复用、头部压缩和服务器推送提升传输效率。\n1. 二进制分帧：把报文拆成二进制的帧传输，取代 HTTP/1.x 的纯文本报文，解析更高效、报文边界更清晰。\n2. 多路复用：同一 TCP 连接上可并行交错传输多个请求与响应，不再像 HTTP/1.1 流水线那样要求响应按请求顺序返回，从根本上消除队头阻塞。\n3. 头部压缩：对重复出现的首部字段做压缩，减少每个请求携带的冗余首部开销，对首部多、请求碎的场景收益明显。\n4. 服务器推送：服务器可主动把客户端即将需要的资源推送给客户端，减少一次额外的请求往返。\n5. 与 1.0 和 1.1 的关系：1.0 只支持非持续连接，1.1 默认持续连接并引入流水线，2.0 在一条连接上实现真正的并行；2.0 仍然基于 TCP，未加密时默认 80 端口，加密时使用 443 端口。\n背诵要点：2.0 的四个关键词是二进制分帧、多路复用、头部压缩、服务器推送；它解决的是 1.1 流水线的队头阻塞与首部冗余。","keywords":["HTTP/2.0","二进制分帧","多路复用","头部压缩","服务器推送","队头阻塞"],"source":"王道2027版 印刷页 292（PDF p304）","status":"final"},{"id":"net-ch6-6.5-013","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"常见应用层协议的传输层协议与熟知端口号小结，以及 HTTP 80 与 HTTPS 443","level":"l2","title":"应用层协议与熟知端口","answer":"【结论】记端口先记传输层：FTP、TELNET、SMTP、HTTP、POP3 走 TCP，DNS、TFTP、SNMP 走 UDP。\n1. FTP 数据连接用 TCP 的 20 端口，控制连接用 TCP 的 21 端口。\n2. TELNET 用 TCP 的 23 端口。\n3. SMTP 用 TCP 的 25 端口。\n4. DNS 用 UDP 的 53 端口；TFTP 用 UDP 的 69 端口。\n5. HTTP 用 TCP 的 80 端口；HTTPS 用 TCP 的 443 端口，是 HTTP 之下加入加密层的版本。\n6. POP3 用 TCP 的 110 端口；IMAP 用 TCP 的 143 端口；SNMP 用 UDP 的 161 端口。\n7. 判别技巧：凡是需要可靠传输的邮件、文件、网页类应用都基于 TCP；一次请求一次响应的域名查询、简单文件传输、网络管理则用 UDP。\n背诵要点：20 与 21 是 FTP 的数据与控制，23 远程登录、25 发信、53 域名、69 简单文件、80 网页、110 收信、143 IMAP、161 网管。","keywords":["熟知端口","FTP 20/21","TELNET 23","SMTP 25","DNS 53","TFTP 69","HTTP 80","POP3 110"],"source":"王道2027版 印刷页 294（PDF p306）","status":"final"},{"id":"net-ch6-6.5-014","chapter":"第6章 应用层","subject":"net","section":"6.5 万维网","topic":"页面加载时延真题计算：非持续连接的 RTT 数、流水线方式的 RTT 数、含拥塞控制的 4RTT","level":"l3","title":"页面加载时延真题","answer":"【结论】算 RTT 数先判断三件事：连接是否复用、是否支持流水线、是否考虑拥塞控制。\n1. 支持并行 TCP 连接的非持续 HTTP/1.0（1 个页面加 7 个小图像）：1 个 RTT 建立第一个 TCP 连接，1 个 RTT 请求并接收 Web 页，收到页面后同时建立 7 个并行连接再用 1 个 RTT，最后 1 个 RTT 请求并接收 7 个图像，共 4 个 RTT。\n2. 不支持并行 TCP 连接的非持续 HTTP/1.0（1 个页面加 7 个小图像）：第一个对象要 2 个 RTT，之后每个图像各 2 个 RTT，共 2 乘 8 等于 16 个 RTT。\n3. 持续的非流水线方式（2011 真题，从发出 Web 请求开始算，页面引用 5 幅小图像）：第 1 个 RTT 请求并收到页面，此后每访问一个对象用 1 个 RTT，共 1 加 5 等于 6 个 RTT。\n4. 流水线的 HTTP/1.1（页面引用 7 个小图像，本地 DNS 递归加迭代查询最多 4 个 RTT）：域名解析最多 4 个 RTT，建立连接 1 个、请求页面 1 个、流水线请求 7 个图像 1 个，共 7 个 RTT。\n5. 2022 真题（页面 1MSS、图像 3MSS、RTT 为 10ms）：第 1 个 RTT 完成前两次握手，第 2 个 RTT 第三次握手捎带请求且窗口为 1MSS 发页面，第 3 个 RTT 确认并捎带图像请求、窗口增到 2MSS，第 4 个 RTT 窗口增到 4MSS 发完剩余 1MSS，共 4 个 RTT 即 40ms。\n背诵要点：先数对象、再看能否并行、再看是否流水线、最后看拥塞窗口；非持续是一对象 2 个 RTT，流水线是全压进 1 个 RTT。","keywords":["RTT计算","非持续连接","流水线","并行连接","2022真题","慢开始"],"source":"王道2027版 印刷页 299-301（PDF p311-313）","status":"final"},{"id":"net-ch6-6.6-001","chapter":"第6章 应用层","subject":"net","section":"6.6 本章小结及疑难点","topic":"客户进程端口号与服务器进程端口号的区别，以及一对端口号如何唯一标识一条连接","level":"l2","title":"客户与服务器的端口号","answer":"【结论】服务器进程使用熟知端口号，客户进程使用临时端口号，二者配对唯一标识一条端到端连接。\n1. 服务器端：使用熟知端口号，这些端口号固定且公开，便于客户找到对应的服务。\n2. 客户端：使用临时端口号，由操作系统在连接发起时自动分配，仅在本次通信中有效。\n3. 连接建立：客户向服务器发起连接时会连接到服务器的熟知端口，并将自己的临时端口号告知服务器。\n4. 唯一标识：服务器随后通过这一对端口号（自身的熟知端口加客户的临时端口）建立唯一的端到端连接。\n5. 推论：同一台服务器可同时服务多个客户，因为各客户的临时端口号不同；这正是传输层用端口号实现复用与分用的原因。\n背诵要点：服务器端口是招牌、客户端口是临时号；四元组（源 IP、源端口、目的 IP、目的端口）才唯一确定一条连接。","keywords":["熟知端口","临时端口","端到端连接","端口对","复用"],"source":"王道2027版 印刷页 303（PDF p315）","status":"final"},{"id":"net-ch6-6.6-002","chapter":"第6章 应用层","subject":"net","section":"6.6 本章小结及疑难点","topic":"互联网与万维网的区别与联系","level":"l3","title":"互联网与万维网的区别","answer":"【结论】互联网是路，万维网是路上跑的一种车。\n1. 互联网：全球性的计算机网络互联系统，起源于 ARPAnet，采用 TCP/IP 协议族作为通信基础，提供主机之间的连通性。\n2. 万维网：构建在互联网之上的一套应用层生态，由相互链接的网页和网站组成，通过 HTTP 协议和浏览器访问。\n3. 范围关系：互联网是基础设施，万维网只是其上的应用之一；互联网还包括电子邮件、文件传输、DNS 等其他应用。\n4. 常见错误：把上网等同于上万维网，或认为万维网就是互联网；实际上没有万维网，互联网依然存在。\n背诵要点：互联网管连通（TCP/IP），万维网管内容（HTTP 加 HTML 加 URL）；万维网是互联网上的一个应用。","keywords":["互联网","万维网","TCP/IP","HTTP","应用层生态","ARPAnet"],"source":"王道2027版 印刷页 303（PDF p315）","status":"final"},{"id":"net-ch6-6.6-003","chapter":"第6章 应用层","subject":"net","section":"6.6 本章小结及疑难点","topic":"HTTP/1.1 使用持续连接，下载网页及图片仍可能需要多个 RTT 的原因（慢开始与拥塞窗口）","level":"l3","title":"持续连接为何仍要多个 RTT","answer":"【结论】因为 TCP 连接初始的拥塞窗口通常仅为 1MSS，即使 HTTP/1.1 支持在同一连接上连续发送请求，服务器也不能一次性发送全部数据。\n1. 以网页文件 1MSS、图片 3MSS 为例：第 1 个 RTT 完成 TCP 建立连接的前两次握手。\n2. 第 2 个 RTT：第三次握手捎带 HTML 请求，服务器在拥塞窗口为 1MSS 下发送 1MSS 的网页文件。\n3. 第 3 个 RTT：客户端确认网页并捎带图片请求，拥塞窗口增至 2MSS，服务器发送 2MSS 图片。\n4. 第 4 个 RTT：客户端确认已收到的图片数据，拥塞窗口增至 4MSS，服务器发送剩余 1MSS 图片。\n5. 结论：总耗时由数据大小和拥塞窗口增长节奏共同决定，即使带宽充足，至少也需要 4 个 RTT；若忽略传输层拥塞控制、仅从应用层交互估算时间，极易得出错误结论。\n背诵要点：持续连接只省建连接，省不了窗口长不快；算最短时间必须把慢开始的 1、2、4 倍节奏算进去。","keywords":["持续连接","拥塞窗口","慢开始","1MSS","4RTT","2022真题"],"source":"王道2027版 印刷页 303（PDF p315）","status":"final"},{"id":"net-ch6-6.6-004","chapter":"第6章 应用层","subject":"net","section":"6.6 本章小结及疑难点","topic":"以太网主机刚开机后访问 Web 站点要经历的完整通信过程（DHCP、DNS、ARP、HTTP）","level":"l2","title":"主机刚开机访问 Web 的全过程","answer":"【结论】刚开机的主机要依次完成 DHCP 获取配置、DNS 解析域名、ARP 获取 MAC 地址、HTTP 获取网页四件事。\n1. DHCP 获取网络配置：主机启动后先通过 DHCP 自动获取 IP 地址、子网掩码、默认网关、DNS 服务器地址等参数；DHCP 属于应用层协议，报文封装在 UDP 数据报中，再封装在 IP 数据报中，最终由数据链路层封装为以太网 MAC 帧传输。\n2. DNS 解析域名：浏览器从 URL 中提取域名，向本地 DNS 服务器发起解析请求；DNS 属于应用层协议，传输层使用 UDP。若 DNS 服务器与本机在同一子网，先用 ARP 解析其 MAC 地址后发单播帧；若在其他子网，先用 ARP 获取默认网关的 MAC 地址，由网关转发。\n3. 链路层细节：传统共享式以太网需遵循 CSMA/CD 机制以避免冲突，现代交换式以太网普遍采用全双工模式，不再使用 CSMA/CD。\n4. HTTP 获取网页：获得目标 IP 后，浏览器向该 Web 服务器的 80 端口发起 TCP 连接请求，连接建立后立即发送 GET /index.html；服务器返回包含页面内容的 HTTP 响应，浏览器解析 HTML，若其中引用图片、视频等资源，则对每个资源分别发起新的 HTTP 请求（按版本不同可能复用或新建连接）。\n5. 收尾：所有资源传输完成后，TCP 通过四次挥手释放连接，浏览器完成网页展示。\n背诵要点：开机四步是 DHCP 拿地址、DNS 拿 IP、ARP 拿 MAC、HTTP 拿网页；前三步分别落在应用层、应用层、网络层与链路层。","keywords":["DHCP","DNS","ARP","HTTP","四次挥手","CSMA/CD","开机访问"],"source":"王道2027版 印刷页 303（PDF p315）","status":"final"}]},"chapters":{"chapters":[{"chapter":"第1章 计算机网络体系结构","sections":[{"section":"1.1 计算机网络概述","topics":[{"id":"net-ch1-1.1-001","title":"计算机网络的定义与 internet 辨析"},{"id":"net-ch1-1.1-002","title":"计算机网络组成的三个视角"},{"id":"net-ch1-1.1-003","title":"计算机网络的五大功能"},{"id":"net-ch1-1.1-004","title":"电路交换的过程与优缺点"},{"id":"net-ch1-1.1-005","title":"报文交换的原理与优缺点"},{"id":"net-ch1-1.1-006","title":"分组交换的原理与优缺点"},{"id":"net-ch1-1.1-007","title":"三种交换方式特性对比"},{"id":"net-ch1-1.1-008","title":"分组交换总时间公式（流水线）"},{"id":"net-ch1-1.1-009","title":"三种交换方式的时间比较"},{"id":"net-ch1-1.1-010","title":"按分布范围分类：WAN/MAN/LAN/PAN"},{"id":"net-ch1-1.1-011","title":"四种网络拓扑结构"},{"id":"net-ch1-1.1-012","title":"速率与 k/M/G 的两种口径"},{"id":"net-ch1-1.1-013","title":"带宽、吞吐量与瓶颈链路"},{"id":"net-ch1-1.1-014","title":"时延的四个组成部分"},{"id":"net-ch1-1.1-015","title":"发送时延 vs 传播时延（含例题）"},{"id":"net-ch1-1.1-016","title":"时延带宽积"},{"id":"net-ch1-1.1-017","title":"往返时延 RTT"},{"id":"net-ch1-1.1-018","title":"信道利用率"}]},{"section":"1.2 计算机网络体系结构与参考模型","topics":[{"id":"net-ch1-1.2-001","title":"网络体系结构与分层原则"},{"id":"net-ch1-1.2-002","title":"实体与对等实体"},{"id":"net-ch1-1.2-003","title":"PDU、SDU、PCI 的关系"},{"id":"net-ch1-1.2-004","title":"协议三要素：语法、语义、同步"},{"id":"net-ch1-1.2-005","title":"接口与服务访问点 SAP"},{"id":"net-ch1-1.2-006","title":"协议水平、服务垂直"},{"id":"net-ch1-1.2-007","title":"服务的三种分类"},{"id":"net-ch1-1.2-008","title":"OSI 七层结构与各层功能"},{"id":"net-ch1-1.2-009","title":"物理层的功能"},{"id":"net-ch1-1.2-010","title":"数据链路层的功能"},{"id \u003cstrong\u003e四个互斥准则背下来就能拿选择题\u003c/strong\u003e：空闲让进、忙则等待、有限等待、让权等待。软件方法（Peterson 等）与硬件方法（TestAndSet/Swap/中断屏蔽）\u003cstrong\u003e都不满足让权等待\u003c/strong\u003e；中断屏蔽\u003cstrong\u003e连有限等待也可能不满足\u003c/strong\u003e。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 基本概念（2.3.1 · 印刷页 99 / PDF p111）","html":"\u003ch4 class=\"cardsec__sub\"\u003e1.1 核心定义\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e临界资源\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e一次仅允许一个进程使用的资源（如打印机、共享变量、栈）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e「排他」\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e临界区\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e进程中\u003cstrong\u003e访问临界资源的那段代码\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e「那段代码」，不是资源本身\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e同步\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e多个进程因\u003cstrong\u003e相互合作\u003c/strong\u003e而产生的\u003cstrong\u003e直接制约\u003c/strong\u003e关系，要求按一定先后次序执行\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e「有序」\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e互斥\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e多个进程因\u003cstrong\u003e争用临界资源\u003c/strong\u003e而产生的\u003cstrong\u003e间接制约\u003c/strong\u003e关系，要求同一时刻只有一个进临界区\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e「排他」\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e辨析\u003c/strong\u003e：互斥是同步的一种特殊情况（资源数为 1）。同步强调「合作方的推进次序」，互斥强调「资源独占」。试题中出现「先 A 后 B」一律是同步；出现「不能同时」一律是互斥。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.2 实现临界区互斥的四条准则（\u003cstrong\u003e必背\u003c/strong\u003e）\u003c/h4\u003e\u003cblockquote\u003e📖 \u003cstrong\u003e原文出处（已实测核对）\u003c/strong\u003e：王道2027版 \u003cstrong\u003e印刷页 100（PDF p112）\u003c/strong\u003e，小节标题「\u003cstrong\u003e临界区同步与互斥的设计准则（2020）\u003c/strong\u003e」。\u003cbr\u003e原文措辞已逐一核对，\u003cstrong\u003e第 4 条自带限定语「原则上应该遵循，但非必须」\u003c/strong\u003e——这直接决定了 2020 年第 32 题的答案。\u003c/blockquote\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e空闲让进\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e临界区空闲时，应允许一个请求进入的进程\u003cstrong\u003e立即\u003c/strong\u003e进入\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e资源浪费、效率低\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e忙则等待\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e已有进程在临界区时，其他试图进入的进程\u003cstrong\u003e必须等待\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e数据不一致\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e有限等待\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e对任何请求进程，应保证其在\u003cstrong\u003e有限时间\u003c/strong\u003e内能进入临界区，避免无限期等待\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e饥饿\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e让权等待\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e进程无法进入时应\u003cstrong\u003e主动放弃 CPU\u003c/strong\u003e，转阻塞态，而非原地循环测试（避免忙等待）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eCPU 空转\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e⚠️ \u003cstrong\u003e2020 年第 32 题的关键就在这里\u003c/strong\u003e：教材原文明确写「\u003cstrong\u003e让权等待（原则上应该遵循，但非必须）\u003c/strong\u003e」。所以凡是把「立即放弃 CPU」判为「必须遵循」的选项，一律错。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.3 真题对照：2020 年 408 第 32 题\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干要点\u003c/strong\u003e（据 PDF 原文核对）：下列准则中实现临界区互斥机制必须遵循的是（ ）。\u003c/p\u003e\u003cp\u003eⅠ. 两个进程不能同时进入临界区　Ⅱ. 允许进程访问空闲的临界资源　Ⅲ. 进程等待进入临界区的时间是有限的　Ⅳ. 不能进入临界区的执行态进程立即放弃 CPU\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e答案：C（仅 Ⅰ、Ⅱ、Ⅲ）\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003eC（Ⅰ、Ⅱ、Ⅲ）\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅ \u003cstrong\u003e正确\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eⅠ = 忙则等待；Ⅱ = 空闲让进；Ⅲ = 有限等待，三者是\u003cstrong\u003e必须\u003c/strong\u003e遵循的\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eA（仅 Ⅰ、Ⅳ）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eⅣ 是「让权等待」，\u003cstrong\u003e不是必须\u003c/strong\u003e——忙等方案（如自旋锁）也实现了互斥；且漏了核心的 Ⅱ、Ⅲ\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eB（仅 Ⅱ、Ⅲ）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e漏了最核心的「忙则等待」（Ⅰ），没有它就没有互斥\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eD（仅 Ⅰ、Ⅲ、Ⅳ）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e含了非必须的 Ⅳ，同时又漏了 Ⅱ\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e✅ \u003cstrong\u003e已实测核对确认\u003c/strong\u003e：教材原文（王道2027版 \u003cstrong\u003e印刷页 100 / PDF p112\u003c/strong\u003e）四准则顺序为 1）空闲让进、2）忙则等待、3）有限等待、4）让权等待。\u003cbr\u003e本卡此前提示的「解析与原文措辞不一致」疑虑\u003cstrong\u003e不成立\u003c/strong\u003e——2020 题选项 Ⅱ「允许进程访问空闲的临界资源」对应原文第 1 条「空闲让进」，选项 Ⅰ 对应「忙则等待」，选项 Ⅲ 对应「有限等待」，\u003cstrong\u003e选项 Ⅳ 对应第 4 条「让权等待」，而原文自己标注了「非必须」\u003c/strong\u003e。选项与原文严丝合缝，答案 C 无争议。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 实现临界区互斥的方法（2.3.2 · 印刷页 100 / PDF p112）","html":"\u003ch4 class=\"cardsec__sub\"\u003e2.1 软件实现方法 —— 四准则满足情况总表（\u003cstrong\u003e做题模板\u003c/strong\u003e）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e核心代码思想\u003c/th\u003e\u003cth\u003e空闲让进\u003c/th\u003e\u003cth\u003e忙则等待\u003c/th\u003e\u003cth\u003e有限等待\u003c/th\u003e\u003cth\u003e让权等待\u003c/th\u003e\u003cth\u003e关键缺陷\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e单标志法\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"核心代码思想\"\u003e设公用标志 \u003ccode\u003eturn\u003c/code\u003e，\u003ccode\u003eturn=i\u003c/code\u003e 才允许 Pi 进入，退出时置 \u003ccode\u003eturn=j\u003c/code\u003e\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"关键缺陷\"\u003e\u003cstrong\u003e强制轮流\u003c/strong\u003e，违背「空闲让进」：对方不来，本方可进也进不去\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e双标志先检查\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"核心代码思想\"\u003e\u003ccode\u003eflag[i]=true\u003c/code\u003e 后再检查 \u003ccode\u003eflag[j]\u003c/code\u003e，若对方在则自己让路\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"关键缺陷\"\u003e\u003cstrong\u003e同时检查、同时置位\u003c/strong\u003e可同时进临界区\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e双标志后检查\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"核心代码思想\"\u003e先 \u003ccode\u003eflag[i]=true\u003c/code\u003e 再检查 \u003ccode\u003eflag[j]\u003c/code\u003e\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"关键缺陷\"\u003e\u003cstrong\u003e双方都置位、都等待\u003c/strong\u003e，导致\u003cstrong\u003e饥饿\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003ePeterson 算法\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"核心代码思想\"\u003e先 \u003ccode\u003eflag[i]=true\u003c/code\u003e，再 \u003ccode\u003eturn=j\u003c/code\u003e，然后 \u003ccode\u003ewhile(flag[j] &amp;&amp; turn==j)\u003c/code\u003e\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"关键缺陷\"\u003e唯一缺陷：\u003cstrong\u003e忙等\u003c/strong\u003e（不满足让权等待）\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e关键结论：\u003cstrong\u003e没有任何软件方法满足「让权等待」\u003c/strong\u003e——这是纯用户态代码的天花板，只能靠硬件/内核（阻塞原语）突破。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.2 硬件实现方法\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方法\u003c/th\u003e\u003cth\u003e原理\u003c/th\u003e\u003cth\u003e空闲让进\u003c/th\u003e\u003cth\u003e忙则等待\u003c/th\u003e\u003cth\u003e有限等待\u003c/th\u003e\u003cth\u003e让权等待\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003e中断屏蔽\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e进入前关中断，退出后开中断\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e❌（不保证）\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003eTestAndSet（TS）\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e原子地返回旧值并置真，\u003ccode\u003ewhile(TS(lock));\u003c/code\u003e\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方法\"\u003e\u003cstrong\u003eSwap（交换）\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"原理\"\u003e原子地交换两个变量，\u003ccode\u003ewhile(lock); swap(lock,key);\u003c/code\u003e\u003c/td\u003e\u003ctd data-label=\"空闲让进\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"忙则等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"有限等待\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"让权等待\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e它们的共同缺点\u003c/strong\u003e：都是\u003cstrong\u003e忙等待（busy waiting）\u003c/strong\u003e，不满足「让权等待」，浪费 CPU。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.3 ★ 真题深挖：2021 年 408 第 45 题（开/关中断实现信号量互斥）\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题干要点\u003c/strong\u003e（据 PDF 原文核对）：给出整型信号量 \u003ccode\u003eS\u003c/code\u003e 的 \u003ccode\u003ewait()\u003c/code\u003e/\u003ccode\u003esignal()\u003c/code\u003e 功能描述，以及\u003cstrong\u003e用开/关中断指令实现信号量操作互斥的两种方法\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e方法 1\u003c/strong\u003e：进入时关中断 → \u003ccode\u003ewhile(S&lt;=0);\u003c/code\u003e → 开中断 → 关中断 → \u003ccode\u003eS=S-1\u003c/code\u003e → 开中断（判空与修改\u003cstrong\u003e分两段中断关/开\u003c/strong\u003e）\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e方法 2\u003c/strong\u003e：进入时关中断 → \u003ccode\u003ewhile(S&lt;=0);\u003c/code\u003e → \u003ccode\u003eS=S-1\u003c/code\u003e → 开中断（判空与修改\u003cstrong\u003e在同一段关中断内\u003c/strong\u003e）\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e三问：\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e（1）为什么对信号量 S 的访问必须互斥执行？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e因为 \u003ccode\u003eS--\u003c/code\u003e / \u003ccode\u003eS++\u003c/code\u003e 不是原子操作\u003c/strong\u003e。取 S 的值、判断、写回 S 三个步骤间可能被切换。若两个进程同时读到 \u003ccode\u003eS=1\u003c/code\u003e，都判断可进，各自执行 \u003ccode\u003eS=S-1\u003c/code\u003e，最终 \u003ccode\u003eS=-1\u003c/code\u003e 却有\u003cstrong\u003e两个\u003c/strong\u003e进程进入临界区，互斥被破坏。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e（2）方法 1 与方法 2 是否正确？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e方法 1 不正确，方法 2 正确。\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e方法 1 的漏洞：判空 \u003ccode\u003ewhile(S&lt;=0);\u003c/code\u003e 与 \u003ccode\u003eS=S-1\u003c/code\u003e 之间\u003cstrong\u003e开了中断\u003c/strong\u003e。若此时 S 刚好被另一进程（或另一 CPU 核）改小，判空结论失效，仍会重复进入 —— \u003cstrong\u003e判空与修改必须原子完成\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e方法 2 把「判空 + 修改」放进同一段关中断区间，保证原子性，正确。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e（3）用户程序能否使用开/关中断指令实现临界区互斥？\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e→ \u003cstrong\u003e不能\u003c/strong\u003e。原因有两条：\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e开/关中断指令是特权指令\u003c/strong\u003e，只在\u003cstrong\u003e内核态\u003c/strong\u003e可执行，用户态执行会触发异常；用户程序运行在用户态。\u003c/li\u003e\u003cli\u003e即便允许，\u003cstrong\u003e关中断只对当前 CPU 核有效\u003c/strong\u003e，在多处理机系统上无法阻止另一个核上的进程进入临界区。\u003c/li\u003e\u003c/ol\u003e\u003cblockquote\u003e🔗 \u003cstrong\u003e跨科标注\u003c/strong\u003e：本题第 3 问本质是\u003cstrong\u003e计组的「特权指令」与「中断机制」\u003c/strong\u003e知识点（特权指令只能在核心态执行），408 把它们放在 OS 大题中考。计组细节\u003cstrong\u003e跨科，不展开\u003c/strong\u003e。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 信号量机制与 PV 操作（2.3.4 · 印刷页 104 / PDF p116）★ 本节核心","html":"\u003cblockquote\u003e📖 \u003cstrong\u003e原文出处（已实测核对）\u003c/strong\u003e：小节标题 \u003cstrong\u003e2.3.4 信号量\u003c/strong\u003e 起于 \u003cstrong\u003e印刷页 104（PDF p116）\u003c/strong\u003e；记录型信号量的完整描述在 \u003cstrong\u003e印刷页 105（PDF p117）\u003c/strong\u003e。\u003cbr\u003e原文关键句（印刷页 105 / PDF p117，已逐字核对）：\u003cbr\u003e- 「执行 wait(S) 时，进程首先将 S.value 减 1……若减 1 后 \u003cstrong\u003eS.value &lt; 0\u003c/strong\u003e，则表明该类资源已分配完毕，当前进程应调用 \u003cstrong\u003eblock 原语自我阻塞\u003c/strong\u003e，主动放弃 CPU，并加入等待队列 S.L，从而实现'让权等待'。」\u003cbr\u003e- 「执行 signal(S) 时，
