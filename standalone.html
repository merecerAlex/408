03e特性\u003c/th\u003e\u003cth\u003e电路交换\u003c/th\u003e\u003cth\u003e报文交换\u003c/th\u003e\u003cth\u003e分组交换\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e完成传输所需时间\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e最少\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e最多\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e较少\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e存储转发时延\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e无\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e较低\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e通信前是否建连接\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e是\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e否\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e节点缓存开销\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e无\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e低\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e是否支持差错控制\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e\u003cstrong\u003e不支持\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e支持\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e支持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e数据是否有序到达\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e否\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e是否需额外控制信息\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e否\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e是\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e是（且占比较大）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e线路分配灵活性\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e不灵活\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e灵活\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e非常灵活\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"特性\"\u003e线路利用率\u003c/td\u003e\u003ctd data-label=\"电路交换\"\u003e低\u003c/td\u003e\u003ctd data-label=\"报文交换\"\u003e高\u003c/td\u003e\u003ctd data-label=\"分组交换\"\u003e\u003cstrong\u003e非常高\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.5 三个坑\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e「分组交换时延最小」是错的\u003c/strong\u003e。时延最小的是\u003cstrong\u003e电路交换\u003c/strong\u003e；分组交换只是比\u003cstrong\u003e报文交换\u003c/strong\u003e小。题目问「传输时延最小」→ 电路交换；问「线路利用率最高」→ 分组交换。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分组交换的额外开销 5%～10%\u003c/strong\u003e。因为每个数据段都要加首部，传送的信息量会增大约 5%～10%，这是它的缺点之一。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分组交换不保证有序\u003c/strong\u003e。采用数据报服务时，分组可能经不同路径到达，需要目的主机按编号重排序。虚电路服务可以避免失序，但要多花建连接的时间。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 性能指标（本章第二大计算题源）","html":"\u003ch4 class=\"cardsec__sub\"\u003e2.1 七个指标\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数字信道上传输数据的速率，又称数据率、比特率\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e带宽\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e计算机网络中：数字信道\u003cstrong\u003e能支持的最高数据速率\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e吞吐量\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e单位时间内通过某网络/信道/接口的\u003cstrong\u003e实际\u003c/strong\u003e数据量\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e时延\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发送 + 传播 + 处理 + 排队\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003es\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e时延带宽积\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e传播时延 × 信道带宽\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003ebit\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e往返时延 RTT\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e从发出到收到确认的总时间\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003es\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信道利用率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e有数据时间 ÷ 总时间\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e%\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.2 带宽的两个含义（爱考）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e通信领域\u003c/strong\u003e：信号频率范围，单位 \u003cstrong\u003eHz\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e计算机网络\u003c/strong\u003e：数字信道最高数据速率，单位 \u003cstrong\u003eb/s\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e实际可用带宽\u003c/strong\u003e = 双方网卡性能、各段链路带宽、交换设备速率三者中的\u003cstrong\u003e最小值\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003cblockquote\u003e例：主机 A 网卡 1 Gb/s，主机 B 网卡 10 Mb/s，链路 100 Mb/s → 最高理论速率 \u003cstrong\u003e10 Mb/s\u003c/strong\u003e（取最小）。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.3 时延带宽积（「以比特为单位的链路长度」）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e时延带宽积 = 传播时延 × 带宽\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e理解：把链路想成一根\u003cstrong\u003e空心管道\u003c/strong\u003e——长度是传播时延，横截面积是带宽，时延带宽积就是这根管子\u003cstrong\u003e能装多少比特\u003c/strong\u003e。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.4 RTT 的边界（最容易记错）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eRTT = 往返传播时延 + 接收端处理时延 + 中间节点处理/排队时延\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e❌ \u003cstrong\u003e不包括数据分组本身的发送时延\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e❌ 也不包括确认分组的发送时延\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.5 信道利用率\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e信道利用率 = 有数据通过的时间 ÷ (有数据通过的时间 + 无数据通过的时间)\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003e不是越高越好：过低浪费资源；过高导致排队时延显著增加，引发\u003cstrong\u003e拥塞\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.6 常考题型模板\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题型 A：已知传播时延和发送时延相等，求分组大小\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e发送时延 = 传播时延\n分组长度 / 带宽 = 链路长度 / 传播速率\n→ 分组长度 = 带宽 × 链路长度 / 传播速率\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e例（1.1.7 第 10 题）：链路长 100 km，传播速率 10⁸ m/s，带宽 20 Mb/s\u003cbr\u003e传播时延 = 10⁵ m ÷ 10⁸ m/s = 10⁻³ s = 1 ms\u003cbr\u003e分组长度 = 20×10⁶ × 10⁻³ = 20 000 bit = \u003cstrong\u003e20 Kb\u003c/strong\u003e → 选 A\u003cbr\u003e⚠️ 题目给的传播速率是多少就用多少，\u003cstrong\u003e不要默认 2×10⁸\u003c/strong\u003e。真题里 10⁸ 和 2×10⁸ 都出现过。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e题型 B：分组交换总时延\u003c/strong\u003e（见 §1.2 公式③）\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e题型 C：吞吐量\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e吞吐量 = 瓶颈链路的带宽（多段串联时取最小）\u003c/code\u003e\u003c/pre\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 分层结构与相关概念","html":"\u003ch4 class=\"cardsec__sub\"\u003e3.1 分层的基本原则（5 条，考选择题）\u003c/h4\u003e\u003col\u003e\u003cli\u003e每层实现一种\u003cstrong\u003e相对独立\u003c/strong\u003e的功能，降低复杂度。\u003c/li\u003e\u003cli\u003e各层之间接口清晰、简洁，相互依赖尽可能少。\u003c/li\u003e\u003cli\u003e各层功能的定义\u003cstrong\u003e独立于具体实现方法\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e保持\u003cstrong\u003e下层对上层的独立性\u003c/strong\u003e，上层单向使用下层提供的服务。\u003c/li\u003e\u003cli\u003e整个分层结构应有利于\u003cstrong\u003e标准化\u003c/strong\u003e。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.2 核心名词（一组必考概念）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e实体\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e任何可发送或接收信息的硬件或软件进程\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e对等实体\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e不同机器上\u003cstrong\u003e同一层\u003c/strong\u003e的实体\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e水平\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e服务\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e下层为紧邻上层提供的功能调用\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e垂直\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e协议\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e控制\u003cstrong\u003e对等实体\u003c/strong\u003e之间通信的规则集合\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e水平\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eSAP（服务访问点）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e相邻两层实体交换信息的逻辑接口\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e垂直\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003ePDU\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e对等层之间传送的数据单位，n-PDU\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e水平\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eSDU\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e相邻层之间交换的数据单位，n-SDU\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e垂直\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003ePCI\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e协议控制信息，n-PCI\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e封装关系（必背）\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003en-SDU + n-PCI = n-PDU = (n−1)-SDU\u003c/code\u003e\u003c/pre\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.3 各层 PDU 的通俗名称\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e物理层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e比特流\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据链路层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e帧\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eIP 分组（数据报）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eTCP 报文段 / UDP 用户数据报\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应用层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e报文\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.4 分层的四条含义（爱考「下列说法错误的是」）\u003c/h4\u003e\u003col\u003e\u003cli\u003e第 n 层实体既要利用第 n−1 层的服务，又要向第 n+1 层提供服务。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e最低层只提供服务\u003c/strong\u003e，是整个层次结构的基础；\u003cstrong\u003e最高层面向用户提供服务\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e上层只能通过\u003cstrong\u003e相邻层\u003c/strong\u003e的接口使用下层的服务，\u003cstrong\u003e不能跨层调用\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e通信时，对等层在逻辑上如同存在一条直接信道。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 协议、接口、服务","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 协议的三要素\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e语法\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数据与控制信息的\u003cstrong\u003e格式\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eTCP 报文段的结构\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e语义\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发出何种控制信息、完成何种动作、做出何种应答\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e三次握手每次做什么\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e同步（时序）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e执行各种操作的\u003cstrong\u003e条件\u003c/strong\u003e及事件发生的\u003cstrong\u003e先后顺序\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e三次握手的时序\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 协议 vs 服务（最高频辨析）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e方向\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e水平\u003c/strong\u003e（对等实体之间）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e垂直\u003c/strong\u003e（下层给上层）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e是否可见\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e下层协议对上层\u003cstrong\u003e透明\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e上层只能感知服务\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e关系\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e只有本层协议正确实现，才能向上层提供服务\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e服务是协议实现的结果\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e一句话\u003c/strong\u003e：协议是「同级之间怎么谈」，服务是「下层给上层什么」。\u003cbr\u003e\u003cstrong\u003e关键\u003c/strong\u003e：不是某一层完成的全部功能都能叫服务，\u003cstrong\u003e只有能被上层实体感知并调用的功能\u003c/strong\u003e才构成服务。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.3 服务的三种分类\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e连接\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e面向连接 / 无连接\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e面向连接三阶段：建立、传输、释放\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e可靠性\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e可靠 / 不可靠\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e不可靠 = 「尽最大努力交付」，可靠性由高层补\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应答\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e有应答 / 无应答\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eWWW 通常\u003cstrong\u003e无应答\u003c/strong\u003e；文件传输\u003cstrong\u003e有应答\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. OSI 七层参考模型（本章第三大考点）","html":"\u003ch4 class=\"cardsec__sub\"\u003e5.1 七层功能速记表\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e层\u003c/th\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e传输单位\u003c/th\u003e\u003cth\u003e核心功能\u003c/th\u003e\u003cth\u003e典型设备\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e应用层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e7\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e报文\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e提供应用与网络的接口\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e表示层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e6\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e—\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e数据格式转换、压缩、加解密\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e会话层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e5\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e—\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e会话管理、\u003cstrong\u003e检查点/断点续传\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e传输层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e4\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e报文段/用户数据报\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e端到端通信、复用分用、可靠传输\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e网关\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e网络层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e3\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e分组\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e路由选择、拥塞控制、网际互联\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e路由器\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e数据链路层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e2\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e帧\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e差错控制、流量控制、成帧\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e网桥、交换机\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"层\"\u003e物理层\u003c/td\u003e\u003ctd data-label=\"序号\"\u003e1\u003c/td\u003e\u003ctd data-label=\"传输单位\"\u003e比特\u003c/td\u003e\u003ctd data-label=\"核心功能\"\u003e定义接口参数、信号含义/电气特性\u003c/td\u003e\u003ctd data-label=\"典型设备\"\u003e中继器、集线器\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.2 三个「地址」的层次（一句话区分）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据链路层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e节点到节点\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eMAC 地址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e主机到主机\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eIP 地址\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e端到端\u003c/strong\u003e（进程到进程）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e端口号\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.3 传输层的复用与分用\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e复用\u003c/strong\u003e：多个应用进程可同时使用传输层的服务。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e分用\u003c/strong\u003e：传输层能把收到的数据准确交付给对应的上层进程。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.4 物理层的一个坑\u003c/h4\u003e\u003cblockquote\u003e\u003cstrong\u003e传输介质不属于物理层协议范畴\u003c/strong\u003e，而是位于其下方。有人把物理介质称为「第 0 层」。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.5 会话层的检查点\u003c/h4\u003e\u003cp\u003e会话层为表示层/用户进程提供同步机制（SYN），并引入\u003cstrong\u003e检查点\u003c/strong\u003e功能：通信中断时可从最近的检查点恢复会话，实现类似「断点续传」的可靠性。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. TCP/IP 模型与 OSI 对比","html":"\u003ch4 class=\"cardsec__sub\"\u003e6.1 TCP/IP 四层\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e应用层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e会话 + 表示 + 应用\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eHTTP、SMTP、DNS、RTP、FTP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e传输层\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eTCP、UDP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网际层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e网络层\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eIP、ARP、ICMP、IGMP\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e网络接口层\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e物理 + 数据链路\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e未规定具体协议\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e6.2 两大设计哲学\u003c/h4\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eEverything over IP\u003c/strong\u003e：各种应用都可构建于 IP 之上。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eIP over Everything\u003c/strong\u003e：IP 可运行于任意底层网络之上。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e6.3 四点差异（必背，考「下列说法正确的是」）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e1\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e精确定义了\u003cstrong\u003e服务、协议、接口\u003c/strong\u003e三个概念\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e未做明确区分\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e2\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e7 层\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e4 层\u003c/strong\u003e（表示+会话并入应用层；物理+链路并入网络接口层）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e3\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e先有模型，后制定协议\u003c/strong\u003e（通用性好）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e先有协议栈，后归纳模型\u003c/strong\u003e（不适用于非 TCP/IP 网络）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e4\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e网络层支持无连接+面向连接；\u003cstrong\u003e传输层仅面向连接\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e网际层\u003cstrong\u003e仅无连接\u003c/strong\u003e；传输层\u003cstrong\u003e两种都支持\u003c/strong\u003e（TCP/UDP）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e6.4 五层协议体系结构（本书采用）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e5 应用层\n4 传输层\n3 网络层\n2 数据链路层\n1 物理层\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e融合了 OSI 和 TCP/IP 的优点，是\u003cstrong\u003e学习用\u003c/strong\u003e的折中结构。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 封装与解封装","html":"\u003cp\u003e发送方\u003cstrong\u003e从上到下逐层加首部\u003c/strong\u003e，接收方\u003cstrong\u003e从下到上逐层拆首部\u003c/strong\u003e。\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e应用层    数据\n传输层    [H₄]数据\n网络层    [H₃][H₄]数据\n数据链路层 [H₂][H₃][H₄]数据[T₂]      ← 链路层既有首部也有尾部\n物理层    10100比特流110100\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e注意：\u003cstrong\u003e数据链路层同时有首部和尾部\u003c/strong\u003e，其余各层只有首部。这是选择题常考点。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-9","section":"8. 概念辨析（易错 8 组）","html":"\u003cp\u003e\u003cstrong\u003e① internet 与 Internet\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003ccode\u003einternet\u003c/code\u003e（互连网）：通用名词，泛指多个计算机网络互连，\u003cstrong\u003e可用任意协议\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003ccode\u003eInternet\u003c/code\u003e（互联网/因特网）：专用名词，特指全球最大的互联网，\u003cstrong\u003e必须用 TCP/IP\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e② 网络 vs 互连网\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e网络：多台计算机连在一起。\u003c/li\u003e\u003cli\u003e互连网：多个\u003cstrong\u003e网络\u003c/strong\u003e通过\u003cstrong\u003e路由器\u003c/strong\u003e连在一起。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e③ 计算机网络的组成（三个视角）\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e按组成：硬件、软件、\u003cstrong\u003e协议\u003c/strong\u003e（协议是核心）。\u003c/li\u003e\u003cli\u003e按工作方式：边缘部分（主机）+ 核心部分（路由器+网络）。\u003c/li\u003e\u003cli\u003e按功能：通信子网 + 资源子网。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e④ 计算机网络的五大功能\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e数据通信（最基本）、资源共享、分布式处理、提高可靠性、负载均衡。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e⑤ 网络分类的五种依据\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e分布范围\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eWAN（几十～几千 km）、MAN（5～50 km）、LAN（几十 m～几 km）、PAN\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输技术\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e广播式、点对点\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e拓扑结构\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e总线形、星形、环形、网状\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e使用者\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e公用网、专用网\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传输介质\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e有线、无线\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e⑥ 四种拓扑的优缺点\u003c/strong\u003e\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e拓扑\u003c/th\u003e\u003cth\u003e优点\u003c/th\u003e\u003cth\u003e缺点\u003c/th\u003e\u003cth\u003e常用于\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"拓扑\"\u003e总线形\u003c/td\u003e\u003ctd data-label=\"优点\"\u003e建网容易、增减节点方便、省线路\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e重负载效率低；总线任一处故障影响全网\u003c/td\u003e\u003ctd data-label=\"常用于\"\u003e局域网\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"拓扑\"\u003e星形\u003c/td\u003e\u003ctd data-label=\"优点\"\u003e便于集中控制与管理\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e成本高；\u003cstrong\u003e中央设备对故障敏感\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"常用于\"\u003e局域网\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"拓扑\"\u003e环形\u003c/td\u003e\u003ctd data-label=\"优点\"\u003e信号单向传输、可靠性可用双环提升\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e—\u003c/td\u003e\u003ctd data-label=\"常用于\"\u003e局域网（令牌环）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"拓扑\"\u003e网状\u003c/td\u003e\u003ctd data-label=\"优点\"\u003e可靠性高、容错能力强\u003c/td\u003e\u003ctd data-label=\"缺点\"\u003e控制复杂、线路成本高\u003c/td\u003e\u003ctd data-label=\"常用于\"\u003e\u003cstrong\u003e广域网\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e⑦ 网络体系结构 vs 实现\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e体系结构是\u003cstrong\u003e抽象的\u003c/strong\u003e（定义各层功能）；实现是\u003cstrong\u003e具体的\u003c/strong\u003e（软硬件）。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e⑧ 端到端 vs 点到点\u003c/strong\u003e（本章小结原话）\u003c/p\u003e\u003cul\u003e\u003cli\u003e点到点：主机到主机的数据传递，\u003cstrong\u003e不涉及具体应用进程\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e端到端：不同主机上\u003cstrong\u003e应用进程\u003c/strong\u003e之间的通信，「端」指\u003cstrong\u003e端口\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e通信子网（物理层+链路层+网络层）提供主机到主机通信；传输层提供端到端通信。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-10","section":"9. 自测清单（能全答出来就够做题了）","html":"\u003col\u003e\u003cli\u003e发送时延和传播时延分别取决于什么？各用什么公式？\u003c/li\u003e\u003cli\u003e三种交换方式的总时延公式分别是什么？\u003c/li\u003e\u003cli\u003e为什么电路交换「时延最小」但「线路利用率低」？\u003c/li\u003e\u003cli\u003e分组交换相比报文交换的三个改进是什么？\u003c/li\u003e\u003cli\u003e分组交换的三个缺点是什么？\u003c/li\u003e\u003cli\u003e时延带宽积的物理意义是什么？单位是什么？\u003c/li\u003e\u003cli\u003eRTT 包不包括发送时延？为什么？\u003c/li\u003e\u003cli\u003e信道利用率为什么不是越高越好？\u003c/li\u003e\u003cli\u003e带宽在通信领域和计算机网络里分别是多少单位？\u003c/li\u003e\u003cli\u003e实际可用带宽由什么决定？\u003c/li\u003e\u003cli\u003e分层的五条基本原则是什么？\u003c/li\u003e\u003cli\u003e协议的三要素分别规定什么？\u003c/li\u003e\u003cli\u003e协议和服务分别是什么方向？\u003c/li\u003e\u003cli\u003en-SDU、n-PCI、n-PDU 三者的关系式？\u003c/li\u003e\u003cli\u003e各层的 PDU 通俗名称分别是什么？\u003c/li\u003e\u003cli\u003eOSI 七层从下到上分别是什么？各层传输单位是什么？\u003c/li\u003e\u003cli\u003e数据链路层、网络层、传输层分别用什么地址？通信范围分别是什么？\u003c/li\u003e\u003cli\u003e会话层的「检查点」是干什么用的？\u003c/li\u003e\u003cli\u003e传输介质属于物理层吗？\u003c/li\u003e\u003cli\u003eTCP/IP 四层分别对应 OSI 的哪些层？\u003c/li\u003e\u003cli\u003eOSI 和 TCP/IP 的四点差异是什么？\u003c/li\u003e\u003cli\u003e为什么 OSI 传输层只提供面向连接服务，而 TCP/IP 传输层两种都提供？\u003c/li\u003e\u003cli\u003e数据链路层为什么既有首部又有尾部？\u003c/li\u003e\u003cli\u003einternet 和 Internet 的区别？\u003c/li\u003e\u003cli\u003e端到端通信和点到点通信的区别？\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-11","section":"10. 已知未覆盖 / 后续补充","html":"\u003cul\u003e\u003cli\u003e本章\u003cstrong\u003e没有\u003c/strong\u003e涉及 IP 地址、子网划分、路由算法——这些在第 4 章网络层。\u003c/li\u003e\u003cli\u003e数据报与虚电路服务的完整讨论在第 4 章 4.1.3 节，本章只在「分组交换缺点」里提了一句。\u003c/li\u003e\u003cli\u003e1.1.7 与 1.2.4 的习题与解析未逐题录入（篇幅考虑），做题时对照本卡即可。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-12","section":"附：本章计算题复算对照表","html":"\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e题目来源\u003c/th\u003e\u003cth\u003e已知\u003c/th\u003e\u003cth\u003e求\u003c/th\u003e\u003cth\u003e答案\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e图 1.6 场景一\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e1000 B，100 Mb/s + 80 Mb/s，忽略传播\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时延\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e0.18 ms\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e图 1.6 场景二\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e加传播 0.01 + 0.05 ms\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时延\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e0.24 ms\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e图 1.6 场景三\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e再加处理排队 0.04 ms\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时延\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e0.28 ms\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 09 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003eA 网卡 1 Gb/s，B 网卡 10 Mb/s，链路 100 Mb/s\u003c/td\u003e\u003ctd data-label=\"求\"\u003e最高速率\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e10 Mb/s\u003c/strong\u003e（取瓶颈）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 10 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e100 km，10⁸ m/s，20 Mb/s，发送时延=传播时延\u003c/td\u003e\u003ctd data-label=\"求\"\u003e分组大小\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e20 Kb\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 11 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e2 个 1000 B 分组，2 段链路各 1 Mb/s，路由器处理 10 ms/个\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时间\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e36 ms\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 13 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e文件 980 000 B，分组 1000 B（首部 20 B），3 段链路各 100 Mb/s\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时间\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e80.16 ms\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 14 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e报文 8 Mb，分组 10 kb，2 段链路各 10 Mb/s\u003c/td\u003e\u003ctd data-label=\"求\"\u003e报文 vs 分组\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e1600 ms vs 801 ms\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 15 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e1 MB 文件，1000 B 分组，100 Mb/s，1 个路由器\u003c/td\u003e\u003ctd data-label=\"求\"\u003e总时间\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e80.10 ms\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 16 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e三条路径，端侧链路 10 Mb/s\u003c/td\u003e\u003ctd data-label=\"求\"\u003e吞吐量\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003e取最小带宽链路\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"题目来源\"\u003e1.1.7 第 17 题\u003c/td\u003e\u003ctd data-label=\"已知\"\u003e2 MB 文件，400 B 分组，10/100/1000 Mb/s 三段\u003c/td\u003e\u003ctd data-label=\"求\"\u003e三种交换对比\u003c/td\u003e\u003ctd data-label=\"答案\"\u003e\u003cstrong\u003eTms &gt; Tps &gt; Tcs\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e三个必须记住的流水线结论\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e① 分组交换总时延（k 段链路，n 个分组）\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eT = (n + k − 1) × r        r = 分组长度 / 链路速率\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e推导：第 1 个分组要走 k 段 = k·r；之后每 r 时间就有一个分组到达，共 (n−1)·r。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e② 路由器逐段速率不同时\u003c/strong\u003e：不能套一个 r，要\u003cstrong\u003e逐段算\u003c/strong\u003e再相加（见第 17 题）。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e③ 「至少需要多少时间」= 流水线满载\u003c/strong\u003e。若路由器串行处理（一次只能处理一个分组），处理时间会变成瓶颈，要按「处理时间 vs 发送时间」谁大取谁（见第 11 题：36 ms，不是 26 ms）。\u003c/p\u003e"}]}]},{"chapter":"第2章 物理层","subject":"net","docs":[{"id":"doc-1","title":"第 2 章 物理层（做题导向版）","sections":[{"id":"sec-1","section":"0. 考场速查（考前 10 分钟只看这一页）","html":"\u003cblockquote\u003e数据源：《2027 王道计算机网络考研复习指导》第 2 章（PDF p42–p61）。\u003cbr\u003e本章\u003cstrong\u003e概念多、计算少但必考\u003c/strong\u003e：奈氏准则与香农定理几乎年年出题，编码波形年年出图。\u003cbr\u003e所有计算按公式重算过。\u003c/blockquote\u003e\u003chr\u003e\u003ch4 class=\"cardsec__sub\"\u003e两个定理（本章最核心，必背）\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e适用信道\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e理想低通\u003c/strong\u003e（无噪声、带宽有限）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e有高斯白噪声\u003c/strong\u003e的实际信道\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e限制什么\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e只限\u003cstrong\u003e码元传输速率\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e限\u003cstrong\u003e信息传输速率\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e公式\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e极限码元速率 = \u003cstrong\u003e2W\u003c/strong\u003e Baud\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e极限数据速率 = \u003cstrong\u003eW·log₂(1 + S/N)\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e极限数据速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e2W·log₂V\u003c/strong\u003e b/s\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eW·log₂(1 + S/N) b/s\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e考虑噪声\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e❌ 不考虑\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e✅ 考虑\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e考虑编码级数\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e✅ V（码元种类数）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e❌ 不看 V\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cstrong\u003e一句话\u003c/strong\u003e：奈氏管「码元跑多快」，香农管「信息跑多快」。有噪声用香农，无噪声用奈氏。\u003cbr\u003e题目同时给带宽和信噪比 → \u003cstrong\u003e两个都算，取小的那个\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e符号对照\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eW\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e信道频率带宽\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eHz\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eV\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每个码元的离散电平数量（码元种类数）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e个\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eS/N\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e信噪比（\u003cstrong\u003e无单位\u003c/strong\u003e比值）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信噪比(dB)\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e10·log₁₀(S/N)\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003edB\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eB\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e波特率（码元传输速率）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eBaud\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eR\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e比特率（信息传输速率）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eb/s\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e波特率 ↔ 比特率\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e比特率 = 波特率 × log₂V = 波特率 × 每个码元携带的比特数\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e例：1 码元带 4 bit（16 种状态）→ 波特率 2000 Baud 时，比特率 = 8000 b/s。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003edB 换算（每年都考）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e信噪比(dB) = 10·log₁₀(S/N)\n30 dB → S/N = 1000\n20 dB → S/N = 100\n10 dB → S/N = 10\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e⚠️ 用香农公式时代入的是 \u003cstrong\u003eS/N 的比值\u003c/strong\u003e，不是 dB 值！\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-2","section":"1. 基本概念","html":"\u003ch4 class=\"cardsec__sub\"\u003e1.1 数据、信号、码元\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数据\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e信息的\u003cstrong\u003e载体\u003c/strong\u003e，传送信息的实体\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e数据的\u003cstrong\u003e电气或电磁表现\u003c/strong\u003e，传输过程中的存在形式\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e模拟信号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e取值\u003cstrong\u003e连续\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e数字信号\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e取值\u003cstrong\u003e离散\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e码元\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e一个固定时长的信号波形，表示一个 k 进制符号\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e码元宽度\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e该固定时长（信号周期）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e码元携带的比特数\u003c/strong\u003e：\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e若信号有 V 种状态 → 1 码元携带 log₂V 比特\n2 种信号 → 1 bit/码元\n4 种信号 → 2 bit/码元\n8 种信号 → 3 bit/码元\u003c/code\u003e\u003c/pre\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.2 信源、信道、信宿\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e信源 → 发送变换器 → 信道 → 接收变换器 → 信宿\n                ↑\n              噪声源\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信源\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e产生和发送数据的源头\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信宿\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e接收数据的终点\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e信道\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e信号的传输介质\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e噪声源\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e信道及其他各处噪声的集中表示\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e信道的两种分类\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e按信号形式：模拟信道 / 数字信道\u003c/li\u003e\u003cli\u003e按传输介质：无线信道 / 有线信道\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e基带 vs 宽带\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003e基带信号\u003c/strong\u003e：信源发出的\u003cstrong\u003e未经过调制\u003c/strong\u003e的原始电信号 → 基带传输\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e宽带信号\u003c/strong\u003e：基带信号调制到高频载波上 → 宽带传输\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.3 串行 vs 并行\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e方式\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e逐比特按序依次传输\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e若干比特通过多条信道同时传输\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e适用\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e长距离\u003c/strong\u003e（计算机网络）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e短距离\u003c/strong\u003e（CPU 与主存之间）\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e1.4 三种通信方式（必考选择题）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e方式\u003c/th\u003e\u003cth\u003e特点\u003c/th\u003e\u003cth\u003e需要几个信道\u003c/th\u003e\u003cth\u003e例子\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e单向通信（单工）\u003c/td\u003e\u003ctd data-label=\"特点\"\u003e只有一个方向，无反向交互\u003c/td\u003e\u003ctd data-label=\"需要几个信道\"\u003e\u003cstrong\u003e1 个\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"例子\"\u003e无线电广播、电视广播\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e半双工通信\u003c/td\u003e\u003ctd data-label=\"特点\"\u003e双方都能收发，但\u003cstrong\u003e不能同时\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"需要几个信道\"\u003e同一信道\u003cstrong\u003e分时\u003c/strong\u003e双向\u003c/td\u003e\u003ctd data-label=\"例子\"\u003e对讲机\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"方式\"\u003e全双工通信\u003c/td\u003e\u003ctd data-label=\"特点\"\u003e双方可\u003cstrong\u003e同时\u003c/strong\u003e收发\u003c/td\u003e\u003ctd data-label=\"需要几个信道\"\u003e\u003cstrong\u003e2 个独立信道\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"例子\"\u003e电话\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e坑：半双工\u003cstrong\u003e不需要\u003c/strong\u003e两个物理信道，它在同一信道上分时双向传输。\u003c/blockquote\u003e\u003chr\u003e"},{"id":"sec-3","section":"2. 奈奎斯特定理（奈氏准则）","html":"\u003ch4 class=\"cardsec__sub\"\u003e2.1 公式\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e理想低通信道的极限码元传输速率 = 2W  (Baud)\n理想低通信道的极限数据传输速率 = 2W·log₂V  (b/s)\u003c/code\u003e\u003c/pre\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.2 为什么是 2W\u003c/h4\u003e\u003cp\u003e信号中的高频分量无法通过有限带宽的信道，导致接收端波形失去码元之间的清晰界限——这叫\u003cstrong\u003e码间串扰\u003c/strong\u003e。奈氏证明：为避免码间串扰，码元速率不能超过 2W。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.3 三条结论\u003c/h4\u003e\u003col\u003e\u003cli\u003e任何信道中，\u003cstrong\u003e码元传输速率存在上限\u003c/strong\u003e，超过就产生严重码间串扰。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e信道带宽越大\u003c/strong\u003e，传输码元的能力越强。\u003c/li\u003e\u003cli\u003e奈氏准则\u003cstrong\u003e只限码元速率，不限每个码元能带多少比特\u003c/strong\u003e——所以可以用多元调制（QAM-16、QAM-64）提高信息传输速率。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e2.4 常考题型\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题型：已知带宽和码元种类数，求极限数据速率\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eR = 2W · log₂V\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e例：带宽 3 kHz，采用 4 种码元（V=4）\u003cbr\u003eR = 2 × 3000 × log₂4 = 6000 × 2 = \u003cstrong\u003e12 000 b/s = 12 kb/s\u003c/strong\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e题型：已知数据速率求所需带宽\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eW = R / (2·log₂V)\u003c/code\u003e\u003c/pre\u003e\u003chr\u003e"},{"id":"sec-4","section":"3. 香农定理","html":"\u003ch4 class=\"cardsec__sub\"\u003e3.1 公式\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e信道的极限数据传输速率 = W·log₂(1 + S/N)   (b/s)\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003eW：信道频率带宽（Hz）\u003c/li\u003e\u003cli\u003eS：信号平均功率\u003c/li\u003e\u003cli\u003eN：噪声功率\u003c/li\u003e\u003cli\u003eS/N：信噪比（\u003cstrong\u003e无单位比值\u003c/strong\u003e）\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.2 四条结论\u003c/h4\u003e\u003col\u003e\u003cli\u003e信道带宽或信噪比越大，极限传输速率越高。\u003c/li\u003e\u003cli\u003e给定带宽和信噪比，\u003cstrong\u003e信息传输速率的上限是确定的\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e只要实际速率低于该极限，就\u003cstrong\u003e一定能找到某种方法实现近似无差错传输\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e香农给的是\u003cstrong\u003e理论极限\u003c/strong\u003e，实际信道能达到的速率要低不少。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.3 常考题型\u003c/h4\u003e\u003cp\u003e\u003cstrong\u003e题型：给带宽 + dB 信噪比，求极限速率\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e① 先把 dB 换成比值：S/N = 10^(dB/10)\n② 再代入：R = W·log₂(1 + S/N)\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e例：带宽 3 kHz，信噪比 30 dB\u003cbr\u003eS/N = 10^(30/10) = 1000\u003cbr\u003eR = 3000 × log₂(1001) ≈ 3000 × 9.97 ≈ \u003cstrong\u003e29 900 b/s ≈ 30 kb/s\u003c/strong\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e题型：同时给带宽、V、信噪比\u003c/strong\u003e\u003c/p\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e奈氏：R₁ = 2W·log₂V\n香农：R₂ = W·log₂(1 + S/N)\n取 min(R₁, R₂)\u003c/code\u003e\u003c/pre\u003e\u003cblockquote\u003e这是最常考的综合题型。\u003cstrong\u003e别只算一个就交卷\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e3.4 奈氏 vs 香农（对比表已在 §0，这里是理解）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e奈氏：\u003cstrong\u003e理想信道\u003c/strong\u003e，只考虑带宽引起的码间串扰，不考虑噪声。\u003c/li\u003e\u003cli\u003e香农：\u003cstrong\u003e实际信道\u003c/strong\u003e，同时考虑带宽和噪声。\u003c/li\u003e\u003cli\u003e香农定理的潜台词：\u003cstrong\u003e每个码元能可靠携带的比特数是有限的\u003c/strong\u003e（因为有噪声）。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-5","section":"4. 编码与调制","html":"\u003ch4 class=\"cardsec__sub\"\u003e4.1 四种转换（一张表理清）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e数据\u003c/th\u003e\u003cth\u003e→ 信号\u003c/th\u003e\u003cth\u003e技术\u003c/th\u003e\u003cth\u003e说明\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"数据\"\u003e数字\u003c/td\u003e\u003ctd data-label=\"→ 信号\"\u003e→ 数字\u003c/td\u003e\u003ctd data-label=\"技术\"\u003e\u003cstrong\u003e编码\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"说明\"\u003e基带传输\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"数据\"\u003e模拟\u003c/td\u003e\u003ctd data-label=\"→ 信号\"\u003e→ 数字\u003c/td\u003e\u003ctd data-label=\"技术\"\u003e\u003cstrong\u003ePCM\u003c/strong\u003e（采样→量化→编码）\u003c/td\u003e\u003ctd data-label=\"说明\"\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"数据\"\u003e数字\u003c/td\u003e\u003ctd data-label=\"→ 信号\"\u003e→ 模拟\u003c/td\u003e\u003ctd data-label=\"技术\"\u003e\u003cstrong\u003e调制\u003c/strong\u003e（ASK/FSK/PSK/QAM）\u003c/td\u003e\u003ctd data-label=\"说明\"\u003e调制解调器\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"数据\"\u003e模拟\u003c/td\u003e\u003ctd data-label=\"→ 信号\"\u003e→ 模拟\u003c/td\u003e\u003ctd data-label=\"技术\"\u003e模拟调制（AM/FM/PM）\u003c/td\u003e\u003ctd data-label=\"说明\"\u003e传统电话\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e定义：数据→\u003cstrong\u003e数字信号\u003c/strong\u003e叫\u003cstrong\u003e编码\u003c/strong\u003e；数据→\u003cstrong\u003e模拟信号\u003c/strong\u003e叫\u003cstrong\u003e调制\u003c/strong\u003e。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.2 数字数据 → 数字信号（五种编码，\u003cstrong\u003e年年考波形\u003c/strong\u003e）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e编码\u003c/th\u003e\u003cth\u003e规则\u003c/th\u003e\u003cth\u003e自同步\u003c/th\u003e\u003cth\u003e浪费带宽\u003c/th\u003e\u003cth\u003e抗干扰\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"编码\"\u003e\u003cstrong\u003e归零 RZ\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"规则\"\u003e高=1、低=0，\u003cstrong\u003e每个码元中间跳回零\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"自同步\"\u003e✅ 有\u003c/td\u003e\u003ctd data-label=\"浪费带宽\"\u003e浪费\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e弱\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"编码\"\u003e\u003cstrong\u003e非归零 NRZ\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"规则\"\u003e高=1、低=0，\u003cstrong\u003e不归零\u003c/strong\u003e，整周期传数据\u003c/td\u003e\u003ctd data-label=\"自同步\"\u003e❌ 无\u003c/td\u003e\u003ctd data-label=\"浪费带宽\"\u003e无\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e弱\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"编码\"\u003e\u003cstrong\u003e反向非归零 NRZI\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"规则\"\u003e\u003cstrong\u003e码元起始处有无跳变\u003c/strong\u003e表示数据：无跳变=1，有跳变=0\u003c/td\u003e\u003ctd data-label=\"自同步\"\u003e需加冗余位\u003c/td\u003e\u003ctd data-label=\"浪费带宽\"\u003e不太浪费\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"编码\"\u003e\u003cstrong\u003e曼彻斯特\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"规则\"\u003e每个码元\u003cstrong\u003e中间必跳变\u003c/strong\u003e，跳变\u003cstrong\u003e同时表示数据和时钟\u003c/strong\u003e：下降沿=1、上升沿=0\u003c/td\u003e\u003ctd data-label=\"自同步\"\u003e✅ 有\u003c/td\u003e\u003ctd data-label=\"浪费带宽\"\u003e浪费\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"编码\"\u003e\u003cstrong\u003e差分曼彻斯特\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"规则\"\u003e中间\u003cstrong\u003e必跳变但只做时钟\u003c/strong\u003e；数据看\u003cstrong\u003e起始处有无跳变\u003c/strong\u003e：无跳变=1，有跳变=0\u003c/td\u003e\u003ctd data-label=\"自同步\"\u003e✅ 有\u003c/td\u003e\u003ctd data-label=\"浪费带宽\"\u003e浪费\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e记忆口诀\u003c/strong\u003e：\u003c/p\u003e\u003cul\u003e\u003cli\u003eRZ：\u003cstrong\u003e回零\u003c/strong\u003e，自同步靠归零的跳变。\u003c/li\u003e\u003cli\u003eNRZ：\u003cstrong\u003e不归零\u003c/strong\u003e，效率最高，但没时钟要额外同步线。\u003c/li\u003e\u003cli\u003eNRZI：\u003cstrong\u003e看起始跳不跳\u003c/strong\u003e，USB 2.0 用。\u003c/li\u003e\u003cli\u003e曼彻斯特：\u003cstrong\u003e中间跳变既当时钟又当数据\u003c/strong\u003e，传统以太网用。\u003c/li\u003e\u003cli\u003e差分曼彻斯特：\u003cstrong\u003e中间跳变只当时钟\u003c/strong\u003e，数据看起始，抗干扰更强，令牌环用。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e编码效率\u003c/strong\u003e：NRZ 最高（整周期都用上），RZ / 曼彻斯特 / 差分曼彻斯特都浪费带宽（因为要跳变）。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.3 模拟数据 → 数字信号：PCM 三步\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003e① 采样：周期性采样，从时间连续 → 时间离散\n② 量化：幅值按预设分级取整，从连续 → 离散数值\n③ 编码：量化后的整数 → 二进制码\u003c/code\u003e\u003c/pre\u003e\u003cp\u003e\u003cstrong\u003e采样定理\u003c/strong\u003e：采样频率 ≥ 信号最高频率的 \u003cstrong\u003e2 倍\u003c/strong\u003e。\u003c/p\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.4 数字数据 → 模拟信号（四种调制）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e调制\u003c/th\u003e\u003cth\u003e改变载波的什么\u003c/th\u003e\u003cth\u003e抗干扰\u003c/th\u003e\u003cth\u003e备注\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"调制\"\u003e\u003cstrong\u003eASK\u003c/strong\u003e 幅移键控\u003c/td\u003e\u003ctd data-label=\"改变载波的什么\"\u003e振幅\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e差\u003c/td\u003e\u003ctd data-label=\"备注\"\u003e容易实现，有载波=1 无载波=0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"调制\"\u003e\u003cstrong\u003eFSK\u003c/strong\u003e 频移键控\u003c/td\u003e\u003ctd data-label=\"改变载波的什么\"\u003e频率\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e\u003cstrong\u003e强\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"备注\"\u003e容易实现\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"调制\"\u003e\u003cstrong\u003ePSK\u003c/strong\u003e 相移键控\u003c/td\u003e\u003ctd data-label=\"改变载波的什么\"\u003e相位\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003ctd data-label=\"备注\"\u003e相位 0 和 π，\u003cstrong\u003e绝对调相\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"调制\"\u003e\u003cstrong\u003eDPSK\u003c/strong\u003e 差分相移键控\u003c/td\u003e\u003ctd data-label=\"改变载波的什么\"\u003e相位\u003cstrong\u003e差\u003c/strong\u003e\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003ctd data-label=\"备注\"\u003e\u003cstrong\u003e相对调相\u003c/strong\u003e，看当前与前一码元的相位差\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"调制\"\u003e\u003cstrong\u003eQAM\u003c/strong\u003e 正交幅度调制\u003c/td\u003e\u003ctd data-label=\"改变载波的什么\"\u003e振幅\u003cstrong\u003e和\u003c/strong\u003e相位\u003c/td\u003e\u003ctd data-label=\"抗干扰\"\u003e强\u003c/td\u003e\u003ctd data-label=\"备注\"\u003e频谱效率最高\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.5 QAM 的进制计算（必考）\u003c/h4\u003e\u003cpre class=\"code\"\u003e\u003ccode\u003eQAM 的数据传输速率 R = B · log₂(m × n)   (b/s)\u003c/code\u003e\u003c/pre\u003e\u003cul\u003e\u003cli\u003eB：波特率\u003c/li\u003e\u003cli\u003em：相位数\u003c/li\u003e\u003cli\u003en：每个相位的振幅数\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e星座图规律\u003c/strong\u003e：\u003c/p\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e状态数\u003c/th\u003e\u003cth\u003e每码元比特\u003c/th\u003e\u003cth\u003e每路振幅数\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"类型\"\u003eQAM-16\u003c/td\u003e\u003ctd data-label=\"状态数\"\u003e16\u003c/td\u003e\u003ctd data-label=\"每码元比特\"\u003e4\u003c/td\u003e\u003ctd data-label=\"每路振幅数\"\u003e4（4×4）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"类型\"\u003eQAM-64\u003c/td\u003e\u003ctd data-label=\"状态数\"\u003e64\u003c/td\u003e\u003ctd data-label=\"每码元比特\"\u003e6\u003c/td\u003e\u003ctd data-label=\"每路振幅数\"\u003e8（8×8）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"类型\"\u003eQAM-256\u003c/td\u003e\u003ctd data-label=\"状态数\"\u003e256\u003c/td\u003e\u003ctd data-label=\"每码元比特\"\u003e8\u003c/td\u003e\u003ctd data-label=\"每路振幅数\"\u003e16（16×16）\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e记法：QAM-\u003cstrong\u003eN\u003c/strong\u003e 就是 N 种状态，每码元带 log₂N 比特。QAM-16 = 4 位，QAM-64 = 6 位。\u003c/blockquote\u003e\u003ch4 class=\"cardsec__sub\"\u003e4.6 模拟数据 → 模拟信号\u003c/h4\u003e\u003cp\u003e传统电话：语音信号通过双绞线直接传到本地交换机。\u003c/p\u003e\u003cp\u003e需经高频信道（无线电波）时：用 \u003cstrong\u003eAM / FM / PM\u003c/strong\u003e 把信号加载到高频载波上。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-6","section":"5. 传输介质","html":"\u003ch4 class=\"cardsec__sub\"\u003e5.1 两大类\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e导向\u003c/strong\u003e传输介质\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e电磁波被约束沿固体介质传播\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e双绞线、同轴电缆、光纤\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e非导向\u003c/strong\u003e传输介质\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e电磁波在自由空间传播（无线传输）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e空气、真空、海水\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.2 双绞线\u003c/h4\u003e\u003cul\u003e\u003cli\u003e结构：两根\u003cstrong\u003e相互绝缘\u003c/strong\u003e、按规则\u003cstrong\u003e绞合\u003c/strong\u003e的铜导线。绞合的目的是\u003cstrong\u003e减少相邻导线间的电磁干扰\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eSTP\u003c/strong\u003e（屏蔽双绞线）：外加金属丝编织屏蔽层。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eUTP\u003c/strong\u003e（非屏蔽双绞线）：无屏蔽层。\u003c/li\u003e\u003cli\u003e价格低廉，模拟/数字都能传，距离几千米至数十千米。\u003c/li\u003e\u003cli\u003e距离太远时：模拟传输用\u003cstrong\u003e放大器\u003c/strong\u003e，数字传输用\u003cstrong\u003e中继器\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.3 同轴电缆\u003c/h4\u003e\u003cul\u003e\u003cli\u003e结构：内导体 + 绝缘层 + 外导体屏蔽层 + 绝缘保护套层。\u003c/li\u003e\u003cli\u003e分基带同轴电缆和宽带同轴电缆（\u003cstrong\u003e宽带\u003c/strong\u003e用于有线电视）。\u003c/li\u003e\u003cli\u003e抗干扰性能好（外导体屏蔽），适合较高速率。\u003c/li\u003e\u003cli\u003e现在局域网基本都用双绞线了。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.4 光纤（\u003cstrong\u003e必考单模/多模\u003c/strong\u003e）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e原理：光脉冲有=1，无=0。可见光频率约 10¹⁴ Hz，带宽潜力极大。\u003c/li\u003e\u003cli\u003e结构：纤芯（高折射率）+ 包层（低折射率）。光在纤芯-包层界面\u003cstrong\u003e全反射\u003c/strong\u003e前进。\u003c/li\u003e\u003c/ul\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e纤芯直径\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e较粗（50～100 μm）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e极细\u003c/strong\u003e（接近光波波长）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e传播方式\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e多条不同角度入射的光线\u003cstrong\u003e全反射\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e只允许\u003cstrong\u003e单一模式\u003c/strong\u003e，几乎无反射\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e光源\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e发光二极管（LED）\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e半导体激光器\u003c/strong\u003e（定向性优良）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e损耗\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e较大\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e很小\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e距离\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e\u003cstrong\u003e短距离\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e\u003cstrong\u003e远距离\u003c/strong\u003e（数十千米无中继）\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e成本\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e低\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e高\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003e光纤的四大优点\u003c/strong\u003e：\u003c/p\u003e\u003col\u003e\u003cli\u003e传输损耗小，中继距离长，远距离特别经济。\u003c/li\u003e\u003cli\u003e抗雷电和电磁干扰强。\u003c/li\u003e\u003cli\u003e无串音干扰，保密性好，不易被窃听。\u003c/li\u003e\u003cli\u003e体积小、重量轻。\u003c/li\u003e\u003c/ol\u003e\u003ch4 class=\"cardsec__sub\"\u003e5.5 无线传输介质\u003c/h4\u003e\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e无线电波\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e穿透力强、传播远、\u003cstrong\u003e全向扩散\u003c/strong\u003e，接收端不用对准\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e微波\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e高频段、带宽大、\u003cstrong\u003e需视距\u003c/strong\u003e、强指向性，地面传输要中继站\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e卫星通信\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e用同步卫星做中继；容量大、覆盖广、距离远；\u003cstrong\u003e保密性差、传播时延大\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e红外线 / 激光\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e需视距、强指向性、短距离点对点；\u003cstrong\u003e不能穿墙\u003c/strong\u003e、易被障碍物阻挡\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003chr\u003e"},{"id":"sec-7","section":"6. 物理层接口的四个特性（必考）","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e机械特性\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e接线器的\u003cstrong\u003e形状、尺寸、引脚数目和排列\u003c/strong\u003e、固定和锁定装置\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e长什么样\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e电气特性\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e各线路的\u003cstrong\u003e电压范围、传输速率、距离限制\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e电压多少\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e功能特性\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e每条线路上\u003cstrong\u003e特定电平代表什么意义\u003c/strong\u003e，各线路的具体功能\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e这跟线干什么\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e\u003cstrong\u003e过程特性\u003c/strong\u003e（规程特性）\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e各种功能事件发生的\u003cstrong\u003e顺序和时序关系\u003c/strong\u003e\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e先后顺序\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cblockquote\u003e记忆：\u003cstrong\u003e机（形状）—电（电压）—功（意义）—过（顺序）\u003c/strong\u003e。\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003e物理层的核心任务\u003c/strong\u003e：屏蔽底层差异，让数据链路层感知不到介质差异。\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e注意\u003c/strong\u003e：传输介质本身\u003cstrong\u003e不属于\u003c/strong\u003e物理层协议范畴（在物理层之下）。\u003c/p\u003e\u003chr\u003e"},{"id":"sec-8","section":"7. 物理层设备","html":"\u003ch4 class=\"cardsec__sub\"\u003e7.1 中继器（Repeater）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e功能：\u003cstrong\u003e整形、放大、转发\u003c/strong\u003e信号，消除长距离传输后的失真和衰减。\u003c/li\u003e\u003cli\u003e原理：\u003cstrong\u003e信号再生\u003c/strong\u003e，不是简单放大衰减的信号。\u003c/li\u003e\u003cli\u003e端口数：\u003cstrong\u003e2 个\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e连接的两端属于\u003cstrong\u003e同一局域网的不同网段\u003c/strong\u003e（不是不同子网）。\u003c/li\u003e\u003cli\u003e故障影响：中继器坏了 → \u003cstrong\u003e相邻两个网段\u003c/strong\u003e都不通。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e5-4-3 规则\u003c/strong\u003e：10Base-5 以太网中，串联中继器不超过 \u003cstrong\u003e4 个\u003c/strong\u003e，5 段电缆中只有 \u003cstrong\u003e3 段\u003c/strong\u003e可挂主机，另 2 段只作扩展。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.2 集线器（Hub）\u003c/h4\u003e\u003cul\u003e\u003cli\u003e本质：\u003cstrong\u003e多端口的中继器\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e功能：整形放大后转发到\u003cstrong\u003e除输入端口外的所有\u003c/strong\u003e工作端口。\u003c/li\u003e\u003cli\u003e无定向传送能力 → \u003cstrong\u003e信息广播到所有端口\u003c/strong\u003e，标准\u003cstrong\u003e共享式设备\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e冲突：多端口同时发 → 冲突，所有相关帧传输失败。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e不具备缓存能力\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e组网：物理上是\u003cstrong\u003e星形\u003c/strong\u003e，逻辑上仍是\u003cstrong\u003e总线形\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e只能工作在半双工模式。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e不能分割冲突域\u003c/strong\u003e：所有端口属于\u003cstrong\u003e同一个冲突域\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e带宽共享：10 Mb/s 集线器接 8 台机器，同时工作时每台平均 \u003cstrong\u003e10/8 = 1.25 Mb/s\u003c/strong\u003e。\u003c/li\u003e\u003c/ul\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.3 中继器/集线器 vs 其他设备（对比）\u003c/h4\u003e\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e设备\u003c/th\u003e\u003cth\u003e工作层\u003c/th\u003e\u003cth\u003e能否分割冲突域\u003c/th\u003e\u003cth\u003e能否分割广播域\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd data-label=\"设备\"\u003e中继器\u003c/td\u003e\u003ctd data-label=\"工作层\"\u003e物理层\u003c/td\u003e\u003ctd data-label=\"能否分割冲突域\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"能否分割广播域\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"设备\"\u003e集线器\u003c/td\u003e\u003ctd data-label=\"工作层\"\u003e物理层\u003c/td\u003e\u003ctd data-label=\"能否分割冲突域\"\u003e❌\u003c/td\u003e\u003ctd data-label=\"能否分割广播域\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"设备\"\u003e网桥 / 交换机\u003c/td\u003e\u003ctd data-label=\"工作层\"\u003e数据链路层\u003c/td\u003e\u003ctd data-label=\"能否分割冲突域\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"能否分割广播域\"\u003e❌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd data-label=\"设备\"\u003e路由器\u003c/td\u003e\u003ctd data-label=\"工作层\"\u003e网络层\u003c/td\u003e\u003ctd data-label=\"能否分割冲突域\"\u003e✅\u003c/td\u003e\u003ctd data-label=\"能否分割广播域\"\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4 class=\"cardsec__sub\"\u003e7.4 两个坑\u003c/h4\u003e\u003col\u003e\u003cli\u003e\u003cstrong\u003e中继器/集线器连接不同链路层协议的网段会出问题\u003c/strong\u003e——它们只工作在物理层，无法对帧解封/重封装，只做无差别转发。\u003c/li\u003e\u003cli\u003e\u003cstrong\u003e速率不同的网段用集线器连接 → 整个网络按低速工作\u003c/strong\u003e。例：10 Mb/s 和 10/100 Mb/s 两段用集线器连 → 全网 10 Mb/s。\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-9","section":"8. 概念辨析（易错 6 组）","html":"\u003cp\u003e\u003cstrong\u003e① 波特率 vs 比特率\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e波特率（码元速率/调制速率）：每秒传\u003cstrong\u003e码元\u003c/strong\u003e数，单位 Baud，\u003cstrong\u003e与进制无关\u003c/strong\u003e。\u003c/li\u003e\u003cli\u003e比特率（信息速率）：每秒传\u003cstrong\u003e比特\u003c/strong\u003e数，单位 b/s。\u003c/li\u003e\u003cli\u003e关系：\u003ccode\u003e比特率 = 波特率 × log₂V\u003c/code\u003e。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e② 带宽的两个含义\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e模拟通信：信号\u003cstrong\u003e频率范围\u003c/strong\u003e，单位 Hz。\u003c/li\u003e\u003cli\u003e数字通信/计算机网络：\u003cstrong\u003e最大数据传输速率\u003c/strong\u003e，单位 b/s。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e③ 奈氏 vs 香农\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e奈氏：理想无噪声，限\u003cstrong\u003e码元速率\u003c/strong\u003e，看 V。\u003c/li\u003e\u003cli\u003e香农：有噪声，限\u003cstrong\u003e信息速率\u003c/strong\u003e，看 S/N。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e④ 编码 vs 调制\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e编码：数据 → \u003cstrong\u003e数字\u003c/strong\u003e信号。\u003c/li\u003e\u003cli\u003e调制：数据 → \u003cstrong\u003e模拟\u003c/strong\u003e信号。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e⑤ 曼彻斯特 vs 差分曼彻斯特\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e曼彻斯特：中间跳变\u003cstrong\u003e既表示数据又当时钟\u003c/strong\u003e（下降沿=1，上升沿=0）。\u003c/li\u003e\u003cli\u003e差分曼彻斯特：中间跳变\u003cstrong\u003e只当时钟\u003c/strong\u003e，数据看\u003cstrong\u003e起始处有无跳变\u003c/strong\u003e（无跳变=1，有跳变=0）。\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e⑥ 单模 vs 多模\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e单模：细芯、激光、远距离、损耗小、贵。\u003c/li\u003e\u003cli\u003e多模：粗芯、LED、短距离、损耗大、便宜。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-10","section":"9. 自测清单（能全答出来就够做题了）","html":"\u003col\u003e\u003cli\u003e数据、信号、码元分别是什么？码元宽度指什么？\u003c/li\u003e\u003cli\u003e1 码元能携带几比特由什么决定？\u003c/li\u003e\u003cli\u003e串行传输和并行传输分别适用于什么场景？\u003c/li\u003e\u003cli\u003e单向、半双工、全双工分别需要几个信道？\u003c/li\u003e\u003cli\u003e奈氏准则的公式是什么？2W 是怎么来的？\u003c/li\u003e\u003cli\u003e奈氏准则限制了码元速率还是信息速率？\u003c/li\u003e\u003cli\u003e香农定理的公式是什么？S/N 用什么形式代入？\u003c/li\u003e\u003cli\u003e30 dB 对应的 S/N 是多少？\u003c/li\u003e\u003cli\u003e同时给带宽、码元种类数、信噪比时，极限速率取什么？\u003c/li\u003e\u003cli\u003e为什么说「奈氏管码元，香农管信息」？\u003c/li\u003e\u003cli\u003e编码和调制的区别是什么？\u003c/li\u003e\u003cli\u003e五种数字编码各自的自同步能力和带宽效率如何？\u003c/li\u003e\u003cli\u003e曼彻斯特编码的中间跳变表示什么？差分曼彻斯特呢？\u003c/li\u003e\u003cli\u003ePCM 的三步是什么？采样频率的下限是什么？\u003c/li\u003e\u003cli\u003eASK/FSK/PSK/DPSK/QAM 分别改变载波的什么？\u003c/li\u003e\u003cli\u003eQAM-16 每码元带几比特？QAM-64 呢？\u003c/li\u003e\u003cli\u003e双绞线为什么要绞合？\u003c/li\u003e\u003cli\u003e单模光纤和多模光纤的五个区别？\u003c/li\u003e\u003cli\u003e光纤的四大优点？\u003c/li\u003e\u003cli\u003e微波和红外线都需要什么条件？\u003c/li\u003e\u003cli\u003e物理层接口的四个特性分别规定什么？\u003c/li\u003e\u003cli\u003e传输介质属于物理层吗？\u003c/li\u003e\u003cli\u003e中继器和集线器分别有几个端口？能否分割冲突域？\u003c/li\u003e\u003cli\u003e集线器组网的物理拓扑和逻辑拓扑分别是什么？\u003c/li\u003e\u003cli\u003e5-4-3 规则是什么？\u003c/li\u003e\u003cli\u003e10 Mb/s 集线器接 8 台机器，每台平均带宽多少？\u003c/li\u003e\u003cli\u003e为什么中继器连接不同链路层协议的网段会出问题？\u003c/li\u003e\u003c/ol\u003e\u003chr\u003e"},{"id":"sec-11","section":"10. 已知未覆盖 / 后续补充","html":"\u003cul\u003e\u003cli\u003e本章的\u003cstrong\u003e电路交换、报文交换、分组交换\u003c/strong\u003e在 1.1.4 节，\u003cstrong\u003e数据报与虚电路\u003c/strong\u003e在 4.1.3 节，本章不重复。\u003c/li\u003e\u003cli\u003e2.1.4 / 2.2.3 / 2.3.3 的习题与解析未逐题录入，做题时对照本卡即可。\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e"},{"id":"sec-12","section":"附：本章计算题模板速查","html":"\u003cdiv class=\"mini-list\"\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e奈氏求极限速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eR = 2W·log₂V\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003eV 是码元种类数，不是进制数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e香农求极限速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eR = W·log₂(1+S/N)\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003edB 必须先换成比值\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e两者都算\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003e取 min\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e别只算一个\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003e波特率→比特率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eR = B·log₂V\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e—\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003eQAM 求速率\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eR = B·log₂(m×n)\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003em 是相位数，n 是振幅数\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"mini\"\u003e\u003cdiv class=\"mini__k\"\u003edB→比值\u003c/div\u003e\u003cdiv class=\"mini__v\"\u003eS/N = 10^(dB/10)\u003cspan class=\"mini__sep\"\u003e·\u003c/span\u003e30dB=1000，20dB=100\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e"}]}]}]},"sources":{"base":{"file":"knowledge.json","count":237},"parts":[{"file":"_parts/ch1ch2.json","count":90},{"file":"_parts/ch3.json","count":64},{"file":"_parts/ch3_3_1.json","count":31},{"file":"_parts/ch3_3_2.json","count":28},{"file":"_parts/ch3_3_3.json","count":5},{"file":"_parts/ch4.json","count":38},{"file":"_parts/ch5.json","count":45},{"file":"_parts/net_ch1.json","count":40},{"file":"_parts/net_ch2.json","count":45}],"merged":322,"conflicts":[{"id":"os-ch1-1.1-001","from":["knowledge.json","_parts/ch1ch2.json"],"winner":"_parts/ch1ch2.json"},{"id":"os-ch1-1.1-002","from":["knowledge.json","_parts/ch1ch2.json"],"winner":"_parts/ch1ch2.json"},{"id":"os-ch1-1.1-003","from":["knowledge.json","_parts/ch1ch2.json"],"winner":"_parts/ch1ch2.json"},{"id":"os-ch1-1.1-004","from":["knowledge.json","_par   const el = {

    scrim: $('scrim'),
    expandAll: $('btn-expand-all'),
    collapseAll: $('btn-collapse-all'),
    footer: $('footer'),
    live: $('live'),
    // —— 背诵记忆 ——
    drillRound: $('drill-round'),
    drillStat: $('drill-stat'),
    drillRate: $('drill-rate'),

    settle: $('settle'),

    settleClose: $('btn-settle-close'),
    drawerProgress: $('drawer-progress'),

    importBtn: $('btn-import'),
    fileImport: $('file-import'),
    // —— 考点卡 ——
    cardsChapter: $('cards-chapter'),

    masteryChapter: $('mastery-chapter'),

    masteryMeta: $('mastery-meta'),

  /* ---------------- 小工具 ---------------- */
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /** 把搜索词按空白切成多个关键词（支持「死锁 PV」多词） */
  function splitQuery(q) {
    return q.trim().split(/\s+/).filter(Boolean);
  }

  /** 文本是否命中所有关键词 */
  function matchesAll(text, terms) {
    return terms.every((t) => text.includes(t));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  /**
   * 安全高亮：先把原文整体转义，再对已转义文本插入 <mark>。
   * 因为关键词也已转义，不会破坏 HTML 结构（无 XSS 风险）。
   */
  function highlight(text, terms) {
    const safe = escapeHtml(text);
    if (!terms.length) return safe;
    const pattern = terms
      .slice()
      .sort((a, b) => b.length - a.length)
      .map((t) => escapeRegExp(escapeHtml(t)))
      .join('|');
    if (!pattern) return safe;
    return safe.replace(new RegExp(`(${pattern})`, 'gi'), '<mark class="hl">$1</mark>');
  }

  /**
   * 把答案文本转成安全的 HTML：
   *   · 先 escapeHtml，保证没有任何注入风险；
   *   · 再把 **重点** 转成 <strong>（内容节点用这套轻量标记强调关键词）；
   *   · 换行交给 CSS 的 white-space: pre-wrap，不额外处理。
   * 未闭合的 ** 原样保留，不吞字。
   */
  function richText(text) {
    let s = escapeHtml(normalize(text));
    // 成对的 **重点** → <strong>
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    // 源数据里偶有未成对的 **（如「创建 PCB**；」）→ 直接去掉，避免页面上出现裸星号
    s = s.replace(/\*\*/g, '');
    return s;
  }

  /* ---------------- 答案排版（2026-10-25 重做） ----------------
     源数据三种写法混在一起：
       第1、2章：【结论】xxx + ①②③ 圈号，** 加粗
       第3、4章：【结论】xxx + 数字编号
       第5章  ：1. 2. 3. 编号 + 「背诵要点：」
     以前整段 pre-wrap 直接糊上去，手机上就是一大块密不透风的字。
     现在按行切成：小标题块 / 圈号列表 / 数字列表 / 项目符号 / 易错点提示。
     只用白名单标签，文本一律 escapeHtml，不做任何原文 innerHTML 直插。
     ------------------------------------------------------------ */

  // 圈号 → 用于判断一行是否以圈号打头
  const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

  /** 行内格式化：转义（或搜索高亮）+ ** → <strong> + 清掉未配对星号 */
  function fmtInline(str, terms) {
    let s = terms && terms.length ? highlight(normalize(str), terms) : escapeHtml(normalize(str));
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*\*/g, '');
    return s;
  }

  /** 一段正文若以圈号打头，切成 <ul>；否则原样 */
  function fmtBody(str, terms) {
    const t = normalize(str).trim();
    if (!t) return '';
    if (CIRCLED.includes(t.charAt(0))) {
      const parts = t.split(new RegExp(`(?=[${CIRCLED}])`)).map((x) => x.trim()).filter(Boolean);
      if (parts.length > 1) {
        return `<ul class="ans-ul is-circled">${parts.map((p) => `<li>${fmtInline(p, terms)}</li>`).join('')}</ul>`;
      }
    }
    return fmtInline(t, terms);
  }

  /** 答案文本 → 结构化 HTML（按行切块，不再整段 pre-wrap） */
  function richAnswer(text, terms) {
    const lines = normalize(text)
      .split(/\r?\n/)
      .map((s) => s.trim())
      .filter(Boolean);
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      // ① 【小标题】正文
      const tag = line.match(/^【([^】]{1,16})】\s*(.*)$/);
      if (tag) {
        out.push(
          `<div class="ans-sec"><span class="ans-tag">${escapeHtml(tag[1])}</span>` +
          `<div class="ans-sec__body">${fmtBody(tag[2], terms)}</div></div>`
        );
        i += 1;
        continue;
      }

      // ② 易错点 / 背诵要点 / 注意 等提示行
      const warn = line.match(/^(易错点|易错|注意|提醒|背诵要点|口诀|判别|技巧|小结)[:：]\s*(.*)$/);
      if (warn) {
        out.push(
          `<div class="ans-warn"><span class="ans-warn__k">${escapeHtml(warn[1])}</span>` +
          `<div class="ans-warn__v">${fmtBody(warn[2], terms)}</div></div>`
        );
        i += 1;
        continue;
      }

      // ③ 圈号打头的整行（①②③…）
      if (CIRCLED.includes(line.charAt(0))) {
        const parts = line.split(new RegExp(`(?=[${CIRCLED}])`)).map((x) => x.trim()).filter(Boolean);
        out.push(`<ul class="ans-ul is-circled">${parts.map((p) => `<li>${fmtInline(p, terms)}</li>`).join('')}</ul>`);
        i += 1;
        continue;
      }

      // ④ 连续的数字编号行 → <ol>
      if (/^\d+[.、)]\s*\S/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+[.、)]\s*\S/.test(lines[i])) {
          items.push(fmtInline(lines[i].replace(/^\d+[.、)]\s*/, ''), terms));
          i += 1;
        }
        out.push(`<ol class="ans-ol">${items.map((t) => `<li>${t}</li>`).join('')}</ol>`);
        continue;
      }

      // ⑤ 连续的 · / • / - 项目符号行 → <ul>
      if (/^[·•\-—]\s*\S/.test(line)) {
        const items = [];
        while (i < lines.length && /^[·•\-—]\s*\S/.test(lines[i])) {
          items.push(fmtInline(lines[i].replace(/^[·•\-—]\s*/, ''), terms));
          i += 1;
        }
        out.push(`<ul class="ans-ul">${items.map((t) => `<li>${t}</li>`).join('')}</ul>`);
        continue;
      }

      // ⑥ 普通段落（源数据里偶有未闭合的「【」，直接去掉，别让它孤零零挂在行首）
      out.push(`<p class="ans-p">${fmtInline(line.replace(/^【/, ''), terms)}</p>`);
      i += 1;
    }

    return out.join('') || '<p class="ans-p"></p>';
  }

  function levelInfo(level) {
    return LEVELS[level] || { label: '未分级', short: '?', icon: '·', order: 9 };
  }

  function levelBadge(level, opts) {
    const info = levelInfo(level);
    const text = opts && opts.short ? info.short : info.label;
    return `<span class="lvl lvl--${escapeHtml(level)}">${info.icon} ${escapeHtml(text)}</span>`;
  }

  function announce(msg) {
    el.live.textContent = '';
    // 稍后再写，保证读屏器重复播报同样的文字
    window.setTimeout(() => { el.live.textContent = msg; }, 30);
  }

  function normalize(s) {
    return String(s == null ? '' : s);
  }

  /* ---------------- 数据加载 ---------------- */
  /**
   * 读取「内联数据块」：
   *   <script type="application/json" id="inline-data"> 里放 { knowledge:{items:[…]}, chapters:{…}, theme? }
   *   —— 这是 standalone.html（单文件版）用的机制：数据、样式、脚本全在一个 HTML 里，
   *   双击即开、发微信/QQ 给手机也能用，不需要服务器。
   *   普通版本（index.html）没有这个块，返回 null，自动回落到 fetch。
   */
  function readInlineData() {
    const node = document.getElementById('inline-data');
    if (!node) return null;
    const raw = node.textContent || '';
    if (!raw.trim()) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      const err = new Error('standalone.html 内联数据块损坏：' + e.message);
      err.kind = 'json';
      err.url = 'index.html#inline-data';
      throw err;
    }
  }

  /** 是否有内联数据（决定后续是否需要 fetch 分片/目录） */
  let hasInline = false;

  /**
   * fetch JSON，并把「为什么失败」翻译成人话。
   * 注意：不吞错误——真实原因会原样抛给 showError() 展示。
   * cache: 'no-store' —— 必须绕开 HTTP 缓存：
   *   内容节点新增分片时，旧的 404 响应若被缓存住，浏览器就不会再去取，
   *   结果「分片少加载一半」而且极难排查。
   */
  async function fetchJson(url, opts) {
    const options = opts || {};
    const res = await fetch(url, { cache: 'no-store' });
    if (res.status === 404 && options.optional) return null; // 可选数据源缺失是正常情况
    if (!res.ok) {
      const err = new Error(`${url} → HTTP ${res.status} ${res.statusText || ''}`.trim());
      err.kind = 'http';
      err.code = res.status;
      err.url = url;
      throw err;
    }
    try {
      return await res.json();
    } catch (e) {
      const err = new Error(`${url} → JSON 解析失败：${e.message}`);
      err.kind = 'json';
      err.url = url;
      throw err;
    }
  }

  /**
   * 多数据源合并：
   *   1. data/knowledge.json 的 items（基线，必需）
   *   2. data/_parts/*.json 的 items（内容节点的分片，可选，缺失不报错）
   *      · 首选 data/_parts/index.json（{"parts":["ch3_3_1.json", ...]}）—— 最可靠
   *      · 没有 index.json 时，按下面的候选名逐个尝试（404 静默忽略）
   *   合并规则：按 id 去重；同 id 时 status=final 覆盖 draft；同级时后加载的（分片）覆盖先加载的。
   * 这样内容节点往 _parts 里丢一个新文件，主人刷新页面就能看到，不需要改任何代码。
   *
   * ⚠️ 兜底候选必须覆盖实际用到的命名（ch3_3_1.json 这种带下划线的也常见）。
   *    候选清单只是「无 index 时」的降级方案；正式做法是在 _parts 下放一个 index.json。
   */
  // 无 data/_parts/index.json 时的兜底清单。
  // ⚠ 必须与 data/_parts/ 里真实存在的文件一一对应：多写一个占位符，
  //    每次启动控制台就多一条 404（旧版列了 ch6–ch9 等 12 个不存在的文件）。
  const PART_URLS = [
    'data/_parts/ch1ch2.json',
    'data/_parts/ch3.json',
    'data/_parts/ch3_3_1.json',
    'data/_parts/ch3_3_2.json',
    'data/_parts/ch3_3_3.json',
    'data/_parts/ch4.json',
    'data/_parts/ch5.json',
    // —— 计算机网络（subject: net）——
    'data/_parts/net_ch1.json',
    'data/_parts/net_ch2.json',
  ];

  async function loadPartIndex() {
    // 先看 index.json 是否给了清单
    let manifest = null;
    try {
      manifest = await fetchJson('data/_parts/index.json', { optional: true });
    } catch (e) { manifest = null; }
    if (manifest && Array.isArray(manifest.parts) && manifest.parts.length) {
      return manifest.parts.map((p) => 'data/_parts/' + String(p).replace(/^.*[\\/]/, ''));
    }
    return null;
  }

  async function loadParts() {
    const urls = (await loadPartIndex()) || PART_URLS;
    const results = await Promise.all(urls.map(async (u) => {
      try {
        const json = await fetchJson(u, { optional: true });
        return { url: u, json };
      } catch (e) {
        // 分片坏掉不应让整页崩掉：记录后继续
        console.warn('[408] 分片读取失败，已跳过：', u, e.message);
        return { url: u, json: null, error: e.message };
      }
    }));
    return results.filter((r) => r.json && Array.isArray(r.json.items));
  }

  /** 把一条原始数据规范化为内部结构（缺字段不崩） */
  function normalizeItem(raw) {
    // 兼容简写层级：chapter 缺失时可从 id 里兜底（os-ch3-3.2-001）
    const idMatch = /\bch(\d)\b/i.exec(normalize(raw.id));
    const chapter = normalize(raw.chapter) || (idMatch ? `第${idMatch[1]}章` : '未分类');
    return {
      id: normalize(raw.id),
      subject: normalize(raw.subject) || subjectOfId(raw.id),
